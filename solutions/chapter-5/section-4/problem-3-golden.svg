<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 633" width="720" height="633" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="633" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE STEP USES &#945;&#178; = &#945; + 1</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">F&#8345; = F&#8345;&#8331;&#8321; + F&#8345;&#8331;&#8322; &#8804; &#945;&#8319;&#8315;&#185; + &#945;&#8319;&#8315;&#178; = &#945;&#8319;&#8315;&#178;(&#945; + 1) = &#945;&#8319;&#8315;&#178; &#183; &#945;&#178; = &#945;&#8319;</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">Strong induction reaching back two steps, so two bases: F&#8320; = 1 &#8804; 1 = &#945;&#8304; and F&#8321; = 1 &#8804; &#945; &#8776; 1.618.</text>
  <rect x="22" y="118" width="336" height="280" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">F&#8345; against &#945;&#8319;</text><text x="56" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">n</text><text x="122" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">F&#8345;</text><text x="202" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">&#945;&#8319;</text><text x="290" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">F&#8345; / &#945;&#8319;</text><line x1="34" y1="170" x2="346" y2="170" stroke="#3b5b9b" stroke-width="1"/><rect x="34" y="173" width="312" height="18" fill="#fdf3e4"/><text x="56" y="186" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">0</text><text x="122" y="186" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">1</text><text x="202" y="186" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1.000</text><text x="290" y="186" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">1.0000</text><text x="56" y="204" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">1</text><text x="122" y="204" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">1</text><text x="202" y="204" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1.618</text><text x="290" y="204" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">0.6180</text><text x="56" y="222" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">2</text><text x="122" y="222" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">2</text><text x="202" y="222" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">2.618</text><text x="290" y="222" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">0.7639</text><text x="56" y="240" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">3</text><text x="122" y="240" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">3</text><text x="202" y="240" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">4.236</text><text x="290" y="240" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">0.7082</text><text x="56" y="258" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">4</text><text x="122" y="258" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">5</text><text x="202" y="258" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">6.854</text><text x="290" y="258" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">0.7295</text><text x="56" y="276" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">5</text><text x="122" y="276" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">8</text><text x="202" y="276" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">11.090</text><text x="290" y="276" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">0.7214</text><text x="56" y="294" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">6</text><text x="122" y="294" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">13</text><text x="202" y="294" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">17.944</text><text x="290" y="294" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">0.7245</text><text x="56" y="312" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">7</text><text x="122" y="312" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">21</text><text x="202" y="312" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">29.034</text><text x="290" y="312" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">0.7233</text><text x="56" y="330" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">8</text><text x="122" y="330" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">34</text><text x="202" y="330" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">46.979</text><text x="290" y="330" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">0.7237</text><text x="56" y="348" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">9</text><text x="122" y="348" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">55</text><text x="202" y="348" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">76.013</text><text x="290" y="348" font-size="11" fill="#555" text-anchor="middle" font-weight="normal">0.7236</text><text x="190.0" y="368" font-size="10.5" fill="#333" text-anchor="middle">F&#8320; = F&#8321; = 1, F&#8345;&#8330;&#8322; = F&#8345; + F&#8345;&#8330;&#8321;; equality only at n = 0,</text><text x="190.0" y="386" font-size="10.5" fill="#333" text-anchor="middle">and F&#8345; &#8804; &#945;&#8319; checked for n up to 2000</text><rect x="372" y="118" width="336" height="280" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the ratio F&#8345; / &#945;&#8319; settles at &#945;/&#8730;5 &#8776; 0.7236</text><line x1="414" y1="321.8" x2="692" y2="321.8" stroke="#eee"/><text x="409" y="325.3" font-size="9" fill="#999" text-anchor="end">0.6</text><line x1="414" y1="285.40000000000003" x2="692" y2="285.40000000000003" stroke="#eee"/><text x="409" y="288.90000000000003" font-size="9" fill="#999" text-anchor="end">0.7</text><line x1="414" y1="249.0" x2="692" y2="249.0" stroke="#eee"/><text x="409" y="252.5" font-size="9" fill="#999" text-anchor="end">0.8</text><line x1="414" y1="212.60000000000002" x2="692" y2="212.60000000000002" stroke="#eee"/><text x="409" y="216.10000000000002" font-size="9" fill="#999" text-anchor="end">0.9</text><line x1="414" y1="176.20000000000002" x2="692" y2="176.20000000000002" stroke="#eee"/><text x="409" y="179.70000000000002" font-size="9" fill="#999" text-anchor="end">1.0</text><line x1="414" y1="340" x2="692" y2="340" stroke="#888"/><text x="414.0" y="353" font-size="9.5" fill="#666" text-anchor="middle">0</text><text x="453.7142857142857" y="353" font-size="9.5" fill="#666" text-anchor="middle">2</text><text x="493.42857142857144" y="353" font-size="9.5" fill="#666" text-anchor="middle">4</text><text x="533.1428571428571" y="353" font-size="9.5" fill="#666" text-anchor="middle">6</text><text x="572.8571428571429" y="353" font-size="9.5" fill="#666" text-anchor="middle">8</text><text x="612.5714285714286" y="353" font-size="9.5" fill="#666" text-anchor="middle">10</text><text x="652.2857142857142" y="353" font-size="9.5" fill="#666" text-anchor="middle">12</text><text x="692.0" y="353" font-size="9.5" fill="#666" text-anchor="middle">14</text><line x1="414" y1="176.20000000000002" x2="692" y2="176.20000000000002" stroke="#9b2c2c" stroke-width="1.2" stroke-dasharray="4,3"/><text x="690" y="171.20000000000002" font-size="9.5" fill="#9b2c2c" text-anchor="end">bound F&#8345; / &#945;&#8319; = 1</text><line x1="414" y1="276.8071256190077" x2="692" y2="276.8071256190077" stroke="#1f6b34" stroke-width="1.1" stroke-dasharray="2,2"/><text x="690" y="290.8071256190077" font-size="9.5" fill="#1f6b34" text-anchor="end">&#945;/&#8730;5 &#8776; 0.7236</text><polyline points="414.0,176.2 433.9,315.2 453.7,262.1 473.6,282.4 493.4,274.7 513.3,277.6 533.1,276.5 553.0,276.9 572.9,276.8 592.7,276.8 612.6,276.8 632.4,276.8 652.3,276.8 672.1,276.8 692.0,276.8" fill="none" stroke="#3b5b9b" stroke-width="1.3"/><circle cx="414.0" cy="176.20000000000002" r="3.2" fill="#b06a10"/><circle cx="433.85714285714283" cy="315.2356280950383" r="3.2" fill="#3b5b9b"/><circle cx="453.7142857142857" cy="262.12874380992344" r="3.2" fill="#3b5b9b"/><circle cx="473.57142857142856" cy="282.41376857022965" r="3.2" fill="#3b5b9b"/><circle cx="493.42857142857144" cy="274.6655785744259" r="3.2" fill="#3b5b9b"/><circle cx="513.2857142857143" cy="277.62512380153106" r="3.2" fill="#3b5b9b"/><circle cx="533.1428571428571" cy="276.4946781160195" r="3.2" fill="#3b5b9b"/><circle cx="553.0" cy="276.92646994544924" r="3.2" fill="#3b5b9b"/><circle cx="572.8571428571429" cy="276.7615401426716" r="3.2" fill="#3b5b9b"/><circle cx="592.7142857142858" cy="276.8245377215748" r="3.2" fill="#3b5b9b"/><circle cx="612.5714285714286" cy="276.8004747876427" r="3.2" fill="#3b5b9b"/><circle cx="632.4285714285714" cy="276.80966601053575" r="3.2" fill="#3b5b9b"/><circle cx="652.2857142857142" cy="276.80615527578885" r="3.2" fill="#3b5b9b"/><circle cx="672.1428571428571" cy="276.8074962571366" r="3.2" fill="#3b5b9b"/><circle cx="692.0" cy="276.8069840478401" r="3.2" fill="#3b5b9b"/><text x="388" y="368" font-size="10.5" fill="#333">The ratio never exceeds 1 and touches it only at n = 0;</text><text x="388" y="386" font-size="10.5" fill="#333">it zigzags because &#946;&#8319;&#8314;&#185; alternates in sign.</text>
  <rect x="18" y="412" width="684" height="96" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="432" font-size="11.5" fill="#1f6b34" font-weight="bold">BINET'S FORMULA</text>
  <text x="40" y="458" font-size="11.5" fill="#333">With this indexing F&#8345; = (&#945;&#8319;&#8314;&#185; &#8722; &#946;&#8319;&#8314;&#185;)/&#8730;5 (checked for n up to 500). Since |&#946;| &lt; 1, F&#8345; is close to</text>
  <text x="40" y="478" font-size="11.5" fill="#333">(&#945;/&#8730;5)&#945;&#8319; &#8776; 0.7236 &#945;&#8319;, and in fact &#945;&#8319;&#8315;&#185; &#8804; F&#8345; &#8804; &#945;&#8319; for every n (checked to 2000).</text>
  <rect x="18" y="521" width="684" height="96" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="541" font-size="11.5" fill="#b06a10" font-weight="bold">&#945; IS THE BEST POSSIBLE BASE</text>
  <text x="40" y="567" font-size="11.5" fill="#333">For any c &lt; &#945;, eventually F&#8345; &gt; c&#8319;: first at n = 29 for c = 1.6, at n = 65 for c = 1.61, at n = 173 for c = 1.615.</text>
  <text x="40" y="587" font-size="11.5" fill="#333">The step needs c&#178; &#8805; c + 1, and the smallest positive such c is exactly &#945;.</text>
</svg>