<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 769" width="720" height="769" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="769" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="88" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE MISSING ROW</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">n = 4:&#160;&#160;1 + 5 + 9 + 13 + 17 = 45&#160;&#160;&#160;&#160;and&#160;&#160;&#160;&#160;2&#183;4&#178; + 3&#183;4 + 1 = 45</text>
  <text x="360" y="83" font-size="11.5" fill="#333" text-anchor="middle">The two columns agree for every n from 0 to 5000, and the identity is proved below.</text>
  <rect x="18" y="118" width="684" height="178" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/><rect x="18" y="118" width="684" height="32" rx="6" fill="#eef2fa"/><rect x="18" y="142" width="684" height="8" fill="#eef2fa"/><line x1="18" y1="150" x2="702" y2="150" stroke="#3b5b9b" stroke-width="1.2"/><text x="56" y="139" font-size="11.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">n</text><text x="280" y="139" font-size="11.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">&#8721;&#8305;&#8330;&#8320; 4j + 1</text><text x="560" y="139" font-size="11.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">2n&#178; + 3n + 1</text><line x1="96" y1="118" x2="96" y2="296" stroke="#ddd" stroke-width="1"/><line x1="440" y1="118" x2="440" y2="296" stroke="#ddd" stroke-width="1"/><text x="56" y="173" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">0</text><text x="280" y="173" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">1 = 1</text><text x="560" y="173" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">2&#183;0&#178; + 3&#183;0 + 1 = 1</text><rect x="19" y="181" width="682" height="26" fill="#fafafa"/><text x="56" y="199" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">1</text><text x="280" y="199" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">1 + 5 = 6</text><text x="560" y="199" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">2&#183;1&#178; + 3&#183;1 + 1 = 6</text><text x="56" y="225" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">2</text><text x="280" y="225" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">1 + 5 + 9 = 15</text><text x="560" y="225" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">2&#183;2&#178; + 3&#183;2 + 1 = 15</text><rect x="19" y="233" width="682" height="26" fill="#fafafa"/><text x="56" y="251" font-size="12" fill="#333" text-anchor="middle" font-weight="normal">3</text><text x="280" y="251" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">1 + 5 + 9 + 13 = 28</text><text x="560" y="251" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">2&#183;3&#178; + 3&#183;3 + 1 = 28</text><rect x="19" y="259" width="682" height="26" fill="#fff6e8"/><text x="56" y="277" font-size="12" fill="#b06a10" text-anchor="middle" font-weight="bold">4</text><text x="280" y="277" font-size="11.5" fill="#b06a10" text-anchor="middle" font-weight="bold">1 + 5 + 9 + 13 + 17 = 45</text><text x="560" y="277" font-size="11.5" fill="#b06a10" text-anchor="middle" font-weight="bold">2&#183;4&#178; + 3&#183;4 + 1 = 45</text><text x="695" y="277" font-size="9.5" fill="#b06a10" text-anchor="end" font-style="italic">new</text><rect x="18" y="312" width="684" height="150" rx="6" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="360" y="333" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">why the answer is (n+1)(2n+1): add the row to its own reverse</text><text x="204.0" y="364" font-size="13" fill="#3b5b9b" text-anchor="middle">1</text><text x="204.0" y="386" font-size="13" fill="#1f6b34" text-anchor="middle">17</text><line x1="182.0" y1="394" x2="226.0" y2="394" stroke="#bbb" stroke-width="1"/><text x="204.0" y="412" font-size="13.5" fill="#b06a10" text-anchor="middle" font-weight="bold">18</text><text x="282.0" y="364" font-size="13" fill="#3b5b9b" text-anchor="middle">5</text><text x="282.0" y="386" font-size="13" fill="#1f6b34" text-anchor="middle">13</text><line x1="260.0" y1="394" x2="304.0" y2="394" stroke="#bbb" stroke-width="1"/><text x="282.0" y="412" font-size="13.5" fill="#b06a10" text-anchor="middle" font-weight="bold">18</text><text x="360.0" y="364" font-size="13" fill="#3b5b9b" text-anchor="middle">9</text><text x="360.0" y="386" font-size="13" fill="#1f6b34" text-anchor="middle">9</text><line x1="338.0" y1="394" x2="382.0" y2="394" stroke="#bbb" stroke-width="1"/><text x="360.0" y="412" font-size="13.5" fill="#b06a10" text-anchor="middle" font-weight="bold">18</text><text x="438.0" y="364" font-size="13" fill="#3b5b9b" text-anchor="middle">13</text><text x="438.0" y="386" font-size="13" fill="#1f6b34" text-anchor="middle">5</text><line x1="416.0" y1="394" x2="460.0" y2="394" stroke="#bbb" stroke-width="1"/><text x="438.0" y="412" font-size="13.5" fill="#b06a10" text-anchor="middle" font-weight="bold">18</text><text x="516.0" y="364" font-size="13" fill="#3b5b9b" text-anchor="middle">17</text><text x="516.0" y="386" font-size="13" fill="#1f6b34" text-anchor="middle">1</text><line x1="494.0" y1="394" x2="538.0" y2="394" stroke="#bbb" stroke-width="1"/><text x="516.0" y="412" font-size="13.5" fill="#b06a10" text-anchor="middle" font-weight="bold">18</text><text x="360" y="436" font-size="11.5" fill="#333" text-anchor="middle">every column is 4n + 2, and there are n + 1 of them, so twice the sum is (n+1)(4n+2)</text><text x="360" y="454" font-size="12.5" fill="#b06a10" text-anchor="middle" font-weight="bold">sum = (n + 1)(2n + 1) = 2n&#178; + 3n + 1</text>
  <rect x="18" y="478" width="684" height="130" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="498" font-size="11.5" fill="#1f6b34" font-weight="bold">HOW ONE WOULD HAVE GUESSED A QUADRATIC</text>
  <text x="40" y="524" font-size="11" fill="#666">running totals</text><text x="236" y="524" font-size="12" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><text x="298" y="524" font-size="12" fill="#3b5b9b" text-anchor="middle" font-weight="bold">6</text><text x="360" y="524" font-size="12" fill="#3b5b9b" text-anchor="middle" font-weight="bold">15</text><text x="422" y="524" font-size="12" fill="#3b5b9b" text-anchor="middle" font-weight="bold">28</text><text x="484" y="524" font-size="12" fill="#3b5b9b" text-anchor="middle" font-weight="bold">45</text><text x="546" y="524" font-size="12" fill="#3b5b9b" text-anchor="middle" font-weight="bold">66</text><text x="40" y="548" font-size="11" fill="#666">first differences</text><text x="267" y="548" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">5</text><text x="329" y="548" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">9</text><text x="391" y="548" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">13</text><text x="453" y="548" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">17</text><text x="515" y="548" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">21</text><text x="40" y="572" font-size="11" fill="#666">second differences</text><text x="298" y="572" font-size="12" fill="#b06a10" text-anchor="middle" font-weight="bold">4</text><text x="360" y="572" font-size="12" fill="#b06a10" text-anchor="middle" font-weight="bold">4</text><text x="422" y="572" font-size="12" fill="#b06a10" text-anchor="middle" font-weight="bold">4</text><text x="484" y="572" font-size="12" fill="#b06a10" text-anchor="middle" font-weight="bold">4</text>
  <text x="40" y="592" font-size="11.5" fill="#333">The first differences are the terms themselves, and the second differences are constant &#8212; the signature of a quadratic.</text>
  <rect x="18" y="621" width="684" height="132" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="641" font-size="11.5" fill="#b06a10" font-weight="bold">A TABLE IS EVIDENCE, NOT PROOF &#8212; EXCEPT WHEN IT IS</text>
  <text x="40" y="665" font-size="11.5" fill="#333">Five agreeing rows prove nothing on their own: 3.4 Problem 4 met a polynomial that produces primes</text>
  <text x="40" y="683" font-size="11.5" fill="#333">for forty consecutive inputs and then fails.</text>
  <text x="40" y="709" font-size="11.5" fill="#333">But here there is a loophole. Two polynomials of degree at most 2 that agree at 3 points are equal,</text>
  <text x="40" y="727" font-size="11.5" fill="#333">so <tspan font-style="italic">once one knows the left side is a quadratic in n</tspan>, three rows already settle it. Knowing that is</text>
  <text x="40" y="745" font-size="11.5" fill="#333">exactly what the table cannot tell you &#8212; which is the gap induction is built to close.</text>
</svg>