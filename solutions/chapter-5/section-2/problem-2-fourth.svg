<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 758" width="720" height="758" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="758" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE SUM OF THE FIRST n FOURTH POWERS</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">1&#8308; + 2&#8308; + &#8943; + n&#8308; = n(n+1)(2n+1)(3n&#178; + 3n &#8722; 1) / 30</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">Verified for every n up to 4000; the inductive step matched in all six coefficients.</text>
  <rect x="18" y="118" width="684" height="238" rx="6" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="360" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">finding the degree: difference the running totals until they stop changing</text><text x="142" y="166" font-size="10.5" fill="#777" text-anchor="end">totals</text><text x="160" y="166" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">0</text><text x="228" y="166" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">1</text><text x="296" y="166" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">17</text><text x="364" y="166" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">98</text><text x="432" y="166" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">354</text><text x="500" y="166" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">979</text><text x="568" y="166" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">2275</text><text x="142" y="189" font-size="10.5" fill="#777" text-anchor="end">1st</text><text x="160" y="189" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">1</text><text x="228" y="189" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">16</text><text x="296" y="189" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">81</text><text x="364" y="189" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">256</text><text x="432" y="189" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">625</text><text x="500" y="189" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">1296</text><text x="568" y="189" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">2401</text><text x="142" y="212" font-size="10.5" fill="#777" text-anchor="end">2nd</text><text x="160" y="212" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">15</text><text x="228" y="212" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">65</text><text x="296" y="212" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">175</text><text x="364" y="212" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">369</text><text x="432" y="212" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">671</text><text x="500" y="212" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">1105</text><text x="568" y="212" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">1695</text><text x="142" y="235" font-size="10.5" fill="#777" text-anchor="end">3rd</text><text x="160" y="235" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">50</text><text x="228" y="235" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">110</text><text x="296" y="235" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">194</text><text x="364" y="235" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">302</text><text x="432" y="235" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">434</text><text x="500" y="235" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">590</text><text x="142" y="258" font-size="10.5" fill="#777" text-anchor="end">4th</text><text x="160" y="258" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">60</text><text x="228" y="258" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">84</text><text x="296" y="258" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">108</text><text x="364" y="258" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">132</text><text x="432" y="258" font-size="11" fill="#333" text-anchor="middle" font-weight="normal">156</text><text x="142" y="281" font-size="10.5" fill="#777" text-anchor="end">5th</text><text x="160" y="281" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">24</text><text x="228" y="281" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">24</text><text x="296" y="281" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">24</text><text x="364" y="281" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">24</text><text x="40" y="322" font-size="11.5" fill="#333">The fifth differences are constant at 24, so the totals are a polynomial of degree 5 with leading</text><text x="40" y="340" font-size="11.5" fill="#333">coefficient 24/5! = 1/5. Six unknown coefficients, six data points, one linear system.</text><rect x="18" y="372" width="684" height="194" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/><rect x="18" y="372" width="684" height="28" rx="6" fill="#eef2fa"/><rect x="18" y="392" width="684" height="8" fill="#eef2fa"/><line x1="18" y1="400" x2="702" y2="400" stroke="#3b5b9b" stroke-width="1.2"/><text x="120" y="391" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">n</text><text x="300" y="391" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1&#8308; + 2&#8308; + &#8943; + n&#8308;</text><text x="560" y="391" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">n(n+1)(2n+1)(3n&#178;+3n&#8722;1)/30</text><text x="120" y="419" font-size="11.5" fill="#333" text-anchor="middle">0</text><text x="300" y="419" font-size="11.5" fill="#333" text-anchor="middle">0</text><text x="560" y="419" font-size="11.5" fill="#1f6b34" text-anchor="middle">0</text><rect x="19" y="424" width="682" height="22" fill="#fafafa"/><text x="120" y="441" font-size="11.5" fill="#333" text-anchor="middle">1</text><text x="300" y="441" font-size="11.5" fill="#333" text-anchor="middle">1</text><text x="560" y="441" font-size="11.5" fill="#1f6b34" text-anchor="middle">1</text><text x="120" y="463" font-size="11.5" fill="#333" text-anchor="middle">2</text><text x="300" y="463" font-size="11.5" fill="#333" text-anchor="middle">17</text><text x="560" y="463" font-size="11.5" fill="#1f6b34" text-anchor="middle">17</text><rect x="19" y="468" width="682" height="22" fill="#fafafa"/><text x="120" y="485" font-size="11.5" fill="#333" text-anchor="middle">3</text><text x="300" y="485" font-size="11.5" fill="#333" text-anchor="middle">98</text><text x="560" y="485" font-size="11.5" fill="#1f6b34" text-anchor="middle">98</text><text x="120" y="507" font-size="11.5" fill="#333" text-anchor="middle">4</text><text x="300" y="507" font-size="11.5" fill="#333" text-anchor="middle">354</text><text x="560" y="507" font-size="11.5" fill="#1f6b34" text-anchor="middle">354</text><rect x="19" y="512" width="682" height="22" fill="#fafafa"/><text x="120" y="529" font-size="11.5" fill="#333" text-anchor="middle">5</text><text x="300" y="529" font-size="11.5" fill="#333" text-anchor="middle">979</text><text x="560" y="529" font-size="11.5" fill="#1f6b34" text-anchor="middle">979</text><text x="120" y="551" font-size="11.5" fill="#333" text-anchor="middle">6</text><text x="300" y="551" font-size="11.5" fill="#333" text-anchor="middle">2275</text><text x="560" y="551" font-size="11.5" fill="#1f6b34" text-anchor="middle">2275</text>
  <rect x="18" y="582" width="684" height="160" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="602" font-size="11.5" fill="#1f6b34" font-weight="bold">THE FAMILY IT BELONGS TO</text>
  <text x="140" y="630" font-size="11.5" fill="#666" text-anchor="end">&#8721; j<tspan baseline-shift="super" font-size="8">1</tspan> =</text><text x="156" y="630" font-size="11.5" fill="#1f3a68">n(n+1)/2</text><text x="140" y="652" font-size="11.5" fill="#666" text-anchor="end">&#8721; j<tspan baseline-shift="super" font-size="8">2</tspan> =</text><text x="156" y="652" font-size="11.5" fill="#1f3a68">n(n+1)(2n+1)/6</text><text x="140" y="674" font-size="11.5" fill="#666" text-anchor="end">&#8721; j<tspan baseline-shift="super" font-size="8">3</tspan> =</text><text x="156" y="674" font-size="11.5" fill="#1f3a68">n&#178;(n+1)&#178;/4</text><text x="140" y="696" font-size="11.5" fill="#666" text-anchor="end">&#8721; j<tspan baseline-shift="super" font-size="8">4</tspan> =</text><text x="156" y="696" font-size="11.5" fill="#1f3a68">n(n+1)(2n+1)(3n&#178;+3n&#8722;1)/30</text>
  <text x="40" y="712" font-size="11.5" fill="#333">Each is a polynomial of degree p+1 with leading coefficient 1/(p+1), and every one carries a factor</text>
  <text x="40" y="730" font-size="11.5" fill="#333">n(n+1). Also &#8721; j&#8308; = (&#8721; j&#178;)(3n&#178;+3n&#8722;1)/5, checked for n up to 400.</text>
</svg>