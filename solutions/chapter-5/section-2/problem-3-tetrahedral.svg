<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 681" width="720" height="681" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="681" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE SUM OF THE FIRST n TRIANGULAR NUMBERS</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">T&#8321; + T&#8322; + &#8943; + T&#8345; = n(n+1)(n+2)/6 = C(n+2, 3)</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">Verified for every n up to 4000, and the inductive step matched coefficient by coefficient.</text>
  <rect x="22" y="118" width="336" height="262" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the triangles, and their running total</text><circle cx="62.0" cy="170.0" r="4.0" fill="#3b5b9b"/><text x="62.0" y="228" font-size="11.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">T&#8321; = 1</text><text x="62.0" y="246" font-size="10.5" fill="#b06a10" text-anchor="middle">total 1</text><circle cx="130.0" cy="170.0" r="4.0" fill="#3b5b9b"/><circle cx="124.5" cy="181.0" r="4.0" fill="#3b5b9b"/><circle cx="135.5" cy="181.0" r="4.0" fill="#3b5b9b"/><text x="130.0" y="228" font-size="11.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">T&#8322; = 3</text><text x="130.0" y="246" font-size="10.5" fill="#b06a10" text-anchor="middle">total 4</text><circle cx="214.0" cy="170.0" r="4.0" fill="#3b5b9b"/><circle cx="208.5" cy="181.0" r="4.0" fill="#3b5b9b"/><circle cx="219.5" cy="181.0" r="4.0" fill="#3b5b9b"/><circle cx="203.0" cy="192.0" r="4.0" fill="#3b5b9b"/><circle cx="214.0" cy="192.0" r="4.0" fill="#3b5b9b"/><circle cx="225.0" cy="192.0" r="4.0" fill="#3b5b9b"/><text x="214.0" y="228" font-size="11.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">T&#8323; = 6</text><text x="214.0" y="246" font-size="10.5" fill="#b06a10" text-anchor="middle">total 10</text><circle cx="308.0" cy="170.0" r="4.0" fill="#3b5b9b"/><circle cx="302.5" cy="181.0" r="4.0" fill="#3b5b9b"/><circle cx="313.5" cy="181.0" r="4.0" fill="#3b5b9b"/><circle cx="297.0" cy="192.0" r="4.0" fill="#3b5b9b"/><circle cx="308.0" cy="192.0" r="4.0" fill="#3b5b9b"/><circle cx="319.0" cy="192.0" r="4.0" fill="#3b5b9b"/><circle cx="291.5" cy="203.0" r="4.0" fill="#3b5b9b"/><circle cx="302.5" cy="203.0" r="4.0" fill="#3b5b9b"/><circle cx="313.5" cy="203.0" r="4.0" fill="#3b5b9b"/><circle cx="324.5" cy="203.0" r="4.0" fill="#3b5b9b"/><text x="308.0" y="228" font-size="11.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">T&#8324; = 10</text><text x="308.0" y="246" font-size="10.5" fill="#b06a10" text-anchor="middle">total 20</text><text x="190.0" y="294" font-size="11.5" fill="#333" text-anchor="middle">1, 4, 10, 20 &#8212; the <tspan font-style="italic">tetrahedral</tspan> numbers,</text><text x="190.0" y="312" font-size="11.5" fill="#333" text-anchor="middle">the counts of a triangular stack of cannonballs.</text><text x="190.0" y="346" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">&#8721; T&#7522; = n(n+1)(n+2)/6</text><rect x="372" y="118" width="336" height="262" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the same fact inside Pascal&#8217;s triangle</text><text x="540.0" y="160.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">1</text><text x="524.0" y="179.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">1</text><text x="556.0" y="179.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">1</text><text x="508.0" y="198.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">1</text><text x="540.0" y="198.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">2</text><rect x="558.0" y="187.0" width="28" height="16" rx="3" fill="#7a4fa3" fill-opacity="0.16"/><text x="572.0" y="198.0" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">1</text><text x="492.0" y="217.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">1</text><text x="524.0" y="217.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">3</text><rect x="542.0" y="206.0" width="28" height="16" rx="3" fill="#7a4fa3" fill-opacity="0.16"/><text x="556.0" y="217.0" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">3</text><text x="588.0" y="217.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">1</text><text x="476.0" y="236.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">1</text><text x="508.0" y="236.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">4</text><rect x="526.0" y="225.0" width="28" height="16" rx="3" fill="#7a4fa3" fill-opacity="0.16"/><text x="540.0" y="236.0" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">6</text><text x="572.0" y="236.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">4</text><text x="604.0" y="236.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">1</text><text x="460.0" y="255.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">1</text><text x="492.0" y="255.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">5</text><rect x="510.0" y="244.0" width="28" height="16" rx="3" fill="#7a4fa3" fill-opacity="0.16"/><text x="524.0" y="255.0" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">10</text><text x="556.0" y="255.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">10</text><text x="588.0" y="255.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">5</text><text x="620.0" y="255.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">1</text><text x="444.0" y="274.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">1</text><text x="476.0" y="274.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">6</text><rect x="494.0" y="263.0" width="28" height="16" rx="3" fill="#7a4fa3" fill-opacity="0.16"/><text x="508.0" y="274.0" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">15</text><text x="540.0" y="274.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">20</text><text x="572.0" y="274.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">15</text><text x="604.0" y="274.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">6</text><text x="636.0" y="274.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">1</text><text x="428.0" y="293.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">1</text><text x="460.0" y="293.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">7</text><text x="492.0" y="293.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">21</text><rect x="509.0" y="282.0" width="30" height="16" rx="3" fill="#1f6b34" fill-opacity="0.22"/><text x="524.0" y="293.0" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">35</text><text x="556.0" y="293.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">35</text><text x="588.0" y="293.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">21</text><text x="620.0" y="293.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">7</text><text x="652.0" y="293.0" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">1</text><text x="388" y="318" font-size="11" fill="#7a4fa3">purple: 1, 3, 6, 10, 15 &#8212; the triangular numbers, C(i+1, 2)</text><text x="388" y="336" font-size="11" fill="#1f6b34">green: their total 35 = C(7, 3), one row down and one across</text><text x="388" y="360" font-size="11" fill="#333">This is the hockey-stick identity; the formula is C(n+2, 3).</text>
  <rect x="18" y="394" width="684" height="134" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="414" font-size="11.5" fill="#1f6b34" font-weight="bold">THE INDUCTIVE STEP</text>
  <text x="40" y="440" font-size="11.5" fill="#333">Assume the total at k, then add the next triangular number T&#8342;&#8330;&#8321; = (k+1)(k+2)/2:</text>
  <text x="360" y="470" font-size="12.5" fill="#1f3a68" text-anchor="middle">k(k+1)(k+2)/6 + (k+1)(k+2)/2&#160;&#160;=&#160;&#160;(k+1)(k+2) &#183; [ k/6 + 1/2 ]</text>
  <text x="360" y="498" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">=&#160;&#160;(k+1)(k+2)(k+3)/6</text>
  <text x="40" y="520" font-size="11.5" fill="#333">The whole step is that k/6 + 1/2 = (k+3)/6. Both sides expand to the same four coefficients.</text>
  <rect x="18" y="541" width="684" height="124" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="561" font-size="11.5" fill="#b06a10" font-weight="bold">TWO FACTS FOUND WHILE CHECKING</text>
  <text x="40" y="585" font-size="11.5" fill="#333">Consecutive triangular numbers sum to a square: T&#8345; + T&#8345;&#8331;&#8321; = n&#178;, verified for n up to 1000.</text>
  <text x="40" y="611" font-size="11.5" fill="#333">Tetrahedral numbers are rarely anything else. Searching to n = 200000, only 1, 4 and 19600 are</text>
  <text x="40" y="629" font-size="11.5" fill="#333">perfect squares, and only 1, 10, 120, 1540 and 7140 are themselves triangular &#8212; both lists are known</text>
  <text x="40" y="647" font-size="11.5" fill="#333">to be complete, though proving that is far harder than the formula itself.</text>
</svg>