t-size="9.5" fill="#9b2c2c" text-anchor="start">n=1</text><text x="633.8181818181818" y="282.0" font-size="9.5" fill="#b06a10" text-anchor="start">n=2</text><circle cx="676.7272727272727" cy="167.0" r="3.6" fill="#1f6b34" stroke="#fff" stroke-width="0.8"/><text x="666.7272727272727" y="161.0" font-size="9.5" fill="#1f6b34" text-anchor="end">n=3</text><text x="388" y="358" font-size="10.5" fill="#333">Roots &#8722;&#966;, 1/&#966; and 2: D &gt; 0 exactly on (&#8722;&#966;, 1/&#966;) and</text><text x="388" y="376" font-size="10.5" fill="#333">(2, &#8734;), where &#966; = (1 + &#8730;5)/2 is the golden ratio.</text>
  <rect x="18" y="402" width="684" height="96" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="422" font-size="11.5" fill="#1f6b34" font-weight="bold">THE GAP FACTORS</text>
  <text x="40" y="448" font-size="11.5" fill="#333">D(n) = n&#179; &#8722; n&#178; &#8722; 3n + 2 = (n &#8722; 2)(n&#178; + n &#8722; 1). For n &#8805; 3 both factors are positive, a proof with no induction.</text>
  <text x="40" y="468" font-size="11.5" fill="#333">The factor n &#8722; 2 explains the equality at n = 2; the factor n&#178; + n &#8722; 1 = &#8722;1 explains the failure at n = 1.</text>
  <rect x="18" y="511" width="684" height="96" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="531" font-size="11.5" fill="#b06a10" font-weight="bold">THE BASIS IS 3, THOUGH THE STEP WORKS FROM 1</text>
  <text x="40" y="557" font-size="11.5" fill="#333">The step needs only k &#8805; 1, but D(1) = &#8722;1 and D(2) = 0, so no earlier basis is available. Starting from the</text>
  <text x="40" y="577" font-size="11.5" fill="#333">weak inequality D(2) &#8805; 0, though, the step's strict increment already gives D(3) &gt; 0.</text>
</svg>