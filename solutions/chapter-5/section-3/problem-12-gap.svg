<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 623" width="720" height="623" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="623" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE GAP GROWS AT EVERY STEP</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">D(k+1) = D(k) + 3k&#178; + k &#8722; 3,   where D(n) = (n&#179; + 3) &#8722; (n&#178; + 3n + 1)</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">D(3) = 30 &#8722; 19 = 11 &gt; 0, and 3k&#178; + k &#8722; 3 &gt; 0 for k &#8805; 1, so D(n) &gt; 0 for every n &#8805; 3. Verified to n = 5000.</text>
  <rect x="22" y="118" width="336" height="270" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the two sides and their gap D(n)</text><text x="50" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">n</text><text x="114" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">n&#179; + 3</text><text x="192" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">n&#178; + 3n + 1</text><text x="260" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">D(n)</text><text x="320" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">holds?</text><line x1="34" y1="170" x2="346" y2="170" stroke="#3b5b9b" stroke-width="1"/><text x="50" y="190" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">0</text><text x="114" y="190" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">3</text><text x="192" y="190" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">1</text><text x="260" y="190" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">2</text><text x="320" y="190" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><rect x="34" y="197" width="312" height="19" fill="#fbeeee"/><text x="50" y="211" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">1</text><text x="114" y="211" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">4</text><text x="192" y="211" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">5</text><text x="260" y="211" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">&#8722;1</text><text x="320" y="211" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">no</text><rect x="34" y="218" width="312" height="19" fill="#fbeeee"/><text x="50" y="232" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">2</text><text x="114" y="232" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">11</text><text x="192" y="232" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">11</text><text x="260" y="232" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">0</text><text x="320" y="232" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">no (equal)</text><text x="50" y="253" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">3</text><text x="114" y="253" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">30</text><text x="192" y="253" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">19</text><text x="260" y="253" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">11</text><text x="320" y="253" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><text x="50" y="274" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">4</text><text x="114" y="274" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">67</text><text x="192" y="274" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">29</text><text x="260" y="274" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">38</text><text x="320" y="274" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><text x="50" y="295" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">5</text><text x="114" y="295" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">128</text><text x="192" y="295" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">41</text><text x="260" y="295" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">87</text><text x="320" y="295" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><text x="50" y="316" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">6</text><text x="114" y="316" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">219</text><text x="192" y="316" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">55</text><text x="260" y="316" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">164</text><text x="320" y="316" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><text x="50" y="337" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">7</text><text x="114" y="337" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">346</text><text x="192" y="337" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">71</text><text x="260" y="337" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">275</text><text x="320" y="337" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><text x="190.0" y="358" font-size="10.5" fill="#333" text-anchor="middle">true at n = 0, false at 1, equal at 2,</text><text x="190.0" y="376" font-size="10.5" fill="#333" text-anchor="middle">and true from the basis n = 3 onward</text><rect x="372" y="118" width="336" height="270" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">D(x) = (x &#8722; 2)(x&#178; + x &#8722; 1)</text><line x1="412" y1="332.0" x2="692" y2="332.0" stroke="#eee"/><text x="407" y="335.5" font-size="9" fill="#999" text-anchor="end">&#8722;4</text><line x1="412" y1="288.0" x2="692" y2="288.0" stroke="#eee"/><text x="407" y="291.5" font-size="9" fill="#999" text-anchor="end">0</text><line x1="412" y1="244.0" x2="692" y2="244.0" stroke="#eee"/><text x="407" y="247.5" font-size="9" fill="#999" text-anchor="end">4</text><line x1="412" y1="200.0" x2="692" y2="200.0" stroke="#eee"/><text x="407" y="203.5" fo