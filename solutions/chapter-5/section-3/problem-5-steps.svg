<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 623" width="720" height="623" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="623" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE STEP ADDS A MULTIPLE OF 6</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">f(k+1) = f(k) + 6(k+1),   where f(n) = 3n&#178; + 3n &#8722; 12</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">So 6 | f(n) for every n &#8712; &#8469;, starting from f(0) = &#8722;12. Verified for n up to 5000.</text>
  <rect x="22" y="118" width="336" height="270" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">values climb by 6, 12, 18, &#8230;</text><line x1="54" y1="333.0" x2="344" y2="333.0" stroke="#eee" stroke-width="1"/><text x="50" y="336.5" font-size="9" fill="#999" text-anchor="end">-12</text><line x1="54" y1="303.0" x2="344" y2="303.0" stroke="#eee" stroke-width="1"/><text x="50" y="306.5" font-size="9" fill="#999" text-anchor="end">12</text><line x1="54" y1="273.0" x2="344" y2="273.0" stroke="#eee" stroke-width="1"/><text x="50" y="276.5" font-size="9" fill="#999" text-anchor="end">36</text><line x1="54" y1="243.0" x2="344" y2="243.0" stroke="#eee" stroke-width="1"/><text x="50" y="246.5" font-size="9" fill="#999" text-anchor="end">60</text><line x1="54" y1="213.0" x2="344" y2="213.0" stroke="#eee" stroke-width="1"/><text x="50" y="216.5" font-size="9" fill="#999" text-anchor="end">84</text><line x1="54" y1="183.0" x2="344" y2="183.0" stroke="#eee" stroke-width="1"/><text x="50" y="186.5" font-size="9" fill="#999" text-anchor="end">108</text><line x1="54" y1="318" x2="344" y2="318" stroke="#888" stroke-width="1"/><rect x="68" y="318" width="26" height="15.0" fill="#9b2c2c" fill-opacity="0.75"/><text x="81.0" y="345.0" font-size="10" fill="#9b2c2c" text-anchor="middle" font-weight="bold">-12</text><text x="81.0" y="356" font-size="10" fill="#666" text-anchor="middle">n=0</text><rect x="108" y="318" width="26" height="7.5" fill="#9b2c2c" fill-opacity="0.75"/><text x="121.0" y="337.5" font-size="10" fill="#9b2c2c" text-anchor="middle" font-weight="bold">-6</text><text x="121.0" y="356" font-size="10" fill="#666" text-anchor="middle">n=1</text><text x="101.0" y="372" font-size="9.5" fill="#1f6b34" text-anchor="middle">+6</text><rect x="148" y="310.5" width="26" height="7.5" fill="#3b5b9b" fill-opacity="0.75"/><text x="161.0" y="305.5" font-size="10" fill="#3b5b9b" text-anchor="middle" font-weight="bold">6</text><text x="161.0" y="356" font-size="10" fill="#666" text-anchor="middle">n=2</text><text x="141.0" y="372" font-size="9.5" fill="#1f6b34" text-anchor="middle">+12</text><rect x="188" y="288.0" width="26" height="30.0" fill="#3b5b9b" fill-opacity="0.75"/><text x="201.0" y="283.0" font-size="10" fill="#3b5b9b" text-anchor="middle" font-weight="bold">24</text><text x="201.0" y="356" font-size="10" fill="#666" text-anchor="middle">n=3</text><text x="181.0" y="372" font-size="9.5" fill="#1f6b34" text-anchor="middle">+18</text><rect x="228" y="258.0" width="26" height="60.0" fill="#3b5b9b" fill-opacity="0.75"/><text x="241.0" y="253.0" font-size="10" fill="#3b5b9b" text-anchor="middle" font-weight="bold">48</text><text x="241.0" y="356" font-size="10" fill="#666" text-anchor="middle">n=4</text><text x="221.0" y="372" font-size="9.5" fill="#1f6b34" text-anchor="middle">+24</text><rect x="268" y="220.5" width="26" height="97.5" fill="#3b5b9b" fill-opacity="0.75"/><text x="281.0" y="215.5" font-size="10" fill="#3b5b9b" text-anchor="middle" font-weight="bold">78</text><text x="281.0" y="356" font-size="10" fill="#666" text-anchor="middle">n=5</text><text x="261.0" y="372" font-size="9.5" fill="#1f6b34" text-anchor="middle">+30</text><rect x="308" y="175.5" width="26" height="142.5" fill="#3b5b9b" fill-opacity="0.75"/><text x="321.0" y="170.5" font-size="10" fill="#3b5b9b" text-anchor="middle" font-weight="bold">114</text><text x="321.0" y="356" font-size="10" fill="#666" text-anchor="middle">n=6</text><text x="301.0" y="372" font-size="9.5" fill="#1f6b34" text-anchor="middle">+36</text><text x="190.0" y="382" font-size="10.5" fill="#333" text-anchor="middle">each jump is 6(k + 1); start at &#8722;12 = 6 &#183; (&#8722;2)</text><rect x="372" y="118" width="336" height="270" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the quotient is a triangular number minus 2</text><circle cx="408.0" cy="296.0" r="5.2" fill="#fff" stroke="#9b2c2c" stroke-width="1.2" stroke-dasharray="2,1.5"/><circle cx="421.0" cy="296.0" r="5.2" fill="#fff" stroke="#9b2c2c" stroke-width="1.2" stroke-dasharray="2,1.5"/><circle cx="414.5" cy="284.3" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><text x="414.5" y="320" font-size="10" fill="#666" text-anchor="middle">n=2</text><text x="414.5" y="336" font-size="10.5" fill="#1f3a68" text-anchor="middle">3 &#8722; 2 = 1</text><circle cx="464.0" cy="296.0" r="5.2" fill="#fff" stroke="#9b2c2c" stroke-width="1.2" stroke-dasharray="2,1.5"/><circle cx="477.0" cy="296.0" r="5.2" fill="#fff" stroke="#9b2c2c" stroke-width="1.2" stroke-dasharray="2,1.5"/><circle cx="490.0" cy="296.0" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="470.5" cy="284.3" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="483.5" cy="284.3" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="477.0" cy="272.6" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><text x="477.0" y="320" font-size="10" fill="#666" text-anchor="middle">n=3</text><text x="477.0" y="336" font-size="10.5" fill="#1f3a68" text-anchor="middle">6 &#8722; 2 = 4</text><circle cx="534.0" cy="296.0" r="5.2" fill="#fff" stroke="#9b2c2c" stroke-width="1.2" stroke-dasharray="2,1.5"/><circle cx="547.0" cy="296.0" r="5.2" fill="#fff" stroke="#9b2c2c" stroke-width="1.2" stroke-dasharray="2,1.5"/><circle cx="560.0" cy="296.0" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="573.0" cy="296.0" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="540.5" cy="284.3" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="553.5" cy="284.3" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="566.5" cy="284.3" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="547.0" cy="272.6" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="560.0" cy="272.6" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="553.5" cy="260.9" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><text x="553.5" y="320" font-size="10" fill="#666" text-anchor="middle">n=4</text><text x="553.5" y="336" font-size="10.5" fill="#1f3a68" text-anchor="middle">10 &#8722; 2 = 8</text><circle cx="622.0" cy="296.0" r="5.2" fill="#fff" stroke="#9b2c2c" stroke-width="1.2" stroke-dasharray="2,1.5"/><circle cx="635.0" cy="296.0" r="5.2" fill="#fff" stroke="#9b2c2c" stroke-width="1.2" stroke-dasharray="2,1.5"/><circle cx="648.0" cy="296.0" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="661.0" cy="296.0" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="674.0" cy="296.0" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="628.5" cy="284.3" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="641.5" cy="284.3" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="654.5" cy="284.3" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="667.5" cy="284.3" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="635.0" cy="272.6" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="648.0" cy="272.6" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="661.0" cy="272.6" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="641.5" cy="260.9" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="654.5" cy="260.9" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><circle cx="648.0" cy="249.2" r="5.2" fill="#3b5b9b" fill-opacity="0.8"/><text x="648.0" y="320" font-size="10" fill="#666" text-anchor="middle">n=5</text><text x="648.0" y="336" font-size="10.5" fill="#1f3a68" text-anchor="middle">15 &#8722; 2 = 13</text><text x="388" y="358" font-size="10.5" fill="#333">f(n)/6 = n(n+1)/2 &#8722; 2: &#8722;2, &#8722;1, 1, 4, 8, 13, 19, &#8230;</text><text x="388" y="376" font-size="10.5" fill="#333">Dashed: the two dots removed. n(n+1)/2 is whole.</text>
  <rect x="18" y="402" width="684" height="96" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="422" font-size="11.5" fill="#1f6b34" font-weight="bold">THE &#8722;12 IS ALMOST IRRELEVANT</text>
  <text x="40" y="448" font-size="11.5" fill="#333">3n&#178; + 3n = 3n(n + 1) is always a multiple of 6, so 3n&#178; + 3n + c is divisible by 6 for every n</text>
  <text x="40" y="468" font-size="11.5" fill="#333">exactly when 6 | c. The constant only has to keep the sum on the right residue; &#8722;12 does,</text>
  <text x="40" y="486" font-size="11.5" fill="#333">and so would 0, &#177;6, &#177;18, &#8230; (checked for c from &#8722;30 to 30).</text>
  <rect x="18" y="511" width="684" height="96" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="531" font-size="11.5" fill="#b06a10" font-weight="bold">6 IS THE BEST CONSTANT; 12 WORKS ONE TIME IN TWO</text>
  <text x="40" y="557" font-size="11.5" fill="#333">f(1) = &#8722;6 and f(2) = 6, so no larger divisor holds for every n; the gcd of f(0), &#8230;, f(199) is 6.</text>
  <text x="40" y="577" font-size="11.5" fill="#333">12 | f(n) exactly when n(n+1)/2 is even, i.e. when n &#8801; 0 or 3 (mod 4), checked to n = 2000.</text>
</svg>