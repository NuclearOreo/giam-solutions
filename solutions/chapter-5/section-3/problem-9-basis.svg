<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 615" width="720" height="615" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="615" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#fbeeee" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#9b2c2c" font-weight="bold">THE STATEMENT IS FALSE FOR EVERY n</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">2n&#179; &#8722; 2n &#8722; 14 &#8801; 4 (mod 6)   for all n &#8712; &#8469;</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">Counterexample n = 0: the value is &#8722;14 = 6 &#183; (&#8722;3) + 4. The inductive step is valid; only the basis fails.</text>
  <rect x="22" y="118" width="336" height="262" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">every value leaves remainder 4 mod 6</text><text x="52" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">n</text><text x="122" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">f(n)</text><text x="200" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">f(n) &#8722; 4</text><text x="272" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">mod 6</text><text x="328" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">mod 12</text><line x1="34" y1="170" x2="346" y2="170" stroke="#3b5b9b" stroke-width="1"/><text x="52" y="190" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">0</text><text x="122" y="190" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8722;14</text><text x="200" y="190" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">&#8722;18 = 6&#183;(&#8722;3)</text><text x="272" y="190" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">4</text><text x="328" y="190" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">10</text><text x="52" y="212" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">1</text><text x="122" y="212" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8722;14</text><text x="200" y="212" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">&#8722;18 = 6&#183;(&#8722;3)</text><text x="272" y="212" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">4</text><text x="328" y="212" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">10</text><text x="52" y="234" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">2</text><text x="122" y="234" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8722;2</text><text x="200" y="234" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">&#8722;6 = 6&#183;(&#8722;1)</text><text x="272" y="234" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">4</text><text x="328" y="234" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">10</text><text x="52" y="256" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">3</text><text x="122" y="256" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">34</text><text x="200" y="256" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">30 = 6&#183;5</text><text x="272" y="256" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">4</text><text x="328" y="256" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">10</text><text x="52" y="278" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">4</text><text x="122" y="278" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">106</text><text x="200" y="278" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">102 = 6&#183;17</text><text x="272" y="278" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">4</text><text x="328" y="278" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">10</text><text x="52" y="300" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">5</text><text x="122" y="300" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">226</text><text x="200" y="300" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">222 = 6&#183;37</text><text x="272" y="300" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">4</text><text x="328" y="300" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">10</text><text x="52" y="322" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">6</text><text x="122" y="322" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">406</text><text x="200" y="322" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">402 = 6&#183;67</text><text x="272" y="322" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">4</text><text x="328" y="322" font-size="11" fill="#b06a10" text-anchor="middle" font-weight="bold">10</text><text x="190.0" y="350" font-size="10.5" fill="#333" text-anchor="middle">f(n) = 2n&#179; &#8722; 2n &#8722; 14 is never a multiple of 6:</text><text x="190.0" y="368" font-size="10.5" fill="#333" text-anchor="middle">no n works (checked for |n| up to 5000)</text><rect x="372" y="118" width="336" height="262" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the step holds, but no domino is pushed</text><rect x="424" y="196" width="22" height="64" rx="2" fill="#f4f6fb" stroke="#3b5b9b" stroke-width="1.2"/><text x="435.0" y="276" font-size="10" fill="#666" text-anchor="middle">P(0)</text><path d="M 448 216 Q 455.0 204 462 216" fill="none" stroke="#1f6b34" stroke-width="1.2"/><path d="M 458 212 L 462 216 L 457 217" fill="none" stroke="#1f6b34" stroke-width="1.2"/><rect x="464" y="196" width="22" height="64" rx="2" fill="#f4f6fb" stroke="#3b5b9b" stroke-width="1.2"/><text x="475.0" y="276" font-size="10" fill="#666" text-anchor="middle">P(1)</text><path d="M 488 216 Q 495.0 204 502 216" fill="none" stroke="#1f6b34" stroke-width="1.2"/><path d="M 498 212 L 502 216 L 497 217" fill="none" stroke="#1f6b34" stroke-width="1.2"/><rect x="504" y="196" width="22" height="64" rx="2" fill="#f4f6fb" stroke="#3b5b9b" stroke-width="1.2"/><text x="515.0" y="276" font-size="10" fill="#666" text-anchor="middle">P(2)</text><path d="M 528 216 Q 535.0 204 542 216" fill="none" stroke="#1f6b34" stroke-width="1.2"/><path d="M 538 212 L 542 216 L 537 217" fill="none" stroke="#1f6b34" stroke-width="1.2"/><rect x="544" y="196" width="22" height="64" rx="2" fill="#f4f6fb" stroke="#3b5b9b" stroke-width="1.2"/><text x="555.0" y="276" font-size="10" fill="#666" text-anchor="middle">P(3)</text><path d="M 568 216 Q 575.0 204 582 216" fill="none" stroke="#1f6b34" stroke-width="1.2"/><path d="M 578 212 L 582 216 L 577 217" fill="none" stroke="#1f6b34" stroke-width="1.2"/><rect x="584" y="196" width="22" height="64" rx="2" fill="#f4f6fb" stroke="#3b5b9b" stroke-width="1.2"/><text x="595.0" y="276" font-size="10" fill="#666" text-anchor="middle">P(4)</text><path d="M 608 216 Q 615.0 204 622 216" fill="none" stroke="#1f6b34" stroke-width="1.2"/><path d="M 618 212 L 622 216 L 617 217" fill="none" stroke="#1f6b34" stroke-width="1.2"/><rect x="624" y="196" width="22" height="64" rx="2" fill="#f4f6fb" stroke="#3b5b9b" stroke-width="1.2"/><text x="635.0" y="276" font-size="10" fill="#666" text-anchor="middle">P(5)</text><path d="M 648 216 Q 655.0 204 662 216" fill="none" stroke="#1f6b34" stroke-width="1.2"/><path d="M 658 212 L 662 216 L 657 217" fill="none" stroke="#1f6b34" stroke-width="1.2"/><rect x="664" y="196" width="22" height="64" rx="2" fill="#f4f6fb" stroke="#3b5b9b" stroke-width="1.2"/><text x="675.0" y="276" font-size="10" fill="#666" text-anchor="middle">P(6)</text><line x1="390" y1="228.0" x2="418" y2="228.0" stroke="#9b2c2c" stroke-width="1.6" stroke-dasharray="3,2"/><path d="M 413 224.0 L 418 228.0 L 413 232.0" fill="none" stroke="#9b2c2c" stroke-width="1.6"/><line x1="396" y1="220.0" x2="408" y2="236.0" stroke="#9b2c2c" stroke-width="2.2"/><line x1="408" y1="220.0" x2="396" y2="236.0" stroke="#9b2c2c" stroke-width="2.2"/><text x="540.0" y="178" font-size="10.5" fill="#1f6b34" text-anchor="middle">step: P(k) &#8658; P(k+1), since f(k+1) = f(k) + 6k(k+1)</text><text x="388" y="314" font-size="10.5" fill="#9b2c2c">basis fails: f(0) = &#8722;14 and 6 &#8740; &#8722;14.</text><text x="388" y="340" font-size="10.5" fill="#333">The step carries falsity along just as well as truth:</text><text x="388" y="358" font-size="10.5" fill="#333">all values share one remainder mod 6, and it is 4.</text>
  <rect x="18" y="394" width="684" height="96" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="414" font-size="11.5" fill="#1f6b34" font-weight="bold">WHAT IS TRUE</text>
  <text x="40" y="440" font-size="11.5" fill="#333">2n&#179; &#8722; 2n = 2(n &#8722; 1)n(n + 1) = 12 &#183; C(n+1, 3) is always a multiple of 12, so f(n) &#8801; &#8722;14 &#8801; 10 (mod 12):</text>
  <text x="40" y="460" font-size="11.5" fill="#333">every value is even and none is divisible by 3 (checked for |n| up to 5000, negative n included).</text>
  <rect x="18" y="503" width="684" height="96" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="523" font-size="11.5" fill="#b06a10" font-weight="bold">THE CONSTANT DECIDES EVERYTHING</text>
  <text x="40" y="549" font-size="11.5" fill="#333">6 | 2n&#179; &#8722; 2n + c for every n exactly when 6 | c (checked for c from &#8722;30 to 30). With &#8722;12 or &#8722;18 in place of</text>
  <text x="40" y="569" font-size="11.5" fill="#333">&#8722;14 the claim becomes true, and the very same inductive step then proves it.</text>
</svg>