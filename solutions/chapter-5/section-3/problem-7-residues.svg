<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 615" width="720" height="615" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="615" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE STEP ADDS A MULTIPLE OF 4</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">f(k+1) = f(k) + 4(3 &#183; 13&#7503; + 1),   where f(n) = 13&#8319; + 4n &#8722; 1</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">So 4 | f(n) for every n &#8712; &#8469;, starting from f(0) = 0. Verified for n up to 3000.</text>
  <rect x="22" y="118" width="336" height="262" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the values are multiples of 16, not just 4</text><text x="46" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">n</text><text x="114" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">13&#8319;</text><text x="186" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">+ 4n &#8722; 1</text><text x="254" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">= f(n)</text><text x="324" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">&#247; 16</text><line x1="34" y1="170" x2="346" y2="170" stroke="#3b5b9b" stroke-width="1"/><text x="46" y="190" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">0</text><text x="114" y="190" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">1</text><text x="186" y="190" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">&#8722;1</text><text x="254" y="190" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">0</text><text x="324" y="190" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><text x="46" y="212" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">1</text><text x="114" y="212" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">13</text><text x="186" y="212" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">3</text><text x="254" y="212" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">16</text><text x="324" y="212" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">1</text><text x="46" y="234" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">2</text><text x="114" y="234" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">169</text><text x="186" y="234" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">7</text><text x="254" y="234" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">176</text><text x="324" y="234" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">11</text><text x="46" y="256" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">3</text><text x="114" y="256" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">2197</text><text x="186" y="256" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">11</text><text x="254" y="256" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">2208</text><text x="324" y="256" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">138</text><text x="46" y="278" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">4</text><text x="114" y="278" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">28561</text><text x="186" y="278" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">15</text><text x="254" y="278" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">28576</text><text x="324" y="278" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">1786</text><text x="46" y="300" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">5</text><text x="114" y="300" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">371293</text><text x="186" y="300" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">19</text><text x="254" y="300" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">371312</text><text x="324" y="300" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">23207</text><text x="46" y="322" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">6</text><text x="114" y="322" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">4826809</text><text x="186" y="322" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">23</text><text x="254" y="322" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">4826832</text><text x="324" y="322" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">301677</text><text x="190.0" y="350" font-size="10.5" fill="#333" text-anchor="middle">f(1) = 16, and the gcd of all the values is 16;</text><text x="190.0" y="368" font-size="10.5" fill="#333" text-anchor="middle">in fact f(n) leaves remainder 16n on division by 144</text><rect x="372" y="118" width="336" height="262" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">remainders mod 16 cancel in pairs</text><text x="386" y="179" font-size="10" fill="#666">n</text><text x="482.5" y="179" font-size="10.5" fill="#666" text-anchor="middle">0</text><text x="510.5" y="179" font-size="10.5" fill="#666" text-anchor="middle">1</text><text x="538.5" y="179" font-size="10.5" fill="#666" text-anchor="middle">2</text><text x="566.5" y="179" font-size="10.5" fill="#666" text-anchor="middle">3</text><text x="594.5" y="179" font-size="10.5" fill="#666" text-anchor="middle">4</text><text x="622.5" y="179" font-size="10.5" fill="#666" text-anchor="middle">5</text><text x="650.5" y="179" font-size="10.5" fill="#666" text-anchor="middle">6</text><text x="678.5" y="179" font-size="10.5" fill="#666" text-anchor="middle">7</text><text x="386" y="215" font-size="10" fill="#1f3a68">13&#8319; mod 16</text><rect x="470" y="198" width="25" height="24" rx="3" fill="#e8eefb" stroke="#3b5b9b" stroke-width="1.1"/><text x="482.5" y="214.5" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">1</text><rect x="498" y="198" width="25" height="24" rx="3" fill="#e8eefb" stroke="#3b5b9b" stroke-width="1.1"/><text x="510.5" y="214.5" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">13</text><rect x="526" y="198" width="25" height="24" rx="3" fill="#e8eefb" stroke="#3b5b9b" stroke-width="1.1"/><text x="538.5" y="214.5" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">9</text><rect x="554" y="198" width="25" height="24" rx="3" fill="#e8eefb" stroke="#3b5b9b" stroke-width="1.1"/><text x="566.5" y="214.5" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">5</text><rect x="582" y="198" width="25" height="24" rx="3" fill="#e8eefb" stroke="#3b5b9b" stroke-width="1.1"/><text x="594.5" y="214.5" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">1</text><rect x="610" y="198" width="25" height="24" rx="3" fill="#e8eefb" stroke="#3b5b9b" stroke-width="1.1"/><text x="622.5" y="214.5" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">13</text><rect x="638" y="198" width="25" height="24" rx="3" fill="#e8eefb" stroke="#3b5b9b" stroke-width="1.1"/><text x="650.5" y="214.5" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">9</text><rect x="666" y="198" width="25" height="24" rx="3" fill="#e8eefb" stroke="#3b5b9b" stroke-width="1.1"/><text x="678.5" y="214.5" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">5</text><text x="386" y="251" font-size="10" fill="#7a4508">4n&#8722;1 mod 16</text><rect x="470" y="234" width="25" height="24" rx="3" fill="#fbeedd" stroke="#b06a10" stroke-width="1.1"/><text x="482.5" y="250.5" font-size="11" fill="#7a4508" text-anchor="middle" font-weight="bold">15</text><rect x="498" y="234" width="25" height="24" rx="3" fill="#fbeedd" stroke="#b06a10" stroke-width="1.1"/><text x="510.5" y="250.5" font-size="11" fill="#7a4508" text-anchor="middle" font-weight="bold">3</text><rect x="526" y="234" width="25" height="24" rx="3" fill="#fbeedd" stroke="#b06a10" stroke-width="1.1"/><text x="538.5" y="250.5" font-size="11" fill="#7a4508" text-anchor="middle" font-weight="bold">7</text><rect x="554" y="234" width="25" height="24" rx="3" fill="#fbeedd" stroke="#b06a10" stroke-width="1.1"/><text x="566.5" y="250.5" font-size="11" fill="#7a4508" text-anchor="middle" font-weight="bold">11</text><rect x="582" y="234" width="25" height="24" rx="3" fill="#fbeedd" stroke="#b06a10" stroke-width="1.1"/><text x="594.5" y="250.5" font-size="11" fill="#7a4508" text-anchor="middle" font-weight="bold">15</text><rect x="610" y="234" width="25" height="24" rx="3" fill="#fbeedd" stroke="#b06a10" stroke-width="1.1"/><text x="622.5" y="250.5" font-size="11" fill="#7a4508" text-anchor="middle" font-weight="bold">3</text><rect x="638" y="234" width="25" height="24" rx="3" fill="#fbeedd" stroke="#b06a10" stroke-width="1.1"/><text x="650.5" y="250.5" font-size="11" fill="#7a4508" text-anchor="middle" font-weight="bold">7</text><rect x="666" y="234" width="25" height="24" rx="3" fill="#fbeedd" stroke="#b06a10" stroke-width="1.1"/><text x="678.5" y="250.5" font-size="11" fill="#7a4508" text-anchor="middle" font-weight="bold">11</text><text x="386" y="287" font-size="10" fill="#1f6b34">sum mod 16</text><rect x="470" y="270" width="25" height="24" rx="3" fill="#e6f3e8" stroke="#1f6b34" stroke-width="1.1"/><text x="482.5" y="286.5" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><rect x="498" y="270" width="25" height="24" rx="3" fill="#e6f3e8" stroke="#1f6b34" stroke-width="1.1"/><text x="510.5" y="286.5" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><rect x="526" y="270" width="25" height="24" rx="3" fill="#e6f3e8" stroke="#1f6b34" stroke-width="1.1"/><text x="538.5" y="286.5" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><rect x="554" y="270" width="25" height="24" rx="3" fill="#e6f3e8" stroke="#1f6b34" stroke-width="1.1"/><text x="566.5" y="286.5" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><rect x="582" y="270" width="25" height="24" rx="3" fill="#e6f3e8" stroke="#1f6b34" stroke-width="1.1"/><text x="594.5" y="286.5" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><rect x="610" y="270" width="25" height="24" rx="3" fill="#e6f3e8" stroke="#1f6b34" stroke-width="1.1"/><text x="622.5" y="286.5" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><rect x="638" y="270" width="25" height="24" rx="3" fill="#e6f3e8" stroke="#1f6b34" stroke-width="1.1"/><text x="650.5" y="286.5" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><rect x="666" y="270" width="25" height="24" rx="3" fill="#e6f3e8" stroke="#1f6b34" stroke-width="1.1"/><text x="678.5" y="286.5" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><text x="388" y="330" font-size="10.5" fill="#333">13&#8319; &#8801; 1 + 12n and 4n &#8722; 1 &#8801; &#8722;(12n + 1) + 16n, so the</text><text x="388" y="348" font-size="10.5" fill="#333">two rows always add to a multiple of 16; both repeat</text><text x="388" y="366" font-size="10.5" fill="#333">with period 4: 1, 13, 9, 5 and 15, 3, 7, 11.</text>
  <rect x="18" y="394" width="684" height="96" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="414" font-size="11.5" fill="#1f6b34" font-weight="bold">13 &#8801; 1 (mod 4) DOES IT IN ONE LINE</text>
  <text x="40" y="440" font-size="11.5" fill="#333">13&#8319; &#8801; 1&#8319; = 1 (mod 4), so f(n) &#8801; 1 + 0 &#8722; 1 = 0. This is 5.3 Problem 4's fact a &#8722; 1 | a&#8319; &#8722; 1 with a = 13,</text>
  <text x="40" y="460" font-size="11.5" fill="#333">plus 4n. For divisibility by 4 alone, any 13&#8319; + bn + c works exactly when b &#8801; 0 and c &#8801; 3 (mod 4);</text>
  <text x="40" y="478" font-size="11.5" fill="#333">the term 4n is only needed for the stronger fact below.</text>
  <rect x="18" y="503" width="684" height="96" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="523" font-size="11.5" fill="#b06a10" font-weight="bold">THE HIDDEN 16: (1 + 12)&#8319; &#8801; 1 + 12n (mod 144)</text>
  <text x="40" y="549" font-size="11.5" fill="#333">Hence f(n) &#8801; 16n (mod 144): 16 always divides, 48 | f(n) iff 3 | n, 144 | f(n) iff 9 | n (checked to 3000).</text>
  <text x="40" y="569" font-size="11.5" fill="#333">And 13&#8319; + bn &#8722; 1 is always divisible by 16 exactly when b &#8801; 4 (mod 16): the 4n is chosen to cancel 12n.</text>
</svg>