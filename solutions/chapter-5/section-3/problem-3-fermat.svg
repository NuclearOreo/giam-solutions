<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 659" width="720" height="659" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="659" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">FERMAT&#8217;S LITTLE THEOREM AT p = 11, PROVED BY INDUCTION</text>
  <text x="360" y="58" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="bold">(k+1)&#185;&#185; + 10(k+1) = (k&#185;&#185; + 10k) + &#8721; C(11, j) k&#690; + 11&#160;&#160;&#160;(j = 1, &#8230;, 10)</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">Claim verified for x from &#8722;5000 to 20000; the step identity checked as a polynomial.</text>
  <rect x="18" y="118" width="684" height="236" rx="6" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="360" y="140" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the step works because 11 is prime: every middle entry of row 11 is a multiple of 11</text><text x="34" y="188" font-size="11.5" fill="#333" font-weight="bold">row 11</text><text x="119.0" y="188" font-size="11" fill="#999" text-anchor="middle" font-weight="normal">1</text><rect x="144.0" y="172" width="42" height="22" rx="4" fill="#1f6b34" fill-opacity="0.14" stroke="#1f6b34" stroke-width="1.1"/><text x="165.0" y="188" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">11</text><rect x="190.0" y="172" width="42" height="22" rx="4" fill="#1f6b34" fill-opacity="0.14" stroke="#1f6b34" stroke-width="1.1"/><text x="211.0" y="188" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">55</text><rect x="236.0" y="172" width="42" height="22" rx="4" fill="#1f6b34" fill-opacity="0.14" stroke="#1f6b34" stroke-width="1.1"/><text x="257.0" y="188" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">165</text><rect x="282.0" y="172" width="42" height="22" rx="4" fill="#1f6b34" fill-opacity="0.14" stroke="#1f6b34" stroke-width="1.1"/><text x="303.0" y="188" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">330</text><rect x="328.0" y="172" width="42" height="22" rx="4" fill="#1f6b34" fill-opacity="0.14" stroke="#1f6b34" stroke-width="1.1"/><text x="349.0" y="188" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">462</text><rect x="374.0" y="172" width="42" height="22" rx="4" fill="#1f6b34" fill-opacity="0.14" stroke="#1f6b34" stroke-width="1.1"/><text x="395.0" y="188" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">462</text><rect x="420.0" y="172" width="42" height="22" rx="4" fill="#1f6b34" fill-opacity="0.14" stroke="#1f6b34" stroke-width="1.1"/><text x="441.0" y="188" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">330</text><rect x="466.0" y="172" width="42" height="22" rx="4" fill="#1f6b34" fill-opacity="0.14" stroke="#1f6b34" stroke-width="1.1"/><text x="487.0" y="188" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">165</text><rect x="512.0" y="172" width="42" height="22" rx="4" fill="#1f6b34" fill-opacity="0.14" stroke="#1f6b34" stroke-width="1.1"/><text x="533.0" y="188" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">55</text><rect x="558.0" y="172" width="42" height="22" rx="4" fill="#1f6b34" fill-opacity="0.14" stroke="#1f6b34" stroke-width="1.1"/><text x="579.0" y="188" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">11</text><text x="625.0" y="188" font-size="11" fill="#999" text-anchor="middle" font-weight="normal">1</text><text x="360" y="214" font-size="11" fill="#1f6b34" text-anchor="middle">11, 55, 165, 330, 462, 462, 330, 165, 55, 11 &#8212; each is 11 times 1, 5, 15, 30, 42, 42, 30, 15, 5, 1</text><text x="34" y="260" font-size="11.5" fill="#333" font-weight="bold">row 9</text><text x="165.0" y="260" font-size="11" fill="#999" text-anchor="middle" font-weight="normal">1</text><rect x="190.0" y="244" width="42" height="22" rx="4" fill="#1f6b34" fill-opacity="0.14" stroke="#1f6b34" stroke-width="1.1"/><text x="211.0" y="260" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">9</text><rect x="236.0" y="244" width="42" height="22" rx="4" fill="#1f6b34" fill-opacity="0.14" stroke="#1f6b34" stroke-width="1.1"/><text x="257.0" y="260" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">36</text><rect x="282.0" y="244" width="42" height="22" rx="4" fill="#9b2c2c" fill-opacity="0.14" stroke="#9b2c2c" stroke-width="1.1"/><text x="303.0" y="260" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">84</text><rect x="328.0" y="244" width="42" height="22" rx="4" fill="#1f6b34" fill-opacity="0.14" stroke="#1f6b34" stroke-width="1.1"/><text x="349.0" y="260" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">126</text><rect x="374.0" y="244" width="42" height="22" rx="4" fill="#1f6b34" fill-opacity="0.14" stroke="#1f6b34" stroke-width="1.1"/><text x="395.0" y="260" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">126</text><rect x="420.0" y="244" width="42" height="22" rx="4" fill="#9b2c2c" fill-opacity="0.14" stroke="#9b2c2c" stroke-width="1.1"/><text x="441.0" y="260" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">84</text><rect x="466.0" y="244" width="42" height="22" rx="4" fill="#1f6b34" fill-opacity="0.14" stroke="#1f6b34" stroke-width="1.1"/><text x="487.0" y="260" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">36</text><rect x="512.0" y="244" width="42" height="22" rx="4" fill="#1f6b34" fill-opacity="0.14" stroke="#1f6b34" stroke-width="1.1"/><text x="533.0" y="260" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">9</text><text x="579.0" y="260" font-size="11" fill="#999" text-anchor="middle" font-weight="normal">1</text><text x="360" y="286" font-size="11" fill="#9b2c2c" text-anchor="middle">composite 9: the two entries 84 are not multiples of 9, so the same step would break</text><text x="40" y="316" font-size="11.5" fill="#333">Why: C(p, j) = p! / (j!(p&#8722;j)!). The prime p sits in the numerator, and for 0 &lt; j &lt; p nothing in the</text><text x="40" y="334" font-size="11.5" fill="#333">denominator can cancel it, since every factor there is smaller than p. Checked for p up to 17.</text>
  <rect x="18" y="368" width="684" height="134" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="388" font-size="11.5" fill="#1f6b34" font-weight="bold">THE SAME SHAPE AS PROBLEMS 1 AND 2</text>
  <text x="360" y="416" font-size="13.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">x&#185;&#185; + 10x = (x&#185;&#185; &#8722; x) + 11x</text>
  <text x="40" y="444" font-size="11.5" fill="#333">The bracket is divisible by 11 by Fermat&#8217;s little theorem, and 11x obviously is. In general</text>
  <text x="40" y="462" font-size="11.5" fill="#333">p | x&#7510; + (p&#8722;1)x for every prime p &#8212; checked for p = 2, 3, 5, 7, 11, 13. Problem 1&#8217;s x&#179; + 2x</text>
  <text x="40" y="480" font-size="11.5" fill="#333">variant is p = 3, and this problem is p = 11.</text>
  <rect x="18" y="515" width="684" height="128" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="535" font-size="11.5" fill="#b06a10" font-weight="bold">THIS TIME NO LARGER DIVISOR EXISTS</text>
  <text x="40" y="559" font-size="11.5" fill="#333">Problems 1 and 2 both turned out to be divisible by 6. Here x = 1 gives exactly 11, so no constant</text>
  <text x="40" y="577" font-size="11.5" fill="#333">bigger than 11 can divide every value; the gcd of the values for x = 1 to 300 is 11.</text>
  <text x="40" y="603" font-size="11.5" fill="#333">Curiously the bracket x&#185;&#185; &#8722; x on its own is divisible by 66 = 2 &#183; 3 &#183; 11. Adding 11x keeps the 11</text>
  <text x="40" y="621" font-size="11.5" fill="#333">but destroys the 2 and the 3 &#8212; at x = 1 the sum is odd and not a multiple of 3.</text>
</svg>