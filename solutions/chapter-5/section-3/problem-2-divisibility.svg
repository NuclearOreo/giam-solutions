<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 637" width="720" height="637" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="637" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">ANOTHER DIVISIBILITY BY THREE</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">for every x &#8712; &#8469;,&#160;&#160;3 | x&#179; + 5x</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">Verified for x up to 20000; the step adds 3(k&#178; + k + 2), checked as a polynomial identity.</text>
  <rect x="22" y="118" width="336" height="232" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">three residues settle it outright</text><text x="76" y="168" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">x mod 3</text><text x="192" y="168" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">x&#179; + 5x</text><text x="302" y="168" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">mod 3</text><line x1="42" y1="174" x2="338" y2="174" stroke="#3b5b9b" stroke-width="1"/><text x="76" y="200" font-size="12" fill="#666" text-anchor="middle">0</text><text x="192" y="200" font-size="12" fill="#1f3a68" text-anchor="middle">0&#179; + 5&#183;0 = 0</text><text x="302" y="200" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><text x="76" y="230" font-size="12" fill="#666" text-anchor="middle">1</text><text x="192" y="230" font-size="12" fill="#1f3a68" text-anchor="middle">1&#179; + 5&#183;1 = 6</text><text x="302" y="230" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><text x="76" y="260" font-size="12" fill="#666" text-anchor="middle">2</text><text x="192" y="260" font-size="12" fill="#1f3a68" text-anchor="middle">2&#179; + 5&#183;2 = 18</text><text x="302" y="260" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><text x="190.0" y="308" font-size="11.5" fill="#333" text-anchor="middle">Every residue gives 0, so the claim holds for</text><text x="190.0" y="326" font-size="11.5" fill="#333" text-anchor="middle">every integer &#8212; negatives included.</text><text x="190.0" y="344" font-size="10.5" fill="#777" text-anchor="middle" font-style="italic">checked for x = &#8722;5000 to 5000</text><rect x="372" y="118" width="336" height="232" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">for which c does 3 | x&#179; + cx ?</text><rect x="388.0" y="167" width="16" height="20" rx="3" fill="#1f6b34" fill-opacity="0.3" stroke="#1f6b34" stroke-width="1"/><text x="396.0" y="182" font-size="9" fill="#1f6b34" text-anchor="middle" font-weight="bold">-4</text><rect x="406.0" y="167" width="16" height="20" rx="3" fill="#f2f2f2" fill-opacity="1" stroke="#ddd" stroke-width="1"/><text x="414.0" y="182" font-size="9" fill="#bbb" text-anchor="middle" font-weight="normal">-3</text><rect x="424.0" y="167" width="16" height="20" rx="3" fill="#f2f2f2" fill-opacity="1" stroke="#ddd" stroke-width="1"/><text x="432.0" y="182" font-size="9" fill="#bbb" text-anchor="middle" font-weight="normal">-2</text><rect x="442.0" y="167" width="16" height="20" rx="3" fill="#1f6b34" fill-opacity="0.3" stroke="#1f6b34" stroke-width="1"/><text x="450.0" y="182" font-size="9" fill="#1f6b34" text-anchor="middle" font-weight="bold">-1</text><rect x="460.0" y="167" width="16" height="20" rx="3" fill="#f2f2f2" fill-opacity="1" stroke="#ddd" stroke-width="1"/><text x="468.0" y="182" font-size="9" fill="#bbb" text-anchor="middle" font-weight="normal">0</text><rect x="478.0" y="167" width="16" height="20" rx="3" fill="#f2f2f2" fill-opacity="1" stroke="#ddd" stroke-width="1"/><text x="486.0" y="182" font-size="9" fill="#bbb" text-anchor="middle" font-weight="normal">1</text><rect x="496.0" y="167" width="16" height="20" rx="3" fill="#1f6b34" fill-opacity="0.3" stroke="#1f6b34" stroke-width="1"/><text x="504.0" y="182" font-size="9" fill="#1f6b34" text-anchor="middle" font-weight="bold">2</text><rect x="514.0" y="167" width="16" height="20" rx="3" fill="#f2f2f2" fill-opacity="1" stroke="#ddd" stroke-width="1"/><text x="522.0" y="182" font-size="9" fill="#bbb" text-anchor="middle" font-weight="normal">3</text><rect x="532.0" y="167" width="16" height="20" rx="3" fill="#f2f2f2" fill-opacity="1" stroke="#ddd" stroke-width="1"/><text x="540.0" y="182" font-size="9" fill="#bbb" text-anchor="middle" font-weight="normal">4</text><rect x="550.0" y="167" width="16" height="20" rx="3" fill="#1f6b34" fill-opacity="0.3" stroke="#1f6b34" stroke-width="1"/><text x="558.0" y="182" font-size="9" fill="#1f6b34" text-anchor="middle" font-weight="bold">5</text><rect x="568.0" y="167" width="16" height="20" rx="3" fill="#f2f2f2" fill-opacity="1" stroke="#ddd" stroke-width="1"/><text x="576.0" y="182" font-size="9" fill="#bbb" text-anchor="middle" font-weight="normal">6</text><rect x="586.0" y="167" width="16" height="20" rx="3" fill="#f2f2f2" fill-opacity="1" stroke="#ddd" stroke-width="1"/><text x="594.0" y="182" font-size="9" fill="#bbb" text-anchor="middle" font-weight="normal">7</text><rect x="604.0" y="167" width="16" height="20" rx="3" fill="#1f6b34" fill-opacity="0.3" stroke="#1f6b34" stroke-width="1"/><text x="612.0" y="182" font-size="9" fill="#1f6b34" text-anchor="middle" font-weight="bold">8</text><rect x="622.0" y="167" width="16" height="20" rx="3" fill="#f2f2f2" fill-opacity="1" stroke="#ddd" stroke-width="1"/><text x="630.0" y="182" font-size="9" fill="#bbb" text-anchor="middle" font-weight="normal">9</text><rect x="640.0" y="167" width="16" height="20" rx="3" fill="#f2f2f2" fill-opacity="1" stroke="#ddd" stroke-width="1"/><text x="648.0" y="182" font-size="9" fill="#bbb" text-anchor="middle" font-weight="normal">10</text><rect x="658.0" y="167" width="16" height="20" rx="3" fill="#1f6b34" fill-opacity="0.3" stroke="#1f6b34" stroke-width="1"/><text x="666.0" y="182" font-size="9" fill="#1f6b34" text-anchor="middle" font-weight="bold">11</text><rect x="676.0" y="167" width="16" height="20" rx="3" fill="#f2f2f2" fill-opacity="1" stroke="#ddd" stroke-width="1"/><text x="684.0" y="182" font-size="9" fill="#bbb" text-anchor="middle" font-weight="normal">12</text><text x="390" y="210" font-size="11" fill="#1f6b34">green: the claim holds for every x</text><text x="390" y="236" font-size="11.5" fill="#333">These are exactly &#8722;4, &#8722;1, 2, 5, 8, 11 &#8212; the c with</text><text x="540.0" y="264" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">3 | c + 1</text><text x="390" y="290" font-size="11" fill="#555">found by search and matching the predicted list exactly.</text><text x="390" y="308" font-size="11" fill="#555">The problem&#8217;s c = 5 works because 3 divides 6.</text>
  <rect x="18" y="364" width="684" height="132" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="384" font-size="11.5" fill="#1f6b34" font-weight="bold">IT IS PROBLEM 1 WITH SIX ADDED</text>
  <text x="360" y="414" font-size="13.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">x&#179; + 5x = (x&#179; &#8722; x) + 6x</text>
  <text x="40" y="442" font-size="11.5" fill="#333">Three divides the first bracket by 5.3 Problem 1, and three divides 6x outright, so it divides the</text>
  <text x="40" y="460" font-size="11.5" fill="#333">sum. No fresh induction is needed &#8212; this problem is a corollary of the previous one.</text>
  <text x="40" y="484" font-size="11" fill="#555">The step increments match too: 3k(k+1) there against 3(k&#178;+k+2) here, differing by exactly 6.</text>
  <rect x="18" y="509" width="684" height="112" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="529" font-size="11.5" fill="#b06a10" font-weight="bold">AND AGAIN SIX DIVIDES IT</text>
  <text x="40" y="553" font-size="11.5" fill="#333">Both pieces are divisible by 6 &#8212; the first by 5.3 Problem 1&#8217;s sharper form, the second visibly &#8212;</text>
  <text x="40" y="571" font-size="11.5" fill="#333">so 6 | x&#179; + 5x. Verified for x from &#8722;5000 to 5000, and 6 is again the largest such constant:</text>
  <text x="40" y="597" font-size="11.5" fill="#333">the greatest common divisor of the values for x = 1 to 300 is exactly 6.</text>
</svg>