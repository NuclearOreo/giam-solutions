<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 615" width="720" height="615" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="615" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">MULTIPLY THE HYPOTHESIS BY 8</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">8&#7503;&#8314;&#185; + 6 = 8(8&#7503; + 6) &#8722; 42</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">Both terms are multiples of 7, so 7 | 8&#8319; + 6 for every n &#8712; &#8469;, starting from 8&#8304; + 6 = 7. Verified for n up to 3000.</text>
  <rect x="22" y="118" width="336" height="262" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the values and their quotients by 7</text><text x="48" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">n</text><text x="122" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">8&#8319;</text><text x="190" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">+ 6</text><text x="258" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">= f(n)</text><text x="324" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">&#247; 7</text><line x1="34" y1="170" x2="346" y2="170" stroke="#3b5b9b" stroke-width="1"/><text x="48" y="190" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">0</text><text x="122" y="190" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">1</text><text x="190" y="190" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">6</text><text x="258" y="190" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">7</text><text x="324" y="190" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">1</text><text x="48" y="212" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">1</text><text x="122" y="212" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">8</text><text x="190" y="212" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">6</text><text x="258" y="212" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">14</text><text x="324" y="212" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">2</text><text x="48" y="234" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">2</text><text x="122" y="234" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">64</text><text x="190" y="234" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">6</text><text x="258" y="234" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">70</text><text x="324" y="234" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">10</text><text x="48" y="256" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">3</text><text x="122" y="256" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">512</text><text x="190" y="256" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">6</text><text x="258" y="256" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">518</text><text x="324" y="256" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">74</text><text x="48" y="278" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">4</text><text x="122" y="278" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">4096</text><text x="190" y="278" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">6</text><text x="258" y="278" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">4102</text><text x="324" y="278" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">586</text><text x="48" y="300" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">5</text><text x="122" y="300" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">32768</text><text x="190" y="300" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">6</text><text x="258" y="300" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">32774</text><text x="324" y="300" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">4682</text><text x="48" y="322" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">6</text><text x="122" y="322" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">262144</text><text x="190" y="322" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">6</text><text x="258" y="322" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">262150</text><text x="324" y="322" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">37450</text><text x="190.0" y="350" font-size="10.5" fill="#333" text-anchor="middle">quotient = 1 + 8 + 8&#178; + &#8943; + 8&#8319;&#8315;&#185;, plus 1</text><text x="190.0" y="368" font-size="10.5" fill="#333" text-anchor="middle">each step: f(k+1) = 8 f(k) &#8722; 42 = f(k) + 7 &#183; 8&#7503;</text><rect x="372" y="118" width="336" height="262" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">in base 8 the digits always sum to 7</text><text x="390" y="176" font-size="10.5" fill="#666">n = 1</text><rect x="568" y="160" width="24" height="24" rx="3" fill="#f7dcb8" stroke="#b06a10" stroke-width="1.1"/><text x="580.0" y="176.5" font-size="11.5" fill="#7a4508" text-anchor="middle" font-weight="bold" font-family="Menlo, monospace">1</text><rect x="595" y="160" width="24" height="24" rx="3" fill="#f7dcb8" stroke="#b06a10" stroke-width="1.1"/><text x="607.0" y="176.5" font-size="11.5" fill="#7a4508" text-anchor="middle" font-weight="bold" font-family="Menlo, monospace">6</text><text x="630" y="176" font-size="10.5" fill="#1f6b34">&#8320;&#8328;  1 + 6 = 7</text><text x="390" y="210" font-size="10.5" fill="#666">n = 2</text><rect x="541" y="194" width="24" height="24" rx="3" fill="#f7dcb8" stroke="#b06a10" stroke-width="1.1"/><text x="553.0" y="210.5" font-size="11.5" fill="#7a4508" text-anchor="middle" font-weight="bold" font-family="Menlo, monospace">1</text><rect x="568" y="194" width="24" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="580.0" y="210.5" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal" font-family="Menlo, monospace">0</text><rect x="595" y="194" width="24" height="24" rx="3" fill="#f7dcb8" stroke="#b06a10" stroke-width="1.1"/><text x="607.0" y="210.5" font-size="11.5" fill="#7a4508" text-anchor="middle" font-weight="bold" font-family="Menlo, monospace">6</text><text x="630" y="210" font-size="10.5" fill="#1f6b34">&#8320;&#8328;  1 + 6 = 7</text><text x="390" y="244" font-size="10.5" fill="#666">n = 3</text><rect x="514" y="228" width="24" height="24" rx="3" fill="#f7dcb8" stroke="#b06a10" stroke-width="1.1"/><text x="526.0" y="244.5" font-size="11.5" fill="#7a4508" text-anchor="middle" font-weight="bold" font-family="Menlo, monospace">1</text><rect x="541" y="228" width="24" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="553.0" y="244.5" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal" font-family="Menlo, monospace">0</text><rect x="568" y="228" width="24" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="580.0" y="244.5" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal" font-family="Menlo, monospace">0</text><rect x="595" y="228" width="24" height="24" rx="3" fill="#f7dcb8" stroke="#b06a10" stroke-width="1.1"/><text x="607.0" y="244.5" font-size="11.5" fill="#7a4508" text-anchor="middle" font-weight="bold" font-family="Menlo, monospace">6</text><text x="630" y="244" font-size="10.5" fill="#1f6b34">&#8320;&#8328;  1 + 6 = 7</text><text x="390" y="278" font-size="10.5" fill="#666">n = 4</text><rect x="487" y="262" width="24" height="24" rx="3" fill="#f7dcb8" stroke="#b06a10" stroke-width="1.1"/><text x="499.0" y="278.5" font-size="11.5" fill="#7a4508" text-anchor="middle" font-weight="bold" font-family="Menlo, monospace">1</text><rect x="514" y="262" width="24" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="526.0" y="278.5" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal" font-family="Menlo, monospace">0</text><rect x="541" y="262" width="24" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="553.0" y="278.5" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal" font-family="Menlo, monospace">0</text><rect x="568" y="262" width="24" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="580.0" y="278.5" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal" font-family="Menlo, monospace">0</text><rect x="595" y="262" width="24" height="24" rx="3" fill="#f7dcb8" stroke="#b06a10" stroke-width="1.1"/><text x="607.0" y="278.5" font-size="11.5" fill="#7a4508" text-anchor="middle" font-weight="bold" font-family="Menlo, monospace">6</text><text x="630" y="278" font-size="10.5" fill="#1f6b34">&#8320;&#8328;  1 + 6 = 7</text><text x="390" y="312" font-size="10.5" fill="#666">n = 5</text><rect x="460" y="296" width="24" height="24" rx="3" fill="#f7dcb8" stroke="#b06a10" stroke-width="1.1"/><text x="472.0" y="312.5" font-size="11.5" fill="#7a4508" text-anchor="middle" font-weight="bold" font-family="Menlo, monospace">1</text><rect x="487" y="296" width="24" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="499.0" y="312.5" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal" font-family="Menlo, monospace">0</text><rect x="514" y="296" width="24" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="526.0" y="312.5" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal" font-family="Menlo, monospace">0</text><rect x="541" y="296" width="24" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="553.0" y="312.5" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal" font-family="Menlo, monospace">0</text><rect x="568" y="296" width="24" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="580.0" y="312.5" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal" font-family="Menlo, monospace">0</text><rect x="595" y="296" width="24" height="24" rx="3" fill="#f7dcb8" stroke="#b06a10" stroke-width="1.1"/><text x="607.0" y="312.5" font-size="11.5" fill="#7a4508" text-anchor="middle" font-weight="bold" font-family="Menlo, monospace">6</text><text x="630" y="312" font-size="10.5" fill="#1f6b34">&#8320;&#8328;  1 + 6 = 7</text><text x="388" y="350" font-size="10.5" fill="#333">8&#8319; + 6 is written 10&#8230;06 in base 8. Since 8 &#8801; 1 (mod 7),</text><text x="388" y="368" font-size="10.5" fill="#333">a number and its base-8 digit sum agree mod 7.</text>
  <rect x="18" y="394" width="684" height="96" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="414" font-size="11.5" fill="#1f6b34" font-weight="bold">8 &#8801; 1 (mod 7) DOES IT IN ONE LINE</text>
  <text x="40" y="440" font-size="11.5" fill="#333">8&#8319; + 6 &#8801; 1 + 6 = 7 &#8801; 0. Equivalently 8&#8319; + 6 = (8&#8319; &#8722; 1) + 7, and 7 = 8 &#8722; 1 divides 8&#8319; &#8722; 1 by</text>
  <text x="40" y="460" font-size="11.5" fill="#333">5.3 Problem 4's general fact. The constant 6 can be replaced by any c &#8801; 6 (mod 7), and by nothing else.</text>
  <rect x="18" y="503" width="684" height="96" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="523" font-size="11.5" fill="#b06a10" font-weight="bold">7 IS BEST, BUT 14 FROM n = 1 AND 49 ONE TIME IN SEVEN</text>
  <text x="40" y="549" font-size="11.5" fill="#333">f(0) = 7, so no larger constant works for all n; for n &#8805; 1 the values are even, so 14 divides them.</text>
  <text x="40" y="569" font-size="11.5" fill="#333">As in Problem 7, 8&#8319; = (1 + 7)&#8319; &#8801; 1 + 7n (mod 49), so f(n) &#8801; 7(n + 1): 49 | f(n) iff n &#8801; 6 (mod 7).</text>
</svg>