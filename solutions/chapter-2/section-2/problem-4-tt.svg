<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="Georgia, 'Times New Roman', serif">
  <rect width="640" height="380" fill="white"/>

  <text x="320" y="30" font-size="14" font-style="italic" fill="#444" text-anchor="middle">¬(A ⟹ B) is true only when the conditional is broken: A holds but B fails.</text>

  <g font-size="14.5" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="80"  y="76">A</text>
    <text x="160" y="76">B</text>
    <text x="250" y="76">¬B</text>
    <text x="360" y="76">A ⟹ B</text>
    <text x="470" y="76" fill="#2a5db0">¬(A ⟹ B)</text>
    <text x="590" y="76" fill="#8a3b12">A ∧ ¬B</text>
  </g>
  <line x1="40" y1="88" x2="620" y2="88" stroke="#999" stroke-width="0.9"/>
  <line x1="415" y1="56" x2="415" y2="330" stroke="#e0e0e0"/>

  <g font-size="14.5" text-anchor="middle">
    <text x="80" y="128">T</text><text x="160" y="128">T</text><text x="250" y="128">F</text><text x="360" y="128">T</text><text x="470" y="128" fill="#2a5db0" font-weight="bold">F</text><text x="590" y="128" fill="#8a3b12" font-weight="bold">F</text>
    <line x1="40" y1="146" x2="620" y2="146" stroke="#eee"/>
    <rect x="40" y="148" width="580" height="34" fill="#eef5ee"/>
    <text x="80" y="172">T</text><text x="160" y="172">F</text><text x="250" y="172">T</text><text x="360" y="172">F</text><text x="470" y="172" fill="#2a5db0" font-weight="bold">T</text><text x="590" y="172" fill="#8a3b12" font-weight="bold">T</text>
    <line x1="40" y1="182" x2="620" y2="182" stroke="#eee"/>
    <text x="80" y="208">F</text><text x="160" y="208">T</text><text x="250" y="208">F</text><text x="360" y="208">T</text><text x="470" y="208" fill="#2a5db0" font-weight="bold">F</text><text x="590" y="208" fill="#8a3b12" font-weight="bold">F</text>
    <line x1="40" y1="226" x2="620" y2="226" stroke="#eee"/>
    <text x="80" y="252">F</text><text x="160" y="252">F</text><text x="250" y="252">T</text><text x="360" y="252">T</text><text x="470" y="252" fill="#2a5db0" font-weight="bold">F</text><text x="590" y="252" fill="#8a3b12" font-weight="bold">F</text>
  </g>
  <line x1="40" y1="270" x2="620" y2="270" stroke="#999" stroke-width="0.9"/>

  <text x="320" y="298" font-size="12.5" fill="#666" text-anchor="middle" font-style="italic">The two blue/brown columns match: the only true row is A = T, B = F (highlighted).</text>

  <rect x="150" y="316" width="340" height="42" fill="#eef5ee" stroke="#bcd9bc"/>
  <text x="320" y="343" font-size="16" fill="#1b5e20" text-anchor="middle" font-weight="bold">¬(A ⟹ B)  ≡  A ∧ ¬B</text>
</svg>
