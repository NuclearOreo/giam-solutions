<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="340" fill="white"/>

  <text x="360" y="24" font-size="13" font-style="italic" fill="#444" text-anchor="middle">Two Riemann sums bracket the integral. The right-hand sum proves the original; the left-hand sum proves the converse.</text>

  <!-- ============ PANEL 1: right-hand sum (underestimate) ============ -->
  <text x="180" y="52" font-size="12.5" font-weight="bold" fill="#2a5db0" text-anchor="middle">Right-hand rectangles — UNDER the curve</text>
  <text x="180" y="68" font-size="11.5" fill="#555" text-anchor="middle">Σ f(n)  ≤  ∫₀^∞ f(x) dx</text>

  <!-- rectangles under: [n-1,n] height f(n) -->
  <g fill="#dbe7f5" stroke="#2a5db0" stroke-width="0.9">
    <rect x="60"  y="175"   width="40" height="75"/>
    <rect x="100" y="200"   width="40" height="50"/>
    <rect x="140" y="212.5" width="40" height="37.5"/>
    <rect x="180" y="220"   width="40" height="30"/>
    <rect x="220" y="225"   width="40" height="25"/>
    <rect x="260" y="228.6" width="40" height="21.4"/>
  </g>

  <!-- curve -->
  <polyline fill="none" stroke="#8a3b12" stroke-width="2" points="60.0,100.0 68.0,125.0 76.0,142.9 84.0,156.2 92.0,166.7 100.0,175.0 108.0,181.8 116.0,187.5 124.0,192.3 132.0,196.4 140.0,200.0 148.0,203.1 156.0,205.9 164.0,208.3 172.0,210.5 180.0,212.5 188.0,214.3 196.0,215.9 204.0,217.4 212.0,218.8 220.0,220.0 228.0,221.2 236.0,222.2 244.0,223.2 252.0,224.1 260.0,225.0 268.0,225.8 276.0,226.6 284.0,227.3 292.0,227.9 300.0,228.6"/>
  <text x="306" y="226" font-size="11.5" font-style="italic" fill="#8a3b12">f(x)</text>

  <!-- axes -->
  <g stroke="#333" stroke-width="1.3">
    <line x1="60" y1="250" x2="316" y2="250"/>
    <line x1="60" y1="90" x2="60" y2="262"/>
  </g>
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="60" y="266">0</text><text x="100" y="266">1</text><text x="140" y="266">2</text>
    <text x="180" y="266">3</text><text x="220" y="266">4</text><text x="260" y="266">5</text>
  </g>
  <text x="180" y="292" font-size="11" fill="#2a5db0" text-anchor="middle">each bar of height f(n) fits inside its strip,</text>
  <text x="180" y="308" font-size="11" fill="#2a5db0" text-anchor="middle">so the total bar area is at most the area under f.</text>
  <text x="180" y="328" font-size="11.5" fill="#1a3a63" text-anchor="middle" font-weight="bold">integral finite ⟹ series finite</text>

  <!-- divider -->
  <line x1="360" y1="40" x2="360" y2="330" stroke="#e0e0e0"/>

  <!-- ============ PANEL 2: left-hand sum (overestimate) ============ -->
  <text x="540" y="52" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">Left-hand rectangles — OVER the curve</text>
  <text x="540" y="68" font-size="11.5" fill="#555" text-anchor="middle">∫₁^∞ f(x) dx  ≤  Σ f(n)</text>

  <!-- shift +360: rectangles [n,n+1] height f(n) starting n=1 -->
  <g fill="#d7ebd7" stroke="#1b5e20" stroke-width="0.9">
    <rect x="460" y="175"   width="40" height="75"/>
    <rect x="500" y="200"   width="40" height="50"/>
    <rect x="540" y="212.5" width="40" height="37.5"/>
    <rect x="580" y="220"   width="40" height="30"/>
    <rect x="620" y="225"   width="40" height="25"/>
  </g>

  <polyline fill="none" stroke="#8a3b12" stroke-width="2" points="420.0,100.0 428.0,125.0 436.0,142.9 444.0,156.2 452.0,166.7 460.0,175.0 468.0,181.8 476.0,187.5 484.0,192.3 492.0,196.4 500.0,200.0 508.0,203.1 516.0,205.9 524.0,208.3 532.0,210.5 540.0,212.5 548.0,214.3 556.0,215.9 564.0,217.4 572.0,218.8 580.0,220.0 588.0,221.2 596.0,222.2 604.0,223.2 612.0,224.1 620.0,225.0 628.0,225.8 636.0,226.6 644.0,227.3 652.0,227.9 660.0,228.6"/>
  <text x="666" y="226" font-size="11.5" font-style="italic" fill="#8a3b12">f(x)</text>

  <g stroke="#333" stroke-width="1.3">
    <line x1="420" y1="250" x2="676" y2="250"/>
    <line x1="420" y1="90" x2="420" y2="262"/>
  </g>
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="420" y="266">0</text><text x="460" y="266">1</text><text x="500" y="266">2</text>
    <text x="540" y="266">3</text><text x="580" y="266">4</text><text x="620" y="266">5</text>
  </g>
  <text x="540" y="292" font-size="11" fill="#1b5e20" text-anchor="middle">each bar of height f(n) covers its strip,</text>
  <text x="540" y="308" font-size="11" fill="#1b5e20" text-anchor="middle">so the total bar area is at least the area under f on [1, ∞).</text>
  <text x="540" y="328" font-size="11.5" fill="#1b5e20" text-anchor="middle" font-weight="bold">series finite ⟹ integral finite (the converse)</text>
</svg>
