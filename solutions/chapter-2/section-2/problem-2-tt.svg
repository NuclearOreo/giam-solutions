<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Georgia, 'Times New Roman', serif">
  <rect width="640" height="360" fill="white"/>

  <text x="320" y="30" font-size="14" font-style="italic" fill="#444" text-anchor="middle">The two final columns are identical in all four rows — so A ⟹ B and ¬A ∨ B are equivalent.</text>

  <!-- headers -->
  <g font-size="15" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="90"  y="76">A</text>
    <text x="170" y="76">B</text>
    <text x="260" y="76">¬A</text>
    <text x="380" y="76" fill="#2a5db0">A ⟹ B</text>
    <text x="540" y="76" fill="#8a3b12">¬A ∨ B</text>
  </g>
  <line x1="40" y1="88" x2="600" y2="88" stroke="#999" stroke-width="0.9"/>
  <line x1="320" y1="56" x2="320" y2="320" stroke="#e0e0e0"/>

  <g font-size="15" text-anchor="middle">
    <!-- row 1 1 -->
    <text x="90" y="128">T</text><text x="170" y="128">T</text><text x="260" y="128">F</text><text x="380" y="128" fill="#2a5db0" font-weight="bold">T</text><text x="540" y="128" fill="#8a3b12" font-weight="bold">T</text>
    <line x1="40" y1="146" x2="600" y2="146" stroke="#eee"/>
    <!-- row 1 0 -->
    <text x="90" y="176">T</text><text x="170" y="176">F</text><text x="260" y="176">F</text><text x="380" y="176" fill="#2a5db0" font-weight="bold">F</text><text x="540" y="176" fill="#8a3b12" font-weight="bold">F</text>
    <line x1="40" y1="194" x2="600" y2="194" stroke="#eee"/>
    <!-- row 0 1 -->
    <text x="90" y="224">F</text><text x="170" y="224">T</text><text x="260" y="224">T</text><text x="380" y="224" fill="#2a5db0" font-weight="bold">T</text><text x="540" y="224" fill="#8a3b12" font-weight="bold">T</text>
    <line x1="40" y1="242" x2="600" y2="242" stroke="#eee"/>
    <!-- row 0 0 -->
    <text x="90" y="272">F</text><text x="170" y="272">F</text><text x="260" y="272">T</text><text x="380" y="272" fill="#2a5db0" font-weight="bold">T</text><text x="540" y="272" fill="#8a3b12" font-weight="bold">T</text>
  </g>
  <line x1="40" y1="290" x2="600" y2="290" stroke="#999" stroke-width="0.9"/>

  <!-- boxed conclusion -->
  <rect x="140" y="308" width="360" height="38" fill="#eef5ee" stroke="#bcd9bc"/>
  <text x="320" y="333" font-size="15" fill="#1b5e20" text-anchor="middle" font-weight="bold">A ⟹ B   ≡   ¬A ∨ B</text>
</svg>
