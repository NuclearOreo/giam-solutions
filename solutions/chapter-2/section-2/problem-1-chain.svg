<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="470" fill="white"/>

  <text x="350" y="28" font-size="13.5" font-style="italic" fill="#444" text-anchor="middle">Yes — implication chains. If A forces B and B forces C, then A forces C.</text>

  <!-- chain diagram -->
  <g font-size="20" text-anchor="middle">
    <circle cx="130" cy="90" r="26" fill="#eaf1fb" stroke="#2a5db0"/><text x="130" y="97">A</text>
    <circle cx="350" cy="90" r="26" fill="#eef5ee" stroke="#1b5e20"/><text x="350" y="97">B</text>
    <circle cx="570" cy="90" r="26" fill="#fdf2ee" stroke="#8a3b12"/><text x="570" y="97">C</text>
  </g>
  <g stroke="#555" stroke-width="2" marker-end="url(#a)">
    <line x1="158" y1="90" x2="322" y2="90"/>
    <line x1="378" y1="90" x2="542" y2="90"/>
  </g>
  <!-- dashed derived arrow A->C -->
  <path d="M130,120 C130,175 570,175 570,120" fill="none" stroke="#8a3b12" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ab)"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a3b12"/></marker>
  </defs>
  <text x="240" y="80" font-size="12.5" fill="#2a5db0" text-anchor="middle">A ⟹ B</text>
  <text x="460" y="80" font-size="12.5" fill="#1b5e20" text-anchor="middle">B ⟹ C</text>
  <text x="350" y="168" font-size="12.5" fill="#8a3b12" text-anchor="middle" font-weight="bold">so A ⟹ C</text>

  <!-- statement box -->
  <rect x="80" y="196" width="540" height="44" fill="#eef5ee" stroke="#bcd9bc"/>
  <text x="350" y="223" font-size="15" fill="#1b5e20" text-anchor="middle" font-weight="bold">[ (A ⟹ B) ∧ (B ⟹ C) ]  ⟹  (A ⟹ C)   is a tautology.</text>

  <!-- truth table verifying -->
  <text x="350" y="268" font-size="12.5" fill="#222" text-anchor="middle" font-weight="bold">Verification — the whole conditional is true in all 8 rows (1 = true):</text>
  <g font-size="12" text-anchor="middle">
    <text x="90" y="292" font-weight="bold">A B C</text>
    <text x="240" y="292" font-weight="bold">A⟹B</text>
    <text x="330" y="292" font-weight="bold">B⟹C</text>
    <text x="440" y="292" font-weight="bold">premise</text>
    <text x="540" y="292" font-weight="bold">A⟹C</text>
    <text x="640" y="292" font-weight="bold">whole</text>
  </g>
  <line x1="40" y1="300" x2="660" y2="300" stroke="#999" stroke-width="0.8"/>
  <g font-size="12" text-anchor="middle" fill="#333">
    <text x="90" y="320">1 1 1</text><text x="240" y="320">1</text><text x="330" y="320">1</text><text x="440" y="320">1</text><text x="540" y="320">1</text><text x="640" y="320" fill="#1b5e20" font-weight="bold">1</text>
    <text x="90" y="338">1 1 0</text><text x="240" y="338">1</text><text x="330" y="338">0</text><text x="440" y="338">0</text><text x="540" y="338">0</text><text x="640" y="338" fill="#1b5e20" font-weight="bold">1</text>
    <text x="90" y="356">1 0 1</text><text x="240" y="356">0</text><text x="330" y="356">1</text><text x="440" y="356">0</text><text x="540" y="356">1</text><text x="640" y="356" fill="#1b5e20" font-weight="bold">1</text>
    <text x="90" y="374">1 0 0</text><text x="240" y="374">0</text><text x="330" y="374">1</text><text x="440" y="374">0</text><text x="540" y="374">0</text><text x="640" y="374" fill="#1b5e20" font-weight="bold">1</text>
    <text x="90" y="392">0 1 1</text><text x="240" y="392">1</text><text x="330" y="392">1</text><text x="440" y="392">1</text><text x="540" y="392">1</text><text x="640" y="392" fill="#1b5e20" font-weight="bold">1</text>
    <text x="90" y="410">0 1 0</text><text x="240" y="410">1</text><text x="330" y="410">0</text><text x="440" y="410">0</text><text x="540" y="410">1</text><text x="640" y="410" fill="#1b5e20" font-weight="bold">1</text>
    <text x="90" y="428">0 0 1</text><text x="240" y="428">1</text><text x="330" y="428">1</text><text x="440" y="428">1</text><text x="540" y="428">1</text><text x="640" y="428" fill="#1b5e20" font-weight="bold">1</text>
    <text x="90" y="446">0 0 0</text><text x="240" y="446">1</text><text x="330" y="446">1</text><text x="440" y="446">1</text><text x="540" y="446">1</text><text x="640" y="446" fill="#1b5e20" font-weight="bold">1</text>
  </g>
  <line x1="40" y1="454" x2="660" y2="454" stroke="#999" stroke-width="0.8"/>
</svg>
