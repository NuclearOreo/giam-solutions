<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="480" fill="white"/>

  <text x="350" y="26" font-size="13" font-style="italic" fill="#444" text-anchor="middle">Six ordered pairs of operations, six candidate laws. A single counterexample kills each false one.</text>

  <!-- header -->
  <g font-size="12.5" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="120" y="60">law</text>
    <text x="330" y="60">statement</text>
    <text x="565" y="60">verdict / counterexample</text>
  </g>
  <line x1="30" y1="70" x2="670" y2="70" stroke="#999" stroke-width="0.9"/>

  <g font-size="12.5">
    <!-- 1 -->
    <text x="45" y="98" fill="#333">+ over ·</text>
    <text x="200" y="98" fill="#222">x + (y·z) = (x+y)·(x+z)</text>
    <text x="470" y="98" fill="#c0392b">✗  1+(2·3)=7  but  3·4=12</text>
    <line x1="30" y1="110" x2="670" y2="110" stroke="#f0f0f0"/>

    <!-- 2 -->
    <text x="45" y="134" fill="#333">+ over ^</text>
    <text x="200" y="134" fill="#222">x + y^z = (x+y)^(x+z)</text>
    <text x="470" y="134" fill="#c0392b">✗  1+2³=9  but  3⁴=81</text>
    <line x1="30" y1="146" x2="670" y2="146" stroke="#f0f0f0"/>

    <!-- 3 VALID -->
    <rect x="30" y="150" width="640" height="34" fill="#eef5ee"/>
    <text x="45" y="172" fill="#1b5e20" font-weight="bold">· over +</text>
    <text x="200" y="172" fill="#1b5e20" font-weight="bold">x · (y+z) = x·y + x·z</text>
    <text x="470" y="172" fill="#1b5e20" font-weight="bold">✓  VALID  — the familiar one</text>

    <!-- 4 -->
    <text x="45" y="208" fill="#333">· over ^</text>
    <text x="200" y="208" fill="#222">x · y^z = (x·y)^(x·z)</text>
    <text x="470" y="208" fill="#c0392b">✗  2·3²=18  but  6⁴=1296</text>
    <line x1="30" y1="220" x2="670" y2="220" stroke="#f0f0f0"/>

    <!-- 5 -->
    <text x="45" y="244" fill="#333">^ over +</text>
    <text x="200" y="244" fill="#222">x^(y+z) = x^y + x^z</text>
    <text x="470" y="244" fill="#c0392b">✗  2³=8  but  2+4=6</text>
    <line x1="30" y1="256" x2="670" y2="256" stroke="#f0f0f0"/>

    <!-- 6 -->
    <text x="45" y="280" fill="#333">^ over ·</text>
    <text x="200" y="280" fill="#222">x^(y·z) = x^y · x^z</text>
    <text x="470" y="280" fill="#c0392b">✗  2⁶=64  but  4·8=32</text>
  </g>
  <line x1="30" y1="292" x2="670" y2="292" stroke="#999" stroke-width="0.9"/>

  <!-- the right-hand-side subtlety -->
  <rect x="30" y="306" width="640" height="98" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="50" y="328" font-size="12.5" fill="#1a3a63" font-weight="bold">But exponentiation is not commutative — so it also has a RIGHT-hand form:</text>
  <text x="60" y="352" font-size="12.5" fill="#c0392b">^ over +  (right):   (x+y)^z = x^z + y^z    ✗   (3+4)²=49  but  9+16=25</text>
  <rect x="52" y="362" width="600" height="32" fill="#d7ebd7"/>
  <text x="60" y="384" font-size="13" fill="#1b5e20" font-weight="bold">^ over ·  (right):   (x·y)^z = x^z · y^z    ✓  VALID — the second true law</text>

  <!-- final box -->
  <rect x="90" y="418" width="520" height="48" fill="#eef5ee" stroke="#bcd9bc"/>
  <text x="350" y="440" font-size="14" fill="#1b5e20" text-anchor="middle" font-weight="bold">The two valid laws:   x(y+z) = xy + xz    and    (xy)^z = x^z y^z</text>
  <text x="350" y="459" font-size="11.5" fill="#1b5e20" text-anchor="middle">multiplication over addition,  and  exponentiation over multiplication</text>
</svg>
