<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" width="740" height="440" font-family="Georgia, 'Times New Roman', serif">
  <rect width="740" height="440" fill="white"/>

  <text x="370" y="28" font-size="14" font-style="italic" fill="#444" text-anchor="middle">XOR built from AND, OR, NOT:   A ⊕ B = (A ∧ ¬B) ∨ (¬A ∧ B).</text>

  <!-- ===== wires (draw first, under gates) ===== -->
  <g stroke="#333" stroke-width="1.8" fill="none">
    <!-- A rail: source to AND1 top input, y=89 -->
    <line x1="45" y1="89" x2="360" y2="89"/>
    <!-- A branch down to NOT-A -->
    <line x1="110" y1="89" x2="110" y2="272"/>
    <line x1="110" y1="272" x2="150" y2="272"/>
    <!-- B rail: source to AND2 bottom input, y=351 -->
    <line x1="45" y1="351" x2="360" y2="351"/>
    <!-- B branch up to NOT-B -->
    <line x1="90" y1="351" x2="90" y2="168"/>
    <line x1="90" y1="168" x2="150" y2="168"/>
    <!-- NOT-B output -> AND1 bottom input (360,111) -->
    <line x1="202" y1="168" x2="330" y2="168"/>
    <line x1="330" y1="168" x2="330" y2="111"/>
    <line x1="330" y1="111" x2="360" y2="111"/>
    <!-- NOT-A output -> AND2 top input (360,329) -->
    <line x1="202" y1="272" x2="330" y2="272"/>
    <line x1="330" y1="272" x2="330" y2="329"/>
    <line x1="330" y1="329" x2="360" y2="329"/>
    <!-- AND1 output -> OR top input (531,209) -->
    <line x1="410" y1="100" x2="470" y2="100"/>
    <line x1="470" y1="100" x2="470" y2="209"/>
    <line x1="470" y1="209" x2="531" y2="209"/>
    <!-- AND2 output -> OR bottom input (531,231) -->
    <line x1="410" y1="340" x2="470" y2="340"/>
    <line x1="470" y1="340" x2="470" y2="231"/>
    <line x1="470" y1="231" x2="531" y2="231"/>
    <!-- OR output -> Q -->
    <line x1="583" y1="220" x2="660" y2="220"/>
  </g>

  <!-- junction dots -->
  <g fill="#333">
    <circle cx="110" cy="89" r="4"/>
    <circle cx="90" cy="351" r="4"/>
  </g>

  <!-- input / output labels -->
  <g font-size="16" font-weight="bold" fill="#2a5db0">
    <text x="24" y="94" text-anchor="middle">A</text>
    <text x="24" y="356" text-anchor="middle">B</text>
  </g>
  <text x="672" y="225" font-size="16" font-weight="bold" fill="#8a3b12">Q = A ⊕ B</text>

  <!-- ===== gates ===== -->
  <!-- NOT-B -->
  <path d="M150,146 L190,168 L150,190 Z" fill="#eef5ee" stroke="#1b5e20" stroke-width="1.6"/>
  <circle cx="196" cy="168" r="6" fill="white" stroke="#1b5e20" stroke-width="1.6"/>
  <text x="164" y="173" font-size="10.5" fill="#1b5e20" text-anchor="middle">NOT</text>
  <text x="250" y="160" font-size="12.5" font-style="italic" fill="#555">¬B</text>

  <!-- NOT-A -->
  <path d="M150,250 L190,272 L150,294 Z" fill="#eef5ee" stroke="#1b5e20" stroke-width="1.6"/>
  <circle cx="196" cy="272" r="6" fill="white" stroke="#1b5e20" stroke-width="1.6"/>
  <text x="164" y="277" font-size="10.5" fill="#1b5e20" text-anchor="middle">NOT</text>
  <text x="250" y="288" font-size="12.5" font-style="italic" fill="#555">¬A</text>

  <!-- AND1 -->
  <path d="M360,78 L388,78 A22,22 0 0 1 388,122 L360,122 Z" fill="#eaf1fb" stroke="#2a5db0" stroke-width="1.6"/>
  <text x="378" y="104" font-size="11" fill="#2a5db0" text-anchor="middle">AND</text>
  <text x="430" y="94" font-size="12.5" font-style="italic" fill="#555">A ∧ ¬B</text>

  <!-- AND2 -->
  <path d="M360,318 L388,318 A22,22 0 0 1 388,362 L360,362 Z" fill="#eaf1fb" stroke="#2a5db0" stroke-width="1.6"/>
  <text x="378" y="344" font-size="11" fill="#2a5db0" text-anchor="middle">AND</text>
  <text x="430" y="356" font-size="12.5" font-style="italic" fill="#555">¬A ∧ B</text>

  <!-- OR -->
  <path d="M523,198 Q551,198 583,220 Q551,242 523,242 Q539,220 523,198 Z" fill="#fdf2ee" stroke="#8a3b12" stroke-width="1.6"/>
  <text x="548" y="224" font-size="11" fill="#8a3b12" text-anchor="middle">OR</text>

  <!-- output node dot -->
  <circle cx="660" cy="220" r="4" fill="#333"/>

  <text x="370" y="418" font-size="11.5" font-style="italic" fill="#666" text-anchor="middle">Q is TRUE exactly when A and B differ: one input on, the other off. 5 gates total (2 NOT, 2 AND, 1 OR).</text>
</svg>
