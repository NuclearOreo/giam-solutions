<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="480" fill="white"/>

  <text x="350" y="28" font-size="13.5" font-style="italic" fill="#444" text-anchor="middle">Rewrite ∨ and ∧ using the two identities, then substitute. Negation is allowed.</text>

  <!-- identity reminders -->
  <rect x="60" y="46" width="270" height="66" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="195" y="68" font-size="13" fill="#1a3a63" text-anchor="middle" font-weight="bold">NAND:  A | B = ¬(A ∧ B)</text>
  <text x="195" y="90" font-size="12.5" fill="#1a3a63" text-anchor="middle">so  A ∧ B = ¬(A | B)</text>
  <text x="195" y="106" font-size="11.5" font-style="italic" fill="#555" text-anchor="middle">(true unless both true)</text>

  <rect x="370" y="46" width="270" height="66" fill="#eef5ee" stroke="#cde0cd"/>
  <text x="505" y="68" font-size="13" fill="#1b5e20" text-anchor="middle" font-weight="bold">NOR:  A ↓ B = ¬(A ∨ B)</text>
  <text x="505" y="90" font-size="12.5" fill="#1b5e20" text-anchor="middle">so  A ∨ B = ¬(A ↓ B)</text>
  <text x="505" y="106" font-size="11.5" font-style="italic" fill="#555" text-anchor="middle">(true only if both false)</text>

  <!-- reduction steps -->
  <text x="350" y="150" font-size="15" fill="#222" text-anchor="middle">Start:   <tspan font-weight="bold">(A ∧ ¬B) ∨ C</tspan></text>
  <text x="350" y="176" font-size="16" fill="#999" text-anchor="middle">↓  turn the outer ∨ into NOR:  X ∨ C = ¬(X ↓ C)</text>
  <text x="350" y="204" font-size="15" fill="#222" text-anchor="middle">=   ¬( <tspan font-weight="bold">(A ∧ ¬B)</tspan> ↓ C )</text>
  <text x="350" y="230" font-size="16" fill="#999" text-anchor="middle">↓  turn the ∧ into NAND:  A ∧ ¬B = ¬(A | ¬B)</text>
  <text x="350" y="258" font-size="15" fill="#222" text-anchor="middle">=   ¬( ¬(A | ¬B) ↓ C )</text>

  <!-- boxed final -->
  <rect x="180" y="278" width="340" height="44" fill="#eef5ee" stroke="#bcd9bc"/>
  <text x="350" y="306" font-size="17" fill="#1b5e20" text-anchor="middle" font-weight="bold">(A ∧ ¬B) ∨ C  =  ¬( ¬(A | ¬B) ↓ C )</text>

  <!-- verification table header -->
  <text x="350" y="350" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">Verification (all 8 rows agree):</text>

  <g font-size="12.5" text-anchor="middle">
    <text x="150" y="374" font-weight="bold">A B C</text>
    <text x="300" y="374" font-weight="bold">A|¬B</text>
    <text x="400" y="374" font-weight="bold">¬(A|¬B)</text>
    <text x="500" y="374" font-weight="bold">…↓C</text>
    <text x="600" y="374" font-weight="bold">¬(…) = target</text>
  </g>
  <line x1="90" y1="382" x2="660" y2="382" stroke="#999" stroke-width="0.8"/>
  <!-- rows: only show a few representative; use compact 8 rows -->
  <g font-size="12" text-anchor="middle" fill="#333">
    <text x="150" y="400">1 1 1</text><text x="300" y="400">1</text><text x="400" y="400">0</text><text x="500" y="400">0</text><text x="600" y="400" font-weight="bold">1</text>
    <text x="150" y="416">1 1 0</text><text x="300" y="416">1</text><text x="400" y="416">0</text><text x="500" y="416">1</text><text x="600" y="416" font-weight="bold">0</text>
    <text x="150" y="432">1 0 1</text><text x="300" y="432">0</text><text x="400" y="432">1</text><text x="500" y="432">0</text><text x="600" y="432" font-weight="bold">1</text>
    <text x="150" y="448">1 0 0</text><text x="300" y="448">0</text><text x="400" y="448">1</text><text x="500" y="448">0</text><text x="600" y="448" font-weight="bold">1</text>
    <text x="150" y="464">0 · ·</text><text x="300" y="464">1</text><text x="400" y="464">0</text><text x="500" y="464">¬C</text><text x="600" y="464" font-weight="bold">C</text>
  </g>
  <line x1="90" y1="472" x2="660" y2="472" stroke="#999" stroke-width="0.8"/>
</svg>
