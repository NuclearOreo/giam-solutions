<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" width="700" height="620" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="620" fill="white"/>

  <text x="350" y="22" font-size="12.5" font-style="italic" fill="#444" text-anchor="middle">Two questions per argument, asked separately: is the FORM valid, and are the PREMISES true?</text>

  <!-- (a) -->
  <rect x="24" y="34" width="322" height="140" fill="#f4faf4" stroke="#bcd9bc"/>
  <text x="40" y="53" font-size="11.5" font-weight="bold" fill="#1a3a63">(a) guilt and prison</text>
  <g font-size="11.5" text-anchor="middle" fill="#222">
    <text x="185" y="74">∀x,  G(x) ⟹ P(x)</text>
    <text x="185" y="91">¬P(George)</text>
  </g>
  <line x1="110" y1="98" x2="260" y2="98" stroke="#333" stroke-width="1"/>
  <text x="185" y="114" font-size="11.5" text-anchor="middle" fill="#222">∴  ¬G(George)</text>
  <text x="185" y="136" font-size="12" text-anchor="middle" fill="#1b5e20" font-weight="bold">VALID — universal modus tollens</text>
  <text x="185" y="156" font-size="10" font-style="italic" fill="#8a3b12" text-anchor="middle">unsound: plenty of guilty people are not in prison</text>

  <!-- (b) -->
  <rect x="356" y="34" width="322" height="140" fill="#fdf3ef" stroke="#e0b8a6"/>
  <text x="372" y="53" font-size="11.5" font-weight="bold" fill="#1a3a63">(b) oranges and vitamin C</text>
  <g font-size="11.5" text-anchor="middle" fill="#222">
    <text x="517" y="74">O ⟹ V</text>
    <text x="517" y="91">V</text>
  </g>
  <line x1="450" y1="98" x2="584" y2="98" stroke="#333" stroke-width="1"/>
  <text x="517" y="114" font-size="11.5" text-anchor="middle" fill="#222">∴  O</text>
  <text x="517" y="136" font-size="12" text-anchor="middle" fill="#8a3b12" font-weight="bold">INVALID — affirming the consequent</text>
  <text x="517" y="156" font-size="10" font-style="italic" fill="#8a3b12" text-anchor="middle">peppers, broccoli and supplements also supply vitamin C</text>

  <!-- (c) -->
  <rect x="24" y="184" width="322" height="140" fill="#dfeadd" stroke="#8ab88a" stroke-width="1.6"/>
  <text x="40" y="203" font-size="11.5" font-weight="bold" fill="#1a3a63">(c) the mackerel</text>
  <g font-size="11.5" text-anchor="middle" fill="#222">
    <text x="185" y="224">∀x,  F(x) ⟹ W(x)</text>
    <text x="185" y="241">F(mackerel)</text>
  </g>
  <line x1="110" y1="248" x2="260" y2="248" stroke="#333" stroke-width="1"/>
  <text x="185" y="264" font-size="11.5" text-anchor="middle" fill="#222">∴  W(mackerel)</text>
  <text x="185" y="286" font-size="12" text-anchor="middle" fill="#1b5e20" font-weight="bold">VALID — universal modus ponens</text>
  <text x="185" y="306" font-size="10.5" font-style="italic" fill="#1b5e20" text-anchor="middle">and SOUND — the only good argument here</text>

  <!-- (d) -->
  <rect x="356" y="184" width="322" height="140" fill="#f4faf4" stroke="#bcd9bc"/>
  <text x="372" y="203" font-size="11.5" font-weight="bold" fill="#1a3a63">(d) laziness and math</text>
  <g font-size="11.5" text-anchor="middle" fill="#222">
    <text x="517" y="224">∀x,  L(x) ⟹ ¬M(x)</text>
    <text x="517" y="241">∀x,  L(x)</text>
  </g>
  <line x1="440" y1="248" x2="594" y2="248" stroke="#333" stroke-width="1"/>
  <text x="517" y="264" font-size="11.5" text-anchor="middle" fill="#222">∴  ∀x,  ¬M(x)</text>
  <text x="517" y="286" font-size="12" text-anchor="middle" fill="#1b5e20" font-weight="bold">VALID — universal modus ponens</text>
  <text x="517" y="306" font-size="10" font-style="italic" fill="#8a3b12" text-anchor="middle">unsound: "everyone is lazy" is plainly false</text>

  <!-- (e) -->
  <rect x="24" y="334" width="322" height="140" fill="#fbe4da" stroke="#c08060" stroke-width="1.6"/>
  <text x="40" y="353" font-size="11.5" font-weight="bold" fill="#1a3a63">(e) the octopus</text>
  <g font-size="11.5" text-anchor="middle" fill="#222">
    <text x="185" y="374">∀x,  F(x) ⟹ W(x)</text>
    <text x="185" y="391">W(octopus)</text>
  </g>
  <line x1="110" y1="398" x2="260" y2="398" stroke="#333" stroke-width="1"/>
  <text x="185" y="414" font-size="11.5" text-anchor="middle" fill="#222">∴  F(octopus)</text>
  <text x="185" y="436" font-size="12" text-anchor="middle" fill="#8a3b12" font-weight="bold">INVALID — affirming the consequent</text>
  <text x="185" y="456" font-size="10.5" font-style="italic" fill="#8a3b12" text-anchor="middle">both premises TRUE, conclusion FALSE</text>

  <!-- (f) -->
  <rect x="356" y="334" width="322" height="140" fill="#f4faf4" stroke="#bcd9bc"/>
  <text x="372" y="353" font-size="11.5" font-weight="bold" fill="#1a3a63">(f) Harold the politician</text>
  <g font-size="11.5" text-anchor="middle" fill="#222">
    <text x="517" y="374">∀x,  P(x) ⟹ S(x)</text>
    <text x="517" y="391">P(Harold)</text>
  </g>
  <line x1="442" y1="398" x2="592" y2="398" stroke="#333" stroke-width="1"/>
  <text x="517" y="414" font-size="11.5" text-anchor="middle" fill="#222">∴  S(Harold)</text>
  <text x="517" y="436" font-size="12" text-anchor="middle" fill="#1b5e20" font-weight="bold">VALID — universal modus ponens</text>
  <text x="517" y="456" font-size="10" font-style="italic" fill="#8a3b12" text-anchor="middle">unsound: "all politicians are scoundrels" is a slur, not a fact</text>

  <!-- the (c)/(e) contrast -->
  <rect x="24" y="488" width="654" height="118" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="351" y="508" font-size="12.5" font-weight="bold" fill="#1a3a63" text-anchor="middle">The designed contrast: (c) and (e) share a premise but differ in direction</text>
  <text x="42" y="532" font-size="11.5" fill="#222">Both start from  <tspan font-weight="bold">∀x, F(x) ⟹ W(x)</tspan>  — "fish ⟹ lives in water". Then:</text>
  <text x="60" y="554" font-size="11.5" fill="#1b5e20">(c) affirms the <tspan font-weight="bold">antecedent</tspan>: mackerel is a fish, so it lives in water.  ✓ runs with the arrow</text>
  <text x="60" y="574" font-size="11.5" fill="#8a3b12">(e) affirms the <tspan font-weight="bold">consequent</tspan>: octopus lives in water, so it is a fish.  ✗ runs against it</text>
  <text x="351" y="596" font-size="11" font-style="italic" fill="#666" text-anchor="middle">Living in water is necessary for being a fish, not sufficient — and the octopus is a mollusc.</text>
</svg>
