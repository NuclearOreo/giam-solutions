<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" width="700" height="580" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="580" fill="white"/>

  <text x="350" y="22" font-size="12.5" font-style="italic" fill="#444" text-anchor="middle">The major premise is always ∀x, A(x) ⟹ B(x). What varies is the MINOR premise: a named individual, or another quantifier.</text>

  <!-- the four valid subtypes, 2x2 -->
  <text x="350" y="48" font-size="12.5" font-weight="bold" fill="#1a3a63" text-anchor="middle">The two rules, each in two subtypes</text>

  <text x="200" y="72" font-size="11.5" font-weight="bold" fill="#8a3b12" text-anchor="middle">PARTICULAR — minor premise names p</text>
  <text x="510" y="72" font-size="11.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">UNIVERSAL — minor premise is quantified</text>

  <!-- modus ponens row -->
  <text x="42" y="118" font-size="11.5" font-weight="bold" fill="#1a3a63">modus</text>
  <text x="42" y="134" font-size="11.5" font-weight="bold" fill="#1a3a63">ponens</text>

  <rect x="110" y="84" width="180" height="80" fill="#f7f9fc" stroke="#c3d3ea"/>
  <g font-size="11.5" text-anchor="middle" fill="#222">
    <text x="200" y="104">∀x, A(x) ⟹ B(x)</text>
    <text x="200" y="122">A(p)</text>
  </g>
  <line x1="140" y1="129" x2="260" y2="129" stroke="#333" stroke-width="1"/>
  <text x="200" y="146" font-size="11.5" text-anchor="middle" fill="#1b5e20" font-weight="bold">∴ B(p)</text>

  <rect x="420" y="84" width="180" height="80" fill="#eef5ee" stroke="#cde0cd"/>
  <g font-size="11.5" text-anchor="middle" fill="#222">
    <text x="510" y="104">∀x, A(x) ⟹ B(x)</text>
    <text x="510" y="122">∀x, A(x)</text>
  </g>
  <line x1="450" y1="129" x2="570" y2="129" stroke="#333" stroke-width="1"/>
  <text x="510" y="146" font-size="11.5" text-anchor="middle" fill="#1b5e20" font-weight="bold">∴ ∀x, B(x)</text>

  <!-- modus tollens row -->
  <text x="42" y="206" font-size="11.5" font-weight="bold" fill="#1a3a63">modus</text>
  <text x="42" y="222" font-size="11.5" font-weight="bold" fill="#1a3a63">tollens</text>

  <rect x="110" y="174" width="180" height="80" fill="#f7f9fc" stroke="#c3d3ea"/>
  <g font-size="11.5" text-anchor="middle" fill="#222">
    <text x="200" y="194">∀x, A(x) ⟹ B(x)</text>
    <text x="200" y="212">¬B(p)</text>
  </g>
  <line x1="140" y1="219" x2="260" y2="219" stroke="#333" stroke-width="1"/>
  <text x="200" y="236" font-size="11.5" text-anchor="middle" fill="#1b5e20" font-weight="bold">∴ ¬A(p)</text>

  <rect x="420" y="174" width="180" height="80" fill="#eef5ee" stroke="#cde0cd"/>
  <g font-size="11.5" text-anchor="middle" fill="#222">
    <text x="510" y="194">∀x, A(x) ⟹ B(x)</text>
    <text x="510" y="212">∀x, ¬B(x)</text>
  </g>
  <line x1="450" y1="219" x2="570" y2="219" stroke="#333" stroke-width="1"/>
  <text x="510" y="236" font-size="11.5" text-anchor="middle" fill="#1b5e20" font-weight="bold">∴ ∀x, ¬A(x)</text>

  <text x="350" y="274" font-size="10.5" font-style="italic" fill="#666" text-anchor="middle">All four checked valid by brute force over every predicate on a three-element universe.</text>

  <!-- classification of the six -->
  <text x="350" y="304" font-size="12.5" font-weight="bold" fill="#1a3a63" text-anchor="middle">Classifying the six arguments of Problem 1</text>

  <g font-size="11" font-weight="bold" fill="#222">
    <text x="46"  y="330">part</text>
    <text x="120" y="330">minor premise</text>
    <text x="300" y="330">subtype</text>
    <text x="410" y="330">rule</text>
  </g>
  <line x1="36" y1="338" x2="664" y2="338" stroke="#999" stroke-width="0.9"/>

  <g font-size="11">
    <text x="46"  y="360">(a)</text><text x="120" y="360" fill="#333">¬P(George)</text>
    <text x="300" y="360" fill="#8a3b12">particular</text>
    <text x="410" y="360" fill="#1b5e20">universal modus tollens</text>

    <text x="46"  y="384">(b)</text><text x="120" y="384" fill="#333">V(you)</text>
    <text x="300" y="384" fill="#8a3b12">particular</text>
    <text x="410" y="384" fill="#8a3b12">affirming the consequent — INVALID</text>

    <text x="46"  y="408">(c)</text><text x="120" y="408" fill="#333">F(mackerel)</text>
    <text x="300" y="408" fill="#8a3b12">particular</text>
    <text x="410" y="408" fill="#1b5e20">universal modus ponens</text>

    <rect x="36" y="418" width="628" height="26" fill="#dfeadd"/>
    <text x="46"  y="436" font-weight="bold">(d)</text><text x="120" y="436" fill="#333" font-weight="bold">∀x, L(x)</text>
    <text x="300" y="436" fill="#1b5e20" font-weight="bold">UNIVERSAL</text>
    <text x="410" y="436" fill="#1b5e20" font-weight="bold">universal modus ponens</text>

    <text x="46"  y="462">(e)</text><text x="120" y="462" fill="#333">W(octopus)</text>
    <text x="300" y="462" fill="#8a3b12">particular</text>
    <text x="410" y="462" fill="#8a3b12">affirming the consequent — INVALID</text>

    <text x="46"  y="486">(f)</text><text x="120" y="486" fill="#333">P(Harold)</text>
    <text x="300" y="486" fill="#8a3b12">particular</text>
    <text x="410" y="486" fill="#1b5e20">universal modus ponens</text>
  </g>
  <line x1="36" y1="496" x2="664" y2="496" stroke="#999" stroke-width="0.9"/>

  <rect x="36" y="510" width="628" height="60" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="350" y="530" font-size="11.5" fill="#1a3a63" text-anchor="middle" font-weight="bold">Only (d) is universal — its minor premise "everyone is lazy" is itself a ∀ statement.</text>
  <text x="350" y="548" font-size="11" fill="#222" text-anchor="middle">The other five name an individual: George, you, the mackerel, the octopus, Harold.</text>
  <text x="350" y="564" font-size="10.5" font-style="italic" fill="#666" text-anchor="middle">The subtype is a matter of the minor premise only — the major premise is ∀-quantified in all six.</text>
</svg>
