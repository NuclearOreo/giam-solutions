<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" width="700" height="540" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="540" fill="white"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a3b12"/>
    </marker>
  </defs>

  <text x="350" y="22" font-size="12.5" font-style="italic" fill="#444" text-anchor="middle">The villager's form is impeccable. It is the premises that are nonsense.</text>

  <!-- the argument -->
  <rect x="24" y="36" width="652" height="106" fill="#f7f9fc" stroke="#c3d3ea"/>
  <g font-size="12" fill="#222">
    <text x="42" y="60">If she weighs the same as a duck, then she's made of wood.</text>
    <text x="470" y="60" font-size="12.5" fill="#1a3a63" font-weight="bold">D ⟹ W</text>
    <text x="42" y="82">If she's made of wood, then she's a witch.</text>
    <text x="470" y="82" font-size="12.5" fill="#1a3a63" font-weight="bold">W ⟹ C</text>
  </g>
  <line x1="42" y1="94" x2="560" y2="94" stroke="#333" stroke-width="1.2"/>
  <text x="42" y="116" font-size="12" fill="#222">∴ If she weighs the same as a duck, she's a witch.</text>
  <text x="470" y="116" font-size="12.5" fill="#1b5e20" font-weight="bold">∴ D ⟹ C</text>
  <text x="350" y="134" font-size="11" font-style="italic" fill="#666" text-anchor="middle">D = weighs the same as a duck   ·   W = made of wood   ·   C = is a witch</text>

  <!-- the rule -->
  <rect x="180" y="154" width="340" height="52" fill="#dfeadd" stroke="#bcd9bc"/>
  <text x="350" y="176" font-size="13.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">Hypothetical Syllogism</text>
  <text x="350" y="196" font-size="11.5" fill="#1b5e20" text-anchor="middle">also called the chain rule, or transitivity of ⟹</text>

  <!-- chain picture -->
  <g font-size="13" text-anchor="middle">
    <circle cx="180" cy="248" r="20" fill="#eaf1fb" stroke="#2a5db0"/><text x="180" y="253">D</text>
    <circle cx="350" cy="248" r="20" fill="#eaf1fb" stroke="#2a5db0"/><text x="350" y="253">W</text>
    <circle cx="520" cy="248" r="20" fill="#eaf1fb" stroke="#2a5db0"/><text x="520" y="253">C</text>
  </g>
  <g stroke="#555" stroke-width="1.8" marker-end="url(#ar)">
    <line x1="202" y1="248" x2="326" y2="248"/>
    <line x1="372" y1="248" x2="496" y2="248"/>
  </g>
  <path d="M180,274 C180,318 520,318 520,274" fill="none" stroke="#8a3b12" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arb)"/>
  <text x="350" y="316" font-size="11.5" fill="#8a3b12" text-anchor="middle" font-weight="bold">the derived link</text>

  <!-- truth table -->
  <text x="350" y="352" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">The rule is a tautology — the last column is true in all eight rows</text>
  <g font-size="10.5" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="118" y="374">D</text><text x="150" y="374">W</text><text x="182" y="374">C</text>
    <text x="248" y="374">D⟹W</text><text x="318" y="374">W⟹C</text><text x="392" y="374">premise</text><text x="462" y="374">D⟹C</text>
    <text x="560" y="374" fill="#1b5e20">whole rule</text>
  </g>
  <line x1="96" y1="382" x2="620" y2="382" stroke="#999" stroke-width="0.8"/>
  <g font-size="10.5" text-anchor="middle" fill="#333">
    <text x="118" y="398">T</text><text x="150" y="398">T</text><text x="182" y="398">T</text><text x="248" y="398">T</text><text x="318" y="398">T</text><text x="392" y="398">T</text><text x="462" y="398">T</text><text x="560" y="398" fill="#1b5e20" font-weight="bold">T</text>
    <text x="118" y="416">T</text><text x="150" y="416">T</text><text x="182" y="416">F</text><text x="248" y="416">T</text><text x="318" y="416">F</text><text x="392" y="416">F</text><text x="462" y="416">F</text><text x="560" y="416" fill="#1b5e20" font-weight="bold">T</text>
    <text x="118" y="434">T</text><text x="150" y="434">F</text><text x="182" y="434">T</text><text x="248" y="434">F</text><text x="318" y="434">T</text><text x="392" y="434">F</text><text x="462" y="434">T</text><text x="560" y="434" fill="#1b5e20" font-weight="bold">T</text>
    <text x="118" y="452">T</text><text x="150" y="452">F</text><text x="182" y="452">F</text><text x="248" y="452">F</text><text x="318" y="452">T</text><text x="392" y="452">F</text><text x="462" y="452">F</text><text x="560" y="452" fill="#1b5e20" font-weight="bold">T</text>
    <text x="118" y="470">F</text><text x="150" y="470">T</text><text x="182" y="470">T</text><text x="248" y="470">T</text><text x="318" y="470">T</text><text x="392" y="470">T</text><text x="462" y="470">T</text><text x="560" y="470" fill="#1b5e20" font-weight="bold">T</text>
    <text x="118" y="488">F</text><text x="150" y="488">T</text><text x="182" y="488">F</text><text x="248" y="488">T</text><text x="318" y="488">F</text><text x="392" y="488">F</text><text x="462" y="488">T</text><text x="560" y="488" fill="#1b5e20" font-weight="bold">T</text>
    <text x="118" y="506">F</text><text x="150" y="506">F</text><text x="182" y="506">T</text><text x="248" y="506">T</text><text x="318" y="506">T</text><text x="392" y="506">T</text><text x="462" y="506">T</text><text x="560" y="506" fill="#1b5e20" font-weight="bold">T</text>
    <text x="118" y="524">F</text><text x="150" y="524">F</text><text x="182" y="524">F</text><text x="248" y="524">T</text><text x="318" y="524">T</text><text x="392" y="524">T</text><text x="462" y="524">T</text><text x="560" y="524" fill="#1b5e20" font-weight="bold">T</text>
  </g>
  <line x1="96" y1="532" x2="620" y2="532" stroke="#999" stroke-width="0.8"/>
</svg>
