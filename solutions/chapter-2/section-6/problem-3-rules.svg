<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="560" fill="white"/>

  <text x="350" y="22" font-size="12.5" font-style="italic" fill="#444" text-anchor="middle">Four arguments, four rules. Strip the English away and the skeleton is all that matters.</text>

  <!-- (a) -->
  <rect x="24" y="36" width="322" height="118" fill="#f7f9fc" stroke="#c3d3ea"/>
  <text x="40" y="56" font-size="11.5" font-weight="bold" fill="#1a3a63">(a) with us / against us</text>
  <g font-size="13" text-anchor="middle" fill="#222">
    <text x="185" y="80">W ∨ A</text>
    <text x="185" y="100">¬W</text>
  </g>
  <line x1="140" y1="108" x2="230" y2="108" stroke="#333" stroke-width="1.1"/>
  <text x="185" y="126" font-size="13" text-anchor="middle" fill="#1b5e20" font-weight="bold">∴  A</text>
  <rect x="60" y="132" width="250" height="18" fill="#dfeadd"/>
  <text x="185" y="145" font-size="11" text-anchor="middle" fill="#1b5e20" font-weight="bold">disjunctive syllogism</text>

  <!-- (b) -->
  <rect x="354" y="36" width="322" height="118" fill="#f7f9fc" stroke="#c3d3ea"/>
  <text x="370" y="56" font-size="11.5" font-weight="bold" fill="#1a3a63">(b) cars and the flood</text>
  <g font-size="13" text-anchor="middle" fill="#222">
    <text x="515" y="80">∀x,  C(x) ⟹ E(x)</text>
    <text x="515" y="100">C(Sandra)</text>
  </g>
  <line x1="440" y1="108" x2="590" y2="108" stroke="#333" stroke-width="1.1"/>
  <text x="515" y="126" font-size="13" text-anchor="middle" fill="#1b5e20" font-weight="bold">∴  E(Sandra)</text>
  <rect x="390" y="132" width="250" height="18" fill="#dfeadd"/>
  <text x="515" y="145" font-size="11" text-anchor="middle" fill="#1b5e20" font-weight="bold">universal modus ponens</text>

  <!-- (c) -->
  <rect x="24" y="164" width="322" height="118" fill="#f7f9fc" stroke="#c3d3ea"/>
  <text x="40" y="184" font-size="11.5" font-weight="bold" fill="#1a3a63">(c) Johnny and the casino</text>
  <g font-size="13" text-anchor="middle" fill="#222">
    <text x="185" y="208">G ⟹ B</text>
    <text x="185" y="228">¬B</text>
  </g>
  <line x1="140" y1="236" x2="230" y2="236" stroke="#333" stroke-width="1.1"/>
  <text x="185" y="254" font-size="13" text-anchor="middle" fill="#1b5e20" font-weight="bold">∴  ¬G</text>
  <rect x="60" y="260" width="250" height="18" fill="#dfeadd"/>
  <text x="185" y="273" font-size="11" text-anchor="middle" fill="#1b5e20" font-weight="bold">modus tollens</text>

  <!-- (d) -->
  <rect x="354" y="164" width="322" height="118" fill="#f7f9fc" stroke="#c3d3ea"/>
  <text x="370" y="184" font-size="11.5" font-weight="bold" fill="#1a3a63">(d) the irrational powers proof</text>
  <g font-size="12.5" text-anchor="middle" fill="#222">
    <text x="515" y="206">R ∨ ¬R</text>
    <text x="515" y="224">R ⟹ T</text>
    <text x="515" y="242">¬R ⟹ T</text>
  </g>
  <line x1="450" y1="250" x2="580" y2="250" stroke="#333" stroke-width="1.1"/>
  <text x="515" y="266" font-size="13" text-anchor="middle" fill="#1b5e20" font-weight="bold">∴  T</text>
  <rect x="390" y="262" width="250" height="18" fill="#dfeadd" opacity="0"/>
  <text x="515" y="278" font-size="11" text-anchor="middle" fill="#1b5e20" font-weight="bold">constructive dilemma  +  excluded middle</text>

  <!-- glossary -->
  <rect x="24" y="292" width="652" height="52" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="40" y="311" font-size="10.5" fill="#1a3a63">W = you are with us · A = you are against us · C(x) = x has a car · E(x) = x escaped the flooding</text>
  <text x="40" y="331" font-size="10.5" fill="#1a3a63">G = Johnny went to the casino · B = Johnny is broke · R = √2^√2 is rational · T = ∃ irrational a, b with a^b rational</text>

  <!-- the (d) case split spelled out -->
  <text x="350" y="368" font-size="12.5" font-weight="bold" fill="#222" text-anchor="middle">Part (d): both branches deliver the same conclusion, so we never learn which one is true</text>

  <rect x="40" y="382" width="300" height="106" fill="#dfeadd" stroke="#bcd9bc"/>
  <text x="190" y="402" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">Case R:  √2^√2 is rational</text>
  <text x="190" y="426" font-size="12" fill="#222" text-anchor="middle">take  a = b = √2</text>
  <text x="190" y="448" font-size="11.5" fill="#222" text-anchor="middle">both irrational, and a^b = √2^√2</text>
  <text x="190" y="468" font-size="11.5" fill="#1b5e20" text-anchor="middle" font-weight="bold">is rational by assumption ✓</text>

  <rect x="360" y="382" width="300" height="106" fill="#dfeadd" stroke="#bcd9bc"/>
  <text x="510" y="402" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">Case ¬R:  √2^√2 is irrational</text>
  <text x="510" y="426" font-size="12" fill="#222" text-anchor="middle">take  a = √2^√2,   b = √2</text>
  <text x="510" y="448" font-size="11.5" fill="#222" text-anchor="middle">both irrational, and a^b = (√2^√2)^√2</text>
  <text x="510" y="468" font-size="11.5" fill="#1b5e20" text-anchor="middle" font-weight="bold">= √2^(√2·√2) = √2² = 2  ✓</text>

  <rect x="40" y="500" width="620" height="46" fill="#fbe4da" stroke="#e0b8a6"/>
  <text x="350" y="519" font-size="12" fill="#8a3b12" text-anchor="middle" font-weight="bold">Non-constructive: the proof supplies a pair without ever saying which pair.</text>
  <text x="350" y="537" font-size="11" fill="#333" text-anchor="middle">Excluded middle is asserted for free — that is exactly what lets us skip deciding whether √2^√2 is rational.</text>
</svg>
