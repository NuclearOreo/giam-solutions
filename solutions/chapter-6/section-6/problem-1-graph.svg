<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Georgia, 'Times New Roman', serif">
  <rect width="480" height="360" fill="white"/>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Horizontal test line at y=1 (light dashed) - shows two preimages -->
  <line x1="50" y1="211" x2="430" y2="211" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Vertical guide at x = -1/2 (boundary of restriction) -->
  <line x1="202" y1="20" x2="202" y2="320" stroke="#cdd5e8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Axes -->
  <g stroke="#222" stroke-width="1.3" fill="none">
    <line x1="40"  y1="284" x2="455" y2="284" marker-end="url(#arrowhead)"/>
    <line x1="240" y1="320" x2="240" y2="20"  marker-end="url(#arrowhead)"/>
  </g>

  <!-- Tick marks -->
  <g stroke="#222" stroke-width="1.2">
    <line x1="88"  y1="280" x2="88"  y2="288"/>
    <line x1="164" y1="280" x2="164" y2="288"/>
    <line x1="316" y1="280" x2="316" y2="288"/>
    <line x1="392" y1="280" x2="392" y2="288"/>
    <line x1="236" y1="211" x2="244" y2="211"/>
    <line x1="236" y1="139" x2="244" y2="139"/>
    <line x1="236" y1="67"  x2="244" y2="67"/>
  </g>

  <!-- Tick labels -->
  <g font-size="12" fill="#222" text-anchor="middle">
    <text x="88"  y="299">−2</text>
    <text x="164" y="299">−1</text>
    <text x="316" y="299">1</text>
    <text x="392" y="299">2</text>
  </g>
  <g font-size="12" fill="#222" text-anchor="end">
    <text x="234" y="215">1</text>
    <text x="234" y="143">2</text>
    <text x="234" y="71">3</text>
  </g>

  <!-- Axis labels -->
  <g font-size="14" fill="#222" font-style="italic">
    <text x="465" y="288" text-anchor="start">x</text>
    <text x="240" y="14"  text-anchor="middle">y</text>
  </g>

  <!-- Left branch (excluded): x ≤ -1/2, dashed gray -->
  <polyline points="50,148 69,182 88,211 107,236 126,257 145,272 164,284 183,291 202,293"
            fill="none" stroke="#999" stroke-width="1.6" stroke-dasharray="6,4"/>

  <!-- Right branch (kept): x ≥ -1/2, solid bold -->
  <polyline points="202,293 221,291 240,284 259,272 278,257 297,236 316,211 335,182 354,148 373,109 392,66 406,39"
            fill="none" stroke="#222" stroke-width="2.2"/>

  <!-- Vertex marker -->
  <circle cx="202" cy="293" r="3.5" fill="#222"/>

  <!-- Preimage dots on test line y=1 -->
  <circle cx="88"  cy="211" r="3.5" fill="#888"/>
  <circle cx="316" cy="211" r="3.5" fill="#222"/>

  <!-- Annotations -->
  <g font-size="13" fill="#222" font-style="italic">
    <text x="385" y="100" text-anchor="middle">y = T(x)</text>
  </g>

  <g font-size="12" fill="#888" font-style="italic">
    <text x="100" y="160" text-anchor="middle">excluded branch</text>
  </g>

  <g font-size="12" fill="#222" font-style="italic">
    <text x="375" y="245" text-anchor="middle">kept: x ≥ −1/2</text>
  </g>

  <g font-size="12" fill="#222">
    <text x="206" y="319" text-anchor="start">vertex (−1/2, −1/8)</text>
  </g>

  <g font-size="11" fill="#666" font-style="italic">
    <text x="55" y="206" text-anchor="start">y = 1</text>
  </g>
</svg>
