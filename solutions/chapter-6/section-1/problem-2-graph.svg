<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Georgia, 'Times New Roman', serif">
  <rect width="400" height="400" fill="white"/>

  <!-- light grid -->
  <g stroke="#ececec" stroke-width="1">
    <line x1="50"  y1="30" x2="50"  y2="370"/>
    <line x1="100" y1="30" x2="100" y2="370"/>
    <line x1="150" y1="30" x2="150" y2="370"/>
    <line x1="250" y1="30" x2="250" y2="370"/>
    <line x1="300" y1="30" x2="300" y2="370"/>
    <line x1="350" y1="30" x2="350" y2="370"/>
    <line x1="30" y1="50"  x2="370" y2="50"/>
    <line x1="30" y1="100" x2="370" y2="100"/>
    <line x1="30" y1="150" x2="370" y2="150"/>
    <line x1="30" y1="250" x2="370" y2="250"/>
    <line x1="30" y1="300" x2="370" y2="300"/>
    <line x1="30" y1="350" x2="370" y2="350"/>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <!-- axes -->
  <g stroke="#222" stroke-width="1.3" fill="none">
    <line x1="20"  y1="200" x2="378" y2="200" marker-end="url(#arrow)"/>
    <line x1="200" y1="380" x2="200" y2="22"  marker-end="url(#arrow)"/>
  </g>

  <!-- ticks -->
  <g stroke="#222" stroke-width="1.2">
    <line x1="50"  y1="196" x2="50"  y2="204"/>
    <line x1="100" y1="196" x2="100" y2="204"/>
    <line x1="150" y1="196" x2="150" y2="204"/>
    <line x1="250" y1="196" x2="250" y2="204"/>
    <line x1="300" y1="196" x2="300" y2="204"/>
    <line x1="350" y1="196" x2="350" y2="204"/>
    <line x1="196" y1="50"  x2="204" y2="50"/>
    <line x1="196" y1="100" x2="204" y2="100"/>
    <line x1="196" y1="150" x2="204" y2="150"/>
    <line x1="196" y1="250" x2="204" y2="250"/>
    <line x1="196" y1="300" x2="204" y2="300"/>
    <line x1="196" y1="350" x2="204" y2="350"/>
  </g>

  <!-- tick labels -->
  <g font-size="13" fill="#222">
    <g text-anchor="middle">
      <text x="50"  y="222">&#8722;3</text>
      <text x="100" y="222">&#8722;2</text>
      <text x="150" y="222">&#8722;1</text>
      <text x="250" y="222">1</text>
      <text x="300" y="222">2</text>
      <text x="350" y="222">3</text>
    </g>
    <g text-anchor="end">
      <text x="190" y="55">3</text>
      <text x="190" y="105">2</text>
      <text x="190" y="155">1</text>
      <text x="190" y="255">&#8722;1</text>
      <text x="190" y="305">&#8722;2</text>
      <text x="190" y="355">&#8722;3</text>
    </g>
    <text x="190" y="222" text-anchor="end">0</text>
  </g>

  <!-- axis labels -->
  <text x="372" y="218" font-size="16" font-style="italic" fill="#222">x</text>
  <text x="208" y="32"  font-size="16" font-style="italic" fill="#222">y</text>

  <!-- the line y = x -->
  <line x1="40" y1="360" x2="360" y2="40" stroke="#1f6feb" stroke-width="2.4"/>

  <!-- equation label -->
  <text x="290" y="65" font-size="15" font-style="italic" fill="#1f6feb">y = x</text>
</svg>
