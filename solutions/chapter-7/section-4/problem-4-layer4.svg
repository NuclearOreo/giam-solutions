<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 280" width="380" height="280" font-family="Georgia, 'Times New Roman', serif">
  <rect width="380" height="280" fill="white"/>

  <!-- Triangular grid connections -->
  <g stroke="#bbb" stroke-width="1.2" fill="none">
    <!-- horizontal connections -->
    <line x1="160" y1="82" x2="220" y2="82"/>
    <line x1="130" y1="134" x2="250" y2="134"/>
    <line x1="100" y1="186" x2="280" y2="186"/>
    <line x1="70" y1="238" x2="310" y2="238"/>

    <!-- down-right diagonals -->
    <line x1="190" y1="30" x2="220" y2="82"/>
    <line x1="160" y1="82" x2="190" y2="134"/>
    <line x1="220" y1="82" x2="250" y2="134"/>
    <line x1="130" y1="134" x2="160" y2="186"/>
    <line x1="190" y1="134" x2="220" y2="186"/>
    <line x1="250" y1="134" x2="280" y2="186"/>
    <line x1="100" y1="186" x2="130" y2="238"/>
    <line x1="160" y1="186" x2="190" y2="238"/>
    <line x1="220" y1="186" x2="250" y2="238"/>
    <line x1="280" y1="186" x2="310" y2="238"/>

    <!-- down-left diagonals -->
    <line x1="190" y1="30" x2="160" y2="82"/>
    <line x1="160" y1="82" x2="130" y2="134"/>
    <line x1="220" y1="82" x2="190" y2="134"/>
    <line x1="130" y1="134" x2="100" y2="186"/>
    <line x1="190" y1="134" x2="160" y2="186"/>
    <line x1="250" y1="134" x2="220" y2="186"/>
    <line x1="100" y1="186" x2="70" y2="238"/>
    <line x1="160" y1="186" x2="130" y2="238"/>
    <line x1="220" y1="186" x2="190" y2="238"/>
    <line x1="280" y1="186" x2="250" y2="238"/>
  </g>

  <!-- Outer triangle border (slightly emphasized) -->
  <polygon points="190,30 70,238 310,238" fill="none" stroke="#222" stroke-width="2"/>

  <!-- Entry circles with values; interior 12s highlighted in light yellow -->
  <g font-size="14" fill="#222" text-anchor="middle" font-weight="bold">
    <!-- Row 0 -->
    <circle cx="190" cy="30" r="15" fill="white" stroke="#222" stroke-width="1.5"/>
    <text x="190" y="35">1</text>

    <!-- Row 1 -->
    <circle cx="160" cy="82" r="15" fill="white" stroke="#222" stroke-width="1.5"/>
    <text x="160" y="87">4</text>
    <circle cx="220" cy="82" r="15" fill="white" stroke="#222" stroke-width="1.5"/>
    <text x="220" y="87">4</text>

    <!-- Row 2 -->
    <circle cx="130" cy="134" r="15" fill="white" stroke="#222" stroke-width="1.5"/>
    <text x="130" y="139">6</text>
    <circle cx="190" cy="134" r="15" fill="#fff3cd" stroke="#222" stroke-width="1.5"/>
    <text x="190" y="139">12</text>
    <circle cx="250" cy="134" r="15" fill="white" stroke="#222" stroke-width="1.5"/>
    <text x="250" y="139">6</text>

    <!-- Row 3 -->
    <circle cx="100" cy="186" r="15" fill="white" stroke="#222" stroke-width="1.5"/>
    <text x="100" y="191">4</text>
    <circle cx="160" cy="186" r="15" fill="#fff3cd" stroke="#222" stroke-width="1.5"/>
    <text x="160" y="191">12</text>
    <circle cx="220" cy="186" r="15" fill="#fff3cd" stroke="#222" stroke-width="1.5"/>
    <text x="220" y="191">12</text>
    <circle cx="280" cy="186" r="15" fill="white" stroke="#222" stroke-width="1.5"/>
    <text x="280" y="191">4</text>

    <!-- Row 4 -->
    <circle cx="70" cy="238" r="15" fill="white" stroke="#222" stroke-width="1.5"/>
    <text x="70" y="243">1</text>
    <circle cx="130" cy="238" r="15" fill="white" stroke="#222" stroke-width="1.5"/>
    <text x="130" y="243">4</text>
    <circle cx="190" cy="238" r="15" fill="white" stroke="#222" stroke-width="1.5"/>
    <text x="190" y="243">6</text>
    <circle cx="250" cy="238" r="15" fill="white" stroke="#222" stroke-width="1.5"/>
    <text x="250" y="243">4</text>
    <circle cx="310" cy="238" r="15" fill="white" stroke="#222" stroke-width="1.5"/>
    <text x="310" y="243">1</text>
  </g>
</svg>
