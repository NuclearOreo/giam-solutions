<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="320" height="280" font-family="Georgia, 'Times New Roman', serif">
  <rect width="320" height="280" fill="white"/>

  <g transform="translate(70, 50)">
    <!-- Unit cell -->
    <rect x="0" y="0" width="180" height="180" fill="#fff3cd" stroke="#222" stroke-width="2"/>

    <!-- Diagonal -->
    <line x1="0" y1="0" x2="180" y2="180" stroke="#cc0000" stroke-width="2.5"/>

    <!-- Two extreme points: opposite corners realize the maximum pairwise distance -->
    <circle cx="0" cy="0" r="5.5" fill="#cc0000"/>
    <circle cx="180" cy="180" r="5.5" fill="#cc0000"/>

    <!-- Side labels -->
    <text x="90" y="-12" text-anchor="middle" font-size="15" fill="#222" font-style="italic">1</text>
    <text x="-18" y="95" text-anchor="middle" font-size="15" fill="#222" font-style="italic">1</text>
    <text x="90" y="200" text-anchor="middle" font-size="15" fill="#222" font-style="italic">1</text>
    <text x="198" y="95" text-anchor="middle" font-size="15" fill="#222" font-style="italic">1</text>

    <!-- Diagonal label (offset above-right of the midpoint) -->
    <text x="118" y="78" text-anchor="middle" font-size="16" fill="#cc0000" font-style="italic">√2</text>
  </g>
</svg>
