<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" width="400" height="380" font-family="Georgia, 'Times New Roman', serif">
  <rect width="400" height="380" fill="white"/>

  <!-- Edges (drawn first so vertices overlay them) -->
  <g stroke="#222" stroke-width="2">
    <line x1="200" y1="70" x2="320" y2="200"/>   <!-- AB -->
    <line x1="200" y1="70" x2="80" y2="200"/>    <!-- AC -->
    <line x1="200" y1="70" x2="200" y2="310"/>   <!-- AD -->
    <line x1="320" y1="200" x2="80" y2="200"/>   <!-- BC -->
  </g>

  <!-- Vertices: A and D in dark gray; B and C highlighted in red (sharing degree) -->
  <g>
    <circle cx="200" cy="70" r="14" fill="#222"/>
    <text x="200" y="75" font-size="14" fill="white" font-weight="bold" text-anchor="middle">3</text>

    <circle cx="320" cy="200" r="14" fill="#cc0000"/>
    <text x="320" y="205" font-size="14" fill="white" font-weight="bold" text-anchor="middle">2</text>

    <circle cx="80" cy="200" r="14" fill="#cc0000"/>
    <text x="80" y="205" font-size="14" fill="white" font-weight="bold" text-anchor="middle">2</text>

    <circle cx="200" cy="310" r="14" fill="#222"/>
    <text x="200" y="315" font-size="14" fill="white" font-weight="bold" text-anchor="middle">1</text>
  </g>

  <!-- Vertex name labels -->
  <g font-size="15" fill="#222" font-style="italic">
    <text x="200" y="48" text-anchor="middle">A</text>
    <text x="345" y="206" text-anchor="start">B</text>
    <text x="55" y="206" text-anchor="end">C</text>
    <text x="200" y="338" text-anchor="middle">D</text>
  </g>

  <!-- Caption inside the SVG -->
  <text x="200" y="365" font-size="12" fill="#666" text-anchor="middle" font-style="italic">degree multiset: {1, 2, 2, 3} — two vertices share degree 2</text>
</svg>
