<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 280" width="460" height="280" font-family="Georgia, 'Times New Roman', serif">
  <rect width="460" height="280" fill="white"/>

  <!-- Required edges from the "n-1" vertex to all others -->
  <g stroke="#222" stroke-width="2">
    <line x1="230" y1="60" x2="100" y2="180"/>
    <line x1="230" y1="60" x2="180" y2="180"/>
    <line x1="230" y1="60" x2="280" y2="180"/>
  </g>

  <!-- The "forced but forbidden" edge from "n-1" to "0" — drawn dashed red -->
  <line x1="230" y1="60" x2="380" y2="180" stroke="#cc0000" stroke-width="2.5" stroke-dasharray="7,4"/>

  <!-- Red X marking the impossibility -->
  <g stroke="#cc0000" stroke-width="3" stroke-linecap="round">
    <line x1="295" y1="115" x2="315" y2="135"/>
    <line x1="315" y1="115" x2="295" y2="135"/>
  </g>

  <!-- Top vertex: the deg-(n-1) vertex, connected to all -->
  <circle cx="230" cy="60" r="16" fill="#cc0000"/>
  <text x="230" y="65" font-size="13" fill="white" font-weight="bold" text-anchor="middle">n−1</text>

  <!-- Three "other" vertices (the legitimate neighbors of the deg-(n-1) vertex) -->
  <g>
    <circle cx="100" cy="180" r="13" fill="#666"/>
    <text x="100" y="184" font-size="11" fill="white" text-anchor="middle">…</text>
    <circle cx="180" cy="180" r="13" fill="#666"/>
    <text x="180" y="184" font-size="11" fill="white" text-anchor="middle">…</text>
    <circle cx="280" cy="180" r="13" fill="#666"/>
    <text x="280" y="184" font-size="11" fill="white" text-anchor="middle">…</text>
  </g>

  <!-- The "would-be" isolated vertex (deg 0) -->
  <circle cx="380" cy="180" r="16" fill="#888"/>
  <text x="380" y="185" font-size="13" fill="white" font-weight="bold" text-anchor="middle">0</text>

  <!-- Captions -->
  <text x="230" y="40" font-size="13" fill="#222" font-style="italic" text-anchor="middle">deg n−1: connected to everyone</text>
  <text x="380" y="215" font-size="13" fill="#222" font-style="italic" text-anchor="middle">deg 0: isolated</text>
  <text x="230" y="255" font-size="13" fill="#cc0000" font-style="italic" text-anchor="middle">— the dashed edge must exist (left side) and cannot exist (right side) —</text>
</svg>
