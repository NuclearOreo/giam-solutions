<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 370" width="360" height="370" font-family="Georgia, 'Times New Roman', serif">
  <rect width="360" height="370" fill="white"/>

  <text x="180" y="30" text-anchor="middle" font-size="16" font-style="italic" fill="#222">Order 5 — magic constant M₅ = 65</text>

