      <text x="67.5" y="30">24</text>
      <text x="112.5" y="30">1</text>
      <text x="157.5" y="30">8</text>
      <text x="202.5" y="30">15</text>
      <text x="22.5" y="75">23</text>
      <text x="67.5" y="75">5</text>
      <text x="112.5" y="75">7</text>
      <text x="157.5" y="75">14</text>
      <text x="202.5" y="75">16</text>
      <text x="22.5" y="120">4</text>
      <text x="67.5" y="120">6</text>
      <text x="112.5" y="120">13</text>
      <text x="157.5" y="120">20</text>
      <text x="202.5" y="120">22</text>
      <text x="22.5" y="165">10</text>
      <text x="67.5" y="165">12</text>
      <text x="112.5" y="165">19</text>
      <text x="157.5" y="165">21</text>
      <text x="202.5" y="165">3</text>
      <text x="22.5" y="210">11</text>
      <text x="67.5" y="210">18</text>
      <text x="112.5" y="210">25</text>
      <text x="157.5" y="210">2</text>
