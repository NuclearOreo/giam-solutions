<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" font-family="Georgia, 'Times New Roman', serif">
  <rect width="780" height="420" fill="white"/>

  <!-- Panel 1: Case I (S = (3, 3)) -->
  <g transform="translate(40, 60)">
    <text x="150" y="-25" text-anchor="middle" font-size="15" font-style="italic" fill="#222">Case I — r, c both odd</text>
    <text x="150" y="-8" text-anchor="middle" font-size="12" fill="#555">example: n=5, S=(3, 3); row decomposition</text>

    <!-- Light background -->
    <rect width="300" height="300" fill="#f0d9b5"/>

    <!-- Dark squares -->
    <g fill="#b58863">
      <rect x="0" y="0" width="60" height="60"/>
      <rect x="120" y="0" width="60" height="60"/>
      <rect x="240" y="0" width="60" height="60"/>
      <rect x="60" y="60" width="60" height="60"/>
      <rect x="180" y="60" width="60" height="60"/>
      <rect x="0" y="120" width="60" height="60"/>
      <rect x="120" y="120" width="60" height="60"/>
      <rect x="240" y="120" width="60" height="60"/>
      <rect x="60" y="180" width="60" height="60"/>
      <rect x="180" y="180" width="60" height="60"/>
      <rect x="0" y="240" width="60" height="60"/>
      <rect x="120" y="240" width="60" height="60"/>
      <rect x="240" y="240" width="60" height="60"/>
    </g>

    <!-- Removed square S = (3, 3) -->
    <rect x="120" y="120" width="60" height="60" fill="white" stroke="#222" stroke-width="2.5"/>
    <line x1="130" y1="130" x2="170" y2="170" stroke="#cc0000" stroke-width="3"/>
    <line x1="170" y1="130" x2="130" y2="170" stroke="#cc0000" stroke-width="3"/>

    <!-- Dominoes (thick borders) -->
    <g fill="none" stroke="#222" stroke-width="3.5">
      <!-- Top 2 rows: 5 vertical dominoes -->
      <rect x="0" y="0" width="60" height="120"/>
      <rect x="60" y="0" width="60" height="120"/>
      <rect x="120" y="0" width="60" height="120"/>
      <rect x="180" y="0" width="60" height="120"/>
      <rect x="240" y="0" width="60" height="120"/>
      <!-- Row 3 minus S: 2 horizontal dominoes (left and right pieces) -->
      <rect x="0" y="120" width="120" height="60"/>
      <rect x="180" y="120" width="120" height="60"/>
      <!-- Bottom 2 rows: 5 vertical dominoes -->
      <rect x="0" y="180" width="60" height="120"/>
      <rect x="60" y="180" width="60" height="120"/>
      <rect x="120" y="180" width="60" height="120"/>
      <rect x="180" y="180" width="60" height="120"/>
      <rect x="240" y="180" width="60" height="120"/>
    </g>

    <!-- Outer border -->
    <rect x="0" y="0" width="300" height="300" fill="none" stroke="#222" stroke-width="2.5"/>
  </g>

  <!-- Panel 2: Case II (S = (2, 2)) -->
  <g transform="translate(440, 60)">
    <text x="150" y="-25" text-anchor="middle" font-size="15" font-style="italic" fill="#222">Case II — r, c both even</text>
    <text x="150" y="-8" text-anchor="middle" font-size="12" fill="#555">example: n=5, S=(2, 2); 3×3 block + surrounding strips</text>

    <!-- Light background -->
    <rect width="300" height="300" fill="#f0d9b5"/>

    <!-- Dark squares -->
    <g fill="#b58863">
      <rect x="0" y="0" width="60" height="60"/>
      <rect x="120" y="0" width="60" height="60"/>
      <rect x="240" y="0" width="60" height="60"/>
      <rect x="60" y="60" width="60" height="60"/>
      <rect x="180" y="60" width="60" height="60"/>
      <rect x="0" y="120" width="60" height="60"/>
      <rect x="120" y="120" width="60" height="60"/>
      <rect x="240" y="120" width="60" height="60"/>
      <rect x="60" y="180" width="60" height="60"/>
      <rect x="180" y="180" width="60" height="60"/>
      <rect x="0" y="240" width="60" height="60"/>
      <rect x="120" y="240" width="60" height="60"/>
      <rect x="240" y="240" width="60" height="60"/>
    </g>

    <!-- Removed square S = (2, 2) -->
    <rect x="60" y="60" width="60" height="60" fill="white" stroke="#222" stroke-width="2.5"/>
    <line x1="70" y1="70" x2="110" y2="110" stroke="#cc0000" stroke-width="3"/>
    <line x1="110" y1="70" x2="70" y2="110" stroke="#cc0000" stroke-width="3"/>

    <!-- Dominoes -->
    <g fill="none" stroke="#222" stroke-width="3.5">
      <!-- 3x3 block tiling (rows 1-3, cols 1-3, minus S) -->
      <rect x="0" y="0" width="120" height="60"/>
      <rect x="120" y="0" width="60" height="120"/>
      <rect x="0" y="60" width="60" height="120"/>
      <rect x="60" y="120" width="120" height="60"/>
      <!-- Right strip: 3 horizontal dominoes (rows 1-3, cols 4-5) -->
      <rect x="180" y="0" width="120" height="60"/>
      <rect x="180" y="60" width="120" height="60"/>
      <rect x="180" y="120" width="120" height="60"/>
      <!-- Bottom strip: 5 vertical dominoes (rows 4-5) -->
      <rect x="0" y="180" width="60" height="120"/>
      <rect x="60" y="180" width="60" height="120"/>
      <rect x="120" y="180" width="60" height="120"/>
      <rect x="180" y="180" width="60" height="120"/>
      <rect x="240" y="180" width="60" height="120"/>
    </g>

    <!-- Outer border -->
    <rect x="0" y="0" width="300" height="300" fill="none" stroke="#222" stroke-width="2.5"/>
  </g>
</svg>
