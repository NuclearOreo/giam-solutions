<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 350" width="340" height="350" font-family="Georgia, 'Times New Roman', serif">
  <rect width="340" height="350" fill="white"/>

  <text x="170" y="30" text-anchor="middle" font-size="16" font-style="italic" fill="#222">Order 4 — magic constant M₄ = 34</text>

  <g transform="translate(50, 60)">
    <!-- Grid lines -->
    <g stroke="#222" stroke-width="2" fill="none">
      <rect x="0" y="0" width="200" height="200"/>
      <line x1="50" y1="0" x2="50" y2="200"/>
      <line x1="100" y1="0" x2="100" y2="200"/>
      <line x1="150" y1="0" x2="150" y2="200"/>
      <line x1="0" y1="50" x2="200" y2="50"/>
      <line x1="0" y1="100" x2="200" y2="100"/>
      <line x1="0" y1="150" x2="200" y2="150"/>
    </g>

    <!-- Numbers -->
    <g font-size="22" text-anchor="middle" fill="#222">
      <text x="25" y="33">1</text>
      <text x="75" y="33">15</text>
      <text x="125" y="33">14</text>
      <text x="175" y="33">4</text>
      <text x="25" y="83">12</text>
      <text x="75" y="83">6</text>
      <text x="125" y="83">7</text>
      <text x="175" y="83">9</text>
      <text x="25" y="133">8</text>
      <text x="75" y="133">10</text>
      <text x="125" y="133">11</text>
      <text x="175" y="133">5</text>
      <text x="25" y="183">13</text>
      <text x="75" y="183">3</text>
      <text x="125" y="183">2</text>
      <text x="175" y="183">16</text>
    </g>

    <!-- Row sums -->
    <g font-size="14" fill="#0066aa">
      <text x="215" y="33">34</text>
      <text x="215" y="83">34</text>
      <text x="215" y="133">34</text>
      <text x="215" y="183">34</text>
    </g>

    <!-- Column sums -->
    <g font-size="14" text-anchor="middle" fill="#0066aa">
      <text x="25" y="225">34</text>
      <text x="75" y="225">34</text>
      <text x="125" y="225">34</text>
      <text x="175" y="225">34</text>
    </g>

    <!-- Diagonal note -->
    <text x="100" y="258" text-anchor="middle" font-size="13" fill="#444">both diagonals also sum to 34</text>
  </g>
</svg>
