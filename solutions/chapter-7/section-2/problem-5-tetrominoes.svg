<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" width="660" height="460" font-family="Georgia, 'Times New Roman', serif">
  <rect width="660" height="460" fill="white"/>

  <!-- Title -->
  <text x="330" y="30" text-anchor="middle" font-size="16" font-style="italic" fill="#222">The 5 tetrominoes, chess-colored</text>

  <!-- I-tetromino -->
  <g transform="translate(40, 100)">
    <text x="80" y="-25" text-anchor="middle" font-size="16" font-style="italic" fill="#222">I</text>
    <g stroke="#222" stroke-width="2">
      <rect x="0" y="0" width="40" height="40" fill="#b58863"/>
      <rect x="40" y="0" width="40" height="40" fill="#f0d9b5"/>
      <rect x="80" y="0" width="40" height="40" fill="#b58863"/>
      <rect x="120" y="0" width="40" height="40" fill="#f0d9b5"/>
    </g>
    <text x="80" y="65" text-anchor="middle" font-size="13" fill="#222">2 + 2  (balanced)</text>
  </g>

  <!-- T-tetromino (stem up) -->
  <g transform="translate(260, 80)">
    <text x="60" y="-20" text-anchor="middle" font-size="16" font-style="italic" fill="#222">T</text>
    <g stroke="#222" stroke-width="2">
      <rect x="40" y="0" width="40" height="40" fill="#f0d9b5"/>
      <rect x="0" y="40" width="40" height="40" fill="#f0d9b5"/>
      <rect x="40" y="40" width="40" height="40" fill="#b58863"/>
      <rect x="80" y="40" width="40" height="40" fill="#f0d9b5"/>
    </g>
    <text x="60" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#cc0000">1 + 3  (unbalanced!)</text>
  </g>

  <!-- S-tetromino -->
  <g transform="translate(460, 80)">
    <text x="60" y="-20" text-anchor="middle" font-size="16" font-style="italic" fill="#222">S</text>
    <g stroke="#222" stroke-width="2">
      <rect x="40" y="0" width="40" height="40" fill="#f0d9b5"/>
      <rect x="80" y="0" width="40" height="40" fill="#b58863"/>
      <rect x="0" y="40" width="40" height="40" fill="#f0d9b5"/>
      <rect x="40" y="40" width="40" height="40" fill="#b58863"/>
    </g>
    <text x="60" y="105" text-anchor="middle" font-size="13" fill="#222">2 + 2  (balanced)</text>
  </g>

  <!-- L-tetromino -->
  <g transform="translate(140, 310)">
    <text x="60" y="-20" text-anchor="middle" font-size="16" font-style="italic" fill="#222">L</text>
    <g stroke="#222" stroke-width="2">
      <rect x="0" y="0" width="40" height="40" fill="#b58863"/>
      <rect x="0" y="40" width="40" height="40" fill="#f0d9b5"/>
      <rect x="40" y="40" width="40" height="40" fill="#b58863"/>
      <rect x="80" y="40" width="40" height="40" fill="#f0d9b5"/>
    </g>
    <text x="60" y="105" text-anchor="middle" font-size="13" fill="#222">2 + 2  (balanced)</text>
  </g>

  <!-- J-tetromino -->
  <g transform="translate(380, 310)">
    <text x="60" y="-20" text-anchor="middle" font-size="16" font-style="italic" fill="#222">J</text>
    <g stroke="#222" stroke-width="2">
      <rect x="80" y="0" width="40" height="40" fill="#b58863"/>
      <rect x="0" y="40" width="40" height="40" fill="#f0d9b5"/>
      <rect x="40" y="40" width="40" height="40" fill="#b58863"/>
      <rect x="80" y="40" width="40" height="40" fill="#f0d9b5"/>
    </g>
    <text x="60" y="105" text-anchor="middle" font-size="13" fill="#222">2 + 2  (balanced)</text>
  </g>
</svg>
