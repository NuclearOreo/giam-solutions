<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240" font-family="Georgia, 'Times New Roman', serif">
  <rect width="420" height="240" fill="white"/>

  <!-- Horizontal domino -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="60" height="60" fill="#f0d9b5" stroke="#222" stroke-width="1.5"/>
    <rect x="60" y="0" width="60" height="60" fill="#b58863" stroke="#222" stroke-width="1.5"/>
    <!-- Domino outer outline (thicker) -->
    <rect x="0" y="0" width="120" height="60" fill="none" stroke="#222" stroke-width="3.5"/>
    <text x="60" y="-15" text-anchor="middle" font-size="14" font-style="italic" fill="#222">Horizontal domino</text>
    <text x="60" y="80" text-anchor="middle" font-size="12" fill="#666" dy="14">covers one light + one dark</text>
  </g>

  <!-- Vertical domino -->
  <g transform="translate(290, 40)">
    <rect x="0" y="0" width="60" height="60" fill="#f0d9b5" stroke="#222" stroke-width="1.5"/>
    <rect x="0" y="60" width="60" height="60" fill="#b58863" stroke="#222" stroke-width="1.5"/>
    <!-- Domino outer outline (thicker) -->
    <rect x="0" y="0" width="60" height="120" fill="none" stroke="#222" stroke-width="3.5"/>
    <text x="30" y="-15" text-anchor="middle" font-size="14" font-style="italic" fill="#222">Vertical domino</text>
    <text x="30" y="140" text-anchor="middle" font-size="12" fill="#666" dy="14">covers one light + one dark</text>
  </g>
</svg>
