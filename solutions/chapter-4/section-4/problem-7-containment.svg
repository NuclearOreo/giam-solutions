<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 745" width="720" height="745" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="745" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="88" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">FOUR SETS, SO FOUR RECTANGLES &#8212; CIRCLES CANNOT DO IT</text>
  <text x="360" y="58" font-size="13.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">(A &#8745; B) &#8746; (C &#8745; D)&#160;&#160;&#8838;&#160;&#160;(A &#8746; C) &#8745; (B &#8746; D)</text>
  <text x="360" y="80" font-size="11.5" fill="#333" text-anchor="middle">The diagram is the one built in 4.4 Problem 1. Containment checked over all 1048576 quadruples.</text>
  <rect x="22" y="118" width="336" height="306" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">(A &#8745; B) &#8746; (C &#8745; D)</text><rect x="116.2" y="261.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.3"/><rect x="145.7" y="261.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.3"/><rect x="175.2" y="290.8" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.3"/><rect x="175.2" y="261.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.3"/><rect x="175.2" y="231.7" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.3"/><rect x="175.2" y="202.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.3"/><rect x="204.8" y="261.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.3"/><rect x="86.7" y="261.2" width="206.7" height="118.1" fill="none" stroke="#3b5b9b" stroke-width="1.9"/><text x="82.7" y="256.2" font-size="12" fill="#3b5b9b" text-anchor="end" font-weight="bold">A</text><rect x="116.2" y="231.7" width="118.1" height="59.0" fill="none" stroke="#9b2c2c" stroke-width="1.9"/><text x="112.2" y="226.7" font-size="12" fill="#9b2c2c" text-anchor="end" font-weight="bold">B</text><rect x="145.7" y="172.7" width="59.0" height="177.1" fill="none" stroke="#1f6b34" stroke-width="1.9"/><text x="141.7" y="167.7" font-size="12" fill="#1f6b34" text-anchor="end" font-weight="bold">C</text><rect x="175.2" y="202.2" width="88.6" height="118.1" fill="none" stroke="#b06a10" stroke-width="1.9"/><text x="171.2" y="197.2" font-size="12" fill="#b06a10" text-anchor="end" font-weight="bold">D</text><text x="190.0" y="414" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">7 of the 16 atoms</text><rect x="372" y="118" width="336" height="306" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">(A &#8746; C) &#8745; (B &#8746; D)</text><rect x="466.2" y="261.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.3"/><rect x="495.7" y="261.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.3"/><rect x="495.7" y="231.7" width="29.5" height="29.5" fill="#b06a10" fill-opacity="0.55"/><rect x="525.2" y="290.8" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.3"/><rect x="525.2" y="261.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.3"/><rect x="525.2" y="231.7" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.3"/><rect x="525.2" y="202.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.3"/><rect x="554.8" y="290.8" width="29.5" height="29.5" fill="#b06a10" fill-opacity="0.55"/><rect x="554.8" y="261.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.3"/><rect x="584.3" y="290.8" width="29.5" height="29.5" fill="#b06a10" fill-opacity="0.55"/><rect x="584.3" y="261.2" width="29.5" height="29.5" fill="#b06a10" fill-opacity="0.55"/><rect x="436.7" y="261.2" width="206.7" height="118.1" fill="none" stroke="#3b5b9b" stroke-width="1.9"/><text x="432.7" y="256.2" font-size="12" fill="#3b5b9b" text-anchor="end" font-weight="bold">A</text><rect x="466.2" y="231.7" width="118.1" height="59.0" fill="none" stroke="#9b2c2c" stroke-width="1.9"/><text x="462.2" y="226.7" font-size="12" fill="#9b2c2c" text-anchor="end" font-weight="bold">B</text><rect x="495.7" y="172.7" width="59.0" height="177.1" fill="none" stroke="#1f6b34" stroke-width="1.9"/><text x="491.7" y="167.7" font-size="12" fill="#1f6b34" text-anchor="end" font-weight="bold">C</text><rect x="525.2" y="202.2" width="88.6" height="118.1" fill="none" stroke="#b06a10" stroke-width="1.9"/><text x="521.2" y="197.2" font-size="12" fill="#b06a10" text-anchor="end" font-weight="bold">D</text><text x="540.0" y="414" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">the same 7, plus 2 more in orange</text>
  <rect x="18" y="438" width="684" height="150" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="458" font-size="11.5" fill="#b06a10" font-weight="bold">THE GAP IS EXACTLY THE TWO CROSS TERMS</text>
  <text x="40" y="482" font-size="11.5" fill="#333">Distributivity expands the right-hand side into four products, and the left-hand side keeps only two:</text>
  <text x="360" y="508" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">(A &#8746; C) &#8745; (B &#8746; D) = (A&#8745;B) &#8746; (C&#8745;D) &#8746; <tspan fill="#b06a10">(A&#8745;D) &#8746; (C&#8745;B)</tspan></text>
  <text x="40" y="534" font-size="11.5" fill="#333">So the containment is <tspan font-style="italic">strict</tspan>. The two orange atoms above are A &#8745; D with B, C absent, and</text>
  <text x="40" y="552" font-size="11.5" fill="#333">B &#8745; C with A, D absent &#8212; a point in A and D alone satisfies the right side and fails the left.</text>
  <text x="40" y="576" font-size="11" fill="#555">Smallest counterexample found by search: A = D = &#8709;, B = C = {0}. Then the right side is {0} and the left is &#8709;.</text>
  <rect x="18" y="601" width="684" height="128" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="621" font-size="11.5" fill="#1f6b34" font-weight="bold">THE PROOF USES LESS THAN YOU MIGHT THINK</text>
  <text x="40" y="645" font-size="11.5" fill="#333">Only two facts are needed: a set contains its intersections, and is contained in its unions. No</text>
  <text x="40" y="663" font-size="11.5" fill="#333">distributivity, no complements, no counting.</text>
  <text x="40" y="689" font-size="11.5" fill="#333">Test: in the lattice of subspaces of F&#8322;&#178; the distributive laws of 4.3 Problems 7 and 8 both FAIL,</text>
  <text x="40" y="707" font-size="11.5" fill="#333">yet this containment still holds for all 5&#8308; = 625 quadruples of subspaces. Verified.</text>
</svg>