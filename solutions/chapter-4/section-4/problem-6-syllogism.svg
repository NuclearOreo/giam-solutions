<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 712" width="720" height="712" font-family="Georgia, serif">
  <defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#e9e9e9"/><line x1="0" y1="0" x2="0" y2="7" stroke="#999" stroke-width="1.6"/></pattern><clipPath id="cm22"><circle cx="157.3" cy="246.9" r="65.5"/></clipPath><mask id="nd22"><rect x="0" y="0" width="720" height="2000" fill="white"/><circle cx="222.7" cy="246.9" r="65.5" fill="black"/></mask><clipPath id="cm372"><circle cx="507.3" cy="246.9" r="65.5"/></clipPath><mask id="nd372"><rect x="0" y="0" width="720" height="2000" fill="white"/><circle cx="572.7" cy="246.9" r="65.5" fill="black"/></mask></defs>
  <rect x="0" y="0" width="720" height="712" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="90" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">ONE DIAGRAM, READ IN TWO DIRECTIONS</text>
  <text x="360" y="58" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8220;All men are mortal&#8221; means M &#8745; D&#772; is EMPTY &#8212; drawn by hatching that region out</text>
  <text x="360" y="80" font-size="11.5" fill="#333" text-anchor="middle">Both arguments then just ask: given where the &#215; is, which unshaded region can it possibly occupy?</text>
  <rect x="22" y="120" width="336" height="282" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="140" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">modus ponens</text><g clip-path="url(#cm22)"><g mask="url(#nd22)"><rect x="0" y="0" width="720" height="2000" fill="url(#hatch)"/></g></g><circle cx="157.3" cy="246.9" r="65.5" fill="none" stroke="#3b5b9b" stroke-width="2"/><circle cx="222.7" cy="246.9" r="65.5" fill="none" stroke="#1f6b34" stroke-width="2"/><text x="137.6" y="167.1" font-size="13" fill="#3b5b9b" text-anchor="middle" font-weight="bold">M</text><text x="242.4" y="167.1" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">D</text><text x="137.6" y="180.1" font-size="9" fill="#3b5b9b" text-anchor="middle">men</text><text x="242.4" y="180.1" font-size="9" fill="#1f6b34" text-anchor="middle">mortals</text><text x="123.2" y="250.9" font-size="9.5" fill="#777" text-anchor="middle">empty</text><text x="190.0" y="226.7" font-size="17" fill="#9b2c2c" text-anchor="middle" font-weight="bold">&#215;</text><text x="190.0" y="242.7" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">Socrates</text><text x="190.0" y="376" font-size="10.5" fill="#555" text-anchor="middle">the only unshaded part of M is M &#8745; D</text><text x="190.0" y="392" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">so Socrates is mortal</text><rect x="372" y="120" width="336" height="282" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="140" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">modus tollens</text><g clip-path="url(#cm372)"><g mask="url(#nd372)"><rect x="0" y="0" width="720" height="2000" fill="url(#hatch)"/></g></g><circle cx="507.3" cy="246.9" r="65.5" fill="none" stroke="#3b5b9b" stroke-width="2"/><circle cx="572.7" cy="246.9" r="65.5" fill="none" stroke="#1f6b34" stroke-width="2"/><text x="487.6" y="167.1" font-size="13" fill="#3b5b9b" text-anchor="middle" font-weight="bold">M</text><text x="592.4" y="167.1" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">D</text><text x="487.6" y="180.1" font-size="9" fill="#3b5b9b" text-anchor="middle">men</text><text x="592.4" y="180.1" font-size="9" fill="#1f6b34" text-anchor="middle">mortals</text><text x="473.2" y="250.9" font-size="9.5" fill="#777" text-anchor="middle">empty</text><text x="540.0" y="341.9" font-size="17" fill="#9b2c2c" text-anchor="middle" font-weight="bold">&#215;</text><text x="540.0" y="357.9" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">Zeus</text><text x="540.0" y="376" font-size="10.5" fill="#555" text-anchor="middle">outside D, the only unshaded part is M&#772; &#8745; D&#772;</text><text x="540.0" y="392" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">so Zeus is not a man</text>
  <rect x="18" y="418" width="684" height="134" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/><rect x="18" y="418" width="684" height="28" rx="6" fill="#eef2fa"/><rect x="18" y="438" width="684" height="8" fill="#eef2fa"/><line x1="18" y1="446" x2="702" y2="446" stroke="#3b5b9b" stroke-width="1.2"/><text x="46" y="437" font-size="10.5" fill="#3b5b9b" text-anchor="start" font-weight="bold">PREMISE ABOUT THE INDIVIDUAL</text><text x="390" y="437" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">REGIONS STILL OPEN</text><text x="600" y="437" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">VERDICT</text><text x="46" y="467" font-size="11" fill="#1f3a68">x &#8712; M&#160;&#160;(modus ponens)</text><text x="390" y="467" font-size="11" fill="#555" text-anchor="middle">M &#8745; D&#160;&#160;only</text><text x="600" y="467" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">x &#8712; D forced</text><rect x="19" y="473" width="682" height="23" fill="#fafafa"/><text x="46" y="490" font-size="11" fill="#1f3a68">x &#8713; D&#160;&#160;(modus tollens)</text><text x="390" y="490" font-size="11" fill="#555" text-anchor="middle">M&#772; &#8745; D&#772;&#160;&#160;only</text><text x="600" y="490" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">x &#8713; M forced</text><text x="46" y="513" font-size="11" fill="#1f3a68">x &#8712; D&#160;&#160;(affirming the consequent)</text><text x="390" y="513" font-size="11" fill="#555" text-anchor="middle">M &#8745; D&#160; or&#160; M&#772; &#8745; D</text><text x="600" y="513" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">nothing follows</text><rect x="19" y="519" width="682" height="23" fill="#fafafa"/><text x="46" y="536" font-size="11" fill="#1f3a68">x &#8713; M&#160;&#160;(denying the antecedent)</text><text x="390" y="536" font-size="11" fill="#555" text-anchor="middle">M&#772; &#8745; D&#160; or&#160; M&#772; &#8745; D&#772;</text><text x="600" y="536" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">nothing follows</text>
  <rect x="18" y="568" width="684" height="128" rx="6" fill="#fdecec" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="588" font-size="11.5" fill="#9b2c2c" font-weight="bold">THE SAME PICTURE EXPOSES THE TWO CLASSIC FALLACIES</text>
  <text x="40" y="612" font-size="11.5" fill="#333">A premise settles the matter only when it leaves <tspan font-style="italic">one</tspan> region open. Knowing x &#8712; D leaves two, and</text>
  <text x="40" y="630" font-size="11.5" fill="#333">so does knowing x &#8713; M &#8212; so neither yields a conclusion.</text>
  <text x="40" y="656" font-size="11.5" fill="#333">Exhaustive check over all 2187 configurations with M &#8838; D and all 7 choices of x: the two valid forms</text>
  <text x="40" y="674" font-size="11.5" fill="#333">never fail in 5103 instances each, while both fallacies fail already for a mortal who is not a man.</text>
</svg>