<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 838" width="720" height="838" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="838" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="96" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE CONJECTURE</text>
  <text x="400" y="56" font-size="15" fill="#1f3a68" text-anchor="middle" font-weight="bold">P&#8321; &#8842; P&#8322; &#8842; P&#8323; &#8842; P&#8324; &#8842; &#8943;</text>
  <text x="400" y="80" font-size="11.5" fill="#333" text-anchor="middle">a strictly decreasing chain &#8212; and more precisely, P&#8344; &#8838; P&#8345; holds exactly when m &#8805; n.</text>
  <text x="400" y="99" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">verified for p = 2, 3, 5 and all m, n up to 6</text>

  <text x="60" y="184" font-size="11.5" fill="#3b5b9b" font-weight="bold">NESTED, WITH p = 2</text>
  <rect x="60" y="200.0" width="470" height="180" rx="9" fill="#e8eef9" stroke="#3b5b9b" stroke-width="1.8"/><text x="69" y="217.0" font-size="12" fill="#3b5b9b" font-weight="bold">P&#8321;</text><text x="94" y="217.0" font-size="9.5" fill="#3b5b9b">multiples of 2</text><rect x="94" y="217.0" width="402" height="146" rx="9" fill="#eef3fb" stroke="#4a7ab5" stroke-width="1.8"/><text x="103" y="234.0" font-size="12" fill="#4a7ab5" font-weight="bold">P&#8322;</text><text x="128" y="234.0" font-size="9.5" fill="#4a7ab5">multiples of 4</text><rect x="128" y="234.0" width="334" height="112" rx="9" fill="#f3f7fc" stroke="#6b97c9" stroke-width="1.8"/><text x="137" y="251.0" font-size="12" fill="#6b97c9" font-weight="bold">P&#8323;</text><text x="162" y="251.0" font-size="9.5" fill="#6b97c9">multiples of 8</text><rect x="162" y="251.0" width="266" height="78" rx="9" fill="#f8fafd" stroke="#8db3da" stroke-width="1.8"/><text x="171" y="268.0" font-size="12" fill="#8db3da" font-weight="bold">P&#8324;</text><text x="196" y="268.0" font-size="9.5" fill="#8db3da">multiples of 16</text><circle cx="490" cy="364.0" r="12" fill="#ffffff" stroke="#9b2c2c" stroke-width="1.5"/><text x="490" y="368.0" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">2</text><circle cx="456" cy="347.0" r="12" fill="#ffffff" stroke="#9b2c2c" stroke-width="1.5"/><text x="456" y="351.0" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">4</text><circle cx="422" cy="330.0" r="12" fill="#ffffff" stroke="#9b2c2c" stroke-width="1.5"/><text x="422" y="334.0" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">8</text><circle cx="388" cy="313.0" r="12" fill="#ffffff" stroke="#9b2c2c" stroke-width="1.5"/><text x="388" y="317.0" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">16</text><text x="560" y="240" font-size="11" fill="#9b2c2c">each 2&#8319; sits in P&#8345;</text><text x="560" y="256" font-size="11" fill="#9b2c2c">but not in P&#8345;&#8330;&#8321;,</text><text x="560" y="272" font-size="11" fill="#9b2c2c">so each step is</text><text x="560" y="288" font-size="11" fill="#9b2c2c">strictly smaller.</text>

  <line x1="60" y1="468" x2="664" y2="468" stroke="#ccc" stroke-width="1"/><circle cx="78.9" cy="468" r="1.8" fill="#ddd"/><circle cx="97.8" cy="468" r="4.2" fill="#8db3da"/><text x="97.8" y="494" font-size="10" fill="#8db3da" text-anchor="middle" font-weight="bold">2</text><circle cx="116.6" cy="468" r="1.8" fill="#ddd"/><circle cx="135.5" cy="468" r="5.9" fill="#6b97c9"/><text x="135.5" y="494" font-size="10" fill="#6b97c9" text-anchor="middle" font-weight="bold">4</text><circle cx="154.4" cy="468" r="1.8" fill="#ddd"/><circle cx="173.2" cy="468" r="4.2" fill="#8db3da"/><circle cx="192.1" cy="468" r="1.8" fill="#ddd"/><circle cx="211.0" cy="468" r="7.6" fill="#4a7ab5"/><text x="211.0" y="494" font-size="10" fill="#4a7ab5" text-anchor="middle" font-weight="bold">8</text><circle cx="229.9" cy="468" r="1.8" fill="#ddd"/><circle cx="248.8" cy="468" r="4.2" fill="#8db3da"/><circle cx="267.6" cy="468" r="1.8" fill="#ddd"/><circle cx="286.5" cy="468" r="5.9" fill="#6b97c9"/><circle cx="305.4" cy="468" r="1.8" fill="#ddd"/><circle cx="324.2" cy="468" r="4.2" fill="#8db3da"/><circle cx="343.1" cy="468" r="1.8" fill="#ddd"/><circle cx="362.0" cy="468" r="9.3" fill="#3b5b9b"/><text x="362.0" y="494" font-size="10" fill="#3b5b9b" text-anchor="middle" font-weight="bold">16</text><circle cx="380.9" cy="468" r="1.8" fill="#ddd"/><circle cx="399.8" cy="468" r="4.2" fill="#8db3da"/><circle cx="418.6" cy="468" r="1.8" fill="#ddd"/><circle cx="437.5" cy="468" r="5.9" fill="#6b97c9"/><circle cx="456.4" cy="468" r="1.8" fill="#ddd"/><circle cx="475.2" cy="468" r="4.2" fill="#8db3da"/><circle cx="494.1" cy="468" r="1.8" fill="#ddd"/><circle cx="513.0" cy="468" r="7.6" fill="#4a7ab5"/><circle cx="531.9" cy="468" r="1.8" fill="#ddd"/><circle cx="550.8" cy="468" r="4.2" fill="#8db3da"/><circle cx="569.6" cy="468" r="1.8" fill="#ddd"/><circle cx="588.5" cy="468" r="5.9" fill="#6b97c9"/><circle cx="607.4" cy="468" r="1.8" fill="#ddd"/><circle cx="626.2" cy="468" r="4.2" fill="#8db3da"/><circle cx="645.1" cy="468" r="1.8" fill="#ddd"/><circle cx="664.0" cy="468" r="11.0" fill="#1f3a68"/><text x="664.0" y="494" font-size="10" fill="#1f3a68" text-anchor="middle" font-weight="bold">32</text><text x="60" y="444" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE INTEGERS 1 TO 32, DOT SIZE = HOW MANY FACTORS OF 2</text><text x="60" y="514" font-size="11" fill="#555">Bigger dots lie in deeper sets. Every dot eventually stops growing, which is why no integer is in all of them.</text>

  <rect x="18" y="552" width="684" height="130" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="572" font-size="11.5" fill="#1f6b34" font-weight="bold">THE PROOF, IN TWO LINES</text>
  <text x="40" y="596" font-size="11.5" fill="#333"><tspan font-weight="bold">Containment.</tspan>&#160; If p&#8319;&#8314;&#185; | x, write x = p&#8319;&#8314;&#185;k = p&#8319;(pk); since pk is an integer, p&#8319; | x. So P&#8345;&#8330;&#8321; &#8838; P&#8345;.</text>
  <text x="40" y="624" font-size="11.5" fill="#333"><tspan font-weight="bold">Strictness.</tspan>&#160; The number p&#8319; is in P&#8345;, but p&#8319;&#8314;&#185; &#8740; p&#8319; because 0 &lt; p&#8319; &lt; p&#8319;&#8314;&#185;. So p&#8319; &#8712; P&#8345; &#8722; P&#8345;&#8330;&#8321;,</text>
  <text x="40" y="642" font-size="11.5" fill="#333">and the containment is proper.</text>
  <text x="40" y="666" font-size="10.5" fill="#555" font-style="italic">Only p &#8805; 2 is used, never primality &#8212; see the remark.</text>

  <rect x="18" y="696" width="684" height="126" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="716" font-size="11.5" fill="#b06a10" font-weight="bold">THE CHAIN SHRINKS TO NOTHING</text>
  <text x="40" y="738" font-size="11.5" fill="#333">The sets get thinner geometrically: P&#8345; has density 1/p&#8319; among the positive integers. For p = 2 the</text>
  <text x="40" y="756" font-size="11.5" fill="#333">measured densities below 20 000 are 0.5000, 0.2500, 0.1250, 0.0625, 0.0313, &#8230; as predicted.</text>
  <text x="40" y="782" font-size="11.5" fill="#333">And the whole chain has empty intersection: given any x, choose n with p&#8319; &gt; x, and then x &#8713; P&#8345;.</text>
  <text x="40" y="804" font-size="11.5" fill="#1f3a68" font-weight="bold">So P&#8321; &#8839; P&#8322; &#8839; &#8943; is an infinite strictly decreasing chain with nothing left at the bottom.</text>
</svg>