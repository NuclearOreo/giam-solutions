<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 858" width="720" height="858" font-family="Georgia, serif">
  <defs><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#555"/></marker></defs>
  <rect x="0" y="0" width="720" height="858" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="74" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE ANSWER</text>
  <text x="400" y="38" font-size="15" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8709; corresponds to a <tspan fill="#9b2c2c">contradiction</tspan> &#8212; the always-false sentence c</text>
  <text x="400" y="64" font-size="11.5" fill="#333" text-anchor="middle">A set is the collection of things making an open sentence true. Nothing makes c true,</text>
  <text x="400" y="80" font-size="11.5" fill="#333" text-anchor="middle">so its collection is empty.</text>

  <text x="50" y="160" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE BRIDGE BETWEEN THE TWO SUBJECTS</text>
  <rect x="50" y="176" width="250" height="124" rx="7" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.8"/><text x="175.0" y="200" font-size="13" fill="#3b5b9b" text-anchor="middle" font-weight="bold">LOGIC</text><text x="175.0" y="226" font-size="12" fill="#333" text-anchor="middle">an open sentence P(x)</text><text x="175.0" y="246" font-size="12" fill="#333" text-anchor="middle">that is <tspan font-weight='bold'>always false</tspan></text><text x="175.0" y="266" font-size="12" fill="#333" text-anchor="middle"></text><text x="175.0" y="286" font-size="12" fill="#333" text-anchor="middle">the contradiction&#160; c</text><line x1="310" y1="238" x2="408" y2="238" stroke="#555" stroke-width="2" marker-end="url(#ab)"/><text x="359" y="228" font-size="10.5" fill="#555" text-anchor="middle">truth set</text><line x1="408" y1="260" x2="310" y2="260" stroke="#555" stroke-width="2" marker-end="url(#ab)"/><text x="359" y="278" font-size="10.5" fill="#555" text-anchor="middle">membership</text><rect x="420" y="176" width="250" height="124" rx="7" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.8"/><text x="545.0" y="200" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">SET THEORY</text><text x="545.0" y="226" font-size="12" fill="#333" text-anchor="middle">its truth set</text><text x="545.0" y="246" font-size="12" fill="#333" text-anchor="middle">S&#8346; = &#123; x : P(x) &#125;</text><text x="545.0" y="266" font-size="12" fill="#333" text-anchor="middle"></text><text x="545.0" y="286" font-size="12" fill="#333" text-anchor="middle">the empty set&#160; &#8709;</text>

  <text x="60" y="336" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE FULL DICTIONARY</text>
  <text x="660" y="336" font-size="10.5" fill="#555" text-anchor="end" font-style="italic">the first two rows are this exercise and the next</text>
  <rect x="60" y="355" width="600" height="25" rx="3" fill="#eef2fa" stroke="#9fb2d4"/><text x="170" y="374" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">in Logic</text><text x="340" y="374" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">in Set theory</text><text x="520" y="374" font-size="11.5" fill="#1f3a68" text-anchor="start" font-weight="bold">meaning</text><rect x="60" y="382" width="600" height="23" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="2.1"/><text x="170" y="400" font-size="12.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">c&#160; (contradiction)</text><text x="340" y="400" font-size="12.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">&#8709;&#160; (empty set)</text><text x="520" y="400" font-size="11" fill="#555">always false / no members</text><rect x="60" y="407" width="600" height="23" rx="3" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.4"/><text x="170" y="425" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">t&#160; (tautology)</text><text x="340" y="425" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">U&#160; (universal set)</text><text x="520" y="425" font-size="11" fill="#555">always true / all members</text><rect x="60" y="432" width="600" height="23" rx="3" fill="#fbfcfe" stroke="#e3e8f2" stroke-width="0.8"/><text x="170" y="450" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="normal">&#172;P</text><text x="340" y="450" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="normal">complement of S&#8346;</text><text x="520" y="450" font-size="11" fill="#555">not / complement</text><rect x="60" y="457" width="600" height="23" rx="3" fill="#fbfcfe" stroke="#e3e8f2" stroke-width="0.8"/><text x="170" y="475" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="normal">P &#8743; Q</text><text x="340" y="475" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="normal">S&#8346; &#8745; S&#8348;</text><text x="520" y="475" font-size="11" fill="#555">and / intersection</text><rect x="60" y="482" width="600" height="23" rx="3" fill="#fbfcfe" stroke="#e3e8f2" stroke-width="0.8"/><text x="170" y="500" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="normal">P &#8744; Q</text><text x="340" y="500" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="normal">S&#8346; &#8746; S&#8348;</text><text x="520" y="500" font-size="11" fill="#555">or / union</text><rect x="60" y="507" width="600" height="23" rx="3" fill="#fbfcfe" stroke="#e3e8f2" stroke-width="0.8"/><text x="170" y="525" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="normal">P &#8658; Q</text><text x="340" y="525" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="normal">S&#8346; &#8838; S&#8348;</text><text x="520" y="525" font-size="11" fill="#555">implies / subset</text>

  <rect x="18" y="576" width="684" height="140" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="596" font-size="11.5" fill="#1f6b34" font-weight="bold">THE LAWS TRANSLATE TOO</text>
  <text x="40" y="620" font-size="11.5" fill="#333">Every identity law about c becomes an identity law about &#8709;, with &#8743; reading as &#8745; and &#8744; as &#8746;:</text>
  <text x="130" y="646" font-size="12.5" fill="#1f3a68">A &#8743; c &#8801; c</text>
  <text x="330" y="646" font-size="12.5" fill="#555">becomes</text>
  <text x="500" y="646" font-size="12.5" fill="#1f3a68">A &#8745; &#8709; = &#8709;</text>
  <text x="130" y="668" font-size="12.5" fill="#1f3a68">A &#8744; c &#8801; A</text>
  <text x="330" y="668" font-size="12.5" fill="#555">becomes</text>
  <text x="500" y="668" font-size="12.5" fill="#1f3a68">A &#8746; &#8709; = A</text>
  <text x="130" y="690" font-size="12.5" fill="#1f3a68">&#172;c &#8801; t</text>
  <text x="330" y="690" font-size="12.5" fill="#555">becomes</text>
  <text x="500" y="690" font-size="12.5" fill="#1f3a68">complement of &#8709; = U</text>
  <text x="40" y="710" font-size="10.5" fill="#555" font-style="italic">All four verified on the universe &#123;1, &#8230;, 10&#125; with A = &#123;2, 3, 5, 7&#125;.</text>

  <rect x="18" y="730" width="684" height="112" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="750" font-size="11.5" fill="#b06a10" font-weight="bold">MANY SENTENCES, ONE SET</text>
  <text x="40" y="772" font-size="11.5" fill="#333">On the universe &#123;1, &#8230;, 10&#125;, both &#8220;x &gt; 20&#8221; and &#8220;x is even and x is odd&#8221; have empty truth set. They are</text>
  <text x="40" y="790" font-size="11.5" fill="#333">different sentences but the same set, so the correspondence is many-to-one.</text>
  <text x="40" y="816" font-size="11.5" fill="#333">Only the second is a contradiction outright; the first is merely false <tspan font-style="italic">on this universe</tspan>.</text>
</svg>