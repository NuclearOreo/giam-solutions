<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 796" width="720" height="796" font-family="Georgia, serif">
  <rect x="0" y="0.0" width="720" height="774" fill="#ffffff"/>

  <rect x="18" y="14.0" width="684" height="76" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE ANSWER</text>
  <text x="400" y="40.0" font-size="15" fill="#1f3a68" text-anchor="middle" font-weight="bold">P(x) = &#8220;&#8707; y &#8712; &#8469; such that x = y&#178;&#8221;</text>
  <text x="400" y="64.0" font-size="11.5" fill="#333" text-anchor="middle">in words, &#8220;x is a perfect square&#8221; &#8212; its truth set over &#8469; is exactly &#123;0, 1, 4, 9, 16, 25, &#8230;&#125;,</text>
  <text x="400" y="81.0" font-size="11.5" fill="#333" text-anchor="middle">verified for every x below 400.</text>

  <text x="34" y="154.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE TRUTH SET INSIDE &#8469;</text>
  <line x1="60" y1="224.0" x2="664" y2="224.0" stroke="#bbb" stroke-width="1"/><circle cx="60.0" cy="224" r="7" fill="#1f6b34"/><text x="60.0" y="248.0" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><circle cx="75.1" cy="224" r="7" fill="#1f6b34"/><text x="75.1" y="248.0" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">1</text><circle cx="90.2" cy="224" r="2" fill="#ddd"/><circle cx="105.3" cy="224" r="2" fill="#ddd"/><circle cx="120.4" cy="224" r="7" fill="#1f6b34"/><text x="120.4" y="248.0" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">4</text><circle cx="135.5" cy="224" r="2" fill="#ddd"/><circle cx="150.6" cy="224" r="2" fill="#ddd"/><circle cx="165.7" cy="224" r="2" fill="#ddd"/><circle cx="180.8" cy="224" r="2" fill="#ddd"/><circle cx="195.9" cy="224" r="7" fill="#1f6b34"/><text x="195.9" y="248.0" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">9</text><circle cx="211.0" cy="224" r="2" fill="#ddd"/><circle cx="226.1" cy="224" r="2" fill="#ddd"/><circle cx="241.2" cy="224" r="2" fill="#ddd"/><circle cx="256.3" cy="224" r="2" fill="#ddd"/><circle cx="271.4" cy="224" r="2" fill="#ddd"/><circle cx="286.5" cy="224" r="2" fill="#ddd"/><circle cx="301.6" cy="224" r="7" fill="#1f6b34"/><text x="301.6" y="248.0" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">16</text><circle cx="316.7" cy="224" r="2" fill="#ddd"/><circle cx="331.8" cy="224" r="2" fill="#ddd"/><circle cx="346.9" cy="224" r="2" fill="#ddd"/><circle cx="362.0" cy="224" r="2" fill="#ddd"/><circle cx="377.1" cy="224" r="2" fill="#ddd"/><circle cx="392.2" cy="224" r="2" fill="#ddd"/><circle cx="407.3" cy="224" r="2" fill="#ddd"/><circle cx="422.4" cy="224" r="2" fill="#ddd"/><circle cx="437.5" cy="224" r="7" fill="#1f6b34"/><text x="437.5" y="248.0" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">25</text><circle cx="452.6" cy="224" r="2" fill="#ddd"/><circle cx="467.7" cy="224" r="2" fill="#ddd"/><circle cx="482.8" cy="224" r="2" fill="#ddd"/><circle cx="497.9" cy="224" r="2" fill="#ddd"/><circle cx="513.0" cy="224" r="2" fill="#ddd"/><circle cx="528.1" cy="224" r="2" fill="#ddd"/><circle cx="543.2" cy="224" r="2" fill="#ddd"/><circle cx="558.3" cy="224" r="2" fill="#ddd"/><circle cx="573.4" cy="224" r="2" fill="#ddd"/><circle cx="588.5" cy="224" r="2" fill="#ddd"/><circle cx="603.6" cy="224" r="7" fill="#1f6b34"/><text x="603.6" y="248.0" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">36</text><circle cx="618.7" cy="224" r="2" fill="#ddd"/><circle cx="633.8" cy="224" r="2" fill="#ddd"/><circle cx="648.9" cy="224" r="2" fill="#ddd"/><circle cx="664.0" cy="224" r="2" fill="#ddd"/><path d="M60.0,215 Q67.5,190 75.1,215" fill="none" stroke="#b06a10" stroke-width="1.2"/><text x="67.5" y="188.0" font-size="10" fill="#b06a10" text-anchor="middle">+1</text><path d="M75.1,215 Q97.8,190 120.4,215" fill="none" stroke="#b06a10" stroke-width="1.2"/><text x="97.8" y="188.0" font-size="10" fill="#b06a10" text-anchor="middle">+3</text><path d="M120.4,215 Q158.2,190 195.9,215" fill="none" stroke="#b06a10" stroke-width="1.2"/><text x="158.2" y="188.0" font-size="10" fill="#b06a10" text-anchor="middle">+5</text><path d="M195.9,215 Q248.8,190 301.6,215" fill="none" stroke="#b06a10" stroke-width="1.2"/><text x="248.8" y="188.0" font-size="10" fill="#b06a10" text-anchor="middle">+7</text><path d="M301.6,215 Q369.6,190 437.5,215" fill="none" stroke="#b06a10" stroke-width="1.2"/><text x="369.6" y="188.0" font-size="10" fill="#b06a10" text-anchor="middle">+9</text><path d="M437.5,215 Q520.5,190 603.6,215" fill="none" stroke="#b06a10" stroke-width="1.2"/><text x="520.5" y="188.0" font-size="10" fill="#b06a10" text-anchor="middle">+11</text><text x="60" y="172.0" font-size="10.5" fill="#b06a10">gaps are the odd numbers &#8212; so n&#178; = 1 + 3 + 5 + &#8943; + (2n &#8722; 1)</text>

  <text x="26" y="312.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">THREE CANDIDATE SENTENCES &#8212; two work, one nearly does</text>
  <rect x="26" y="328.0" width="212" height="146" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.6"/><text x="132.0" y="350.0" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">the standard answer</text><text x="37" y="374.0" font-size="10.6" fill="#333">&#8707; y &#8712; &#8469;,&#160; x = y&#178;</text><text x="37" y="391.0" font-size="10.6" fill="#333"></text><text x="37" y="408.0" font-size="10.6" fill="#333">&#8220;x is a perfect square&#8221;</text><text x="37" y="425.0" font-size="10.6" fill="#333"></text><text x="37" y="442.0" font-size="10.6" fill="#333">Truth set is exactly</text><text x="37" y="459.0" font-size="10.6" fill="#333">&#123;0, 1, 4, 9, 16, &#8230;&#125;.</text><rect x="254" y="328.0" width="212" height="146" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.6"/><text x="360.0" y="350.0" font-size="11.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">an equivalent phrasing</text><text x="265" y="374.0" font-size="10.6" fill="#333">&#8730;x is an integer</text><text x="265" y="391.0" font-size="10.6" fill="#333"></text><text x="265" y="408.0" font-size="10.6" fill="#333">Same truth set, verified</text><text x="265" y="425.0" font-size="10.6" fill="#333">over 0 &#8804; x &lt; 400.</text><text x="265" y="442.0" font-size="10.6" fill="#333"></text><text x="265" y="459.0" font-size="10.6" fill="#333">No quantifier needed.</text><rect x="482" y="328.0" width="212" height="146" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.6"/><text x="588.0" y="350.0" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">a subtler characterisation</text><text x="493" y="374.0" font-size="10.6" fill="#333">x has an odd number</text><text x="493" y="391.0" font-size="10.6" fill="#333">of divisors</text><text x="493" y="408.0" font-size="10.6" fill="#333"></text><text x="493" y="425.0" font-size="10.6" fill="#333">True for 1, 4, 9, 16, &#8230;</text><text x="493" y="442.0" font-size="10.6" fill="#333">but <tspan font-weight='bold'>fails at x = 0</tspan>,</text><text x="493" y="459.0" font-size="10.6" fill="#333">which has infinitely many.</text>

  <rect x="18" y="518.0" width="684" height="130" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="538.0" font-size="11.5" fill="#b06a10" font-weight="bold">WHY THE THIRD ONE FAILS, AND WHY IT ALMOST WORKS</text>
  <text x="40" y="560.0" font-size="11.5" fill="#333">Divisors of n pair off as d &#8596; n/d. The pairing breaks only when d = n/d, that is n = d&#178;, so a positive</text>
  <text x="40" y="578.0" font-size="11.5" fill="#333">integer has an odd number of divisors exactly when it is a square &#8212; checked for every n below 400.</text>
  <text x="40" y="604.0" font-size="11.5" fill="#333">But 0 is divisible by every integer, so it has infinitely many divisors and the parity test says nothing.</text>
  <text x="40" y="622.0" font-size="11.5" fill="#333">The truth set is &#123;1, 4, 9, 16, &#8230;&#125; &#8212; correct except for the very first element the problem asks for.</text>
  <text x="40" y="642.0" font-size="10.5" fill="#555" font-style="italic">A near-miss is still a wrong answer: truth sets must match exactly, element for element.</text>

  <rect x="18" y="662.0" width="684" height="146" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.2"/>
  <text x="34" y="682.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE SET IS SPARSE, AND GETS SPARSER</text>
  <text x="40" y="704.0" font-size="11.5" fill="#333">Squares below 10: four of them, 40%. Below 100: ten, 10%. Below 10 000: one hundred, 1%.</text>
  <text x="40" y="724.0" font-size="11.5" fill="#333">In general there are about &#8730;N squares below N, so the density &#8730;N / N tends to zero.</text>
  <text x="40" y="754.0" font-size="11.5" fill="#333">The ellipsis in &#123;0, 1, 4, 9, &#8230;&#125; is doing real work: a finite list names no pattern, and an open sentence is</text>
  <text x="40" y="772.0" font-size="11.5" fill="#333">exactly what turns the intended pattern into something checkable.</text>
</svg>