<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 807" width="720" height="807" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="807" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="76" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE ANSWERS</text>
  <text x="250" y="60" font-size="17" fill="#1f6b34" text-anchor="middle" font-weight="bold">|A| = 3</text>
  <text x="490" y="60" font-size="17" fill="#9b2c2c" text-anchor="middle" font-weight="bold">|B| = 1</text>
  <text x="370" y="82" font-size="11" fill="#555" text-anchor="middle" font-style="italic">cardinality counts elements at the top level only &#8212; it never looks inside them</text>

  <text x="34" y="138" font-size="11.5" fill="#3b5b9b" font-weight="bold">WHAT IS ACTUALLY IN EACH SET</text>
  <rect x="58" y="182" width="300" height="118" rx="9" fill="#f1f8f2" stroke="#1f6b34" stroke-width="2.2"/><text x="208.0" y="168" font-size="15" fill="#1f6b34" text-anchor="middle" font-weight="bold">A = &#123;1, 2, &#123;3, 4, 5&#125;&#125;</text><circle cx="98" cy="240" r="20" fill="#ffffff" stroke="#1f6b34" stroke-width="1.6"/><text x="98" y="246" font-size="15" fill="#1f6b34" text-anchor="middle" font-weight="bold">1</text><circle cx="152" cy="240" r="20" fill="#ffffff" stroke="#1f6b34" stroke-width="1.6"/><text x="152" y="246" font-size="15" fill="#1f6b34" text-anchor="middle" font-weight="bold">2</text><rect x="214" y="208" width="120" height="64" rx="7" fill="#ffffff" stroke="#1f6b34" stroke-width="1.6" stroke-dasharray="5 3"/><circle cx="238" cy="240" r="14" fill="#eef2fa" stroke="#8fa3c8" stroke-width="1.2"/><text x="238" y="245" font-size="12" fill="#5d7cb5" text-anchor="middle">3</text><circle cx="274" cy="240" r="14" fill="#eef2fa" stroke="#8fa3c8" stroke-width="1.2"/><text x="274" y="245" font-size="12" fill="#5d7cb5" text-anchor="middle">4</text><circle cx="310" cy="240" r="14" fill="#eef2fa" stroke="#8fa3c8" stroke-width="1.2"/><text x="310" y="245" font-size="12" fill="#5d7cb5" text-anchor="middle">5</text><text x="274" y="288" font-size="9.5" fill="#666" text-anchor="middle" font-style="italic">one object</text><text x="208.0" y="326" font-size="14" fill="#1f6b34" text-anchor="middle" font-weight="bold">|A| = 3</text><text x="208.0" y="343" font-size="10.5" fill="#555" text-anchor="middle">three things at the top level</text><rect x="396" y="182" width="266" height="118" rx="9" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="2.2"/><text x="529.0" y="168" font-size="15" fill="#9b2c2c" text-anchor="middle" font-weight="bold">B = &#123;&#123;1, 2, 3, 4, 5&#125;&#125;</text><rect x="418" y="208" width="222" height="64" rx="7" fill="#ffffff" stroke="#9b2c2c" stroke-width="1.6" stroke-dasharray="5 3"/><circle cx="446" cy="240" r="14" fill="#fdecec" stroke="#c98b8b" stroke-width="1.2"/><text x="446" y="245" font-size="12" fill="#9b2c2c" text-anchor="middle">1</text><circle cx="488" cy="240" r="14" fill="#fdecec" stroke="#c98b8b" stroke-width="1.2"/><text x="488" y="245" font-size="12" fill="#9b2c2c" text-anchor="middle">2</text><circle cx="530" cy="240" r="14" fill="#fdecec" stroke="#c98b8b" stroke-width="1.2"/><text x="530" y="245" font-size="12" fill="#9b2c2c" text-anchor="middle">3</text><circle cx="572" cy="240" r="14" fill="#fdecec" stroke="#c98b8b" stroke-width="1.2"/><text x="572" y="245" font-size="12" fill="#9b2c2c" text-anchor="middle">4</text><circle cx="614" cy="240" r="14" fill="#fdecec" stroke="#c98b8b" stroke-width="1.2"/><text x="614" y="245" font-size="12" fill="#9b2c2c" text-anchor="middle">5</text><text x="529" y="288" font-size="9.5" fill="#666" text-anchor="middle" font-style="italic">one object</text><text x="529.0" y="326" font-size="14" fill="#9b2c2c" text-anchor="middle" font-weight="bold">|B| = 1</text><text x="529.0" y="343" font-size="10.5" fill="#555" text-anchor="middle">one thing at the top level</text>

  <text x="60" y="376" font-size="11.5" fill="#3b5b9b" font-weight="bold">THREE SETS BUILT FROM THE SAME FIVE NUMBERS</text>
  <rect x="60" y="395" width="600" height="25" rx="3" fill="#eef2fa" stroke="#9fb2d4"/><text x="190" y="414" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the set</text><text x="360" y="414" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">cardinality</text><text x="500" y="414" font-size="11.5" fill="#1f3a68" text-anchor="start" font-weight="bold">what the elements are</text><rect x="60" y="422" width="600" height="23" rx="3" fill="#fafbfd" stroke="#3b5b9b" stroke-width="0.9"/><text x="190" y="440" font-size="12" fill="#333" text-anchor="middle">&#123;1, 2, 3, 4, 5&#125;</text><text x="360" y="440" font-size="13" fill="#3b5b9b" text-anchor="middle" font-weight="bold">5</text><text x="500" y="440" font-size="11" fill="#555">five separate numbers</text><rect x="60" y="447" width="600" height="23" rx="3" fill="#f1f8f2" stroke="#1f6b34" stroke-width="0.9"/><text x="190" y="465" font-size="12" fill="#333" text-anchor="middle">&#123;1, 2, &#123;3, 4, 5&#125;&#125;</text><text x="360" y="465" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">3</text><text x="500" y="465" font-size="11" fill="#555">two numbers and one set</text><rect x="60" y="472" width="600" height="23" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.9"/><text x="190" y="490" font-size="12" fill="#333" text-anchor="middle">&#123;&#123;1, 2, 3, 4, 5&#125;&#125;</text><text x="360" y="490" font-size="13" fill="#9b2c2c" text-anchor="middle" font-weight="bold">1</text><text x="500" y="490" font-size="11" fill="#555">a single set, nested once</text>

  <rect x="18" y="541" width="684" height="126" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="561" font-size="11.5" fill="#b06a10" font-weight="bold">A BRACE IS A CONTAINER, AND THE CONTAINER IS ONE THING</text>
  <text x="40" y="583" font-size="11.5" fill="#333">In A the numbers 3, 4, 5 have been packed into a box. That box is a single element of A, so it counts once,</text>
  <text x="40" y="601" font-size="11.5" fill="#333">and the three numbers inside it count not at all.</text>
  <text x="40" y="627" font-size="11.5" fill="#333">Membership confirms it: 1 &#8712; A is true, &#123;3, 4, 5&#125; &#8712; A is true, but <tspan font-weight="bold">3 &#8712; A is false</tspan> &#8212; the number 3 is</text>
  <text x="40" y="645" font-size="11.5" fill="#333">an element of an element of A, which is not the same as being an element of A.</text>

  <rect x="18" y="681" width="684" height="110" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.2"/>
  <text x="34" y="701" font-size="11.5" fill="#3b5b9b" font-weight="bold">A CONSEQUENCE WORTH CHECKING</text>
  <text x="40" y="723" font-size="11.5" fill="#333">Since cardinality drives the power set, these sets differ there too:</text>
  <text x="40" y="747" font-size="12.5" fill="#1f3a68">|&#8473;(A)| = 2&#179; = 8&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;|&#8473;(B)| = 2&#185; = 2</text>
  <text x="40" y="773" font-size="11" fill="#555" font-style="italic">Both computed directly, along with every membership claim above.</text>
</svg>