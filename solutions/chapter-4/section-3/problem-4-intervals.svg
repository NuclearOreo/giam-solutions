<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 737" width="720" height="737" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="737" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="96" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE TWO ANSWERS</text>
  <text x="360" y="60" font-size="15" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8899; I&#8345; = (&#8722;&#8734;, 1)&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#8898; I&#8345; = [&#8722;1, 0]</text>
  <text x="360" y="84" font-size="11.5" fill="#333" text-anchor="middle">The left ends run off to &#8722;&#8734;; the right ends shrink down to 0. Both answers checked at many points.</text>

  <line x1="119.0" y1="128" x2="119.0" y2="140" stroke="#bbb" stroke-width="1"/><text x="119.0" y="122" font-size="10" fill="#888" text-anchor="middle">-5</text><line x1="201.5" y1="128" x2="201.5" y2="140" stroke="#bbb" stroke-width="1"/><text x="201.5" y="122" font-size="10" fill="#888" text-anchor="middle">-4</text><line x1="284.1" y1="128" x2="284.1" y2="140" stroke="#bbb" stroke-width="1"/><text x="284.1" y="122" font-size="10" fill="#888" text-anchor="middle">-3</text><line x1="366.6" y1="128" x2="366.6" y2="140" stroke="#bbb" stroke-width="1"/><text x="366.6" y="122" font-size="10" fill="#888" text-anchor="middle">-2</text><line x1="449.2" y1="128" x2="449.2" y2="140" stroke="#bbb" stroke-width="1"/><text x="449.2" y="122" font-size="10" fill="#888" text-anchor="middle">-1</text><line x1="531.7" y1="128" x2="531.7" y2="140" stroke="#bbb" stroke-width="1"/><text x="531.7" y="122" font-size="10" fill="#888" text-anchor="middle">0</text><line x1="614.2" y1="128" x2="614.2" y2="140" stroke="#bbb" stroke-width="1"/><text x="614.2" y="122" font-size="10" fill="#888" text-anchor="middle">1</text><line x1="76" y1="134" x2="672" y2="134" stroke="#ccc" stroke-width="1"/><line x1="449.2" y1="160" x2="614.2" y2="160" stroke="#3b5b9b" stroke-width="3.4"/><circle cx="449.2" cy="160" r="4.4" fill="#3b5b9b"/><circle cx="614.2" cy="160" r="4.4" fill="#ffffff" stroke="#3b5b9b" stroke-width="2"/><text x="60" y="164" font-size="11.5" fill="#3b5b9b" text-anchor="end" font-weight="bold">I<tspan baseline-shift='sub' font-size='8'>1</tspan></text><line x1="366.6" y1="190" x2="573.0" y2="190" stroke="#3b5b9b" stroke-width="3.4"/><circle cx="366.6" cy="190" r="4.4" fill="#3b5b9b"/><circle cx="573.0" cy="190" r="4.4" fill="#ffffff" stroke="#3b5b9b" stroke-width="2"/><text x="60" y="194" font-size="11.5" fill="#3b5b9b" text-anchor="end" font-weight="bold">I<tspan baseline-shift='sub' font-size='8'>2</tspan></text><line x1="284.1" y1="220" x2="559.2" y2="220" stroke="#3b5b9b" stroke-width="3.4"/><circle cx="284.1" cy="220" r="4.4" fill="#3b5b9b"/><circle cx="559.2" cy="220" r="4.4" fill="#ffffff" stroke="#3b5b9b" stroke-width="2"/><text x="60" y="224" font-size="11.5" fill="#3b5b9b" text-anchor="end" font-weight="bold">I<tspan baseline-shift='sub' font-size='8'>3</tspan></text><line x1="201.5" y1="250" x2="552.3" y2="250" stroke="#3b5b9b" stroke-width="3.4"/><circle cx="201.5" cy="250" r="4.4" fill="#3b5b9b"/><circle cx="552.3" cy="250" r="4.4" fill="#ffffff" stroke="#3b5b9b" stroke-width="2"/><text x="60" y="254" font-size="11.5" fill="#3b5b9b" text-anchor="end" font-weight="bold">I<tspan baseline-shift='sub' font-size='8'>4</tspan></text><line x1="119.0" y1="280" x2="548.2" y2="280" stroke="#3b5b9b" stroke-width="3.4"/><circle cx="119.0" cy="280" r="4.4" fill="#3b5b9b"/><circle cx="548.2" cy="280" r="4.4" fill="#ffffff" stroke="#3b5b9b" stroke-width="2"/><text x="60" y="284" font-size="11.5" fill="#3b5b9b" text-anchor="end" font-weight="bold">I<tspan baseline-shift='sub' font-size='8'>5</tspan></text><line x1="70" y1="328" x2="614.2" y2="328" stroke="#9b2c2c" stroke-width="3.4"/><path d="M 70 328 l 9 -5 l 0 10 z" fill="#9b2c2c"/><circle cx="614.2" cy="328" r="4.4" fill="#ffffff" stroke="#9b2c2c" stroke-width="2"/><text x="60" y="332" font-size="14" fill="#9b2c2c" text-anchor="end" font-weight="bold">&#8899; I<tspan baseline-shift='sub' font-size='8'>n</tspan></text><text x="626.2" y="332" font-size="11.5" fill="#9b2c2c" font-weight="bold">= (&#8722;&#8734;, 1)</text><line x1="449.2" y1="360" x2="531.7" y2="360" stroke="#1f6b34" stroke-width="3.4"/><circle cx="449.2" cy="360" r="4.4" fill="#1f6b34"/><circle cx="531.7" cy="360" r="4.4" fill="#1f6b34"/><text x="60" y="364" font-size="14" fill="#1f6b34" text-anchor="end" font-weight="bold">&#8898; I<tspan baseline-shift='sub' font-size='8'>n</tspan></text><text x="543.7" y="364" font-size="11.5" fill="#1f6b34" font-weight="bold">= [&#8722;1, 0]&#160;&#160;&#160;&#160;the intersection</text><text x="626.2" y="348" font-size="10" fill="#9b2c2c" font-style="italic">the union</text><line x1="70" y1="392" x2="531.7" y2="392" stroke="#7a4fa3" stroke-width="3.4"/><path d="M 70 392 l 9 -5 l 0 10 z" fill="#7a4fa3"/><circle cx="531.7" cy="392" r="4.4" fill="#7a4fa3"/><text x="60" y="396" font-size="13" fill="#7a4fa3" text-anchor="end" font-weight="bold">lim I<tspan baseline-shift='sub' font-size='8'>n</tspan></text><text x="543.7" y="396" font-size="11.5" fill="#7a4fa3" font-weight="bold">= (&#8722;&#8734;, 0]&#160;&#160;&#160;&#160;the limit (see below)</text><text x="86" y="420" font-size="10.5" fill="#777" font-style="italic">filled dot = endpoint included, hollow dot = excluded</text>

  <rect x="18" y="448" width="684" height="126" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="468" font-size="11.5" fill="#1f6b34" font-weight="bold">WHY 0 SURVIVES, THOUGH EVERY I&#8345; IS OPEN ON THE RIGHT</text>
  <text x="40" y="492" font-size="11.5" fill="#333">0 &lt; 1/n holds for every n, so 0 &#8712; I&#8345; for every n &#8212; verified. The intersection is therefore <tspan font-style="italic">closed</tspan>,</text>
  <text x="40" y="510" font-size="11.5" fill="#333">even though not one of the sets being intersected is.</text>
  <text x="40" y="536" font-size="11.5" fill="#333">Any x &gt; 0 is excluded: pick n &gt; 1/x. For x = 1/1000 the first n that drops it is n = 1000. The left</text>
  <text x="40" y="554" font-size="11.5" fill="#333">endpoint &#8722;1 comes from I&#8321; alone, the tightest of all the left constraints.</text>

  <rect x="18" y="587" width="684" height="134" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="607" font-size="11.5" fill="#b06a10" font-weight="bold">NEITHER ANSWER IS THE LIMIT OF THE FAMILY</text>
  <text x="40" y="631" font-size="11.5" fill="#333">Discarding the first N &#8722; 1 intervals, the tails were verified to be</text>
  <text x="360" y="657" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8899;&#8345;&#8805;&#8342; I&#8345; = (&#8722;&#8734;, 1/N)&#160;&#160;&#160;&#160;&#160;&#160;&#8898;&#8345;&#8805;&#8342; I&#8345; = [&#8722;N, 0]</text>
  <text x="40" y="683" font-size="11.5" fill="#333">Shrinking the first and growing the second both give (&#8722;&#8734;, 0], so limsup = liminf and the family</text>
  <text x="40" y="701" font-size="11.5" fill="#333">converges to (&#8722;&#8734;, 0] &#8212; a third set, equal to neither the union nor the intersection.</text>
</svg>