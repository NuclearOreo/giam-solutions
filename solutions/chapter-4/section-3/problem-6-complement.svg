<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 605" width="720" height="605" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="605" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="92" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE ANSWER</text>
  <text x="360" y="62" font-size="17" fill="#1f3a68" text-anchor="middle" font-weight="bold">Y = U,&#160;&#160;the universal set</text>
  <text x="360" y="88" font-size="11.5" fill="#333" text-anchor="middle">And it is the only one: put A = &#8709;, and the condition reads Y = (the complement of &#8709;) = U.</text>

  <rect x="22" y="124" width="336" height="182" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="36" y="144" font-size="12" fill="#3b5b9b" font-weight="bold">U &#9651; A = A&#772;</text><rect x="44" y="156" width="292" height="96" fill="#1f6b34" stroke="#555" stroke-width="1.2"/><ellipse cx="195.84" cy="204.0" rx="54" ry="34" fill="#ffffff" stroke="#1f3a68" stroke-width="1.4"/><text x="195.84" y="209.0" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="bold">A</text><text x="52" y="172" font-size="10.5" fill="#ffffff" font-weight="bold">U</text><text x="326" y="242" font-size="11" fill="#ffffff" text-anchor="end" font-style="italic">shaded = A&#772;</text><text x="36" y="262" font-size="10.5" fill="#555">Everything is in U, so the &#8220;exactly one of&#8221;</text><text x="36" y="277" font-size="10.5" fill="#555">test keeps a point precisely when it fails to</text><text x="36" y="292" font-size="10.5" fill="#555">be in A. That is the definition of A&#772;.</text><rect x="372" y="124" width="336" height="182" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="386" y="144" font-size="12" fill="#3b5b9b" font-weight="bold">U IS THE ALL-ONES VECTOR: IT FLIPS EVERY BIT</text><text x="466" y="182" font-size="11.5" fill="#3b5b9b" text-anchor="end" font-weight="bold">A</text><rect x="480" y="166" width="22" height="22" rx="2" fill="#3b5b9b" stroke="#ddd" stroke-width="0.6"/><text x="491.0" y="182" font-size="11" fill="#ffffff" text-anchor="middle">1</text><rect x="506" y="166" width="22" height="22" rx="2" fill="#3b5b9b" stroke="#ddd" stroke-width="0.6"/><text x="517.0" y="182" font-size="11" fill="#ffffff" text-anchor="middle">1</text><rect x="532" y="166" width="22" height="22" rx="2" fill="#f4f4f4" stroke="#ddd" stroke-width="0.6"/><text x="543.0" y="182" font-size="11" fill="#bbb" text-anchor="middle">0</text><rect x="558" y="166" width="22" height="22" rx="2" fill="#3b5b9b" stroke="#ddd" stroke-width="0.6"/><text x="569.0" y="182" font-size="11" fill="#ffffff" text-anchor="middle">1</text><rect x="584" y="166" width="22" height="22" rx="2" fill="#f4f4f4" stroke="#ddd" stroke-width="0.6"/><text x="595.0" y="182" font-size="11" fill="#bbb" text-anchor="middle">0</text><text x="466" y="216" font-size="11.5" fill="#9b2c2c" text-anchor="end" font-weight="bold">U</text><rect x="480" y="200" width="22" height="22" rx="2" fill="#9b2c2c" stroke="#ddd" stroke-width="0.6"/><text x="491.0" y="216" font-size="11" fill="#ffffff" text-anchor="middle">1</text><rect x="506" y="200" width="22" height="22" rx="2" fill="#9b2c2c" stroke="#ddd" stroke-width="0.6"/><text x="517.0" y="216" font-size="11" fill="#ffffff" text-anchor="middle">1</text><rect x="532" y="200" width="22" height="22" rx="2" fill="#9b2c2c" stroke="#ddd" stroke-width="0.6"/><text x="543.0" y="216" font-size="11" fill="#ffffff" text-anchor="middle">1</text><rect x="558" y="200" width="22" height="22" rx="2" fill="#9b2c2c" stroke="#ddd" stroke-width="0.6"/><text x="569.0" y="216" font-size="11" fill="#ffffff" text-anchor="middle">1</text><rect x="584" y="200" width="22" height="22" rx="2" fill="#9b2c2c" stroke="#ddd" stroke-width="0.6"/><text x="595.0" y="216" font-size="11" fill="#ffffff" text-anchor="middle">1</text><line x1="476" y1="228" x2="606" y2="228" stroke="#999" stroke-width="1"/><text x="466" y="250" font-size="11.5" fill="#1f6b34" text-anchor="end" font-weight="bold">XOR</text><rect x="480" y="234" width="22" height="22" rx="2" fill="#f4f4f4" stroke="#ddd" stroke-width="0.6"/><text x="491.0" y="250" font-size="11" fill="#bbb" text-anchor="middle">0</text><rect x="506" y="234" width="22" height="22" rx="2" fill="#f4f4f4" stroke="#ddd" stroke-width="0.6"/><text x="517.0" y="250" font-size="11" fill="#bbb" text-anchor="middle">0</text><rect x="532" y="234" width="22" height="22" rx="2" fill="#1f6b34" stroke="#ddd" stroke-width="0.6"/><text x="543.0" y="250" font-size="11" fill="#ffffff" text-anchor="middle">1</text><rect x="558" y="234" width="22" height="22" rx="2" fill="#f4f4f4" stroke="#ddd" stroke-width="0.6"/><text x="569.0" y="250" font-size="11" fill="#bbb" text-anchor="middle">0</text><rect x="584" y="234" width="22" height="22" rx="2" fill="#1f6b34" stroke="#ddd" stroke-width="0.6"/><text x="595.0" y="250" font-size="11" fill="#ffffff" text-anchor="middle">1</text><text x="616" y="250" font-size="10.5" fill="#1f6b34" font-style="italic">= A&#772;</text><text x="386" y="277" font-size="10.5" fill="#555">XOR with 1 flips a bit, so XOR with the all-ones</text><text x="386" y="292" font-size="10.5" fill="#555">vector flips all of them at once.</text>
  <rect x="18" y="322" width="684" height="125" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/><rect x="18" y="322" width="684" height="30" rx="6" fill="#eef2fa"/><rect x="18" y="344" width="684" height="8" fill="#eef2fa"/><line x1="18" y1="352" x2="702" y2="352" stroke="#3b5b9b" stroke-width="1.2"/><text x="54" y="342" font-size="10.5" fill="#3b5b9b" text-anchor="start" font-weight="bold">TRANSLATE BY</text><text x="250" y="342" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">THE MAP A &#8614; Y &#9651; A</text><text x="520" y="342" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">WHICH IS&#8230;</text><text x="54" y="374" font-size="12" fill="#1f3a68" font-weight="bold">Y = &#8709;</text><text x="250" y="374" font-size="12" fill="#1f3a68" text-anchor="middle">A &#8614; A</text><text x="520" y="374" font-size="11" fill="#666" text-anchor="middle">the identity map &#8212; Problem 5</text><rect x="19" y="382" width="682" height="27" fill="#fafafa"/><text x="54" y="401" font-size="12" fill="#1f3a68" font-weight="bold">Y = U</text><text x="250" y="401" font-size="12" fill="#1f3a68" text-anchor="middle">A &#8614; A&#772;</text><text x="520" y="401" font-size="11" fill="#1f6b34" text-anchor="middle">complementation &#8212; this problem</text><text x="54" y="428" font-size="12" fill="#1f3a68" font-weight="bold">any Y</text><text x="250" y="428" font-size="12" fill="#1f3a68" text-anchor="middle">A &#8614; Y &#9651; A</text><text x="520" y="428" font-size="11" fill="#666" text-anchor="middle">always a bijection; 32 distinct maps in all</text>

  <rect x="18" y="463" width="684" height="126" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="483" font-size="11.5" fill="#1f6b34" font-weight="bold">COMPLEMENT IS NOT A NEW OPERATION</text>
  <text x="40" y="507" font-size="11.5" fill="#333">Since A&#772; = U &#9651; A, complementation is just translation by U inside the group (P(U), &#9651;). Verified:</text>
  <text x="360" y="533" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">A&#772; = U &#9651; A&#160;&#160;&#160;&#160;&#160;A &#8746; B = A &#9651; B &#9651; (A &#8745; B)&#160;&#160;&#160;&#160;&#160;A \ B = A &#9651; (A &#8745; B)</text>
  <text x="40" y="559" font-size="11.5" fill="#333">So &#9651; and &#8745; alone generate every set operation in the book &#8212; one more sign that these two are the</text>
  <text x="40" y="577" font-size="11.5" fill="#333">primitive pair, playing addition and multiplication in the Boolean ring.</text>
</svg>