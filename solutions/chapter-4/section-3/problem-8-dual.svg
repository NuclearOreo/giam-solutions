<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 777" width="720" height="777" font-family="Georgia, serif">
  <defs><clipPath id="Lb"><circle cx="165.8" cy="248.0" r="40"/></clipPath></defs>
  <rect x="0" y="0" width="720" height="777" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="90" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE DUAL OF PROBLEM 7, PROVED DIRECTLY</text>
  <text x="360" y="58" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">A &#8746; (B &#8745; C) = (A &#8746; B) &#8745; (A &#8746; C)</text>
  <text x="360" y="80" font-size="11.5" fill="#333" text-anchor="middle">Verified over all 32768 triples from a 5-element universe, as were both containments separately.</text>

  <rect x="22" y="122" width="336" height="216" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><circle cx="190.0" cy="206.0" r="40" fill="#3b5b9b"/><circle cx="214.2" cy="248.0" r="40" fill="#1f6b34" clip-path="url(#Lb)"/><text x="190.0" y="144" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">A &#8746; (B &#8745; C)</text><circle cx="190.0" cy="206.0" r="40" fill="none" stroke="#666" stroke-width="1.2"/><circle cx="165.8" cy="248.0" r="40" fill="none" stroke="#666" stroke-width="1.2"/><circle cx="214.2" cy="248.0" r="40" fill="none" stroke="#666" stroke-width="1.2"/><text x="190.0" y="158.0" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">A</text><text x="127.8" y="302.0" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">B</text><text x="252.2" y="302.0" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">C</text><text x="190.0" y="312" font-size="10.5" fill="#555" text-anchor="middle">All of A in blue, plus the B &#8745; C lens in green:</text><text x="190.0" y="327" font-size="10.5" fill="#555" text-anchor="middle">two pieces joined.</text><rect x="372" y="122" width="336" height="216" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><g opacity="0.45"><circle cx="540.0" cy="206.0" r="40" fill="#3b5b9b"/><circle cx="515.8" cy="248.0" r="40" fill="#3b5b9b"/></g><g opacity="0.45"><circle cx="540.0" cy="206.0" r="40" fill="#1f6b34"/><circle cx="564.2" cy="248.0" r="40" fill="#1f6b34"/></g><text x="540.0" y="144" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">(A &#8746; B) &#8745; (A &#8746; C)</text><circle cx="540.0" cy="206.0" r="40" fill="none" stroke="#666" stroke-width="1.2"/><circle cx="515.8" cy="248.0" r="40" fill="none" stroke="#666" stroke-width="1.2"/><circle cx="564.2" cy="248.0" r="40" fill="none" stroke="#666" stroke-width="1.2"/><text x="540.0" y="158.0" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">A</text><text x="477.8" y="302.0" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">B</text><text x="602.2" y="302.0" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">C</text><text x="540.0" y="312" font-size="10.5" fill="#555" text-anchor="middle">A &#8746; B in blue, A &#8746; C in green, each at half</text><text x="540.0" y="327" font-size="10.5" fill="#555" text-anchor="middle">strength: the dark overlap is the answer.</text>

  <rect x="18" y="352" width="684" height="262" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="372" font-size="11.5" fill="#1f6b34" font-weight="bold">ALL EIGHT KINDS OF POINT, AND WHERE EACH LANDS</text>
  <text x="150" y="400" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">x &#8712; A?</text><text x="250" y="400" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">x &#8712; B?</text><text x="330" y="400" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">x &#8712; C?</text><text x="450" y="400" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">in (A&#8746;B) &#8745; (A&#8746;C)?</text><text x="590" y="400" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">in A &#8746; (B&#8745;C)?</text><line x1="100" y1="406" x2="660" y2="406" stroke="#3b5b9b" stroke-width="1"/><line x1="382" y1="384" x2="382" y2="552" stroke="#ddd" stroke-width="1"/><text x="150" y="426" font-size="10.5" fill="#666" text-anchor="middle">no</text><text x="250" y="426" font-size="10.5" fill="#666" text-anchor="middle">no</text><text x="330" y="426" font-size="10.5" fill="#666" text-anchor="middle">no</text><text x="450" y="426" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">no</text><text x="590" y="426" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">no</text><text x="150" y="443" font-size="10.5" fill="#666" text-anchor="middle">no</text><text x="250" y="443" font-size="10.5" fill="#666" text-anchor="middle">no</text><text x="330" y="443" font-size="10.5" fill="#666" text-anchor="middle">yes</text><text x="450" y="443" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">no</text><text x="590" y="443" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">no</text><text x="150" y="460" font-size="10.5" fill="#666" text-anchor="middle">no</text><text x="250" y="460" font-size="10.5" fill="#666" text-anchor="middle">yes</text><text x="330" y="460" font-size="10.5" fill="#666" text-anchor="middle">no</text><text x="450" y="460" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">no</text><text x="590" y="460" font-size="10.5" fill="#bbb" text-anchor="middle" font-weight="normal">no</text><text x="150" y="477" font-size="10.5" fill="#666" text-anchor="middle">no</text><text x="250" y="477" font-size="10.5" fill="#666" text-anchor="middle">yes</text><text x="330" y="477" font-size="10.5" fill="#666" text-anchor="middle">yes</text><text x="450" y="477" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><text x="590" y="477" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><text x="150" y="494" font-size="10.5" fill="#666" text-anchor="middle">yes</text><text x="250" y="494" font-size="10.5" fill="#666" text-anchor="middle">no</text><text x="330" y="494" font-size="10.5" fill="#666" text-anchor="middle">no</text><text x="450" y="494" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><text x="590" y="494" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><text x="150" y="511" font-size="10.5" fill="#666" text-anchor="middle">yes</text><text x="250" y="511" font-size="10.5" fill="#666" text-anchor="middle">no</text><text x="330" y="511" font-size="10.5" fill="#666" text-anchor="middle">yes</text><text x="450" y="511" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><text x="590" y="511" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><text x="150" y="528" font-size="10.5" fill="#666" text-anchor="middle">yes</text><text x="250" y="528" font-size="10.5" fill="#666" text-anchor="middle">yes</text><text x="330" y="528" font-size="10.5" fill="#666" text-anchor="middle">no</text><text x="450" y="528" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><text x="590" y="528" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><text x="150" y="545" font-size="10.5" fill="#666" text-anchor="middle">yes</text><text x="250" y="545" font-size="10.5" fill="#666" text-anchor="middle">yes</text><text x="330" y="545" font-size="10.5" fill="#666" text-anchor="middle">yes</text><text x="450" y="545" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><text x="590" y="545" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text>
  <text x="40" y="578" font-size="11" fill="#555">The last two columns agree on every row. The three rows that fail are exactly those with x &#8713; A</text>
  <text x="40" y="596" font-size="11" fill="#555">and x missing from at least one of B, C.</text>

  <rect x="18" y="627" width="684" height="134" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="647" font-size="11.5" fill="#b06a10" font-weight="bold">THE &#8839; DIRECTION IS THE INTERESTING HALF</text>
  <text x="40" y="671" font-size="11.5" fill="#333">Two unions in the hypothesis give four raw cases. Three of them put x in A; only the fourth does</text>
  <text x="40" y="689" font-size="11.5" fill="#333">any work:</text>
  <text x="360" y="713" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">x &#8712; B (from A &#8746; B)&#160; and&#160; x &#8712; C (from A &#8746; C)&#160; &#8594;&#160; x &#8712; B &#8745; C</text>
  <text x="40" y="739" font-size="11.5" fill="#333">Splitting instead on &#8220;x &#8712; A or x &#8713; A&#8221; collapses the four cases to two &#8212; a use of the excluded middle,</text>
  <text x="40" y="755" font-size="11.5" fill="#333">which Problem 7 never needed.</text>
</svg>