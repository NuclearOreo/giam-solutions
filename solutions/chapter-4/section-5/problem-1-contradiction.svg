<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 699" width="720" height="699" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="699" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="90" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">TWO ROUTES TO THE SAME VERDICT</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">(A &#8658; &#172;A) &#8743; (&#172;A &#8658; A)&#160;&#160;&#8801;&#160;&#160;<tspan font-weight="bold">c</tspan></text>
  <text x="360" y="83" font-size="11.5" fill="#333" text-anchor="middle">The table checks the two cases; the algebra explains what the statement is really saying.</text>
  <rect x="22" y="120" width="336" height="250" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="142" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">route 1: the truth table</text><text x="62" y="172" font-size="11.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">A</text><text x="114" y="172" font-size="11.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">&#172;A</text><text x="180" y="172" font-size="11.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">A &#8658; &#172;A</text><text x="260" y="172" font-size="11.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">&#172;A &#8658; A</text><text x="328" y="172" font-size="11.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">&#8743;</text><line x1="40" y1="179" x2="340" y2="179" stroke="#3b5b9b" stroke-width="1.1"/><line x1="298" y1="156" x2="298" y2="244" stroke="#ddd" stroke-width="1"/><text x="62" y="204" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="normal">T</text><text x="114" y="204" font-size="13" fill="#999" text-anchor="middle" font-weight="normal">F</text><text x="180" y="204" font-size="13" fill="#999" text-anchor="middle" font-weight="normal">F</text><text x="260" y="204" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="normal">T</text><text x="328" y="204" font-size="13" fill="#9b2c2c" text-anchor="middle" font-weight="bold">F</text><text x="62" y="232" font-size="13" fill="#999" text-anchor="middle" font-weight="normal">F</text><text x="114" y="232" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="normal">T</text><text x="180" y="232" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="normal">T</text><text x="260" y="232" font-size="13" fill="#999" text-anchor="middle" font-weight="normal">F</text><text x="328" y="232" font-size="13" fill="#9b2c2c" text-anchor="middle" font-weight="bold">F</text><rect x="310" y="188" width="36" height="58" rx="3" fill="none" stroke="#9b2c2c" stroke-width="1.6"/><text x="190.0" y="332" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">both rows false</text><text x="190.0" y="352" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">only 2 rows to check &#8212; one variable</text><rect x="372" y="120" width="336" height="250" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="142" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">route 2: the laws of equivalence</text><text x="390" y="176" font-size="12.5" fill="#1f3a68">(A &#8658; &#172;A) &#8743; (&#172;A &#8658; A)</text><text x="390" y="210" font-size="12.5" fill="#1f3a68">&#8801; (&#172;A &#8744; &#172;A) &#8743; (&#172;&#172;A &#8744; A)</text><text x="692" y="210" font-size="9.5" fill="#888" text-anchor="end" font-style="italic">conditional as disjunction</text><text x="390" y="244" font-size="12.5" fill="#1f3a68">&#8801; (&#172;A &#8744; &#172;A) &#8743; (A &#8744; A)</text><text x="692" y="244" font-size="9.5" fill="#888" text-anchor="end" font-style="italic">double negation</text><text x="390" y="278" font-size="12.5" fill="#1f3a68">&#8801; &#172;A &#8743; A</text><text x="692" y="278" font-size="9.5" fill="#888" text-anchor="end" font-style="italic">idempotence, twice</text><text x="390" y="312" font-size="12.5" fill="#1f3a68">&#8801; <tspan font-weight='bold'>c</tspan></text><text x="692" y="312" font-size="9.5" fill="#888" text-anchor="end" font-style="italic">the contradiction law</text><text x="540.0" y="352" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">every step checked on both rows</text>
  <rect x="18" y="384" width="684" height="150" rx="6" fill="#fdecec" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="404" font-size="11.5" fill="#9b2c2c" font-weight="bold">WHAT THE STATEMENT ACTUALLY SAYS</text>
  <text x="40" y="428" font-size="11.5" fill="#333">A conditional each way is a biconditional, so the whole expression is nothing but</text>
  <text x="360" y="456" font-size="14" fill="#9b2c2c" text-anchor="middle" font-weight="bold">A &#8660; &#172;A</text>
  <text x="40" y="482" font-size="11.5" fill="#333">&#8212; a statement equivalent to its own negation. Verified. That is the shape of the liar sentence, and</text>
  <text x="40" y="500" font-size="11.5" fill="#333">of Russell&#8217;s paradox from 4.1: the set R of all sets not containing themselves satisfies R &#8712; R &#8660; R &#8713; R,</text>
  <text x="40" y="518" font-size="11.5" fill="#333">which is why no such R can exist.</text>
  <rect x="18" y="547" width="684" height="136" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="567" font-size="11.5" fill="#1f6b34" font-weight="bold">NEITHER HALF IS A CONTRADICTION ON ITS OWN</text>
  <text x="40" y="591" font-size="11.5" fill="#333">A &#8658; &#172;A simplifies to just &#172;A, and &#172;A &#8658; A simplifies to just A. Each is satisfiable; it is</text>
  <text x="40" y="609" font-size="11.5" fill="#333">conjoining them that asks for A and &#172;A at once.</text>
  <text x="40" y="635" font-size="11.5" fill="#333">Those two simplifications are the engines of proof by contradiction: if assuming A yields &#172;A then</text>
  <text x="40" y="653" font-size="11.5" fill="#333">&#172;A holds, and if assuming &#172;A yields A then A holds. Both confirmed to be tautologies &#8212; the second</text>
  <text x="40" y="671" font-size="11.5" fill="#333">is the classical <tspan font-style="italic">consequentia mirabilis</tspan>.</text>
</svg>