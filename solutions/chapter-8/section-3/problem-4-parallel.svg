<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="Georgia, 'Times New Roman', serif">
  <rect width="800" height="560" fill="white"/>

  <!-- Title -->
  <text x="400" y="32" font-size="18" font-weight="bold" text-anchor="middle">Barber&#8217;s Paradox &#8596; Cantor&#8217;s Theorem</text>
  <text x="400" y="55" font-size="13" font-style="italic" text-anchor="middle" fill="#555">Both arguments share the same structure: self-reference applied to a "flipping" set.</text>

  <!-- Column headers -->
  <rect x="30" y="75" width="370" height="42" fill="#cce5ff" stroke="#1a4d99" stroke-width="2"/>
  <text x="215" y="102" font-size="15" font-weight="bold" text-anchor="middle">Barber&#8217;s Paradox</text>

  <rect x="410" y="75" width="370" height="42" fill="#d4edda" stroke="#1a7a1a" stroke-width="2"/>
  <text x="595" y="102" font-size="15" font-weight="bold" text-anchor="middle">Cantor&#8217;s Theorem</text>

  <!-- Row 1: Setup -->
  <rect x="30" y="117" width="370" height="65" fill="#fafafa" stroke="#bbb" stroke-width="0.8"/>
  <text x="40" y="135" font-size="11" font-weight="bold" fill="#666">SETUP</text>
  <text x="215" y="156" font-size="13" text-anchor="middle">Town T; Barber b &#8712; T;</text>
  <text x="215" y="173" font-size="13" text-anchor="middle">b "shaves" some subset of T.</text>

  <rect x="410" y="117" width="370" height="65" fill="#fafafa" stroke="#bbb" stroke-width="0.8"/>
  <text x="420" y="135" font-size="11" font-weight="bold" fill="#666">SETUP</text>
  <text x="595" y="156" font-size="13" text-anchor="middle">Set A; element y &#8712; A;</text>
  <text x="595" y="173" font-size="13" text-anchor="middle">f : A &#8594; &#x1d4ab;(A) with f(y) &#8838; A.</text>

  <!-- Row 2: Diagonal set -->
  <rect x="30" y="182" width="370" height="55" fill="#fff3b0" stroke="#cc9933" stroke-width="1.5"/>
  <text x="40" y="200" font-size="11" font-weight="bold" fill="#7a5500">DIAGONAL SET</text>
  <text x="215" y="223" font-size="13" text-anchor="middle">{ men in T who do NOT shave themselves }</text>

  <rect x="410" y="182" width="370" height="55" fill="#fff3b0" stroke="#cc9933" stroke-width="1.5"/>
  <text x="420" y="200" font-size="11" font-weight="bold" fill="#7a5500">DIAGONAL SET</text>
  <text x="595" y="223" font-size="13" text-anchor="middle">S = { x &#8712; A : x &#8713; f(x) }</text>

  <!-- Row 3: Hypothesis -->
  <rect x="30" y="237" width="370" height="65" fill="#fafafa" stroke="#bbb" stroke-width="0.8"/>
  <text x="40" y="255" font-size="11" font-weight="bold" fill="#666">HYPOTHESIS</text>
  <text x="215" y="277" font-size="13" text-anchor="middle">Barber b shaves EXACTLY</text>
  <text x="215" y="293" font-size="13" text-anchor="middle">the men in the diagonal set.</text>

  <rect x="410" y="237" width="370" height="65" fill="#fafafa" stroke="#bbb" stroke-width="0.8"/>
  <text x="420" y="255" font-size="11" font-weight="bold" fill="#666">HYPOTHESIS</text>
  <text x="595" y="277" font-size="13" text-anchor="middle">f(y) = S for some y &#8712; A,</text>
  <text x="595" y="293" font-size="13" text-anchor="middle">i.e., S lies in the image of f.</text>

  <!-- Row 4: Self-referent question -->
  <rect x="30" y="302" width="370" height="55" fill="#fdecec" stroke="#aa2020" stroke-width="1.5"/>
  <text x="40" y="320" font-size="11" font-weight="bold" fill="#aa2020">SELF-REFERENT QUESTION</text>
  <text x="215" y="343" font-size="13" text-anchor="middle" font-style="italic">"Does the Barber shave the Barber?"</text>

  <rect x="410" y="302" width="370" height="55" fill="#fdecec" stroke="#aa2020" stroke-width="1.5"/>
  <text x="420" y="320" font-size="11" font-weight="bold" fill="#aa2020">SELF-REFERENT QUESTION</text>
  <text x="595" y="343" font-size="13" text-anchor="middle" font-style="italic">"Is y &#8712; S ?" &#160;(i.e., is y &#8712; f(y)?)</text>

  <!-- Row 5: Outcome -->
  <rect x="30" y="357" width="370" height="70" fill="#fafafa" stroke="#bbb" stroke-width="0.8"/>
  <text x="40" y="375" font-size="11" font-weight="bold" fill="#666">OUTCOME (both branches)</text>
  <text x="215" y="395" font-size="12" text-anchor="middle">Yes &#8658; rule excludes him.</text>
  <text x="215" y="413" font-size="12" text-anchor="middle">No &#8658; rule includes him.</text>

  <rect x="410" y="357" width="370" height="70" fill="#fafafa" stroke="#bbb" stroke-width="0.8"/>
  <text x="420" y="375" font-size="11" font-weight="bold" fill="#666">OUTCOME (both branches)</text>
  <text x="595" y="395" font-size="12" text-anchor="middle">y &#8712; S &#8658; y &#8713; f(y) = S.</text>
  <text x="595" y="413" font-size="12" text-anchor="middle">y &#8713; S &#8658; y &#8712; f(y) = S.</text>

  <!-- Row 6: Conclusion -->
  <rect x="30" y="427" width="370" height="70" fill="#e8f0fc" stroke="#1a4d99" stroke-width="2"/>
  <text x="40" y="445" font-size="11" font-weight="bold" fill="#1a4d99">CONCLUSION</text>
  <text x="215" y="467" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a4d99">No such Barber exists &#8212;</text>
  <text x="215" y="485" font-size="13" text-anchor="middle" fill="#1a4d99">the town is impossible.</text>

  <rect x="410" y="427" width="370" height="70" fill="#d4edda" stroke="#1a7a1a" stroke-width="2"/>
  <text x="420" y="445" font-size="11" font-weight="bold" fill="#1a7a1a">CONCLUSION</text>
  <text x="595" y="467" font-size="13" text-anchor="middle" font-weight="bold" fill="#1a7a1a">No such y exists &#8212;</text>
  <text x="595" y="485" font-size="13" text-anchor="middle" fill="#1a7a1a">S &#8713; image(f), so f isn&#8217;t surjective.</text>

  <!-- Caption -->
  <text x="400" y="530" font-size="13" text-anchor="middle" font-style="italic" fill="#444">The Barber is exactly the "y" of Cantor&#8217;s proof &#8212; an entity whose existence the diagonal set rules out.</text>
</svg>
