<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="Georgia, 'Times New Roman', serif">
  <rect width="760" height="540" fill="white"/>

  <!-- Title -->
  <text x="380" y="32" font-size="18" font-weight="bold" text-anchor="middle">The Diagonal Construction in Decimal</text>
  <text x="380" y="55" font-size="13" text-anchor="middle" font-style="italic" fill="#555">A presumed listing r&#8321;, r&#8322;, &#8230; of all reals in (0, 1). Read the diagonal; substitute by the rule.</text>

  <!-- Diagonal cell highlights (yellow boxes) -->
  <rect x="76" y="103" width="28" height="28" fill="#fff3b0" stroke="#cc9933" stroke-width="1.2"/>
  <rect x="116" y="143" width="28" height="28" fill="#fff3b0" stroke="#cc9933" stroke-width="1.2"/>
  <rect x="156" y="183" width="28" height="28" fill="#fff3b0" stroke="#cc9933" stroke-width="1.2"/>
  <rect x="196" y="223" width="28" height="28" fill="#fff3b0" stroke="#cc9933" stroke-width="1.2"/>
  <rect x="236" y="263" width="28" height="28" fill="#fff3b0" stroke="#cc9933" stroke-width="1.2"/>

  <!-- Row labels -->
  <text x="68" y="125" font-size="14" text-anchor="end" font-style="italic">r&#8321; &#160;= 0.</text>
  <text x="68" y="165" font-size="14" text-anchor="end" font-style="italic">r&#8322; &#160;= 0.</text>
  <text x="68" y="205" font-size="14" text-anchor="end" font-style="italic">r&#8323; &#160;= 0.</text>
  <text x="68" y="245" font-size="14" text-anchor="end" font-style="italic">r&#8324; &#160;= 0.</text>
  <text x="68" y="285" font-size="14" text-anchor="end" font-style="italic">r&#8325; &#160;= 0.</text>
  <text x="68" y="328" font-size="20" text-anchor="end">&#8942;</text>

  <!-- Row 1 digits: 3 1 4 1 5 9 2 6 -->
  <text x="90" y="125" font-size="16" text-anchor="middle" font-weight="bold" fill="#aa2020">3</text>
  <text x="130" y="125" font-size="16" text-anchor="middle">1</text>
  <text x="170" y="125" font-size="16" text-anchor="middle">4</text>
  <text x="210" y="125" font-size="16" text-anchor="middle">1</text>
  <text x="250" y="125" font-size="16" text-anchor="middle">5</text>
  <text x="290" y="125" font-size="16" text-anchor="middle">9</text>
  <text x="330" y="125" font-size="16" text-anchor="middle">2</text>
  <text x="370" y="125" font-size="16" text-anchor="middle">6</text>
  <text x="410" y="125" font-size="15" text-anchor="middle" fill="#999">&#8943;</text>

  <!-- Row 2: 7 1 8 2 8 1 8 2 -->
  <text x="90" y="165" font-size="16" text-anchor="middle">7</text>
  <text x="130" y="165" font-size="16" text-anchor="middle" font-weight="bold" fill="#aa2020">1</text>
  <text x="170" y="165" font-size="16" text-anchor="middle">8</text>
  <text x="210" y="165" font-size="16" text-anchor="middle">2</text>
  <text x="250" y="165" font-size="16" text-anchor="middle">8</text>
  <text x="290" y="165" font-size="16" text-anchor="middle">1</text>
  <text x="330" y="165" font-size="16" text-anchor="middle">8</text>
  <text x="370" y="165" font-size="16" text-anchor="middle">2</text>
  <text x="410" y="165" font-size="15" text-anchor="middle" fill="#999">&#8943;</text>

  <!-- Row 3: 4 1 4 2 1 3 5 6 -->
  <text x="90" y="205" font-size="16" text-anchor="middle">4</text>
  <text x="130" y="205" font-size="16" text-anchor="middle">1</text>
  <text x="170" y="205" font-size="16" text-anchor="middle" font-weight="bold" fill="#aa2020">4</text>
  <text x="210" y="205" font-size="16" text-anchor="middle">2</text>
  <text x="250" y="205" font-size="16" text-anchor="middle">1</text>
  <text x="290" y="205" font-size="16" text-anchor="middle">3</text>
  <text x="330" y="205" font-size="16" text-anchor="middle">5</text>
  <text x="370" y="205" font-size="16" text-anchor="middle">6</text>
  <text x="410" y="205" font-size="15" text-anchor="middle" fill="#999">&#8943;</text>

  <!-- Row 4: 6 1 8 0 3 3 9 9 -->
  <text x="90" y="245" font-size="16" text-anchor="middle">6</text>
  <text x="130" y="245" font-size="16" text-anchor="middle">1</text>
  <text x="170" y="245" font-size="16" text-anchor="middle">8</text>
  <text x="210" y="245" font-size="16" text-anchor="middle" font-weight="bold" fill="#aa2020">0</text>
  <text x="250" y="245" font-size="16" text-anchor="middle">3</text>
  <text x="290" y="245" font-size="16" text-anchor="middle">3</text>
  <text x="330" y="245" font-size="16" text-anchor="middle">9</text>
  <text x="370" y="245" font-size="16" text-anchor="middle">9</text>
  <text x="410" y="245" font-size="15" text-anchor="middle" fill="#999">&#8943;</text>

  <!-- Row 5: 5 6 7 8 1 2 3 4 -->
  <text x="90" y="285" font-size="16" text-anchor="middle">5</text>
  <text x="130" y="285" font-size="16" text-anchor="middle">6</text>
  <text x="170" y="285" font-size="16" text-anchor="middle">7</text>
  <text x="210" y="285" font-size="16" text-anchor="middle">8</text>
  <text x="250" y="285" font-size="16" text-anchor="middle" font-weight="bold" fill="#aa2020">1</text>
  <text x="290" y="285" font-size="16" text-anchor="middle">2</text>
  <text x="330" y="285" font-size="16" text-anchor="middle">3</text>
  <text x="370" y="285" font-size="16" text-anchor="middle">4</text>
  <text x="410" y="285" font-size="15" text-anchor="middle" fill="#999">&#8943;</text>

  <!-- Vertical ellipsis row -->
  <text x="90" y="320" font-size="16" text-anchor="middle">&#8942;</text>
  <text x="130" y="320" font-size="16" text-anchor="middle">&#8942;</text>
  <text x="170" y="320" font-size="16" text-anchor="middle">&#8942;</text>
  <text x="210" y="320" font-size="16" text-anchor="middle">&#8942;</text>
  <text x="250" y="320" font-size="16" text-anchor="middle">&#8942;</text>
  <text x="290" y="320" font-size="16" text-anchor="middle">&#8942;</text>
  <text x="330" y="320" font-size="16" text-anchor="middle">&#8942;</text>
  <text x="370" y="320" font-size="16" text-anchor="middle">&#8942;</text>

  <!-- Dashed alignment lines from diagonal cell to e_n -->
  <line x1="90" y1="135" x2="90" y2="397" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="130" y1="175" x2="130" y2="397" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="170" y1="215" x2="170" y2="397" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="210" y1="255" x2="210" y2="397" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="250" y1="295" x2="250" y2="397" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Separator line -->
  <line x1="50" y1="368" x2="450" y2="368" stroke="#333" stroke-width="1"/>

  <!-- The constructed number r -->
  <text x="68" y="412" font-size="15" text-anchor="end" font-style="italic" fill="#1a4d99">r &#160;= 0.</text>
  <text x="90" y="412" font-size="19" text-anchor="middle" font-weight="bold" fill="#1a4d99">1</text>
  <text x="130" y="412" font-size="19" text-anchor="middle" font-weight="bold" fill="#1a4d99">2</text>
  <text x="170" y="412" font-size="19" text-anchor="middle" font-weight="bold" fill="#1a4d99">1</text>
  <text x="210" y="412" font-size="19" text-anchor="middle" font-weight="bold" fill="#1a4d99">1</text>
  <text x="250" y="412" font-size="19" text-anchor="middle" font-weight="bold" fill="#1a4d99">2</text>
  <text x="290" y="412" font-size="19" text-anchor="middle" font-weight="bold" fill="#1a4d99">&#8943;</text>

  <!-- Right side: rule box -->
  <rect x="490" y="100" width="250" height="115" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
  <text x="500" y="125" font-size="14" font-weight="bold">Substitution rule</text>
  <text x="510" y="153" font-size="14">if d&#8345;&#8345; = 1: &#160; e&#8345; = 2</text>
  <text x="510" y="178" font-size="14">otherwise: &#160; e&#8345; = 1</text>
  <text x="500" y="203" font-size="12" font-style="italic" fill="#555">(so e&#8345; &#8712; {1, 2}, never 0 or 9)</text>

  <!-- Right side: diagonal extraction -->
  <rect x="490" y="240" width="250" height="120" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4"/>
  <text x="500" y="265" font-size="14" font-weight="bold">Diagonal extracted</text>
  <text x="500" y="293" font-size="13" fill="#aa2020">d&#8345;&#8345;:&#160; 3, &#160;1, &#160;4, &#160;0, &#160;1, &#8230;</text>
  <text x="500" y="320" font-size="14" font-weight="bold" fill="#1a4d99">After substitution</text>
  <text x="500" y="346" font-size="13" fill="#1a4d99">e&#8345;:&#160;&#160; 1, &#160;2, &#160;1, &#160;1, &#160;2, &#8230;</text>

  <!-- Caption -->
  <text x="380" y="465" font-size="13" text-anchor="middle" font-style="italic" fill="#333">Each e&#8345; differs from d&#8345;&#8345;, so r differs from r&#8345; at the n-th digit.</text>
  <text x="380" y="487" font-size="13" text-anchor="middle" font-style="italic" fill="#333">Since e&#8345; &#8712; {1, 2}, the constructed r has no 0&#8217;s or 9&#8217;s &#8212; its decimal representation is unique &#8212;</text>
  <text x="380" y="509" font-size="13" text-anchor="middle" font-style="italic" fill="#333">so r is genuinely a real in (0, 1) not on the list. Contradiction.</text>
</svg>
