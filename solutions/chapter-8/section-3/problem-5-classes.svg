<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" width="720" height="530" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="530" fill="white"/>

  <!-- Title -->
  <text x="360" y="32" font-size="18" font-weight="bold" text-anchor="middle">Resolution: V Is a Proper Class, Not a Set</text>
  <text x="360" y="55" font-size="13" font-style="italic" text-anchor="middle" fill="#555">ZFC restricts which collections count as "sets"; V is too big to be one.</text>

  <!-- Outer dashed "classes" boundary -->
  <rect x="70" y="85" width="580" height="370" fill="#fcfcfc" stroke="#666" stroke-width="2" stroke-dasharray="7,5" rx="20"/>
  <text x="360" y="112" font-size="15" text-anchor="middle" font-weight="bold" fill="#666">classes &#160;(any well-defined collection of sets)</text>

  <!-- Inner solid "sets" oval -->
  <ellipse cx="360" cy="295" rx="200" ry="120" fill="#cce5ff" stroke="#1a4d99" stroke-width="2.5"/>
  <text x="360" y="240" font-size="17" text-anchor="middle" font-weight="bold" fill="#1a4d99">sets</text>
  <text x="360" y="260" font-size="12" text-anchor="middle" font-style="italic" fill="#1a4d99">(the "small" classes &#8212; allowed by ZFC)</text>

  <!-- Examples inside sets -->
  <text x="245" y="310" font-size="16" text-anchor="middle">&#8709;</text>
  <text x="295" y="320" font-size="13" text-anchor="middle">{1, 2, 3}</text>
  <text x="360" y="328" font-size="14" text-anchor="middle">&#8469;</text>
  <text x="410" y="320" font-size="13" text-anchor="middle">&#8477;</text>
  <text x="475" y="310" font-size="13" text-anchor="middle">&#x1d4ab;(&#8469;)</text>
  <text x="360" y="355" font-size="11" text-anchor="middle" fill="#444" font-style="italic">&#8230; (every "everyday" mathematical object)</text>

  <!-- Examples in proper class region (outside sets, inside classes) -->
  <!-- V (universal class) -->
  <text x="135" y="200" font-size="20" font-weight="bold" fill="#aa2020">V</text>
  <text x="135" y="222" font-size="11" text-anchor="middle" fill="#aa2020" font-style="italic">all sets</text>

  <!-- Ord (all ordinals) -->
  <text x="585" y="200" font-size="18" font-weight="bold" fill="#aa2020">Ord</text>
  <text x="585" y="222" font-size="11" text-anchor="middle" fill="#aa2020" font-style="italic">all ordinals</text>

  <!-- R (Russell's set) -->
  <text x="135" y="405" font-size="20" font-weight="bold" fill="#aa2020">R</text>
  <text x="135" y="427" font-size="10" text-anchor="middle" fill="#aa2020" font-style="italic">{x : x &#8713; x}</text>

  <!-- Card (all cardinals) -->
  <text x="585" y="405" font-size="18" font-weight="bold" fill="#aa2020">Card</text>
  <text x="585" y="427" font-size="11" text-anchor="middle" fill="#aa2020" font-style="italic">all cardinals</text>

  <!-- Label for "proper classes" region -->
  <text x="290" y="148" font-size="13" font-style="italic" font-weight="bold" fill="#aa2020">proper classes &#160;(too big to be sets)</text>

  <!-- Bottom note -->
  <line x1="70" y1="475" x2="650" y2="475" stroke="#ccc" stroke-width="1"/>
  <text x="360" y="494" font-size="13" text-anchor="middle" font-style="italic" fill="#333">ZFC&#8217;s Separation axiom says {x &#8712; A : P(x)} is a set only when A already is.</text>
  <text x="360" y="513" font-size="13" text-anchor="middle" font-style="italic" fill="#333">There is no axiom granting "V is a set," and without that, Cantor&#8217;s paradox can&#8217;t even be stated.</text>
</svg>
