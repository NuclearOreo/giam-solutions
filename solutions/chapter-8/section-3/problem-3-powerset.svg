<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" width="640" height="510" font-family="Georgia, 'Times New Roman', serif">
  <rect width="640" height="510" fill="white"/>

  <!-- Title -->
  <text x="320" y="32" font-size="18" font-weight="bold" text-anchor="middle">Powerset &#x1d4ab;({1, 2, 3}) and the Missed S</text>
  <text x="320" y="54" font-size="13" text-anchor="middle" font-style="italic" fill="#555">8 subsets total. f covers 3 of them (green). S = {1, 2} is one of the 5 missed (blue).</text>

  <!-- Edges (drawn first, behind nodes) -->
  <!-- Empty to singletons -->
  <line x1="300" y1="410" x2="180" y2="305" stroke="#aaa" stroke-width="1.2"/>
  <line x1="300" y1="410" x2="300" y2="305" stroke="#aaa" stroke-width="1.2"/>
  <line x1="300" y1="410" x2="420" y2="305" stroke="#aaa" stroke-width="1.2"/>

  <!-- Singletons to doubletons -->
  <line x1="180" y1="270" x2="180" y2="210" stroke="#aaa" stroke-width="1.2"/>
  <line x1="180" y1="270" x2="300" y2="210" stroke="#aaa" stroke-width="1.2"/>
  <line x1="300" y1="270" x2="180" y2="210" stroke="#aaa" stroke-width="1.2"/>
  <line x1="300" y1="270" x2="420" y2="210" stroke="#aaa" stroke-width="1.2"/>
  <line x1="420" y1="270" x2="300" y2="210" stroke="#aaa" stroke-width="1.2"/>
  <line x1="420" y1="270" x2="420" y2="210" stroke="#aaa" stroke-width="1.2"/>

  <!-- Doubletons to full set -->
  <line x1="180" y1="175" x2="300" y2="115" stroke="#aaa" stroke-width="1.2"/>
  <line x1="300" y1="175" x2="300" y2="115" stroke="#aaa" stroke-width="1.2"/>
  <line x1="420" y1="175" x2="300" y2="115" stroke="#aaa" stroke-width="1.2"/>

  <!-- Top node: {1, 2, 3} (in image, green) -->
  <rect x="245" y="80" width="110" height="35" fill="#d4edda" stroke="#1a7a1a" stroke-width="2.5" rx="3"/>
  <text x="300" y="103" font-size="15" text-anchor="middle">{1, 2, 3}</text>
  <text x="370" y="103" font-size="12" font-style="italic" fill="#1a7a1a">= f(3)</text>

  <!-- Doubletons -->
  <!-- {1, 2} = S (highlighted blue) -->
  <rect x="135" y="175" width="90" height="35" fill="#cce5ff" stroke="#1a4d99" stroke-width="3.5" rx="3"/>
  <text x="180" y="198" font-size="15" text-anchor="middle" font-weight="bold">{1, 2}</text>
  <text x="35" y="200" font-size="13" font-weight="bold" font-style="italic" fill="#1a4d99">S =</text>
  <text x="180" y="232" font-size="12" text-anchor="middle" font-style="italic" fill="#1a4d99" font-weight="bold">missed!</text>

  <!-- {1, 3} (in image, green) -->
  <rect x="255" y="175" width="90" height="35" fill="#d4edda" stroke="#1a7a1a" stroke-width="2.5" rx="3"/>
  <text x="300" y="198" font-size="15" text-anchor="middle">{1, 3}</text>
  <text x="300" y="232" font-size="12" text-anchor="middle" font-style="italic" fill="#1a7a1a">= f(2)</text>

  <!-- {2, 3} -->
  <rect x="375" y="175" width="90" height="35" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="3"/>
  <text x="420" y="198" font-size="15" text-anchor="middle">{2, 3}</text>

  <!-- Singletons -->
  <rect x="150" y="270" width="60" height="35" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="3"/>
  <text x="180" y="293" font-size="14" text-anchor="middle">{1}</text>

  <rect x="270" y="270" width="60" height="35" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="3"/>
  <text x="300" y="293" font-size="14" text-anchor="middle">{2}</text>

  <rect x="390" y="270" width="60" height="35" fill="#f5f5f5" stroke="#999" stroke-width="1.5" rx="3"/>
  <text x="420" y="293" font-size="14" text-anchor="middle">{3}</text>

  <!-- Empty set (in image, green) -->
  <rect x="270" y="410" width="60" height="35" fill="#d4edda" stroke="#1a7a1a" stroke-width="2.5" rx="3"/>
  <text x="300" y="434" font-size="16" text-anchor="middle">&#8709;</text>
  <text x="370" y="434" font-size="12" font-style="italic" fill="#1a7a1a">= f(1)</text>

  <!-- Legend -->
  <line x1="30" y1="465" x2="610" y2="465" stroke="#ccc" stroke-width="1"/>

  <rect x="50" y="478" width="20" height="20" fill="#d4edda" stroke="#1a7a1a" stroke-width="2"/>
  <text x="80" y="494" font-size="13">in image of f</text>

  <rect x="220" y="478" width="20" height="20" fill="#cce5ff" stroke="#1a4d99" stroke-width="3"/>
  <text x="250" y="494" font-size="13" font-weight="bold">S (missed by f)</text>

  <rect x="430" y="478" width="20" height="20" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <text x="460" y="494" font-size="13">not in image</text>
</svg>
