<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="410" fill="white"/>

  <!-- Title -->
  <text x="360" y="35" font-size="18" font-weight="bold" text-anchor="middle">Cantor Diagonal Membership Table</text>
  <text x="360" y="56" font-size="13" text-anchor="middle" font-style="italic" fill="#555">For each x &#8712; A: is x &#8712; f(x)? Flip the diagonal answers to build S.</text>

  <!-- Outer table border -->
  <rect x="30" y="80" width="660" height="240" fill="none" stroke="#333" stroke-width="1.6"/>

  <!-- Column dividers (vertical) -->
  <line x1="180" y1="80" x2="180" y2="320" stroke="#333" stroke-width="1.2"/>
  <line x1="240" y1="80" x2="240" y2="320" stroke="#bbb" stroke-width="0.8"/>
  <line x1="300" y1="80" x2="300" y2="320" stroke="#bbb" stroke-width="0.8"/>
  <line x1="360" y1="80" x2="360" y2="320" stroke="#333" stroke-width="1.2"/>
  <line x1="510" y1="80" x2="510" y2="320" stroke="#333" stroke-width="1.2"/>

  <!-- Header row divider -->
  <line x1="30" y1="120" x2="690" y2="120" stroke="#333" stroke-width="1.2"/>

  <!-- Row dividers (horizontal) -->
  <line x1="30" y1="200" x2="690" y2="200" stroke="#bbb" stroke-width="0.8"/>
  <line x1="30" y1="260" x2="690" y2="260" stroke="#bbb" stroke-width="0.8"/>

  <!-- Column headers -->
  <text x="105" y="106" font-size="14" text-anchor="middle" font-weight="bold">f(x)</text>
  <text x="210" y="106" font-size="14" text-anchor="middle" font-weight="bold">1</text>
  <text x="270" y="106" font-size="14" text-anchor="middle" font-weight="bold">2</text>
  <text x="330" y="106" font-size="14" text-anchor="middle" font-weight="bold">3</text>
  <text x="435" y="106" font-size="14" text-anchor="middle" font-weight="bold">x &#8712; f(x)?</text>
  <text x="600" y="106" font-size="14" text-anchor="middle" font-weight="bold">x &#8712; S?</text>

  <!-- Diagonal cell highlights -->
  <rect x="180" y="120" width="60" height="80" fill="#fff3b0" stroke="#cc9933" stroke-width="2"/>
  <rect x="240" y="200" width="60" height="60" fill="#fff3b0" stroke="#cc9933" stroke-width="2"/>
  <rect x="300" y="260" width="60" height="60" fill="#fff3b0" stroke="#cc9933" stroke-width="2"/>

  <!-- Row 1: f(1) = empty -->
  <text x="105" y="166" font-size="14" text-anchor="middle">f(1) = &#8709;</text>
  <text x="210" y="172" font-size="24" text-anchor="middle" fill="#aa2020" font-weight="bold">&#10007;</text>
  <text x="270" y="172" font-size="24" text-anchor="middle" fill="#666">&#10007;</text>
  <text x="330" y="172" font-size="24" text-anchor="middle" fill="#666">&#10007;</text>
  <text x="435" y="168" font-size="14" text-anchor="middle">1 &#8712; &#8709;? &#160;<tspan font-weight="bold">No</tspan></text>
  <text x="600" y="168" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a4d99">Yes &#8594; 1 &#8712; S</text>

  <!-- Row 2: f(2) = {1, 3} -->
  <text x="105" y="236" font-size="14" text-anchor="middle">f(2) = {1, 3}</text>
  <text x="210" y="240" font-size="24" text-anchor="middle" fill="#1a7a1a" font-weight="bold">&#10003;</text>
  <text x="270" y="240" font-size="24" text-anchor="middle" fill="#aa2020" font-weight="bold">&#10007;</text>
  <text x="330" y="240" font-size="24" text-anchor="middle" fill="#1a7a1a" font-weight="bold">&#10003;</text>
  <text x="435" y="236" font-size="14" text-anchor="middle">2 &#8712; {1,3}? &#160;<tspan font-weight="bold">No</tspan></text>
  <text x="600" y="236" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a4d99">Yes &#8594; 2 &#8712; S</text>

  <!-- Row 3: f(3) = {1, 2, 3} -->
  <text x="105" y="296" font-size="14" text-anchor="middle">f(3) = {1, 2, 3}</text>
  <text x="210" y="300" font-size="24" text-anchor="middle" fill="#1a7a1a" font-weight="bold">&#10003;</text>
  <text x="270" y="300" font-size="24" text-anchor="middle" fill="#1a7a1a" font-weight="bold">&#10003;</text>
  <text x="330" y="300" font-size="24" text-anchor="middle" fill="#aa2020" font-weight="bold">&#10003;</text>
  <text x="435" y="296" font-size="14" text-anchor="middle">3 &#8712; {1,2,3}? &#160;<tspan font-weight="bold">Yes</tspan></text>
  <text x="600" y="296" font-size="15" text-anchor="middle" font-weight="bold" fill="#666">No (3 &#8713; S)</text>

  <!-- Below table: the answer -->
  <text x="360" y="370" font-size="18" text-anchor="middle" font-weight="bold" fill="#1a4d99">S &#160;=&#160; {x &#8712; A : x &#8713; f(x)} &#160;=&#160; {1, 2}</text>
</svg>
