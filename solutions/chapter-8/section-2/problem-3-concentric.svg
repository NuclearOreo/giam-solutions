<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 440" width="420" height="440" font-family="Georgia, 'Times New Roman', serif">
  <rect width="420" height="440" fill="white"/>

  <!-- Inner circle: center (210, 210), radius 65 -->
  <circle cx="210" cy="210" r="65" fill="none" stroke="#1a4d99" stroke-width="2.5"/>

  <!-- Outer circle: center (210, 210), radius 150 -->
  <circle cx="210" cy="210" r="150" fill="none" stroke="#992020" stroke-width="2.5"/>

  <!-- 8 rays from center, each with inner & outer intersection markers -->
  <!-- 0 deg -->
  <line x1="210" y1="210" x2="365" y2="210" stroke="#777" stroke-width="1.3"/>
  <circle cx="275" cy="210" r="4" fill="#1a4d99"/>
  <circle cx="360" cy="210" r="4" fill="#992020"/>

  <!-- 45 deg: cos=sin=0.7071 -->
  <!-- Inner: (210+45.96, 210-45.96) = (255.96, 164.04) -->
  <!-- Outer: (210+106.07, 210-106.07) = (316.07, 103.93) -->
  <line x1="210" y1="210" x2="321" y2="99" stroke="#777" stroke-width="1.3"/>
  <circle cx="255.96" cy="164.04" r="4" fill="#1a4d99"/>
  <circle cx="316.07" cy="103.93" r="4" fill="#992020"/>

  <!-- 90 deg -->
  <line x1="210" y1="210" x2="210" y2="55" stroke="#777" stroke-width="1.3"/>
  <circle cx="210" cy="145" r="4" fill="#1a4d99"/>
  <circle cx="210" cy="60" r="4" fill="#992020"/>

  <!-- 135 deg -->
  <line x1="210" y1="210" x2="99" y2="99" stroke="#777" stroke-width="1.3"/>
  <circle cx="164.04" cy="164.04" r="4" fill="#1a4d99"/>
  <circle cx="103.93" cy="103.93" r="4" fill="#992020"/>

  <!-- 180 deg -->
  <line x1="210" y1="210" x2="55" y2="210" stroke="#777" stroke-width="1.3"/>
  <circle cx="145" cy="210" r="4" fill="#1a4d99"/>
  <circle cx="60" cy="210" r="4" fill="#992020"/>

  <!-- 225 deg -->
  <line x1="210" y1="210" x2="99" y2="321" stroke="#777" stroke-width="1.3"/>
  <circle cx="164.04" cy="255.96" r="4" fill="#1a4d99"/>
  <circle cx="103.93" cy="316.07" r="4" fill="#992020"/>

  <!-- 270 deg -->
  <line x1="210" y1="210" x2="210" y2="365" stroke="#777" stroke-width="1.3"/>
  <circle cx="210" cy="275" r="4" fill="#1a4d99"/>
  <circle cx="210" cy="360" r="4" fill="#992020"/>

  <!-- 315 deg -->
  <line x1="210" y1="210" x2="321" y2="321" stroke="#777" stroke-width="1.3"/>
  <circle cx="255.96" cy="255.96" r="4" fill="#1a4d99"/>
  <circle cx="316.07" cy="316.07" r="4" fill="#992020"/>

  <!-- Center -->
  <circle cx="210" cy="210" r="3.5" fill="black"/>
  <text x="218" y="207" font-size="15" font-style="italic">O</text>

  <!-- Labels -->
  <text x="245" y="295" font-size="14" font-weight="bold" fill="#1a4d99">C&#8321; (radius r&#8321;)</text>
  <text x="310" y="375" font-size="14" font-weight="bold" fill="#992020">C&#8322; (radius r&#8322;)</text>

  <!-- Caption -->
  <text x="210" y="418" font-size="13" text-anchor="middle" font-style="italic" fill="#444">Concentric case: each ray from O picks one point per circle.</text>
</svg>
