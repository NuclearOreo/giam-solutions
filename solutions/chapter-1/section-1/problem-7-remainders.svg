<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="360" fill="white"/>

  <defs>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- Left panel: 1/7 cycle -->
  <text x="175" y="30" font-size="14" font-style="italic" fill="#222" text-anchor="middle">1/7: remainders cycle through 6 states</text>

  <!-- 6 nodes arranged in hexagon -->
  <g>
    <circle cx="175" cy="120" r="20" fill="#ffe8e8" stroke="#c33" stroke-width="1.5"/>
    <text x="175" y="125" font-size="14" text-anchor="middle">1</text>

    <circle cx="244" cy="160" r="20" fill="#ffe8e8" stroke="#c33" stroke-width="1.5"/>
    <text x="244" y="165" font-size="14" text-anchor="middle">3</text>

    <circle cx="244" cy="240" r="20" fill="#ffe8e8" stroke="#c33" stroke-width="1.5"/>
    <text x="244" y="245" font-size="14" text-anchor="middle">2</text>

    <circle cx="175" cy="280" r="20" fill="#ffe8e8" stroke="#c33" stroke-width="1.5"/>
    <text x="175" y="285" font-size="14" text-anchor="middle">6</text>

    <circle cx="106" cy="240" r="20" fill="#ffe8e8" stroke="#c33" stroke-width="1.5"/>
    <text x="106" y="245" font-size="14" text-anchor="middle">4</text>

    <circle cx="106" cy="160" r="20" fill="#ffe8e8" stroke="#c33" stroke-width="1.5"/>
    <text x="106" y="165" font-size="14" text-anchor="middle">5</text>
  </g>

  <!-- Arrows along hexagon edges (going CW visually: 1 → 3 → 2 → 6 → 4 → 5 → 1) -->
  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arrowR)">
    <line x1="192" y1="131" x2="227" y2="149"/>
    <line x1="244" y1="180" x2="244" y2="220"/>
    <line x1="227" y1="251" x2="192" y2="269"/>
    <line x1="158" y1="269" x2="123" y2="251"/>
    <line x1="106" y1="220" x2="106" y2="180"/>
    <line x1="123" y1="149" x2="158" y2="131"/>
  </g>

  <!-- Digit labels on arrows (the digit emitted as the remainder transitions) -->
  <g font-size="13" fill="#c33" font-weight="bold" text-anchor="middle">
    <text x="227" y="125">1</text>
    <text x="278" y="205">4</text>
    <text x="227" y="285">2</text>
    <text x="123" y="285">8</text>
    <text x="72" y="205">5</text>
    <text x="123" y="125">7</text>
  </g>

  <text x="175" y="328" font-size="12" font-style="italic" fill="#666" text-anchor="middle">Digits emitted around the cycle: 1, 4, 2, 8, 5, 7 → 1/7 = 0.142857</text>

  <!-- vertical divider -->
  <line x1="370" y1="50" x2="370" y2="320" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Right panel: 1/8 chain -->
  <text x="555" y="30" font-size="14" font-style="italic" fill="#222" text-anchor="middle">1/8: remainder reaches 0, terminates</text>

  <g>
    <circle cx="440" cy="200" r="20" fill="#e8eef5" stroke="#446" stroke-width="1.5"/>
    <text x="440" y="205" font-size="14" text-anchor="middle">1</text>
    <circle cx="525" cy="200" r="20" fill="#e8eef5" stroke="#446" stroke-width="1.5"/>
    <text x="525" y="205" font-size="14" text-anchor="middle">2</text>
    <circle cx="610" cy="200" r="20" fill="#e8eef5" stroke="#446" stroke-width="1.5"/>
    <text x="610" y="205" font-size="14" text-anchor="middle">4</text>
    <circle cx="695" cy="200" r="22" fill="#dff5df" stroke="#363" stroke-width="2"/>
    <text x="695" y="205" font-size="14" font-weight="bold" text-anchor="middle">0</text>
  </g>

  <g stroke="#444" stroke-width="1.5" fill="none" marker-end="url(#arrowR)">
    <line x1="460" y1="200" x2="505" y2="200"/>
    <line x1="545" y1="200" x2="590" y2="200"/>
    <line x1="630" y1="200" x2="673" y2="200"/>
  </g>

  <g font-size="13" fill="#446" font-weight="bold" text-anchor="middle">
    <text x="482" y="190">1</text>
    <text x="568" y="190">2</text>
    <text x="652" y="190">5</text>
  </g>

  <text x="695" y="240" font-size="11" font-style="italic" fill="#363" text-anchor="middle">stop</text>

  <text x="555" y="328" font-size="12" font-style="italic" fill="#666" text-anchor="middle">Digits emitted along the chain: 1, 2, 5 → 1/8 = 0.125 (then all zeros)</text>
</svg>
