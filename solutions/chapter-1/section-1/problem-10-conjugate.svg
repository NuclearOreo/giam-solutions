<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="540" height="380" font-family="Georgia, 'Times New Roman', serif">
  <rect width="540" height="380" fill="white"/>

  <defs>
    <marker id="arr10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arr10blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3060c0"/>
    </marker>
    <marker id="arr10red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c03030"/>
    </marker>
  </defs>

  <text x="270" y="24" font-size="13" font-style="italic" fill="#222" text-anchor="middle">z = 2 + i and z* = 2 − i are reflections across the real axis; zz* = |z|² lies on the real axis</text>

  <!-- Light grid -->
  <g stroke="#ececec" stroke-width="0.8">
    <line x1="140" y1="50"  x2="140" y2="330"/>
    <line x1="190" y1="50"  x2="190" y2="330"/>
    <line x1="240" y1="50"  x2="240" y2="330"/>
    <line x1="290" y1="50"  x2="290" y2="330"/>
    <line x1="340" y1="50"  x2="340" y2="330"/>
    <line x1="390" y1="50"  x2="390" y2="330"/>
    <line x1="440" y1="50"  x2="440" y2="330"/>
    <line x1="490" y1="50"  x2="490" y2="330"/>
    <line x1="40"  y1="140" x2="510" y2="140"/>
    <line x1="40"  y1="240" x2="510" y2="240"/>
    <line x1="40"  y1="280" x2="510" y2="280"/>
    <line x1="40"  y1="100" x2="510" y2="100"/>
  </g>

  <!-- Modulus circle: radius √5 ≈ 2.236; with scale 50 px/unit: radius ≈ 112 -->
  <circle cx="90" cy="190" r="112" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Axes -->
  <g stroke="#222" stroke-width="1.2" marker-end="url(#arr10)" fill="none">
    <line x1="40"  y1="190" x2="515" y2="190"/>
    <line x1="90"  y1="335" x2="90"  y2="45"/>
  </g>
  <text x="510" y="208" font-size="12" font-style="italic" fill="#666">Re</text>
  <text x="100" y="55"  font-size="12" font-style="italic" fill="#666">Im</text>

  <!-- Origin label -->
  <text x="80" y="208" font-size="10" fill="#666" text-anchor="end">0</text>

  <!-- Tick labels on real axis -->
  <g font-size="10" fill="#666" text-anchor="middle">
    <text x="140" y="205">1</text>
    <text x="190" y="205">2</text>
    <text x="240" y="205">3</text>
    <text x="290" y="205">4</text>
    <text x="340" y="205">5</text>
    <text x="390" y="205">6</text>
  </g>
  <!-- Tick labels on imag axis -->
  <g font-size="10" fill="#666" text-anchor="end">
    <text x="85" y="143">1</text>
    <text x="85" y="243">−1</text>
  </g>

  <!-- Vertical dashed line connecting z and z* (showing reflection) -->
  <line x1="190" y1="140" x2="190" y2="240" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Vector to z = 2+i (blue) -->
  <line x1="90" y1="190" x2="187" y2="143" stroke="#3060c0" stroke-width="2" marker-end="url(#arr10blue)"/>
  <!-- Vector to z* = 2-i (red) -->
  <line x1="90" y1="190" x2="187" y2="237" stroke="#c03030" stroke-width="2" marker-end="url(#arr10red)"/>
  <!-- Vector to zz* = 5 (green) along real axis -->
  <line x1="90" y1="190" x2="337" y2="190" stroke="#208038" stroke-width="2.4" marker-end="url(#arr10)"/>

  <!-- Points -->
  <circle cx="190" cy="140" r="3.5" fill="#3060c0"/>
  <circle cx="190" cy="240" r="3.5" fill="#c03030"/>
  <circle cx="340" cy="190" r="4" fill="#208038"/>

  <!-- Labels -->
  <g font-size="13" fill="#222">
    <text x="198" y="135" fill="#3060c0">z = 2 + i</text>
    <text x="198" y="252" fill="#c03030">z* = 2 − i</text>
    <text x="346" y="184" fill="#208038" font-weight="bold">zz* = 5</text>
    <text x="346" y="200" fill="#208038" font-size="11" font-style="italic">(= |z|² = 4+1)</text>
  </g>

  <!-- Modulus annotation: arrow showing |z| -->
  <text x="155" y="170" font-size="11" font-style="italic" fill="#666" transform="rotate(-26 155 170)">|z| = √5</text>

  <!-- Annotation pointing to mirror line -->
  <text x="197" y="195" font-size="10" font-style="italic" fill="#666">mirror</text>

  <!-- Bottom annotation: the general formula -->
  <text x="270" y="355" font-size="12" fill="#222" text-anchor="middle">For any z = a + bi:  zz* = (a + bi)(a − bi) = a² + b² = |z|²  ∈  ℝ≥0</text>
</svg>
