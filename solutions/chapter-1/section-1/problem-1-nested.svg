<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" font-family="Georgia, 'Times New Roman', serif">
  <rect width="560" height="360" fill="white"/>

  <!-- Nested rectangles for ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ -->
  <g fill="none" stroke="#222" stroke-width="1.4">
    <rect x="30"  y="30"  width="500" height="300"/>  <!-- ℂ -->
    <rect x="65"  y="60"  width="430" height="240"/>  <!-- ℝ -->
    <rect x="110" y="90"  width="340" height="180"/>  <!-- ℚ -->
    <rect x="165" y="120" width="230" height="120"/>  <!-- ℤ -->
    <rect x="230" y="150" width="100" height="60"/>   <!-- ℕ -->
  </g>

  <!-- Set labels (top-left of each rectangle) -->
  <g font-size="18" font-weight="bold" fill="#222">
    <text x="45"  y="50">ℂ</text>
    <text x="80"  y="80">ℝ</text>
    <text x="125" y="108">ℚ</text>
    <text x="180" y="138">ℤ</text>
    <text x="245" y="168">ℕ</text>
  </g>

  <!-- Numbers, each in its smallest containing set -->
  <g font-size="15" fill="#222" text-anchor="middle">
    <!-- In ℂ \ ℝ -->
    <text x="47" y="187">1 + i</text>

    <!-- In ℝ \ ℚ -->
    <text x="87" y="187">π</text>
    <text x="472" y="187">√3</text>

    <!-- In ℚ \ ℤ -->
    <text x="137" y="187">22/7</text>

    <!-- In ℤ \ ℕ -->
    <text x="197" y="187">−6</text>
    <text x="362" y="187">i² = −1</text>

    <!-- In ℕ -->
    <text x="258" y="187">17</text>
    <text x="305" y="187">e⁰ = 1</text>
  </g>
</svg>
