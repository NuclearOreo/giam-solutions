<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="290" fill="white"/>

  <text x="350" y="28" font-size="13" font-style="italic" fill="#444" text-anchor="middle">"21322314" describes itself: each pair "count digit" reports a true count in the string</text>

  <!-- Pair labels (top) -->
  <g font-size="14" text-anchor="middle" fill="#222">
    <text x="220" y="72">two <tspan fill="#c33" font-weight="bold">1</tspan>s</text>
    <text x="320" y="72">three <tspan fill="#446" font-weight="bold">2</tspan>s</text>
    <text x="420" y="72">two <tspan fill="#363" font-weight="bold">3</tspan>s</text>
    <text x="520" y="72">one <tspan fill="#639" font-weight="bold">4</tspan></text>
  </g>

  <!-- Brackets connecting each label to its pair of boxes -->
  <g stroke="#888" stroke-width="1" fill="none">
    <path d="M 170 90 L 170 105 L 270 105 L 270 90"/>
    <path d="M 270 90 L 270 105 L 370 105 L 370 90"/>
    <path d="M 370 90 L 370 105 L 470 105 L 470 90"/>
    <path d="M 470 90 L 470 105 L 570 105 L 570 90"/>
  </g>

  <!-- Digit boxes, each filled by digit value -->
  <g>
    <rect x="170" y="120" width="50" height="50" fill="#e0e8f5" stroke="#446" stroke-width="1.2"/>
    <text x="195" y="156" font-size="24" text-anchor="middle" fill="#222">2</text>

    <rect x="220" y="120" width="50" height="50" fill="#ffe0e0" stroke="#c33" stroke-width="1.2"/>
    <text x="245" y="156" font-size="24" text-anchor="middle" fill="#222">1</text>

    <rect x="270" y="120" width="50" height="50" fill="#e0f5e0" stroke="#363" stroke-width="1.2"/>
    <text x="295" y="156" font-size="24" text-anchor="middle" fill="#222">3</text>

    <rect x="320" y="120" width="50" height="50" fill="#e0e8f5" stroke="#446" stroke-width="1.2"/>
    <text x="345" y="156" font-size="24" text-anchor="middle" fill="#222">2</text>

    <rect x="370" y="120" width="50" height="50" fill="#e0e8f5" stroke="#446" stroke-width="1.2"/>
    <text x="395" y="156" font-size="24" text-anchor="middle" fill="#222">2</text>

    <rect x="420" y="120" width="50" height="50" fill="#e0f5e0" stroke="#363" stroke-width="1.2"/>
    <text x="445" y="156" font-size="24" text-anchor="middle" fill="#222">3</text>

    <rect x="470" y="120" width="50" height="50" fill="#ffe0e0" stroke="#c33" stroke-width="1.2"/>
    <text x="495" y="156" font-size="24" text-anchor="middle" fill="#222">1</text>

    <rect x="520" y="120" width="50" height="50" fill="#f0e0f5" stroke="#639" stroke-width="1.2"/>
    <text x="545" y="156" font-size="24" text-anchor="middle" fill="#222">4</text>
  </g>

  <!-- Position markers below each box -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="195" y="184">1</text>
    <text x="245" y="184">2</text>
    <text x="295" y="184">3</text>
    <text x="345" y="184">4</text>
    <text x="395" y="184">5</text>
    <text x="445" y="184">6</text>
    <text x="495" y="184">7</text>
    <text x="545" y="184">8</text>
  </g>

  <!-- Count verification -->
  <g font-size="12" text-anchor="middle">
    <text x="350" y="220" fill="#444">Verify by counting the colors in the string:</text>
    <text x="170" y="245" fill="#c33" text-anchor="start">2 red boxes (the 1s) ✓</text>
    <text x="320" y="245" fill="#446" text-anchor="start">3 blue boxes (the 2s) ✓</text>
    <text x="170" y="265" fill="#363" text-anchor="start">2 green boxes (the 3s) ✓</text>
    <text x="320" y="265" fill="#639" text-anchor="start">1 purple box (the 4) ✓</text>
  </g>
</svg>
