<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 250" width="540" height="250" font-family="Georgia, 'Times New Roman', serif">
  <rect width="540" height="250" fill="white"/>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- number line -->
  <line x1="30" y1="180" x2="510" y2="180" stroke="#222" stroke-width="1.5"/>

  <!-- ticks -->
  <g stroke="#222" stroke-width="1.2">
    <line x1="60"  y1="175" x2="60"  y2="185"/>
    <line x1="130" y1="175" x2="130" y2="185"/>
    <line x1="200" y1="175" x2="200" y2="185"/>
    <line x1="270" y1="175" x2="270" y2="185"/>
    <line x1="340" y1="175" x2="340" y2="185"/>
    <line x1="410" y1="175" x2="410" y2="185"/>
    <line x1="480" y1="175" x2="480" y2="185"/>
  </g>

  <!-- integer labels below the line -->
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="60"  y="205">−3</text>
    <text x="130" y="205">−2</text>
    <text x="200" y="205">−1</text>
    <text x="270" y="205">0</text>
    <text x="340" y="205">1</text>
    <text x="410" y="205">2</text>
    <text x="480" y="205">3</text>
  </g>

  <!-- position circles above each integer, showing visit order in the listing -->
  <g>
    <circle cx="270" cy="150" r="11" fill="#c33"/>
    <text x="270" y="155" font-size="12" fill="white" text-anchor="middle" font-weight="bold">1</text>
    <circle cx="340" cy="150" r="11" fill="#c33"/>
    <text x="340" y="155" font-size="12" fill="white" text-anchor="middle" font-weight="bold">2</text>
    <circle cx="200" cy="150" r="11" fill="#c33"/>
    <text x="200" y="155" font-size="12" fill="white" text-anchor="middle" font-weight="bold">3</text>
    <circle cx="410" cy="150" r="11" fill="#c33"/>
    <text x="410" y="155" font-size="12" fill="white" text-anchor="middle" font-weight="bold">4</text>
    <circle cx="130" cy="150" r="11" fill="#c33"/>
    <text x="130" y="155" font-size="12" fill="white" text-anchor="middle" font-weight="bold">5</text>
    <circle cx="480" cy="150" r="11" fill="#c33"/>
    <text x="480" y="155" font-size="12" fill="white" text-anchor="middle" font-weight="bold">6</text>
    <circle cx="60"  cy="150" r="11" fill="#c33"/>
    <text x="60"  y="155" font-size="12" fill="white" text-anchor="middle" font-weight="bold">7</text>
  </g>

  <!-- arc arrows showing zigzag order (1→2, 2→3, 3→4, 4→5) -->
  <g stroke="#444" stroke-width="1.4" fill="none" marker-end="url(#arrowhead)">
    <path d="M 281 150 Q 305 105 329 150"/>
    <path d="M 329 150 Q 270 60  211 150"/>
    <path d="M 211 150 Q 305 35  399 150"/>
    <path d="M 399 150 Q 270 20  141 150"/>
  </g>

  <!-- continuation hint -->
  <text x="270" y="240" font-size="12" font-style="italic" fill="#666" text-anchor="middle">…path continues to position 6 (= integer 3), then 7 (= −3), and so on</text>
</svg>
