<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160" font-family="Georgia, 'Times New Roman', serif">
  <rect width="600" height="160" fill="white"/>

  <text x="300" y="22" font-size="13" font-style="italic" fill="#444" text-anchor="middle">Denominators 1–20 (in lowest terms): green = decimal terminates, red = decimal repeats</text>

  <!-- 20 colored boxes -->
  <g>
    <!-- b = 1 — terminates -->
    <rect x="20"  y="40" width="26" height="32" fill="#e0f5e0" stroke="#363" stroke-width="1.2"/>
    <text x="33"  y="62" font-size="14" text-anchor="middle">1</text>
    <text x="33"  y="92" font-size="10" fill="#666" text-anchor="middle">1</text>

    <rect x="48"  y="40" width="26" height="32" fill="#e0f5e0" stroke="#363" stroke-width="1.2"/>
    <text x="61"  y="62" font-size="14" text-anchor="middle">2</text>
    <text x="61"  y="92" font-size="10" fill="#666" text-anchor="middle">2</text>

    <rect x="76"  y="40" width="26" height="32" fill="#ffe0e0" stroke="#c33" stroke-width="1.2"/>
    <text x="89"  y="62" font-size="14" text-anchor="middle">3</text>
    <text x="89"  y="92" font-size="10" fill="#666" text-anchor="middle">3</text>

    <rect x="104" y="40" width="26" height="32" fill="#e0f5e0" stroke="#363" stroke-width="1.2"/>
    <text x="117" y="62" font-size="14" text-anchor="middle">4</text>
    <text x="117" y="92" font-size="10" fill="#666" text-anchor="middle">2²</text>

    <rect x="132" y="40" width="26" height="32" fill="#e0f5e0" stroke="#363" stroke-width="1.2"/>
    <text x="145" y="62" font-size="14" text-anchor="middle">5</text>
    <text x="145" y="92" font-size="10" fill="#666" text-anchor="middle">5</text>

    <rect x="160" y="40" width="26" height="32" fill="#ffe0e0" stroke="#c33" stroke-width="1.2"/>
    <text x="173" y="62" font-size="14" text-anchor="middle">6</text>
    <text x="173" y="92" font-size="10" fill="#666" text-anchor="middle">2·3</text>

    <rect x="188" y="40" width="26" height="32" fill="#ffe0e0" stroke="#c33" stroke-width="1.2"/>
    <text x="201" y="62" font-size="14" text-anchor="middle">7</text>
    <text x="201" y="92" font-size="10" fill="#666" text-anchor="middle">7</text>

    <rect x="216" y="40" width="26" height="32" fill="#e0f5e0" stroke="#363" stroke-width="1.2"/>
    <text x="229" y="62" font-size="14" text-anchor="middle">8</text>
    <text x="229" y="92" font-size="10" fill="#666" text-anchor="middle">2³</text>

    <rect x="244" y="40" width="26" height="32" fill="#ffe0e0" stroke="#c33" stroke-width="1.2"/>
    <text x="257" y="62" font-size="14" text-anchor="middle">9</text>
    <text x="257" y="92" font-size="10" fill="#666" text-anchor="middle">3²</text>

    <rect x="272" y="40" width="26" height="32" fill="#e0f5e0" stroke="#363" stroke-width="1.2"/>
    <text x="285" y="62" font-size="14" text-anchor="middle">10</text>
    <text x="285" y="92" font-size="10" fill="#666" text-anchor="middle">2·5</text>

    <rect x="300" y="40" width="26" height="32" fill="#ffe0e0" stroke="#c33" stroke-width="1.2"/>
    <text x="313" y="62" font-size="14" text-anchor="middle">11</text>
    <text x="313" y="92" font-size="10" fill="#666" text-anchor="middle">11</text>

    <rect x="328" y="40" width="26" height="32" fill="#ffe0e0" stroke="#c33" stroke-width="1.2"/>
    <text x="341" y="62" font-size="14" text-anchor="middle">12</text>
    <text x="341" y="92" font-size="10" fill="#666" text-anchor="middle">2²·3</text>

    <rect x="356" y="40" width="26" height="32" fill="#ffe0e0" stroke="#c33" stroke-width="1.2"/>
    <text x="369" y="62" font-size="14" text-anchor="middle">13</text>
    <text x="369" y="92" font-size="10" fill="#666" text-anchor="middle">13</text>

    <rect x="384" y="40" width="26" height="32" fill="#ffe0e0" stroke="#c33" stroke-width="1.2"/>
    <text x="397" y="62" font-size="14" text-anchor="middle">14</text>
    <text x="397" y="92" font-size="10" fill="#666" text-anchor="middle">2·7</text>

    <rect x="412" y="40" width="26" height="32" fill="#ffe0e0" stroke="#c33" stroke-width="1.2"/>
    <text x="425" y="62" font-size="14" text-anchor="middle">15</text>
    <text x="425" y="92" font-size="10" fill="#666" text-anchor="middle">3·5</text>

    <rect x="440" y="40" width="26" height="32" fill="#e0f5e0" stroke="#363" stroke-width="1.2"/>
    <text x="453" y="62" font-size="14" text-anchor="middle">16</text>
    <text x="453" y="92" font-size="10" fill="#666" text-anchor="middle">2⁴</text>

    <rect x="468" y="40" width="26" height="32" fill="#ffe0e0" stroke="#c33" stroke-width="1.2"/>
    <text x="481" y="62" font-size="14" text-anchor="middle">17</text>
    <text x="481" y="92" font-size="10" fill="#666" text-anchor="middle">17</text>

    <rect x="496" y="40" width="26" height="32" fill="#ffe0e0" stroke="#c33" stroke-width="1.2"/>
    <text x="509" y="62" font-size="14" text-anchor="middle">18</text>
    <text x="509" y="92" font-size="10" fill="#666" text-anchor="middle">2·3²</text>

    <rect x="524" y="40" width="26" height="32" fill="#ffe0e0" stroke="#c33" stroke-width="1.2"/>
    <text x="537" y="62" font-size="14" text-anchor="middle">19</text>
    <text x="537" y="92" font-size="10" fill="#666" text-anchor="middle">19</text>

    <rect x="552" y="40" width="26" height="32" fill="#e0f5e0" stroke="#363" stroke-width="1.2"/>
    <text x="565" y="62" font-size="14" text-anchor="middle">20</text>
    <text x="565" y="92" font-size="10" fill="#666" text-anchor="middle">2²·5</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#444">
    <rect x="80"  y="120" width="14" height="10" fill="#e0f5e0" stroke="#363" stroke-width="0.6"/>
    <text x="100" y="129">primes ⊆ {2, 5} — terminates</text>
    <rect x="320" y="120" width="14" height="10" fill="#ffe0e0" stroke="#c33" stroke-width="0.6"/>
    <text x="340" y="129">other prime present — repeats</text>
  </g>
</svg>
