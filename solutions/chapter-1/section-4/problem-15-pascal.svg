<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="420" fill="white"/>

  <text x="360" y="28" font-size="13" font-style="italic" fill="#444" text-anchor="middle">Pascal's triangle: the edges are all 1 (so C(n,0) = C(n,n) = 1), and each row reads the same backwards.</text>

  <!-- highlight boxes (drawn first, behind text) -->
  <rect x="280" y="150" width="28" height="20" fill="#cdeccd" stroke="#2e7d32" stroke-width="1.4"/>
  <rect x="500" y="286" width="28" height="20" fill="#cdeccd" stroke="#2e7d32" stroke-width="1.4"/>

  <g font-size="13" text-anchor="middle">
    <!-- Row 0 (y=60) -->
    <text x="360" y="60" fill="#2e7d32" font-weight="bold">1</text>
    <!-- Row 1 (y=94) -->
    <text x="338" y="94" fill="#2e7d32" font-weight="bold">1</text><text x="382" y="94" fill="#2e7d32" font-weight="bold">1</text>
    <!-- Row 2 (y=128) -->
    <text x="316" y="128" fill="#2e7d32" font-weight="bold">1</text><text x="360" y="128">2</text><text x="404" y="128" fill="#2e7d32" font-weight="bold">1</text>
    <!-- Row 3 (y=164): leftmost = C(3,0) = (a) -->
    <text x="294" y="164" fill="#2e7d32" font-weight="bold">1</text><text x="338" y="164">3</text><text x="382" y="164">3</text><text x="426" y="164" fill="#2e7d32" font-weight="bold">1</text>
    <!-- Row 4 (y=196) -->
    <text x="272" y="196" fill="#2e7d32" font-weight="bold">1</text><text x="316" y="196">4</text><text x="360" y="196">6</text><text x="404" y="196">4</text><text x="448" y="196" fill="#2e7d32" font-weight="bold">1</text>
    <!-- Row 5 (y=230) -->
    <text x="250" y="230" fill="#2e7d32" font-weight="bold">1</text><text x="294" y="230">5</text><text x="338" y="230">10</text><text x="382" y="230">10</text><text x="426" y="230">5</text><text x="470" y="230" fill="#2e7d32" font-weight="bold">1</text>
    <!-- Row 6 (y=264) -->
    <text x="228" y="264" fill="#2e7d32" font-weight="bold">1</text><text x="272" y="264">6</text><text x="316" y="264">15</text><text x="360" y="264">20</text><text x="404" y="264">15</text><text x="448" y="264">6</text><text x="492" y="264" fill="#2e7d32" font-weight="bold">1</text>
    <!-- Row 7 (y=300): rightmost = C(7,7) = (b) -->
    <text x="206" y="300" fill="#2e7d32" font-weight="bold">1</text><text x="250" y="300">7</text><text x="294" y="300">21</text><text x="338" y="300">35</text><text x="382" y="300">35</text><text x="426" y="300">21</text><text x="470" y="300">7</text><text x="514" y="300" fill="#2e7d32" font-weight="bold">1</text>
  </g>

  <!-- (a) and (b) callouts -->
  <text x="266" y="164" font-size="11" fill="#2e7d32" text-anchor="end">(a) →</text>
  <text x="544" y="300" font-size="11" fill="#2e7d32" text-anchor="start">← (b)</text>

  <!-- symmetry + answers panel -->
  <line x1="40" y1="330" x2="680" y2="330" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="354" font-size="12.5" fill="#222">(*c*), (d) use the symmetry  C(n, k) = C(n, n − k):  since 5 + 8 = 13,</text>
  <text x="80" y="378" font-size="13.5" fill="#2a5db0" font-weight="bold">C(13, 5) = C(13, 8) = 1287.</text>
  <text x="40" y="404" font-size="13.5" fill="#222">(e)  C(52, 7) = 133 784 560.</text>
</svg>
