<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="300" fill="white"/>

  <text x="360" y="30" font-size="13" font-style="italic" fill="#444" text-anchor="middle">q = ⌊n/d⌋ counts the full d-steps below n; r = n − qd is the leftover. Example: 23 = 4·5 + 3.</text>

  <!-- number line 0..25, scale: x = 60 + v*24 (v in 0..25 -> 60..660) -->
  <line x1="50" y1="150" x2="680" y2="150" stroke="#222" stroke-width="1.4"/>
  <!-- ticks at multiples of 5: 0,5,10,15,20,25 -> x=60,180,300,420,540,660 -->
  <g stroke="#222" stroke-width="1.2">
    <line x1="60"  y1="142" x2="60"  y2="158"/>
    <line x1="180" y1="142" x2="180" y2="158"/>
    <line x1="300" y1="142" x2="300" y2="158"/>
    <line x1="420" y1="142" x2="420" y2="158"/>
    <line x1="540" y1="142" x2="540" y2="158"/>
    <line x1="660" y1="142" x2="660" y2="158"/>
  </g>
  <!-- value labels -->
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="60"  y="174">0</text>
    <text x="180" y="174">5</text>
    <text x="300" y="174">10</text>
    <text x="420" y="174">15</text>
    <text x="540" y="174">20</text>
    <text x="660" y="174">25</text>
  </g>
  <!-- multiples-of-d labels above -->
  <g font-size="11" fill="#888" text-anchor="middle" font-style="italic">
    <text x="60"  y="132">0</text>
    <text x="180" y="132">d</text>
    <text x="300" y="132">2d</text>
    <text x="420" y="132">3d</text>
    <text x="540" y="132">4d = qd</text>
    <text x="660" y="132">5d</text>
  </g>

  <!-- n = 23 at x = 60 + 23*24 = 612 -->
  <circle cx="612" cy="150" r="5" fill="#c33"/>
  <text x="612" y="116" font-size="14" fill="#c33" text-anchor="middle">n = 23</text>
  <line x1="612" y1="120" x2="612" y2="144" stroke="#c33" stroke-width="0.8" stroke-dasharray="2,2"/>

  <!-- brace for qd (0 to 20) -->
  <path d="M 60 200 L 60 208 L 540 208 L 540 200" stroke="#2a5db0" stroke-width="1.2" fill="none"/>
  <text x="300" y="226" font-size="12.5" fill="#2a5db0" text-anchor="middle">q·d = 4·5 = 20   (q = ⌊23/5⌋ = 4 full steps)</text>

  <!-- brace for r (20 to 23) -->
  <path d="M 540 200 L 540 208 L 612 208 L 612 200" stroke="#c06a16" stroke-width="1.2" fill="none"/>
  <text x="576" y="244" font-size="12.5" fill="#c06a16" text-anchor="middle">r = 3</text>

  <!-- formulas -->
  <line x1="40" y1="262" x2="680" y2="262" stroke="#ddd" stroke-width="1"/>
  <text x="360" y="285" font-size="14" fill="#222" text-anchor="middle">q = ⌊n/d⌋ = ⌊23/5⌋ = 4,        r = n − d⌊n/d⌋ = 23 − 5·4 = 3.</text>
</svg>
