<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="340" fill="white"/>

  <text x="360" y="30" font-size="13" font-style="italic" fill="#444" text-anchor="middle">340 lb of sand in 50-lb bags: six full bags hold 300 lb; the last 40 lb forces a seventh.</text>

  <!-- 7 bags: capacity rect (outline) + sand fill from bottom -->
  <!-- x = 40 + i*92 ; width 64 ; capacity top y=64 bottom y=184 (height 120 = 50 lb) -->
  <!-- bags 1-6 full (fill 120), bag 7 = 40/50 -> fill 96 (top y=88) -->
  <g>
    <!-- bag 1 -->
    <rect x="40"  y="64" width="64" height="120" fill="none" stroke="#888" stroke-width="1.2"/>
    <rect x="42"  y="66" width="60" height="116" fill="#e6cf94"/>
    <!-- bag 2 -->
    <rect x="132" y="64" width="64" height="120" fill="none" stroke="#888" stroke-width="1.2"/>
    <rect x="134" y="66" width="60" height="116" fill="#e6cf94"/>
    <!-- bag 3 -->
    <rect x="224" y="64" width="64" height="120" fill="none" stroke="#888" stroke-width="1.2"/>
    <rect x="226" y="66" width="60" height="116" fill="#e6cf94"/>
    <!-- bag 4 -->
    <rect x="316" y="64" width="64" height="120" fill="none" stroke="#888" stroke-width="1.2"/>
    <rect x="318" y="66" width="60" height="116" fill="#e6cf94"/>
    <!-- bag 5 -->
    <rect x="408" y="64" width="64" height="120" fill="none" stroke="#888" stroke-width="1.2"/>
    <rect x="410" y="66" width="60" height="116" fill="#e6cf94"/>
    <!-- bag 6 -->
    <rect x="500" y="64" width="64" height="120" fill="none" stroke="#888" stroke-width="1.2"/>
    <rect x="502" y="66" width="60" height="116" fill="#e6cf94"/>
    <!-- bag 7 (partial: 40/50 = 80% -> fill height 96, top y=88) -->
    <rect x="592" y="64" width="64" height="120" fill="none" stroke="#c06a16" stroke-width="1.8"/>
    <rect x="594" y="88" width="60" height="94" fill="#e6cf94"/>
    <line x1="592" y1="88" x2="656" y2="88" stroke="#c06a16" stroke-width="1" stroke-dasharray="3,2"/>
  </g>

  <!-- bag loads -->
  <g font-size="13" text-anchor="middle" fill="#222">
    <text x="72"  y="204">50</text>
    <text x="164" y="204">50</text>
    <text x="256" y="204">50</text>
    <text x="348" y="204">50</text>
    <text x="440" y="204">50</text>
    <text x="532" y="204">50</text>
    <text x="624" y="204" fill="#c06a16" font-weight="bold">40</text>
  </g>
  <!-- bag numbers -->
  <g font-size="10" text-anchor="middle" fill="#888">
    <text x="72"  y="220">bag 1</text>
    <text x="164" y="220">bag 2</text>
    <text x="256" y="220">bag 3</text>
    <text x="348" y="220">bag 4</text>
    <text x="440" y="220">bag 5</text>
    <text x="532" y="220">bag 6</text>
    <text x="624" y="220" fill="#c06a16">bag 7</text>
  </g>
  <text x="624" y="58" font-size="10.5" font-style="italic" fill="#c06a16" text-anchor="middle">10 lb of room</text>

  <!-- expression -->
  <line x1="40" y1="244" x2="680" y2="244" stroke="#ddd" stroke-width="1"/>
  <rect x="200" y="258" width="320" height="36" rx="5" fill="#eef2f7" stroke="#2a5db0" stroke-width="1.4"/>
  <text x="360" y="282" font-size="17" font-weight="bold" fill="#2a5db0" text-anchor="middle">⌈ 340 / 50 ⌉ = ⌈ 6.8 ⌉ = 7</text>

  <text x="360" y="320" font-size="12" font-style="italic" fill="#666" text-anchor="middle">Floor would give ⌊6.8⌋ = 6 bags — only 300 lb, leaving 40 lb on the ground. Ceiling rounds up.</text>
</svg>
