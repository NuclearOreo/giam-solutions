<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="380" fill="white"/>

  <text x="360" y="30" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">An integer is even ⟺ its last octal digit is even (one of 0, 2, 4, 6).</text>

  <!-- octal digit row 0..7 -->
  <text x="40" y="68" font-size="12" fill="#666">octal digits:</text>
  <g>
    <rect x="150" y="50" width="52" height="34" fill="#cdeccd" stroke="#2e7d32" stroke-width="1.3"/>
    <rect x="206" y="50" width="52" height="34" fill="#ececec" stroke="#999" stroke-width="1"/>
    <rect x="262" y="50" width="52" height="34" fill="#cdeccd" stroke="#2e7d32" stroke-width="1.3"/>
    <rect x="318" y="50" width="52" height="34" fill="#ececec" stroke="#999" stroke-width="1"/>
    <rect x="374" y="50" width="52" height="34" fill="#cdeccd" stroke="#2e7d32" stroke-width="1.3"/>
    <rect x="430" y="50" width="52" height="34" fill="#ececec" stroke="#999" stroke-width="1"/>
    <rect x="486" y="50" width="52" height="34" fill="#cdeccd" stroke="#2e7d32" stroke-width="1.3"/>
    <rect x="542" y="50" width="52" height="34" fill="#ececec" stroke="#999" stroke-width="1"/>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="176" y="73">0</text>
    <text x="232" y="73" fill="#888">1</text>
    <text x="288" y="73">2</text>
    <text x="344" y="73" fill="#888">3</text>
    <text x="400" y="73">4</text>
    <text x="456" y="73" fill="#888">5</text>
    <text x="512" y="73">6</text>
    <text x="568" y="73" fill="#888">7</text>
  </g>
  <text x="612" y="71" font-size="11.5" font-style="italic" fill="#2e7d32">green = even</text>

  <!-- examples table -->
  <line x1="40" y1="104" x2="680" y2="104" stroke="#ddd" stroke-width="1"/>
  <g font-size="12" font-weight="bold" fill="#222">
    <text x="120" y="128" text-anchor="middle">decimal</text>
    <text x="280" y="128" text-anchor="middle">octal</text>
    <text x="420" y="128" text-anchor="middle">last digit</text>
    <text x="560" y="128" text-anchor="middle">even?</text>
  </g>

  <!-- rows -->
  <g font-size="15" text-anchor="middle">
    <!-- 8 = 10_8 last 0 even -->
    <text x="120" y="160">8</text>
    <text x="280" y="160">10₈</text>
    <rect x="402" y="146" width="36" height="22" fill="#cdeccd" stroke="#2e7d32" stroke-width="1.1"/>
    <text x="420" y="163" font-weight="bold">0</text>
    <text x="560" y="160" fill="#2e7d32">✓ even</text>

    <!-- 9 = 11_8 last 1 odd -->
    <text x="120" y="194">9</text>
    <text x="280" y="194">11₈</text>
    <rect x="402" y="180" width="36" height="22" fill="#ececec" stroke="#999" stroke-width="1.1"/>
    <text x="420" y="197" font-weight="bold" fill="#888">1</text>
    <text x="560" y="194" fill="#888">✗ odd</text>

    <!-- 22 = 26_8 last 6 even -->
    <text x="120" y="228">22</text>
    <text x="280" y="228">26₈</text>
    <rect x="402" y="214" width="36" height="22" fill="#cdeccd" stroke="#2e7d32" stroke-width="1.1"/>
    <text x="420" y="231" font-weight="bold">6</text>
    <text x="560" y="228" fill="#2e7d32">✓ even</text>

    <!-- 511 = 777_8 last 7 odd -->
    <text x="120" y="262">511</text>
    <text x="280" y="262">777₈</text>
    <rect x="402" y="248" width="36" height="22" fill="#ececec" stroke="#999" stroke-width="1.1"/>
    <text x="420" y="265" font-weight="bold" fill="#888">7</text>
    <text x="560" y="262" fill="#888">✗ odd</text>
  </g>

  <!-- contrast box -->
  <line x1="40" y1="290" x2="680" y2="290" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="314" font-size="12.5" font-weight="bold" fill="#222">Why the last digit? Because 8 is even. (For an ODD base, parity needs the digit SUM.)</text>
  <text x="60" y="338" font-size="12.5" fill="#2e7d32">base 8 (even):  read the last digit  —  8 = 10₈ ends in 0 → even</text>
  <text x="60" y="360" font-size="12.5" fill="#c06a16">base 7 (odd):  add the digits  —  3267 = 12345₇, sum 1+2+3+4+5 = 15 (odd) → odd</text>
</svg>
