<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="230" fill="white"/>

  <text x="360" y="28" font-size="13" font-style="italic" fill="#444" text-anchor="middle">Doubly-even = "half is itself even" = a multiple of 4. They land every fourth integer.</text>

  <!-- cells 0..16 at x = 40 + i*38, width 34, y=54 h=38 -->
  <!-- colors: green = mult of 4 (doubly-even); yellow = 2*odd (even, not doubly); grey = odd -->
  <g>
    <!-- 0 green -->
    <rect x="40"  y="54" width="34" height="38" fill="#cdeccd" stroke="#2e7d32" stroke-width="1.4"/>
    <rect x="78"  y="54" width="34" height="38" fill="#ececec" stroke="#999" stroke-width="1"/>
    <rect x="116" y="54" width="34" height="38" fill="#fbf0c0" stroke="#b8860b" stroke-width="1"/>
    <rect x="154" y="54" width="34" height="38" fill="#ececec" stroke="#999" stroke-width="1"/>
    <rect x="192" y="54" width="34" height="38" fill="#cdeccd" stroke="#2e7d32" stroke-width="1.4"/>
    <rect x="230" y="54" width="34" height="38" fill="#ececec" stroke="#999" stroke-width="1"/>
    <rect x="268" y="54" width="34" height="38" fill="#fbf0c0" stroke="#b8860b" stroke-width="1"/>
    <rect x="306" y="54" width="34" height="38" fill="#ececec" stroke="#999" stroke-width="1"/>
    <rect x="344" y="54" width="34" height="38" fill="#cdeccd" stroke="#2e7d32" stroke-width="1.4"/>
    <rect x="382" y="54" width="34" height="38" fill="#ececec" stroke="#999" stroke-width="1"/>
    <rect x="420" y="54" width="34" height="38" fill="#fbf0c0" stroke="#b8860b" stroke-width="1"/>
    <rect x="458" y="54" width="34" height="38" fill="#ececec" stroke="#999" stroke-width="1"/>
    <rect x="496" y="54" width="34" height="38" fill="#cdeccd" stroke="#2e7d32" stroke-width="1.4"/>
    <rect x="534" y="54" width="34" height="38" fill="#ececec" stroke="#999" stroke-width="1"/>
    <rect x="572" y="54" width="34" height="38" fill="#fbf0c0" stroke="#b8860b" stroke-width="1"/>
    <rect x="610" y="54" width="34" height="38" fill="#ececec" stroke="#999" stroke-width="1"/>
    <rect x="648" y="54" width="34" height="38" fill="#cdeccd" stroke="#2e7d32" stroke-width="1.4"/>
  </g>

  <!-- value labels -->
  <g font-size="14" fill="#222" text-anchor="middle">
    <text x="57"  y="79">0</text>
    <text x="95"  y="79">1</text>
    <text x="133" y="79">2</text>
    <text x="171" y="79">3</text>
    <text x="209" y="79">4</text>
    <text x="247" y="79">5</text>
    <text x="285" y="79">6</text>
    <text x="323" y="79">7</text>
    <text x="361" y="79">8</text>
    <text x="399" y="79">9</text>
    <text x="437" y="79">10</text>
    <text x="475" y="79">11</text>
    <text x="513" y="79">12</text>
    <text x="551" y="79">13</text>
    <text x="589" y="79">14</text>
    <text x="627" y="79">15</text>
    <text x="665" y="79">16</text>
  </g>

  <!-- flags below: 0, 4, 8, 12 -->
  <g font-size="11" fill="#2e7d32" text-anchor="middle">
    <text x="57"  y="108">↑</text>
    <text x="57"  y="122" font-style="italic">0 (yes!)</text>
    <text x="209" y="108">↑</text>
    <text x="209" y="122" font-weight="bold">1st</text>
    <text x="361" y="108">↑</text>
    <text x="361" y="122" font-weight="bold">2nd</text>
    <text x="513" y="108">↑</text>
    <text x="513" y="122" font-weight="bold">3rd</text>
  </g>
  <text x="360" y="145" font-size="11.5" font-style="italic" fill="#666" text-anchor="middle">0 is doubly-even; the first three positive doubly-even integers are 4, 8, 12.</text>

  <!-- legend -->
  <g font-size="11.5" fill="#444">
    <rect x="90"  y="175" width="16" height="14" fill="#cdeccd" stroke="#2e7d32" stroke-width="0.8"/>
    <text x="112" y="187" text-anchor="start">doubly-even (multiple of 4)</text>
    <rect x="320" y="175" width="16" height="14" fill="#fbf0c0" stroke="#b8860b" stroke-width="0.8"/>
    <text x="342" y="187" text-anchor="start">even, not doubly (2 × odd)</text>
    <rect x="560" y="175" width="16" height="14" fill="#ececec" stroke="#999" stroke-width="0.8"/>
    <text x="582" y="187" text-anchor="start">odd</text>
  </g>
</svg>
