<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="340" fill="white"/>

  <defs>
    <marker id="a11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="360" y="28" font-size="13" font-style="italic" fill="#444" text-anchor="middle">The gap ⌈x⌉ − ⌊x⌋ is 1 when x is not an integer, but 0 when it is — so strict &lt; can fail.</text>

  <!-- ===== Panel A: 7/3, non-integer ===== -->
  <text x="40" y="66" font-size="13" font-weight="bold" fill="#2e7d32">When d ∤ n  (e.g. 7/3 ≈ 2.33):  ⌊ ⌋ &lt; ⌈ ⌉  holds.</text>
  <!-- number line -->
  <line x1="120" y1="110" x2="600" y2="110" stroke="#222" stroke-width="1.2" marker-end="url(#a11)"/>
  <!-- ticks at 2 (x=220), 3 (x=460); scale 240px per unit -->
  <g stroke="#222" stroke-width="1.2">
    <line x1="220" y1="104" x2="220" y2="116"/>
    <line x1="460" y1="104" x2="460" y2="116"/>
  </g>
  <text x="220" y="132" font-size="12" text-anchor="middle" fill="#444">2</text>
  <text x="460" y="132" font-size="12" text-anchor="middle" fill="#444">3</text>
  <!-- 7/3 ≈ 2.33 at x = 220 + 0.33*240 ≈ 300 -->
  <circle cx="300" cy="110" r="4.5" fill="#c33"/>
  <text x="300" y="96" font-size="12" fill="#c33" text-anchor="middle">7/3</text>
  <!-- floor marker at 2, ceil at 3 -->
  <circle cx="220" cy="110" r="5" fill="#2a5db0"/>
  <circle cx="460" cy="110" r="5" fill="#c06a16"/>
  <text x="220" y="152" font-size="12" fill="#2a5db0" text-anchor="middle">⌊7/3⌋ = 2</text>
  <text x="460" y="152" font-size="12" fill="#c06a16" text-anchor="middle">⌈7/3⌉ = 3</text>
  <text x="630" y="114" font-size="13" fill="#2e7d32">2 &lt; 3 ✓</text>

  <!-- divider -->
  <line x1="40" y1="180" x2="680" y2="180" stroke="#ddd" stroke-width="1"/>

  <!-- ===== Panel B: 6/3 = 2, integer (counterexample) ===== -->
  <text x="40" y="216" font-size="13" font-weight="bold" fill="#c33">When d | n  (e.g. 6/3 = 2):  ⌊ ⌋ = ⌈ ⌉  — strict &lt; FAILS.</text>
  <line x1="120" y1="260" x2="600" y2="260" stroke="#222" stroke-width="1.2" marker-end="url(#a11)"/>
  <g stroke="#222" stroke-width="1.2">
    <line x1="220" y1="254" x2="220" y2="266"/>
    <line x1="460" y1="254" x2="460" y2="266"/>
  </g>
  <text x="220" y="282" font-size="12" text-anchor="middle" fill="#444">2</text>
  <text x="460" y="282" font-size="12" text-anchor="middle" fill="#444">3</text>
  <!-- 6/3 = 2 exactly: floor and ceil both at 2 -->
  <circle cx="220" cy="260" r="7" fill="none" stroke="#c06a16" stroke-width="2"/>
  <circle cx="220" cy="260" r="4.5" fill="#2a5db0"/>
  <text x="220" y="246" font-size="12" fill="#c33" text-anchor="middle">6/3 = 2</text>
  <text x="220" y="302" font-size="12" fill="#222" text-anchor="middle">⌊6/3⌋ = ⌈6/3⌉ = 2</text>
  <text x="610" y="264" font-size="13" fill="#c33">2 &lt; 2 ✗</text>

  <text x="360" y="328" font-size="12" font-style="italic" fill="#666" text-anchor="middle">So the claim is FALSE. The true statement is ⌊n/d⌋ ≤ ⌈n/d⌉, with equality exactly when d | n.</text>
</svg>
