<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="460" fill="white"/>

  <text x="360" y="26" font-size="13" font-style="italic" fill="#444" text-anchor="middle">A prime p earns a place in the sieve exactly when p² ≤ 400. Bars show p²; the line marks 400.</text>

  <!-- light vertical gridlines at 100,200,300,500 (400 is the bold threshold) -->
  <g stroke="#ececec" stroke-width="1">
    <line x1="220" y1="70" x2="220" y2="350"/>
    <line x1="310" y1="70" x2="310" y2="350"/>
    <line x1="400" y1="70" x2="400" y2="350"/>
    <line x1="580" y1="70" x2="580" y2="350"/>
  </g>

  <!-- bars (width = p² * 0.9, start x=130) -->
  <!-- green = used (p² <= 400), darker green = 19 (the answer), pink = 23 (not needed) -->
  <g stroke="#5a8a5a" stroke-width="0.8">
    <rect x="130" y="80"  width="3.6"   height="20" fill="#cdeccd"/><!-- 2  -->
    <rect x="130" y="111" width="8.1"   height="20" fill="#cdeccd"/><!-- 3  -->
    <rect x="130" y="142" width="22.5"  height="20" fill="#cdeccd"/><!-- 5  -->
    <rect x="130" y="173" width="44.1"  height="20" fill="#cdeccd"/><!-- 7  -->
    <rect x="130" y="204" width="108.9" height="20" fill="#cdeccd"/><!-- 11 -->
    <rect x="130" y="235" width="152.1" height="20" fill="#cdeccd"/><!-- 13 -->
    <rect x="130" y="266" width="260.1" height="20" fill="#cdeccd"/><!-- 17 -->
  </g>
  <rect x="130" y="297" width="324.9" height="20" fill="#7ec77e" stroke="#2e6e2e" stroke-width="1.4"/><!-- 19 -->
  <rect x="130" y="328" width="476.1" height="20" fill="#f6cccc" stroke="#b05050" stroke-width="1"/><!-- 23 -->

  <!-- threshold line at 400 -> x = 130 + 360 = 490 -->
  <line x1="490" y1="66" x2="490" y2="352" stroke="#c03030" stroke-width="1.6" stroke-dasharray="6,3"/>
  <text x="490" y="60" font-size="12" font-weight="bold" fill="#c03030" text-anchor="middle">n = 400</text>
  <text x="490" y="46" font-size="11" font-style="italic" fill="#c03030" text-anchor="middle">(√400 = 20)</text>

  <!-- prime labels (left, right-aligned) -->
  <g font-size="13" fill="#222" text-anchor="end">
    <text x="120" y="95">p = 2</text>
    <text x="120" y="126">p = 3</text>
    <text x="120" y="157">p = 5</text>
    <text x="120" y="188">p = 7</text>
    <text x="120" y="219">p = 11</text>
    <text x="120" y="250">p = 13</text>
    <text x="120" y="281">p = 17</text>
    <text x="120" y="312" font-weight="bold" fill="#2e6e2e">p = 19</text>
    <text x="120" y="343" font-weight="bold" fill="#b05050">p = 23</text>
  </g>

  <!-- p^2 value labels (right of each bar) -->
  <g font-size="12" fill="#2e6e2e" text-anchor="start">
    <text x="140" y="95">4</text>
    <text x="144" y="126">9</text>
    <text x="159" y="157">25</text>
    <text x="181" y="188">49</text>
    <text x="245" y="219">121</text>
    <text x="289" y="250">169</text>
    <text x="397" y="281">289</text>
    <text x="462" y="312" font-weight="bold">361</text>
  </g>
  <!-- annotations -->
  <text x="500" y="312" font-size="11.5" font-style="italic" fill="#2e6e2e">◄ largest prime to sieve with</text>
  <text x="368" y="343" font-size="12" fill="#9a3030" text-anchor="middle">23² = 529  &gt;  400  —  never needed</text>

  <!-- bottom axis ticks -->
  <line x1="130" y1="352" x2="650" y2="352" stroke="#999" stroke-width="0.8"/>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="220" y="366">100</text>
    <text x="310" y="366">200</text>
    <text x="400" y="366">300</text>
    <text x="490" y="366">400</text>
    <text x="580" y="366">500</text>
  </g>

  <!-- summary line -->
  <text x="360" y="404" font-size="13" fill="#222" text-anchor="middle">Primes to sieve with: 2, 3, 5, 7, 11, 13, 17, 19  —  eight primes, largest is <tspan font-weight="bold" fill="#2e6e2e">19</tspan>.</text>
  <text x="360" y="428" font-size="11.5" font-style="italic" fill="#666" text-anchor="middle">23 is skipped because its smallest multiple worth crossing, 23² = 529, already exceeds 400.</text>
</svg>
