<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="380" fill="white"/>

  <!-- ===== Panel A: ∀∃∀∃ ===== -->
  <text x="40" y="34" font-size="13" font-weight="bold" fill="#222">Sentence A — pattern  ∀ ∃ ∀ ∃</text>
  <text x="360" y="60" font-size="13" font-style="italic" fill="#333" text-anchor="middle">"For every city, there is an airport from which every traveler can catch some flight."</text>

  <!-- chips A: types ∀ ∃ ∀ ∃ at centers 110,290,470,640 -->
  <!-- chip 1: ∀ every city -->
  <rect x="35"  y="80" width="150" height="46" rx="6" fill="#dce8fb" stroke="#2a5db0" stroke-width="1.2"/>
  <text x="110" y="103" font-size="17" font-weight="bold" fill="#2a5db0" text-anchor="middle">∀</text>
  <text x="110" y="120" font-size="11" fill="#333" text-anchor="middle">every city</text>
  <!-- chip 2: ∃ an airport -->
  <rect x="215" y="80" width="150" height="46" rx="6" fill="#fdeeda" stroke="#c06a16" stroke-width="1.2"/>
  <text x="290" y="103" font-size="17" font-weight="bold" fill="#c06a16" text-anchor="middle">∃</text>
  <text x="290" y="120" font-size="11" fill="#333" text-anchor="middle">an airport</text>
  <!-- chip 3: ∀ every traveler -->
  <rect x="395" y="80" width="150" height="46" rx="6" fill="#dce8fb" stroke="#2a5db0" stroke-width="1.2"/>
  <text x="470" y="103" font-size="17" font-weight="bold" fill="#2a5db0" text-anchor="middle">∀</text>
  <text x="470" y="120" font-size="11" fill="#333" text-anchor="middle">every traveler</text>
  <!-- chip 4: ∃ some flight -->
  <rect x="565" y="80" width="150" height="46" rx="6" fill="#fdeeda" stroke="#c06a16" stroke-width="1.2"/>
  <text x="640" y="103" font-size="17" font-weight="bold" fill="#c06a16" text-anchor="middle">∃</text>
  <text x="640" y="120" font-size="11" fill="#333" text-anchor="middle">some flight</text>
  <!-- arrows A -->
  <g stroke="#bbb" stroke-width="1.2" fill="none">
    <line x1="185" y1="103" x2="215" y2="103"/>
    <line x1="365" y1="103" x2="395" y2="103"/>
    <line x1="545" y1="103" x2="565" y2="103"/>
  </g>

  <!-- divider -->
  <line x1="40" y1="180" x2="680" y2="180" stroke="#ddd" stroke-width="1"/>

  <!-- ===== Panel B: ∃∀∃∀ ===== -->
  <text x="40" y="214" font-size="13" font-weight="bold" fill="#222">Sentence B — pattern  ∃ ∀ ∃ ∀</text>
  <text x="360" y="240" font-size="13" font-style="italic" fill="#333" text-anchor="middle">"There is a website on which every student can find a tutorial that every beginner can follow."</text>

  <!-- chips B: types ∃ ∀ ∃ ∀ -->
  <rect x="35"  y="260" width="150" height="46" rx="6" fill="#fdeeda" stroke="#c06a16" stroke-width="1.2"/>
  <text x="110" y="283" font-size="17" font-weight="bold" fill="#c06a16" text-anchor="middle">∃</text>
  <text x="110" y="300" font-size="11" fill="#333" text-anchor="middle">a website</text>
  <rect x="215" y="260" width="150" height="46" rx="6" fill="#dce8fb" stroke="#2a5db0" stroke-width="1.2"/>
  <text x="290" y="283" font-size="17" font-weight="bold" fill="#2a5db0" text-anchor="middle">∀</text>
  <text x="290" y="300" font-size="11" fill="#333" text-anchor="middle">every student</text>
  <rect x="395" y="260" width="150" height="46" rx="6" fill="#fdeeda" stroke="#c06a16" stroke-width="1.2"/>
  <text x="470" y="283" font-size="17" font-weight="bold" fill="#c06a16" text-anchor="middle">∃</text>
  <text x="470" y="300" font-size="11" fill="#333" text-anchor="middle">a tutorial</text>
  <rect x="565" y="260" width="150" height="46" rx="6" fill="#dce8fb" stroke="#2a5db0" stroke-width="1.2"/>
  <text x="640" y="283" font-size="17" font-weight="bold" fill="#2a5db0" text-anchor="middle">∀</text>
  <text x="640" y="300" font-size="11" fill="#333" text-anchor="middle">every beginner</text>
  <g stroke="#bbb" stroke-width="1.2" fill="none">
    <line x1="185" y1="283" x2="215" y2="283"/>
    <line x1="365" y1="283" x2="395" y2="283"/>
    <line x1="545" y1="283" x2="565" y2="283"/>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#444">
    <rect x="220" y="346" width="14" height="14" fill="#dce8fb" stroke="#2a5db0" stroke-width="0.8"/>
    <text x="240" y="357" text-anchor="start">∀ universal</text>
    <rect x="360" y="346" width="14" height="14" fill="#fdeeda" stroke="#c06a16" stroke-width="0.8"/>
    <text x="380" y="357" text-anchor="start">∃ existential</text>
  </g>
</svg>
