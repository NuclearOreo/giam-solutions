<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="560" fill="white"/>

  <text x="350" y="22" font-size="12.5" font-style="italic" fill="#444" text-anchor="middle">Three branch points, each opened by a tautology of the form P ∨ ¬P. Every branch dead-ends at "nothing to worry about".</text>

  <!-- ===== branch 1 ===== -->
  <rect x="196" y="38" width="308" height="30" fill="#dfeadd" stroke="#bcd9bc"/>
  <text x="350" y="58" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">① Either you are sick or you are well.</text>
  <text x="520" y="58" font-size="11" font-style="italic" fill="#8a3b12">S ∨ ¬S</text>

  <line x1="350" y1="68" x2="350" y2="82" stroke="#555" stroke-width="1.4"/>
  <line x1="160" y1="82" x2="540" y2="82" stroke="#555" stroke-width="1.4"/>
  <line x1="160" y1="82" x2="160" y2="98" stroke="#555" stroke-width="1.4"/>
  <line x1="540" y1="82" x2="540" y2="98" stroke="#555" stroke-width="1.4"/>
  <text x="152" y="95" font-size="10.5" fill="#555" text-anchor="end">well</text>
  <text x="548" y="95" font-size="10.5" fill="#555" text-anchor="start">sick</text>

  <rect x="86" y="100" width="148" height="30" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="160" y="120" font-size="11.5" fill="#1a3a63" text-anchor="middle">nothing to worry about</text>

  <!-- ===== branch 2 ===== -->
  <rect x="386" y="100" width="308" height="30" fill="#dfeadd" stroke="#bcd9bc"/>
  <text x="540" y="120" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">② Either you get better or you die.</text>
  <text x="330" y="120" font-size="11" font-style="italic" fill="#8a3b12" text-anchor="end">B ∨ ¬B</text>

  <line x1="540" y1="130" x2="540" y2="146" stroke="#555" stroke-width="1.4"/>
  <line x1="300" y1="146" x2="600" y2="146" stroke="#555" stroke-width="1.4"/>
  <line x1="300" y1="146" x2="300" y2="162" stroke="#555" stroke-width="1.4"/>
  <line x1="600" y1="146" x2="600" y2="162" stroke="#555" stroke-width="1.4"/>
  <text x="292" y="159" font-size="10.5" fill="#555" text-anchor="end">get better</text>
  <text x="608" y="159" font-size="10.5" fill="#555" text-anchor="start">die</text>

  <rect x="226" y="164" width="148" height="30" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="300" y="184" font-size="11.5" fill="#1a3a63" text-anchor="middle">nothing to worry about</text>

  <!-- ===== branch 3 ===== -->
  <rect x="446" y="200" width="248" height="30" fill="#dfeadd" stroke="#bcd9bc"/>
  <text x="570" y="220" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">③ Either Heaven or Hell.</text>
  <text x="436" y="220" font-size="11" font-style="italic" fill="#8a3b12" text-anchor="end">H ∨ ¬H</text>
  <line x1="600" y1="162" x2="600" y2="200" stroke="#555" stroke-width="1.4"/>

  <line x1="570" y1="230" x2="570" y2="246" stroke="#555" stroke-width="1.4"/>
  <line x1="470" y1="246" x2="646" y2="246" stroke="#555" stroke-width="1.4"/>
  <line x1="470" y1="246" x2="470" y2="262" stroke="#555" stroke-width="1.4"/>
  <line x1="646" y1="246" x2="646" y2="262" stroke="#555" stroke-width="1.4"/>
  <text x="462" y="259" font-size="10.5" fill="#555" text-anchor="end">Heaven</text>
  <text x="654" y="259" font-size="10.5" fill="#555" text-anchor="start">Hell</text>

  <rect x="396" y="264" width="148" height="30" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="470" y="284" font-size="11.5" fill="#1a3a63" text-anchor="middle">nothing to worry about</text>

  <rect x="560" y="264" width="132" height="44" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="626" y="282" font-size="11.5" fill="#1a3a63" text-anchor="middle">too busy shaking</text>
  <text x="626" y="298" font-size="11.5" fill="#1a3a63" text-anchor="middle">hands to worry</text>

  <!-- conclusion -->
  <rect x="150" y="326" width="400" height="34" fill="#fdf2ee" stroke="#ecccbf"/>
  <text x="350" y="348" font-size="13" font-weight="bold" fill="#8a3b12" text-anchor="middle">Every leaf says the same thing  ⟹  never any reason to worry.</text>

  <!-- the rule -->
  <rect x="24" y="376" width="326" height="118" fill="#f7f9fc" stroke="#c3d3ea"/>
  <text x="187" y="396" font-size="12" font-weight="bold" fill="#1a3a63" text-anchor="middle">The rule applied three times</text>
  <text x="187" y="422" font-size="12.5" fill="#222" text-anchor="middle">P ∨ Q</text>
  <text x="187" y="440" font-size="12.5" fill="#222" text-anchor="middle">P ⟹ R</text>
  <text x="187" y="458" font-size="12.5" fill="#222" text-anchor="middle">Q ⟹ R</text>
  <line x1="120" y1="466" x2="254" y2="466" stroke="#333" stroke-width="1.1"/>
  <text x="187" y="484" font-size="12.5" fill="#1b5e20" text-anchor="middle" font-weight="bold">∴ R</text>

  <rect x="366" y="376" width="310" height="118" fill="#fbe4da" stroke="#e0b8a6"/>
  <text x="521" y="396" font-size="12" font-weight="bold" fill="#8a3b12" text-anchor="middle">Why they count as tautologies</text>
  <text x="380" y="418" font-size="11" fill="#222">Each pair is <tspan font-style="italic">stipulated</tspan> to be exhaustive, so the</text>
  <text x="380" y="434" font-size="11" fill="#222">disjunction is an instance of the excluded middle,</text>
  <text x="380" y="450" font-size="11" fill="#222">P ∨ ¬P — true with no evidence required.</text>
  <text x="380" y="472" font-size="10.5" font-style="italic" fill="#8a3b12">That stipulation is where the joke hides: "get better</text>
  <text x="380" y="486" font-size="10.5" font-style="italic" fill="#8a3b12">or die" quietly rules out staying ill.</text>

  <!-- summary of the three -->
  <rect x="24" y="506" width="652" height="44" fill="#dfeadd" stroke="#bcd9bc"/>
  <text x="350" y="524" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">The three tautologies: sick ∨ well  ·  get better ∨ die  ·  Heaven ∨ Hell</text>
  <text x="350" y="542" font-size="11" fill="#222" text-anchor="middle">each an instance of P ∨ ¬P, each opening one round of constructive dilemma</text>
</svg>
