<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="470" fill="white"/>

  <text x="350" y="28" font-size="13" font-style="italic" fill="#444" text-anchor="middle">Both formulas over all 8 rows. The two final columns disagree in the shaded rows — so they are not equivalent.</text>

  <!-- column headers -->
  <g font-size="13.5" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="70"  y="70">A</text>
    <text x="120" y="70">B</text>
    <text x="170" y="70">C</text>
    <text x="250" y="70">A∧B</text>
    <text x="360" y="70" fill="#2a5db0">(A∧B)∨C</text>
    <text x="470" y="70">B∨C</text>
    <text x="580" y="70" fill="#8a3b12">A∧(B∨C)</text>
  </g>
  <line x1="40" y1="80" x2="660" y2="80" stroke="#999" stroke-width="0.9"/>
  <!-- divider before the two result columns -->
  <line x1="305" y1="52" x2="305" y2="430" stroke="#e0e0e0"/>
  <line x1="525" y1="52" x2="525" y2="430" stroke="#e0e0e0"/>

  <!-- rows: 8 rows, y start 104 step 40 -->
  <!-- data: A B C | AB | (AB)vC | BvC | A(BvC) -->
  <!-- 000:0,0,0,0  001:0,0,1|0|1|1|0 D  010:0,1,0|0|0|1|0  011:0,1,1|0|1|1|0 D  100:1,0,0|0|0|0|0  101:1,0,1|0|1|1|1  110:1,1,0|1|1|1|1  111:1,1,1|1|1|1|1 -->
  <g font-size="14" text-anchor="middle">
    <!-- row1 000 -->
    <text x="70" y="110">0</text><text x="120" y="110">0</text><text x="170" y="110">0</text><text x="250" y="110">0</text><text x="360" y="110" fill="#2a5db0">0</text><text x="470" y="110">0</text><text x="580" y="110" fill="#8a3b12">0</text>
    <!-- row2 001 DIFFER -->
    <rect x="40" y="122" width="620" height="32" fill="#fbe4da"/>
    <text x="70" y="144">0</text><text x="120" y="144">0</text><text x="170" y="144">1</text><text x="250" y="144">0</text><text x="360" y="144" fill="#2a5db0" font-weight="bold">1</text><text x="470" y="144">1</text><text x="580" y="144" fill="#8a3b12" font-weight="bold">0</text>
    <!-- row3 010 -->
    <text x="70" y="178">0</text><text x="120" y="178">1</text><text x="170" y="178">0</text><text x="250" y="178">0</text><text x="360" y="178" fill="#2a5db0">0</text><text x="470" y="178">1</text><text x="580" y="178" fill="#8a3b12">0</text>
    <!-- row4 011 DIFFER -->
    <rect x="40" y="190" width="620" height="32" fill="#fbe4da"/>
    <text x="70" y="212">0</text><text x="120" y="212">1</text><text x="170" y="212">1</text><text x="250" y="212">0</text><text x="360" y="212" fill="#2a5db0" font-weight="bold">1</text><text x="470" y="212">1</text><text x="580" y="212" fill="#8a3b12" font-weight="bold">0</text>
    <!-- row5 100 -->
    <text x="70" y="246">1</text><text x="120" y="246">0</text><text x="170" y="246">0</text><text x="250" y="246">0</text><text x="360" y="246" fill="#2a5db0">0</text><text x="470" y="246">0</text><text x="580" y="246" fill="#8a3b12">0</text>
    <!-- row6 101 -->
    <text x="70" y="280">1</text><text x="120" y="280">0</text><text x="170" y="280">1</text><text x="250" y="280">0</text><text x="360" y="280" fill="#2a5db0">1</text><text x="470" y="280">1</text><text x="580" y="280" fill="#8a3b12">1</text>
    <!-- row7 110 -->
    <text x="70" y="314">1</text><text x="120" y="314">1</text><text x="170" y="314">0</text><text x="250" y="314">1</text><text x="360" y="314" fill="#2a5db0">1</text><text x="470" y="314">1</text><text x="580" y="314" fill="#8a3b12">1</text>
    <!-- row8 111 -->
    <text x="70" y="348">1</text><text x="120" y="348">1</text><text x="170" y="348">1</text><text x="250" y="348">1</text><text x="360" y="348" fill="#2a5db0">1</text><text x="470" y="348">1</text><text x="580" y="348" fill="#8a3b12">1</text>
  </g>
  <line x1="40" y1="360" x2="660" y2="360" stroke="#999" stroke-width="0.9"/>

  <text x="350" y="388" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">Rows 2 and 4 differ: when A = 0 and C = 1, the left side is 1 (from C) but the right side is 0 (needs A).</text>
  <text x="350" y="412" font-size="13" fill="#222" text-anchor="middle">Same output in 6 of 8 rows, but different in 2  ⟹  <tspan font-weight="bold">NOT logically equivalent.</tspan></text>
  <text x="350" y="446" font-size="12" font-style="italic" fill="#666" text-anchor="middle">The parentheses genuinely matter: "and" and "or" do not regroup freely across each other.</text>
</svg>
