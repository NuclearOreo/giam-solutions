<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="470" fill="white"/>

  <text x="350" y="28" font-size="13.5" font-style="italic" fill="#444" text-anchor="middle">Try each truth value in turn. Both assumptions collapse into their opposite — an endless flip.</text>

  <!-- the sentence -->
  <rect x="200" y="44" width="300" height="40" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="350" y="70" font-size="14.5" fill="#1a3a63" text-anchor="middle" font-style="italic">L:  "This sentence is false."</text>

  <!-- two boxes: assume TRUE (left), assume FALSE (right) -->
  <rect x="70" y="130" width="230" height="46" fill="#f4f8f4" stroke="#cde0cd"/>
  <text x="185" y="150" font-size="13" fill="#1b5e20" text-anchor="middle" font-weight="bold">Assume L is TRUE</text>
  <text x="185" y="168" font-size="12" fill="#333" text-anchor="middle">then what it says holds…</text>

  <rect x="400" y="130" width="230" height="46" fill="#fdf2ee" stroke="#ecccbf"/>
  <text x="515" y="150" font-size="13" fill="#8a3b12" text-anchor="middle" font-weight="bold">Assume L is FALSE</text>
  <text x="515" y="168" font-size="12" fill="#333" text-anchor="middle">then what it says fails…</text>

  <!-- consequence boxes -->
  <rect x="70" y="236" width="230" height="60" fill="#fff" stroke="#bbb"/>
  <text x="185" y="260" font-size="12.5" fill="#333" text-anchor="middle">L says "L is false,"</text>
  <text x="185" y="278" font-size="12.5" fill="#333" text-anchor="middle">and L is true, so</text>
  <text x="185" y="296" font-size="13" fill="#8a3b12" text-anchor="middle" font-weight="bold">L must be FALSE.</text>

  <rect x="400" y="236" width="230" height="60" fill="#fff" stroke="#bbb"/>
  <text x="515" y="260" font-size="12.5" fill="#333" text-anchor="middle">"L is false" is itself false,</text>
  <text x="515" y="278" font-size="12.5" fill="#333" text-anchor="middle">so L is not false, i.e.</text>
  <text x="515" y="296" font-size="13" fill="#1b5e20" text-anchor="middle" font-weight="bold">L must be TRUE.</text>

  <!-- arrows down -->
  <g stroke="#888" stroke-width="1.6" marker-end="url(#a3)">
    <line x1="185" y1="176" x2="185" y2="234"/>
    <line x1="515" y1="176" x2="515" y2="234"/>
  </g>

  <!-- crossing arrows: TRUE->FALSE and FALSE->TRUE (the loop) -->
  <g stroke="#c0392b" stroke-width="1.8" fill="none" marker-end="url(#a3r)">
    <path d="M300,266 C350,266 350,153 398,153"/>  <!-- true-branch conclusion FALSE feeds back to assume-false -->
    <path d="M400,266 C350,266 350,153 302,153"/>  <!-- false-branch conclusion TRUE feeds back to assume-true -->
  </g>

  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
    <marker id="a3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>

  <text x="350" y="210" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">each conclusion forces the other assumption →</text>

  <!-- verdict -->
  <rect x="120" y="336" width="460" height="48" fill="#fbeeee" stroke="#e0b8b8"/>
  <text x="350" y="357" font-size="14" fill="#7a1f1f" text-anchor="middle" font-weight="bold">TRUE ⟹ FALSE ⟹ TRUE ⟹ … — no consistent value exists.</text>
  <text x="350" y="376" font-size="12.5" fill="#7a1f1f" text-anchor="middle">L is neither true nor false, so L is NOT a statement.</text>

  <!-- contrast with problem 2 -->
  <rect x="70" y="400" width="560" height="58" fill="#f7f7f7" stroke="#ddd"/>
  <text x="90" y="422" font-size="12" fill="#222"><tspan font-weight="bold">Compare Problem 2:</tspan>  "This sentence does not refer to itself" was a STATEMENT (false),</text>
  <text x="90" y="440" font-size="12" fill="#333">because its self-claim was about grammar, not truth — so no loop formed.</text>
  <text x="90" y="454" font-size="12" fill="#7a1f1f">The liar's claim IS about its own truth value, and that is what creates the vicious circle.</text>
</svg>
