<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="470" fill="white"/>

  <text x="350" y="24" font-size="13" font-style="italic" fill="#444" text-anchor="middle">The toolkit. Every justification in the eight proofs below cites one of these. ( t = tautology,  c = contradiction )</text>

  <!-- LEFT COLUMN -->
  <rect x="20" y="38" width="325" height="196" fill="#f7f9fc" stroke="#c3d3ea"/>
  <text x="182" y="58" font-size="12.5" font-weight="bold" fill="#1a3a63" text-anchor="middle">Rearranging</text>
  <g font-size="11.5" fill="#222">
    <text x="34" y="82"><tspan font-weight="bold">commutative</tspan>   A ∧ B ≅ B ∧ A     A ∨ B ≅ B ∨ A</text>
    <text x="34" y="106"><tspan font-weight="bold">associative</tspan>   (A∧B)∧C ≅ A∧(B∧C)</text>
    <text x="34" y="124">   (A∨B)∨C ≅ A∨(B∨C)</text>
    <text x="34" y="148"><tspan font-weight="bold">distributive</tspan>   A∧(B∨C) ≅ (A∧B)∨(A∧C)</text>
    <text x="34" y="166">   A∨(B∧C) ≅ (A∨B)∧(A∨C)</text>
    <text x="34" y="190"><tspan font-weight="bold">idempotent</tspan>   A ∧ A ≅ A      A ∨ A ≅ A</text>
    <text x="34" y="214"><tspan font-weight="bold">double negation</tspan>   ¬¬A ≅ A</text>
  </g>

  <rect x="20" y="244" width="325" height="126" fill="#eef5ee" stroke="#cde0cd"/>
  <text x="182" y="264" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">Collapsing</text>
  <g font-size="11.5" fill="#222">
    <text x="34" y="288"><tspan font-weight="bold">absorption</tspan>   A ∨ (A ∧ B) ≅ A</text>
    <text x="34" y="306">   A ∧ (A ∨ B) ≅ A</text>
    <text x="34" y="330"><tspan font-weight="bold">complement</tspan>   A ∨ ¬A ≅ t      A ∧ ¬A ≅ c</text>
    <text x="34" y="354"><tspan font-weight="bold">identity</tspan>   A ∧ t ≅ A      A ∨ c ≅ A</text>
  </g>

  <!-- RIGHT COLUMN -->
  <rect x="355" y="38" width="325" height="110" fill="#fdf2ee" stroke="#ecccbf"/>
  <text x="517" y="58" font-size="12.5" font-weight="bold" fill="#8a3b12" text-anchor="middle">Moving negations</text>
  <g font-size="11.5" fill="#222">
    <text x="369" y="82"><tspan font-weight="bold">De Morgan</tspan>   ¬(A ∧ B) ≅ ¬A ∨ ¬B</text>
    <text x="369" y="100">   ¬(A ∨ B) ≅ ¬A ∧ ¬B</text>
    <text x="369" y="124"><tspan font-weight="bold">domination</tspan>   A ∨ t ≅ t      A ∧ c ≅ c</text>
  </g>

  <!-- results summary -->
  <rect x="355" y="158" width="325" height="212" fill="#f7f7f7" stroke="#ddd"/>
  <text x="517" y="178" font-size="12.5" font-weight="bold" fill="#222" text-anchor="middle">What each of the eight collapses to</text>
  <g font-size="11.5" fill="#222">
    <text x="372" y="202">1.  both sides  ≅  A</text>
    <text x="372" y="224">2.  ≅  A</text>
    <text x="372" y="246">3.  both sides  ≅  A ∨ B</text>
    <text x="372" y="268">4.  ≅  ¬A</text>
    <text x="372" y="290">5.  ≅  A</text>
    <text x="372" y="312">6.  ≅  c    <tspan font-style="italic" fill="#8a3b12">(a contradiction)</tspan></text>
    <text x="372" y="334">7.  ≅  A</text>
    <text x="372" y="356">8.  both sides  ≅  ¬A ∨ (¬B ∧ ¬C)</text>
  </g>

  <!-- bottom note -->
  <rect x="20" y="384" width="660" height="70" fill="#eef5ee" stroke="#bcd9bc"/>
  <text x="350" y="406" font-size="12" fill="#1b5e20" text-anchor="middle" font-weight="bold">Strategy: start from the messier side and simplify until you reach the other.</text>
  <text x="350" y="426" font-size="11.5" fill="#222" text-anchor="middle">Every line must be justified by exactly one named law applied to the line above it.</text>
  <text x="350" y="444" font-size="11" font-style="italic" fill="#666" text-anchor="middle">If both sides are messy, reduce each separately to a common normal form.</text>
</svg>
