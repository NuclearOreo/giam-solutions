<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="560" fill="white"/>

  <text x="350" y="22" font-size="12.5" font-style="italic" fill="#444" text-anchor="middle">Five short rules. Three of them merely rearrange what you already have; two combine or discard a piece.</text>

  <!-- (a) -->
  <rect x="24" y="38" width="652" height="52" fill="#f7f9fc" stroke="#c3d3ea"/>
  <text x="44" y="68" font-size="12" font-weight="bold" fill="#1a3a63">(a)</text>
  <g font-size="12" text-anchor="middle" fill="#222">
    <text x="300" y="58">T</text>
  </g>
  <line x1="255" y1="64" x2="345" y2="64" stroke="#333" stroke-width="1"/>
  <text x="300" y="80" font-size="12" text-anchor="middle" fill="#1b5e20" font-weight="bold">∴ T ∨ U</text>
  <text x="664" y="68" font-size="12" fill="#1b5e20" text-anchor="end" font-weight="bold">disjunctive addition</text>

  <!-- (b) -->
  <rect x="24" y="96" width="652" height="66" fill="#f7f9fc" stroke="#c3d3ea"/>
  <text x="44" y="132" font-size="12" font-weight="bold" fill="#1a3a63">(b)</text>
  <g font-size="12" text-anchor="middle" fill="#222">
    <text x="300" y="116">G</text>
    <text x="300" y="132">B</text>
  </g>
  <line x1="255" y1="138" x2="345" y2="138" stroke="#333" stroke-width="1"/>
  <text x="300" y="154" font-size="12" text-anchor="middle" fill="#1b5e20" font-weight="bold">∴ G ∧ B</text>
  <text x="664" y="132" font-size="12" fill="#1b5e20" text-anchor="end" font-weight="bold">conjunctive addition</text>

  <!-- (c) -->
  <rect x="24" y="168" width="652" height="86" fill="#f7f9fc" stroke="#c3d3ea"/>
  <text x="44" y="214" font-size="12" font-weight="bold" fill="#1a3a63">(c)</text>
  <g font-size="12" text-anchor="middle" fill="#222">
    <text x="300" y="188">O₃ ∨ O₄</text>
    <text x="300" y="205">O₃ ⟹ I</text>
    <text x="300" y="222">O₄ ⟹ I</text>
  </g>
  <line x1="248" y1="228" x2="352" y2="228" stroke="#333" stroke-width="1"/>
  <text x="300" y="245" font-size="12" text-anchor="middle" fill="#1b5e20" font-weight="bold">∴ I</text>
  <text x="664" y="214" font-size="12" fill="#1b5e20" text-anchor="end" font-weight="bold">constructive dilemma</text>

  <!-- (d) -->
  <rect x="24" y="260" width="652" height="52" fill="#f7f9fc" stroke="#c3d3ea"/>
  <text x="44" y="290" font-size="12" font-weight="bold" fill="#1a3a63">(d)</text>
  <g font-size="12" text-anchor="middle" fill="#222">
    <text x="300" y="280">G ∧ L</text>
  </g>
  <line x1="255" y1="286" x2="345" y2="286" stroke="#333" stroke-width="1"/>
  <text x="300" y="302" font-size="12" text-anchor="middle" fill="#1b5e20" font-weight="bold">∴ L</text>
  <text x="664" y="290" font-size="12" fill="#1b5e20" text-anchor="end" font-weight="bold">conjunctive simplification</text>

  <!-- (e) -->
  <rect x="24" y="318" width="652" height="70" fill="#dfeadd" stroke="#8ab88a" stroke-width="1.5"/>
  <text x="44" y="356" font-size="12" font-weight="bold" fill="#1a3a63">(e)</text>
  <g font-size="12" text-anchor="middle" fill="#222">
    <text x="300" y="340">D ⟹ P</text>
    <text x="300" y="357">D ⟹ Q</text>
  </g>
  <line x1="240" y1="363" x2="360" y2="363" stroke="#333" stroke-width="1"/>
  <text x="300" y="380" font-size="12" text-anchor="middle" fill="#1b5e20" font-weight="bold">∴ D ⟹ (P ∧ Q)</text>
  <text x="664" y="350" font-size="12" fill="#1b5e20" text-anchor="end" font-weight="bold">composition</text>
  <text x="664" y="366" font-size="10" fill="#555" text-anchor="end" font-style="italic">conjunctive addition under a shared hypothesis</text>

  <!-- build / break duality -->
  <rect x="24" y="400" width="652" height="94" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="350" y="420" font-size="12" font-weight="bold" fill="#1a3a63" text-anchor="middle">The additions build up; the simplifications tear down</text>
  <g font-size="11.5" fill="#222">
    <text x="60" y="444">conjunctive <tspan font-weight="bold">addition</tspan>:  P, Q  ⊢  P ∧ Q</text>
    <text x="390" y="444">conjunctive <tspan font-weight="bold">simplification</tspan>:  P ∧ Q  ⊢  P</text>
    <text x="60" y="466">disjunctive <tspan font-weight="bold">addition</tspan>:  P  ⊢  P ∨ Q</text>
    <text x="390" y="466">disjunctive <tspan font-weight="bold">syllogism</tspan>:  P ∨ Q, ¬P  ⊢  Q</text>
  </g>
  <text x="350" y="486" font-size="10.5" font-style="italic" fill="#666" text-anchor="middle">Each connective has a rule that introduces it and a rule that gets rid of it.</text>

  <!-- note on (e) -->
  <rect x="24" y="502" width="652" height="46" fill="#fdf2ee" stroke="#ecccbf"/>
  <text x="350" y="521" font-size="11.5" fill="#8a3b12" text-anchor="middle" font-weight="bold">(e) is the only one that is an equivalence — the converse D ⟹ (P ∧ Q) ⊢ D ⟹ P, D ⟹ Q is valid too.</text>
  <text x="350" y="539" font-size="10.5" font-style="italic" fill="#666" text-anchor="middle">So "if D then both" and "if D then P, and if D then Q" say exactly the same thing.</text>
</svg>
