<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="500" fill="white"/>

  <text x="350" y="22" font-size="12.5" font-style="italic" fill="#444" text-anchor="middle">The claim is an ∃-statement, so one witness settles it. In fact there are exactly two, and no more.</text>

  <!-- the two witnesses -->
  <text x="350" y="48" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">The witnesses</text>

  <rect x="60" y="58" width="270" height="92" fill="#dfeadd" stroke="#bcd9bc"/>
  <text x="195" y="80" font-size="14" font-weight="bold" fill="#1b5e20" text-anchor="middle">p = 2</text>
  <text x="195" y="102" font-size="12" fill="#222" text-anchor="middle">2 is prime  ✓</text>
  <text x="195" y="120" font-size="12" fill="#222" text-anchor="middle">2·2 + 1 = 5 is prime  ✓</text>
  <text x="195" y="140" font-size="12.5" font-weight="bold" fill="#8a3b12" text-anchor="middle">2 mod 6 = 2,  not 5</text>

  <rect x="370" y="58" width="270" height="92" fill="#dfeadd" stroke="#bcd9bc"/>
  <text x="505" y="80" font-size="14" font-weight="bold" fill="#1b5e20" text-anchor="middle">p = 3</text>
  <text x="505" y="102" font-size="12" fill="#222" text-anchor="middle">3 is prime  ✓</text>
  <text x="505" y="120" font-size="12" fill="#222" text-anchor="middle">2·3 + 1 = 7 is prime  ✓</text>
  <text x="505" y="140" font-size="12.5" font-weight="bold" fill="#8a3b12" text-anchor="middle">3 mod 6 = 3,  not 5</text>

  <!-- the case analysis -->
  <text x="350" y="184" font-size="12.5" font-weight="bold" fill="#1a3a63" text-anchor="middle">And these are the only two: for a Sophie Germain prime p &gt; 3, every other residue is impossible</text>

  <g font-size="12" font-weight="bold" fill="#222">
    <text x="90"  y="212">p mod 6</text>
    <text x="240" y="212">what goes wrong</text>
  </g>
  <line x1="60" y1="220" x2="640" y2="220" stroke="#999" stroke-width="0.9"/>

  <g font-size="12">
    <text x="112" y="244" text-anchor="middle">0</text>
    <text x="240" y="244" fill="#8a3b12">6 divides p, so p is not prime</text>

    <text x="112" y="270" text-anchor="middle">1</text>
    <text x="240" y="270" fill="#8a3b12">2p+1 ≡ 3 (mod 6), so 3 divides 2p+1 — and 2p+1 &gt; 3, hence composite</text>

    <text x="112" y="296" text-anchor="middle">2</text>
    <text x="240" y="296" fill="#8a3b12">p is even, so p is not prime (p &gt; 2)</text>

    <text x="112" y="322" text-anchor="middle">3</text>
    <text x="240" y="322" fill="#8a3b12">3 divides p, so p is not prime (p &gt; 3)</text>

    <text x="112" y="348" text-anchor="middle">4</text>
    <text x="240" y="348" fill="#8a3b12">p is even, so p is not prime</text>

    <rect x="60" y="358" width="580" height="28" fill="#dfeadd"/>
    <text x="112" y="377" text-anchor="middle" font-weight="bold">5</text>
    <text x="240" y="377" fill="#1b5e20" font-weight="bold">nothing goes wrong — the only surviving case</text>
  </g>
  <line x1="60" y1="392" x2="640" y2="392" stroke="#999" stroke-width="0.9"/>

  <text x="350" y="416" font-size="11.5" font-style="italic" fill="#666" text-anchor="middle">Residues 0, 2, 3, 4 fail because p would be composite; residue 1 fails because 2p+1 would be.</text>

  <!-- conclusion -->
  <rect x="60" y="432" width="580" height="56" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="350" y="454" font-size="12.5" fill="#1a3a63" text-anchor="middle" font-weight="bold">So every Sophie Germain prime except 2 and 3 is congruent to 5 (mod 6).</text>
  <text x="350" y="476" font-size="11.5" fill="#222" text-anchor="middle">Searching to 20000 turns up 326 of them, and only 2 and 3 sit outside the class — matching the proof exactly.</text>
</svg>
