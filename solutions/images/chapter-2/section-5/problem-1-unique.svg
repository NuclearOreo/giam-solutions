<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="500" fill="white"/>

  <text x="350" y="24" font-size="13" font-style="italic" fill="#444" text-anchor="middle">"Exactly one" is two claims at once. Negating splits them apart with De Morgan.</text>

  <!-- unpacking -->
  <rect x="20" y="38" width="660" height="74" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="350" y="60" font-size="13" font-weight="bold" fill="#1a3a63" text-anchor="middle">∃! x, P(x)   means   EXISTENCE  ∧  UNIQUENESS</text>
  <text x="200" y="84" font-size="11.5" fill="#222" text-anchor="middle">at least one witness</text>
  <text x="500" y="84" font-size="11.5" fill="#222" text-anchor="middle">no two distinct witnesses</text>
  <text x="200" y="102" font-size="11" font-style="italic" fill="#666" text-anchor="middle">∃x P(x)</text>
  <text x="500" y="102" font-size="11" font-style="italic" fill="#666" text-anchor="middle">∀y∀z ( P(y) ∧ P(z) ⟹ y = z )</text>

  <!-- the trichotomy: number line of witness counts -->
  <text x="350" y="142" font-size="12.5" font-weight="bold" fill="#222" text-anchor="middle">Count the witnesses. ∃! is true in exactly one column — its negation owns the other two.</text>

  <!-- three boxes -->
  <rect x="40" y="158" width="190" height="126" fill="#fbe4da" stroke="#e0b8a6"/>
  <text x="135" y="180" font-size="13" font-weight="bold" fill="#8a3b12" text-anchor="middle">0 witnesses</text>
  <g><circle cx="95" cy="212" r="11" fill="white" stroke="#bbb"/><circle cx="135" cy="212" r="11" fill="white" stroke="#bbb"/><circle cx="175" cy="212" r="11" fill="white" stroke="#bbb"/></g>
  <text x="135" y="244" font-size="11" font-style="italic" fill="#666" text-anchor="middle">nothing satisfies P</text>
  <text x="135" y="266" font-size="12" font-weight="bold" fill="#8a3b12" text-anchor="middle">∃! is FALSE</text>

  <rect x="255" y="158" width="190" height="126" fill="#dfeadd" stroke="#bcd9bc"/>
  <text x="350" y="180" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">exactly 1 witness</text>
  <g><circle cx="310" cy="212" r="11" fill="white" stroke="#bbb"/><circle cx="350" cy="212" r="11" fill="#1b5e20"/><circle cx="390" cy="212" r="11" fill="white" stroke="#bbb"/></g>
  <text x="350" y="244" font-size="11" font-style="italic" fill="#666" text-anchor="middle">precisely one satisfies P</text>
  <text x="350" y="266" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">∃! is TRUE</text>

  <rect x="470" y="158" width="190" height="126" fill="#fbe4da" stroke="#e0b8a6"/>
  <text x="565" y="180" font-size="13" font-weight="bold" fill="#8a3b12" text-anchor="middle">2 or more</text>
  <g><circle cx="525" cy="212" r="11" fill="#8a3b12"/><circle cx="565" cy="212" r="11" fill="white" stroke="#bbb"/><circle cx="605" cy="212" r="11" fill="#8a3b12"/></g>
  <text x="565" y="244" font-size="11" font-style="italic" fill="#666" text-anchor="middle">two or more satisfy P</text>
  <text x="565" y="266" font-size="12" font-weight="bold" fill="#8a3b12" text-anchor="middle">∃! is FALSE</text>

  <!-- brace under the two outer -->
  <text x="350" y="304" font-size="12" fill="#8a3b12" text-anchor="middle">the negation is true in the two shaded columns: <tspan font-weight="bold">none, or more than one</tspan></text>

  <!-- the two answer forms -->
  <rect x="20" y="322" width="660" height="72" fill="#eef5ee" stroke="#bcd9bc"/>
  <text x="36" y="344" font-size="12" font-weight="bold" fill="#1b5e20">Form A — split the two failure modes:</text>
  <text x="350" y="368" font-size="13.5" fill="#1b5e20" text-anchor="middle">¬∃! x, P(x)   ≅   ( ∀x ¬P(x) )   ∨   ( ∃y ∃z,  P(y) ∧ P(z) ∧ y ≠ z )</text>
  <text x="350" y="386" font-size="11" font-style="italic" fill="#666" text-anchor="middle">"either nothing works, or at least two different things do"</text>

  <rect x="20" y="404" width="660" height="72" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="36" y="426" font-size="12" font-weight="bold" fill="#1a3a63">Form B — no witness is ever alone:</text>
  <text x="350" y="450" font-size="13.5" fill="#1a3a63" text-anchor="middle">¬∃! x, P(x)   ≅   ∀x [ P(x) ⟹ ∃y ( P(y) ∧ y ≠ x ) ]</text>
  <text x="350" y="468" font-size="11" font-style="italic" fill="#666" text-anchor="middle">"every witness has a companion" — vacuously true when there are none</text>
</svg>
