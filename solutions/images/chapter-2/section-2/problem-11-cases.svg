<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="470" fill="white"/>

  <text x="350" y="26" font-size="13" font-style="italic" fill="#444" text-anchor="middle">A knight's statement must be TRUE; a knave's must be FALSE. Test all four assignments; only one survives.</text>

  <!-- setup -->
  <rect x="40" y="44" width="620" height="52" fill="#f7f7f7" stroke="#ddd"/>
  <text x="60" y="66" font-size="12.5" fill="#222">Locke claims:  ¬D   ("Demosthenes is a knave")   — consistent iff  L = value of ¬D</text>
  <text x="60" y="86" font-size="12.5" fill="#222">Demosthenes claims:  L ∧ D   ("Locke and I are knights")   — consistent iff  D = value of L ∧ D</text>

  <!-- table header -->
  <g font-size="12.5" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="95"  y="126">Locke</text>
    <text x="205" y="126">Demosthenes</text>
    <text x="330" y="126">¬D</text>
    <text x="405" y="126">Locke ok?</text>
    <text x="505" y="126">L ∧ D</text>
    <text x="610" y="126">Dem. ok?</text>
  </g>
  <line x1="40" y1="136" x2="660" y2="136" stroke="#999" stroke-width="0.9"/>

  <g font-size="12.5" text-anchor="middle">
    <!-- row 1: knight knight -->
    <text x="95" y="166">knight</text><text x="205" y="166">knight</text>
    <text x="330" y="166">F</text><text x="405" y="166" fill="#c0392b" font-weight="bold">✗ must be T</text>
    <text x="505" y="166">T</text><text x="610" y="166" fill="#1b5e20">✓</text>
    <line x1="40" y1="180" x2="660" y2="180" stroke="#eee"/>

    <!-- row 2: knight knave  SOLUTION -->
    <rect x="40" y="182" width="620" height="36" fill="#eef5ee"/>
    <text x="95" y="206" font-weight="bold">knight</text><text x="205" y="206" font-weight="bold">knave</text>
    <text x="330" y="206">T</text><text x="405" y="206" fill="#1b5e20" font-weight="bold">✓</text>
    <text x="505" y="206">F</text><text x="610" y="206" fill="#1b5e20" font-weight="bold">✓</text>
    <line x1="40" y1="220" x2="660" y2="220" stroke="#eee"/>

    <!-- row 3: knave knight -->
    <text x="95" y="248">knave</text><text x="205" y="248">knight</text>
    <text x="330" y="248">F</text><text x="405" y="248" fill="#1b5e20">✓</text>
    <text x="505" y="248">F</text><text x="610" y="248" fill="#c0392b" font-weight="bold">✗ must be T</text>
    <line x1="40" y1="262" x2="660" y2="262" stroke="#eee"/>

    <!-- row 4: knave knave -->
    <text x="95" y="290">knave</text><text x="205" y="290">knave</text>
    <text x="330" y="290">T</text><text x="405" y="290" fill="#c0392b" font-weight="bold">✗ must be F</text>
    <text x="505" y="290">F</text><text x="610" y="290" fill="#1b5e20">✓</text>
  </g>
  <line x1="40" y1="304" x2="660" y2="304" stroke="#999" stroke-width="0.9"/>

  <text x="350" y="330" font-size="12" font-style="italic" fill="#666" text-anchor="middle">Only the shaded row makes BOTH speakers consistent with their type.</text>

  <!-- answer box -->
  <rect x="140" y="346" width="420" height="46" fill="#eef5ee" stroke="#bcd9bc"/>
  <text x="350" y="375" font-size="16" fill="#1b5e20" text-anchor="middle" font-weight="bold">Locke is a KNIGHT,  Demosthenes is a KNAVE.</text>

  <!-- short direct argument -->
  <rect x="40" y="406" width="620" height="56" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="60" y="426" font-size="12" fill="#1a3a63"><tspan font-weight="bold">Shortcut:</tspan> if Demosthenes were a knight, his claim "both knights" would be true, making Locke a knight —</text>
  <text x="60" y="444" font-size="12" fill="#1a3a63">but then Locke's "Demosthenes is a knave" would be false. Contradiction, so Demosthenes is a knave.</text>
  <text x="60" y="458" font-size="12" fill="#1a3a63">That makes Locke's claim true, so Locke is a knight.</text>
</svg>
