<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 655" width="720" height="655" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="655" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">A DIVISIBILITY STATEMENT ABOUT POWERS</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">4&#7503;&#8314;&#185; &#8722; 1 = 4(4&#7503; &#8722; 1) + 3</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">So 3 | 4&#8319; &#8722; 1 for every n &#8712; &#8469;. Verified for n up to 3000.</text>
  <rect x="22" y="118" width="336" height="250" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the quotient is a geometric series</text><text x="58" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">n</text><text x="126" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">4&#8319; &#8722; 1</text><text x="192" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">&#247; 3</text><text x="284" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1 + 4 + &#8943; + 4&#8319;&#8315;&#185;</text><line x1="38" y1="170" x2="342" y2="170" stroke="#3b5b9b" stroke-width="1"/><text x="58" y="190" font-size="11" fill="#666" text-anchor="middle">0</text><text x="126" y="190" font-size="11.5" fill="#1f3a68" text-anchor="middle">0</text><text x="192" y="190" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><text x="284" y="190" font-size="9.5" fill="#777" text-anchor="middle">(empty)</text><text x="58" y="213" font-size="11" fill="#666" text-anchor="middle">1</text><text x="126" y="213" font-size="11.5" fill="#1f3a68" text-anchor="middle">3</text><text x="192" y="213" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">1</text><text x="284" y="213" font-size="9.5" fill="#777" text-anchor="middle">1</text><text x="58" y="236" font-size="11" fill="#666" text-anchor="middle">2</text><text x="126" y="236" font-size="11.5" fill="#1f3a68" text-anchor="middle">15</text><text x="192" y="236" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">5</text><text x="284" y="236" font-size="9.5" fill="#777" text-anchor="middle">1 + 4</text><text x="58" y="259" font-size="11" fill="#666" text-anchor="middle">3</text><text x="126" y="259" font-size="11.5" fill="#1f3a68" text-anchor="middle">63</text><text x="192" y="259" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">21</text><text x="284" y="259" font-size="9.5" fill="#777" text-anchor="middle">1 + 4 + 16</text><text x="58" y="282" font-size="11" fill="#666" text-anchor="middle">4</text><text x="126" y="282" font-size="11.5" fill="#1f3a68" text-anchor="middle">255</text><text x="192" y="282" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">85</text><text x="284" y="282" font-size="9.5" fill="#777" text-anchor="middle">1 + 4 + 16 + 64</text><text x="58" y="305" font-size="11" fill="#666" text-anchor="middle">5</text><text x="126" y="305" font-size="11.5" fill="#1f3a68" text-anchor="middle">1023</text><text x="192" y="305" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">341</text><text x="284" y="305" font-size="9.5" fill="#777" text-anchor="middle">1 + 4 + 16 + 64 + 256</text><text x="190.0" y="338" font-size="11" fill="#333" text-anchor="middle">0, 1, 5, 21, 85, 341 &#8212; the tromino counts</text><text x="190.0" y="356" font-size="11" fill="#333" text-anchor="middle">of 5.1 Problem 3d, met there for this same reason</text><rect x="372" y="118" width="336" height="250" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the same fact in binary</text><text x="396" y="178" font-size="11" fill="#666">n=1</text><text x="684" y="178" font-size="12" fill="#1f3a68" text-anchor="end" font-family="Menlo, monospace">11</text><text x="684" y="194" font-size="12" fill="#1f6b34" text-anchor="end" font-family="Menlo, monospace">= 11 &#215; 1</text><text x="396" y="218" font-size="11" fill="#666">n=2</text><text x="684" y="218" font-size="12" fill="#1f3a68" text-anchor="end" font-family="Menlo, monospace">1111</text><text x="684" y="234" font-size="12" fill="#1f6b34" text-anchor="end" font-family="Menlo, monospace">= 11 &#215; 101</text><text x="396" y="258" font-size="11" fill="#666">n=3</text><text x="684" y="258" font-size="12" fill="#1f3a68" text-anchor="end" font-family="Menlo, monospace">111111</text><text x="684" y="274" font-size="12" fill="#1f6b34" text-anchor="end" font-family="Menlo, monospace">= 11 &#215; 10101</text><text x="396" y="298" font-size="11" fill="#666">n=4</text><text x="684" y="298" font-size="12" fill="#1f3a68" text-anchor="end" font-family="Menlo, monospace">11111111</text><text x="684" y="314" font-size="12" fill="#1f6b34" text-anchor="end" font-family="Menlo, monospace">= 11 &#215; 1010101</text><text x="388" y="338" font-size="11" fill="#333">4&#8319; &#8722; 1 is 2n ones; 3 is 11 in binary, and the</text><text x="388" y="356" font-size="11" fill="#333">quotient is 0101&#8230;01 &#8212; one 11 per pair of ones.</text>
  <rect x="18" y="382" width="684" height="132" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="402" font-size="11.5" fill="#1f6b34" font-weight="bold">THE GENERAL FACT: a &#8722; 1 DIVIDES a&#8319; &#8722; 1</text>
  <text x="360" y="430" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="bold">a&#8319; &#8722; 1 = (a &#8722; 1)(a&#8319;&#8315;&#185; + a&#8319;&#8315;&#178; + &#8943; + a + 1)</text>
  <text x="40" y="458" font-size="11.5" fill="#333">Checked for every base a from 2 to 29 and n up to 39. With a = 4 this is the problem; with a = 10</text>
  <text x="40" y="476" font-size="11.5" fill="#333">it says 9 divides 9, 99, 999, &#8230; &#8212; the reason the nines test works. Equivalently, 4 &#8801; 1 (mod 3),</text>
  <text x="40" y="494" font-size="11.5" fill="#333">so 4&#8319; &#8801; 1&#8319; = 1.</text>
  <rect x="18" y="527" width="684" height="112" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="547" font-size="11.5" fill="#b06a10" font-weight="bold">3 IS THE BEST CONSTANT, BUT EVEN n GIVE MORE</text>
  <text x="40" y="571" font-size="11.5" fill="#333">At n = 1 the value is 3 itself, so no larger constant works; the gcd over n = 1 to 60 is 3. For even</text>
  <text x="40" y="589" font-size="11.5" fill="#333">n, though, 4&#8319; &#8722; 1 = 16&#7504; &#8722; 1 is also divisible by 15 &#8212; exactly when n is even, checked to n = 400.</text>
  <text x="40" y="615" font-size="11.5" fill="#333">Rewriting 4&#8319; = 2&#178;&#8319; gives the companion fact: 3 | 2&#7504; &#8722; 1 exactly when m is even.</text>
</svg>