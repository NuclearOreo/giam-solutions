<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="560" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">A DIVISIBILITY STATEMENT BY INDUCTION</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">for every x &#8712; &#8469;,&#160;&#160;3 | x&#179; &#8722; x</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">Verified for x up to 20000; the step&#8217;s increment checked as a polynomial identity.</text>
  <rect x="22" y="118" width="336" height="276" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">each step adds a multiple of 3</text><text x="62" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">k</text><text x="140" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">k&#179; &#8722; k</text><text x="240" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">increment</text><text x="320" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">&#247; 3</text><line x1="40" y1="170" x2="340" y2="170" stroke="#3b5b9b" stroke-width="1"/><text x="62" y="190" font-size="11" fill="#666" text-anchor="middle">0</text><text x="140" y="190" font-size="11.5" fill="#1f3a68" text-anchor="middle">0</text><text x="240" y="190" font-size="11.5" fill="#b06a10" text-anchor="middle">+0</text><text x="320" y="190" font-size="11.5" fill="#1f6b34" text-anchor="middle">0</text><text x="62" y="214" font-size="11" fill="#666" text-anchor="middle">1</text><text x="140" y="214" font-size="11.5" fill="#1f3a68" text-anchor="middle">0</text><text x="240" y="214" font-size="11.5" fill="#b06a10" text-anchor="middle">+6</text><text x="320" y="214" font-size="11.5" fill="#1f6b34" text-anchor="middle">2</text><text x="62" y="238" font-size="11" fill="#666" text-anchor="middle">2</text><text x="140" y="238" font-size="11.5" fill="#1f3a68" text-anchor="middle">6</text><text x="240" y="238" font-size="11.5" fill="#b06a10" text-anchor="middle">+18</text><text x="320" y="238" font-size="11.5" fill="#1f6b34" text-anchor="middle">6</text><text x="62" y="262" font-size="11" fill="#666" text-anchor="middle">3</text><text x="140" y="262" font-size="11.5" fill="#1f3a68" text-anchor="middle">24</text><text x="240" y="262" font-size="11.5" fill="#b06a10" text-anchor="middle">+36</text><text x="320" y="262" font-size="11.5" fill="#1f6b34" text-anchor="middle">12</text><text x="62" y="286" font-size="11" fill="#666" text-anchor="middle">4</text><text x="140" y="286" font-size="11.5" fill="#1f3a68" text-anchor="middle">60</text><text x="240" y="286" font-size="11.5" fill="#b06a10" text-anchor="middle">+60</text><text x="320" y="286" font-size="11.5" fill="#1f6b34" text-anchor="middle">20</text><text x="62" y="310" font-size="11" fill="#666" text-anchor="middle">5</text><text x="140" y="310" font-size="11.5" fill="#1f3a68" text-anchor="middle">120</text><text x="240" y="310" font-size="11.5" fill="#b06a10" text-anchor="middle">+90</text><text x="320" y="310" font-size="11.5" fill="#1f6b34" text-anchor="middle">30</text><text x="62" y="334" font-size="11" fill="#666" text-anchor="middle">6</text><text x="140" y="334" font-size="11.5" fill="#1f3a68" text-anchor="middle">210</text><text x="240" y="334" font-size="11.5" fill="#b06a10" text-anchor="middle">+126</text><text x="320" y="334" font-size="11.5" fill="#1f6b34" text-anchor="middle">42</text><text x="190.0" y="364" font-size="11.5" fill="#333" text-anchor="middle">the increment is always 3k(k+1),</text><text x="190.0" y="382" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">so divisibility by 3 is never lost</text><rect x="372" y="118" width="336" height="276" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">x&#179; &#8722; x = (x&#8722;1)&#183;x&#183;(x+1)</text><circle cx="398.0" cy="190" r="9" fill="#1f6b34" stroke="#1f6b34" stroke-width="1.6"/><text x="398.0" y="214" font-size="10" fill="#1f3a68" text-anchor="middle">0</text><circle cx="427.0" cy="190" r="7" fill="#ffffff" stroke="#ccc" stroke-width="1.6"/><text x="427.0" y="214" font-size="10" fill="#aaa" text-anchor="middle">1</text><circle cx="456.0" cy="190" r="7" fill="#ffffff" stroke="#ccc" stroke-width="1.6"/><text x="456.0" y="214" font-size="10" fill="#aaa" text-anchor="middle">2</text><circle cx="485.0" cy="190" r="9" fill="#1f6b34" stroke="#1f6b34" stroke-width="1.6"/><text x="485.0" y="214" font-size="10" fill="#1f3a68" text-anchor="middle">3</text><circle cx="514.0" cy="190" r="7" fill="#ffffff" stroke="#ccc" stroke-width="1.6"/><text x="514.0" y="214" font-size="10" fill="#aaa" text-anchor="middle">4</text><circle cx="543.0" cy="190" r="7" fill="#ffffff" stroke="#ccc" stroke-width="1.6"/><text x="543.0" y="214" font-size="10" fill="#aaa" text-anchor="middle">5</text><circle cx="572.0" cy="190" r="9" fill="#1f6b34" stroke="#1f6b34" stroke-width="1.6"/><text x="572.0" y="214" font-size="10" fill="#1f3a68" text-anchor="middle">6</text><circle cx="601.0" cy="190" r="7" fill="#ffffff" stroke="#ccc" stroke-width="1.6"/><text x="601.0" y="214" font-size="10" fill="#aaa" text-anchor="middle">7</text><circle cx="630.0" cy="190" r="7" fill="#ffffff" stroke="#ccc" stroke-width="1.6"/><text x="630.0" y="214" font-size="10" fill="#aaa" text-anchor="middle">8</text><circle cx="659.0" cy="190" r="9" fill="#1f6b34" stroke="#1f6b34" stroke-width="1.6"/><text x="659.0" y="214" font-size="10" fill="#1f3a68" text-anchor="middle">9</text><text x="388" y="168" font-size="10" fill="#1f6b34">green = multiple of 3</text><rect x="500.0" y="223" width="86.0" height="26" rx="5" fill="#7a4fa3" fill-opacity="0.12" stroke="#7a4fa3" stroke-width="1.3"/><text x="514.0" y="240" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">4</text><text x="543.0" y="240" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">5</text><text x="572.0" y="240" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">6</text><text x="602.0" y="240" font-size="10.5" fill="#7a4fa3">x = 5</text><rect x="558.0" y="257" width="86.0" height="26" rx="5" fill="#7a4fa3" fill-opacity="0.12" stroke="#7a4fa3" stroke-width="1.3"/><text x="572.0" y="274" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">6</text><text x="601.0" y="274" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">7</text><text x="630.0" y="274" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">8</text><text x="660.0" y="274" font-size="10.5" fill="#7a4fa3">x = 7</text><text x="388" y="350" font-size="11" fill="#333">Any window of three consecutive integers contains exactly</text><text x="388" y="368" font-size="11" fill="#333">one multiple of 3 &#8212; and at least one even number too.</text><text x="540.0" y="388" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">so in fact 6 | x&#179; &#8722; x</text>
  <rect x="18" y="408" width="684" height="136" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="428" font-size="11.5" fill="#b06a10" font-weight="bold">THE CASE p = 3 OF FERMAT&#8217;S LITTLE THEOREM</text>
  <text x="40" y="452" font-size="11.5" fill="#333">For every <tspan font-style="italic">prime</tspan> p and every integer x, p divides x&#7510; &#8722; x. Checked for p = 2, 3, 5, 7, 11, 13</text>
  <text x="40" y="470" font-size="11.5" fill="#333">over x = 0 to 399: all hold.</text>
  <text x="40" y="496" font-size="11.5" fill="#333">Primality is essential. For m = 4, 6, 8 and 9 the statement fails already at x = 2 &#8212; for instance</text>
  <text x="40" y="514" font-size="11.5" fill="#333">2&#8308; &#8722; 2 = 14, and 14 leaves remainder 2 on division by 4.</text>
  <text x="40" y="536" font-size="11" fill="#555">So the pattern one might guess from x&#179; &#8722; x is real, but only along the primes.</text>
</svg>