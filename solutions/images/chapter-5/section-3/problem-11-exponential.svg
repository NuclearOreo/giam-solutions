  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE STEP IS PROBLEM 10</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">(k+1)&#179; &lt; 3k&#179; &lt; 3 &#183; 3&#7503; = 3&#7503;&#8314;&#185;   for k &#8805; 4</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">Basis 4&#179; = 64 &lt; 81 = 3&#8308;. The first inequality is 5.3 Problem 10; the second is the hypothesis. Verified to n = 3000.</text>
