  <rect x="18" y="402" width="684" height="96" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="422" font-size="11.5" fill="#1f6b34" font-weight="bold">THE RATIO TEST BEHIND THE STEP</text>
  <text x="40" y="448" font-size="11.5" fill="#333">Going from n to n + 1 multiplies 3&#8319; by 3 but n&#179; only by (1 + 1/n)&#179;. That factor is 8, 3.375, 2.370, 1.953, &#8230;</text>
  <text x="40" y="468" font-size="11.5" fill="#333">for n = 1, 2, 3, 4, &#8230;: below 3 exactly from n = 3 on, which is Problem 10's statement (n+1)&#179; &lt; 3n&#179;.</text>
  <rect x="18" y="511" width="684" height="96" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="531" font-size="11.5" fill="#b06a10" font-weight="bold">ONLY n = 3 FAILS</text>
  <text x="40" y="557" font-size="11.5" fill="#333">n&#179; &lt; 3&#8319; also holds at n = 0, 1, 2 (0 &lt; 1, 1 &lt; 3, 8 &lt; 9). Over the reals x&#179; = 3&#739; at x &#8776; 2.4781 and x = 3,</text>
  <text x="40" y="577" font-size="11.5" fill="#333">with x&#179; &gt; 3&#739; strictly between; the integer 3 sits on the boundary, hence the hypothesis n &gt; 3.</text>
