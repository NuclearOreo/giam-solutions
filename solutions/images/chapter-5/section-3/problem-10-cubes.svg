<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 623" width="720" height="623" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="623" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE GAP GROWS AT EVERY STEP</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">D(k+1) = D(k) + 6k&#178; &#8722; 4,   where D(n) = 2n&#179; &#8722; (3n&#178; + 3n + 1)</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">D(3) = 17 &gt; 0, and 6k&#178; &#8722; 4 &gt; 0 for k &#8805; 1, so D(n) &gt; 0 for every n &#8805; 3. Verified for n up to 5000.</text>
  <rect x="22" y="118" width="336" height="270" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the cubic overtakes the quadratic at n = 3</text><line x1="52" y1="330.0" x2="346" y2="330.0" stroke="#eee" stroke-width="1"/><text x="48" y="333.5" font-size="9" fill="#999" text-anchor="end">0</text><line x1="52" y1="299.0" x2="346" y2="299.0" stroke="#eee" stroke-width="1"/><text x="48" y="302.5" font-size="9" fill="#999" text-anchor="end">50</text><line x1="52" y1="268.0" x2="346" y2="268.0" stroke="#eee" stroke-width="1"/><text x="48" y="271.5" font-size="9" fill="#999" text-anchor="end">100</text><line x1="52" y1="237.0" x2="346" y2="237.0" stroke="#eee" stroke-width="1"/><text x="48" y="240.5" font-size="9" fill="#999" text-anchor="end">150</text><line x1="52" y1="206.0" x2="346" y2="206.0" stroke="#eee" stroke-width="1"/><text x="48" y="209.5" font-size="9" fill="#999" text-anchor="end">200</text><line x1="52" y1="175.0" x2="346" y2="175.0" stroke="#eee" stroke-width="1"/><text x="48" y="178.5" font-size="9" fill="#999" text-anchor="end">250</text><rect x="200" y="162" width="146" height="168" fill="#e9f5ea" opacity="0.6"/><text x="206" y="156" font-size="9.5" fill="#1f6b34">true from the basis n = 3 on</text><rect x="62" y="329.38" width="17" height="0.62" fill="#b06a10" fill-opacity="0.8"/><text x="70.5" y="325.38" font-size="8.5" fill="#b06a10" text-anchor="middle" font-weight="bold">1</text><rect x="81" y="330.0" width="17" height="0.0" fill="#3b5b9b" fill-opacity="0.8"/><text x="89.5" y="326.0" font-size="8.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">0</text><text x="79" y="345" font-size="10" fill="#666" text-anchor="middle">n=0</text><rect x="110" y="325.66" width="17" height="4.34" fill="#b06a10" fill-opacity="0.8"/><text x="118.5" y="321.66" font-size="8.5" fill="#b06a10" text-anchor="middle" font-weight="bold">7</text><rect x="129" y="328.76" width="17" height="1.24" fill="#3b5b9b" fill-opacity="0.8"/><text x="137.5" y="324.76" font-size="8.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">2</text><text x="127" y="345" font-size="10" fill="#666" text-anchor="middle">n=1</text><rect x="158" y="318.22" width="17" height="11.78" fill="#b06a10" fill-opacity="0.8"/><text x="166.5" y="314.22" font-size="8.5" fill="#b06a10" text-anchor="middle" font-weight="bold">19</text><rect x="177" y="320.08" width="17" height="9.92" fill="#3b5b9b" fill-opacity="0.8"/><text x="185.5" y="316.08" font-size="8.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">16</text><text x="175" y="345" font-size="10" fill="#666" text-anchor="middle">n=2</text><rect x="206" y="307.06" width="17" height="22.94" fill="#b06a10" fill-opacity="0.8"/><text x="214.5" y="303.06" font-size="8.5" fill="#b06a10" text-anchor="middle" font-weight="bold">37</text><rect x="225" y="296.52" width="17" height="33.48" fill="#3b5b9b" fill-opacity="0.8"/><text x="233.5" y="292.52" font-size="8.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">54</text><text x="223" y="345" font-size="10" fill="#666" text-anchor="middle">n=3</text><rect x="254" y="292.18" width="17" height="37.82" fill="#b06a10" fill-opacity="0.8"/><text x="262.5" y="288.18" font-size="8.5" fill="#b06a10" text-anchor="middle" font-weight="bold">61</text><rect x="273" y="250.64" width="17" height="79.36" fill="#3b5b9b" fill-opacity="0.8"/><text x="281.5" y="246.64" font-size="8.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">128</text><text x="271" y="345" font-size="10" fill="#666" text-anchor="middle">n=4</text><rect x="302" y="273.58" width="17" height="56.42" fill="#b06a10" fill-opacity="0.8"/><text x="310.5" y="269.58" font-size="8.5" fill="#b06a10" text-anchor="middle" font-weight="bold">91</text><rect x="321" y="175.0" width="17" height="155.0" fill="#3b5b9b" fill-opacity="0.8"/><text x="329.5" y="171.0" font-size="8.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">250</text><text x="319" y="345" font-size="10" fill="#666" text-anchor="middle">n=5</text><line x1="52" y1="330" x2="346" y2="330" stroke="#888" stroke-width="1"/><rect x="62" y="357" width="11" height="11" fill="#b06a10" fill-opacity="0.8"/><text x="78" y="366" font-size="10.5" fill="#333">3n&#178; + 3n + 1</text><rect x="202" y="357" width="11" height="11" fill="#3b5b9b" fill-opacity="0.8"/><text x="218" y="366" font-size="10.5" fill="#333">2n&#179;</text><rect x="372" y="118" width="336" height="270" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">equivalently (1 + 1/n)&#179; &lt; 3</text><text x="388" y="179" font-size="10.5" fill="#666">n = 1</text><rect x="436" y="166" width="255.20000000000002" height="18" fill="#9b2c2c" fill-opacity="0.7"/><path d="M 683.2 164 l 5 11 l -5 11" fill="none" stroke="#fff" stroke-width="2"/><text x="677.2" y="179" font-size="10" fill="#fff" text-anchor="end" font-weight="bold">8</text><text x="388" y="207" font-size="10.5" fill="#666">n = 2</text><rect x="436" y="194" width="195.75" height="18" fill="#9b2c2c" fill-opacity="0.7"/><text x="635.75" y="207" font-size="10" fill="#9b2c2c" text-anchor="start" font-weight="bold">3.375</text><text x="388" y="235" font-size="10.5" fill="#666">n = 3</text><rect x="436" y="222" width="137.48148148148147" height="18" fill="#1f6b34" fill-opacity="0.7"/><text x="577.4814814814815" y="235" font-size="10" fill="#1f6b34" text-anchor="start" font-weight="bold">2.370</text><text x="388" y="263" font-size="10.5" fill="#666">n = 4</text><rect x="436" y="250" width="113.28125" height="18" fill="#1f6b34" fill-opacity="0.7"/><text x="553.28125" y="263" font-size="10" fill="#1f6b34" text-anchor="start" font-weight="bold">1.953</text><text x="388" y="291" font-size="10.5" fill="#666">n = 5</text><rect x="436" y="278" width="100.224" height="18" fill="#1f6b34" fill-opacity="0.7"/><text x="540.224" y="291" font-size="10" fill="#1f6b34" text-anchor="start" font-weight="bold">1.728</text><text x="388" y="319" font-size="10.5" fill="#666">n = 6</text><rect x="436" y="306" width="92.10185185185186" height="18" fill="#1f6b34" fill-opacity="0.7"/><text x="532.1018518518518" y="319" font-size="10" fill="#1f6b34" text-anchor="start" font-weight="bold">1.588</text><line x1="610" y1="158" x2="610" y2="334" stroke="#3b5b9b" stroke-width="1.5" stroke-dasharray="4,3"/><text x="610" y="346" font-size="10" fill="#3b5b9b" text-anchor="middle">3</text><text x="388" y="358" font-size="10.5" fill="#333">3n&#178; + 3n + 1 = (n+1)&#179; &#8722; n&#179;, so the claim says (n+1)&#179; &lt; 3n&#179;.</text><text x="388" y="376" font-size="10.5" fill="#333">The real crossover is n = 1/(&#8731;3 &#8722; 1) &#8776; 2.2612.</text>
  <rect x="18" y="402" width="684" height="96" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="422" font-size="11.5" fill="#1f6b34" font-weight="bold">WHY THE BASIS IS 3</text>
  <text x="40" y="448" font-size="11.5" fill="#333">The claim fails at n = 0, 1, 2 (1 &lt; 0, 7 &lt; 2, 19 &lt; 16 are all false) and holds at n = 3 (37 &lt; 54).</text>
  <text x="40" y="468" font-size="11.5" fill="#333">The step itself is valid from k = 1, so the basis, not the step, is what limits the theorem.</text>
  <rect x="18" y="511" width="684" height="96" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="531" font-size="11.5" fill="#b06a10" font-weight="bold">THE INCREMENTS TELL THE STORY</text>
  <text x="40" y="557" font-size="11.5" fill="#333">Each step adds 2(3k&#178; + 3k + 1) to the right side, twice the left side&#8217;s current value, but only</text>
  <text x="40" y="577" font-size="11.5" fill="#333">6(k + 1) to the left. Once ahead, the cubic pulls away: the ratio of left to right tends to 0.</text>
</svg>