<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 615" width="720" height="615" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="615" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE STEP ADDS A MULTIPLE OF 5</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">f(k+1) = f(k) + 5[(k&#8722;1)k(k+1)(k+2) + 2],   f(n) = n&#8309; &#8722; 5n&#179; + 14n</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">So 5 | f(n) for every n &#8712; &#8469;, starting from f(0) = 0. Verified for n up to 5000.</text>
  <rect x="22" y="118" width="336" height="262" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">f(n) = (five consecutive) + 10n</text><text x="48" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">n</text><text x="126" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">(n&#8722;2)&#8943;(n+2)</text><text x="198" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">+ 10n</text><text x="260" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">= f(n)</text><text x="324" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">&#247; 5</text><line x1="34" y1="170" x2="346" y2="170" stroke="#3b5b9b" stroke-width="1"/><text x="48" y="190" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">0</text><text x="126" y="190" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">0</text><text x="198" y="190" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">0</text><text x="260" y="190" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">0</text><text x="324" y="190" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><text x="48" y="212" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">1</text><text x="126" y="212" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">0</text><text x="198" y="212" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">10</text><text x="260" y="212" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">10</text><text x="324" y="212" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">2</text><text x="48" y="234" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">2</text><text x="126" y="234" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">0</text><text x="198" y="234" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">20</text><text x="260" y="234" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">20</text><text x="324" y="234" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">4</text><text x="48" y="256" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">3</text><text x="126" y="256" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">120</text><text x="198" y="256" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">30</text><text x="260" y="256" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">150</text><text x="324" y="256" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">30</text><text x="48" y="278" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">4</text><text x="126" y="278" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">720</text><text x="198" y="278" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">40</text><text x="260" y="278" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">760</text><text x="324" y="278" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">152</text><text x="48" y="300" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">5</text><text x="126" y="300" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">2520</text><text x="198" y="300" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">50</text><text x="260" y="300" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">2570</text><text x="324" y="300" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">514</text><text x="48" y="322" font-size="11" fill="#666" text-anchor="middle" font-weight="normal">6</text><text x="126" y="322" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="normal">6720</text><text x="198" y="322" font-size="11" fill="#777" text-anchor="middle" font-weight="normal">60</text><text x="260" y="322" font-size="11" fill="#1f3a68" text-anchor="middle" font-weight="bold">6780</text><text x="324" y="322" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">1356</text><text x="190.0" y="350" font-size="10.5" fill="#333" text-anchor="middle">the product column is 120 &#183; C(n+2, 5): 0, 0, 0, 120, 720, &#8230;</text><text x="190.0" y="368" font-size="10.5" fill="#333" text-anchor="middle">so f(n) leaves remainder 10n on division by 120</text><rect x="372" y="118" width="336" height="262" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">every window of five hits a multiple of 5</text><text x="392" y="173.0" font-size="10.5" fill="#666">n = 3</text><rect x="464" y="158" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="481.0" y="174" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">1</text><rect x="504" y="158" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="521.0" y="174" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">2</text><rect x="544" y="158" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="561.0" y="174" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">3</text><rect x="584" y="158" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="601.0" y="174" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">4</text><rect x="624" y="158" width="34" height="24" rx="3" fill="#f7dcb8" stroke="#b06a10" stroke-width="1.1"/><text x="641.0" y="174" font-size="11.5" fill="#7a4508" text-anchor="middle" font-weight="bold">5</text><text x="392" y="203.0" font-size="10.5" fill="#666">n = 4</text><rect x="464" y="188" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="481.0" y="204" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">2</text><rect x="504" y="188" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="521.0" y="204" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">3</text><rect x="544" y="188" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="561.0" y="204" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">4</text><rect x="584" y="188" width="34" height="24" rx="3" fill="#f7dcb8" stroke="#b06a10" stroke-width="1.1"/><text x="601.0" y="204" font-size="11.5" fill="#7a4508" text-anchor="middle" font-weight="bold">5</text><rect x="624" y="188" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="641.0" y="204" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">6</text><text x="392" y="233.0" font-size="10.5" fill="#666">n = 5</text><rect x="464" y="218" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="481.0" y="234" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">3</text><rect x="504" y="218" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="521.0" y="234" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">4</text><rect x="544" y="218" width="34" height="24" rx="3" fill="#f7dcb8" stroke="#b06a10" stroke-width="1.1"/><text x="561.0" y="234" font-size="11.5" fill="#7a4508" text-anchor="middle" font-weight="bold">5</text><rect x="584" y="218" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="601.0" y="234" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">6</text><rect x="624" y="218" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="641.0" y="234" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">7</text><text x="392" y="263.0" font-size="10.5" fill="#666">n = 6</text><rect x="464" y="248" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="481.0" y="264" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">4</text><rect x="504" y="248" width="34" height="24" rx="3" fill="#f7dcb8" stroke="#b06a10" stroke-width="1.1"/><text x="521.0" y="264" font-size="11.5" fill="#7a4508" text-anchor="middle" font-weight="bold">5</text><rect x="544" y="248" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="561.0" y="264" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">6</text><rect x="584" y="248" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="601.0" y="264" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">7</text><rect x="624" y="248" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="641.0" y="264" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">8</text><text x="392" y="293.0" font-size="10.5" fill="#666">n = 7</text><rect x="464" y="278" width="34" height="24" rx="3" fill="#f7dcb8" stroke="#b06a10" stroke-width="1.1"/><text x="481.0" y="294" font-size="11.5" fill="#7a4508" text-anchor="middle" font-weight="bold">5</text><rect x="504" y="278" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="521.0" y="294" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">6</text><rect x="544" y="278" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="561.0" y="294" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">7</text><rect x="584" y="278" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="601.0" y="294" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">8</text><rect x="624" y="278" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="641.0" y="294" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">9</text><text x="392" y="323.0" font-size="10.5" fill="#666">n = 8</text><rect x="464" y="308" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="481.0" y="324" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">6</text><rect x="504" y="308" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="521.0" y="324" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">7</text><rect x="544" y="308" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="561.0" y="324" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">8</text><rect x="584" y="308" width="34" height="24" rx="3" fill="#f4f6fb" stroke="#b8c2d8" stroke-width="1.1"/><text x="601.0" y="324" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="normal">9</text><rect x="624" y="308" width="34" height="24" rx="3" fill="#f7dcb8" stroke="#b06a10" stroke-width="1.1"/><text x="641.0" y="324" font-size="11.5" fill="#7a4508" text-anchor="middle" font-weight="bold">10</text><text x="388" y="350" font-size="10.5" fill="#333">Five consecutive integers contain a multiple of 5,</text><text x="388" y="368" font-size="10.5" fill="#333">and also of 2, 3 and 4: their product is divisible by 5! = 120.</text>
  <rect x="18" y="394" width="684" height="96" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="414" font-size="11.5" fill="#1f6b34" font-weight="bold">FERMAT DOES IT IN ONE LINE</text>
  <text x="40" y="440" font-size="11.5" fill="#333">n&#8309; &#8801; n (mod 5) for every n, so f(n) &#8801; n &#8722; 0 + 14n = 15n &#8801; 0 (mod 5). The same argument shows</text>
  <text x="40" y="460" font-size="11.5" fill="#333">n&#8309; &#8722; 5n&#179; + cn is always divisible by 5 exactly when c &#8801; 4 (mod 5): c = &#8230;, &#8722;1, 4, 9, 14, 19, &#8230;</text>
  <text x="40" y="478" font-size="11.5" fill="#333">(checked for c from &#8722;10 to 29).</text>
  <rect x="18" y="503" width="684" height="96" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="523" font-size="11.5" fill="#b06a10" font-weight="bold">5 IS NOT THE BEST CONSTANT: 10 IS</text>
  <text x="40" y="549" font-size="11.5" fill="#333">f(1) = 10 and the gcd of f(0), &#8230;, f(299) is 10. Since f(n) &#8801; 10n (mod 120), 20 | f(n) iff n is even,</text>
  <text x="40" y="569" font-size="11.5" fill="#333">30 | f(n) iff 3 | n, 40 | f(n) iff 4 | n, and 120 | f(n) iff 12 | n (all checked for |n| up to 3000).</text>
</svg>