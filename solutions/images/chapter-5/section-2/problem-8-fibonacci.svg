<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 727" width="720" height="727" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="727" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE SUM OF SQUARES OF FIBONACCI NUMBERS</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8721;&#7522;&#8330;&#8320;&#8319; F&#7522;&#178; = F&#8345; &#183; F&#8345;&#8330;&#8321;</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">Verified for n up to 55, with F&#8320; = F&#8321; = 1 as the problem sets them.</text>
  <rect x="18" y="118" width="684" height="294" rx="6" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="360" y="140" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">squares of sides F&#8320;, &#8230;, F&#8345; tile an F&#8345; &#215; F&#8345;&#8330;&#8321; rectangle</text><rect x="217.0" y="160.0" width="176.0" height="176.0" fill="#3b5b9b" fill-opacity="0.22" stroke="#3b5b9b" stroke-width="1.8"/><text x="305.0" y="253.2" font-size="15" fill="#3b5b9b" text-anchor="middle" font-weight="bold">8</text><rect x="393.0" y="160.0" width="110.0" height="110.0" fill="#9b2c2c" fill-opacity="0.22" stroke="#9b2c2c" stroke-width="1.8"/><text x="448.0" y="220.2" font-size="15" fill="#9b2c2c" text-anchor="middle" font-weight="bold">5</text><rect x="437.0" y="270.0" width="66.0" height="66.0" fill="#1f6b34" fill-opacity="0.22" stroke="#1f6b34" stroke-width="1.8"/><text x="470.0" y="308.2" font-size="15" fill="#1f6b34" text-anchor="middle" font-weight="bold">3</text><rect x="393.0" y="270.0" width="44.0" height="44.0" fill="#b06a10" fill-opacity="0.22" stroke="#b06a10" stroke-width="1.8"/><text x="415.0" y="296.2" font-size="12" fill="#b06a10" text-anchor="middle" font-weight="bold">2</text><rect x="415.0" y="314.0" width="22.0" height="22.0" fill="#7a4fa3" fill-opacity="0.22" stroke="#7a4fa3" stroke-width="1.8"/><text x="426.0" y="328.3" font-size="9.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">1</text><rect x="393.0" y="314.0" width="22.0" height="22.0" fill="#7a4fa3" fill-opacity="0.22" stroke="#7a4fa3" stroke-width="1.8"/><text x="404.0" y="328.3" font-size="9.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">1</text><rect x="217.0" y="160.0" width="286.0" height="176.0" fill="none" stroke="#333" stroke-width="1.6"/><text x="207.0" y="252.0" font-size="12" fill="#333" text-anchor="end" font-weight="bold">8</text><text x="360.0" y="354.0" font-size="12" fill="#333" text-anchor="middle" font-weight="bold">13</text><text x="360" y="384" font-size="11.5" fill="#333" text-anchor="middle">1&#178; + 1&#178; + 2&#178; + 3&#178; + 5&#178; + 8&#178; = 1 + 1 + 4 + 9 + 25 + 64 = 104</text><text x="360" y="402" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">and 8 &#215; 13 = 104, so &#8721; F&#7522;&#178; = F&#8345; F&#8345;&#8330;&#8321;</text>
  <rect x="18" y="426" width="684" height="136" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="446" font-size="11.5" fill="#1f6b34" font-weight="bold">THE STEP IS ONE FACTORISATION AND THE RECURRENCE</text>
  <text x="40" y="472" font-size="11.5" fill="#333">Add the next square to the assumed total, then pull out the common factor F&#8342;&#8330;&#8321;:</text>
  <text x="360" y="504" font-size="13" fill="#1f3a68" text-anchor="middle">F&#8342; F&#8342;&#8330;&#8321; + F&#8342;&#8330;&#8321;&#178;&#160;&#160;=&#160;&#160;F&#8342;&#8330;&#8321; ( F&#8342; + F&#8342;&#8330;&#8321; )</text>
  <text x="360" y="532" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">=&#160;&#160;F&#8342;&#8330;&#8321; F&#8342;&#8330;&#8322;</text>
  <text x="40" y="554" font-size="11.5" fill="#333">The last equality is the defining recurrence. Nothing else is used.</text>
  <rect x="18" y="575" width="684" height="136" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="595" font-size="11.5" fill="#b06a10" font-weight="bold">WHY ONE BASIS IS ENOUGH, THOUGH THE RECURRENCE LOOKS BACK TWO</text>
  <text x="40" y="619" font-size="11.5" fill="#333">5.1 Problem 4 warned that a step of size 2 needs two bases. This proof steps by 1 and needs only</text>
  <text x="40" y="637" font-size="11.5" fill="#333">P(0), because the statement P(n) mentions just F&#8345; and F&#8345;&#8330;&#8321;, and the two-term recurrence enters</text>
  <text x="40" y="655" font-size="11.5" fill="#333">as an <tspan font-style="italic">already known fact about the sequence</tspan>, not as a second inductive hypothesis.</text>
  <text x="40" y="683" font-size="11.5" fill="#333">The distinction worth keeping: what matters is how far back the <tspan font-style="italic">induction</tspan> reaches, not how far</text>
  <text x="40" y="701" font-size="11.5" fill="#333">back the <tspan font-style="italic">definition</tspan> reaches.</text>
</svg>