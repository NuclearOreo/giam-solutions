<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 604" width="720" height="604" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="604" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="88" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE SUM OF CUBES IS THE SQUARE OF THE SUM</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">1&#179; + 2&#179; + &#8943; + n&#179; = (1 + 2 + &#8943; + n)&#178; = (n(n+1)/2)&#178;</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">Verified for every n up to 3000, and the inductive step checked coefficient by coefficient.</text>
  <rect x="22" y="120" width="336" height="286" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="141" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">a 10&#215;10 square cut into cubes</text><rect x="90.0" y="158" width="200.0" height="200.0" fill="#b06a10" fill-opacity="0.34" stroke="#b06a10" stroke-width="1.6"/><rect x="90.0" y="158" width="120.0" height="120.0" fill="#1f6b34" fill-opacity="0.34" stroke="#1f6b34" stroke-width="1.6"/><rect x="90.0" y="158" width="60.0" height="60.0" fill="#9b2c2c" fill-opacity="0.34" stroke="#9b2c2c" stroke-width="1.6"/><rect x="90.0" y="158" width="20.0" height="20.0" fill="#3b5b9b" fill-opacity="0.34" stroke="#3b5b9b" stroke-width="1.6"/><line x1="90.0" y1="158.0" x2="290.0" y2="158.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="90.0" y1="158" x2="90.0" y2="358.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="90.0" y1="178.0" x2="290.0" y2="178.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="110.0" y1="158" x2="110.0" y2="358.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="90.0" y1="198.0" x2="290.0" y2="198.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="130.0" y1="158" x2="130.0" y2="358.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="90.0" y1="218.0" x2="290.0" y2="218.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="150.0" y1="158" x2="150.0" y2="358.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="90.0" y1="238.0" x2="290.0" y2="238.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="170.0" y1="158" x2="170.0" y2="358.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="90.0" y1="258.0" x2="290.0" y2="258.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="190.0" y1="158" x2="190.0" y2="358.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="90.0" y1="278.0" x2="290.0" y2="278.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="210.0" y1="158" x2="210.0" y2="358.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="90.0" y1="298.0" x2="290.0" y2="298.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="230.0" y1="158" x2="230.0" y2="358.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="90.0" y1="318.0" x2="290.0" y2="318.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="250.0" y1="158" x2="250.0" y2="358.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="90.0" y1="338.0" x2="290.0" y2="338.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="270.0" y1="158" x2="270.0" y2="358.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="90.0" y1="358.0" x2="290.0" y2="358.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><line x1="290.0" y1="158" x2="290.0" y2="358.0" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/><rect x="90.0" y="158" width="200.0" height="200.0" fill="none" stroke="#444" stroke-width="1.4"/><text x="100.0" y="172.0" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">1&#179;</text><text x="130.0" y="202.0" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">2&#179;</text><text x="180.0" y="252.0" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">3&#179;</text><text x="250.0" y="322.0" font-size="12" fill="#111" text-anchor="middle" font-weight="bold">4&#179;</text><text x="190.0" y="376" font-size="11" fill="#555" text-anchor="middle">side 1+2+3+4 = 10; the L-shaped shells have areas</text><text x="190.0" y="393" font-size="11" fill="#555" text-anchor="middle">1, 8, 27, 64, and 1+8+27+64 = 100 = 10&#178;</text><rect x="372" y="120" width="336" height="286" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="141" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">every cube is a run of odd numbers</text><text x="394" y="168" font-size="12" fill="#3b5b9b" font-weight="bold">1&#179; = 1</text><text x="476" y="168" font-size="11.5" fill="#333">= 1</text><text x="394" y="202" font-size="12" fill="#9b2c2c" font-weight="bold">2&#179; = 8</text><text x="476" y="202" font-size="11.5" fill="#333">= 3 + 5</text><text x="394" y="236" font-size="12" fill="#1f6b34" font-weight="bold">3&#179; = 27</text><text x="476" y="236" font-size="11.5" fill="#333">= 7 + 9 + 11</text><text x="394" y="270" font-size="12" fill="#b06a10" font-weight="bold">4&#179; = 64</text><text x="476" y="270" font-size="11.5" fill="#333">= 13 + 15 + 17 + 19</text><text x="394" y="304" font-size="12" fill="#3b5b9b" font-weight="bold">5&#179; = 125</text><text x="476" y="304" font-size="11.5" fill="#333">= 21 + 23 + 25 + 27 + 29</text><text x="390" y="360" font-size="11" fill="#555">Stacking these uses the first 1+2+&#8943;+n odd numbers,</text><text x="390" y="377" font-size="11" fill="#555">and the first m odds sum to m&#178; (5.1 Problem 3b), so</text><text x="540.0" y="397" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">&#8721; j&#179; = (1+2+&#8943;+n)&#178;</text>
  <rect x="18" y="420" width="684" height="168" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="440" font-size="11.5" fill="#1f6b34" font-weight="bold">THE INDUCTIVE STEP IN ONE LINE</text>
  <text x="40" y="466" font-size="11.5" fill="#333">Assume the formula at k, then add the next cube and factor out (k+1)&#178;:</text>
  <text x="360" y="496" font-size="12.5" fill="#1f3a68" text-anchor="middle">(k(k+1)/2)&#178; + (k+1)&#179;&#160;&#160;=&#160;&#160;(k+1)&#178; &#183; [ k&#178;/4 + (k+1) ]</text>
  <text x="360" y="522" font-size="12.5" fill="#1f3a68" text-anchor="middle">=&#160;&#160;(k+1)&#178; &#183; (k&#178; + 4k + 4)/4&#160;&#160;=&#160;&#160;(k+1)&#178;(k+2)&#178;/4</text>
  <text x="360" y="548" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">=&#160;&#160;((k+1)(k+2)/2)&#178;</text>
  <text x="40" y="574" font-size="11.5" fill="#333">which is the formula at k+1. The whole step is the observation that k&#178;/4 + k + 1 is a perfect square.</text>
</svg>