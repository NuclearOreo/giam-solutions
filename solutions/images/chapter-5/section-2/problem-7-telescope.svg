<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="560" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">A TELESCOPING SUM</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8721;&#8305;&#8330;&#8321;&#8319; 1/((2i&#8722;1)(2i+1)) = n/(2n+1)</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">Verified exactly with fractions for n up to 800, and the inductive step for k up to 2000.</text>
  <rect x="22" y="118" width="350" height="252" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="197.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">partial fractions make it telescope</text><text x="44" y="166" font-size="10.5" fill="#888">term</text><text x="44" y="190" font-size="11" fill="#666">i = 1</text><text x="114" y="190" font-size="12" fill="#1f3a68" text-anchor="end">&#189; (</text><text x="136" y="190" font-size="12" fill="#3b5b9b" text-anchor="middle">1/1</text><text x="160" y="190" font-size="12" fill="#1f3a68" text-anchor="middle">&#8722;</text><text x="190" y="190" font-size="12" fill="#bbb" text-anchor="middle">1/3</text><line x1="174" y1="186" x2="206" y2="186" stroke="#9b2c2c" stroke-width="1.2"/><text x="218" y="190" font-size="12" fill="#1f3a68">)</text><text x="44" y="220" font-size="11" fill="#666">i = 2</text><text x="114" y="220" font-size="12" fill="#1f3a68" text-anchor="end">&#189; (</text><text x="136" y="220" font-size="12" fill="#bbb" text-anchor="middle">1/3</text><line x1="120" y1="216" x2="152" y2="216" stroke="#9b2c2c" stroke-width="1.2"/><text x="160" y="220" font-size="12" fill="#1f3a68" text-anchor="middle">&#8722;</text><text x="190" y="220" font-size="12" fill="#bbb" text-anchor="middle">1/5</text><line x1="174" y1="216" x2="206" y2="216" stroke="#9b2c2c" stroke-width="1.2"/><text x="218" y="220" font-size="12" fill="#1f3a68">)</text><text x="44" y="250" font-size="11" fill="#666">i = 3</text><text x="114" y="250" font-size="12" fill="#1f3a68" text-anchor="end">&#189; (</text><text x="136" y="250" font-size="12" fill="#bbb" text-anchor="middle">1/5</text><line x1="120" y1="246" x2="152" y2="246" stroke="#9b2c2c" stroke-width="1.2"/><text x="160" y="250" font-size="12" fill="#1f3a68" text-anchor="middle">&#8722;</text><text x="190" y="250" font-size="12" fill="#bbb" text-anchor="middle">1/7</text><line x1="174" y1="246" x2="206" y2="246" stroke="#9b2c2c" stroke-width="1.2"/><text x="218" y="250" font-size="12" fill="#1f3a68">)</text><text x="44" y="280" font-size="11" fill="#666">i = 4</text><text x="114" y="280" font-size="12" fill="#1f3a68" text-anchor="end">&#189; (</text><text x="136" y="280" font-size="12" fill="#bbb" text-anchor="middle">1/7</text><line x1="120" y1="276" x2="152" y2="276" stroke="#9b2c2c" stroke-width="1.2"/><text x="160" y="280" font-size="12" fill="#1f3a68" text-anchor="middle">&#8722;</text><text x="190" y="280" font-size="12" fill="#3b5b9b" text-anchor="middle">1/9</text><text x="218" y="280" font-size="12" fill="#1f3a68">)</text><text x="44" y="318" font-size="11.5" fill="#333">everything cancels but the ends:</text><text x="197.0" y="344" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">&#189;(1 &#8722; 1/(2n+1)) = n/(2n+1)</text><rect x="380" y="118" width="322" height="252" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="541.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the partial sums</text><text x="426" y="166" font-size="10.5" fill="#3b5b9b" font-weight="bold">n</text><text x="508" y="166" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">n/(2n+1)</text><text x="598" y="166" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">decimal</text><line x1="400" y1="172" x2="682" y2="172" stroke="#3b5b9b" stroke-width="1"/><text x="426" y="192" font-size="11" fill="#666">1</text><text x="508" y="192" font-size="11.5" fill="#1f3a68" text-anchor="middle">1/3</text><text x="598" y="192" font-size="11.5" fill="#7a4fa3" text-anchor="middle">0.33333</text><text x="426" y="214" font-size="11" fill="#666">2</text><text x="508" y="214" font-size="11.5" fill="#1f3a68" text-anchor="middle">2/5</text><text x="598" y="214" font-size="11.5" fill="#7a4fa3" text-anchor="middle">0.40000</text><text x="426" y="236" font-size="11" fill="#666">3</text><text x="508" y="236" font-size="11.5" fill="#1f3a68" text-anchor="middle">3/7</text><text x="598" y="236" font-size="11.5" fill="#7a4fa3" text-anchor="middle">0.42857</text><text x="426" y="258" font-size="11" fill="#666">4</text><text x="508" y="258" font-size="11.5" fill="#1f3a68" text-anchor="middle">4/9</text><text x="598" y="258" font-size="11.5" fill="#7a4fa3" text-anchor="middle">0.44444</text><text x="426" y="280" font-size="11" fill="#666">5</text><text x="508" y="280" font-size="11.5" fill="#1f3a68" text-anchor="middle">5/11</text><text x="598" y="280" font-size="11.5" fill="#7a4fa3" text-anchor="middle">0.45455</text><text x="426" y="302" font-size="11" fill="#666">50</text><text x="508" y="302" font-size="11.5" fill="#1f3a68" text-anchor="middle">50/101</text><text x="598" y="302" font-size="11.5" fill="#7a4fa3" text-anchor="middle">0.49505</text><text x="426" y="324" font-size="11" fill="#666">500</text><text x="508" y="324" font-size="11.5" fill="#1f3a68" text-anchor="middle">500/1001</text><text x="598" y="324" font-size="11.5" fill="#7a4fa3" text-anchor="middle">0.49950</text><text x="541.0" y="348" font-size="11.5" fill="#b06a10" text-anchor="middle" font-weight="bold">&#8594; &#189; as n grows</text>
  <rect x="18" y="384" width="684" height="160" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="404" font-size="11.5" fill="#1f6b34" font-weight="bold">THE INDUCTIVE STEP TURNS ON ONE FACTORISATION</text>
  <text x="40" y="430" font-size="11.5" fill="#333">Adding the next term over the common denominator (2k+1)(2k+3):</text>
  <text x="360" y="460" font-size="12.5" fill="#1f3a68" text-anchor="middle">k/(2k+1) + 1/((2k+1)(2k+3))&#160;&#160;=&#160;&#160;[ k(2k+3) + 1 ] / ((2k+1)(2k+3))</text>
  <text x="360" y="488" font-size="12.5" fill="#b06a10" text-anchor="middle" font-weight="bold">numerator = 2k&#178; + 3k + 1 = (2k+1)(k+1)</text>
  <text x="360" y="514" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">so the sum is (k+1)/(2k+3) = (k+1)/(2(k+1)+1)</text>
  <text x="40" y="536" font-size="11.5" fill="#333">That numerator is exactly the polynomial of 5.2 Problem 6, factored the same way.</text>
</svg>