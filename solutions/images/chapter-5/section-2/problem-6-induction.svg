<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 656" width="720" height="656" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="656" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE IDENTITY WHOSE TABLE WAS FILLED IN AT 5.1 PROBLEM 1</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8721;&#8305;&#8330;&#8320;&#8319; (4j + 1) = 2n&#178; + 3n + 1 = (n+1)(2n+1)</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">Verified for every n up to 5000. There the table was evidence; here is the proof.</text>
  <rect x="18" y="118" width="684" height="210" rx="6" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="360" y="140" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">an induction on a summation checks exactly two things</text><rect x="46" y="158" width="300" height="140" rx="5" fill="#1f6b34" fill-opacity="0.06" stroke="#1f6b34" stroke-width="1.3"/><text x="60" y="180" font-size="11.5" fill="#1f6b34" font-weight="bold">BASIS</text><text x="60" y="198" font-size="10.5" fill="#666" font-style="italic">the formula is right at the start</text><text x="60" y="222" font-size="11.5" fill="#1f3a68" font-weight="normal">at n = 0 the sum has ONE term, not none,</text><text x="60" y="242" font-size="11.5" fill="#1f3a68" font-weight="normal">because the index runs from j = 0:</text><text x="60" y="282" font-size="11.5" fill="#1f3a68" font-weight="bold">1 = 2(0)&#178; + 3(0) + 1</text><rect x="374" y="158" width="300" height="140" rx="5" fill="#3b5b9b" fill-opacity="0.06" stroke="#3b5b9b" stroke-width="1.3"/><text x="388" y="180" font-size="11.5" fill="#3b5b9b" font-weight="bold">STEP</text><text x="388" y="198" font-size="10.5" fill="#666" font-style="italic">the formula grows by the right amount</text><text x="388" y="222" font-size="11.5" fill="#1f3a68" font-weight="normal">the next term is 4(k+1)+1 = 4k+5, and</text><text x="388" y="242" font-size="11.5" fill="#1f3a68" font-weight="normal">Q(k+1) &#8722; Q(k) = 2(2k+1) + 3 = 4k+5</text><text x="388" y="282" font-size="11.5" fill="#1f3a68" font-weight="normal">so adding a term keeps the formula true</text><rect x="18" y="344" width="684" height="156" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/><text x="34" y="364" font-size="11.5" fill="#1f6b34" font-weight="bold">THE FIRST DIFFERENCE OF THE POLYNOMIAL IS THE TERM BEING ADDED</text><text x="110" y="392" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">1</text><text x="110" y="380" font-size="9" fill="#999" text-anchor="middle">n=0</text><text x="192" y="392" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">6</text><text x="192" y="380" font-size="9" fill="#999" text-anchor="middle">n=1</text><text x="274" y="392" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">15</text><text x="274" y="380" font-size="9" fill="#999" text-anchor="middle">n=2</text><text x="356" y="392" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">28</text><text x="356" y="380" font-size="9" fill="#999" text-anchor="middle">n=3</text><text x="438" y="392" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">45</text><text x="438" y="380" font-size="9" fill="#999" text-anchor="middle">n=4</text><text x="520" y="392" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">66</text><text x="520" y="380" font-size="9" fill="#999" text-anchor="middle">n=5</text><text x="602" y="392" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">91</text><text x="602" y="380" font-size="9" fill="#999" text-anchor="middle">n=6</text><path d="M 126 398 Q 151.0 418 176 398" fill="none" stroke="#b06a10" stroke-width="1.2"/><text x="151.0" y="430" font-size="10.5" fill="#b06a10" text-anchor="middle" font-weight="bold">+5</text><path d="M 208 398 Q 233.0 418 258 398" fill="none" stroke="#b06a10" stroke-width="1.2"/><text x="233.0" y="430" font-size="10.5" fill="#b06a10" text-anchor="middle" font-weight="bold">+9</text><path d="M 290 398 Q 315.0 418 340 398" fill="none" stroke="#b06a10" stroke-width="1.2"/><text x="315.0" y="430" font-size="10.5" fill="#b06a10" text-anchor="middle" font-weight="bold">+13</text><path d="M 372 398 Q 397.0 418 422 398" fill="none" stroke="#b06a10" stroke-width="1.2"/><text x="397.0" y="430" font-size="10.5" fill="#b06a10" text-anchor="middle" font-weight="bold">+17</text><path d="M 454 398 Q 479.0 418 504 398" fill="none" stroke="#b06a10" stroke-width="1.2"/><text x="479.0" y="430" font-size="10.5" fill="#b06a10" text-anchor="middle" font-weight="bold">+21</text><path d="M 536 398 Q 561.0 418 586 398" fill="none" stroke="#b06a10" stroke-width="1.2"/><text x="561.0" y="430" font-size="10.5" fill="#b06a10" text-anchor="middle" font-weight="bold">+25</text><text x="40" y="458" font-size="11.5" fill="#333">The gaps 5, 9, 13, 17, 21, 25 are exactly the terms 4j+1 being added. Verified for k up to 5000.</text><text x="40" y="480" font-size="11.5" fill="#333">That single check, plus the basis, is the whole induction &#8212; nothing else about the sum is used.</text>
  <rect x="18" y="516" width="684" height="124" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="536" font-size="11.5" fill="#b06a10" font-weight="bold">WATCH THE BASIS: THIS SUM STARTS AT j = 0</text>
  <text x="40" y="560" font-size="11.5" fill="#333">In 5.2 Problems 1 to 4 the sums ran from i = 1, so n = 0 gave an <tspan font-style="italic">empty</tspan> sum and the basis was a</text>
  <text x="40" y="578" font-size="11.5" fill="#333">convention. Here the index starts at j = 0, so n = 0 already contributes the term 4(0)+1 = 1.</text>
  <text x="40" y="604" font-size="11.5" fill="#333">The basis is therefore a genuine computation, small as it is, and reading it as an empty sum would</text>
  <text x="40" y="622" font-size="11.5" fill="#333">give 0 rather than 1 &#8212; wrong, since 2(0)&#178; + 3(0) + 1 = 1.</text>
</svg>