<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 673" width="720" height="673" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="673" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE ALTERNATING SUM OF SQUARES</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8721;&#8305;&#8330;&#8321;&#8319; (&#8722;1)&#8305;&#8315;&#185; i&#178; = (&#8722;1)&#8319;&#8315;&#185; &#183; n(n+1)/2 = (&#8722;1)&#8319;&#8315;&#185; T&#8345;</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">Verified for every n up to 5000, and the inductive step checked for k up to 2000.</text>
  <rect x="22" y="118" width="336" height="248" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the magnitudes are the triangular numbers</text><text x="64" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">n</text><text x="162" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">alternating sum</text><text x="284" y="164" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">|value|</text><line x1="42" y1="170" x2="338" y2="170" stroke="#3b5b9b" stroke-width="1"/><text x="64" y="188" font-size="11" fill="#666" text-anchor="middle">1</text><text x="162" y="188" font-size="11.5" fill="#3b5b9b" text-anchor="middle">1</text><text x="284" y="188" font-size="11.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">1</text><text x="64" y="209" font-size="11" fill="#666" text-anchor="middle">2</text><text x="162" y="209" font-size="11.5" fill="#9b2c2c" text-anchor="middle">-3</text><text x="284" y="209" font-size="11.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">3</text><text x="64" y="230" font-size="11" fill="#666" text-anchor="middle">3</text><text x="162" y="230" font-size="11.5" fill="#3b5b9b" text-anchor="middle">6</text><text x="284" y="230" font-size="11.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">6</text><text x="64" y="251" font-size="11" fill="#666" text-anchor="middle">4</text><text x="162" y="251" font-size="11.5" fill="#9b2c2c" text-anchor="middle">-10</text><text x="284" y="251" font-size="11.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">10</text><text x="64" y="272" font-size="11" fill="#666" text-anchor="middle">5</text><text x="162" y="272" font-size="11.5" fill="#3b5b9b" text-anchor="middle">15</text><text x="284" y="272" font-size="11.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">15</text><text x="64" y="293" font-size="11" fill="#666" text-anchor="middle">6</text><text x="162" y="293" font-size="11.5" fill="#9b2c2c" text-anchor="middle">-21</text><text x="284" y="293" font-size="11.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">21</text><text x="64" y="314" font-size="11" fill="#666" text-anchor="middle">7</text><text x="162" y="314" font-size="11.5" fill="#3b5b9b" text-anchor="middle">28</text><text x="284" y="314" font-size="11.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">28</text><text x="190.0" y="334" font-size="11" fill="#555" text-anchor="middle">1, 3, 6, 10, 15, 21, 28 &#8212; the triangular numbers,</text><text x="190.0" y="352" font-size="11" fill="#555" text-anchor="middle">with the sign alternating from term to term.</text><rect x="372" y="118" width="336" height="248" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">why: T&#8345; + T&#8345;&#8331;&#8321; = n&#178;</text><circle cx="498.0" cy="174.0" r="6.0" fill="#7a4fa3" fill-opacity="0.85"/><circle cx="519.0" cy="174.0" r="6.0" fill="#1f6b34" fill-opacity="0.85"/><circle cx="540.0" cy="174.0" r="6.0" fill="#1f6b34" fill-opacity="0.85"/><circle cx="561.0" cy="174.0" r="6.0" fill="#1f6b34" fill-opacity="0.85"/><circle cx="582.0" cy="174.0" r="6.0" fill="#1f6b34" fill-opacity="0.85"/><circle cx="498.0" cy="195.0" r="6.0" fill="#7a4fa3" fill-opacity="0.85"/><circle cx="519.0" cy="195.0" r="6.0" fill="#7a4fa3" fill-opacity="0.85"/><circle cx="540.0" cy="195.0" r="6.0" fill="#1f6b34" fill-opacity="0.85"/><circle cx="561.0" cy="195.0" r="6.0" fill="#1f6b34" fill-opacity="0.85"/><circle cx="582.0" cy="195.0" r="6.0" fill="#1f6b34" fill-opacity="0.85"/><circle cx="498.0" cy="216.0" r="6.0" fill="#7a4fa3" fill-opacity="0.85"/><circle cx="519.0" cy="216.0" r="6.0" fill="#7a4fa3" fill-opacity="0.85"/><circle cx="540.0" cy="216.0" r="6.0" fill="#7a4fa3" fill-opacity="0.85"/><circle cx="561.0" cy="216.0" r="6.0" fill="#1f6b34" fill-opacity="0.85"/><circle cx="582.0" cy="216.0" r="6.0" fill="#1f6b34" fill-opacity="0.85"/><circle cx="498.0" cy="237.0" r="6.0" fill="#7a4fa3" fill-opacity="0.85"/><circle cx="519.0" cy="237.0" r="6.0" fill="#7a4fa3" fill-opacity="0.85"/><circle cx="540.0" cy="237.0" r="6.0" fill="#7a4fa3" fill-opacity="0.85"/><circle cx="561.0" cy="237.0" r="6.0" fill="#7a4fa3" fill-opacity="0.85"/><circle cx="582.0" cy="237.0" r="6.0" fill="#1f6b34" fill-opacity="0.85"/><circle cx="498.0" cy="258.0" r="6.0" fill="#7a4fa3" fill-opacity="0.85"/><circle cx="519.0" cy="258.0" r="6.0" fill="#7a4fa3" fill-opacity="0.85"/><circle cx="540.0" cy="258.0" r="6.0" fill="#7a4fa3" fill-opacity="0.85"/><circle cx="561.0" cy="258.0" r="6.0" fill="#7a4fa3" fill-opacity="0.85"/><circle cx="582.0" cy="258.0" r="6.0" fill="#7a4fa3" fill-opacity="0.85"/><text x="482.0" y="264.0" font-size="11.5" fill="#7a4fa3" text-anchor="end" font-weight="bold">T&#8325; = 15</text><text x="598.0" y="180" font-size="11.5" fill="#1f6b34" font-weight="bold">T&#8324; = 10</text><text x="540.0" y="314" font-size="11.5" fill="#333" text-anchor="middle">15 + 10 = 25 = 5&#178;</text><text x="390" y="336" font-size="11" fill="#555">So (&#8722;1)&#8319;&#8315;&#185;T&#8345; &#8722; (&#8722;1)&#8319;&#8315;&#178;T&#8345;&#8331;&#8321; = (&#8722;1)&#8319;&#8315;&#185;(T&#8345; + T&#8345;&#8331;&#8321;) = (&#8722;1)&#8319;&#8315;&#185;n&#178;,</text><text x="390" y="354" font-size="11" fill="#555">exactly the term added at step n &#8212; so the sum telescopes.</text>
  <rect x="18" y="380" width="684" height="136" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="400" font-size="11.5" fill="#1f6b34" font-weight="bold">THE INDUCTIVE STEP</text>
  <text x="40" y="426" font-size="11.5" fill="#333">Assume the value at k, then add the next term (&#8722;1)&#7495;(k+1)&#178; and factor out (&#8722;1)&#7495;(k+1):</text>
  <text x="360" y="456" font-size="12.5" fill="#1f3a68" text-anchor="middle">(&#8722;1)&#7495;&#8315;&#185; k(k+1)/2 + (&#8722;1)&#7495;(k+1)&#178;&#160;&#160;=&#160;&#160;(&#8722;1)&#7495;(k+1) &#183; [ &#8722;k/2 + (k+1) ]</text>
  <text x="360" y="486" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">=&#160;&#160;(&#8722;1)&#7495; (k+1)(k+2)/2</text>
  <text x="40" y="508" font-size="11.5" fill="#333">The sign flips because the new term carries (&#8722;1)&#7495; rather than (&#8722;1)&#7495;&#8315;&#185;, which is the whole of it.</text>
  <rect x="18" y="529" width="684" height="128" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="549" font-size="11.5" fill="#b06a10" font-weight="bold">ALTERNATION COSTS A DEGREE</text>
  <text x="40" y="573" font-size="11.5" fill="#333">The ordinary sum 1&#178; + 2&#178; + &#8943; + n&#178; = n(n+1)(2n+1)/6 is <tspan font-style="italic">cubic</tspan> in n. Alternating the signs</text>
  <text x="40" y="591" font-size="11.5" fill="#333">leaves magnitudes 1, 3, 6, 10, 15, &#8943; &#8212; only <tspan font-style="italic">quadratic</tspan>.</text>
  <text x="40" y="617" font-size="11.5" fill="#333">The same happens one degree down: &#8721;(&#8722;1)&#8305;&#8315;&#185; i has magnitudes 1, 1, 2, 2, 3, 3, &#8943;, linear rather than</text>
  <text x="40" y="635" font-size="11.5" fill="#333">quadratic. Cancellation between neighbouring terms removes exactly one power of n.</text>
</svg>