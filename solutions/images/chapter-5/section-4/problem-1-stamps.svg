<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 657" width="720" height="657" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="657" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="82" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">STRONG INDUCTION WITH THREE BASES</text>
  <text x="360" y="58" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">12 = 3&#183;4,   13 = 3&#183;2 + 7,   14 = 7&#183;2;   n = (n &#8722; 3) + 3 for n &#8805; 15</text>
  <text x="360" y="80" font-size="11.5" fill="#333" text-anchor="middle">The step reaches back 3, so it needs three consecutive bases. Verified for every n from 12 to 10000.</text>
  <text x="360" y="118" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">which amounts can be made from 3&#162; and 7&#162; stamps?</text><rect x="40.0" y="126" width="18.5" height="26" rx="3" fill="#e6f3e8" stroke="#1f6b34" stroke-width="1"/><text x="49.25" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><rect x="61.5" y="126" width="18.5" height="26" rx="3" fill="#fbeeee" stroke="#9b2c2c" stroke-width="1"/><text x="70.75" y="143" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">1</text><rect x="83.0" y="126" width="18.5" height="26" rx="3" fill="#fbeeee" stroke="#9b2c2c" stroke-width="1"/><text x="92.25" y="143" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">2</text><rect x="104.5" y="126" width="18.5" height="26" rx="3" fill="#e6f3e8" stroke="#1f6b34" stroke-width="1"/><text x="113.75" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">3</text><rect x="126.0" y="126" width="18.5" height="26" rx="3" fill="#fbeeee" stroke="#9b2c2c" stroke-width="1"/><text x="135.25" y="143" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">4</text><rect x="147.5" y="126" width="18.5" height="26" rx="3" fill="#fbeeee" stroke="#9b2c2c" stroke-width="1"/><text x="156.75" y="143" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">5</text><rect x="169.0" y="126" width="18.5" height="26" rx="3" fill="#e6f3e8" stroke="#1f6b34" stroke-width="1"/><text x="178.25" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">6</text><rect x="190.5" y="126" width="18.5" height="26" rx="3" fill="#e6f3e8" stroke="#1f6b34" stroke-width="1"/><text x="199.75" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">7</text><rect x="212.0" y="126" width="18.5" height="26" rx="3" fill="#fbeeee" stroke="#9b2c2c" stroke-width="1"/><text x="221.25" y="143" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">8</text><rect x="233.5" y="126" width="18.5" height="26" rx="3" fill="#e6f3e8" stroke="#1f6b34" stroke-width="1"/><text x="242.75" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">9</text><rect x="255.0" y="126" width="18.5" height="26" rx="3" fill="#e6f3e8" stroke="#1f6b34" stroke-width="1"/><text x="264.25" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">10</text><rect x="276.5" y="126" width="18.5" height="26" rx="3" fill="#fbeeee" stroke="#9b2c2c" stroke-width="1"/><text x="285.75" y="143" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">11</text><rect x="298.0" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="307.25" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">12</text><rect x="319.5" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="328.75" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">13</text><rect x="341.0" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="350.25" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">14</text><rect x="362.5" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="371.75" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">15</text><rect x="384.0" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="393.25" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">16</text><rect x="405.5" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="414.75" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">17</text><rect x="427.0" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="436.25" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">18</text><rect x="448.5" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="457.75" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">19</text><rect x="470.0" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="479.25" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">20</text><rect x="491.5" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="500.75" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">21</text><rect x="513.0" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="522.25" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">22</text><rect x="534.5" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="543.75" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">23</text><rect x="556.0" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="565.25" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">24</text><rect x="577.5" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="586.75" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">25</text><rect x="599.0" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="608.25" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">26</text><rect x="620.5" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="629.75" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">27</text><rect x="642.0" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="651.25" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">28</text><rect x="663.5" y="126" width="18.5" height="26" rx="3" fill="#d4ecd8" stroke="#1f6b34" stroke-width="1"/><text x="672.75" y="143" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">29</text><line x1="296.0" y1="122" x2="296.0" y2="166" stroke="#3b5b9b" stroke-width="1.6" stroke-dasharray="4,3"/><text x="40" y="170" font-size="10.5" fill="#9b2c2c">gaps: 1, 2, 4, 5, 8, 11 (six of them; the largest is 11)</text><text x="682.0" y="170" font-size="10.5" fill="#1f6b34" text-anchor="end">every amount from 12 on can be made &#8594;</text><rect x="22" y="190" width="676" height="232" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="360" y="211" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">three bases, then add a 3&#162; stamp: one chain per remainder mod 3</text><text x="38" y="250" font-size="10.5" fill="#3b5b9b" font-weight="bold">n &#8801; 0 (mod 3)</text><text x="38" y="265" font-size="9.5" fill="#777">basis 12</text><rect x="118" y="230" width="78" height="46" rx="5" fill="#fdf6ef" stroke="#3b5b9b" stroke-width="1.8"/><text x="157.0" y="249" font-size="13" fill="#3b5b9b" text-anchor="middle" font-weight="bold">12</text><text x="157.0" y="266" font-size="10" fill="#555" text-anchor="middle">3&#183;4 + 7&#183;0</text><line x1="199" y1="253.0" x2="212" y2="253.0" stroke="#3b5b9b" stroke-width="1.3"/><path d="M 208 249.0 L 213 253.0 L 208 257.0" fill="none" stroke="#3b5b9b" stroke-width="1.3"/><text x="206.0" y="247.0" font-size="9" fill="#3b5b9b" text-anchor="middle">+3</text><rect x="216" y="230" width="78" height="46" rx="5" fill="#f6f8fc" stroke="#3b5b9b" stroke-width="1"/><text x="255.0" y="249" font-size="13" fill="#3b5b9b" text-anchor="middle" font-weight="bold">15</text><text x="255.0" y="266" font-size="10" fill="#555" text-anchor="middle">3&#183;5 + 7&#183;0</text><line x1="297" y1="253.0" x2="310" y2="253.0" stroke="#3b5b9b" stroke-width="1.3"/><path d="M 306 249.0 L 311 253.0 L 306 257.0" fill="none" stroke="#3b5b9b" stroke-width="1.3"/><text x="304.0" y="247.0" font-size="9" fill="#3b5b9b" text-anchor="middle">+3</text><rect x="314" y="230" width="78" height="46" rx="5" fill="#f6f8fc" stroke="#3b5b9b" stroke-width="1"/><text x="353.0" y="249" font-size="13" fill="#3b5b9b" text-anchor="middle" font-weight="bold">18</text><text x="353.0" y="266" font-size="10" fill="#555" text-anchor="middle">3&#183;6 + 7&#183;0</text><line x1="395" y1="253.0" x2="408" y2="253.0" stroke="#3b5b9b" stroke-width="1.3"/><path d="M 404 249.0 L 409 253.0 L 404 257.0" fill="none" stroke="#3b5b9b" stroke-width="1.3"/><text x="402.0" y="247.0" font-size="9" fill="#3b5b9b" text-anchor="middle">+3</text><rect x="412" y="230" width="78" height="46" rx="5" fill="#f6f8fc" stroke="#3b5b9b" stroke-width="1"/><text x="451.0" y="249" font-size="13" fill="#3b5b9b" text-anchor="middle" font-weight="bold">21</text><text x="451.0" y="266" font-size="10" fill="#555" text-anchor="middle">3&#183;7 + 7&#183;0</text><line x1="493" y1="253.0" x2="506" y2="253.0" stroke="#3b5b9b" stroke-width="1.3"/><path d="M 502 249.0 L 507 253.0 L 502 257.0" fill="none" stroke="#3b5b9b" stroke-width="1.3"/><text x="500.0" y="247.0" font-size="9" fill="#3b5b9b" text-anchor="middle">+3</text><rect x="510" y="230" width="78" height="46" rx="5" fill="#f6f8fc" stroke="#3b5b9b" stroke-width="1"/><text x="549.0" y="249" font-size="13" fill="#3b5b9b" text-anchor="middle" font-weight="bold">24</text><text x="549.0" y="266" font-size="10" fill="#555" text-anchor="middle">3&#183;8 + 7&#183;0</text><line x1="591" y1="253.0" x2="604" y2="253.0" stroke="#3b5b9b" stroke-width="1.3"/><path d="M 600 249.0 L 605 253.0 L 600 257.0" fill="none" stroke="#3b5b9b" stroke-width="1.3"/><text x="598.0" y="247.0" font-size="9" fill="#3b5b9b" text-anchor="middle">+3</text><rect x="608" y="230" width="78" height="46" rx="5" fill="#f6f8fc" stroke="#3b5b9b" stroke-width="1"/><text x="647.0" y="249" font-size="13" fill="#3b5b9b" text-anchor="middle" font-weight="bold">27</text><text x="647.0" y="266" font-size="10" fill="#555" text-anchor="middle">3&#183;9 + 7&#183;0</text><text x="38" y="312" font-size="10.5" fill="#b06a10" font-weight="bold">n &#8801; 1 (mod 3)</text><text x="38" y="327" font-size="9.5" fill="#777">basis 13</text><rect x="118" y="292" width="78" height="46" rx="5" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.8"/><text x="157.0" y="311" font-size="13" fill="#b06a10" text-anchor="middle" font-weight="bold">13</text><text x="157.0" y="328" font-size="10" fill="#555" text-anchor="middle">3&#183;2 + 7&#183;1</text><line x1="199" y1="315.0" x2="212" y2="315.0" stroke="#b06a10" stroke-width="1.3"/><path d="M 208 311.0 L 213 315.0 L 208 319.0" fill="none" stroke="#b06a10" stroke-width="1.3"/><text x="206.0" y="309.0" font-size="9" fill="#b06a10" text-anchor="middle">+3</text><rect x="216" y="292" width="78" height="46" rx="5" fill="#f6f8fc" stroke="#b06a10" stroke-width="1"/><text x="255.0" y="311" font-size="13" fill="#b06a10" text-anchor="middle" font-weight="bold">16</text><text x="255.0" y="328" font-size="10" fill="#555" text-anchor="middle">3&#183;3 + 7&#183;1</text><line x1="297" y1="315.0" x2="310" y2="315.0" stroke="#b06a10" stroke-width="1.3"/><path d="M 306 311.0 L 311 315.0 L 306 319.0" fill="none" stroke="#b06a10" stroke-width="1.3"/><text x="304.0" y="309.0" font-size="9" fill="#b06a10" text-anchor="middle">+3</text><rect x="314" y="292" width="78" height="46" rx="5" fill="#f6f8fc" stroke="#b06a10" stroke-width="1"/><text x="353.0" y="311" font-size="13" fill="#b06a10" text-anchor="middle" font-weight="bold">19</text><text x="353.0" y="328" font-size="10" fill="#555" text-anchor="middle">3&#183;4 + 7&#183;1</text><line x1="395" y1="315.0" x2="408" y2="315.0" stroke="#b06a10" stroke-width="1.3"/><path d="M 404 311.0 L 409 315.0 L 404 319.0" fill="none" stroke="#b06a10" stroke-width="1.3"/><text x="402.0" y="309.0" font-size="9" fill="#b06a10" text-anchor="middle">+3</text><rect x="412" y="292" width="78" height="46" rx="5" fill="#f6f8fc" stroke="#b06a10" stroke-width="1"/><text x="451.0" y="311" font-size="13" fill="#b06a10" text-anchor="middle" font-weight="bold">22</text><text x="451.0" y="328" font-size="10" fill="#555" text-anchor="middle">3&#183;5 + 7&#183;1</text><line x1="493" y1="315.0" x2="506" y2="315.0" stroke="#b06a10" stroke-width="1.3"/><path d="M 502 311.0 L 507 315.0 L 502 319.0" fill="none" stroke="#b06a10" stroke-width="1.3"/><text x="500.0" y="309.0" font-size="9" fill="#b06a10" text-anchor="middle">+3</text><rect x="510" y="292" width="78" height="46" rx="5" fill="#f6f8fc" stroke="#b06a10" stroke-width="1"/><text x="549.0" y="311" font-size="13" fill="#b06a10" text-anchor="middle" font-weight="bold">25</text><text x="549.0" y="328" font-size="10" fill="#555" text-anchor="middle">3&#183;6 + 7&#183;1</text><line x1="591" y1="315.0" x2="604" y2="315.0" stroke="#b06a10" stroke-width="1.3"/><path d="M 600 311.0 L 605 315.0 L 600 319.0" fill="none" stroke="#b06a10" stroke-width="1.3"/><text x="598.0" y="309.0" font-size="9" fill="#b06a10" text-anchor="middle">+3</text><rect x="608" y="292" width="78" height="46" rx="5" fill="#f6f8fc" stroke="#b06a10" stroke-width="1"/><text x="647.0" y="311" font-size="13" fill="#b06a10" text-anchor="middle" font-weight="bold">28</text><text x="647.0" y="328" font-size="10" fill="#555" text-anchor="middle">3&#183;7 + 7&#183;1</text><text x="38" y="374" font-size="10.5" fill="#1f6b34" font-weight="bold">n &#8801; 2 (mod 3)</text><text x="38" y="389" font-size="9.5" fill="#777">basis 14</text><rect x="118" y="354" width="78" height="46" rx="5" fill="#fdf6ef" stroke="#1f6b34" stroke-width="1.8"/><text x="157.0" y="373" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">14</text><text x="157.0" y="390" font-size="10" fill="#555" text-anchor="middle">3&#183;0 + 7&#183;2</text><line x1="199" y1="377.0" x2="212" y2="377.0" stroke="#1f6b34" stroke-width="1.3"/><path d="M 208 373.0 L 213 377.0 L 208 381.0" fill="none" stroke="#1f6b34" stroke-width="1.3"/><text x="206.0" y="371.0" font-size="9" fill="#1f6b34" text-anchor="middle">+3</text><rect x="216" y="354" width="78" height="46" rx="5" fill="#f6f8fc" stroke="#1f6b34" stroke-width="1"/><text x="255.0" y="373" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">17</text><text x="255.0" y="390" font-size="10" fill="#555" text-anchor="middle">3&#183;1 + 7&#183;2</text><line x1="297" y1="377.0" x2="310" y2="377.0" stroke="#1f6b34" stroke-width="1.3"/><path d="M 306 373.0 L 311 377.0 L 306 381.0" fill="none" stroke="#1f6b34" stroke-width="1.3"/><text x="304.0" y="371.0" font-size="9" fill="#1f6b34" text-anchor="middle">+3</text><rect x="314" y="354" width="78" height="46" rx="5" fill="#f6f8fc" stroke="#1f6b34" stroke-width="1"/><text x="353.0" y="373" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">20</text><text x="353.0" y="390" font-size="10" fill="#555" text-anchor="middle">3&#183;2 + 7&#183;2</text><line x1="395" y1="377.0" x2="408" y2="377.0" stroke="#1f6b34" stroke-width="1.3"/><path d="M 404 373.0 L 409 377.0 L 404 381.0" fill="none" stroke="#1f6b34" stroke-width="1.3"/><text x="402.0" y="371.0" font-size="9" fill="#1f6b34" text-anchor="middle">+3</text><rect x="412" y="354" width="78" height="46" rx="5" fill="#f6f8fc" stroke="#1f6b34" stroke-width="1"/><text x="451.0" y="373" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">23</text><text x="451.0" y="390" font-size="10" fill="#555" text-anchor="middle">3&#183;3 + 7&#183;2</text><line x1="493" y1="377.0" x2="506" y2="377.0" stroke="#1f6b34" stroke-width="1.3"/><path d="M 502 373.0 L 507 377.0 L 502 381.0" fill="none" stroke="#1f6b34" stroke-width="1.3"/><text x="500.0" y="371.0" font-size="9" fill="#1f6b34" text-anchor="middle">+3</text><rect x="510" y="354" width="78" height="46" rx="5" fill="#f6f8fc" stroke="#1f6b34" stroke-width="1"/><text x="549.0" y="373" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">26</text><text x="549.0" y="390" font-size="10" fill="#555" text-anchor="middle">3&#183;4 + 7&#183;2</text><line x1="591" y1="377.0" x2="604" y2="377.0" stroke="#1f6b34" stroke-width="1.3"/><path d="M 600 373.0 L 605 377.0 L 600 381.0" fill="none" stroke="#1f6b34" stroke-width="1.3"/><text x="598.0" y="371.0" font-size="9" fill="#1f6b34" text-anchor="middle">+3</text><rect x="608" y="354" width="78" height="46" rx="5" fill="#f6f8fc" stroke="#1f6b34" stroke-width="1"/><text x="647.0" y="373" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">29</text><text x="647.0" y="390" font-size="10" fill="#555" text-anchor="middle">3&#183;5 + 7&#183;2</text>
  <rect x="18" y="436" width="684" height="96" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="456" font-size="11.5" fill="#1f6b34" font-weight="bold">THE FROBENIUS NUMBER: 3 &#183; 7 &#8722; 3 &#8722; 7 = 11</text>
  <text x="40" y="482" font-size="11.5" fill="#333">Sylvester (1884): for coprime a, b the largest amount that cannot be made is ab &#8722; a &#8722; b, and exactly</text>
  <text x="40" y="502" font-size="11.5" fill="#333">(a &#8722; 1)(b &#8722; 1)/2 amounts cannot be made. Here: 11, and six gaps. For 0 &#8804; n &#8804; 11, n is makeable iff 11 &#8722; n is not.</text>
  <rect x="18" y="545" width="684" height="96" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="565" font-size="11.5" fill="#b06a10" font-weight="bold">ORDINARY INDUCTION WORKS TOO</text>
  <text x="40" y="591" font-size="11.5" fill="#333">To go from n to n + 1: if there are two 3&#162; stamps, swap them for one 7&#162; (7 &#8722; 6 = 1); otherwise there are</text>
  <text x="40" y="611" font-size="11.5" fill="#333">at least two 7&#162; stamps (when n &#8805; 12), so swap them for five 3&#162; (15 &#8722; 14 = 1). Checked for n up to 3000.</text>
</svg>