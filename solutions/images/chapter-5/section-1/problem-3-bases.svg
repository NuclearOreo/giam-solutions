<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 710" width="720" height="710" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="710" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="88" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">ALL FOUR BASES ARE TRUE &#8212; AND ALL FOUR ARE ABOUT NOTHING</text>
  <text x="360" y="59" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="bold">at n = 0 each claim is an empty sum, an empty board, or an empty set of coins</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">Every basis below was checked by machine; the tiling was checked at every removal square up to 16&#215;16.</text>
  <rect x="18" y="118" width="684" height="166" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/><rect x="18" y="118" width="684" height="30" rx="6" fill="#eef2fa"/><rect x="18" y="140" width="684" height="8" fill="#eef2fa"/><line x1="18" y1="148" x2="702" y2="148" stroke="#3b5b9b" stroke-width="1.2"/><text x="44" y="138" font-size="10.5" fill="#3b5b9b" text-anchor="start" font-weight="bold">THEOREM</text><text x="300" y="138" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">BASIS AT n = 0</text><text x="560" y="138" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">BASIS AT n = 1</text><line x1="180" y1="118" x2="180" y2="284" stroke="#ddd" stroke-width="1"/><line x1="430" y1="118" x2="430" y2="284" stroke="#ddd" stroke-width="1"/><text x="44" y="173" font-size="11" fill="#1f3a68">a&#160; sum of first n</text><text x="300" y="173" font-size="11" fill="#1f6b34" text-anchor="middle">empty sum 0 = (0&#178;+0)/2</text><text x="560" y="173" font-size="11" fill="#1f6b34" text-anchor="middle">1 = (1&#178;+1)/2</text><rect x="19" y="182" width="682" height="30" fill="#fafafa"/><text x="44" y="203" font-size="11" fill="#1f3a68">b&#160; sum of first n odds</text><text x="300" y="203" font-size="11" fill="#1f6b34" text-anchor="middle">empty sum 0 = 0&#178;</text><text x="560" y="203" font-size="11" fill="#1f6b34" text-anchor="middle">1 = 1&#178;</text><text x="44" y="233" font-size="11" fill="#1f3a68">c&#160; all n coins heads</text><text x="300" y="233" font-size="11" fill="#1f6b34" text-anchor="middle">P = 1 = 1/2&#8304;&#160;&#160;(vacuous)</text><text x="560" y="233" font-size="11" fill="#1f6b34" text-anchor="middle">P = 1/2 = 1/2&#185;</text><rect x="19" y="242" width="682" height="30" fill="#fafafa"/><text x="44" y="263" font-size="11" fill="#1f3a68">d&#160; tile 2&#8319;&#215;2&#8319; minus one</text><text x="300" y="263" font-size="11" fill="#1f6b34" text-anchor="middle">1&#215;1 board, empty, 0 pieces</text><text x="560" y="263" font-size="11" fill="#1f6b34" text-anchor="middle">2&#215;2 minus one = one L</text><text x="44" y="185" font-size="11" fill="#1f3a68">&#160;&#160;&#160; positive integers</text><rect x="18" y="300" width="684" height="228" rx="6" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="360" y="321" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the basis, and the step it feeds</text><text x="172.0" y="348" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">n = 0</text><rect x="150" y="358" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="3 2"/><text x="172.0" y="384.0" font-size="11" fill="#999" text-anchor="middle">&#215;</text><line x1="150" y1="358" x2="194" y2="358" stroke="#666" stroke-width="0.7"/><line x1="150" y1="402" x2="194" y2="402" stroke="#666" stroke-width="0.7"/><line x1="150" y1="358" x2="150" y2="402" stroke="#666" stroke-width="0.7"/><line x1="194" y1="358" x2="194" y2="402" stroke="#666" stroke-width="0.7"/><text x="172.0" y="420" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">1&#215;1 board, square removed: nothing left, 0 pieces</text><text x="344.0" y="348" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">n = 1</text><rect x="344" y="358" width="44" height="44" fill="#3b5b9b" fill-opacity="0.45" stroke="#3b5b9b" stroke-width="1.4"/><rect x="300" y="402" width="44" height="44" fill="#3b5b9b" fill-opacity="0.45" stroke="#3b5b9b" stroke-width="1.4"/><rect x="344" y="402" width="44" height="44" fill="#3b5b9b" fill-opacity="0.45" stroke="#3b5b9b" stroke-width="1.4"/><rect x="300" y="358" width="44" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="3 2"/><text x="322.0" y="384.0" font-size="11" fill="#999" text-anchor="middle">&#215;</text><line x1="300" y1="358" x2="388" y2="358" stroke="#666" stroke-width="0.7"/><line x1="300" y1="402" x2="388" y2="402" stroke="#666" stroke-width="0.7"/><line x1="300" y1="446" x2="388" y2="446" stroke="#666" stroke-width="0.7"/><line x1="300" y1="358" x2="300" y2="446" stroke="#666" stroke-width="0.7"/><line x1="344" y1="358" x2="344" y2="446" stroke="#666" stroke-width="0.7"/><line x1="388" y1="358" x2="388" y2="446" stroke="#666" stroke-width="0.7"/><text x="344.0" y="464" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">2&#215;2 minus one square is exactly one L</text><text x="538.0" y="348" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">n = 2</text><rect x="504" y="392" width="34" height="34" fill="#3b5b9b" fill-opacity="0.45" stroke="#3b5b9b" stroke-width="1.4"/><rect x="504" y="426" width="34" height="34" fill="#3b5b9b" fill-opacity="0.45" stroke="#3b5b9b" stroke-width="1.4"/><rect x="538" y="426" width="34" height="34" fill="#3b5b9b" fill-opacity="0.45" stroke="#3b5b9b" stroke-width="1.4"/><rect x="470" y="358" width="34" height="34" fill="#9b2c2c" fill-opacity="0.45" stroke="#9b2c2c" stroke-width="1.4"/><rect x="504" y="358" width="34" height="34" fill="#9b2c2c" fill-opacity="0.45" stroke="#9b2c2c" stroke-width="1.4"/><rect x="470" y="392" width="34" height="34" fill="#9b2c2c" fill-opacity="0.45" stroke="#9b2c2c" stroke-width="1.4"/><rect x="538" y="358" width="34" height="34" fill="#1f6b34" fill-opacity="0.45" stroke="#1f6b34" stroke-width="1.4"/><rect x="572" y="358" width="34" height="34" fill="#1f6b34" fill-opacity="0.45" stroke="#1f6b34" stroke-width="1.4"/><rect x="572" y="392" width="34" height="34" fill="#1f6b34" fill-opacity="0.45" stroke="#1f6b34" stroke-width="1.4"/><rect x="470" y="426" width="34" height="34" fill="#b06a10" fill-opacity="0.45" stroke="#b06a10" stroke-width="1.4"/><rect x="470" y="460" width="34" height="34" fill="#b06a10" fill-opacity="0.45" stroke="#b06a10" stroke-width="1.4"/><rect x="504" y="460" width="34" height="34" fill="#b06a10" fill-opacity="0.45" stroke="#b06a10" stroke-width="1.4"/><rect x="572" y="426" width="34" height="34" fill="#7a4fa3" fill-opacity="0.45" stroke="#7a4fa3" stroke-width="1.4"/><rect x="538" y="460" width="34" height="34" fill="#7a4fa3" fill-opacity="0.45" stroke="#7a4fa3" stroke-width="1.4"/><rect x="572" y="460" width="34" height="34" fill="#7a4fa3" fill-opacity="0.45" stroke="#7a4fa3" stroke-width="1.4"/><rect x="538" y="392" width="34" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="3 2"/><text x="555.0" y="413.0" font-size="11" fill="#999" text-anchor="middle">&#215;</text><line x1="470" y1="358" x2="606" y2="358" stroke="#666" stroke-width="0.7"/><line x1="470" y1="392" x2="606" y2="392" stroke="#666" stroke-width="0.7"/><line x1="470" y1="426" x2="606" y2="426" stroke="#666" stroke-width="0.7"/><line x1="470" y1="460" x2="606" y2="460" stroke="#666" stroke-width="0.7"/><line x1="470" y1="494" x2="606" y2="494" stroke="#666" stroke-width="0.7"/><line x1="470" y1="358" x2="470" y2="494" stroke="#666" stroke-width="0.7"/><line x1="504" y1="358" x2="504" y2="494" stroke="#666" stroke-width="0.7"/><line x1="538" y1="358" x2="538" y2="494" stroke="#666" stroke-width="0.7"/><line x1="572" y1="358" x2="572" y2="494" stroke="#666" stroke-width="0.7"/><line x1="606" y1="358" x2="606" y2="494" stroke="#666" stroke-width="0.7"/><text x="538.0" y="512" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">5 pieces &#8212; the step in action</text>
  <rect x="18" y="544" width="684" height="150" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="564" font-size="11.5" fill="#1f6b34" font-weight="bold">&#8220;IF NO COINS ARE FLIPPED, ALL OF THEM ARE HEADS&#8221; &#8212; DOES THAT MAKE SENSE?</text>
  <text x="40" y="588" font-size="11.5" fill="#333">Yes. &#8220;All of them are heads&#8221; means &#8220;no coin shows tails&#8221;, and with no coins there is nothing to</text>
  <text x="40" y="606" font-size="11.5" fill="#333">show tails. The statement is <tspan font-style="italic">vacuously true</tspan> &#8212; the same reading that made &#8709; &#8838; B hold in 4.2.</text>
  <text x="40" y="632" font-size="11.5" fill="#333">The probability model agrees: flipping 0 coins has exactly one outcome, the empty sequence, and it</text>
  <text x="40" y="650" font-size="11.5" fill="#333">satisfies the condition. So P = 1/1 = 1, matching 1/2&#8304; = 1. Confirmed by enumerating the sample</text>
  <text x="40" y="668" font-size="11.5" fill="#333">space for n = 0, 1, 2, 3.</text>
  <text x="40" y="688" font-size="11" fill="#555">The discomfort is with the word &#8220;certain&#8221;, not with the mathematics: nothing can go wrong when there is nothing to go wrong.</text>
</svg>