<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 661" width="720" height="661" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="661" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="82" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">A STEP OF TWO REACHES ONLY HALF THE NUMBERS</text>
  <text x="360" y="58" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="bold">from 0 the chain runs 0 &#8594; 2 &#8594; 4 &#8594; 6 &#8594; &#8230; and never lands on an odd number</text>
  <text x="360" y="79" font-size="11.5" fill="#333" text-anchor="middle">Adding P(1) as a second basis starts the other chain, and together they cover everything.</text>
  <text x="360.0" y="116" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">basis P(0) only, step k &#8594; k+2</text><circle cx="70.0" cy="150" r="9" fill="#9b2c2c" stroke="#9b2c2c" stroke-width="1.8"/><text x="70.0" y="176" font-size="10.5" fill="#9b2c2c" text-anchor="middle">0</text><text x="70.0" y="132" font-size="9.5" fill="#b06a10" text-anchor="middle" font-weight="bold">basis</text><circle cx="118.3" cy="150" r="7" fill="#ffffff" stroke="#ccc" stroke-width="1.8"/><text x="118.3" y="176" font-size="10.5" fill="#bbb" text-anchor="middle">1</text><circle cx="166.7" cy="150" r="9" fill="#9b2c2c" stroke="#9b2c2c" stroke-width="1.8"/><text x="166.7" y="176" font-size="10.5" fill="#9b2c2c" text-anchor="middle">2</text><circle cx="215.0" cy="150" r="7" fill="#ffffff" stroke="#ccc" stroke-width="1.8"/><text x="215.0" y="176" font-size="10.5" fill="#bbb" text-anchor="middle">3</text><circle cx="263.3" cy="150" r="9" fill="#9b2c2c" stroke="#9b2c2c" stroke-width="1.8"/><text x="263.3" y="176" font-size="10.5" fill="#9b2c2c" text-anchor="middle">4</text><circle cx="311.7" cy="150" r="7" fill="#ffffff" stroke="#ccc" stroke-width="1.8"/><text x="311.7" y="176" font-size="10.5" fill="#bbb" text-anchor="middle">5</text><circle cx="360.0" cy="150" r="9" fill="#9b2c2c" stroke="#9b2c2c" stroke-width="1.8"/><text x="360.0" y="176" font-size="10.5" fill="#9b2c2c" text-anchor="middle">6</text><circle cx="408.3" cy="150" r="7" fill="#ffffff" stroke="#ccc" stroke-width="1.8"/><text x="408.3" y="176" font-size="10.5" fill="#bbb" text-anchor="middle">7</text><circle cx="456.7" cy="150" r="9" fill="#9b2c2c" stroke="#9b2c2c" stroke-width="1.8"/><text x="456.7" y="176" font-size="10.5" fill="#9b2c2c" text-anchor="middle">8</text><circle cx="505.0" cy="150" r="7" fill="#ffffff" stroke="#ccc" stroke-width="1.8"/><text x="505.0" y="176" font-size="10.5" fill="#bbb" text-anchor="middle">9</text><circle cx="553.3" cy="150" r="9" fill="#9b2c2c" stroke="#9b2c2c" stroke-width="1.8"/><text x="553.3" y="176" font-size="10.5" fill="#9b2c2c" text-anchor="middle">10</text><circle cx="601.7" cy="150" r="7" fill="#ffffff" stroke="#ccc" stroke-width="1.8"/><text x="601.7" y="176" font-size="10.5" fill="#bbb" text-anchor="middle">11</text><circle cx="650.0" cy="150" r="9" fill="#9b2c2c" stroke="#9b2c2c" stroke-width="1.8"/><text x="650.0" y="176" font-size="10.5" fill="#9b2c2c" text-anchor="middle">12</text><path d="M 70.0 139 Q 118.3 116 166.7 139" fill="none" stroke="#9b2c2c" stroke-width="1.4" opacity="0.65"/><path d="M 166.7 139 Q 215.0 116 263.3 139" fill="none" stroke="#9b2c2c" stroke-width="1.4" opacity="0.65"/><path d="M 263.3 139 Q 311.7 116 360.0 139" fill="none" stroke="#9b2c2c" stroke-width="1.4" opacity="0.65"/><path d="M 360.0 139 Q 408.3 116 456.7 139" fill="none" stroke="#9b2c2c" stroke-width="1.4" opacity="0.65"/><path d="M 456.7 139 Q 505.0 116 553.3 139" fill="none" stroke="#9b2c2c" stroke-width="1.4" opacity="0.65"/><path d="M 553.3 139 Q 601.7 116 650.0 139" fill="none" stroke="#9b2c2c" stroke-width="1.4" opacity="0.65"/><text x="360.0" y="198" font-size="11" fill="#555" text-anchor="middle" font-style="italic">the odd numbers are never reached &#8212; nothing ever proves P(1)</text><text x="360.0" y="226" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">bases P(0) and P(1), same step</text><circle cx="70.0" cy="260" r="9" fill="#1f6b34" stroke="#1f6b34" stroke-width="1.8"/><text x="70.0" y="286" font-size="10.5" fill="#1f6b34" text-anchor="middle">0</text><text x="70.0" y="242" font-size="9.5" fill="#b06a10" text-anchor="middle" font-weight="bold">basis</text><circle cx="118.3" cy="260" r="9" fill="#1f6b34" stroke="#1f6b34" stroke-width="1.8"/><text x="118.3" y="286" font-size="10.5" fill="#1f6b34" text-anchor="middle">1</text><text x="118.3" y="242" font-size="9.5" fill="#b06a10" text-anchor="middle" font-weight="bold">basis</text><circle cx="166.7" cy="260" r="9" fill="#1f6b34" stroke="#1f6b34" stroke-width="1.8"/><text x="166.7" y="286" font-size="10.5" fill="#1f6b34" text-anchor="middle">2</text><circle cx="215.0" cy="260" r="9" fill="#1f6b34" stroke="#1f6b34" stroke-width="1.8"/><text x="215.0" y="286" font-size="10.5" fill="#1f6b34" text-anchor="middle">3</text><circle cx="263.3" cy="260" r="9" fill="#1f6b34" stroke="#1f6b34" stroke-width="1.8"/><text x="263.3" y="286" font-size="10.5" fill="#1f6b34" text-anchor="middle">4</text><circle cx="311.7" cy="260" r="9" fill="#1f6b34" stroke="#1f6b34" stroke-width="1.8"/><text x="311.7" y="286" font-size="10.5" fill="#1f6b34" text-anchor="middle">5</text><circle cx="360.0" cy="260" r="9" fill="#1f6b34" stroke="#1f6b34" stroke-width="1.8"/><text x="360.0" y="286" font-size="10.5" fill="#1f6b34" text-anchor="middle">6</text><circle cx="408.3" cy="260" r="9" fill="#1f6b34" stroke="#1f6b34" stroke-width="1.8"/><text x="408.3" y="286" font-size="10.5" fill="#1f6b34" text-anchor="middle">7</text><circle cx="456.7" cy="260" r="9" fill="#1f6b34" stroke="#1f6b34" stroke-width="1.8"/><text x="456.7" y="286" font-size="10.5" fill="#1f6b34" text-anchor="middle">8</text><circle cx="505.0" cy="260" r="9" fill="#1f6b34" stroke="#1f6b34" stroke-width="1.8"/><text x="505.0" y="286" font-size="10.5" fill="#1f6b34" text-anchor="middle">9</text><circle cx="553.3" cy="260" r="9" fill="#1f6b34" stroke="#1f6b34" stroke-width="1.8"/><text x="553.3" y="286" font-size="10.5" fill="#1f6b34" text-anchor="middle">10</text><circle cx="601.7" cy="260" r="9" fill="#1f6b34" stroke="#1f6b34" stroke-width="1.8"/><text x="601.7" y="286" font-size="10.5" fill="#1f6b34" text-anchor="middle">11</text><circle cx="650.0" cy="260" r="9" fill="#1f6b34" stroke="#1f6b34" stroke-width="1.8"/><text x="650.0" y="286" font-size="10.5" fill="#1f6b34" text-anchor="middle">12</text><path d="M 70.0 249 Q 118.3 226 166.7 249" fill="none" stroke="#1f6b34" stroke-width="1.4" opacity="0.65"/><path d="M 118.3 249 Q 166.7 226 215.0 249" fill="none" stroke="#1f6b34" stroke-width="1.4" opacity="0.65"/><path d="M 166.7 249 Q 215.0 226 263.3 249" fill="none" stroke="#1f6b34" stroke-width="1.4" opacity="0.65"/><path d="M 215.0 249 Q 263.3 226 311.7 249" fill="none" stroke="#1f6b34" stroke-width="1.4" opacity="0.65"/><path d="M 263.3 249 Q 311.7 226 360.0 249" fill="none" stroke="#1f6b34" stroke-width="1.4" opacity="0.65"/><path d="M 311.7 249 Q 360.0 226 408.3 249" fill="none" stroke="#1f6b34" stroke-width="1.4" opacity="0.65"/><path d="M 360.0 249 Q 408.3 226 456.7 249" fill="none" stroke="#1f6b34" stroke-width="1.4" opacity="0.65"/><path d="M 408.3 249 Q 456.7 226 505.0 249" fill="none" stroke="#1f6b34" stroke-width="1.4" opacity="0.65"/><path d="M 456.7 249 Q 505.0 226 553.3 249" fill="none" stroke="#1f6b34" stroke-width="1.4" opacity="0.65"/><path d="M 505.0 249 Q 553.3 226 601.7 249" fill="none" stroke="#1f6b34" stroke-width="1.4" opacity="0.65"/><path d="M 553.3 249 Q 601.7 226 650.0 249" fill="none" stroke="#1f6b34" stroke-width="1.4" opacity="0.65"/><text x="360.0" y="308" font-size="11" fill="#555" text-anchor="middle" font-style="italic">two interleaved chains now cover every natural number</text>
  <rect x="18" y="336" width="684" height="140" rx="6" fill="#fdecec" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="356" font-size="11.5" fill="#9b2c2c" font-weight="bold">A PREDICATE THAT PASSES BOTH TESTS AND IS STILL FALSE</text>
  <text x="360" y="384" font-size="13.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">P(n): &#8220;n is even&#8221;</text>
  <text x="40" y="412" font-size="11.5" fill="#333">P(0) is true, and P(k) &#8658; P(k+2) holds for every k &#8212; checked to k = 5000. Yet P(1), P(3), P(5), &#8230;</text>
  <text x="40" y="430" font-size="11.5" fill="#333">are all false. So the two hypotheses can both be met while the conclusion fails at every odd number:</text>
  <text x="40" y="448" font-size="11.5" fill="#333">the rule is not merely incomplete, it is <tspan font-style="italic">unsound</tspan>.</text>
  <text x="40" y="468" font-size="11" fill="#555">With the repaired scheme this predicate is caught at once, because the second basis P(1) is simply false.</text>
  <rect x="18" y="489" width="684" height="156" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="509" font-size="11.5" fill="#1f6b34" font-weight="bold">THE GENERAL RULE, AND WHY THE USUAL PROOF OF INDUCTION FAILS HERE</text>
  <text x="40" y="533" font-size="11.5" fill="#333">A step of size d needs d bases, namely P(0), P(1), &#8230;, P(d&#8722;1). Verified for d = 1 to 5: the full set</text>
  <text x="40" y="551" font-size="11.5" fill="#333">of bases covers every n, and dropping one always leaves a whole residue class uncovered.</text>
  <text x="40" y="577" font-size="11.5" fill="#333">The reason is visible in the least-counterexample argument. If P fails somewhere, let m be least.</text>
  <text x="40" y="595" font-size="11.5" fill="#333">Ordinary induction uses P(m&#8722;1), which is available because m &#8805; 1. A step of 2 needs P(m&#8722;2),</text>
  <text x="40" y="613" font-size="11.5" fill="#333">and for m = 1 that is P(&#8722;1) &#8212; not a natural number at all. So m = 1 is never challenged, which is</text>
  <text x="40" y="631" font-size="11.5" fill="#333">exactly where the counterexample above puts it.</text>
</svg>