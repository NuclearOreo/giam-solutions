<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="560" fill="white"/>

  <text x="350" y="22" font-size="12.5" font-style="italic" fill="#444" text-anchor="middle">Bracket x between consecutive integers, negate the whole chain, and read off the new floor.</text>

  <!-- step 1: x strictly between -->
  <text x="55" y="76" font-size="12" font-weight="bold" fill="#2a5db0">x</text>
  <line x1="120" y1="72" x2="600" y2="72" stroke="#666" stroke-width="1.2"/>
  <circle cx="240" cy="72" r="5" fill="#2a5db0"/>
  <circle cx="440" cy="72" r="5" fill="#2a5db0"/>
  <rect x="240" y="66" width="200" height="12" fill="#cfe0f5"/>
  <circle cx="330" cy="72" r="4.5" fill="#8a3b12"/>
  <text x="240" y="98" font-size="12" fill="#222" text-anchor="middle">n</text>
  <text x="440" y="98" font-size="12" fill="#222" text-anchor="middle">n + 1</text>
  <text x="330" y="56" font-size="11.5" fill="#8a3b12" text-anchor="middle">x</text>
  <text x="620" y="76" font-size="11" fill="#2a5db0">n &lt; x &lt; n + 1</text>
  <text x="350" y="116" font-size="10.5" font-style="italic" fill="#666" text-anchor="middle">both inequalities are strict, because x ∉ ℤ rules out x = n</text>

  <!-- step 2: negate -->
  <text x="350" y="142" font-size="12" fill="#8a3b12" text-anchor="middle" font-weight="bold">multiply by −1  —  negative, so every inequality REVERSES</text>
  <text x="350" y="160" font-size="16" fill="#999" text-anchor="middle">↓</text>

  <text x="45" y="196" font-size="12" font-weight="bold" fill="#1b5e20">−x</text>
  <line x1="120" y1="192" x2="600" y2="192" stroke="#666" stroke-width="1.2"/>
  <circle cx="240" cy="192" r="5" fill="#1b5e20"/>
  <circle cx="440" cy="192" r="5" fill="#1b5e20"/>
  <rect x="240" y="186" width="200" height="12" fill="#cfe6cf"/>
  <circle cx="350" cy="192" r="4.5" fill="#8a3b12"/>
  <text x="240" y="218" font-size="12" fill="#222" text-anchor="middle">−n − 1</text>
  <text x="440" y="218" font-size="12" fill="#222" text-anchor="middle">−n</text>
  <text x="350" y="176" font-size="11.5" fill="#8a3b12" text-anchor="middle">−x</text>
  <text x="620" y="196" font-size="11" fill="#1b5e20">−n−1 &lt; −x &lt; −n</text>

  <!-- read off -->
  <rect x="24" y="238" width="652" height="76" fill="#dfeadd" stroke="#8ab88a" stroke-width="1.5"/>
  <text x="350" y="258" font-size="11.5" fill="#222" text-anchor="middle">so  −n−1 ≤ −x &lt; (−n−1) + 1,  which by the floor characterisation gives</text>
  <text x="350" y="282" font-size="14" fill="#1b5e20" text-anchor="middle" font-weight="bold">⌊−x⌋ = −n − 1</text>
  <text x="350" y="304" font-size="13" fill="#222" text-anchor="middle">⌊x⌋ + ⌊−x⌋ = n + (−n − 1) = <tspan font-weight="bold">−1</tspan>   ∎</text>

  <!-- the integer case -->
  <text x="350" y="348" font-size="12.5" font-weight="bold" fill="#222" text-anchor="middle">Why the hypothesis x ∉ ℤ cannot be dropped</text>

  <g font-size="11.5" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="140" y="374">x</text>
    <text x="280" y="374">⌊x⌋</text>
    <text x="410" y="374">⌊−x⌋</text>
    <text x="550" y="374">sum</text>
  </g>
  <line x1="80" y1="382" x2="630" y2="382" stroke="#999" stroke-width="0.9"/>
  <g font-size="11.5" text-anchor="middle">
    <rect x="80" y="390" width="550" height="22" fill="#dfeadd"/>
    <text x="140" y="406">3.5</text><text x="280" y="406">3</text><text x="410" y="406">−4</text><text x="550" y="406" fill="#1b5e20" font-weight="bold">−1</text>
    <rect x="80" y="414" width="550" height="22" fill="#dfeadd"/>
    <text x="140" y="430">−0.75</text><text x="280" y="430">−1</text><text x="410" y="430">0</text><text x="550" y="430" fill="#1b5e20" font-weight="bold">−1</text>
    <rect x="80" y="438" width="550" height="22" fill="#fbe4da"/>
    <text x="140" y="454">2</text><text x="280" y="454">2</text><text x="410" y="454">−2</text><text x="550" y="454" fill="#8a3b12" font-weight="bold">0</text>
    <rect x="80" y="462" width="550" height="22" fill="#fbe4da"/>
    <text x="140" y="478">0</text><text x="280" y="478">0</text><text x="410" y="478">0</text><text x="550" y="478" fill="#8a3b12" font-weight="bold">0</text>
  </g>
  <line x1="80" y1="486" x2="630" y2="486" stroke="#999" stroke-width="0.9"/>
  <text x="350" y="506" font-size="10.5" font-style="italic" fill="#666" text-anchor="middle">green rows: non-integers, sum −1.   red rows: integers, sum 0.</text>

  <rect x="24" y="518" width="652" height="34" fill="#fdf2ee" stroke="#ecccbf"/>
  <text x="350" y="540" font-size="12" fill="#8a3b12" text-anchor="middle" font-weight="bold">So the theorem is really a biconditional:  ⌊x⌋ + ⌊−x⌋ = −1  ⟺  x ∉ ℤ</text>
</svg>
