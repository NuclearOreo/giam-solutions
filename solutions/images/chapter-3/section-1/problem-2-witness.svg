<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="400" fill="white"/>

  <text x="350" y="22" font-size="12.5" font-style="italic" fill="#444" text-anchor="middle">The claim is existential, so the whole proof is: unpack the definition, then hand over the witness.</text>

  <!-- definition -->
  <rect x="120" y="38" width="460" height="44" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="350" y="58" font-size="12.5" fill="#1a3a63" text-anchor="middle" font-weight="bold">definition:   n is odd   ⟺   ∃k ∈ ℤ,  n = 2k + 1</text>
  <text x="350" y="74" font-size="10.5" font-style="italic" fill="#666" text-anchor="middle">so proving "129 is odd" means producing one such k</text>

  <text x="350" y="106" font-size="16" fill="#999" text-anchor="middle">↓</text>

  <!-- the witness -->
  <rect x="180" y="118" width="340" height="76" fill="#dfeadd" stroke="#8ab88a" stroke-width="1.5"/>
  <text x="350" y="140" font-size="12.5" fill="#1b5e20" text-anchor="middle">take   <tspan font-weight="bold" font-size="14">k = 64</tspan></text>
  <text x="350" y="164" font-size="13.5" fill="#222" text-anchor="middle">2(64) + 1 = 128 + 1 = 129  ✓</text>
  <text x="350" y="184" font-size="11.5" fill="#1b5e20" text-anchor="middle">and 64 ∈ ℤ  ✓  — both halves must be checked</text>

  <text x="350" y="216" font-size="12" fill="#1b5e20" text-anchor="middle" font-weight="bold">That is the entire proof.</text>

  <!-- the contrast -->
  <text x="350" y="252" font-size="12.5" font-weight="bold" fill="#222" text-anchor="middle">Why one example is enough here but was worthless in Problem 1</text>

  <rect x="30" y="264" width="316" height="112" fill="#dfeadd" stroke="#bcd9bc"/>
  <text x="188" y="284" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">EXISTENTIAL  —  this problem</text>
  <text x="188" y="306" font-size="11.5" fill="#222" text-anchor="middle">∃k ∈ ℤ,  129 = 2k + 1</text>
  <text x="188" y="330" font-size="11" fill="#333" text-anchor="middle">one witness settles it completely</text>
  <text x="188" y="352" font-size="11" fill="#1b5e20" text-anchor="middle" font-weight="bold">example = proof</text>
  <text x="188" y="368" font-size="10" font-style="italic" fill="#666" text-anchor="middle">rule: existential generalisation</text>

  <rect x="354" y="264" width="316" height="112" fill="#fbe4da" stroke="#e0b8a6"/>
  <text x="512" y="284" font-size="12" font-weight="bold" fill="#8a3b12" text-anchor="middle">UNIVERSAL  —  Problem 1</text>
  <text x="512" y="306" font-size="11.5" fill="#222" text-anchor="middle">∀p prime &gt; 3,  p = 6k+1 or 6k+5</text>
  <text x="512" y="330" font-size="11" fill="#333" text-anchor="middle">checking 301 primes proves nothing</text>
  <text x="512" y="352" font-size="11" fill="#8a3b12" text-anchor="middle" font-weight="bold">example ≠ proof</text>
  <text x="512" y="368" font-size="10" font-style="italic" fill="#666" text-anchor="middle">needs an argument covering every p</text>
</svg>
