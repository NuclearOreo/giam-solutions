<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 756" width="720" height="756" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="756" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="52" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE CLAIM</text>
  <text x="410" y="34" font-size="13.5" fill="#1f3a68" text-anchor="middle">&#8704; n, m &#8712; &#8484;&#160;:&#160; n | m&#178;&#160; &#8658; &#160;n | m</text>
  <text x="410" y="55" font-size="16" fill="#9b2c2c" text-anchor="middle" font-weight="bold">FALSE</text>

  <rect x="18" y="76" width="684" height="86" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.4"/>
  <text x="34" y="96" font-size="11.5" fill="#9b2c2c" font-weight="bold">THE MINIMAL COUNTEREXAMPLE</text>
  <text x="360" y="126" font-size="18" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 4,&#160;&#160; m = 2:&#160;&#160; 4 | 4 = m&#178;,&#160; but 4 &#8740; 2</text>
  <text x="360" y="152" font-size="11" fill="#555" text-anchor="middle" font-style="italic">n = 2 and n = 3 both satisfy the claim, so 4 really is the least modulus that fails</text>

  <rect x="18" y="172" width="684" height="70" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="192" font-size="11.5" fill="#1f6b34" font-weight="bold">WHERE THE ARGUMENT LEAKS &#8212; in the exponents</text>
  <text x="40" y="214" font-size="11.5" fill="#333">Writing a&#7510; and b&#7510; for the exponents of p in n and m:&#160;&#160; n | m&#178; &#8660; a&#7510; &#8804; 2b&#7510;,&#160;&#160; while&#160; n | m &#8660; a&#7510; &#8804; b&#7510;.</text>
  <text x="40" y="234" font-size="11.5" fill="#333">The first does not give the second as soon as some a&#7510; &#8805; 2 &#8212; exactly when n is not squarefree.</text>

  <text x="46" y="262" font-size="11.5" fill="#3b5b9b" font-weight="bold">EVERY MODULUS FROM 2 TO 49</text>
  <text x="46" y="279" font-size="10.5" fill="#555" font-style="italic">green = the claim holds there&#160;&#160;&#183;&#160;&#160; red = it fails, with a witness m shown beneath</text>
  <rect x="46" y="292" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="83.0" y="306" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 2</text><rect x="124" y="292" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="161.0" y="306" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 3</text><rect x="202" y="292" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="2.2"/><text x="239.0" y="306" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 4</text><text x="239.0" y="318" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=2</text><rect x="280" y="292" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="317.0" y="306" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 5</text><rect x="358" y="292" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="395.0" y="306" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 6</text><rect x="436" y="292" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="473.0" y="306" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 7</text><rect x="514" y="292" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="551.0" y="306" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 8</text><text x="551.0" y="318" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=4</text><rect x="592" y="292" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="629.0" y="306" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 9</text><text x="629.0" y="318" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=3</text><rect x="46" y="324" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="83.0" y="338" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 10</text><rect x="124" y="324" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="161.0" y="338" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 11</text><rect x="202" y="324" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="239.0" y="338" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 12</text><text x="239.0" y="350" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=6</text><rect x="280" y="324" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="317.0" y="338" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 13</text><rect x="358" y="324" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="395.0" y="338" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 14</text><rect x="436" y="324" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="473.0" y="338" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 15</text><rect x="514" y="324" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="551.0" y="338" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 16</text><text x="551.0" y="350" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=8</text><rect x="592" y="324" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="629.0" y="338" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 17</text><rect x="46" y="356" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="83.0" y="370" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 18</text><text x="83.0" y="382" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=6</text><rect x="124" y="356" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="161.0" y="370" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 19</text><rect x="202" y="356" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="239.0" y="370" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 20</text><text x="239.0" y="382" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=10</text><rect x="280" y="356" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="317.0" y="370" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 21</text><rect x="358" y="356" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="395.0" y="370" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 22</text><rect x="436" y="356" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="473.0" y="370" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 23</text><rect x="514" y="356" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="551.0" y="370" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 24</text><text x="551.0" y="382" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=12</text><rect x="592" y="356" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="629.0" y="370" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 25</text><text x="629.0" y="382" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=5</text><rect x="46" y="388" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="83.0" y="402" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 26</text><rect x="124" y="388" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="161.0" y="402" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 27</text><text x="161.0" y="414" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=9</text><rect x="202" y="388" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="239.0" y="402" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 28</text><text x="239.0" y="414" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=14</text><rect x="280" y="388" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="317.0" y="402" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 29</text><rect x="358" y="388" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="395.0" y="402" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 30</text><rect x="436" y="388" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="473.0" y="402" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 31</text><rect x="514" y="388" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="551.0" y="402" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 32</text><text x="551.0" y="414" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=16</text><rect x="592" y="388" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="629.0" y="402" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 33</text><rect x="46" y="420" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="83.0" y="434" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 34</text><rect x="124" y="420" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="161.0" y="434" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 35</text><rect x="202" y="420" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="239.0" y="434" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 36</text><text x="239.0" y="446" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=18</text><rect x="280" y="420" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="317.0" y="434" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 37</text><rect x="358" y="420" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="395.0" y="434" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 38</text><rect x="436" y="420" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="473.0" y="434" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 39</text><rect x="514" y="420" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="551.0" y="434" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 40</text><text x="551.0" y="446" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=20</text><rect x="592" y="420" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="629.0" y="434" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 41</text><rect x="46" y="452" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="83.0" y="466" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 42</text><rect x="124" y="452" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="161.0" y="466" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 43</text><rect x="202" y="452" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="239.0" y="466" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 44</text><text x="239.0" y="478" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=22</text><rect x="280" y="452" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="317.0" y="466" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 45</text><text x="317.0" y="478" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=15</text><rect x="358" y="452" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="395.0" y="466" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 46</text><rect x="436" y="452" width="74" height="28" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.8"/><text x="473.0" y="466" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">n = 47</text><rect x="514" y="452" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="551.0" y="466" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 48</text><text x="551.0" y="478" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=24</text><rect x="592" y="452" width="74" height="28" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="629.0" y="466" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n = 49</text><text x="629.0" y="478" font-size="9.5" fill="#9b2c2c" text-anchor="middle">m=7</text>

  <rect x="18" y="506" width="684" height="106" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="526" font-size="11.5" fill="#b06a10" font-weight="bold">EXACTLY WHICH MODULI SURVIVE, AND A WITNESS FOR EVERY OTHER</text>
  <text x="40" y="548" font-size="11.5" fill="#333">Exhaustive search shows the claim holds for a modulus n <tspan font-style="italic">exactly when n is squarefree</tspan> &#8212; 121 of the 198</text>
  <text x="40" y="566" font-size="11.5" fill="#333">values below 200, about 61%. Every other n is refuted by one uniform choice:</text>
  <text x="360" y="590" font-size="13" fill="#b06a10" text-anchor="middle" font-weight="bold">if p&#178; | n, take m = n/p&#160;&#160;&#8212;&#160;&#160;then n | m&#178; while n &#8740; m</text>
  <text x="40" y="606" font-size="10.5" fill="#555" font-style="italic">Verified for every non-squarefree n below 200. No searching is needed; the factorisation hands over the witness.</text>

  <rect x="18" y="626" width="684" height="116" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="646" font-size="11.5" fill="#3b5b9b" font-weight="bold">WHAT IS TRUE INSTEAD</text>
  <text x="40" y="668" font-size="11.5" fill="#333">The conclusion n | m is too strong, but something always survives. Halving each exponent and rounding up,</text>
  <text x="360" y="692" font-size="13.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">n | m&#178;&#160; &#8658; &#160;H(n) | m,&#160;&#160;&#160;&#160;where H(n) = &#8719; p^&#8968;a&#7510;/2&#8969;</text>
  <text x="40" y="716" font-size="11.5" fill="#333">and this is sharp: H(n) is precisely the greatest common divisor of all m with n | m&#178;. Checked for n below 300.</text>
  <text x="40" y="734" font-size="11" fill="#555" font-style="italic">H(4) = 2,&#160; H(8) = 4,&#160; H(9) = 3,&#160; H(12) = 6,&#160; H(72) = 12.&#160; For squarefree n, H(n) = n and the original claim is recovered.</text>
</svg>