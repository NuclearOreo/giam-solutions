<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 774" width="720" height="774" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="774" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="72" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE ANSWER</text>
  <text x="400" y="36" font-size="17" fill="#1f3a68" text-anchor="middle" font-weight="bold">p(n) = n&#178; + n + 41</text>
  <text x="400" y="58" font-size="12" fill="#333" text-anchor="middle">prime for every one of the forty inputs n = 0, 1, 2, &#8230;, 39 &#8212; and they are forty <tspan font-style="italic">distinct</tspan> primes</text>
  <text x="400" y="76" font-size="11" fill="#9b2c2c" text-anchor="middle" font-style="italic">then it fails, and the way it fails is the point of the exercise</text>

  <rect x="18" y="96" width="684" height="76" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="116" font-size="11.5" fill="#9b2c2c" font-weight="bold">WHERE IT BREAKS &#8212; and why it had to</text>
  <text x="40" y="138" font-size="12.5" fill="#333">p(40) = 40&#178; + 40 + 41 = 1681 = 41&#178;&#160;&#160;&#160;and&#160;&#160;&#160;p(41) = 41&#178; + 41 + 41 = 41 &#215; 43</text>
  <text x="40" y="160" font-size="11.5" fill="#555">Both are forced: p(41) = 41(41 + 1 + 1) has an obvious factor of 41, and p(40) = 40&#183;41 + 41 does too.</text>

  <text x="34" y="196" font-size="11.5" fill="#3b5b9b" font-weight="bold">EVERY VALUE FROM n = 0 TO n = 40</text>
  <text x="34" y="214" font-size="11" fill="#1f6b34">green = prime</text>
  <text x="140" y="214" font-size="11" fill="#9b2c2c">red = composite</text>
  <text x="686" y="214" font-size="10.5" fill="#555" text-anchor="end" font-style="italic">one red cell in forty-one &#8212; the whole conjecture dies on it</text>
