fill="#777" text-anchor="middle">n = 20</text><text x="76.0" y="363" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">461</text><rect x="109" y="334" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="139.0" y="348" font-size="8.5" fill="#777" text-anchor="middle">n = 21</text><text x="139.0" y="363" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">503</text><rect x="172" y="334" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="202.0" y="348" font-size="8.5" fill="#777" text-anchor="middle">n = 22</text><text x="202.0" y="363" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">547</text><rect x="235" y="334" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="265.0" y="348" font-size="8.5" fill="#777" text-anchor="middle">n = 23</text><text x="265.0" y="363" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">593</text><rect x="298" y="334" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="328.0" y="348" font-size="8.5" fill="#777" text-anchor="middle">n = 24</text><text x="328.0" y="363" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">641</text><rect x="361" y="334" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="391.0" y="348" font-size="8.5" fill="#777" text-anchor="middle">n = 25</text><text x="391.0" y="363" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">691</text><rect x="424" y="334" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="454.0" y="348" font-size="8.5" fill="#777" text-anchor="middle">n = 26</text><text x="454.0" y="363" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">743</text><rect x="487" y="334" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="517.0" y="348" font-size="8.5" fill="#777" text-anchor="middle">n = 27</text><text x="517.0" y="363" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">797</text><rect x="550" y="334" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="580.0" y="348" font-size="8.5" fill="#777" text-anchor="middle">n = 28</text><text x="580.0" y="363" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">853</text><rect x="613" y="334" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="643.0" y="348" font-size="8.5" fill="#777" text-anchor="middle">n = 29</text><text x="643.0" y="363" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">911</text><rect x="46" y="372" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="76.0" y="386" font-size="8.5" fill="#777" text-anchor="middle">n = 30</text><text x="76.0" y="401" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">971</text><rect x="109" y="372" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="139.0" y="386" font-size="8.5" fill="#777" text-anchor="middle">n = 31</text><text x="139.0" y="401" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">1033</text><rect x="172" y="372" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="202.0" y="386" font-size="8.5" fill="#777" text-anchor="middle">n = 32</text><text x="202.0" y="401" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">1097</text><rect x="235" y="372" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="265.0" y="386" font-size="8.5" fill="#777" text-anchor="middle">n = 33</text><text x="265.0" y="401" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">1163</text><rect x="298" y="372" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="328.0" y="386" font-size="8.5" fill="#777" text-anchor="middle">n = 34</text><text x="328.0" y="401" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">1231</text><rect x="361" y="372" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="391.0" y="386" font-size="8.5" fill="#777" text-anchor="middle">n = 35</text><text x="391.0" y="401" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">1301</text><rect x="424" y="372" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="454.0" y="386" font-size="8.5" fill="#777" text-anchor="middle">n = 36</text><text x="454.0" y="401" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">1373</text><rect x="487" y="372" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="517.0" y="386" font-size="8.5" fill="#777" text-anchor="middle">n = 37</text><text x="517.0" y="401" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">1447</text><rect x="550" y="372" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="580.0" y="386" font-size="8.5" fill="#777" text-anchor="middle">n = 38</text><text x="580.0" y="401" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">1523</text><rect x="613" y="372" width="60" height="35" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="0.9"/><text x="643.0" y="386" font-size="8.5" fill="#777" text-anchor="middle">n = 39</text><text x="643.0" y="401" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">1601</text><rect x="46" y="410" width="60" height="35" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="2.4"/><text x="76.0" y="424" font-size="8.5" fill="#777" text-anchor="middle">n = 40</text><text x="76.0" y="439" font-size="12" fill="#9b2c2c" text-anchor="middle" font-weight="bold">1681</text>

  <rect x="18" y="456" width="684" height="76" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="476" font-size="11.5" fill="#1f6b34" font-weight="bold">NO NON-CONSTANT POLYNOMIAL CAN DO BETTER FOREVER</text>
  <text x="40" y="498" font-size="11.5" fill="#333">If p has integer coefficients and q = p(1) is prime, then p(1 + kq) &#8801; p(1) &#8801; 0 (mod q) for every k, so q divides</text>
  <text x="40" y="516" font-size="11.5" fill="#333">infinitely many values. A prime divisible by q must equal &#177;q, and a polynomial takes a value finitely often.</text>

  <rect x="18" y="544" width="684" height="126" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="564" font-size="11.5" fill="#b06a10" font-weight="bold">HOW LONG A RUN CAN YOU BUY?</text>
  <g font-size="11.5">
    <rect x="40" y="574" width="640" height="22" fill="#ffffff" stroke="#e0cba8"/>
    <rect x="40" y="596" width="640" height="66" fill="#fffdf8" stroke="#e0cba8"/>
    <line x1="40" y1="596" x2="680" y2="596" stroke="#d3b98e"/>
    <line x1="40" y1="618" x2="680" y2="618" stroke="#f0e4cd"/>
    <line x1="40" y1="640" x2="680" y2="640" stroke="#f0e4cd"/>
    <line x1="240" y1="574" x2="240" y2="662" stroke="#e0cba8"/>
    <line x1="360" y1="574" x2="360" y2="662" stroke="#e0cba8"/>
    <line x1="470" y1="574" x2="470" y2="662" stroke="#e0cba8"/>

    <text x="50" y="589" fill="#7a4a08" font-weight="bold">polynomial</text>
    <text x="250" y="589" fill="#7a4a08" font-weight="bold">prime for n =</text>
    <text x="370" y="589" fill="#7a4a08" font-weight="bold">distinct primes</text>
    <text x="480" y="589" fill="#7a4a08" font-weight="bold">first failure</text>

    <text x="50" y="611">n&#178; + n + 41</text><text x="250" y="611">0 &#8230; 39</text><text x="370" y="611">40</text><text x="480" y="611" fill="#9b2c2c">p(40) = 41&#178;</text>
    <text x="50" y="633">n&#178; &#8722; n + 41</text><text x="250" y="633">0 &#8230; 40</text><text x="370" y="633">40</text><text x="480" y="633" fill="#9b2c2c">p(41) = 41&#178;</text>
    <text x="50" y="655">n&#178; &#8722; 79n + 1601</text><text x="250" y="655">0 &#8230; 79</text><text x="370" y="655">40</text><text x="480" y="655" fill="#9b2c2c">p(80) = 41&#178;</text>
  </g>

  <rect x="18" y="678" width="684" height="80" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.2"/>
  <text x="34" y="698" font-size="11.5" fill="#3b5b9b" font-weight="bold">WHY 41, OF ALL NUMBERS?</text>
  <text x="40" y="720" font-size="11.5" fill="#333">Searching all A &lt; 200 for which n&#178; + n + A is prime at every n = 0 &#8230; A&#8722;2 returns exactly A = 2, 3, 5, 11, 17, 41.</text>
  <text x="40" y="738" font-size="11.5" fill="#333">The corresponding 4A &#8722; 1 are 7, 11, 19, 43, 67, 163 &#8212; the Heegner numbers. There is no larger A, ever.</text>
</svg>