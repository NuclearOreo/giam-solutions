<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 740" width="720" height="740" font-family="Georgia, serif">
  <defs>
    <marker id="h1" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#3b5b9b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="740" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="52" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE CLAIM</text>
  <text x="410" y="34" font-size="13.5" fill="#1f3a68" text-anchor="middle">there are two irrational numbers whose sum is rational</text>
  <text x="410" y="55" font-size="16" fill="#1f6b34" text-anchor="middle" font-weight="bold">TRUE</text>

  <rect x="18" y="76" width="684" height="112" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.4"/>
  <text x="34" y="96" font-size="11.5" fill="#1f6b34" font-weight="bold">THE WITNESS</text>
  <text x="360" y="126" font-size="18" fill="#1f6b34" text-anchor="middle" font-weight="bold">x = &#8730;2,&#160;&#160; y = &#8722;&#8730;2,&#160;&#160; x + y = 0</text>
  <text x="360" y="152" font-size="12" fill="#333" text-anchor="middle">&#8730;2 is irrational; so is &#8722;&#8730;2, since &#8722;&#8730;2 = q rational would force &#8730;2 = &#8722;q rational.</text>
  <text x="360" y="172" font-size="12" fill="#333" text-anchor="middle">Their sum, 0, is rational. Nothing further is required &#8212; an existential claim needs one instance.</text>

  <rect x="18" y="198" width="684" height="98" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="218" font-size="11.5" fill="#9b2c2c" font-weight="bold">THIS IS PROBLEM 5 WEARING A DIFFERENT HAT</text>
  <text x="34" y="240" font-size="11.5" fill="#333">Problem 5 asked whether every pair of irrationals sums to an irrational. That statement and this one are exact negations:</text>
  <text x="360" y="264" font-size="12.5" fill="#1f3a68" text-anchor="middle">&#172; ( &#8704; x, y irrational,&#160; x + y irrational )&#160;&#160;&#8801;&#160;&#160; &#8707; x, y irrational,&#160; x + y rational</text>
  <text x="360" y="286" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-style="italic">so the counterexample that killed Problem 5 is the witness that proves Problem 6 &#8212; one pair, two jobs</text>

  <rect x="18" y="310" width="684" height="136" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="330" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE ASYMMETRY OF THE TWO QUANTIFIERS</text>
  <g font-size="11.5">
    <rect x="40" y="340" width="640" height="22" fill="#ffffff" stroke="#c3cee4"/>
    <rect x="40" y="362" width="640" height="66" fill="#fcfdff" stroke="#c3cee4"/>
    <line x1="40" y1="362" x2="680" y2="362" stroke="#9fb2d4"/>
    <line x1="40" y1="384" x2="680" y2="384" stroke="#e6ecf6"/>
    <line x1="40" y1="406" x2="680" y2="406" stroke="#e6ecf6"/>
    <line x1="180" y1="340" x2="180" y2="428" stroke="#c3cee4"/>
    <line x1="420" y1="340" x2="420" y2="428" stroke="#c3cee4"/>

    <text x="50" y="355" fill="#1f3a68" font-weight="bold">statement</text>
    <text x="190" y="355" fill="#1f3a68" font-weight="bold">to establish it</text>
    <text x="430" y="355" fill="#1f3a68" font-weight="bold">to refute it</text>

    <text x="50" y="377">&#8704; &#8212; universal</text>
    <text x="190" y="377" fill="#555">a general argument</text>
    <text x="430" y="377" fill="#555">one counterexample</text>

    <text x="50" y="399">&#8707; &#8212; existential</text>
    <text x="190" y="399" fill="#555">one witness</text>
    <text x="430" y="399" fill="#555">a general argument</text>

    <text x="50" y="421" fill="#9b2c2c">Problem 6 is the &#8707; row, so the work is a single exhibited pair.</text>
    <text x="430" y="421" fill="#9b2c2c">Problem 5 is the &#8704; row, refuted.</text>
  </g>

  <rect x="18" y="460" width="684" height="116" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="480" font-size="11.5" fill="#b06a10" font-weight="bold">HOW MANY SUCH PAIRS ARE THERE? UNCOUNTABLY MANY.</text>
  <text x="40" y="502" font-size="11.5" fill="#333">Take <tspan font-style="italic">any</tspan> irrational x and <tspan font-style="italic">any</tspan> rational q, and set y = q &#8722; x. Then y is irrational (a rational minus an</text>
  <text x="40" y="520" font-size="11.5" fill="#333">irrational), and x + y = q is rational. Every irrational belongs to such a pair, for every rational target.</text>
  <text x="40" y="546" font-size="11.5" fill="#333">&#8730;2 and &#8722;&#8730;2 sum to 0&#160;&#160;&#160;&#160;&#160;&#160;&#8730;2 and 5 &#8722; &#8730;2 sum to 5&#160;&#160;&#160;&#160;&#160;&#160;&#960; and 1 &#8722; &#960; sum to 1&#160;&#160;&#160;&#160;&#160;&#160;e and &#8722;3/7 &#8722; e sum to &#8722;3/7</text>
  <text x="40" y="566" font-size="11" fill="#555" font-style="italic">The witness is not a rarity that had to be hunted for; the hard part was noticing such pairs exist at all.</text>

  <rect x="18" y="590" width="684" height="136" rx="6" fill="#f7f7f9" stroke="#888" stroke-width="1.2"/>
  <text x="34" y="610" font-size="11.5" fill="#3b5b9b" font-weight="bold">A CONTRAST: AN EXISTENCE PROOF WITH NO NAMED WITNESS</text>
  <text x="40" y="632" font-size="11.5" fill="#333">Claim: there are irrationals a, b with a&#7495; rational. Consider the number &#8730;2 raised to the power &#8730;2.</text>
  <text x="40" y="654" font-size="11.5" fill="#333">&#160;&#160;&#8226;&#160; If it is rational, take a = b = &#8730;2 and we are done.</text>
  <text x="40" y="674" font-size="11.5" fill="#333">&#160;&#160;&#8226;&#160; If it is irrational, take a = &#8730;2 raised to &#8730;2, and b = &#8730;2. Then a&#7495; = &#8730;2 raised to (&#8730;2 &#183; &#8730;2) = &#8730;2&#178; = 2.</text>
  <text x="40" y="700" font-size="11.5" fill="#333">Either way such a pair exists &#8212; yet the argument never says which. Problem 6 is the opposite kind of</text>
  <text x="40" y="718" font-size="11.5" fill="#333">existence proof: fully explicit, and verifiable in one line.</text>
</svg>