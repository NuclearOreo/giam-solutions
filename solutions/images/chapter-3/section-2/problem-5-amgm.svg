  <text x="614" y="288" font-size="11.5" font-style="italic" fill="#2a5db0" text-anchor="end">y = x + 1/x</text>

  <circle cx="220" cy="378" r="5" fill="#8a3b12"/>
  <line x1="220" y1="378" x2="220" y2="470" stroke="#8a3b12" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="228" y="368" font-size="11" fill="#8a3b12" font-weight="bold">minimum at (1, 2)</text>

  <!-- equality and the negative case -->
  <rect x="24" y="502" width="322" height="46" fill="#eef5ee" stroke="#cde0cd"/>
  <text x="185" y="520" font-size="11" fill="#1b5e20" text-anchor="middle" font-weight="bold">Equality only at x = 1</text>
  <text x="185" y="538" font-size="10.5" fill="#222" text-anchor="middle">(x − 1)² = 0 exactly there — matching AM = GM when a = b</text>

  <rect x="354" y="502" width="322" height="46" fill="#fbe4da" stroke="#e0b8a6"/>
  <text x="515" y="520" font-size="11" fill="#8a3b12" text-anchor="middle" font-weight="bold">Positivity is essential</text>
  <text x="515" y="538" font-size="10.5" fill="#222" text-anchor="middle">for x &lt; 0 the inequality reverses:  x + 1/x ≤ −2</text>
</svg>
