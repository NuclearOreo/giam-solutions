<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="560" fill="white"/>

  <text x="350" y="22" font-size="12.5" font-style="italic" fill="#444" text-anchor="middle">Work backwards until you hit something obviously true — here, that a square is non-negative.</text>

  <!-- backwards chain -->
  <rect x="24" y="38" width="652" height="128" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="40" y="58" font-size="11.5" fill="#1a3a63" font-weight="bold">Backwards from the conclusion — every step is reversible because x &gt; 0</text>
  <text x="350" y="82" font-size="13" fill="#222" text-anchor="middle">x + 1/x ≥ 2</text>
  <text x="350" y="102" font-size="13" fill="#222" text-anchor="middle">⟺   x² + 1 ≥ 2x</text>
  <text x="560" y="102" font-size="10" font-style="italic" fill="#777">multiply by x &gt; 0</text>
  <text x="350" y="122" font-size="13" fill="#222" text-anchor="middle">⟺   x² − 2x + 1 ≥ 0</text>
  <text x="350" y="142" font-size="13" fill="#1b5e20" text-anchor="middle" font-weight="bold">⟺   (x − 1)² ≥ 0</text>
  <text x="560" y="142" font-size="10" font-style="italic" fill="#1b5e20">always true</text>
  <text x="350" y="160" font-size="10.5" font-style="italic" fill="#666" text-anchor="middle">now read the chain upward and you have the proof</text>

  <!-- AM-GM -->
  <rect x="24" y="180" width="652" height="62" fill="#dfeadd" stroke="#8ab88a" stroke-width="1.5"/>
  <text x="350" y="200" font-size="12" font-weight="bold" fill="#1b5e20" text-anchor="middle">It is the arithmetic–geometric mean inequality in disguise</text>
  <text x="350" y="224" font-size="12.5" fill="#222" text-anchor="middle">take a = x and b = 1/x, so ab = 1:   (x + 1/x)/2  ≥  √(x · 1/x)  =  1</text>
  <text x="350" y="238" font-size="10" font-style="italic" fill="#666" text-anchor="middle">multiply by 2 and you have the theorem</text>

  <!-- graph -->
  <text x="350" y="266" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">The curve y = x + 1/x never dips below the line y = 2, and touches it exactly once</text>

  <line x1="90" y1="378" x2="640" y2="378" stroke="#1b5e20" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="652" y="382" font-size="11" fill="#1b5e20">y = 2</text>

  <line x1="90" y1="470" x2="640" y2="470" stroke="#666" stroke-width="1.2"/>
  <line x1="90" y1="292" x2="90" y2="490" stroke="#666" stroke-width="1.2"/>
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="220" y="488">1</text><text x="350" y="488">2</text><text x="480" y="488">3</text><text x="610" y="488">4</text>
  </g>
  <g font-size="10.5" fill="#333" text-anchor="end">
    <text x="84" y="382">2</text><text x="84" y="336">3</text><text x="84" y="300">4</text>
  </g>

