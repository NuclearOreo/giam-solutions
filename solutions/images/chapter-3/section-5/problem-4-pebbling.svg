<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 848" width="720" height="848" font-family="Georgia, serif">
  <defs><marker id="p1" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
    <path d="M0,0 L7,3.2 L0,6.4 z" fill="#1f6b34"/></marker></defs>
  <rect x="0" y="0.0" width="720" height="836" fill="#ffffff"/>

  <rect x="18" y="14.0" width="684" height="68" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE RULES</text>
  <text x="40" y="52.0" font-size="11.5" fill="#333">A <tspan font-style="italic">pebbling move</tspan> removes two pebbles from a node and places one on an adjacent node &#8212; half are lost.</text>
  <text x="40" y="71.0" font-size="11.5" fill="#333">The <tspan font-style="italic">pebbling number</tspan> &#960;(G) is the least k such that from <tspan font-weight="bold">every</tspan> placement of k pebbles, <tspan font-weight="bold">every</tspan> node is reachable.</text>

  <rect x="18" y="96.0" width="684" height="208" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="116.0" font-size="11.5" fill="#9b2c2c" font-weight="bold">WHY 3 PEBBLES ARE NOT ENOUGH &#8212; the given lower bound</text>
  <line x1="106" y1="148.0" x2="194" y2="148.0" stroke="#bbb" stroke-width="1.2"/><line x1="106" y1="148.0" x2="194" y2="236.0" stroke="#bbb" stroke-width="1.2"/><line x1="106" y1="148.0" x2="106" y2="236.0" stroke="#bbb" stroke-width="1.2"/><line x1="194" y1="148.0" x2="194" y2="236.0" stroke="#bbb" stroke-width="1.2"/><line x1="194" y1="148.0" x2="106" y2="236.0" stroke="#bbb" stroke-width="1.2"/><line x1="194" y1="236.0" x2="106" y2="236.0" stroke="#bbb" stroke-width="1.2"/><circle cx="106" cy="148.0" r="16" fill="#ffffff" stroke="#555" stroke-width="1.3"/><text x="106" y="153.0" font-size="13.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><circle cx="194" cy="148.0" r="16" fill="#ffffff" stroke="#555" stroke-width="1.3"/><text x="194" y="153.0" font-size="13.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><circle cx="194" cy="236.0" r="16" fill="#ffffff" stroke="#555" stroke-width="1.3"/><text x="194" y="241.0" font-size="13.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><circle cx="106" cy="236.0" r="16" fill="#fff3d6" stroke="#b06a10" stroke-width="2.4"/><text x="106" y="241.0" font-size="13.5" fill="#bbb" text-anchor="middle" font-weight="bold">0</text><text x="106" y="267.0" font-size="9" fill="#b06a10" text-anchor="middle" font-weight="bold">target</text><text x="150" y="286.0" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">no node holds 2 &#8212; no move is legal</text>
  <text x="250" y="158.0" font-size="11.5" fill="#333">One pebble on each of the three non-target nodes.</text>
  <text x="250" y="180.0" font-size="11.5" fill="#333">Every move needs a node holding at least two, so</text>
  <text x="250" y="202.0" font-size="11.5" fill="#333">nothing can happen at all. Hence &#960;(K&#8324;) &#8805; 4.</text>
  <text x="250" y="236.0" font-size="11" fill="#9b2c2c" font-style="italic">Exhaustive check: this is the <tspan font-weight="bold">only</tspan> shape that fails. Any other</text>
  <text x="250" y="254.0" font-size="11" fill="#9b2c2c" font-style="italic">placement of 3 pebbles &#8212; (3,0,0), (2,1,0) &#8212; reaches every node.</text>

  <rect x="18" y="318.0" width="684" height="252" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="338.0" font-size="11.5" fill="#1f6b34" font-weight="bold">WHY 4 PEBBLES ALWAYS SUFFICE &#8212; two cases</text>

  <text x="178" y="362.0" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">Case 1&#160;&#160;the target already has a pebble</text>
  <line x1="136" y1="392.0" x2="220" y2="392.0" stroke="#bbb" stroke-width="1.2"/><line x1="136" y1="392.0" x2="220" y2="476.0" stroke="#bbb" stroke-width="1.2"/><line x1="136" y1="392.0" x2="136" y2="476.0" stroke="#bbb" stroke-width="1.2"/><line x1="220" y1="392.0" x2="220" y2="476.0" stroke="#bbb" stroke-width="1.2"/><line x1="220" y1="392.0" x2="136" y2="476.0" stroke="#bbb" stroke-width="1.2"/><line x1="220" y1="476.0" x2="136" y2="476.0" stroke="#bbb" stroke-width="1.2"/><circle cx="136" cy="392.0" r="16" fill="#ffffff" stroke="#555" stroke-width="1.3"/><text x="136" y="397.0" font-size="13.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">2</text><circle cx="220" cy="392.0" r="16" fill="#ffffff" stroke="#555" stroke-width="1.3"/><text x="220" y="397.0" font-size="13.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><circle cx="220" cy="476.0" r="16" fill="#ffffff" stroke="#555" stroke-width="1.3"/><text x="220" y="481.0" font-size="13.5" fill="#bbb" text-anchor="middle" font-weight="bold">0</text><circle cx="136" cy="476.0" r="16" fill="#fff3d6" stroke="#b06a10" stroke-width="2.4"/><text x="136" y="481.0" font-size="13.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><text x="136" y="507.0" font-size="9" fill="#b06a10" text-anchor="middle" font-weight="bold">target</text><text x="178" y="526.0" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">nothing to do</text>

  <line x1="352" y1="352.0" x2="352" y2="514.0" stroke="#bcd6c4"/>

  <text x="532" y="362.0" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">Case 2&#160;&#160;the target is empty</text>
  <line x1="420" y1="392.0" x2="504" y2="392.0" stroke="#bbb" stroke-width="1.2"/><line x1="420" y1="392.0" x2="504" y2="476.0" stroke="#bbb" stroke-width="1.2"/><line x1="420" y1="392.0" x2="420" y2="476.0" stroke="#bbb" stroke-width="1.2"/><line x1="504" y1="392.0" x2="504" y2="476.0" stroke="#bbb" stroke-width="1.2"/><line x1="504" y1="392.0" x2="420" y2="476.0" stroke="#bbb" stroke-width="1.2"/><line x1="504" y1="476.0" x2="420" y2="476.0" stroke="#bbb" stroke-width="1.2"/><circle cx="420" cy="392.0" r="16" fill="#ffffff" stroke="#555" stroke-width="1.3"/><text x="420" y="397.0" font-size="13.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">2</text><circle cx="504" cy="392.0" r="16" fill="#ffffff" stroke="#555" stroke-width="1.3"/><text x="504" y="397.0" font-size="13.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><circle cx="504" cy="476.0" r="16" fill="#ffffff" stroke="#555" stroke-width="1.3"/><text x="504" y="481.0" font-size="13.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><circle cx="420" cy="476.0" r="16" fill="#fff3d6" stroke="#b06a10" stroke-width="2.4"/><text x="420" y="481.0" font-size="13.5" fill="#bbb" text-anchor="middle" font-weight="bold">0</text><text x="420" y="507.0" font-size="9" fill="#b06a10" text-anchor="middle" font-weight="bold">target</text><text x="462" y="526.0" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">4 pebbles, 3 nodes</text>
  <path d="M528,434 L566,434" fill="none" stroke="#1f6b34" stroke-width="1.6" marker-end="url(#p1)"/>
  <text x="547" y="426.0" font-size="9" fill="#1f6b34" text-anchor="middle">one move</text>
  <line x1="594" y1="392.0" x2="678" y2="392.0" stroke="#bbb" stroke-width="1.2"/><line x1="594" y1="392.0" x2="678" y2="476.0" stroke="#bbb" stroke-width="1.2"/><line x1="594" y1="392.0" x2="594" y2="476.0" stroke="#bbb" stroke-width="1.2"/><line x1="678" y1="392.0" x2="678" y2="476.0" stroke="#bbb" stroke-width="1.2"/><line x1="678" y1="392.0" x2="594" y2="476.0" stroke="#bbb" stroke-width="1.2"/><line x1="678" y1="476.0" x2="594" y2="476.0" stroke="#bbb" stroke-width="1.2"/><circle cx="594" cy="392.0" r="16" fill="#ffffff" stroke="#555" stroke-width="1.3"/><text x="594" y="397.0" font-size="13.5" fill="#bbb" text-anchor="middle" font-weight="bold">0</text><circle cx="678" cy="392.0" r="16" fill="#ffffff" stroke="#555" stroke-width="1.3"/><text x="678" y="397.0" font-size="13.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><circle cx="678" cy="476.0" r="16" fill="#ffffff" stroke="#555" stroke-width="1.3"/><text x="678" y="481.0" font-size="13.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><circle cx="594" cy="476.0" r="16" fill="#fff3d6" stroke="#b06a10" stroke-width="2.4"/><text x="594" y="481.0" font-size="13.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><text x="594" y="507.0" font-size="9" fill="#b06a10" text-anchor="middle" font-weight="bold">target</text><text x="636" y="526.0" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">delivered</text>

  <text x="40" y="540.0" font-size="11.5" fill="#333">In Case 2 the pigeonhole principle applies: 4 pebbles on 3 nodes force some node to hold at least &#8968;4/3&#8969; = 2.</text>
  <text x="40" y="558.0" font-size="11.5" fill="#333">That node is adjacent to the target &#8212; every node is, in K&#8324; &#8212; so one move finishes the job.</text>

  <rect x="18" y="584.0" width="684" height="118" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="604.0" font-size="11.5" fill="#b06a10" font-weight="bold">CASE 2 IN FULL &#8212; the four ways to put 4 pebbles on 3 nodes</text>
  <text x="40" y="630.0" font-size="13" fill="#333">(4, 0, 0)&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;(3, 1, 0)&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;(2, 2, 0)&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;(2, 1, 1)</text>
  <text x="40" y="654.0" font-size="11.5" fill="#333">Every one contains an entry of at least 2, which is exactly what the pigeonhole argument guarantees.</text>
  <text x="40" y="678.0" font-size="11.5" fill="#1f6b34" font-weight="bold">So &#960;(K&#8324;) &#8804; 4, and with the lower bound, &#960;(K&#8324;) = 4.</text>
  <text x="40" y="695.0" font-size="10.5" fill="#555" font-style="italic">Confirmed by exhaustive search over all placements of 4 pebbles and all four targets.</text>

  <rect x="18" y="716.0" width="684" height="116" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.2"/>
  <text x="34" y="736.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">HOW GOOD IS 4? &#8212; comparison with other graphs on n nodes</text>
  <text x="40" y="760.0" font-size="11.5" fill="#333">&#960;(K&#8345;) = n for every n &#8212; the argument never used more than &#8220;the busy node is adjacent to the target&#8221;.</text>
  <text x="40" y="780.0" font-size="11.5" fill="#333">Verified for n up to 7. Since &#960;(G) &#8805; n always, complete graphs are as efficient as a graph can be.</text>
  <text x="40" y="806.0" font-size="11.5" fill="#333">Paths are the opposite extreme: &#960;(P&#8345;) = 2&#8319;&#8315;&#185;, so &#960;(P&#8326;) = 32 while &#960;(K&#8326;) = 6. Cycles sit between:</text>
  <text x="40" y="824.0" font-size="11.5" fill="#333">&#960;(C&#8324;) = 4, &#960;(C&#8325;) = 5, &#960;(C&#8326;) = 8. All computed by exhaustive search.</text>
</svg>