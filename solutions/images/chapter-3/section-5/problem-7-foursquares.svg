<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 776" width="720" height="776" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="776" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="66" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">TO SHOW</text>
  <text x="430" y="36" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">15 is not a sum of 1, 2 or 3 squares</text>
  <text x="40" y="58" font-size="11.5" fill="#333">Only the positive squares 1, 4 and 9 can appear, since 16 already exceeds 15. Order does not matter, so</text>
  <text x="40" y="74" font-size="10.5" fill="#555" font-style="italic">for each k it is enough to run through the multisets of size k drawn from &#123;1, 4, 9&#125; &#8212; 19 cases in all for k &#8804; 3.</text>

  <text x="46" y="150" font-size="11.5" fill="#3b5b9b" font-weight="bold">EVERY CASE, WRITTEN OUT</text>
  <text x="46" y="170" font-size="11.5" fill="#9b2c2c" font-weight="bold">k = 1 &#8212; three candidates, none is 15</text><rect x="46" y="173" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="105.0" y="188" font-size="10.5" fill="#333" text-anchor="middle">1&#178; = 1</text><rect x="172" y="173" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="231.0" y="188" font-size="10.5" fill="#333" text-anchor="middle">2&#178; = 4</text><rect x="298" y="173" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="357.0" y="188" font-size="10.5" fill="#333" text-anchor="middle">3&#178; = 9</text><text x="46" y="226" font-size="11.5" fill="#9b2c2c" font-weight="bold">k = 2 &#8212; six multisets, none sums to 15</text><rect x="46" y="229" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="105.0" y="244" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 1&#178; = 2</text><rect x="172" y="229" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="231.0" y="244" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 2&#178; = 5</text><rect x="298" y="229" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="357.0" y="244" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 3&#178; = 10</text><rect x="424" y="229" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="483.0" y="244" font-size="10.5" fill="#333" text-anchor="middle">2&#178; + 2&#178; = 8</text><rect x="550" y="229" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="609.0" y="244" font-size="10.5" fill="#333" text-anchor="middle">2&#178; + 3&#178; = 13</text><rect x="46" y="253" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="105.0" y="268" font-size="10.5" fill="#333" text-anchor="middle">3&#178; + 3&#178; = 18</text><text x="46" y="306" font-size="11.5" fill="#9b2c2c" font-weight="bold">k = 3 &#8212; ten multisets, none sums to 15</text><rect x="46" y="309" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="105.0" y="324" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 1&#178; + 1&#178; = 3</text><rect x="172" y="309" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="231.0" y="324" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 1&#178; + 2&#178; = 6</text><rect x="298" y="309" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="357.0" y="324" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 1&#178; + 3&#178; = 11</text><rect x="424" y="309" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="483.0" y="324" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 2&#178; + 2&#178; = 9</text><rect x="550" y="309" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="609.0" y="324" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 2&#178; + 3&#178; = 14</text><rect x="46" y="333" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="105.0" y="348" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 3&#178; + 3&#178; = 19</text><rect x="172" y="333" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="231.0" y="348" font-size="10.5" fill="#333" text-anchor="middle">2&#178; + 2&#178; + 2&#178; = 12</text><rect x="298" y="333" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="357.0" y="348" font-size="10.5" fill="#333" text-anchor="middle">2&#178; + 2&#178; + 3&#178; = 17</text><rect x="424" y="333" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="483.0" y="348" font-size="10.5" fill="#333" text-anchor="middle">2&#178; + 3&#178; + 3&#178; = 22</text><rect x="550" y="333" width="118" height="20" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="609.0" y="348" font-size="10.5" fill="#333" text-anchor="middle">3&#178; + 3&#178; + 3&#178; = 27</text><text x="46" y="386" font-size="11.5" fill="#3b5b9b" font-weight="bold">k = 4 &#8212; fifteen multisets, exactly one works</text><rect x="46" y="389" width="118" height="20" rx="3" fill="#fafbfd" stroke="#3b5b9b" stroke-width="0.8"/><text x="105.0" y="404" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 1&#178; + 1&#178; + 1&#178; = 4</text><rect x="172" y="389" width="118" height="20" rx="3" fill="#fafbfd" stroke="#3b5b9b" stroke-width="0.8"/><text x="231.0" y="404" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 1&#178; + 1&#178; + 2&#178; = 7</text><rect x="298" y="389" width="118" height="20" rx="3" fill="#fafbfd" stroke="#3b5b9b" stroke-width="0.8"/><text x="357.0" y="404" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 1&#178; + 1&#178; + 3&#178; = 12</text><rect x="424" y="389" width="118" height="20" rx="3" fill="#fafbfd" stroke="#3b5b9b" stroke-width="0.8"/><text x="483.0" y="404" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 1&#178; + 2&#178; + 2&#178; = 10</text><rect x="550" y="389" width="118" height="20" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="2"/><text x="609.0" y="404" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight='bold'>1&#178; + 1&#178; + 2&#178; + 3&#178; = 15</text><rect x="46" y="413" width="118" height="20" rx="3" fill="#fafbfd" stroke="#3b5b9b" stroke-width="0.8"/><text x="105.0" y="428" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 1&#178; + 3&#178; + 3&#178; = 20</text><rect x="172" y="413" width="118" height="20" rx="3" fill="#fafbfd" stroke="#3b5b9b" stroke-width="0.8"/><text x="231.0" y="428" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 2&#178; + 2&#178; + 2&#178; = 13</text><rect x="298" y="413" width="118" height="20" rx="3" fill="#fafbfd" stroke="#3b5b9b" stroke-width="0.8"/><text x="357.0" y="428" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 2&#178; + 2&#178; + 3&#178; = 18</text><rect x="424" y="413" width="118" height="20" rx="3" fill="#fafbfd" stroke="#3b5b9b" stroke-width="0.8"/><text x="483.0" y="428" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 2&#178; + 3&#178; + 3&#178; = 23</text><rect x="550" y="413" width="118" height="20" rx="3" fill="#fafbfd" stroke="#3b5b9b" stroke-width="0.8"/><text x="609.0" y="428" font-size="10.5" fill="#333" text-anchor="middle">1&#178; + 3&#178; + 3&#178; + 3&#178; = 28</text><rect x="46" y="437" width="118" height="20" rx="3" fill="#fafbfd" stroke="#3b5b9b" stroke-width="0.8"/><text x="105.0" y="452" font-size="10.5" fill="#333" text-anchor="middle">2&#178; + 2&#178; + 2&#178; + 2&#178; = 16</text><rect x="172" y="437" width="118" height="20" rx="3" fill="#fafbfd" stroke="#3b5b9b" stroke-width="0.8"/><text x="231.0" y="452" font-size="10.5" fill="#333" text-anchor="middle">2&#178; + 2&#178; + 2&#178; + 3&#178; = 21</text><rect x="298" y="437" width="118" height="20" rx="3" fill="#fafbfd" stroke="#3b5b9b" stroke-width="0.8"/><text x="357.0" y="452" font-size="10.5" fill="#333" text-anchor="middle">2&#178; + 2&#178; + 3&#178; + 3&#178; = 26</text><rect x="424" y="437" width="118" height="20" rx="3" fill="#fafbfd" stroke="#3b5b9b" stroke-width="0.8"/><text x="483.0" y="452" font-size="10.5" fill="#333" text-anchor="middle">2&#178; + 3&#178; + 3&#178; + 3&#178; = 31</text><rect x="550" y="437" width="118" height="20" rx="3" fill="#fafbfd" stroke="#3b5b9b" stroke-width="0.8"/><text x="609.0" y="452" font-size="10.5" fill="#333" text-anchor="middle">3&#178; + 3&#178; + 3&#178; + 3&#178; = 36</text>

  <rect x="18" y="504" width="684" height="124" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="524" font-size="11.5" fill="#1f6b34" font-weight="bold">A SHORTCUT THAT EXPLAINS IT &#8212; work mod 8</text>
  <text x="40" y="546" font-size="11.5" fill="#333">Every square is 0, 1 or 4 mod 8. Adding three of those, the reachable residues are</text>
  <text x="360" y="570" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="bold">0, 1, 2, 3, 4, 5, 6&#160;&#160;&#8212;&#160;&#160;but never 7</text>
  <text x="40" y="594" font-size="11.5" fill="#333">Since 15 &#8801; 7 (mod 8), no three squares can sum to it. This replaces the nineteen checks with one table,</text>
  <text x="40" y="610" font-size="11.5" fill="#333">and proves the same for 7, 23, 31, 39, &#8230; all at once.</text>

  <rect x="18" y="642" width="684" height="118" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="662" font-size="11.5" fill="#b06a10" font-weight="bold">WHICH NUMBERS REALLY NEED ALL FOUR?</text>
  <text x="40" y="684" font-size="11.5" fill="#333">Legendre&#8217;s three-square theorem: n needs four squares exactly when n = 4&#7491;(8b + 7). Below 300 these are</text>
  <text x="40" y="706" font-size="11.5" fill="#1f3a68" font-weight="bold">7, 15, 23, 28, 31, 39, 47, 55, 60, 63, 71, 79, 87, 92, 95, 103, &#8230;</text>
  <text x="40" y="730" font-size="11.5" fill="#333">48 of the first 299 integers, about 16% &#8212; matching the predicted density 1/8 + 1/32 + &#8943; = 1/6.</text>
  <text x="40" y="750" font-size="10.5" fill="#555" font-style="italic">7 is the smallest such number and 15 is the second. The list was computed directly and agrees with Legendre exactly.</text>
</svg>