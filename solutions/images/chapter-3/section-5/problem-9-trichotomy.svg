<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 874" width="720" height="874" font-family="Georgia, serif">
  <rect x="0" y="0.0" width="720" height="854" fill="#ffffff"/>

  <rect x="18" y="14.0" width="684" height="66" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">TO PROVE</text>
  <text x="430" y="36.0" font-size="14.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">x&#178; &#8805; 0&#160; for every real x</text>
  <text x="40" y="58.0" font-size="11.5" fill="#333">Trichotomy says every real is positive, negative, or zero &#8212; three possibilities, exactly one of which holds.</text>
  <text x="40" y="74.0" font-size="10.5" fill="#555" font-style="italic">That is precisely a ready-made case split: prove the statement in each, and the three together cover &#8477;.</text>

  <text x="34" y="156.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE THREE CASES TRICHOTOMY HANDS YOU</text>
  <line x1="90" y1="208.0" x2="660" y2="208.0" stroke="#555" stroke-width="1.4"/><rect x="90" y="197.0" width="285.0" height="22" fill="#f8cdcd" opacity="0.55"/><rect x="375.0" y="197.0" width="285.0" height="22" fill="#dff0e2" opacity="0.7"/><circle cx="375.0" cy="208" r="7" fill="#b06a10"/><text x="375.0" y="238.0" font-size="12.5" fill="#b06a10" text-anchor="middle" font-weight="bold">x = 0</text><text x="232.5" y="186.0" font-size="13" fill="#9b2c2c" text-anchor="middle" font-weight="bold">x &lt; 0</text><text x="517.5" y="186.0" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">x &gt; 0</text><text x="232.5" y="238.0" font-size="11" fill="#9b2c2c" text-anchor="middle">Case 3</text><text x="517.5" y="238.0" font-size="11" fill="#1f6b34" text-anchor="middle">Case 2</text><text x="375.0" y="254.0" font-size="11" fill="#b06a10" text-anchor="middle">Case 1</text>

  <rect x="26" y="278.0" width="218" height="142" rx="5" fill="#fff8ec" stroke="#b06a10" stroke-width="1.5"/><text x="135.0" y="299.0" font-size="11.5" fill="#b06a10" text-anchor="middle" font-weight="bold">Case 1&#160;&#160;x = 0</text><text x="38" y="322.0" font-size="10.8" fill="#333">x&#178; = 0 &#183; 0 = 0,</text><text x="38" y="340.0" font-size="10.8" fill="#333">and 0 &#8805; 0.</text><text x="38" y="358.0" font-size="10.8" fill="#333"></text><text x="38" y="376.0" font-size="10.8" fill="#333">So x&#178; &#8805; 0.</text><text x="38" y="394.0" font-size="10.8" fill="#333"></text><text x="38" y="412.0" font-size="10.8" fill="#333"><tspan font-style='italic' fill='#777'>uses nothing but 0&#183;0 = 0</tspan></text><rect x="251" y="278.0" width="218" height="142" rx="5" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.5"/><text x="360.0" y="299.0" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">Case 2&#160;&#160;x &gt; 0</text><text x="263" y="322.0" font-size="10.8" fill="#333">A product of two positives</text><text x="263" y="340.0" font-size="10.8" fill="#333">is positive, so</text><text x="263" y="358.0" font-size="10.8" fill="#333">x&#178; = x &#183; x &gt; 0,</text><text x="263" y="376.0" font-size="10.8" fill="#333">hence x&#178; &#8805; 0.</text><text x="263" y="394.0" font-size="10.8" fill="#333"></text><text x="263" y="412.0" font-size="10.8" fill="#333"><tspan font-style='italic' fill='#777'>uses the closure axiom</tspan></text><rect x="476" y="278.0" width="218" height="142" rx="5" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.5"/><text x="585.0" y="299.0" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">Case 3&#160;&#160;x &lt; 0</text><text x="488" y="322.0" font-size="10.8" fill="#333">Then &#8722;x &gt; 0, and</text><text x="488" y="340.0" font-size="10.8" fill="#333">x&#178; = (&#8722;x)(&#8722;x) &gt; 0</text><text x="488" y="358.0" font-size="10.8" fill="#333">by the same closure</text><text x="488" y="376.0" font-size="10.8" fill="#333">axiom, so x&#178; &#8805; 0.</text><text x="488" y="394.0" font-size="10.8" fill="#333"></text><text x="488" y="412.0" font-size="10.8" fill="#333"><tspan font-style='italic' fill='#777'>uses (&#8722;a)(&#8722;b) = ab too</tspan></text>
  <text x="360" y="448.0" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">The three cases are exhaustive, so x&#178; &#8805; 0 for every real x. &#9632;</text>

  <rect x="18" y="464.0" width="684" height="132" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="484.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">EXACTLY WHAT THE PROOF ASSUMES</text>
  <text x="40" y="506.0" font-size="11.5" fill="#333">1.&#160; <tspan font-weight="bold">Trichotomy</tspan> &#8212; every real is exactly one of positive, negative, zero. Supplies the cases.</text>
  <text x="40" y="526.0" font-size="11.5" fill="#333">2.&#160; <tspan font-weight="bold">Positives are closed under multiplication</tspan> &#8212; a, b &gt; 0 forces ab &gt; 0. Does Cases 2 and 3.</text>
  <text x="40" y="546.0" font-size="11.5" fill="#333">3.&#160; <tspan font-weight="bold">(&#8722;a)(&#8722;b) = ab</tspan> &#8212; not an order fact at all, but a consequence of distributivity.</text>
  <text x="40" y="570.0" font-size="11" fill="#555" font-style="italic">Proof of 3: (&#8722;a)b + ab = (&#8722;a + a)b = 0&#183;b = 0, so (&#8722;a)b = &#8722;(ab); then (&#8722;a)(&#8722;b) = &#8722;(a(&#8722;b)) = &#8722;(&#8722;(ab)) = ab.</text>
  <text x="40" y="588.0" font-size="11" fill="#555" font-style="italic">Checked on all integer pairs from &#8722;30 to 30.</text>

  <rect x="18" y="610.0" width="684" height="118" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="630.0" font-size="11.5" fill="#b06a10" font-weight="bold">THE PROOF PROVES MORE THAN IT WAS ASKED</text>
  <text x="40" y="652.0" font-size="11.5" fill="#333">Cases 2 and 3 both end in x&#178; <tspan font-weight="bold">&gt;</tspan> 0, not merely x&#178; &#8805; 0, and Case 1 gives x&#178; = 0 exactly. So</text>
  <text x="360" y="678.0" font-size="13.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">x&#178; = 0&#160; if and only if&#160; x = 0</text>
  <text x="40" y="704.0" font-size="11.5" fill="#333">falls out for free &#8212; the equality case, which the statement as posed does not mention.</text>
  <text x="40" y="722.0" font-size="10.5" fill="#555" font-style="italic">Cases 2 and 3 are also mirror images: x &#8614; &#8722;x swaps them and leaves x&#178; alone, so one could argue WLOG x &gt; 0.</text>

  <rect x="18" y="742.0" width="684" height="116" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="762.0" font-size="11.5" fill="#9b2c2c" font-weight="bold">WHERE IT FAILS, AND WHY THAT MATTERS</text>
  <text x="40" y="784.0" font-size="11.5" fill="#333">In the complex numbers i&#178; = &#8722;1, a square that is negative. The theorem is not merely unproved there &#8212;</text>
  <text x="40" y="802.0" font-size="11.5" fill="#333">it is false. Since the proof above uses only ordered-field axioms, the conclusion is unavoidable:</text>
  <text x="360" y="828.0" font-size="12.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">&#8450; cannot be given any order making it an ordered field.</text>
  <text x="40" y="848.0" font-size="10.5" fill="#555" font-style="italic">The theorem is thus a test an ordered field must pass, and this is how one shows &#8450; is not one.</text>
</svg>