<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 892" width="720" height="892" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="892" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="52" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">TO PROVE</text>
  <text x="420" y="36" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">the sum of any three consecutive integers is divisible by 3</text>

  <rect x="18" y="76" width="684" height="82" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="96" font-size="11.5" fill="#1f6b34" font-weight="bold">THE CHOICE THAT MAKES IT A ONE-LINER</text>
  <text x="40" y="118" font-size="11.5" fill="#333">Name the <tspan font-style="italic">middle</tspan> integer n, not the first. Then the three are n &#8722; 1, n, n + 1 and the outer terms cancel.</text>
  <text x="40" y="138" font-size="11.5" fill="#333">Starting from the first instead gives n + (n+1) + (n+2) = 3n + 3 = 3(n+1) &#8212; correct, but one step longer.</text>
  <text x="40" y="154" font-size="10.5" fill="#555" font-style="italic">Same theorem either way; the centred naming is what turns the algebra into nothing.</text>

  <line x1="50" y1="262" x2="490" y2="262" stroke="#555" stroke-width="1.3"/><line x1="120" y1="253" x2="120" y2="271" stroke="#3b5b9b" stroke-width="1.6"/><circle cx="120" cy="262" r="5.5" fill="#3b5b9b"/><text x="120" y="242" font-size="14" fill="#3b5b9b" text-anchor="middle" font-weight="bold">n &#8722; 1</text><line x1="270" y1="253" x2="270" y2="271" stroke="#9b2c2c" stroke-width="1.6"/><circle cx="270" cy="262" r="5.5" fill="#9b2c2c"/><text x="270" y="242" font-size="14" fill="#9b2c2c" text-anchor="middle" font-weight="bold">n</text><line x1="420" y1="253" x2="420" y2="271" stroke="#3b5b9b" stroke-width="1.6"/><circle cx="420" cy="262" r="5.5" fill="#3b5b9b"/><text x="420" y="242" font-size="14" fill="#3b5b9b" text-anchor="middle" font-weight="bold">n + 1</text><path d="M120,288 L120,298 L420,298 L420,288" fill="none" stroke="#1f6b34" stroke-width="1.4"/><line x1="270" y1="298" x2="270" y2="308" stroke="#1f6b34" stroke-width="1.4"/><text x="270" y="328" font-size="16" fill="#1f6b34" text-anchor="middle" font-weight="bold">(n &#8722; 1) + n + (n + 1) = 3n</text><text x="270" y="348" font-size="11" fill="#555" text-anchor="middle" font-style="italic">the outer two cancel; three copies of the middle remain</text>
  <text x="46" y="416" font-size="11.5" fill="#3b5b9b" font-weight="bold">A SECOND PROOF, WITHOUT ALGEBRA</text><text x="40" y="438" font-size="11.5" fill="#333">Three consecutive integers occupy the three residue classes mod 3, one each, in some order:</text><rect x="140" y="450" width="128" height="40" rx="4" fill="#eef2fa" stroke="#3b5b9b"/><text x="204.0" y="475" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8801; 0 (mod 3)</text><rect x="290" y="450" width="128" height="40" rx="4" fill="#eef2fa" stroke="#3b5b9b"/><text x="354.0" y="475" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8801; 1 (mod 3)</text><rect x="440" y="450" width="128" height="40" rx="4" fill="#eef2fa" stroke="#3b5b9b"/><text x="504.0" y="475" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8801; 2 (mod 3)</text><text x="360" y="512" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">0 + 1 + 2 = 3 &#8801; 0 (mod 3),&#160; so the sum is divisible by 3 whatever the order.</text>

  <text x="60" y="542" font-size="11.5" fill="#3b5b9b" font-weight="bold">WHAT HAPPENS FOR k CONSECUTIVE INTEGERS</text>
  <text x="660" y="542" font-size="10.5" fill="#555" text-anchor="end" font-style="italic">sum = kn + k(k&#8722;1)/2</text>
  <rect x="60" y="556" width="600" height="24" rx="3" fill="#eef2fa" stroke="#9fb2d4"/><text x="110" y="574" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">k</text><text x="290" y="574" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">sum of k consecutive</text><text x="460" y="574" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">sum mod k</text><text x="600" y="574" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">k divides it?</text><rect x="60" y="581" width="600" height="22" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="110" y="598" font-size="11.5" fill="#333" text-anchor="middle">2</text><text x="290" y="598" font-size="11.5" fill="#333" text-anchor="middle">2n + 1</text><text x="460" y="598" font-size="11.5" fill="#9b2c2c" text-anchor="middle">1</text><text x="600" y="598" font-size="11.5" fill="#9b2c2c" text-anchor="middle">no</text><rect x="60" y="605" width="600" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="2.2"/><text x="110" y="622" font-size="11.5" fill="#333" text-anchor="middle">3</text><text x="290" y="622" font-size="11.5" fill="#333" text-anchor="middle">3n + 3</text><text x="460" y="622" font-size="11.5" fill="#1f6b34" text-anchor="middle">0</text><text x="600" y="622" font-size="11.5" fill="#1f6b34" text-anchor="middle">yes</text><rect x="60" y="629" width="600" height="22" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="110" y="646" font-size="11.5" fill="#333" text-anchor="middle">4</text><text x="290" y="646" font-size="11.5" fill="#333" text-anchor="middle">4n + 6</text><text x="460" y="646" font-size="11.5" fill="#9b2c2c" text-anchor="middle">2</text><text x="600" y="646" font-size="11.5" fill="#9b2c2c" text-anchor="middle">no</text><rect x="60" y="653" width="600" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8"/><text x="110" y="670" font-size="11.5" fill="#333" text-anchor="middle">5</text><text x="290" y="670" font-size="11.5" fill="#333" text-anchor="middle">5n + 10</text><text x="460" y="670" font-size="11.5" fill="#1f6b34" text-anchor="middle">0</text><text x="600" y="670" font-size="11.5" fill="#1f6b34" text-anchor="middle">yes</text><rect x="60" y="677" width="600" height="22" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8"/><text x="110" y="694" font-size="11.5" fill="#333" text-anchor="middle">6</text><text x="290" y="694" font-size="11.5" fill="#333" text-anchor="middle">6n + 15</text><text x="460" y="694" font-size="11.5" fill="#9b2c2c" text-anchor="middle">3</text><text x="600" y="694" font-size="11.5" fill="#9b2c2c" text-anchor="middle">no</text><rect x="60" y="701" width="600" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8"/><text x="110" y="718" font-size="11.5" fill="#333" text-anchor="middle">7</text><text x="290" y="718" font-size="11.5" fill="#333" text-anchor="middle">7n + 21</text><text x="460" y="718" font-size="11.5" fill="#1f6b34" text-anchor="middle">0</text><text x="600" y="718" font-size="11.5" fill="#1f6b34" text-anchor="middle">yes</text>

  <rect x="18" y="764" width="684" height="114" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="784" font-size="11.5" fill="#b06a10" font-weight="bold">THE PATTERN, AND A CONTRAST</text>
  <text x="360" y="810" font-size="13.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">k divides the sum of every k consecutive integers&#160; &#8660; &#160;k is odd</text>
  <text x="40" y="834" font-size="11.5" fill="#333">For even k the sum is always exactly k/2 more than a multiple of k &#8212; never divisible. Checked to k = 12.</text>
  <text x="40" y="858" font-size="11.5" fill="#333">Products behave completely differently: k! divides the <tspan font-style="italic">product</tspan> of any k consecutive integers, for <tspan font-style="italic">every</tspan> k.</text>
  <text x="40" y="874" font-size="10.5" fill="#555" font-style="italic">So three consecutive integers have a sum divisible by 3 and a product divisible by 6.</text>
</svg>