<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 824" width="720" height="824" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="824" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="52" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">TO PROVE</text>
  <text x="420" y="36" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">p prime, p &gt; 3&#160; &#8658; &#160;p = 6q + 1&#160; or&#160; p = 6q + 5</text>

  <rect x="18" y="76" width="684" height="86" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="96" font-size="11.5" fill="#1f6b34" font-weight="bold">THE METHOD: DIVIDE BY 6 AND ELIMINATE</text>
  <text x="40" y="118" font-size="11.5" fill="#333">The division algorithm writes every integer as p = 6q + r with r one of 0, 1, 2, 3, 4, 5 &#8212; six exhaustive cases.</text>
  <text x="40" y="138" font-size="11.5" fill="#333">Four of them force a small divisor on p, which a prime larger than 3 cannot have. Two survive.</text>
  <text x="40" y="156" font-size="10.5" fill="#555" font-style="italic">Each elimination is a contrapositive: rather than showing p has the right form, we show the wrong forms are composite.</text>

  <text x="46" y="224" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE SIX CASES</text>
  <text x="658" y="224" font-size="10.5" fill="#555" text-anchor="end" font-style="italic">red = ruled out&#160;&#160;&#183;&#160;&#160;green = survives</text>
  <rect x="46" y="250" width="100" height="66" rx="5" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="1"/><text x="96.0" y="270" font-size="10" fill="#9b2c2c" text-anchor="middle">r = 0</text><text x="96.0" y="289" font-size="13" fill="#9b2c2c" text-anchor="middle" font-weight="bold">6q</text><text x="96.0" y="306" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-style="italic">2 | p</text><rect x="154" y="250" width="100" height="66" rx="5" fill="#dff0e2" stroke="#1f6b34" stroke-width="2.4"/><text x="204.0" y="270" font-size="10" fill="#1f6b34" text-anchor="middle">r = 1</text><text x="204.0" y="289" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">6q + 1</text><text x="204.0" y="306" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-style="italic">survives</text><rect x="262" y="250" width="100" height="66" rx="5" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="1"/><text x="312.0" y="270" font-size="10" fill="#9b2c2c" text-anchor="middle">r = 2</text><text x="312.0" y="289" font-size="13" fill="#9b2c2c" text-anchor="middle" font-weight="bold">6q + 2</text><text x="312.0" y="306" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-style="italic">2 | p</text><rect x="370" y="250" width="100" height="66" rx="5" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="1"/><text x="420.0" y="270" font-size="10" fill="#9b2c2c" text-anchor="middle">r = 3</text><text x="420.0" y="289" font-size="13" fill="#9b2c2c" text-anchor="middle" font-weight="bold">6q + 3</text><text x="420.0" y="306" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-style="italic">3 | p</text><rect x="478" y="250" width="100" height="66" rx="5" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="1"/><text x="528.0" y="270" font-size="10" fill="#9b2c2c" text-anchor="middle">r = 4</text><text x="528.0" y="289" font-size="13" fill="#9b2c2c" text-anchor="middle" font-weight="bold">6q + 4</text><text x="528.0" y="306" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-style="italic">2 | p</text><rect x="586" y="250" width="100" height="66" rx="5" fill="#dff0e2" stroke="#1f6b34" stroke-width="2.4"/><text x="636.0" y="270" font-size="10" fill="#1f6b34" text-anchor="middle">r = 5</text><text x="636.0" y="289" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">6q + 5</text><text x="636.0" y="306" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-style="italic">survives</text>
  <text x="360" y="342" font-size="11.5" fill="#333" text-anchor="middle">r = 0, 2, 4 give p = 2(3q + r/2), so 2 | p.&#160;&#160;&#160;&#160; r = 3 gives p = 3(2q + 1), so 3 | p.</text>
  <text x="360" y="364" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">A prime p &gt; 3 has neither 2 nor 3 as a divisor, so only r = 1 and r = 5 remain. &#9632;</text>

  <text x="46" y="400" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE FIRST FOURTEEN PRIMES ABOVE 3</text>
  <rect x="46" y="414" width="39" height="34" rx="3" fill="#ffffff" stroke="#b06a10" stroke-width="1.1"/><text x="65.5" y="429" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">5</text><text x="65.5" y="442" font-size="9" fill="#b06a10" text-anchor="middle">6q+5</text><rect x="90" y="414" width="39" height="34" rx="3" fill="#ffffff" stroke="#1f6b34" stroke-width="1.1"/><text x="109.5" y="429" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">7</text><text x="109.5" y="442" font-size="9" fill="#1f6b34" text-anchor="middle">6q+1</text><rect x="134" y="414" width="39" height="34" rx="3" fill="#ffffff" stroke="#b06a10" stroke-width="1.1"/><text x="153.5" y="429" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">11</text><text x="153.5" y="442" font-size="9" fill="#b06a10" text-anchor="middle">6q+5</text><rect x="178" y="414" width="39" height="34" rx="3" fill="#ffffff" stroke="#1f6b34" stroke-width="1.1"/><text x="197.5" y="429" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">13</text><text x="197.5" y="442" font-size="9" fill="#1f6b34" text-anchor="middle">6q+1</text><rect x="222" y="414" width="39" height="34" rx="3" fill="#ffffff" stroke="#b06a10" stroke-width="1.1"/><text x="241.5" y="429" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">17</text><text x="241.5" y="442" font-size="9" fill="#b06a10" text-anchor="middle">6q+5</text><rect x="266" y="414" width="39" height="34" rx="3" fill="#ffffff" stroke="#1f6b34" stroke-width="1.1"/><text x="285.5" y="429" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">19</text><text x="285.5" y="442" font-size="9" fill="#1f6b34" text-anchor="middle">6q+1</text><rect x="310" y="414" width="39" height="34" rx="3" fill="#ffffff" stroke="#b06a10" stroke-width="1.1"/><text x="329.5" y="429" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">23</text><text x="329.5" y="442" font-size="9" fill="#b06a10" text-anchor="middle">6q+5</text><rect x="354" y="414" width="39" height="34" rx="3" fill="#ffffff" stroke="#b06a10" stroke-width="1.1"/><text x="373.5" y="429" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">29</text><text x="373.5" y="442" font-size="9" fill="#b06a10" text-anchor="middle">6q+5</text><rect x="398" y="414" width="39" height="34" rx="3" fill="#ffffff" stroke="#1f6b34" stroke-width="1.1"/><text x="417.5" y="429" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">31</text><text x="417.5" y="442" font-size="9" fill="#1f6b34" text-anchor="middle">6q+1</text><rect x="442" y="414" width="39" height="34" rx="3" fill="#ffffff" stroke="#1f6b34" stroke-width="1.1"/><text x="461.5" y="429" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">37</text><text x="461.5" y="442" font-size="9" fill="#1f6b34" text-anchor="middle">6q+1</text><rect x="486" y="414" width="39" height="34" rx="3" fill="#ffffff" stroke="#b06a10" stroke-width="1.1"/><text x="505.5" y="429" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">41</text><text x="505.5" y="442" font-size="9" fill="#b06a10" text-anchor="middle">6q+5</text><rect x="530" y="414" width="39" height="34" rx="3" fill="#ffffff" stroke="#1f6b34" stroke-width="1.1"/><text x="549.5" y="429" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">43</text><text x="549.5" y="442" font-size="9" fill="#1f6b34" text-anchor="middle">6q+1</text><rect x="574" y="414" width="39" height="34" rx="3" fill="#ffffff" stroke="#b06a10" stroke-width="1.1"/><text x="593.5" y="429" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">47</text><text x="593.5" y="442" font-size="9" fill="#b06a10" text-anchor="middle">6q+5</text><rect x="618" y="414" width="39" height="34" rx="3" fill="#ffffff" stroke="#b06a10" stroke-width="1.1"/><text x="637.5" y="429" font-size="11.5" fill="#333" text-anchor="middle" font-weight="bold">53</text><text x="637.5" y="442" font-size="9" fill="#b06a10" text-anchor="middle">6q+5</text>

  <rect x="18" y="488" width="684" height="94" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="508" font-size="11.5" fill="#9b2c2c" font-weight="bold">NECESSARY, NOT SUFFICIENT &#8212; the converse fails</text>
  <text x="40" y="530" font-size="11.5" fill="#333">Having the form 6q &#177; 1 does not make a number prime. The composites of this shape start</text>
  <text x="360" y="552" font-size="12.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">25, 35, 49, 55, 65, 77, 85, 91, 95, 115, 119, &#8230;</text>
  <text x="40" y="574" font-size="11" fill="#555" font-style="italic">25 = 5&#183;5, 35 = 5&#183;7, 49 = 7&#183;7 &#8212; each built from primes that are themselves 6q &#177; 1, so the form is closed under products.</text>

  <rect x="18" y="596" width="684" height="106" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="616" font-size="11.5" fill="#b06a10" font-weight="bold">TWO THINGS THAT FALL OUT</text>
  <text x="40" y="640" font-size="11.5" fill="#333">Writing the forms symmetrically as 6q &#177; 1:&#160;&#160; p&#178; = 36q&#178; &#177; 12q + 1 = 12q(3q &#177; 1) + 1, and q(3q &#177; 1) is always</text>
  <text x="40" y="658" font-size="11.5" fill="#333">even, so&#160; <tspan font-weight="bold" fill="#1f3a68">p &gt; 3 prime &#8658; p&#178; &#8801; 1 (mod 24)</tspan>. Verified for all 9590 primes below 100000.</text>
  <text x="40" y="684" font-size="11.5" fill="#333">And every twin pair beyond (3, 5) is (6q &#8722; 1, 6q + 1):&#160; twins always straddle a multiple of 6.</text>

  <rect x="18" y="716" width="684" height="94" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.2"/>
  <text x="34" y="736" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE SAME IDEA AT ANY MODULUS &#8212; the &#8220;wheel&#8221;</text>
  <text x="40" y="758" font-size="11.5" fill="#333">Nothing is special about 6. A prime p &gt; m shares no factor with m, so it lands in one of the &#966;(m) classes</text>
  <text x="40" y="776" font-size="11.5" fill="#333">coprime to m. Taking m = 2&#183;3 = 6 leaves 2 classes of 6; m = 30 leaves 8 of 30; m = 210 leaves 48 of 210.</text>
  <text x="40" y="798" font-size="11" fill="#555" font-style="italic">All three verified. This is exactly how wheel factorisation skips candidates when sieving for primes.</text>
</svg>