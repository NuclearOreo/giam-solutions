<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 790" width="720" height="790" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="790" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="80" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">AN EXISTENTIAL CLAIM</text>
  <text x="440" y="34" font-size="13" fill="#1f3a68" text-anchor="middle">some subset of &#8474;&#8314; has no smallest element</text>
  <text x="360" y="60" font-size="16" fill="#9b2c2c" text-anchor="middle" font-weight="bold">Take the subset &#8474;&#8314; itself.</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">For any q &#8712; &#8474;&#8314;, the rational q/2 is again positive and is smaller &#8212; so q is not least.</text>

  <text x="34" y="166" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE HALVING CASCADE</text>
  <text x="34" y="184" font-size="11" fill="#555">Unlike &#8484;, the trouble is not at infinity but at 0 &#8212; the set crowds against a floor it does not contain.</text>
  <line x1="110" y1="218" x2="660" y2="218" stroke="#555" stroke-width="1.4"/><line x1="110" y1="207" x2="110" y2="229" stroke="#333" stroke-width="2"/><text x="110" y="246" font-size="12.5" fill="#333" text-anchor="middle" font-weight="bold">0</text><text x="110" y="262" font-size="10" fill="#555" text-anchor="middle" font-style="italic">not in &#8474;&#8314;</text><circle cx="619.3" cy="218" r="6.5" fill="#1f6b34"/><text x="619.3" y="200" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">1</text><circle cx="364.6" cy="218" r="5.9" fill="#1f6b34"/><text x="364.6" y="200" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">1/2</text><circle cx="237.3" cy="218" r="5.3" fill="#1f6b34"/><text x="237.3" y="200" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">1/4</text><circle cx="173.7" cy="218" r="4.7" fill="#7a9c86"/><text x="173.7" y="200" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">1/8</text><circle cx="141.8" cy="218" r="4.1" fill="#7a9c86"/><circle cx="125.9" cy="218" r="3.5" fill="#7a9c86"/><circle cx="118.0" cy="218" r="2.9" fill="#7a9c86"/><circle cx="114.0" cy="218" r="2.3" fill="#7a9c86"/><circle cx="112.0" cy="218" r="2.0" fill="#7a9c86"/><text x="125.9" y="202" font-size="12" fill="#5c7d68" text-anchor="middle">&#8943;</text><text x="385.0" y="284" font-size="11.5" fill="#333" text-anchor="middle">every point is a positive rational, each half the one before &#8212; the chain never reaches 0 and never stops</text>

  <text x="60" y="312" font-size="11.5" fill="#3b5b9b" font-weight="bold">FOUR SETTINGS, TWO DIFFERENT KINDS OF FAILURE</text>
  <rect x="60" y="331" width="600" height="26" rx="3" fill="#eef2fa" stroke="#9fb2d4"/><text x="150" y="350" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">setting</text><text x="330" y="350" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">WOP as stated</text><text x="540" y="350" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">rescued by &#8220;bounded below&#8221;?</text><rect x="60" y="358" width="600" height="24" rx="3" fill="#f1f8f2" stroke="#1f6b34" stroke-width="0.8"/><text x="150" y="376" font-size="12" fill="#333" text-anchor="middle">&#8469;</text><text x="330" y="376" font-size="12" fill="#1f6b34" text-anchor="middle">yes</text><text x="540" y="376" font-size="12" fill="#1f6b34" text-anchor="middle">yes (automatic)</text><rect x="60" y="384" width="600" height="24" rx="3" fill="#fff8ec" stroke="#b06a10" stroke-width="0.8"/><text x="150" y="402" font-size="12" fill="#333" text-anchor="middle">&#8484;</text><text x="330" y="402" font-size="12" fill="#b06a10" text-anchor="middle">no</text><text x="540" y="402" font-size="12" fill="#b06a10" text-anchor="middle"><tspan font-weight='bold'>yes</tspan></text><rect x="60" y="410" width="600" height="24" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="2.2"/><text x="150" y="428" font-size="12" fill="#333" text-anchor="middle">&#8474;&#8314;</text><text x="330" y="428" font-size="12" fill="#9b2c2c" text-anchor="middle">no</text><text x="540" y="428" font-size="12" fill="#9b2c2c" text-anchor="middle"><tspan font-weight='bold'>no</tspan></text><rect x="60" y="436" width="600" height="24" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.8"/><text x="150" y="454" font-size="12" fill="#333" text-anchor="middle">&#8477;&#8314;</text><text x="330" y="454" font-size="12" fill="#9b2c2c" text-anchor="middle">no</text><text x="540" y="454" font-size="12" fill="#9b2c2c" text-anchor="middle"><tspan font-weight='bold'>no</tspan></text>

  <rect x="18" y="502" width="684" height="124" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="522" font-size="11.5" fill="#9b2c2c" font-weight="bold">WHY &#8474;&#8314; FAILS WORSE THAN &#8484;</text>
  <text x="40" y="544" font-size="11.5" fill="#333">In &#8484; the failure needed a set running off to minus infinity, and adding a lower bound repaired it.</text>
  <text x="40" y="562" font-size="11.5" fill="#333">&#8474;&#8314; is already bounded below by 0 and fails anyway, so no such repair is available.</text>
  <text x="40" y="588" font-size="11.5" fill="#333">The difference is <tspan font-weight="bold">discreteness</tspan>. Between two integers lie finitely many others, so a decreasing walk</text>
  <text x="40" y="606" font-size="11.5" fill="#333">above a bound must stop. Between two rationals lie infinitely many, so it never has to.</text>

  <rect x="18" y="640" width="684" height="134" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.2"/>
  <text x="34" y="660" font-size="11.5" fill="#3b5b9b" font-weight="bold">TWO THINGS THAT ARE STILL TRUE</text>
  <text x="40" y="682" font-size="11.5" fill="#333"><tspan font-weight="bold">&#8474;&#8314; contains well-ordered subsets.</tspan>&#160; &#8484;&#8314; sits inside it and is perfectly well-ordered; the failure is a</text>
  <text x="40" y="700" font-size="11.5" fill="#333">property of &#8474;&#8314; as a whole, not of everything in it.</text>
  <text x="40" y="726" font-size="11.5" fill="#333"><tspan font-weight="bold">&#8474;&#8314; can be well-ordered by a different order.</tspan>&#160; It is countable, so listing it by height n + d and then</text>
  <text x="40" y="744" font-size="11.5" fill="#333">by numerator gives 1, &#189;, 2, &#8531;, 3, &#188;, &#8532;, 3/2, 4, &#8230; &#8212; and <tspan font-style="italic">that</tspan> order is a well-ordering.</text>
  <text x="40" y="766" font-size="11" fill="#555" font-style="italic">Well-ordering is a property of the pair (set, order), never of the set alone. Only the usual &lt; fails here.</text>
</svg>