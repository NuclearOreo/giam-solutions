<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 876" width="720" height="876" font-family="Georgia, serif">
  <rect x="0" y="0.0" width="720" height="842" fill="#ffffff"/>

  <rect x="18" y="14.0" width="684" height="98" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE SETTING &#8212; Theorem 3.6.4</text>
  <text x="40" y="53.0" font-size="11.5" fill="#333">M = &#123; xa + yb : x, y &#8712; &#8484; &#125; is the &#8484;-module generated by a and b. It contains the positive number a, so by</text>
  <text x="40" y="70.0" font-size="11.5" fill="#333">the well-ordering principle it has a <tspan font-style="italic">least positive</tspan> element d, say d = x&#772;a + y&#772;b.</text>
  <text x="40" y="92.0" font-size="11.5" fill="#333">The text proves d | a in full and then writes &#8220;an entirely analogous argument&#8221; for d | b. Here is that argument.</text>

  <text x="26" y="160.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE TWO HALVES, SIDE BY SIDE &#8212; only the two coefficients differ</text>
  <rect x="26" y="176.0" width="326" height="276" rx="5" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.6"/><text x="189.0" y="199.0" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">GIVEN IN THE TEXT:&#160; d | a</text><text x="39" y="226.0" font-size="10.9" fill="#333">Divide d into a:</text><text x="39" y="245.0" font-size="10.9" fill="#333">&#160;&#160;&#160;a = qd + r,&#160; 0 &#8804; r &lt; d</text><text x="39" y="264.0" font-size="10.9" fill="#333"></text><text x="39" y="283.0" font-size="10.9" fill="#333">r = a &#8722; qd</text><text x="39" y="302.0" font-size="10.9" fill="#333">&#160;&#160; = a &#8722; q(x&#772;a + y&#772;b)</text><text x="39" y="321.0" font-size="10.9" fill="#333">&#160;&#160; = <tspan font-weight='bold'>(1 &#8722; qx&#772;)</tspan>a + <tspan font-weight='bold'>(&#8722;qy&#772;)</tspan>b</text><text x="39" y="340.0" font-size="10.9" fill="#333"></text><text x="39" y="359.0" font-size="10.9" fill="#333">so r lies in M.</text><text x="39" y="378.0" font-size="10.9" fill="#333">If r &gt; 0 then r is a positive</text><text x="39" y="397.0" font-size="10.9" fill="#333">element of M below d &#8212;</text><text x="39" y="416.0" font-size="10.9" fill="#333">contradicting minimality.</text><text x="39" y="435.0" font-size="10.9" fill="#333">Hence r = 0 and d | a.</text><rect x="368" y="176.0" width="326" height="276" rx="5" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.6"/><text x="531.0" y="199.0" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">TO BE FILLED IN:&#160; d | b</text><text x="381" y="226.0" font-size="10.9" fill="#333">Divide d into b:</text><text x="381" y="245.0" font-size="10.9" fill="#333">&#160;&#160;&#160;b = qd + r,&#160; 0 &#8804; r &lt; d</text><text x="381" y="264.0" font-size="10.9" fill="#333"></text><text x="381" y="283.0" font-size="10.9" fill="#333">r = b &#8722; qd</text><text x="381" y="302.0" font-size="10.9" fill="#333">&#160;&#160; = b &#8722; q(x&#772;a + y&#772;b)</text><text x="381" y="321.0" font-size="10.9" fill="#333">&#160;&#160; = <tspan font-weight='bold'>(&#8722;qx&#772;)</tspan>a + <tspan font-weight='bold'>(1 &#8722; qy&#772;)</tspan>b</text><text x="381" y="340.0" font-size="10.9" fill="#333"></text><text x="381" y="359.0" font-size="10.9" fill="#333">so r lies in M.</text><text x="381" y="378.0" font-size="10.9" fill="#333">If r &gt; 0 then r is a positive</text><text x="381" y="397.0" font-size="10.9" fill="#333">element of M below d &#8212;</text><text x="381" y="416.0" font-size="10.9" fill="#333">contradicting minimality.</text><text x="381" y="435.0" font-size="10.9" fill="#333">Hence r = 0 and d | b.</text>

  <text x="34" y="496.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE TEXT&#8217;S EXAMPLE, WORKED THROUGH</text><text x="40" y="520.0" font-size="11.5" fill="#333">a = 21,&#160; b = 15,&#160; and the least positive element of M is d = 3, with 3 = (&#8722;2)&#183;21 + 3&#183;15, so x&#772; = &#8722;2, y&#772; = 3.</text><text x="40" y="540.0" font-size="11.5" fill="#333">Dividing d into b:&#160; 15 = 5&#183;3 + 0, so q = 5 and r = 0.</text><text x="40" y="560.0" font-size="11.5" fill="#333">The identity checks out:&#160; (&#8722;q x&#772;)a + (1 &#8722; q y&#772;)b = 10&#183;21 + (&#8722;14)&#183;15 = 210 &#8722; 210 = 0 = r.&#160; So 3 | 15.</text>

  <rect x="18" y="604.0" width="684" height="124" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="624.0" font-size="11.5" fill="#b06a10" font-weight="bold">WHY &#8220;ANALOGOUS&#8221; IS LEGITIMATE HERE</text>
  <text x="40" y="646.0" font-size="11.5" fill="#333">The set M is genuinely symmetric in a and b: relabelling (a, b) as (b, a) and (x, y) as (y, x) maps M to itself,</text>
  <text x="40" y="664.0" font-size="11.5" fill="#333">and carries the statement &#8220;d | a&#8221; to &#8220;d | b&#8221;. Verified for a = 21, b = 15.</text>
  <text x="40" y="690.0" font-size="11.5" fill="#333">So the text&#8217;s appeal is a real WLOG, not hand-waving. What the exercise asks is to write out what the</text>
  <text x="40" y="708.0" font-size="11.5" fill="#333">symmetry guarantees &#8212; and doing so shows the two arguments differ in exactly two coefficients.</text>

  <rect x="18" y="742.0" width="684" height="118" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.2"/>
  <text x="34" y="762.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">WHERE EACH HYPOTHESIS IS SPENT</text>
  <text x="40" y="784.0" font-size="11.5" fill="#333">1.&#160; <tspan font-weight="bold">Well-ordering</tspan> produces d at all &#8212; M has positive elements, so it has a least one.</text>
  <text x="40" y="804.0" font-size="11.5" fill="#333">2.&#160; The <tspan font-weight="bold">division algorithm</tspan> supplies q and r with 0 &#8804; r &lt; d, which is what makes r too small.</text>
  <text x="40" y="824.0" font-size="11.5" fill="#333">3.&#160; <tspan font-weight="bold">Closure of M</tspan> under integer combinations puts r back inside M.</text>
  <text x="40" y="846.0" font-size="11" fill="#555" font-style="italic">Least positive element of M equals gcd(a, b): checked for every a, b from 1 to 39.</text>
</svg>