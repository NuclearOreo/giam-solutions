<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 902" width="720" height="902" font-family="Georgia, serif">
  <defs>
    <marker id="ar1f6b34" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#1f6b34"/></marker>
    <marker id="ar9b2c2c" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#9b2c2c"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="902" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="80" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">AN EXISTENTIAL CLAIM</text>
  <text x="430" y="34" font-size="13" fill="#1f3a68" text-anchor="middle">there is a balanced digraph on 5 points</text>
  <text x="40" y="56" font-size="11.5" fill="#333">Balanced means every point has as many arrows leaving as arriving. Exhibiting one such drawing is</text>
  <text x="40" y="73" font-size="11.5" fill="#333">the whole proof &#8212; and there are two natural candidates, one minimal and one that is a genuine game.</text>

  <text x="112" y="196" font-size="11.5" fill="#1f6b34" font-weight="bold">THE 5-CYCLE</text>
  <text x="112" y="212" font-size="10.5" fill="#555">every point: 1 out, 1 in</text>
  <text x="380" y="196" font-size="11.5" fill="#9b2c2c" font-weight="bold">THE FIVE-OPTION GAME &#8212; k beats k+1 and k+2</text>
  <text x="380" y="212" font-size="10.5" fill="#555">every point: 2 out, 2 in &#8212; rock&#8211;paper&#8211;scissors&#8211;lizard&#8211;Spock</text>
  <line x1="205.4" y1="279.2" x2="239.3" y2="303.9" stroke="#1f6b34" stroke-width="1.5" marker-end="url(#ar1f6b34)"/><line x1="254.5" y1="337.2" x2="241.5" y2="377.1" stroke="#1f6b34" stroke-width="1.5" marker-end="url(#ar1f6b34)"/><line x1="214.5" y1="401.9" x2="172.5" y2="401.9" stroke="#1f6b34" stroke-width="1.5" marker-end="url(#ar1f6b34)"/><line x1="140.6" y1="383.8" x2="127.7" y2="343.9" stroke="#1f6b34" stroke-width="1.5" marker-end="url(#ar1f6b34)"/><line x1="135.0" y1="308.0" x2="169.0" y2="283.3" stroke="#1f6b34" stroke-width="1.5" marker-end="url(#ar1f6b34)"/><circle cx="190.0" cy="268.0" r="17" fill="#ffffff" stroke="#1f6b34" stroke-width="1.8"/><text x="190.0" y="273.0" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><circle cx="260.4" cy="319.1" r="17" fill="#ffffff" stroke="#1f6b34" stroke-width="1.8"/><text x="260.4" y="324.1" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">1</text><circle cx="233.5" cy="401.9" r="17" fill="#ffffff" stroke="#1f6b34" stroke-width="1.8"/><text x="233.5" y="406.9" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">2</text><circle cx="146.5" cy="401.9" r="17" fill="#ffffff" stroke="#1f6b34" stroke-width="1.8"/><text x="146.5" y="406.9" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">3</text><circle cx="119.6" cy="319.1" r="17" fill="#ffffff" stroke="#1f6b34" stroke-width="1.8"/><text x="119.6" y="324.1" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">4</text><line x1="535.4" y1="279.2" x2="569.3" y2="303.9" stroke="#9b2c2c" stroke-width="1.5" marker-end="url(#ar9b2c2c)"/><line x1="584.5" y1="337.2" x2="571.5" y2="377.1" stroke="#9b2c2c" stroke-width="1.5" marker-end="url(#ar9b2c2c)"/><line x1="544.5" y1="401.9" x2="502.5" y2="401.9" stroke="#9b2c2c" stroke-width="1.5" marker-end="url(#ar9b2c2c)"/><line x1="470.6" y1="383.8" x2="457.7" y2="343.9" stroke="#9b2c2c" stroke-width="1.5" marker-end="url(#ar9b2c2c)"/><line x1="465.0" y1="308.0" x2="499.0" y2="283.3" stroke="#9b2c2c" stroke-width="1.5" marker-end="url(#ar9b2c2c)"/><line x1="525.9" y1="286.1" x2="555.5" y2="377.1" stroke="#9b2c2c" stroke-width="1.5" marker-end="url(#ar9b2c2c)"/><line x1="575.0" y1="330.3" x2="497.5" y2="386.6" stroke="#9b2c2c" stroke-width="1.5" marker-end="url(#ar9b2c2c)"/><line x1="548.1" y1="390.7" x2="470.7" y2="334.4" stroke="#9b2c2c" stroke-width="1.5" marker-end="url(#ar9b2c2c)"/><line x1="482.4" y1="383.8" x2="512.0" y2="292.7" stroke="#9b2c2c" stroke-width="1.5" marker-end="url(#ar9b2c2c)"/><line x1="468.6" y1="319.1" x2="564.4" y2="319.1" stroke="#9b2c2c" stroke-width="1.5" marker-end="url(#ar9b2c2c)"/><circle cx="520.0" cy="268.0" r="17" fill="#ffffff" stroke="#9b2c2c" stroke-width="1.8"/><text x="520.0" y="273.0" font-size="13" fill="#9b2c2c" text-anchor="middle" font-weight="bold">0</text><text x="520.0" y="240.0" font-size="10.5" fill="#555" text-anchor="middle">rock</text><circle cx="590.4" cy="319.1" r="17" fill="#ffffff" stroke="#9b2c2c" stroke-width="1.8"/><text x="590.4" y="324.1" font-size="13" fill="#9b2c2c" text-anchor="middle" font-weight="bold">1</text><text x="620.8" y="313.2" font-size="10.5" fill="#555" text-anchor="middle">paper</text><circle cx="563.5" cy="401.9" r="17" fill="#ffffff" stroke="#9b2c2c" stroke-width="1.8"/><text x="563.5" y="406.9" font-size="13" fill="#9b2c2c" text-anchor="middle" font-weight="bold">2</text><text x="582.3" y="431.8" font-size="10.5" fill="#555" text-anchor="middle">scissors</text><circle cx="476.5" cy="401.9" r="17" fill="#ffffff" stroke="#9b2c2c" stroke-width="1.8"/><text x="476.5" y="406.9" font-size="13" fill="#9b2c2c" text-anchor="middle" font-weight="bold">3</text><text x="457.7" y="431.8" font-size="10.5" fill="#555" text-anchor="middle">lizard</text><circle cx="449.6" cy="319.1" r="17" fill="#ffffff" stroke="#9b2c2c" stroke-width="1.8"/><text x="449.6" y="324.1" font-size="13" fill="#9b2c2c" text-anchor="middle" font-weight="bold">4</text><text x="419.2" y="313.2" font-size="10.5" fill="#555" text-anchor="middle">Spock</text>

  <text x="60" y="486" font-size="11.5" fill="#3b5b9b" font-weight="bold">DEGREES IN THE FIVE-OPTION GAME</text>
  <rect x="60" y="505" width="600" height="25" rx="3" fill="#eef2fa" stroke="#9fb2d4"/><text x="110" y="524" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">point</text><text x="220" y="524" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">0</text><text x="320" y="524" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">1</text><text x="420" y="524" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">2</text><text x="520" y="524" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">3</text><text x="620" y="524" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">4</text><rect x="60" y="532" width="600" height="22" rx="3" fill="#fbfcfe" stroke="#e3e8f2"/><text x="110" y="550" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">out-degree</text><text x="220" y="550" font-size="11.5" fill="#333" text-anchor="middle">2</text><text x="320" y="550" font-size="11.5" fill="#333" text-anchor="middle">2</text><text x="420" y="550" font-size="11.5" fill="#333" text-anchor="middle">2</text><text x="520" y="550" font-size="11.5" fill="#333" text-anchor="middle">2</text><text x="620" y="550" font-size="11.5" fill="#333" text-anchor="middle">2</text><rect x="60" y="556" width="600" height="22" rx="3" fill="#fbfcfe" stroke="#e3e8f2"/><text x="110" y="574" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">in-degree</text><text x="220" y="574" font-size="11.5" fill="#333" text-anchor="middle">2</text><text x="320" y="574" font-size="11.5" fill="#333" text-anchor="middle">2</text><text x="420" y="574" font-size="11.5" fill="#333" text-anchor="middle">2</text><text x="520" y="574" font-size="11.5" fill="#333" text-anchor="middle">2</text><text x="620" y="574" font-size="11.5" fill="#333" text-anchor="middle">2</text>

  <rect x="18" y="624" width="684" height="124" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="644" font-size="11.5" fill="#1f6b34" font-weight="bold">WHY 5 IS SPECIAL FOR THE GAME VERSION</text>
  <text x="40" y="666" font-size="11.5" fill="#333">If every pair of options must be joined by exactly one arrow &#8212; a <tspan font-style="italic">tournament</tspan> &#8212; then balance forces</text>
  <text x="40" y="684" font-size="11.5" fill="#333">each out-degree to be (n &#8722; 1)/2, which is an integer only when n is odd.</text>
  <text x="40" y="710" font-size="11.5" fill="#333">n = 3 gives rock&#8211;paper&#8211;scissors, n = 5 gives the game above, n = 7 works too &#8212; but n = 4 and n = 6</text>
  <text x="40" y="728" font-size="11.5" fill="#333">admit no fair game of this kind at all. The 5-cycle, needing no such condition, works for every n.</text>

  <rect x="18" y="762" width="684" height="124" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="782" font-size="11.5" fill="#b06a10" font-weight="bold">HOW MANY WITNESSES ARE THERE?</text>
  <text x="40" y="804" font-size="11.5" fill="#333">Enumerating all 2&#178;&#8304; = 1 048 576 loopless digraphs on five labelled points, exactly <tspan font-weight="bold">7736</tspan> are balanced &#8212;</text>
  <text x="40" y="822" font-size="11.5" fill="#333">about 0.74%. The empty digraph is one of them, trivially.</text>
  <text x="40" y="848" font-size="11.5" fill="#333">Balance is also exactly the condition for an <tspan font-style="italic">Eulerian circuit</tspan>: a connected digraph has a closed walk</text>
  <text x="40" y="866" font-size="11.5" fill="#333">using every arrow once precisely when it is balanced.</text>
</svg>