<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 887" width="720" height="887" font-family="Georgia, serif">
  <rect x="0" y="0.0" width="720" height="861" fill="#ffffff"/>

  <rect x="18" y="14.0" width="684" height="80" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">AN EXISTENTIAL CLAIM</text>
  <text x="440" y="34.0" font-size="13.5" fill="#1f3a68" text-anchor="middle">some perfect cube is the sum of three perfect cubes</text>
  <text x="360" y="60.0" font-size="17" fill="#1f6b34" text-anchor="middle" font-weight="bold">3&#179; + 4&#179; + 5&#179; = 27 + 64 + 125 = 216 = 6&#179;</text>
  <text x="360" y="82.0" font-size="11" fill="#555" text-anchor="middle" font-style="italic">and 3, 4, 5, 6 are consecutive &#8212; the exact analogue of 3&#178; + 4&#178; = 5&#178; from the previous problem</text>

  <text x="34" y="170.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE VOLUMES ADD</text>
  <text x="34" y="188.0" font-size="11" fill="#555">Three cubes of sides 3, 4 and 5 hold 27 + 64 + 125 = 216 unit cells between them &#8212; exactly a 6 &#215; 6 &#215; 6 cube.</text>
  <polygon points="120.0,271.5 144.7,257.2 120.0,243.0 95.3,257.2" fill="#fde3e3" stroke="#9b2c2c" stroke-width="1.1"/><polygon points="120.0,300.0 144.7,285.8 144.7,257.2 120.0,271.5" fill="#f6c9c9" stroke="#9b2c2c" stroke-width="1.1"/><polygon points="120.0,300.0 95.3,285.8 95.3,257.2 120.0,271.5" fill="#eab3b3" stroke="#9b2c2c" stroke-width="1.1"/><line x1="128.2" y1="266.8" x2="103.5" y2="252.5" stroke="#9b2c2c" stroke-width="0.45" opacity="0.55"/><line x1="111.8" y1="266.8" x2="136.5" y2="252.5" stroke="#9b2c2c" stroke-width="0.45" opacity="0.55"/><line x1="128.2" y1="295.2" x2="128.2" y2="266.8" stroke="#9b2c2c" stroke-width="0.45" opacity="0.55"/><line x1="120.0" y1="290.5" x2="144.7" y2="276.2" stroke="#9b2c2c" stroke-width="0.45" opacity="0.55"/><line x1="111.8" y1="295.2" x2="111.8" y2="266.8" stroke="#9b2c2c" stroke-width="0.45" opacity="0.55"/><line x1="120.0" y1="290.5" x2="95.3" y2="276.2" stroke="#9b2c2c" stroke-width="0.45" opacity="0.55"/><line x1="136.5" y1="262.0" x2="111.8" y2="247.8" stroke="#9b2c2c" stroke-width="0.45" opacity="0.55"/><line x1="103.5" y1="262.0" x2="128.2" y2="247.8" stroke="#9b2c2c" stroke-width="0.45" opacity="0.55"/><line x1="136.5" y1="290.5" x2="136.5" y2="262.0" stroke="#9b2c2c" stroke-width="0.45" opacity="0.55"/><line x1="120.0" y1="281.0" x2="144.7" y2="266.8" stroke="#9b2c2c" stroke-width="0.45" opacity="0.55"/><line x1="103.5" y1="290.5" x2="103.5" y2="262.0" stroke="#9b2c2c" stroke-width="0.45" opacity="0.55"/><line x1="120.0" y1="281.0" x2="95.3" y2="266.8" stroke="#9b2c2c" stroke-width="0.45" opacity="0.55"/><text x="120" y="326.0" font-size="13" fill="#9b2c2c" text-anchor="middle" font-weight="bold">3&#179; = 27</text><polygon points="258.0,262.0 290.9,243.0 258.0,224.0 225.1,243.0" fill="#fff1d6" stroke="#b06a10" stroke-width="1.1"/><polygon points="258.0,300.0 290.9,281.0 290.9,243.0 258.0,262.0" fill="#f7e0b0" stroke="#b06a10" stroke-width="1.1"/><polygon points="258.0,300.0 225.1,281.0 225.1,243.0 258.0,262.0" fill="#eed296" stroke="#b06a10" stroke-width="1.1"/><line x1="266.2" y1="257.2" x2="233.3" y2="238.2" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><line x1="249.8" y1="257.2" x2="282.7" y2="238.2" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><line x1="266.2" y1="295.2" x2="266.2" y2="257.2" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><line x1="258.0" y1="290.5" x2="290.9" y2="271.5" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><line x1="249.8" y1="295.2" x2="249.8" y2="257.2" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><line x1="258.0" y1="290.5" x2="225.1" y2="271.5" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><line x1="274.5" y1="252.5" x2="241.5" y2="233.5" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><line x1="241.5" y1="252.5" x2="274.5" y2="233.5" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><line x1="274.5" y1="290.5" x2="274.5" y2="252.5" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><line x1="258.0" y1="281.0" x2="290.9" y2="262.0" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><line x1="241.5" y1="290.5" x2="241.5" y2="252.5" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><line x1="258.0" y1="281.0" x2="225.1" y2="262.0" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><line x1="282.7" y1="247.8" x2="249.8" y2="228.8" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><line x1="233.3" y1="247.8" x2="266.2" y2="228.8" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><line x1="282.7" y1="285.8" x2="282.7" y2="247.8" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><line x1="258.0" y1="271.5" x2="290.9" y2="252.5" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><line x1="233.3" y1="285.8" x2="233.3" y2="247.8" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><line x1="258.0" y1="271.5" x2="225.1" y2="252.5" stroke="#b06a10" stroke-width="0.45" opacity="0.55"/><text x="258" y="326.0" font-size="13" fill="#b06a10" text-anchor="middle" font-weight="bold">4&#179; = 64</text><polygon points="410.0,252.5 451.1,228.8 410.0,205.0 368.9,228.8" fill="#e6f0fb" stroke="#3b5b9b" stroke-width="1.1"/><polygon points="410.0,300.0 451.1,276.2 451.1,228.8 410.0,252.5" fill="#cfe1f5" stroke="#3b5b9b" stroke-width="1.1"/><polygon points="410.0,300.0 368.9,276.2 368.9,228.8 410.0,252.5" fill="#bcd4ef" stroke="#3b5b9b" stroke-width="1.1"/><line x1="418.2" y1="247.8" x2="377.1" y2="224.0" stroke="#3b5b9b" stroke-width="0.45" opacity="0.55"/><line x1="401.8" y1="247.8" x2="442.9" y2="224.0" stroke="#3b5b9b" stroke-width="0.45" opacity="0.55"/><line x1="418.2" y1="295.2" x2="418.2" y2="247.8" stroke="#3b5b9b" stroke-width="0.45" opacity="0.55"/><line x1="410.0" y1="290.5" x2="451.1" y2="266.8" stroke="#3b5b9b" stroke-width="0.45" opacity="0.55"/><line x1="401.8" y1="295.2" x2="401.8" y2="247.8" stroke="#3b5b9b" stroke-width="0.45" opacity="0.55"/><line x1="410.0" y1="290.5" x2="368.9" y2="266.8" stroke="#3b5b9b" stroke-width="0.45" opacity="0.55"/><line x1="426.5" y1="243.0" x2="385.3" y2="219.2" stroke="#3b5b9b" stroke-width="0.45" opacity="0.55"/><line x1="393.5" y1="243.0" x2="434.7" y2="219.2" stroke="#3b5b9b" stroke-width="0.45" opacity="0.55"/><line x1="426.5" y1="290.5" x2="426.5" y2="243.0" stroke="#3b5b9b" stroke-width="0.45" opacity="0.55"/><line x1="410.0" y1="281.0" x2="451.1" y2="257.2" stroke="#3b5b9b" stroke-width="0.45" opacity="0.55"/><line x1="393.5" y1="290.5" x2="393.5" y2="243.0" stroke="#3b5b9b" stroke-width="0.45" opacity="0.55"/><line x1="410.0" y1="281.0" x2="368.9" y2="257.2" stroke="#3b5b9b" stroke-width="0.45" opacity="0.55"/><line x1="434.7" y1="238.2" x2="393.5" y2="214.5" stroke="#3b5b9b" stroke-width="0.45" opacity="0.55"/><line x1="385.3" y1="238.2" x2="426.5" y2="214.5" stroke="#3b5b9b" stroke-width="0.45" opacity="0.55"/><line x1="434.7" y1="285.8" x2="434.7" y2="238.2" stroke="#3b5b9b" stroke-width="0.45" opacity="0.55"/><line x1="410.0" y1="271.5" x2="451.1" y2="247.8" stroke="#3b5b9b" stroke-width=