stroke-width="0.45" opacity="0.55"/><line x1="573.5" y1="233.5" x2="622.9" y2="205.0" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="606.5" y1="290.5" x2="606.5" y2="233.5" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="590.0" y1="281.0" x2="639.4" y2="252.5" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="573.5" y1="290.5" x2="573.5" y2="233.5" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="590.0" y1="281.0" x2="540.6" y2="252.5" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="614.7" y1="228.8" x2="565.3" y2="200.2" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="565.3" y1="228.8" x2="614.7" y2="200.2" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="614.7" y1="285.8" x2="614.7" y2="228.8" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="590.0" y1="271.5" x2="639.4" y2="243.0" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="565.3" y1="285.8" x2="565.3" y2="228.8" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="590.0" y1="271.5" x2="540.6" y2="243.0" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="622.9" y1="224.0" x2="573.5" y2="195.5" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="557.1" y1="224.0" x2="606.5" y2="195.5" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="622.9" y1="281.0" x2="622.9" y2="224.0" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="590.0" y1="262.0" x2="639.4" y2="233.5" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="557.1" y1="281.0" x2="557.1" y2="224.0" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="590.0" y1="262.0" x2="540.6" y2="233.5" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="631.1" y1="219.2" x2="581.8" y2="190.8" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="548.9" y1="219.2" x2="598.2" y2="190.8" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="631.1" y1="276.2" x2="631.1" y2="219.2" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="590.0" y1="252.5" x2="639.4" y2="224.0" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="548.9" y1="276.2" x2="548.9" y2="219.2" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><line x1="590.0" y1="252.5" x2="540.6" y2="224.0" stroke="#1f6b34" stroke-width="0.45" opacity="0.55"/><text x="590" y="326.0" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">6&#179; = 216</text><text x="192" y="282.0" font-size="20" fill="#555" text-anchor="middle">+</text><text x="336" y="282.0" font-size="20" fill="#555" text-anchor="middle">+</text><text x="504" y="282.0" font-size="20" fill="#555" text-anchor="middle">=</text>

  <text x="60" y="366.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE FIRST FEW PRIMITIVE SOLUTIONS</text>
  <text x="660" y="366.0" font-size="10.5" fill="#555" text-anchor="end" font-style="italic">36 solutions with d &#8804; 60, of which 15 are primitive</text>
  <rect x="60" y="384.0" width="600" height="25" rx="3" fill="#eef2fa" stroke="#9fb2d4"/><text x="150" y="402.0" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">a, b, c</text><text x="300" y="402.0" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">a&#179; + b&#179; + c&#179;</text><text x="470" y="402.0" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">total</text><text x="600" y="402.0" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">= d&#179;</text><rect x="60" y="410.0" width="600" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="2.1"/><text x="150" y="427.0" font-size="11.5" fill="#333" text-anchor="middle">3, 4, 5</text><text x="300" y="427.0" font-size="11.5" fill="#333" text-anchor="middle">27 + 64 + 125</text><text x="470" y="427.0" font-size="11.5" fill="#333" text-anchor="middle">216</text><text x="600" y="427.0" font-size="11.5" fill="#333" text-anchor="middle">6&#179;</text><rect x="60" y="434.0" width="600" height="22" rx="3" fill="#fbfcfe" stroke="#e3e8f2" stroke-width="0.8"/><text x="150" y="451.0" font-size="11.5" fill="#333" text-anchor="middle">1, 6, 8</text><text x="300" y="451.0" font-size="11.5" fill="#333" text-anchor="middle">1 + 216 + 512</text><text x="470" y="451.0" font-size="11.5" fill="#333" text-anchor="middle">729</text><text x="600" y="451.0" font-size="11.5" fill="#333" text-anchor="middle">9&#179;</text><rect x="60" y="458.0" width="600" height="22" rx="3" fill="#fbfcfe" stroke="#e3e8f2" stroke-width="0.8"/><text x="150" y="475.0" font-size="11.5" fill="#333" text-anchor="middle">3, 10, 18</text><text x="300" y="475.0" font-size="11.5" fill="#333" text-anchor="middle">27 + 1000 + 5832</text><text x="470" y="475.0" font-size="11.5" fill="#333" text-anchor="middle">6859</text><text x="600" y="475.0" font-size="11.5" fill="#333" text-anchor="middle">19&#179;</text><rect x="60" y="482.0" width="600" height="22" rx="3" fill="#fbfcfe" stroke="#e3e8f2" stroke-width="0.8"/><text x="150" y="499.0" font-size="11.5" fill="#333" text-anchor="middle">7, 14, 17</text><text x="300" y="499.0" font-size="11.5" fill="#333" text-anchor="middle">343 + 2744 + 4913</text><text x="470" y="499.0" font-size="11.5" fill="#333" text-anchor="middle">8000</text><text x="600" y="499.0" font-size="11.5" fill="#333" text-anchor="middle">20&#179;</text><rect x="60" y="506.0" width="600" height="22" rx="3" fill="#fbfcfe" stroke="#e3e8f2" stroke-width="0.8"/><text x="150" y="523.0" font-size="11.5" fill="#333" text-anchor="middle">18, 19, 21</text><text x="300" y="523.0" font-size="11.5" fill="#333" text-anchor="middle">5832 + 6859 + 9261</text><text x="470" y="523.0" font-size="11.5" fill="#333" text-anchor="middle">21952</text><text x="600" y="523.0" font-size="11.5" fill="#333" text-anchor="middle">28&#179;</text><rect x="60" y="530.0" width="600" height="22" rx="3" fill="#fbfcfe" stroke="#e3e8f2" stroke-width="0.8"/><text x="150" y="547.0" font-size="11.5" fill="#333" text-anchor="middle">11, 15, 27</text><text x="300" y="547.0" font-size="11.5" fill="#333" text-anchor="middle">1331 + 3375 + 19683</text><text x="470" y="547.0" font-size="11.5" fill="#333" text-anchor="middle">24389</text><text x="600" y="547.0" font-size="11.5" fill="#333" text-anchor="middle">29&#179;</text>

  <rect x="18" y="593.0" width="684" height="124" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="613.0" font-size="11.5" fill="#1f6b34" font-weight="bold">TWO CUBES CANNOT, THREE CAN</text>
  <text x="40" y="635.0" font-size="11.5" fill="#333">Fermat&#8217;s Last Theorem forbids a&#179; + b&#179; = c&#179; entirely, so the previous problem&#8217;s pattern does not survive</text>
  <text x="40" y="652.0" font-size="11.5" fill="#333">a change of exponent with the number of terms held fixed. Add a third cube and solutions reappear at once.</text>
  <text x="40" y="677.0" font-size="11.5" fill="#333">The suggestive rule: it takes <tspan font-weight="bold">k</tspan> k-th powers to make a k-th power. Two squares make a square; three cubes</text>
  <text x="40" y="694.0" font-size="11.5" fill="#333">make a cube. Euler conjectured in 1769 that k &#8722; 1 of them never suffice.</text>

  <rect x="18" y="731.0" width="684" height="140" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="751.0" font-size="11.5" fill="#9b2c2c" font-weight="bold">BUT EULER&#8217;S CONJECTURE IS FALSE</text>
  <text x="40" y="773.0" font-size="11.5" fill="#333">It survived nearly two centuries and then failed twice, at k = 5 and at k = 4:</text>
  <text x="40" y="799.0" font-size="12" fill="#1f3a68">Lander &amp; Parkin, 1966:&#160;&#160; 27&#8309; + 84&#8309; + 110&#8309; + 133&#8309; = 144&#8309;</text>
  <text x="40" y="823.0" font-size="12" fill="#1f3a68">Elkies, 1988:&#160;&#160; 2682440&#8308; + 15365639&#8308; + 18796760&#8308; = 20615673&#8308;</text>
  <text x="40" y="849.0" font-size="11" fill="#555" font-style="italic">Both identities were checked exactly. So the tidy pattern this problem seems to begin does not continue,</text>
  <text x="40" y="864.0" font-size="11" fill="#555" font-style="italic">and no amount of evidence at k = 2 and k = 3 was going to settle it.</text>
</svg>