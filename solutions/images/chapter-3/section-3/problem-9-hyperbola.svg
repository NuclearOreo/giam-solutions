<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700" font-family="Georgia, serif">
  <defs>
    <marker id="g1" markerWidth="8" markerHeight="8" refX="6.5" refY="2.9" orient="auto">
      <path d="M0,0 L6.5,2.9 L0,5.8 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="700" fill="#ffffff"/>

  <!-- band 1 -->
  <rect x="18" y="14" width="684" height="58" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">TO PROVE</text>
  <text x="405" y="33" font-size="13.5" fill="#1f3a68" text-anchor="middle">ab = cd = 1 with a, b, c, d &gt; 0&#160;&#160;and&#160;&#160;a &lt; c&#160;&#160;&#8658;&#160;&#160;b &gt; d</text>
  <text x="405" y="55" font-size="11" fill="#555" text-anchor="middle" font-style="italic">both pairs sit on the hyperbola xy = 1, and the claim is that its positive branch falls as you move right</text>

  <!-- band 2: three routes -->
  <rect x="18" y="82" width="684" height="140" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="102" font-size="11.5" fill="#1f6b34" font-weight="bold">THREE ROUTES, ALL SHORT</text>

  <rect x="34" y="112" width="212" height="98" rx="5" fill="#ffffff" stroke="#9bb8a5"/>
  <text x="140" y="130" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">direct</text>
  <text x="46" y="150" font-size="11" fill="#333">b = 1/a and d = 1/c.</text>
  <text x="46" y="168" font-size="11" fill="#333">0 &lt; a &lt; c, and x &#8614; 1/x is</text>
  <text x="46" y="184" font-size="11" fill="#333">strictly decreasing on the</text>
  <text x="46" y="200" font-size="11" fill="#333">positives, so 1/a &gt; 1/c.</text>

  <rect x="254" y="112" width="212" height="98" rx="5" fill="#ffffff" stroke="#9bb8a5"/>
  <text x="360" y="130" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">contraposition</text>
  <text x="266" y="150" font-size="11" fill="#333">Assume b &#8804; d. Multiply by</text>
  <text x="266" y="168" font-size="11" fill="#333">a &gt; 0:&#160; 1 = ab &#8804; ad.</text>
  <text x="266" y="184" font-size="11" fill="#333">Divide by d &gt; 0:&#160; 1/d &#8804; a.</text>
  <text x="266" y="200" font-size="11" fill="#333">But 1/d = c, so c &#8804; a.</text>

  <rect x="474" y="112" width="212" height="98" rx="5" fill="#fdf3f3" stroke="#9b2c2c"/>
  <text x="580" y="130" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">contradiction</text>
  <text x="486" y="150" font-size="11" fill="#333">Assume a &lt; c and b &#8804; d.</text>
  <text x="486" y="168" font-size="11" fill="#333">Then 1 = ab &#8804; ad &lt; cd = 1,</text>
  <text x="486" y="184" font-size="11" fill="#333">so 1 &lt; 1.</text>
  <text x="486" y="202" font-size="10.5" fill="#9b2c2c" font-style="italic">each step needs a positive factor</text>

  <!-- LEFT PLOT -->
  <text x="34" y="242" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE POSITIVE BRANCH FALLS</text>
  <rect x="70" y="250" width="270" height="220" fill="#fbfcfe" stroke="#dde3ee"/>
  <line x1="70" y1="470" x2="354" y2="470" stroke="#555" stroke-width="1.2" marker-end="url(#g1)"/>
  <line x1="70" y1="470" x2="70" y2="236" stroke="#555" stroke-width="1.2" marker-end="url(#g1)"/>
  <text x="358" y="474" font-size="11" fill="#444">x</text>
  <text x="82" y="246" font-size="11" fill="#444" text-anchor="middle">y</text>
