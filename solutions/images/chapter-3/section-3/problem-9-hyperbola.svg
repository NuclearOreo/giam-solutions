L 260.2,453.9 L 261.5,454.0 L 262.7,454.1 L 263.9,454.2 L 265.1,454.3 L 266.4,454.4 L 267.6,454.5 L 268.8,454.6 L 270.0,454.7 L 271.3,454.8 L 272.5,454.8 L 273.7,454.9 L 275.0,455.0 L 276.2,455.1 L 277.4,455.2 L 278.6,455.3 L 279.9,455.4 L 281.1,455.5 L 282.3,455.5 L 283.5,455.6 L 284.8,455.7 L 286.0,455.8 L 287.2,455.9 L 288.5,456.0 L 289.7,456.0 L 290.9,456.1 L 292.1,456.2 L 293.4,456.3 L 294.6,456.3 L 295.8,456.4 L 297.0,456.5 L 298.3,456.6 L 299.5,456.6 L 300.7,456.7 L 302.0,456.8 L 303.2,456.8 L 304.4,456.9 L 305.6,457.0 L 306.9,457.0 L 308.1,457.1 L 309.3,457.2 L 310.5,457.2 L 311.8,457.3 L 313.0,457.4 L 314.2,457.4 L 315.5,457.5 L 316.7,457.6 L 317.9,457.6 L 319.1,457.7 L 320.4,457.7 L 321.6,457.8 L 322.8,457.9 L 324.0,457.9 L 325.3,458.0 L 326.5,458.0 L 327.7,458.1 L 329.0,458.2 L 330.2,458.2 L 331.4,458.3 L 332.6,458.3 L 333.9,458.4 L 335.1,458.4 L 336.3,458.5 L 337.5,458.5 L 338.8,458.6 L 340.0,458.6" fill="none" stroke="#3b5b9b" stroke-width="2"/>
  <text x="260" y="444" font-size="11" fill="#3b5b9b">xy = 1</text>

  <line x1="100.68181818181819" y1="370.0" x2="100.68181818181819" y2="470" stroke="#1f6b34" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="100.68181818181819" y1="370.0" x2="70" y2="370.0" stroke="#1f6b34" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="192.72727272727272" y1="445.0" x2="192.72727272727272" y2="470" stroke="#9b2c2c" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="192.72727272727272" y1="445.0" x2="70" y2="445.0" stroke="#9b2c2c" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="100.68181818181819" cy="370.0" r="4.5" fill="#1f6b34"/>
  <circle cx="192.72727272727272" cy="445.0" r="4.5" fill="#9b2c2c"/>
  <text x="108.68181818181819" y="364.0" font-size="11.5" fill="#1f6b34" font-weight="bold">(a, b)</text>
  <text x="200.72727272727272" y="439.0" font-size="11.5" fill="#9b2c2c" font-weight="bold">(c, d)</text>
  <text x="100.68181818181819" y="485" font-size="10.5" fill="#1f6b34" text-anchor="middle">a</text>
  <text x="192.72727272727272" y="485" font-size="10.5" fill="#9b2c2c" text-anchor="middle">c</text>
  <text x="64" y="374.0" font-size="10.5" fill="#1f6b34" text-anchor="end">b</text>
  <text x="64" y="449.0" font-size="10.5" fill="#9b2c2c" text-anchor="end">d</text>
  <text x="205.0" y="506" font-size="11" fill="#333" text-anchor="middle">move right from a to c, and the curve must drop: b &gt; d</text>
  <text x="205.0" y="522" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">shown with a = &#189;, b = 2, c = 2, d = &#189;</text>

  <!-- RIGHT PLOT -->
  <text x="400" y="242" font-size="11.5" fill="#9b2c2c" font-weight="bold">DROP POSITIVITY AND IT BREAKS</text>
  <rect x="430" y="250" width="240" height="220" fill="#fefbfb" stroke="#eedddd"/>
  <line x1="430" y1="360.0" x2="670" y2="360.0" stroke="#999" stroke-width="1"/>
  <line x1="550.0" y1="250" x2="550.0" y2="470" stroke="#999" stroke-width="1"/>
