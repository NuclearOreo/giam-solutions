  <circle cx="587.5" cy="325.625" r="4.5" fill="#3b5b9b"/>
  <circle cx="512.5" cy="394.375" r="4.5" fill="#b06a10"/>
  <text x="595.5" y="319.625" font-size="11" fill="#3b5b9b" font-weight="bold">(c, d) = (1, 1)</text>
  <text x="504.5" y="410.375" font-size="11" fill="#b06a10" text-anchor="end" font-weight="bold">(a, b) = (&#8722;1, &#8722;1)</text>
  <text x="550.0" y="492" font-size="11" fill="#333" text-anchor="middle">Both satisfy xy = 1, and a = &#8722;1 &lt; 1 = c,</text>
  <text x="550.0" y="508" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">yet b = &#8722;1 &lt; 1 = d.</text>
  <text x="550.0" y="524" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">the two points are on different branches</text>

  <!-- bottom band -->
  <rect x="18" y="546" width="684" height="136" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="566" font-size="11.5" fill="#b06a10" font-weight="bold">WHERE POSITIVITY IS SPENT &#8212; three separate times</text>
  <text x="40" y="590" font-size="11.5" fill="#333">1.&#160; a &gt; 0 and c &gt; 0 make b = 1/a and d = 1/c legal, and put both points on the same branch.</text>
  <text x="40" y="610" font-size="11.5" fill="#333">2.&#160; a &gt; 0 lets us multiply b &#8804; d by a without flipping the inequality.</text>
  <text x="40" y="630" font-size="11.5" fill="#333">3.&#160; d &gt; 0 lets us multiply a &lt; c by d without flipping it.</text>
  <text x="40" y="656" font-size="11.5" fill="#333">Remove any one and the argument collapses &#8212; multiplying an inequality by a negative reverses it, which is</text>
  <text x="40" y="672" font-size="11.5" fill="#333">exactly what the counterexample on the right exploits.</text>
</svg>