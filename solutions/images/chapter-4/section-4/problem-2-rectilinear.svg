<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 753" width="720" height="753" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="753" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="86" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">FIVE SETS FROM FOUR, BY ADDING ONE SNAKING CURVE</text>
  <text x="360" y="58" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="bold">a closed curve that crosses every face exactly once doubles the number of regions: 16 &#8594; 32</text>
  <text x="360" y="80" font-size="11.5" fill="#333" text-anchor="middle">The curve E below has 34 unit segments and 24 right-angle corners. All 32 regions verified present and connected.</text>
  <rect x="22" y="118" width="336" height="330" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="138" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">Step 1: order the 16 faces into a cycle</text><rect x="89.4" y="273.6" width="201.2" height="115.0" fill="#3b5b9b" fill-opacity="0.07" stroke="#3b5b9b" stroke-width="1.6"/><text x="84.4" y="267.6" font-size="11.5" fill="#3b5b9b" text-anchor="end" font-weight="bold">A</text><rect x="118.1" y="244.9" width="115.0" height="57.5" fill="#9b2c2c" fill-opacity="0.07" stroke="#9b2c2c" stroke-width="1.6"/><text x="113.1" y="238.9" font-size="11.5" fill="#9b2c2c" text-anchor="end" font-weight="bold">B</text><rect x="146.9" y="187.4" width="57.5" height="172.5" fill="#1f6b34" fill-opacity="0.07" stroke="#1f6b34" stroke-width="1.6"/><text x="141.9" y="181.4" font-size="11.5" fill="#1f6b34" text-anchor="end" font-weight="bold">C</text><rect x="175.6" y="216.1" width="86.2" height="115.0" fill="#b06a10" fill-opacity="0.07" stroke="#b06a10" stroke-width="1.6"/><text x="170.6" y="210.1" font-size="11.5" fill="#b06a10" text-anchor="end" font-weight="bold">D</text><text x="103.8" y="262.9" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">1</text><text x="132.5" y="262.9" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">2</text><text x="132.5" y="291.6" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">3</text><text x="190.0" y="377.9" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">4</text><text x="161.2" y="349.1" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">5</text><text x="190.0" y="320.4" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">6</text><text x="190.0" y="291.6" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">7</text><text x="161.2" y="291.6" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">8</text><text x="161.2" y="262.9" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">9</text><text x="161.2" y="205.3" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">10</text><text x="190.0" y="234.1" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">11</text><text x="190.0" y="262.9" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">12</text><text x="218.7" y="262.9" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">13</text><text x="218.7" y="291.6" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">14</text><text x="247.5" y="320.4" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">15</text><text x="247.5" y="234.1" font-size="10.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">16</text><text x="190.0" y="439" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">visit them in this order; consecutive faces share a border</text><rect x="372" y="118" width="336" height="330" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="138" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">Step 2: E is the inside of that curve</text><rect x="439.4" y="273.6" width="201.2" height="115.0" fill="#3b5b9b" fill-opacity="0.07" stroke="#3b5b9b" stroke-width="1.6"/><text x="434.4" y="267.6" font-size="11.5" fill="#3b5b9b" text-anchor="end" font-weight="bold">A</text><rect x="468.1" y="244.9" width="115.0" height="57.5" fill="#9b2c2c" fill-opacity="0.07" stroke="#9b2c2c" stroke-width="1.6"/><text x="463.1" y="238.9" font-size="11.5" fill="#9b2c2c" text-anchor="end" font-weight="bold">B</text><rect x="496.9" y="187.4" width="57.5" height="172.5" fill="#1f6b34" fill-opacity="0.07" stroke="#1f6b34" stroke-width="1.6"/><text x="491.9" y="181.4" font-size="11.5" fill="#1f6b34" text-anchor="end" font-weight="bold">C</text><rect x="525.6" y="216.1" width="86.2" height="115.0" fill="#b06a10" fill-opacity="0.07" stroke="#b06a10" stroke-width="1.6"/><text x="520.6" y="210.1" font-size="11.5" fill="#b06a10" text-anchor="end" font-weight="bold">D</text><polygon points="626.2,230.5 626.2,201.8 568.8,201.8 568.8,173.0 482.5,173.0 482.5,288.0 453.8,288.0 453.8,316.8 482.5,316.8 482.5,374.2 540.0,374.2 540.0,345.5 511.2,345.5 511.2,316.8 540.0,316.8 540.0,288.0 511.2,288.0 511.2,230.5 540.0,230.5 540.0,259.2 568.8,259.2 568.8,288.0 597.5,288.0 597.5,230.5" fill="#7a4fa3" fill-opacity="0.13" stroke="#7a4fa3" stroke-width="2.4" stroke-linejoin="miter"/><text x="633.2" y="225.5" font-size="12" fill="#7a4fa3" font-weight="bold">E</text><text x="540.0" y="439" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">4 rectangles + 1 rectilinear curve = 32 regions</text>
  <rect x="18" y="462" width="684" height="150" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="482" font-size="11.5" fill="#1f6b34" font-weight="bold">WHY CROSSING EACH FACE ONCE IS EXACTLY THE RIGHT CONDITION</text>
  <text x="40" y="506" font-size="11.5" fill="#333">A single arc through a disc cuts it into two discs. So if E&#8217;s boundary crosses a face f in one arc,</text>
  <text x="40" y="524" font-size="11.5" fill="#333">f splits into f &#8745; E and f \ E, both non-empty and both connected &#8212; precisely what a Venn diagram needs.</text>
  <text x="40" y="550" font-size="11.5" fill="#333">Crossing every face exactly once means the faces, taken in the order the curve meets them, form a</text>
  <text x="40" y="568" font-size="11.5" fill="#333">Hamiltonian cycle in the graph whose vertices are faces and whose edges join faces sharing a border.</text>
  <text x="40" y="594" font-size="11.5" fill="#333">For the four-rectangle diagram that graph has 16 vertices, degrees 3 and 4, and a cycle was found by search.</text>
  <rect x="18" y="625" width="684" height="112" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="645" font-size="11.5" fill="#b06a10" font-weight="bold">WHY A RECTANGLE COULD NOT HAVE DONE THIS</text>
  <text x="40" y="669" font-size="11.5" fill="#333">A rectangle has only 4 sides, and a straight side meets a convex region at most twice, so it cannot</text>
  <text x="40" y="687" font-size="11.5" fill="#333">weave through sixteen faces. Being allowed as many right-angle turns as we like is the whole difference</text>
  <text x="40" y="705" font-size="11.5" fill="#333">&#8212; and it is why Problem 1 stopped at four while this construction keeps going for every n.</text>
</svg>