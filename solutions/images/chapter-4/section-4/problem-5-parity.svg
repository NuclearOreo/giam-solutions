  <rect x="18" y="14" width="684" height="88" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE TRIPLE SYMMETRIC DIFFERENCE IS A PARITY TEST</text>
  <text x="360" y="60" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="bold">(A &#9651; B) &#9651; C = (A&#8745;B&#8745;C) &#8746; (A&#8745;B&#772;&#8745;C&#772;) &#8746; (A&#772;&#8745;B&#8745;C&#772;) &#8746; (A&#772;&#8745;B&#772;&#8745;C)</text>
  <text x="360" y="83" font-size="11.5" fill="#333" text-anchor="middle">Four atoms &#8212; exactly those lying in an odd number of the three sets. Checked over 262144 triples.</text>
  <rect x="18" y="116" width="684" height="330" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="360.0" y="137" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">shaded = odd membership count; the number in each region is that count</text><g clip-path="url(#c0)"><g clip-path="url(#c1)"><g clip-path="url(#c2)"><rect x="0" y="0" width="720" height="2000" fill="#7a4fa3" fill-opacity="0.42"/></g></g></g><g clip-path="url(#c0)"><g mask="url(#not1)"><g mask="url(#not2)"><rect x="0" y="0" width="720" height="2000" fill="#7a4fa3" fill-opacity="0.42"/></g></g></g><g clip-path="url(#c1)"><g mask="url(#not0)"><g mask="url(#not2)"><rect x="0" y="0" width="720" height="2000" fill="#7a4fa3" fill-opacity="0.42"/></g></g></g><g clip-path="url(#c2)"><g mask="url(#not0)"><g mask="url(#not1)"><rect x="0" y="0" width="720" height="2000" fill="#7a4fa3" fill-opacity="0.42"/></g></g></g><circle cx="319.7" cy="323.2" r="80.6" fill="none" stroke="#3b5b9b" stroke-width="2"/><circle cx="400.3" cy="323.2" r="80.6" fill="none" stroke="#9b2c2c" stroke-width="2"/><circle cx="360.0" cy="253.5" r="80.6" fill="none" stroke="#1f6b34" stroke-width="2"/><text x="218.2" y="307.9" font-size="15" fill="#3b5b9b" text-anchor="middle" font-weight="bold">A</text><text x="501.8" y="307.9" font-size="15" fill="#9b2c2c" text-anchor="middle" font-weight="bold">B</text><text x="360.0" y="168.5" font-size="15" fill="#1f6b34" text-anchor="middle" font-weight="bold">C</text><text x="360.0" y="300.0" font-size="12" fill="#2a1a52" text-anchor="middle" font-weight="bold">ABC</text><text x="360.0" y="315.0" font-size="12.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">3</text><text x="360.0" y="347.4" font-size="12" fill="#999" text-anchor="middle" font-weight="normal">AB<tspan text-decoration='overline'>C</tspan></text><text x="360.0" y="362.4" font-size="12.5" fill="#bbb" text-anchor="middle" font-weight="bold">2</text><text x="318.1" y="273.3" font-size="12" fill="#999" text-anchor="middle" font-weight="normal">A<tspan text-decoration='overline'>B</tspan>C</text><text x="318.1" y="288.3" font-size="12.5" fill="#bbb" text-anchor="middle" font-weight="bold">2</text><text x="401.9" y="273.3" font-size="12" fill="#999" text-anchor="middle" font-weight="normal"><tspan text-decoration='overline'>A</tspan>BC</text><text x="401.9" y="288.3" font-size="12.5" fill="#bbb" text-anchor="middle" font-weight="bold">2</text><text x="277.8" y="345.8" font-size="12" fill="#2a1a52" text-anchor="middle" font-weight="bold">A<tspan text-decoration='overline'>B</tspan><tspan text-decoration='overline'>C</tspan></text><text x="277.8" y="360.8" font-size="12.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">1</text><text x="442.2" y="345.8" font-size="12" fill="#2a1a52" text-anchor="middle" font-weight="bold"><tspan text-decoration='overline'>A</tspan>B<tspan text-decoration='overline'>C</tspan></text><text x="442.2" y="360.8" font-size="12.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">1</text><text x="360.0" y="208.8" font-size="12" fill="#2a1a52" text-anchor="middle" font-weight="bold"><tspan text-decoration='overline'>A</tspan><tspan text-decoration='overline'>B</tspan>C</text><text x="360.0" y="223.8" font-size="12.5" fill="#7a4fa3" text-anchor="middle" font-weight="bold">1</text><text x="476.8" y="198.3" font-size="12" fill="#999" text-anchor="middle" font-weight="normal"><tspan text-decoration='overline'>A</tspan><tspan text-decoration='overline'>B</tspan><tspan text-decoration='overline'>C</tspan></text><text x="476.8" y="213.3" font-size="12.5" fill="#bbb" text-anchor="middle" font-weight="bold">0</text>
  <rect x="18" y="462" width="684" height="218" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/><rect x="18" y="462" width="684" height="28" rx="6" fill="#eef2fa"/><rect x="18" y="482" width="684" height="8" fill="#eef2fa"/><line x1="18" y1="490" x2="702" y2="490" stroke="#3b5b9b" stroke-width="1.2"/><text x="140" y="481" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">ATOM</text><text x="330" y="481" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">HOW MANY OF A, B, C</text><text x="540" y="481" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">IN (A &#9651; B) &#9651; C?</text><text x="140" y="511" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">ABC</text><text x="330" y="511" font-size="11.5" fill="#666" text-anchor="middle">3 (odd)</text><text x="540" y="511" font-size="11" fill="#7a4fa3" text-anchor="middle" font-weight="bold">YES</text><rect x="19" y="516" width="682" height="22" fill="#fafafa"/><text x="140" y="533" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">AB<tspan text-decoration='overline'>C</tspan></text><text x="330" y="533" font-size="11.5" fill="#666" text-anchor="middle">2 (even)</text><text x="540" y="533" font-size="11" fill="#bbb" text-anchor="middle" font-weight="normal">no</text><text x="140" y="555" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">A<tspan text-decoration='overline'>B</tspan>C</text><text x="330" y="555" font-size="11.5" fill="#666" text-anchor="middle">2 (even)</text><text x="540" y="555" font-size="11" fill="#bbb" text-anchor="middle" font-weight="normal">no</text><rect x="19" y="560" width="682" height="22" fill="#fafafa"/><text x="140" y="577" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">A<tspan text-decoration='overline'>B</tspan><tspan text-decoration='overline'>C</tspan></text><text x="330" y="577" font-size="11.5" fill="#666" text-anchor="middle">1 (odd)</text><text x="540" y="577" font-size="11" fill="#7a4fa3" text-anchor="middle" font-weight="bold">YES</text><text x="140" y="599" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold"><tspan text-decoration='overline'>A</tspan>BC</text><text x="330" y="599" font-size="11.5" fill="#666" text-anchor="middle">2 (even)</text><text x="540" y="599" font-size="11" fill="#bbb" text-anchor="middle" font-weight="normal">no</text><rect x="19" y="604" width="682" height="22" fill="#fafafa"/><text x="140" y="621" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold"><tspan text-decoration='overline'>A</tspan>B<tspan text-decoration='overline'>C</tspan></text><text x="330" y="621" font-size="11.5" fill="#666" text-anchor="middle">1 (odd)</text><text x="540" y="621" font-size="11" fill="#7a4fa3" text-anchor="middle" font-weight="bold">YES</text><text x="140" y="643" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold"><tspan text-decoration='overline'>A</tspan><tspan text-decoration='overline'>B</tspan>C</text><text x="330" y="643" font-size="11.5" fill="#666" text-anchor="middle">1 (odd)</text><text x="540" y="643" font-size="11" fill="#7a4fa3" text-anchor="middle" font-weight="bold">YES</text><rect x="19" y="648" width="682" height="22" fill="#fafafa"/><text x="140" y="665" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold"><tspan text-decoration='overline'>A</tspan><tspan text-decoration='overline'>B</tspan><tspan text-decoration='overline'>C</tspan></text><text x="330" y="665" font-size="11.5" fill="#666" text-anchor="middle">0 (even)</text><text x="540" y="665" font-size="11" fill="#bbb" text-anchor="middle" font-weight="normal">no</text>
  <rect x="18" y="696" width="684" height="142" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="716" font-size="11.5" fill="#1f6b34" font-weight="bold">THIS ONE CANNOT BE SHORTENED</text>
  <text x="40" y="740" font-size="11.5" fill="#333">In Problem 4 the three atoms could be merged: A&#8745;B&#8745;C and A&#8745;B&#8745;C&#772; glue into the single term A&#8745;B.</text>
  <text x="40" y="766" font-size="11.5" fill="#333">Here nothing glues. Two atoms merge only when they differ in one letter &#8212; but flipping one letter</text>
  <text x="40" y="784" font-size="11.5" fill="#333">changes the parity, so the partner is always an atom that is <tspan font-style="italic">out</tspan>. Checked by enumerating every</text>
  <text x="40" y="802" font-size="11.5" fill="#333">product of literals for n = 3 and n = 4: each one that fits inside the set covers just a single atom.</text>
  <text x="40" y="828" font-size="11.5" fill="#333">So the four terms above are forced, and for n sets the shortest form needs all 2&#8319;&#8315;&#185; odd atoms.</text>
</svg>