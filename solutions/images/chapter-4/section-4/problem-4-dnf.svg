<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 852" width="720" height="852" font-family="Georgia, serif">
  <defs><clipPath id="c0"><circle cx="319.7" cy="323.2" r="80.6"/></clipPath><clipPath id="c1"><circle cx="400.3" cy="323.2" r="80.6"/></clipPath><clipPath id="c2"><circle cx="360.0" cy="253.5" r="80.6"/></clipPath><mask id="not0"><rect x="0" y="0" width="720" height="2000" fill="white"/><circle cx="319.7" cy="323.2" r="80.6" fill="black"/></mask><mask id="not1"><rect x="0" y="0" width="720" height="2000" fill="white"/><circle cx="400.3" cy="323.2" r="80.6" fill="black"/></mask><mask id="not2"><rect x="0" y="0" width="720" height="2000" fill="white"/><circle cx="360.0" cy="253.5" r="80.6" fill="black"/></mask></defs>
  <rect x="0" y="0" width="720" height="852" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="88" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">DISJUNCTIVE NORMAL FORM = THE LIST OF SHADED ATOMS</text>
  <text x="360" y="60" font-size="13.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">A &#8745; (B &#8746; C) = (A&#8745;B&#8745;C) &#8746; (A&#8745;B&#8745;C&#772;) &#8746; (A&#8745;B&#772;&#8745;C)</text>
  <text x="360" y="83" font-size="11.5" fill="#333" text-anchor="middle">Checked against A &#8745; (B &#8746; C) for all 262144 triples of subsets of a 6-element universe.</text>
  <rect x="18" y="116" width="684" height="330" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="360.0" y="137" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the three shaded atoms are the disjunctive normal form</text><g clip-path="url(#c0)"><g clip-path="url(#c1)"><g clip-path="url(#c2)"><rect x="0" y="0" width="720" height="2000" fill="#7a4fa3" fill-opacity="0.42"/></g></g></g><g clip-path="url(#c0)"><g clip-path="url(#c1)"><g mask="url(#not2)"><rect x="0" y="0" width="720" height="2000" fill="#7a4fa3" fill-opacity="0.42"/></g></g></g><g clip-path="url(#c0)"><g clip-path="url(#c2)"><g mask="url(#not1)"><rect x="0" y="0" width="720" height="2000" fill="#7a4fa3" fill-opacity="0.42"/></g></g></g><circle cx="319.7" cy="323.2" r="80.6" fill="none" stroke="#3b5b9b" stroke-width="2"/><circle cx="400.3" cy="323.2" r="80.6" fill="none" stroke="#9b2c2c" stroke-width="2"/><circle cx="360.0" cy="253.5" r="80.6" fill="none" stroke="#1f6b34" stroke-width="2"/><text x="218.2" y="307.9" font-size="15" fill="#3b5b9b" text-anchor="middle" font-weight="bold">A</text><text x="501.8" y="307.9" font-size="15" fill="#9b2c2c" text-anchor="middle" font-weight="bold">B</text><text x="360.0" y="168.5" font-size="15" fill="#1f6b34" text-anchor="middle" font-weight="bold">C</text><text x="360.0" y="304.0" font-size="12.5" fill="#2a1a52" text-anchor="middle" font-weight="bold">ABC</text><text x="360.0" y="351.4" font-size="12.5" fill="#2a1a52" text-anchor="middle" font-weight="bold">AB<tspan text-decoration='overline'>C</tspan></text><text x="318.1" y="277.3" font-size="12.5" fill="#2a1a52" text-anchor="middle" font-weight="bold">A<tspan text-decoration='overline'>B</tspan>C</text><text x="401.9" y="277.3" font-size="12.5" fill="#999" text-anchor="middle" font-weight="normal"><tspan text-decoration='overline'>A</tspan>BC</text><text x="279.4" y="349.8" font-size="12.5" fill="#999" text-anchor="middle" font-weight="normal">A<tspan text-decoration='overline'>B</tspan><tspan text-decoration='overline'>C</tspan></text><text x="440.6" y="349.8" font-size="12.5" fill="#999" text-anchor="middle" font-weight="normal"><tspan text-decoration='overline'>A</tspan>B<tspan text-decoration='overline'>C</tspan></text><text x="360.0" y="212.8" font-size="12.5" fill="#999" text-anchor="middle" font-weight="normal"><tspan text-decoration='overline'>A</tspan><tspan text-decoration='overline'>B</tspan>C</text>
  <rect x="18" y="462" width="684" height="218" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/><rect x="18" y="462" width="684" height="28" rx="6" fill="#eef2fa"/><rect x="18" y="482" width="684" height="8" fill="#eef2fa"/><line x1="18" y1="490" x2="702" y2="490" stroke="#3b5b9b" stroke-width="1.2"/><text x="120" y="481" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">ATOM</text><text x="300" y="481" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">IN A?</text><text x="390" y="481" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">IN B &#8746; C?</text><text x="560" y="481" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">IN A &#8745; (B &#8746; C)?</text><text x="120" y="511" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">ABC</text><text x="300" y="511" font-size="11" fill="#666" text-anchor="middle">yes</text><text x="390" y="511" font-size="11" fill="#666" text-anchor="middle">yes</text><text x="560" y="511" font-size="11" fill="#7a4fa3" text-anchor="middle" font-weight="bold">YES</text><rect x="19" y="516" width="682" height="22" fill="#fafafa"/><text x="120" y="533" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">AB<tspan text-decoration='overline'>C</tspan></text><text x="300" y="533" font-size="11" fill="#666" text-anchor="middle">yes</text><text x="390" y="533" font-size="11" fill="#666" text-anchor="middle">yes</text><text x="560" y="533" font-size="11" fill="#7a4fa3" text-anchor="middle" font-weight="bold">YES</text><text x="120" y="555" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">A<tspan text-decoration='overline'>B</tspan>C</text><text x="300" y="555" font-size="11" fill="#666" text-anchor="middle">yes</text><text x="390" y="555" font-size="11" fill="#666" text-anchor="middle">yes</text><text x="560" y="555" font-size="11" fill="#7a4fa3" text-anchor="middle" font-weight="bold">YES</text><rect x="19" y="560" width="682" height="22" fill="#fafafa"/><text x="120" y="577" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">A<tspan text-decoration='overline'>B</tspan><tspan text-decoration='overline'>C</tspan></text><text x="300" y="577" font-size="11" fill="#666" text-anchor="middle">yes</text><text x="390" y="577" font-size="11" fill="#666" text-anchor="middle">no</text><text x="560" y="577" font-size="11" fill="#bbb" text-anchor="middle" font-weight="normal">no</text><text x="120" y="599" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold"><tspan text-decoration='overline'>A</tspan>BC</text><text x="300" y="599" font-size="11" fill="#666" text-anchor="middle">no</text><text x="390" y="599" font-size="11" fill="#666" text-anchor="middle">yes</text><text x="560" y="599" font-size="11" fill="#bbb" text-anchor="middle" font-weight="normal">no</text><rect x="19" y="604" width="682" height="22" fill="#fafafa"/><text x="120" y="621" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold"><tspan text-decoration='overline'>A</tspan>B<tspan text-decoration='overline'>C</tspan></text><text x="300" y="621" font-size="11" fill="#666" text-anchor="middle">no</text><text x="390" y="621" font-size="11" fill="#666" text-anchor="middle">yes</text><text x="560" y="621" font-size="11" fill="#bbb" text-anchor="middle" font-weight="normal">no</text><text x="120" y="643" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold"><tspan text-decoration='overline'>A</tspan><tspan text-decoration='overline'>B</tspan>C</text><text x="300" y="643" font-size="11" fill="#666" text-anchor="middle">no</text><text x="390" y="643" font-size="11" fill="#666" text-anchor="middle">yes</text><text x="560" y="643" font-size="11" fill="#bbb" text-anchor="middle" font-weight="normal">no</text><rect x="19" y="648" width="682" height="22" fill="#fafafa"/><text x="120" y="665" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold"><tspan text-decoration='overline'>A</tspan><tspan text-decoration='overline'>B</tspan><tspan text-decoration='overline'>C</tspan></text><text x="300" y="665" font-size="11" fill="#666" text-anchor="middle">no</text><text x="390" y="665" font-size="11" fill="#666" text-anchor="middle">no</text><text x="560" y="665" font-size="11" fill="#bbb" text-anchor="middle" font-weight="normal">no</text>
  <rect x="18" y="696" width="684" height="140" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="716" font-size="11.5" fill="#1f6b34" font-weight="bold">A SUM OF PRODUCTS IS NOT YET A NORMAL FORM</text>
  <text x="40" y="740" font-size="11.5" fill="#333">Distributivity (4.3 Problem 7) gives A &#8745; (B &#8746; C) = (A &#8745; B) &#8746; (A &#8745; C), which is a union of</text>
  <text x="40" y="758" font-size="11.5" fill="#333">intersections &#8212; but not of <tspan font-style="italic">atoms</tspan>, and the two pieces overlap:</text>
  <text x="360" y="784" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">A &#8745; B = (A&#8745;B&#8745;C) &#8746; (A&#8745;B&#8745;C&#772;)&#160;&#160;&#160;&#160;&#160;A &#8745; C = (A&#8745;B&#8745;C) &#8746; (A&#8745;B&#772;&#8745;C)</text>
  <text x="40" y="810" font-size="11.5" fill="#333">A&#8745;B&#8745;C is listed twice. Splitting into atoms removes the duplicate and leaves three <tspan font-style="italic">disjoint</tspan> pieces,</text>
  <text x="40" y="828" font-size="11.5" fill="#333">so their sizes simply add &#8212; verified &#8212; with no inclusion&#8211;exclusion correction needed.</text>
</svg>