<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 797" width="720" height="797" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="797" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="88" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">RECTANGLES WITH SIDES PARALLEL TO THE AXES</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">3 sets &#10003;&#160;&#160;&#160;&#160;&#160;4 sets &#10003;&#160;&#160;&#160;&#160;&#160;5 sets &#10007;</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">The first two are drawn below and checked by machine; the third is impossible, and the reason is short.</text>
  <rect x="22" y="120" width="336" height="330" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="141" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">3 sets: all 8 regions</text><rect x="79.5" y="268.9" width="221.0" height="132.6" fill="#3b5b9b" fill-opacity="0.09" stroke="#3b5b9b" stroke-width="1.9"/><rect x="123.7" y="180.5" width="88.4" height="176.8" fill="#9b2c2c" fill-opacity="0.09" stroke="#9b2c2c" stroke-width="1.9"/><rect x="167.9" y="224.7" width="88.4" height="88.4" fill="#1f6b34" fill-opacity="0.09" stroke="#1f6b34" stroke-width="1.9"/><text x="101.6" y="383.2" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">A</text><text x="145.8" y="339.0" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">AB</text><text x="145.8" y="250.7" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">B</text><text x="190.0" y="294.9" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">ABC</text><text x="190.0" y="250.7" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">BC</text><text x="234.2" y="294.9" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">AC</text><text x="234.2" y="250.7" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">C</text><text x="75.5" y="264.9" font-size="12" fill="#3b5b9b" text-anchor="end" font-weight="bold">A</text><text x="119.7" y="176.5" font-size="12" fill="#9b2c2c" text-anchor="end" font-weight="bold">B</text><text x="163.9" y="220.7" font-size="12" fill="#1f6b34" text-anchor="end" font-weight="bold">C</text><text x="190.0" y="441" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">each region present and connected</text><rect x="372" y="120" width="336" height="330" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="141" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">4 sets: all 16 regions</text><rect x="423.0" y="274.3" width="233.9" height="133.7" fill="#3b5b9b" fill-opacity="0.09" stroke="#3b5b9b" stroke-width="1.9"/><rect x="456.5" y="240.9" width="133.7" height="66.8" fill="#9b2c2c" fill-opacity="0.09" stroke="#9b2c2c" stroke-width="1.9"/><rect x="489.9" y="174.0" width="66.8" height="200.5" fill="#1f6b34" fill-opacity="0.09" stroke="#1f6b34" stroke-width="1.9"/><rect x="523.3" y="207.5" width="100.2" height="133.7" fill="#b06a10" fill-opacity="0.09" stroke="#b06a10" stroke-width="1.9"/><text x="439.8" y="395.1" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">A</text><text x="473.2" y="294.9" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">AB</text><text x="473.2" y="261.4" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">B</text><text x="506.6" y="361.7" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">AC</text><text x="506.6" y="294.9" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">ABC</text><text x="506.6" y="261.4" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">BC</text><text x="506.6" y="228.0" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">C</text><text x="540.0" y="328.3" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">ACD</text><text x="540.0" y="294.9" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">ABCD</text><text x="540.0" y="261.4" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">BCD</text><text x="540.0" y="228.0" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">CD</text><text x="573.4" y="328.3" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">AD</text><text x="573.4" y="294.9" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">ABD</text><text x="573.4" y="261.4" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">BD</text><text x="573.4" y="228.0" font-size="11.0" fill="#111" text-anchor="middle" font-weight="bold">D</text><text x="419.0" y="270.3" font-size="12" fill="#3b5b9b" text-anchor="end" font-weight="bold">A</text><text x="452.5" y="236.9" font-size="12" fill="#9b2c2c" text-anchor="end" font-weight="bold">B</text><text x="485.9" y="170.0" font-size="12" fill="#1f6b34" text-anchor="end" font-weight="bold">C</text><text x="519.3" y="203.5" font-size="12" fill="#b06a10" text-anchor="end" font-weight="bold">D</text><text x="540.0" y="441" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">each region present and connected</text>
  <rect x="18" y="464" width="684" height="192" rx="6" fill="#fdecec" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="484" font-size="11.5" fill="#9b2c2c" font-weight="bold">WHY FIVE IS IMPOSSIBLE</text>
  <text x="40" y="508" font-size="11.5" fill="#333">A rectangle is an x-interval times a y-interval, so a point (x, y) lies in rectangle i exactly when</text>
  <text x="40" y="526" font-size="11.5" fill="#333">i belongs to both S(x), the x-intervals covering x, and T(y). Its region label is S(x) &#8745; T(y).</text>
  <text x="40" y="552" font-size="11.5" fill="#333">Now look at the region missing only set i. To get S &#8745; T = [n] \ {i} both S and T must contain</text>
  <text x="40" y="570" font-size="11.5" fill="#333">everything but i, so [n] \ {i} must occur on the x-axis or on the y-axis. But on one axis</text>
  <text x="360" y="596" font-size="12.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">S(x) = [n] \ {i} is possible only if interval i has the largest left end or the smallest right end,</text>
  <text x="40" y="620" font-size="11.5" fill="#333">so each axis supplies at most 2 of these regions &#8212; at most 4 in all. Five sets need five of them.</text>
  <text x="40" y="640" font-size="11" fill="#555">Confirmed by exhaustive search: over all 90, 2520 and 113400 interval sweeps for n = 3, 4, 5, no sweep ever yields 3.</text>
  <rect x="18" y="669" width="684" height="112" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="689" font-size="11.5" fill="#1f6b34" font-weight="bold">WHY FOUR IS THE INTERESTING CASE</text>
  <text x="40" y="713" font-size="11.5" fill="#333">Circles manage only 3: a fourth circle cannot meet all 8 existing regions. Rectangles reach 4, so the</text>
  <text x="40" y="731" font-size="11.5" fill="#333">familiar &#8220;three overlapping circles&#8221; limit is a fact about circles, not about Venn diagrams.</text>
  <text x="40" y="757" font-size="11.5" fill="#333">And the ceiling keeps moving with the shape: ellipses reach 5, and general convex curves reach every n.</text>
</svg>