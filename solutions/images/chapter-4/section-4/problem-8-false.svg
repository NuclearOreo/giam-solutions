<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 751" width="720" height="751" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="751" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="88" rx="6" fill="#fdecec" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#9b2c2c" font-weight="bold">FALSE &#8212; AND IT FAILS IN BOTH DIRECTIONS AT ONCE</text>
  <text x="360" y="58" font-size="13.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">(A &#8746; B) &#8745; (C &#8746; D)&#160;&#160;&#8800;&#160;&#160;(A &#8746; C) &#8745; (B &#8746; D)</text>
  <text x="360" y="80" font-size="11.5" fill="#333" text-anchor="middle">Four of the sixteen atoms disagree: two lie in the left side only, two in the right side only.</text>
  <rect x="22" y="118" width="336" height="306" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">(A &#8746; B) &#8745; (C &#8746; D)</text><rect x="145.7" y="320.3" width="29.5" height="29.5" fill="#9b2c2c" fill-opacity="0.6"/><rect x="145.7" y="290.8" width="29.5" height="29.5" fill="#9b2c2c" fill-opacity="0.6"/><rect x="145.7" y="261.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="145.7" y="231.7" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="175.2" y="320.3" width="29.5" height="29.5" fill="#9b2c2c" fill-opacity="0.6"/><rect x="175.2" y="290.8" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="175.2" y="261.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="175.2" y="231.7" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="204.8" y="290.8" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="204.8" y="261.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="204.8" y="231.7" width="29.5" height="29.5" fill="#9b2c2c" fill-opacity="0.6"/><rect x="234.3" y="290.8" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="234.3" y="261.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="86.7" y="261.2" width="206.7" height="118.1" fill="none" stroke="#3b5b9b" stroke-width="1.9"/><text x="82.7" y="256.2" font-size="12" fill="#3b5b9b" text-anchor="end" font-weight="bold">A</text><rect x="116.2" y="231.7" width="118.1" height="59.0" fill="none" stroke="#9b2c2c" stroke-width="1.9"/><text x="112.2" y="226.7" font-size="12" fill="#9b2c2c" text-anchor="end" font-weight="bold">B</text><rect x="145.7" y="172.7" width="59.0" height="177.1" fill="none" stroke="#1f6b34" stroke-width="1.9"/><text x="141.7" y="167.7" font-size="12" fill="#1f6b34" text-anchor="end" font-weight="bold">C</text><rect x="175.2" y="202.2" width="88.6" height="118.1" fill="none" stroke="#b06a10" stroke-width="1.9"/><text x="171.2" y="197.2" font-size="12" fill="#b06a10" text-anchor="end" font-weight="bold">D</text><text x="190.0" y="414" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">red: in this side only</text><rect x="372" y="118" width="336" height="306" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="139" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">(A &#8746; C) &#8745; (B &#8746; D)</text><rect x="466.2" y="261.2" width="29.5" height="29.5" fill="#9b2c2c" fill-opacity="0.6"/><rect x="495.7" y="261.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="495.7" y="231.7" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="525.2" y="290.8" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="525.2" y="261.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="525.2" y="231.7" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="525.2" y="202.2" width="29.5" height="29.5" fill="#9b2c2c" fill-opacity="0.6"/><rect x="554.8" y="290.8" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="554.8" y="261.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="584.3" y="290.8" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="584.3" y="261.2" width="29.5" height="29.5" fill="#7a4fa3" fill-opacity="0.26"/><rect x="436.7" y="261.2" width="206.7" height="118.1" fill="none" stroke="#3b5b9b" stroke-width="1.9"/><text x="432.7" y="256.2" font-size="12" fill="#3b5b9b" text-anchor="end" font-weight="bold">A</text><rect x="466.2" y="231.7" width="118.1" height="59.0" fill="none" stroke="#9b2c2c" stroke-width="1.9"/><text x="462.2" y="226.7" font-size="12" fill="#9b2c2c" text-anchor="end" font-weight="bold">B</text><rect x="495.7" y="172.7" width="59.0" height="177.1" fill="none" stroke="#1f6b34" stroke-width="1.9"/><text x="491.7" y="167.7" font-size="12" fill="#1f6b34" text-anchor="end" font-weight="bold">C</text><rect x="525.2" y="202.2" width="88.6" height="118.1" fill="none" stroke="#b06a10" stroke-width="1.9"/><text x="521.2" y="197.2" font-size="12" fill="#b06a10" text-anchor="end" font-weight="bold">D</text><text x="540.0" y="414" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">red: in this side only</text>
  <rect x="18" y="438" width="684" height="152" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="458" font-size="11.5" fill="#b06a10" font-weight="bold">THE FOUR DISAGREEING ATOMS, AND THE SMALLEST COUNTEREXAMPLES</text>
  <text x="40" y="484" font-size="11.5" fill="#333">In the left side only:&#160; A &#8745; C with B, D absent&#160;&#160;and&#160;&#160;B &#8745; D with A, C absent.</text>
  <text x="40" y="504" font-size="11.5" fill="#333">In the right side only:&#160; A &#8745; B with C, D absent&#160;&#160;and&#160;&#160;C &#8745; D with A, B absent.</text>
  <text x="360" y="534" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">A = B = {0}, C = D = &#8709;&#160;&#8594;&#160;LHS = &#8709;, RHS = {0}</text>
  <text x="360" y="556" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">A = C = {0}, B = D = &#8709;&#160;&#8594;&#160;LHS = {0}, RHS = &#8709;</text>
  <text x="40" y="580" font-size="11" fill="#555">Of the 65536 quadruples from a 4-element universe, 27120 break each containment &#8212; failure is typical, not rare.</text>
  <rect x="18" y="603" width="684" height="132" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="623" font-size="11.5" fill="#1f6b34" font-weight="bold">WHY: THE EXPRESSION DEPENDS ON HOW THE FOUR SETS ARE PAIRED</text>
  <text x="40" y="647" font-size="11.5" fill="#333">(X &#8746; Y) &#8745; (Z &#8746; W) expands to the four cross products XZ, XW, YZ, YW &#8212; it keeps every pair that</text>
  <text x="40" y="665" font-size="11.5" fill="#333">crosses the two blocks and drops the two pairs inside a block. Different pairing, different set.</text>
  <text x="360" y="691" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">AB|CD drops AB and CD&#160;&#160;&#160;&#160;AC|BD drops AC and BD&#160;&#160;&#160;&#160;AD|BC drops AD and BC</text>
  <text x="40" y="717" font-size="11.5" fill="#333">All three pairings give pairwise different sets &#8212; verified. Their union is &#8220;in at least 2 of the four&#8221;,</text>
  <text x="40" y="735" font-size="11.5" fill="#333">their intersection &#8220;in at least 3&#8221;, both symmetric again. Also verified.</text>
</svg>