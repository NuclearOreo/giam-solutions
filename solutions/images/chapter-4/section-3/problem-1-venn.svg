<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" width="720" height="860" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="860" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="100" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#b06a10" font-weight="bold">THE TWO SETS</text>
  <text x="360" y="60" font-size="14.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">A = {1, 2, {1, 2}, b}&#160;&#160;&#160;&#160;&#160;&#160;B = {a, b, {1, 2}}</text>
  <text x="360" y="84" font-size="11.5" fill="#333" text-anchor="middle">A has four elements, B has three. Their union has five &#8212; every membership test below asks only</text>
  <text x="360" y="101" font-size="11.5" fill="#333" text-anchor="middle">whether one whole object appears in the other list.</text>

  <ellipse cx="286" cy="250" rx="150" ry="102" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.8" fill-opacity="0.85"/><ellipse cx="434" cy="250" rx="150" ry="102" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.8" fill-opacity="0.6"/><text x="168" y="172" font-size="14" fill="#3b5b9b" font-weight="bold">A</text><text x="546" y="172" font-size="14" fill="#1f6b34" font-weight="bold">B</text><text x="212" y="242" font-size="15" fill="#1f3a68" text-anchor="middle">1</text><text x="212" y="270" font-size="15" fill="#1f3a68" text-anchor="middle">2</text><text x="360" y="240" font-size="15" fill="#5a3d8c" text-anchor="middle" font-weight="bold">b</text><text x="360" y="272" font-size="15" fill="#5a3d8c" text-anchor="middle" font-weight="bold">{1, 2}</text><text x="510" y="256" font-size="15" fill="#14532d" text-anchor="middle">a</text><text x="212" y="300" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-style="italic">A \ B</text><text x="360" y="300" font-size="10.5" fill="#5a3d8c" text-anchor="middle" font-style="italic">A &#8745; B</text><text x="510" y="300" font-size="10.5" fill="#14532d" text-anchor="middle" font-style="italic">B \ A</text><text x="360" y="374" font-size="11.5" fill="#333" text-anchor="middle">Five distinct objects in all. The object {1, 2} sits in the overlap; the numbers 1 and 2 do not.</text>
  <rect x="18" y="410" width="684" height="164" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/><rect x="18" y="410" width="684" height="28" rx="6" fill="#eef2fa"/><rect x="18" y="430" width="684" height="8" fill="#eef2fa"/><line x1="18" y1="438" x2="702" y2="438" stroke="#3b5b9b" stroke-width="1.2"/><text x="52" y="429" font-size="11" fill="#3b5b9b" font-weight="bold">PART</text><text x="120" y="429" font-size="11" fill="#3b5b9b" font-weight="bold">EXPRESSION</text><text x="262" y="429" font-size="11" fill="#3b5b9b" font-weight="bold">VALUE</text><text x="660" y="429" font-size="11" fill="#3b5b9b" font-weight="bold" text-anchor="end">SIZE</text><text x="52" y="458" font-size="12" fill="#666">a</text><text x="120" y="458" font-size="13" fill="#1f3a68" font-weight="bold">A &#8745; B</text><text x="262" y="458" font-size="13" fill="#9b2c2c">{b, {1, 2}}</text><text x="660" y="458" font-size="12" fill="#666" text-anchor="end">2</text><rect x="19" y="466" width="682" height="26" fill="#fafafa"/><text x="52" y="484" font-size="12" fill="#666">b</text><text x="120" y="484" font-size="13" fill="#1f3a68" font-weight="bold">A &#8746; B</text><text x="262" y="484" font-size="13" fill="#9b2c2c">{1, 2, a, b, {1, 2}}</text><text x="660" y="484" font-size="12" fill="#666" text-anchor="end">5</text><text x="52" y="510" font-size="12" fill="#666">c</text><text x="120" y="510" font-size="13" fill="#1f3a68" font-weight="bold">A \ B</text><text x="262" y="510" font-size="13" fill="#9b2c2c">{1, 2}</text><text x="660" y="510" font-size="12" fill="#666" text-anchor="end">2</text><rect x="19" y="518" width="682" height="26" fill="#fafafa"/><text x="52" y="536" font-size="12" fill="#666">d</text><text x="120" y="536" font-size="13" fill="#1f3a68" font-weight="bold">B \ A</text><text x="262" y="536" font-size="13" fill="#9b2c2c">{a}</text><text x="660" y="536" font-size="12" fill="#666" text-anchor="end">1</text><text x="52" y="562" font-size="12" fill="#666">e</text><text x="120" y="562" font-size="13" fill="#1f3a68" font-weight="bold">A &#9651; B</text><text x="262" y="562" font-size="13" fill="#9b2c2c">{1, 2, a}</text><text x="660" y="562" font-size="12" fill="#666" text-anchor="end">3</text>

  <rect x="18" y="594" width="684" height="128" rx="6" fill="#fdecec" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="614" font-size="11.5" fill="#9b2c2c" font-weight="bold">THE TRAP: {1, 2} IS ONE OBJECT, NOT TWO</text>
  <text x="40" y="638" font-size="11.5" fill="#333">{1, 2} &#8712; A and {1, 2} &#8712; B, so it survives the intersection. But 1 &#8713; B and 2 &#8713; B, so the numbers</text>
  <text x="40" y="656" font-size="11.5" fill="#333">1 and 2 fall out of A &#8745; B and into A \ B. All four memberships checked directly.</text>
  <text x="40" y="682" font-size="11.5" fill="#333">Curiosity: {1, 2} is simultaneously an <tspan font-style="italic">element</tspan> of A and a <tspan font-style="italic">subset</tspan> of A &#8212; but only an element</text>
  <text x="40" y="700" font-size="11.5" fill="#333">of B, since 1 and 2 are missing there. Exactly the &#8712; versus &#8838; distinction of Section 2.</text>

  <rect x="18" y="736" width="684" height="108" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="756" font-size="11.5" fill="#1f6b34" font-weight="bold">THE THREE-PIECE PARTITION</text>
  <text x="360" y="782" font-size="13.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">A &#8746; B&#160; =&#160; (A \ B)&#160; &#8746;&#160; (A &#8745; B)&#160; &#8746;&#160; (B \ A)</text>
  <text x="360" y="804" font-size="12.5" fill="#666" text-anchor="middle">5&#160;&#160;=&#160;&#160;2&#160;&#160;+&#160;&#160;2&#160;&#160;+&#160;&#160;1</text>
  <text x="40" y="830" font-size="11.5" fill="#333">The three pieces are pairwise disjoint, so parts a, c and d already determine b and e. Verified.</text>
</svg>