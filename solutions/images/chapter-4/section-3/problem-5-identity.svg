<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 593" width="720" height="593" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="593" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="92" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE ANSWER</text>
  <text x="360" y="62" font-size="17" fill="#1f3a68" text-anchor="middle" font-weight="bold">X = &#8709;</text>
  <text x="360" y="88" font-size="11.5" fill="#333" text-anchor="middle">And it is the only such set: put A = &#8709; and the condition reads X = &#8709; outright.</text>

  <rect x="22" y="124" width="336" height="178" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="36" y="144" font-size="12" fill="#3b5b9b" font-weight="bold">&#8709; &#9651; A = A</text><circle cx="114" cy="216" r="34" fill="#ffffff" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="252" cy="216" r="46" fill="#3b5b9b" stroke="#1f3a68" stroke-width="1.3"/><text x="114" y="174" font-size="12" fill="#999" text-anchor="middle" font-weight="bold">&#8709;</text><text x="252" y="162" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">A</text><text x="114" y="220" font-size="9.5" fill="#bbb" text-anchor="middle" font-style="italic">no elements</text><text x="177" y="212" font-size="10" fill="#999" text-anchor="middle">no</text><text x="177" y="225" font-size="10" fill="#999" text-anchor="middle">overlap</text><text x="36" y="260" font-size="10.5" fill="#555">The two sets are disjoint, so nothing is</text><text x="36" y="275" font-size="10.5" fill="#555">cancelled; and &#8709; contributes no elements</text><text x="36" y="290" font-size="10.5" fill="#555">of its own. What remains is exactly A.</text><rect x="372" y="124" width="336" height="178" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="386" y="144" font-size="12" fill="#3b5b9b" font-weight="bold">&#9651; IS XOR, AND &#8709; IS THE ZERO VECTOR</text><text x="466" y="182" font-size="11.5" fill="#3b5b9b" text-anchor="end" font-weight="bold">A</text><rect x="480" y="166" width="22" height="22" rx="2" fill="#3b5b9b" stroke="#ddd" stroke-width="0.6"/><text x="491.0" y="182" font-size="11" fill="#ffffff" text-anchor="middle">1</text><rect x="506" y="166" width="22" height="22" rx="2" fill="#3b5b9b" stroke="#ddd" stroke-width="0.6"/><text x="517.0" y="182" font-size="11" fill="#ffffff" text-anchor="middle">1</text><rect x="532" y="166" width="22" height="22" rx="2" fill="#f4f4f4" stroke="#ddd" stroke-width="0.6"/><text x="543.0" y="182" font-size="11" fill="#bbb" text-anchor="middle">0</text><rect x="558" y="166" width="22" height="22" rx="2" fill="#3b5b9b" stroke="#ddd" stroke-width="0.6"/><text x="569.0" y="182" font-size="11" fill="#ffffff" text-anchor="middle">1</text><rect x="584" y="166" width="22" height="22" rx="2" fill="#f4f4f4" stroke="#ddd" stroke-width="0.6"/><text x="595.0" y="182" font-size="11" fill="#bbb" text-anchor="middle">0</text><text x="466" y="216" font-size="11.5" fill="#aaa" text-anchor="end" font-weight="bold">&#8709;</text><rect x="480" y="200" width="22" height="22" rx="2" fill="#f4f4f4" stroke="#ddd" stroke-width="0.6"/><text x="491.0" y="216" font-size="11" fill="#bbb" text-anchor="middle">0</text><rect x="506" y="200" width="22" height="22" rx="2" fill="#f4f4f4" stroke="#ddd" stroke-width="0.6"/><text x="517.0" y="216" font-size="11" fill="#bbb" text-anchor="middle">0</text><rect x="532" y="200" width="22" height="22" rx="2" fill="#f4f4f4" stroke="#ddd" stroke-width="0.6"/><text x="543.0" y="216" font-size="11" fill="#bbb" text-anchor="middle">0</text><rect x="558" y="200" width="22" height="22" rx="2" fill="#f4f4f4" stroke="#ddd" stroke-width="0.6"/><text x="569.0" y="216" font-size="11" fill="#bbb" text-anchor="middle">0</text><rect x="584" y="200" width="22" height="22" rx="2" fill="#f4f4f4" stroke="#ddd" stroke-width="0.6"/><text x="595.0" y="216" font-size="11" fill="#bbb" text-anchor="middle">0</text><line x1="476" y1="228" x2="606" y2="228" stroke="#999" stroke-width="1"/><text x="466" y="250" font-size="11.5" fill="#1f6b34" text-anchor="end" font-weight="bold">XOR</text><rect x="480" y="234" width="22" height="22" rx="2" fill="#1f6b34" stroke="#ddd" stroke-width="0.6"/><text x="491.0" y="250" font-size="11" fill="#ffffff" text-anchor="middle">1</text><rect x="506" y="234" width="22" height="22" rx="2" fill="#1f6b34" stroke="#ddd" stroke-width="0.6"/><text x="517.0" y="250" font-size="11" fill="#ffffff" text-anchor="middle">1</text><rect x="532" y="234" width="22" height="22" rx="2" fill="#f4f4f4" stroke="#ddd" stroke-width="0.6"/><text x="543.0" y="250" font-size="11" fill="#bbb" text-anchor="middle">0</text><rect x="558" y="234" width="22" height="22" rx="2" fill="#1f6b34" stroke="#ddd" stroke-width="0.6"/><text x="569.0" y="250" font-size="11" fill="#ffffff" text-anchor="middle">1</text><rect x="584" y="234" width="22" height="22" rx="2" fill="#f4f4f4" stroke="#ddd" stroke-width="0.6"/><text x="595.0" y="250" font-size="11" fill="#bbb" text-anchor="middle">0</text><text x="386" y="275" font-size="10.5" fill="#555">Toggling a bit by 0 leaves it alone, so the</text><text x="386" y="290" font-size="10.5" fill="#555">all-zeros vector &#8212; the empty set &#8212; is the identity.</text>
  <rect x="18" y="318" width="684" height="125" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/><rect x="18" y="318" width="684" height="30" rx="6" fill="#eef2fa"/><rect x="18" y="340" width="684" height="8" fill="#eef2fa"/><line x1="18" y1="348" x2="702" y2="348" stroke="#3b5b9b" stroke-width="1.2"/><text x="54" y="338" font-size="10.5" fill="#3b5b9b" text-anchor="start" font-weight="bold">OPERATION</text><text x="232" y="338" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">IDENTITY</text><text x="380" y="338" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">INVERSES?</text><text x="560" y="338" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">IS X &#9679; A = B SOLVABLE?</text><text x="54" y="370" font-size="12" fill="#1f3a68" font-weight="bold">A &#8746; B</text><text x="232" y="370" font-size="12" fill="#1f3a68" text-anchor="middle">&#8709;</text><text x="380" y="370" font-size="11" fill="#999" text-anchor="middle">no</text><text x="560" y="370" font-size="11" fill="#999" text-anchor="middle">only sometimes &#8212; 781 of 1024 pairs have none</text><rect x="19" y="378" width="682" height="27" fill="#fafafa"/><text x="54" y="397" font-size="12" fill="#1f3a68" font-weight="bold">A &#8745; B</text><text x="232" y="397" font-size="12" fill="#1f3a68" text-anchor="middle">U</text><text x="380" y="397" font-size="11" fill="#999" text-anchor="middle">no</text><text x="560" y="397" font-size="11" fill="#999" text-anchor="middle">only sometimes &#8212; 781 of 1024 pairs have none</text><text x="54" y="424" font-size="12" fill="#1f3a68" font-weight="bold">A &#9651; B</text><text x="232" y="424" font-size="12" fill="#1f3a68" text-anchor="middle">&#8709;</text><text x="380" y="424" font-size="11" fill="#1f6b34" text-anchor="middle">yes, A is its own</text><text x="560" y="424" font-size="11" fill="#1f6b34" text-anchor="middle">always, and uniquely: X = A &#9651; B</text>

  <rect x="18" y="459" width="684" height="118" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="479" font-size="11.5" fill="#1f6b34" font-weight="bold">WHAT THE IDENTITY ELEMENT BUYS</text>
  <text x="40" y="503" font-size="11.5" fill="#333">With &#8709; as identity and every set its own inverse, (P(U), &#9651;) is a group &#8212; so equations can be solved.</text>
  <text x="40" y="527" font-size="11.5" fill="#333">Checked over all 1024 pairs from a 5-element universe: X &#9651; A = B has <tspan font-weight="bold">exactly one</tspan> solution every time,</text>
  <text x="40" y="545" font-size="11.5" fill="#333">namely X = A &#9651; B. The same equation with &#8746; or &#8745; has no solution for 781 of those 1024 pairs, and</text>
  <text x="40" y="563" font-size="11.5" fill="#333">as many as 32 solutions for one of them.</text>
</svg>