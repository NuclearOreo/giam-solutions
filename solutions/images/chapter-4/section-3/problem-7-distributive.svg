<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 707" width="720" height="707" font-family="Georgia, serif">
  <defs><clipPath id="LA"><circle cx="190.0" cy="206.0" r="40"/></clipPath><clipPath id="RA"><circle cx="540.0" cy="206.0" r="40"/></clipPath></defs>
  <rect x="0" y="0" width="720" height="707" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="90" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">TWO CONTAINMENTS, NOT ONE CHAIN</text>
  <text x="360" y="58" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">A &#8745; (B &#8746; C) = (A &#8745; B) &#8746; (A &#8745; C)</text>
  <text x="360" y="80" font-size="11.5" fill="#333" text-anchor="middle">Each side is shown to contain the other. Verified over all 32768 triples from a 5-element universe.</text>

  <rect x="22" y="122" width="336" height="216" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="144" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">A &#8745; (B &#8746; C)</text><circle cx="165.8" cy="248.0" r="40" fill="#3b5b9b" clip-path="url(#LA)"/><circle cx="214.2" cy="248.0" r="40" fill="#3b5b9b" clip-path="url(#LA)"/><circle cx="190.0" cy="206.0" r="40" fill="none" stroke="#666" stroke-width="1.2"/><circle cx="165.8" cy="248.0" r="40" fill="none" stroke="#666" stroke-width="1.2"/><circle cx="214.2" cy="248.0" r="40" fill="none" stroke="#666" stroke-width="1.2"/><text x="190.0" y="158.0" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">A</text><text x="127.8" y="302.0" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">B</text><text x="252.2" y="302.0" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">C</text><text x="190.0" y="312" font-size="10.5" fill="#555" text-anchor="middle">Cut B &#8746; C down to the part inside A:</text><text x="190.0" y="327" font-size="10.5" fill="#555" text-anchor="middle">one region, shaded in a single colour.</text><rect x="372" y="122" width="336" height="216" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="144" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">(A &#8745; B) &#8746; (A &#8745; C)</text><circle cx="515.8" cy="248.0" r="40" fill="#3b5b9b" clip-path="url(#RA)"/><circle cx="564.2" cy="248.0" r="40" fill="#1f6b34" clip-path="url(#RA)" fill-opacity="0.92"/><circle cx="540.0" cy="206.0" r="40" fill="none" stroke="#666" stroke-width="1.2"/><circle cx="515.8" cy="248.0" r="40" fill="none" stroke="#666" stroke-width="1.2"/><circle cx="564.2" cy="248.0" r="40" fill="none" stroke="#666" stroke-width="1.2"/><text x="540.0" y="158.0" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">A</text><text x="477.8" y="302.0" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">B</text><text x="602.2" y="302.0" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">C</text><text x="540.0" y="312" font-size="10.5" fill="#555" text-anchor="middle">Two lenses glued together &#8212; blue and green.</text><text x="540.0" y="327" font-size="10.5" fill="#555" text-anchor="middle">Different construction, identical region.</text>

  <rect x="18" y="352" width="684" height="176" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="372" font-size="11.5" fill="#1f6b34" font-weight="bold">BOTH HALVES SPLIT INTO THE SAME TWO CASES</text>
  <text x="200" y="398" font-size="11.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">&#8838; direction</text><text x="520" y="398" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">&#8839; direction</text><text x="200" y="422" font-size="10.5" fill="#333" text-anchor="middle">take x &#8712; A &#8745; (B &#8746; C)</text><text x="520" y="422" font-size="10.5" fill="#333" text-anchor="middle">take x &#8712; (A &#8745; B) &#8746; (A &#8745; C)</text><text x="200" y="440" font-size="10.5" fill="#333" text-anchor="middle">so x &#8712; A, and x &#8712; B or x &#8712; C</text><text x="520" y="440" font-size="10.5" fill="#333" text-anchor="middle">so x &#8712; A &#8745; B or x &#8712; A &#8745; C</text><text x="200" y="458" font-size="10.5" fill="#333" text-anchor="middle">case x &#8712; B &#8594; x &#8712; A &#8745; B</text><text x="520" y="458" font-size="10.5" fill="#333" text-anchor="middle">case x &#8712; A &#8745; B &#8594; x &#8712; A and x &#8712; B &#8746; C</text><text x="200" y="476" font-size="10.5" fill="#333" text-anchor="middle">case x &#8712; C &#8594; x &#8712; A &#8745; C</text><text x="520" y="476" font-size="10.5" fill="#333" text-anchor="middle">case x &#8712; A &#8745; C &#8594; same</text><text x="200" y="494" font-size="10.5" fill="#333" text-anchor="middle">either way x is in the union</text><text x="520" y="494" font-size="10.5" fill="#333" text-anchor="middle">either way x is in the intersection</text><line x1="360" y1="386" x2="360" y2="500" stroke="#ddd" stroke-width="1"/>
  <text x="40" y="520" font-size="11" fill="#555">The cases come from the &#8220;or&#8221; &#8212; on the left it sits inside B &#8746; C, on the right between the two lenses.</text>

  <rect x="18" y="541" width="684" height="150" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="561" font-size="11.5" fill="#b06a10" font-weight="bold">THE DUAL HOLDS TOO &#8212; AND THAT IS UNUSUAL</text>
  <text x="360" y="587" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">A &#8746; (B &#8745; C) = (A &#8746; B) &#8745; (A &#8746; C)</text>
  <text x="40" y="613" font-size="11.5" fill="#333">also verified over all 32768 triples. Arithmetic has only one such law: &#215; distributes over +, but</text>
  <text x="40" y="631" font-size="11.5" fill="#333">+ does not distribute over &#215;. Sets are more symmetric than numbers here.</text>
  <text x="40" y="657" font-size="11.5" fill="#333">Nor is the law automatic. For subspaces of the plane, with + as join, take three distinct lines</text>
  <text x="40" y="675" font-size="11.5" fill="#333">through the origin: A &#8745; (B + C) = A is 1-dimensional, but (A &#8745; B) + (A &#8745; C) = {0} is not.</text>
</svg>