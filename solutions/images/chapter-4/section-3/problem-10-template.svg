<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" width="720" height="690" font-family="Georgia, serif">
  <defs><clipPath id="lens"><circle cx="140" cy="464" r="46"/></clipPath></defs>
  <rect x="0" y="0" width="720" height="690" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="92" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">A PROOF POURED INTO THE GIVEN MOULD</text>
  <text x="360" y="60" font-size="14.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">A &#9651; B = (A &#8746; B) \ (A &#8745; B)</text>
  <text x="360" y="84" font-size="11.5" fill="#333" text-anchor="middle">Identity and both containments verified over the 1024 pairs from a 5-element universe.</text>

  <rect x="18" y="122" width="684" height="232" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/><rect x="18" y="122" width="684" height="30" rx="6" fill="#eef2fa"/><rect x="18" y="144" width="684" height="8" fill="#eef2fa"/><line x1="18" y1="152" x2="702" y2="152" stroke="#3b5b9b" stroke-width="1.2"/><text x="42" y="142" font-size="10.5" fill="#3b5b9b" font-weight="bold">THE OUTLINE GIVEN IN THE PROBLEM</text><text x="372" y="142" font-size="10.5" fill="#1f6b34" font-weight="bold">FILLED IN FOR THIS IDENTITY</text><line x1="360" y1="122" x2="360" y2="354" stroke="#ddd" stroke-width="1"/><text x="42" y="172" font-size="10.5" fill="#999" font-style="italic">Proof: First we will show that A &#8838; B.</text><text x="372" y="172" font-size="10.5" fill="#1f3a68">First: A &#9651; B &#8838; (A &#8746; B) \ (A &#8745; B).</text><text x="42" y="192" font-size="10.5" fill="#999" font-style="italic">Towards that end, suppose x &#8712; A.</text><text x="372" y="192" font-size="10.5" fill="#1f3a68">Suppose x &#8712; A &#9651; B, so x lies in exactly one of A, B.</text><text x="42" y="212" font-size="10.5" fill="#999" font-style="italic">&#8942;</text><text x="372" y="212" font-size="10.5" fill="#1f3a68">Case x &#8712; A, x &#8713; B &#8594; x &#8712; A &#8746; B and x &#8713; A &#8745; B.</text><text x="42" y="232" font-size="10.5" fill="#999" font-style="italic">Thus x &#8712; B.</text><text x="372" y="232" font-size="10.5" fill="#1f3a68">Thus x &#8712; (A &#8746; B) \ (A &#8745; B).</text><text x="42" y="252" font-size="10.5" fill="#999" font-style="italic">Now, we will show that B &#8838; A.</text><text x="372" y="252" font-size="10.5" fill="#1f3a68">Now: (A &#8746; B) \ (A &#8745; B) &#8838; A &#9651; B.</text><text x="42" y="272" font-size="10.5" fill="#999" font-style="italic">Suppose that x &#8712; B.</text><text x="372" y="272" font-size="10.5" fill="#1f3a68">Suppose x &#8712; A &#8746; B and x &#8713; A &#8745; B.</text><text x="42" y="292" font-size="10.5" fill="#999" font-style="italic">&#8942;</text><text x="372" y="292" font-size="10.5" fill="#1f3a68">Case x &#8712; A &#8594; x &#8713; B, else x &#8712; A &#8745; B.</text><text x="42" y="312" font-size="10.5" fill="#999" font-style="italic">Thus x &#8712; A.</text><text x="372" y="312" font-size="10.5" fill="#1f3a68">Thus x &#8712; A &#9651; B.</text><text x="42" y="332" font-size="10.5" fill="#999" font-style="italic">Therefore A &#8838; B &#8743; B &#8838; A, so A = B.</text><text x="372" y="332" font-size="10.5" fill="#1f3a68">Therefore the two sets are equal.&#160;&#160;Q.E.D.</text><rect x="22" y="370" width="336" height="168" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="392" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">A &#9651; B: the union, less the lens</text><circle cx="140" cy="464" r="46" fill="#3b5b9b"/><circle cx="200" cy="464" r="46" fill="#3b5b9b"/><circle cx="200" cy="464" r="46" fill="#ffffff" clip-path="url(#lens)"/><circle cx="140" cy="464" r="46" fill="none" stroke="#333" stroke-width="1.2"/><circle cx="200" cy="464" r="46" fill="none" stroke="#333" stroke-width="1.2"/><text x="114" y="412" font-size="12" fill="#1f3a68" font-weight="bold">A</text><text x="230" y="412" font-size="12" fill="#1f3a68" font-weight="bold">B</text><text x="170" y="468" font-size="9.5" fill="#999" text-anchor="middle">out</text><text x="190.0" y="526" font-size="10.5" fill="#666" text-anchor="middle" font-style="italic">everything in exactly one of the two circles</text><rect x="372" y="370" width="336" height="168" rx="5" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.2"/><text x="388" y="392" font-size="11.5" fill="#1f6b34" font-weight="bold">WHAT THE IDENTITY BUYS: A COUNT</text><text x="540.0" y="424" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="bold">|A &#9651; B| = |A &#8746; B| &#8722; |A &#8745; B|</text><text x="540.0" y="452" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="bold">= |A| + |B| &#8722; 2|A &#8745; B|</text><text x="388" y="478" font-size="10.5" fill="#333">Both verified over all 1024 pairs. The factor 2</text><text x="388" y="493" font-size="10.5" fill="#333">is the point: elements of A &#8745; B are counted</text><text x="388" y="508" font-size="10.5" fill="#333">once in each set and must be removed twice,</text><text x="388" y="523" font-size="10.5" fill="#333">once from each side.</text>

  <rect x="18" y="554" width="684" height="120" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="574" font-size="11.5" fill="#b06a10" font-weight="bold">UNLIKE PROBLEM 9, THIS ONE IS FULLY CONSTRUCTIVE</text>
  <text x="40" y="598" font-size="11.5" fill="#333">Both implications were checked on the same Kripke frame that broke a De Morgan direction in</text>
  <text x="40" y="616" font-size="11.5" fill="#333">Problem 9 &#8212; and both are intuitionistically valid.</text>
  <text x="40" y="642" font-size="11.5" fill="#333">The reason: every case split here is handed over by a union already present in the hypothesis. No</text>
  <text x="40" y="660" font-size="11.5" fill="#333">step ever asks &#8220;is x in A, or not?&#8221; without being told.</text>
</svg>