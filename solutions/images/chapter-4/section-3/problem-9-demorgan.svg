<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 804" width="720" height="804" font-family="Georgia, serif">
  <defs><clipPath id="p2"><circle cx="161.6" cy="371.0" r="44"/></clipPath><clipPath id="p3"><circle cx="511.6" cy="371.0" r="44"/></clipPath></defs>
  <rect x="0" y="0" width="720" height="804" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="94" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE TWO LAWS, FOUR CONTAINMENTS IN ALL</text>
  <text x="360" y="60" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">(A &#8746; B)<tspan baseline-shift="super" font-size="9">c</tspan> = A<tspan baseline-shift="super" font-size="8">c</tspan> &#8745; B<tspan baseline-shift="super" font-size="8">c</tspan>&#160;&#160;&#160;&#160;&#160;&#160;&#160;(A &#8745; B)<tspan baseline-shift="super" font-size="9">c</tspan> = A<tspan baseline-shift="super" font-size="8">c</tspan> &#8746; B<tspan baseline-shift="super" font-size="8">c</tspan></text>
  <text x="360" y="84" font-size="11.5" fill="#333" text-anchor="middle">Both laws and all four containments verified over the 1024 pairs from a 5-element universe.</text>

  <rect x="22" y="126" width="336" height="152" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="148" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">(A &#8746; B)<tspan baseline-shift="super" font-size="8">c</tspan></text><rect x="48" y="160" width="284" height="94" fill="#3b5b9b" stroke="#555" stroke-width="1.1"/><circle cx="161.6" cy="207.0" r="44" fill="#ffffff"/><circle cx="218.4" cy="207.0" r="44" fill="#ffffff"/><circle cx="161.6" cy="207.0" r="44" fill="none" stroke="#333" stroke-width="1.2"/><circle cx="218.4" cy="207.0" r="44" fill="none" stroke="#333" stroke-width="1.2"/><text x="127.6" y="159.0" font-size="11.5" fill="#1f3a68" font-weight="bold">A</text><text x="246.4" y="159.0" font-size="11.5" fill="#1f3a68" font-weight="bold">B</text><text x="54" y="174" font-size="10" fill="#ffffff" font-weight="bold">U</text><text x="190.0" y="270" font-size="10.5" fill="#666" text-anchor="middle" font-style="italic">shaded region</text><rect x="372" y="126" width="336" height="152" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="148" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">A<tspan baseline-shift="super" font-size="8">c</tspan> &#8745; B<tspan baseline-shift="super" font-size="8">c</tspan></text><rect x="398" y="160" width="284" height="94" fill="#3b5b9b" stroke="#555" stroke-width="1.1"/><circle cx="511.6" cy="207.0" r="44" fill="#ffffff"/><circle cx="568.4" cy="207.0" r="44" fill="#ffffff"/><circle cx="511.6" cy="207.0" r="44" fill="none" stroke="#333" stroke-width="1.2"/><circle cx="568.4" cy="207.0" r="44" fill="none" stroke="#333" stroke-width="1.2"/><text x="477.6" y="159.0" font-size="11.5" fill="#1f3a68" font-weight="bold">A</text><text x="596.4" y="159.0" font-size="11.5" fill="#1f3a68" font-weight="bold">B</text><text x="404" y="174" font-size="10" fill="#ffffff" font-weight="bold">U</text><text x="540.0" y="270" font-size="10.5" fill="#666" text-anchor="middle" font-style="italic">shaded region</text><rect x="22" y="290" width="336" height="152" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="190.0" y="312" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">(A &#8745; B)<tspan baseline-shift="super" font-size="8">c</tspan></text><rect x="48" y="324" width="284" height="94" fill="#1f6b34" stroke="#555" stroke-width="1.1"/><circle cx="218.4" cy="371.0" r="44" fill="#ffffff" clip-path="url(#p2)"/><circle cx="161.6" cy="371.0" r="44" fill="none" stroke="#333" stroke-width="1.2"/><circle cx="218.4" cy="371.0" r="44" fill="none" stroke="#333" stroke-width="1.2"/><text x="127.6" y="323.0" font-size="11.5" fill="#1f3a68" font-weight="bold">A</text><text x="246.4" y="323.0" font-size="11.5" fill="#1f3a68" font-weight="bold">B</text><text x="54" y="338" font-size="10" fill="#ffffff" font-weight="bold">U</text><text x="190.0" y="434" font-size="10.5" fill="#666" text-anchor="middle" font-style="italic">shaded region</text><rect x="372" y="290" width="336" height="152" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="540.0" y="312" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">A<tspan baseline-shift="super" font-size="8">c</tspan> &#8746; B<tspan baseline-shift="super" font-size="8">c</tspan></text><rect x="398" y="324" width="284" height="94" fill="#1f6b34" stroke="#555" stroke-width="1.1"/><circle cx="568.4" cy="371.0" r="44" fill="#ffffff" clip-path="url(#p3)"/><circle cx="511.6" cy="371.0" r="44" fill="none" stroke="#333" stroke-width="1.2"/><circle cx="568.4" cy="371.0" r="44" fill="none" stroke="#333" stroke-width="1.2"/><text x="477.6" y="323.0" font-size="11.5" fill="#1f3a68" font-weight="bold">A</text><text x="596.4" y="323.0" font-size="11.5" fill="#1f3a68" font-weight="bold">B</text><text x="404" y="338" font-size="10" fill="#ffffff" font-weight="bold">U</text><text x="540.0" y="434" font-size="10.5" fill="#666" text-anchor="middle" font-style="italic">shaded region</text><text x="360" y="456" font-size="11.5" fill="#333" text-anchor="middle">Each row shades one region twice. The pictures coincide; the proofs below say why.</text>
  <rect x="18" y="480" width="684" height="152" rx="6" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/><rect x="18" y="480" width="684" height="30" rx="6" fill="#eef2fa"/><rect x="18" y="502" width="684" height="8" fill="#eef2fa"/><line x1="18" y1="510" x2="702" y2="510" stroke="#3b5b9b" stroke-width="1.2"/><text x="46" y="500" font-size="10.5" fill="#3b5b9b" text-anchor="start" font-weight="bold">CONTAINMENT</text><text x="340" y="500" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">HOW IT GOES</text><text x="600" y="500" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">TECHNIQUE</text><text x="46" y="532" font-size="11" fill="#1f3a68" font-weight="bold">(A&#8746;B)<tspan baseline-shift="super" font-size="8">c</tspan> &#8838; A<tspan baseline-shift="super" font-size="8">c</tspan>&#8745;B<tspan baseline-shift="super" font-size="8">c</tspan></text><text x="340" y="532" font-size="10.5" fill="#555" text-anchor="middle">x &#8712; A would put x in A &#8746; B; same for B</text><text x="600" y="532" font-size="10.5" fill="#666" text-anchor="middle" font-weight="normal">contraposition, twice</text><rect x="19" y="540" width="682" height="27" fill="#fafafa"/><text x="46" y="559" font-size="11" fill="#1f3a68" font-weight="bold">A<tspan baseline-shift="super" font-size="8">c</tspan>&#8745;B<tspan baseline-shift="super" font-size="8">c</tspan> &#8838; (A&#8746;B)<tspan baseline-shift="super" font-size="8">c</tspan></text><text x="340" y="559" font-size="10.5" fill="#555" text-anchor="middle">if x were in A &#8746; B, one of the two cases fails</text><text x="600" y="559" font-size="10.5" fill="#666" text-anchor="middle" font-weight="normal">cases + contradiction</text><text x="46" y="586" font-size="11" fill="#1f3a68" font-weight="bold">(A&#8745;B)<tspan baseline-shift="super" font-size="8">c</tspan> &#8838; A<tspan baseline-shift="super" font-size="8">c</tspan>&#8746;B<tspan baseline-shift="super" font-size="8">c</tspan></text><text x="340" y="586" font-size="10.5" fill="#555" text-anchor="middle">split on x &#8712; A or x &#8713; A</text><text x="600" y="586" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">excluded middle</text><rect x="19" y="594" width="682" height="27" fill="#fafafa"/><text x="46" y="613" font-size="11" fill="#1f3a68" font-weight="bold">A<tspan baseline-shift="super" font-size="8">c</tspan>&#8746;B<tspan baseline-shift="super" font-size="8">c</tspan> &#8838; (A&#8745;B)<tspan baseline-shift="super" font-size="8">c</tspan></text><text x="340" y="613" font-size="10.5" fill="#555" text-anchor="middle">either missing set already blocks A &#8745; B</text><text x="600" y="613" font-size="10.5" fill="#666" text-anchor="middle" font-weight="normal">cases</text>

  <rect x="18" y="648" width="684" height="140" rx="6" fill="#fdecec" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="668" font-size="11.5" fill="#9b2c2c" font-weight="bold">ONE DIRECTION IS NOT CONSTRUCTIVE &#8212; AND IT IS THE ONE THAT NEEDED THE EXCLUDED MIDDLE</text>
  <text x="40" y="694" font-size="11.5" fill="#333">Checked on a Kripke frame with a root below two incomparable worlds, three of the four implications</text>
  <text x="40" y="712" font-size="11.5" fill="#333">are intuitionistically valid. The fourth is not:</text>
  <text x="360" y="740" font-size="13" fill="#9b2c2c" text-anchor="middle" font-weight="bold">&#172;(p &#8743; q) &#8594; &#172;p &#8744; &#172;q&#160;&#160;&#160;fails</text>
  <text x="40" y="764" font-size="11.5" fill="#333">with p true only at the first world and q only at the second. That is exactly the containment above</text>
  <text x="40" y="782" font-size="11.5" fill="#333">that could not be proved without splitting on x &#8712; A or x &#8713; A.</text>
</svg>