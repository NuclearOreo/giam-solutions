<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 856" width="720" height="856" font-family="Georgia, serif">
  <defs><clipPath id="lens0"><circle cx="153.51999999999998" cy="210.0" r="42"/></clipPath><clipPath id="lens2"><circle cx="153.51999999999998" cy="386.0" r="42"/></clipPath></defs>
  <rect x="0" y="0" width="720" height="856" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="94" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">FOUR IDENTITIES, ONE METHOD</text>
  <text x="360" y="58" font-size="13.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">x &#8712; LHS&#160;&#160;&#8660;&#160;&#160;&#8230;&#160;&#160;&#8660;&#160;&#160;x &#8712; RHS</text>
  <text x="360" y="80" font-size="11.5" fill="#333" text-anchor="middle">Every step is an equivalence, so one chain proves both containments at once. All four identities</text>
  <text x="360" y="97" font-size="11.5" fill="#333" text-anchor="middle">were also checked over all 32 subsets of a five-element universe (32768 triples for part d).</text>

  <rect x="22" y="126" width="336" height="164" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="34" y="145" font-size="12.5" fill="#3b5b9b" font-weight="bold">a.</text><text x="54" y="145" font-size="12.5" fill="#1f3a68" font-weight="bold">(A &#8745; B)<tspan baseline-shift="super" font-size="8">c</tspan> = A<tspan baseline-shift="super" font-size="8">c</tspan> &#8746; B<tspan baseline-shift="super" font-size="8">c</tspan></text><rect x="38" y="156" width="304" height="108" fill="#3b5b9b" stroke="#888" stroke-width="1"/><circle cx="226.48" cy="210.0" r="42" fill="#ffffff" clip-path="url(#lens0)"/><circle cx="153.51999999999998" cy="210.0" r="42" fill="none" stroke="#1f3a68" stroke-width="1.3"/><circle cx="226.48" cy="210.0" r="42" fill="none" stroke="#1f3a68" stroke-width="1.3"/><text x="117.51999999999998" y="163.0" font-size="12" fill="#1f3a68" font-weight="bold">A</text><text x="256.48" y="163.0" font-size="12" fill="#1f3a68" font-weight="bold">B</text><text x="44" y="169" font-size="10" fill="#888">U</text><text x="34" y="281" font-size="10.5" fill="#555" font-style="italic">complement of the lens</text><rect x="372" y="126" width="336" height="164" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="384" y="145" font-size="12.5" fill="#3b5b9b" font-weight="bold">b.</text><text x="404" y="145" font-size="12.5" fill="#1f3a68" font-weight="bold">A &#8746; B = A &#8746; (A<tspan baseline-shift="super" font-size="8">c</tspan> &#8745; B)</text><rect x="388" y="156" width="304" height="108" fill="#fafafa" stroke="#888" stroke-width="1"/><circle cx="503.52" cy="210.0" r="42" fill="#3b5b9b"/><circle cx="576.48" cy="210.0" r="42" fill="#3b5b9b"/><circle cx="503.52" cy="210.0" r="42" fill="none" stroke="#1f3a68" stroke-width="1.3"/><circle cx="576.48" cy="210.0" r="42" fill="none" stroke="#1f3a68" stroke-width="1.3"/><text x="467.52" y="163.0" font-size="12" fill="#1f3a68" font-weight="bold">A</text><text x="606.48" y="163.0" font-size="12" fill="#1f3a68" font-weight="bold">B</text><text x="394" y="169" font-size="10" fill="#888">U</text><text x="384" y="281" font-size="10.5" fill="#555" font-style="italic">both circles &#8212; but split disjointly</text><rect x="22" y="302" width="336" height="164" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="34" y="321" font-size="12.5" fill="#3b5b9b" font-weight="bold">c.</text><text x="54" y="321" font-size="12.5" fill="#1f3a68" font-weight="bold">A &#9651; B = (A &#8746; B) \ (A &#8745; B)</text><rect x="38" y="332" width="304" height="108" fill="#fafafa" stroke="#888" stroke-width="1"/><circle cx="153.51999999999998" cy="386.0" r="42" fill="#3b5b9b"/><circle cx="226.48" cy="386.0" r="42" fill="#3b5b9b"/><circle cx="226.48" cy="386.0" r="42" fill="#ffffff" clip-path="url(#lens2)"/><circle cx="153.51999999999998" cy="386.0" r="42" fill="none" stroke="#1f3a68" stroke-width="1.3"/><circle cx="226.48" cy="386.0" r="42" fill="none" stroke="#1f3a68" stroke-width="1.3"/><text x="117.51999999999998" y="339.0" font-size="12" fill="#1f3a68" font-weight="bold">A</text><text x="256.48" y="339.0" font-size="12" fill="#1f3a68" font-weight="bold">B</text><text x="44" y="345" font-size="10" fill="#888">U</text><text x="34" y="457" font-size="10.5" fill="#555" font-style="italic">both circles, lens removed</text><rect x="372" y="302" width="336" height="164" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/><text x="384" y="321" font-size="12.5" fill="#3b5b9b" font-weight="bold">d.</text><text x="404" y="321" font-size="12.5" fill="#1f3a68" font-weight="bold">(A &#8746; B) \ C = (A \ C) &#8746; (B \ C)</text><rect x="388" y="332" width="304" height="108" fill="#fafafa" stroke="#888" stroke-width="1"/><circle cx="497.44" cy="378.0" r="40" fill="#3b5b9b"/><circle cx="564.3199999999999" cy="378.0" r="40" fill="#3b5b9b"/><circle cx="530.88" cy="416.0" r="40" fill="#ffffff"/><text x="461.44" y="333.0" font-size="12" fill="#1f3a68" font-weight="bold">A</text><text x="592.3199999999999" y="333.0" font-size="12" fill="#1f3a68" font-weight="bold">B</text><text x="524.88" y="469.0" font-size="12" fill="#1f3a68" font-weight="bold">C</text><circle cx="497.44" cy="378.0" r="40" fill="none" stroke="#1f3a68" stroke-width="1.3"/><circle cx="564.3199999999999" cy="378.0" r="40" fill="none" stroke="#1f3a68" stroke-width="1.3"/><circle cx="530.88" cy="416.0" r="40" fill="none" stroke="#1f3a68" stroke-width="1.3"/><text x="394" y="345" font-size="10" fill="#888">U</text><text x="384" y="457" font-size="10.5" fill="#555" font-style="italic">A and B, with C carved out</text>

  <rect x="18" y="492" width="684" height="222" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="512" font-size="11.5" fill="#1f6b34" font-weight="bold">EACH IDENTITY IS A PROPOSITIONAL TAUTOLOGY (p means x &#8712; A, q means x &#8712; B)</text>
  <text x="54" y="554" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">p q</text><text x="162" y="554" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">&#172;(p&#8743;q)</text><text x="258" y="554" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">&#172;p&#8744;&#172;q</text><text x="362" y="554" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">p&#8744;q</text><text x="452" y="554" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">p&#8744;(&#172;p&#8743;q)</text><text x="568" y="554" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">p&#8853;q</text><text x="640" y="554" font-size="10.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">(p&#8744;q)&#8743;&#172;(p&#8743;q)</text><line x1="36" y1="560" x2="684" y2="560" stroke="#3b5b9b" stroke-width="1"/><text x="54" y="578" font-size="11" fill="#333" text-anchor="middle">0 0</text><text x="162" y="578" font-size="11" fill="#1f6b34" text-anchor="middle">1</text><text x="258" y="578" font-size="11" fill="#1f6b34" text-anchor="middle">1</text><text x="362" y="578" font-size="11" fill="#aaa" text-anchor="middle">0</text><text x="452" y="578" font-size="11" fill="#aaa" text-anchor="middle">0</text><text x="568" y="578" font-size="11" fill="#aaa" text-anchor="middle">0</text><text x="640" y="578" font-size="11" fill="#aaa" text-anchor="middle">0</text><text x="54" y="597" font-size="11" fill="#333" text-anchor="middle">0 1</text><text x="162" y="597" font-size="11" fill="#1f6b34" text-anchor="middle">1</text><text x="258" y="597" font-size="11" fill="#1f6b34" text-anchor="middle">1</text><text x="362" y="597" font-size="11" fill="#1f6b34" text-anchor="middle">1</text><text x="452" y="597" font-size="11" fill="#1f6b34" text-anchor="middle">1</text><text x="568" y="597" font-size="11" fill="#1f6b34" text-anchor="middle">1</text><text x="640" y="597" font-size="11" fill="#1f6b34" text-anchor="middle">1</text><text x="54" y="616" font-size="11" fill="#333" text-anchor="middle">1 0</text><text x="162" y="616" font-size="11" fill="#1f6b34" text-anchor="middle">1</text><text x="258" y="616" font-size="11" fill="#1f6b34" text-anchor="middle">1</text><text x="362" y="616" font-size="11" fill="#1f6b34" text-anchor="middle">1</text><text x="452" y="616" font-size="11" fill="#1f6b34" text-anchor="middle">1</text><text x="568" y="616" font-size="11" fill="#1f6b34" text-anchor="middle">1</text><text x="640" y="616" font-size="11" fill="#1f6b34" text-anchor="middle">1</text><text x="54" y="635" font-size="11" fill="#333" text-anchor="middle">1 1</text><text x="162" y="635" font-size="11" fill="#aaa" text-anchor="middle">0</text><text x="258" y="635" font-size="11" fill="#aaa" text-anchor="middle">0</text><text x="362" y="635" font-size="11" fill="#1f6b34" text-anchor="middle">1</text><text x="452" y="635" font-size="11" fill="#1f6b34" text-anchor="middle">1</text><text x="568" y="635" font-size="11" fill="#aaa" text-anchor="middle">0</text><text x="640" y="635" font-size="11" fill="#aaa" text-anchor="middle">0</text><line x1="206" y1="540" x2="206" y2="642" stroke="#ddd" stroke-width="1"/><line x1="408" y1="540" x2="408" y2="642" stroke="#ddd" stroke-width="1"/><text x="120" y="534" font-size="10" fill="#9b2c2c" text-anchor="middle" font-weight="bold">part a</text><text x="310" y="534" font-size="10" fill="#9b2c2c" text-anchor="middle" font-weight="bold">part b</text><text x="600" y="534" font-size="10" fill="#9b2c2c" text-anchor="middle" font-weight="bold">part c</text>
  <text x="40" y="670" font-size="11.5" fill="#333">In each pair of columns the two entries agree on every row &#8212; that agreement <tspan font-style="italic">is</tspan> the element-chasing</text>
  <text x="40" y="690" font-size="11.5" fill="#333">proof. Part d is the same idea with a third variable r, and the tautology (p&#8744;q)&#8743;&#172;r &#8801; (p&#8743;&#172;r)&#8744;(q&#8743;&#172;r).</text>

  <rect x="18" y="728" width="684" height="112" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="748" font-size="11.5" fill="#b06a10" font-weight="bold">WHY PART b IS WORTH MORE THAN IT LOOKS</text>
  <text x="40" y="772" font-size="11.5" fill="#333">A and A<tspan baseline-shift="super" font-size="8">c</tspan> &#8745; B are always disjoint &#8212; verified &#8212; so part b rewrites any union as a <tspan font-style="italic">disjoint</tspan> one, giving</text>
  <text x="360" y="800" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="bold">|A &#8746; B| = |A| + |A<tspan baseline-shift="super" font-size="8">c</tspan> &#8745; B|</text>
  <text x="40" y="826" font-size="11.5" fill="#333">with no correction term. This is the trick behind inclusion&#8211;exclusion and countable additivity.</text>
</svg>