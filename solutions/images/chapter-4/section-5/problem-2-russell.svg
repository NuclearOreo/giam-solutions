<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 729" width="720" height="729" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="729" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="92" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE PARADOX NEEDS ONE SUBSTITUTION, AND THAT IS WHAT IS DENIED</text>
  <text x="360" y="60" font-size="13.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">the rule &#8220;for every <tspan font-style="italic">set</tspan> x&#8221; can only be applied to sets</text>
  <text x="360" y="84" font-size="11.5" fill="#333" text-anchor="middle">Declaring R to be no set removes R from the range of x. Nothing else about the argument changes.</text>
  <rect x="22" y="122" width="336" height="274" rx="5" fill="#fdecec" stroke="#9b2c2c" stroke-width="1.3"/><text x="190.0" y="144" font-size="12.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">if R is a set</text><text x="38" y="172" font-size="11.5" fill="#1f3a68">R = {{ x : x &#8713; x }}</text><text x="38" y="202" font-size="11.5" fill="#1f3a68">for every set x:&#160; x &#8712; R &#8660; x &#8713; x</text><text x="38" y="217" font-size="9.5" fill="#888" font-style="italic">the defining property</text><text x="38" y="249" font-size="11.5" fill="#1f3a68">put x = R</text><text x="38" y="264" font-size="9.5" fill="#888" font-style="italic">legitimate: R is a set</text><text x="38" y="296" font-size="11.5" fill="#1f3a68">R &#8712; R &#8660; R &#8713; R</text><text x="190.0" y="378" font-size="12.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">CONTRADICTION</text><rect x="372" y="122" width="336" height="274" rx="5" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/><text x="540.0" y="144" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">if R is not a set</text><text x="388" y="172" font-size="11.5" fill="#1f3a68">R = {{ x : x &#8713; x }}</text><text x="388" y="187" font-size="9.5" fill="#888" font-style="italic">declared a proper class</text><text x="388" y="219" font-size="11.5" fill="#1f3a68">for every set x:&#160; x &#8712; R &#8660; x &#8713; x</text><text x="388" y="234" font-size="9.5" fill="#888" font-style="italic">unchanged</text><text x="388" y="266" font-size="11.5" fill="#bbb">put x = R</text><text x="388" y="281" font-size="9.5" fill="#9b2c2c" font-style="italic">BLOCKED: R is not a set</text><text x="388" y="313" font-size="11.5" fill="#bbb">&#8212;</text><text x="540.0" y="378" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">no contradiction</text><path d="M 522 272 l 52 0" stroke="#9b2c2c" stroke-width="2.2"/><path d="M 548 260 l 0 24" stroke="#9b2c2c" stroke-width="2.2"/>
  <rect x="18" y="410" width="684" height="148" rx="6" fill="#fdf6ef" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="430" font-size="11.5" fill="#b06a10" font-weight="bold">WHICH HALF OF THE DEFINITION SURVIVES</text>
  <text x="40" y="454" font-size="11.5" fill="#333">Write A for &#8220;R &#8712; R&#8221;. The paradox of 4.5 Problem 1 needs both conditionals:</text>
  <text x="56" y="478" font-size="11.5" fill="#1f3a68">A &#8658; &#172;A&#160;&#160; everything in R fails to contain itself&#160;&#160;&#8212; <tspan fill="#1f6b34" font-weight="bold">survives</tspan></text>
  <text x="56" y="498" font-size="11.5" fill="#1f3a68">&#172;A &#8658; A&#160;&#160; everything failing to contain itself is in R&#160;&#160;&#8212; <tspan fill="#9b2c2c" font-weight="bold">needs R to be a set</tspan></text>
  <text x="40" y="524" font-size="11.5" fill="#333">Keeping only the first is satisfiable, and it forces &#172;A. So R &#8713; R holds &#8212; harmlessly, because R was</text>
  <text x="40" y="542" font-size="11.5" fill="#333">never eligible to be an element of anything in the first place.</text>
  <rect x="18" y="571" width="684" height="142" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="591" font-size="11.5" fill="#1f6b34" font-weight="bold">CHECKED IN FINITE MODELS, AND WHAT ZERMELO DOES INSTEAD</text>
  <text x="40" y="615" font-size="11.5" fill="#333">Model membership as a directed graph. Searching every graph on up to 4 nodes for a node R with</text>
  <text x="40" y="633" font-size="11.5" fill="#333">x &#8594; R exactly when x &#8629;&#824; x: <tspan fill="#9b2c2c" font-weight="bold">no solution at any size</tspan>. Let R be outside the graph instead and every</text>
  <text x="40" y="651" font-size="11.5" fill="#333">one of the 65536 graphs on 4 nodes is consistent &#8212; R&#8217;s members are simply read off.</text>
  <text x="40" y="677" font-size="11.5" fill="#333">Zermelo&#8217;s separation axiom gets the same effect: only { x &#8712; A : x &#8713; x } may be formed. The old</text>
  <text x="40" y="695" font-size="11.5" fill="#333">argument then proves a theorem instead &#8212; that set is never an element of A &#8212; so no set holds all sets.</text>
</svg>