<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 864" width="720" height="864" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="864" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="74" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE ANSWER</text>
  <text x="400" y="38" font-size="15" fill="#1f3a68" text-anchor="middle" font-weight="bold">t corresponds to the <tspan fill="#1f6b34">universal set</tspan> U</text>
  <text x="400" y="64" font-size="11.5" fill="#333" text-anchor="middle">A tautology is true of every x in the universe of discourse, so its truth set leaves</text>
  <text x="400" y="80" font-size="11.5" fill="#333" text-anchor="middle">nothing out &#8212; it is the whole universe.</text>

  <text x="56" y="138" font-size="11.5" fill="#3b5b9b" font-weight="bold">TRUTH SETS, DRAWN</text>
  <rect x="56" y="176" width="250" height="116" rx="9" fill="#ffffff" stroke="#555" stroke-width="2"/><ellipse cx="151.0" cy="234.0" rx="65.0" ry="34.8" fill="#dbe6f7" stroke="#3b5b9b" stroke-width="1.6"/><text x="296" y="283" font-size="11" fill="#555" text-anchor="end" font-style="italic">U</text><text x="181.0" y="162" font-size="13.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">an ordinary sentence P</text><text x="181.0" y="312" font-size="11" fill="#555" text-anchor="middle">S&#8346; is some part of U</text><text x="151.0" y="239.0" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">S&#8346;</text><rect x="414" y="176" width="250" height="116" rx="9" fill="#ffffff" stroke="#555" stroke-width="2"/><rect x="417" y="179" width="244" height="110" rx="7" fill="#cfe9d6" opacity="0.95"/><text x="654" y="283" font-size="11" fill="#555" text-anchor="end" font-style="italic">U</text><text x="539.0" y="162" font-size="13.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">the tautology t</text><text x="539.0" y="312" font-size="11" fill="#555" text-anchor="middle">S&#8348; fills U completely</text><text x="539" y="239.0" font-size="13" fill="#1f6b34" text-anchor="middle" font-weight="bold">S&#8348; = U</text>

  <text x="60" y="342" font-size="11.5" fill="#3b5b9b" font-weight="bold">t AND ITS LAWS, TRANSLATED</text>
  <rect x="60" y="361" width="600" height="25" rx="3" fill="#eef2fa" stroke="#9fb2d4"/><text x="170" y="380" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">in Logic</text><text x="340" y="380" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">in Set theory</text><text x="520" y="380" font-size="11.5" fill="#1f3a68" text-anchor="start" font-weight="bold">reading</text><rect x="60" y="388" width="600" height="23" rx="3" fill="#f1f8f2" stroke="#1f6b34" stroke-width="2.1"/><text x="170" y="406" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">t&#160; (tautology)</text><text x="340" y="406" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">U&#160; (universal set)</text><text x="520" y="406" font-size="11" fill="#555">true of everything</text><rect x="60" y="413" width="600" height="23" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.3"/><text x="170" y="431" font-size="12.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">c&#160; (contradiction)</text><text x="340" y="431" font-size="12.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">&#8709;&#160; (empty set)</text><text x="520" y="431" font-size="11" fill="#555">true of nothing</text><rect x="60" y="438" width="600" height="23" rx="3" fill="#fbfcfe" stroke="#e3e8f2" stroke-width="0.8"/><text x="170" y="456" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="normal">A &#8743; t &#8801; A</text><text x="340" y="456" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="normal">A &#8745; U = A</text><text x="520" y="456" font-size="11" fill="#555">identity</text><rect x="60" y="463" width="600" height="23" rx="3" fill="#fbfcfe" stroke="#e3e8f2" stroke-width="0.8"/><text x="170" y="481" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="normal">A &#8744; t &#8801; t</text><text x="340" y="481" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="normal">A &#8746; U = U</text><text x="520" y="481" font-size="11" fill="#555">domination</text><rect x="60" y="488" width="600" height="23" rx="3" fill="#fbfcfe" stroke="#e3e8f2" stroke-width="0.8"/><text x="170" y="506" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="normal">&#172;t &#8801; c</text><text x="340" y="506" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="normal">complement of U = &#8709;</text><text x="520" y="506" font-size="11" fill="#555">negation</text><rect x="60" y="513" width="600" height="23" rx="3" fill="#fbfcfe" stroke="#e3e8f2" stroke-width="0.8"/><text x="170" y="531" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="normal">P &#8658; t&#160; always</text><text x="340" y="531" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="normal">S&#8346; &#8838; U&#160; always</text><text x="520" y="531" font-size="11" fill="#555">everything sits inside U</text>

  <rect x="18" y="582" width="684" height="126" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="602" font-size="11.5" fill="#1f6b34" font-weight="bold">THE DUALITY IS EXACT</text>
  <text x="40" y="624" font-size="11.5" fill="#333">Swapping t &#8596; c together with &#8743; &#8596; &#8744; carries each true law to another true law &#8212; and on the set side,</text>
  <text x="40" y="642" font-size="11.5" fill="#333">swapping U &#8596; &#8709; together with &#8745; &#8596; &#8746; does the same.</text>
  <text x="80" y="668" font-size="12.5" fill="#1f3a68">A &#8743; t &#8801; A&#160;&#160;&#8596;&#160;&#160;A &#8744; c &#8801; A</text>
  <text x="420" y="668" font-size="12.5" fill="#1f3a68">A &#8745; U = A&#160;&#160;&#8596;&#160;&#160;A &#8746; &#8709; = A</text>
  <text x="80" y="690" font-size="12.5" fill="#1f3a68">A &#8744; t &#8801; t&#160;&#160;&#8596;&#160;&#160;A &#8743; c &#8801; c</text>
  <text x="420" y="690" font-size="12.5" fill="#1f3a68">A &#8746; U = U&#160;&#160;&#8596;&#160;&#160;A &#8745; &#8709; = &#8709;</text>

  <rect x="18" y="722" width="684" height="126" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="742" font-size="11.5" fill="#b06a10" font-weight="bold">ONE ASYMMETRY: U DEPENDS ON THE UNIVERSE, &#8709; DOES NOT</text>
  <text x="40" y="764" font-size="11.5" fill="#333">There is exactly one empty set, whatever the universe of discourse. But U <tspan font-style="italic">is</tspan> the universe, so it</text>
  <text x="40" y="782" font-size="11.5" fill="#333">changes whenever the universe does &#8212; 10 elements, or 5, or 1, depending on what is under discussion.</text>
  <text x="40" y="808" font-size="11.5" fill="#333">Correspondingly, &#8220;x &lt; 100&#8221; is a tautology on &#123;1, &#8230;, 10&#125; but not on &#8469;, while &#8220;x = x&#8221; is one everywhere.</text>
  <text x="40" y="832" font-size="11" fill="#555" font-style="italic">All truth sets above were computed on &#123;1, &#8230;, 10&#125;; the four laws were checked with A = &#123;2, 3, 5, 7&#125;.</text>
</svg>