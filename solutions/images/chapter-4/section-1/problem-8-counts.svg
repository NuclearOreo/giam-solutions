<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 844" width="720" height="844" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="844" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="82" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE ANSWERS</text>
  <text x="230" y="62" font-size="16" fill="#1f6b34" text-anchor="middle" font-weight="bold">5 singletons</text>
  <text x="500" y="62" font-size="16" fill="#9b2c2c" text-anchor="middle" font-weight="bold">10 doubletons</text>
  <text x="365" y="86" font-size="11" fill="#555" text-anchor="middle" font-style="italic">one subset per element, and one per unordered pair of distinct elements</text>

  <text x="40" y="180" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE POWER SET BROKEN DOWN BY SUBSET SIZE</text>
  <rect x="40" y="196" width="98" height="58" rx="6" fill="#f5f6f9" stroke="#6b7ea3" stroke-width="1"/><text x="89.0" y="216" font-size="10.5" fill="#6b7ea3" text-anchor="middle">size 0</text><text x="89.0" y="238" font-size="17" fill="#6b7ea3" text-anchor="middle" font-weight="bold">1</text><text x="89.0" y="270" font-size="10" fill="#888" text-anchor="middle">C(5,0)</text><rect x="152" y="196" width="98" height="58" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="2.2"/><text x="201.0" y="216" font-size="10.5" fill="#1f6b34" text-anchor="middle">size 1</text><text x="201.0" y="238" font-size="17" fill="#1f6b34" text-anchor="middle" font-weight="bold">5</text><text x="201.0" y="270" font-size="10" fill="#888" text-anchor="middle">C(5,1)</text><rect x="264" y="196" width="98" height="58" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="2.2"/><text x="313.0" y="216" font-size="10.5" fill="#9b2c2c" text-anchor="middle">size 2</text><text x="313.0" y="238" font-size="17" fill="#9b2c2c" text-anchor="middle" font-weight="bold">10</text><text x="313.0" y="270" font-size="10" fill="#888" text-anchor="middle">C(5,2)</text><rect x="376" y="196" width="98" height="58" rx="6" fill="#f5f6f9" stroke="#6b7ea3" stroke-width="1"/><text x="425.0" y="216" font-size="10.5" fill="#6b7ea3" text-anchor="middle">size 3</text><text x="425.0" y="238" font-size="17" fill="#6b7ea3" text-anchor="middle" font-weight="bold">10</text><text x="425.0" y="270" font-size="10" fill="#888" text-anchor="middle">C(5,3)</text><rect x="488" y="196" width="98" height="58" rx="6" fill="#f5f6f9" stroke="#6b7ea3" stroke-width="1"/><text x="537.0" y="216" font-size="10.5" fill="#6b7ea3" text-anchor="middle">size 4</text><text x="537.0" y="238" font-size="17" fill="#6b7ea3" text-anchor="middle" font-weight="bold">5</text><text x="537.0" y="270" font-size="10" fill="#888" text-anchor="middle">C(5,4)</text><rect x="600" y="196" width="98" height="58" rx="6" fill="#f5f6f9" stroke="#6b7ea3" stroke-width="1"/><text x="649.0" y="216" font-size="10.5" fill="#6b7ea3" text-anchor="middle">size 5</text><text x="649.0" y="238" font-size="17" fill="#6b7ea3" text-anchor="middle" font-weight="bold">1</text><text x="649.0" y="270" font-size="10" fill="#888" text-anchor="middle">C(5,5)</text><text x="40" y="294" font-size="11.5" fill="#333">1 + 5 + 10 + 10 + 5 + 1 = 32 = 2&#8309; &#8212; the whole power set, sorted by size.</text>

  <text x="40" y="362" font-size="11.5" fill="#1f6b34" font-weight="bold">THE 5 SINGLETONS &#8212; one per element</text><rect x="46" y="374" width="72" height="30" rx="4" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.2"/><text x="82" y="394" font-size="13" fill="#1f6b34" text-anchor="middle">&#123;a&#125;</text><rect x="130" y="374" width="72" height="30" rx="4" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.2"/><text x="166" y="394" font-size="13" fill="#1f6b34" text-anchor="middle">&#123;b&#125;</text><rect x="214" y="374" width="72" height="30" rx="4" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.2"/><text x="250" y="394" font-size="13" fill="#1f6b34" text-anchor="middle">&#123;c&#125;</text><rect x="298" y="374" width="72" height="30" rx="4" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.2"/><text x="334" y="394" font-size="13" fill="#1f6b34" text-anchor="middle">&#123;d&#125;</text><rect x="382" y="374" width="72" height="30" rx="4" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.2"/><text x="418" y="394" font-size="13" fill="#1f6b34" text-anchor="middle">&#123;e&#125;</text><text x="40" y="438" font-size="11.5" fill="#9b2c2c" font-weight="bold">THE 10 DOUBLETONS &#8212; one per unordered pair</text><rect x="46" y="450" width="116" height="28" rx="4" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.2"/><text x="104" y="469" font-size="12.5" fill="#9b2c2c" text-anchor="middle">&#123;a,b&#125;</text><rect x="174" y="450" width="116" height="28" rx="4" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.2"/><text x="232" y="469" font-size="12.5" fill="#9b2c2c" text-anchor="middle">&#123;a,c&#125;</text><rect x="302" y="450" width="116" height="28" rx="4" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.2"/><text x="360" y="469" font-size="12.5" fill="#9b2c2c" text-anchor="middle">&#123;a,d&#125;</text><rect x="430" y="450" width="116" height="28" rx="4" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.2"/><text x="488" y="469" font-size="12.5" fill="#9b2c2c" text-anchor="middle">&#123;a,e&#125;</text><rect x="558" y="450" width="116" height="28" rx="4" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.2"/><text x="616" y="469" font-size="12.5" fill="#9b2c2c" text-anchor="middle">&#123;b,c&#125;</text><rect x="46" y="486" width="116" height="28" rx="4" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.2"/><text x="104" y="505" font-size="12.5" fill="#9b2c2c" text-anchor="middle">&#123;b,d&#125;</text><rect x="174" y="486" width="116" height="28" rx="4" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.2"/><text x="232" y="505" font-size="12.5" fill="#9b2c2c" text-anchor="middle">&#123;b,e&#125;</text><rect x="302" y="486" width="116" height="28" rx="4" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.2"/><text x="360" y="505" font-size="12.5" fill="#9b2c2c" text-anchor="middle">&#123;c,d&#125;</text><rect x="430" y="486" width="116" height="28" rx="4" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.2"/><text x="488" y="505" font-size="12.5" fill="#9b2c2c" text-anchor="middle">&#123;c,e&#125;</text><rect x="558" y="486" width="116" height="28" rx="4" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.2"/><text x="616" y="505" font-size="12.5" fill="#9b2c2c" text-anchor="middle">&#123;d,e&#125;</text>

  <rect x="18" y="558" width="684" height="138" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="578" font-size="11.5" fill="#b06a10" font-weight="bold">WHY 10 AND NOT 20</text>
  <text x="40" y="600" font-size="11.5" fill="#333">Choosing an ordered pair of distinct letters gives 5 &#215; 4 = 20 possibilities. But &#123;a, b&#125; and &#123;b, a&#125; are the</text>
  <text x="40" y="618" font-size="11.5" fill="#333"><tspan font-weight="bold">same set</tspan> &#8212; order carries no information in a set &#8212; so every doubleton was counted twice.</text>
  <text x="360" y="646" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">20 &#247; 2 = 10 = C(5, 2)</text>
  <text x="40" y="672" font-size="11.5" fill="#333">The singleton count needs no such correction: with one element there is nothing to reorder, which is</text>
  <text x="40" y="690" font-size="11.5" fill="#333">why the answer there is simply 5.</text>

  <rect x="18" y="710" width="684" height="118" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.2"/>
  <text x="34" y="730" font-size="11.5" fill="#3b5b9b" font-weight="bold">TWO PATTERNS IN THE ROW 1, 5, 10, 10, 5, 1</text>
  <text x="40" y="752" font-size="11.5" fill="#333"><tspan font-weight="bold">It sums to 32.</tspan>&#160; Every subset has exactly one size, so the six counts partition the power set.</text>
  <text x="40" y="776" font-size="11.5" fill="#333"><tspan font-weight="bold">It reads the same backwards.</tspan>&#160; C(5, k) = C(5, 5 &#8722; k), because taking complements pairs each</text>
  <text x="40" y="794" font-size="11.5" fill="#333">k-element subset with a unique (5 &#8722; k)-element one. So there are also 10 three-element subsets.</text>
  <text x="40" y="818" font-size="10.5" fill="#555" font-style="italic">All six counts were obtained by enumerating the 32 subsets directly.</text>
</svg>