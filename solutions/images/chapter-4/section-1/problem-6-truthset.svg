<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 850" width="720" height="850" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="850" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="84" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE ANSWER</text>
  <text x="400" y="40" font-size="15" fill="#1f3a68" text-anchor="middle" font-weight="bold">S&#8346; = &#123; x &#8712; &#8484; : 6 | x &#125; = &#123; &#8230;, &#8722;12, &#8722;6, 0, 6, 12, 18, &#8230; &#125;</text>
  <text x="400" y="64" font-size="11.5" fill="#333" text-anchor="middle">A number divisible by both 3 and 2 is divisible by their least common multiple.</text>
  <text x="400" y="82" font-size="11.5" fill="#333" text-anchor="middle">Since 3 and 2 are coprime, that is 3 &#215; 2 = 6.</text>

  <text x="34" y="192" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE INTEGERS FROM &#8722;30 TO 30</text>
  <text x="34" y="208" font-size="10.5" fill="#555">Upper ticks mark multiples of 3, lower ticks multiples of 2; where both occur the point is filled and labelled.</text>
  <line x1="60" y1="236" x2="664" y2="236" stroke="#bbb" stroke-width="1"/><circle cx="60.0" cy="236" r="6.5" fill="#1f6b34"/><text x="60.0" y="260" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">-30</text><circle cx="70.1" cy="236" r="1.6" fill="#ddd"/><circle cx="80.1" cy="250" r="3.6" fill="#b06a10"/><circle cx="90.2" cy="222" r="3.6" fill="#9b2c2c"/><circle cx="100.3" cy="250" r="3.6" fill="#b06a10"/><circle cx="110.3" cy="236" r="1.6" fill="#ddd"/><circle cx="120.4" cy="236" r="6.5" fill="#1f6b34"/><text x="120.4" y="260" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">-24</text><circle cx="130.5" cy="236" r="1.6" fill="#ddd"/><circle cx="140.5" cy="250" r="3.6" fill="#b06a10"/><circle cx="150.6" cy="222" r="3.6" fill="#9b2c2c"/><circle cx="160.7" cy="250" r="3.6" fill="#b06a10"/><circle cx="170.7" cy="236" r="1.6" fill="#ddd"/><circle cx="180.8" cy="236" r="6.5" fill="#1f6b34"/><text x="180.8" y="260" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">-18</text><circle cx="190.9" cy="236" r="1.6" fill="#ddd"/><circle cx="200.9" cy="250" r="3.6" fill="#b06a10"/><circle cx="211.0" cy="222" r="3.6" fill="#9b2c2c"/><circle cx="221.1" cy="250" r="3.6" fill="#b06a10"/><circle cx="231.1" cy="236" r="1.6" fill="#ddd"/><circle cx="241.2" cy="236" r="6.5" fill="#1f6b34"/><text x="241.2" y="260" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">-12</text><circle cx="251.3" cy="236" r="1.6" fill="#ddd"/><circle cx="261.3" cy="250" r="3.6" fill="#b06a10"/><circle cx="271.4" cy="222" r="3.6" fill="#9b2c2c"/><circle cx="281.5" cy="250" r="3.6" fill="#b06a10"/><circle cx="291.5" cy="236" r="1.6" fill="#ddd"/><circle cx="301.6" cy="236" r="6.5" fill="#1f6b34"/><text x="301.6" y="260" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">-6</text><circle cx="311.7" cy="236" r="1.6" fill="#ddd"/><circle cx="321.7" cy="250" r="3.6" fill="#b06a10"/><circle cx="331.8" cy="222" r="3.6" fill="#9b2c2c"/><circle cx="341.9" cy="250" r="3.6" fill="#b06a10"/><circle cx="351.9" cy="236" r="1.6" fill="#ddd"/><circle cx="362.0" cy="236" r="6.5" fill="#1f6b34"/><text x="362.0" y="260" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><circle cx="372.1" cy="236" r="1.6" fill="#ddd"/><circle cx="382.1" cy="250" r="3.6" fill="#b06a10"/><circle cx="392.2" cy="222" r="3.6" fill="#9b2c2c"/><circle cx="402.3" cy="250" r="3.6" fill="#b06a10"/><circle cx="412.3" cy="236" r="1.6" fill="#ddd"/><circle cx="422.4" cy="236" r="6.5" fill="#1f6b34"/><text x="422.4" y="260" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">6</text><circle cx="432.5" cy="236" r="1.6" fill="#ddd"/><circle cx="442.5" cy="250" r="3.6" fill="#b06a10"/><circle cx="452.6" cy="222" r="3.6" fill="#9b2c2c"/><circle cx="462.7" cy="250" r="3.6" fill="#b06a10"/><circle cx="472.7" cy="236" r="1.6" fill="#ddd"/><circle cx="482.8" cy="236" r="6.5" fill="#1f6b34"/><text x="482.8" y="260" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">12</text><circle cx="492.9" cy="236" r="1.6" fill="#ddd"/><circle cx="502.9" cy="250" r="3.6" fill="#b06a10"/><circle cx="513.0" cy="222" r="3.6" fill="#9b2c2c"/><circle cx="523.1" cy="250" r="3.6" fill="#b06a10"/><circle cx="533.1" cy="236" r="1.6" fill="#ddd"/><circle cx="543.2" cy="236" r="6.5" fill="#1f6b34"/><text x="543.2" y="260" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">18</text><circle cx="553.3" cy="236" r="1.6" fill="#ddd"/><circle cx="563.3" cy="250" r="3.6" fill="#b06a10"/><circle cx="573.4" cy="222" r="3.6" fill="#9b2c2c"/><circle cx="583.5" cy="250" r="3.6" fill="#b06a10"/><circle cx="593.5" cy="236" r="1.6" fill="#ddd"/><circle cx="603.6" cy="236" r="6.5" fill="#1f6b34"/><text x="603.6" y="260" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">24</text><circle cx="613.7" cy="236" r="1.6" fill="#ddd"/><circle cx="623.7" cy="250" r="3.6" fill="#b06a10"/><circle cx="633.8" cy="222" r="3.6" fill="#9b2c2c"/><circle cx="643.9" cy="250" r="3.6" fill="#b06a10"/><circle cx="653.9" cy="236" r="1.6" fill="#ddd"/><circle cx="664.0" cy="236" r="6.5" fill="#1f6b34"/><text x="664.0" y="260" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">30</text><text x="52" y="219" font-size="10" fill="#9b2c2c" text-anchor="end">3 | x</text><text x="52" y="257" font-size="10" fill="#b06a10" text-anchor="end">2 | x</text><text x="52" y="240" font-size="10" fill="#1f6b34" text-anchor="end">both</text>

  <circle cx="292" cy="404" r="84" fill="#fdecec" stroke="#9b2c2c" stroke-width="1.8" opacity="0.85"/><circle cx="428" cy="404" r="84" fill="#fdf0dc" stroke="#b06a10" stroke-width="1.8" opacity="0.8"/><text x="240" y="352" font-size="12" fill="#9b2c2c" font-weight="bold">S&#8323;</text><text x="468" y="352" font-size="12" fill="#b06a10" font-weight="bold">S&#8322;</text><text x="236" y="408" font-size="11" fill="#9b2c2c" text-anchor="middle">3, 9, 15,</text><text x="236" y="423" font-size="11" fill="#9b2c2c" text-anchor="middle">21, &#8230;</text><text x="484" y="408" font-size="11" fill="#b06a10" text-anchor="middle">2, 4, 8,</text><text x="484" y="423" font-size="11" fill="#b06a10" text-anchor="middle">10, &#8230;</text><text x="360.0" y="386" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">S&#8326;</text><text x="360.0" y="406" font-size="10" fill="#1f6b34" text-anchor="middle">0, 6,</text><text x="360.0" y="420" font-size="10" fill="#1f6b34" text-anchor="middle">12, &#8230;</text><text x="360" y="322" font-size="11.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">THE TRUTH SET IS THE OVERLAP</text><text x="360" y="512" font-size="11.5" fill="#333" text-anchor="middle">&#8220;and&#8221; in logic is intersection in set theory &#8212; and here the overlap is exactly the multiples of 6.</text>

  <rect x="18" y="552" width="684" height="126" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="572" font-size="11.5" fill="#1f6b34" font-weight="bold">WHY 6 AND NOT SOMETHING ELSE</text>
  <text x="40" y="594" font-size="11.5" fill="#333">If 3 | x and 2 | x then x is a common multiple of 3 and 2, hence a multiple of lcm(3, 2) = 6. Conversely</text>
  <text x="40" y="612" font-size="11.5" fill="#333">every multiple of 6 is divisible by both. So the two conditions are equivalent, not merely related.</text>
  <text x="40" y="638" font-size="11.5" fill="#333">The answer is 3 &#215; 2 only because gcd(3, 2) = 1. In general lcm(a, b) = ab / gcd(a, b), so for a = 4, b = 6 the</text>
  <text x="40" y="656" font-size="11.5" fill="#333">truth set is the multiples of 12, not of 24 &#8212; the product overshoots. Both cases checked directly.</text>

  <rect x="18" y="692" width="684" height="142" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="712" font-size="11.5" fill="#b06a10" font-weight="bold">CHANGE &#8220;AND&#8221; TO &#8220;OR&#8221; AND THE ANSWER LOSES ITS SHAPE</text>
  <text x="40" y="734" font-size="11.5" fill="#333">The truth set of &#8220;3 | x <tspan font-style="italic">or</tspan> 2 | x&#8221; is the <tspan font-weight="bold">union</tspan> S&#8323; &#8746; S&#8322;, whose non-negative members begin</text>
  <text x="40" y="756" font-size="12" fill="#b06a10">0, 2, 3, 4, 6, 8, 9, 10, 12, 14, 15, 16, 18, 20, &#8230;</text>
  <text x="40" y="780" font-size="11.5" fill="#333">This is not the set of multiples of any single number &#8212; it misses 1, 5, 7 but contains 2 and 3. Intersections</text>
  <text x="40" y="798" font-size="11.5" fill="#333">of divisibility conditions stay divisibility conditions; unions do not.</text>
  <text x="40" y="822" font-size="11" fill="#555" font-style="italic">The equivalence 3 | x and 2 | x &#8660; 6 | x was verified for every integer with |x| &lt; 100000.</text>
</svg>