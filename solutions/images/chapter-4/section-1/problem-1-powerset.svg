<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 870" width="720" height="870" font-family="Georgia, serif">
  <rect x="0" y="0.0" width="720" height="830" fill="#ffffff"/>

  <rect x="18" y="14.0" width="684" height="74" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE ANSWER</text>
  <text x="430" y="36.0" font-size="17" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8473;(&#8709;) = &#123; &#8709; &#125;</text>
  <text x="40" y="58.0" font-size="11.5" fill="#333">The power set of A is the set of all subsets of A. The only subset of &#8709; is &#8709; itself, so &#8473;(&#8709;) has exactly</text>
  <text x="40" y="75.0" font-size="11.5" fill="#333">one element &#8212; matching |&#8473;(A)| = 2^|A| = 2&#8304; = 1.</text>

  <text x="34" y="138.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE ONE THING TO GET RIGHT: &#8709; AND &#123;&#8709;&#125; ARE NOT THE SAME</text>
  <rect x="90" y="190.0" width="196" height="120" rx="8" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="2"/><text x="188.0" y="256.0" font-size="13" fill="#aaa" text-anchor="middle" font-style="italic">nothing inside</text><text x="188.0" y="164.0" font-size="17" fill="#9b2c2c" text-anchor="middle" font-weight="bold">&#8709;</text><text x="188.0" y="182.0" font-size="11" fill="#555" text-anchor="middle">a box with nothing in it &#8212; 0 elements</text><text x="360" y="256.0" font-size="22" fill="#3b5b9b" text-anchor="middle">&#8800;</text><rect x="430" y="190.0" width="196" height="120" rx="8" fill="#f1f8f2" stroke="#1f6b34" stroke-width="2"/><rect x="494.0" y="226.0" width="68" height="48" rx="6" fill="#ffffff" stroke="#1f6b34" stroke-width="1.8" stroke-dasharray="5 3"/><text x="528.0" y="255.0" font-size="12" fill="#1f6b34" text-anchor="middle" font-style="italic">empty</text><text x="528.0" y="164.0" font-size="17" fill="#1f6b34" text-anchor="middle" font-weight="bold">&#123; &#8709; &#125;</text><text x="528.0" y="182.0" font-size="11" fill="#555" text-anchor="middle">a box containing an empty box &#8212; 1 element</text>
  <text x="360" y="344.0" font-size="11.5" fill="#333" text-anchor="middle">An empty box is not the same object as a box with an empty box inside it.</text>

  <text x="60" y="364.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">FOUR STATEMENTS THAT LOOK ALIKE</text>
  <rect x="60" y="405.0" width="600" height="25" rx="3" fill="#eef2fa" stroke="#9fb2d4"/><text x="150" y="424.0" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">statement</text><text x="330" y="424.0" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">truth</text><text x="470" y="424.0" font-size="11.5" fill="#1f3a68" text-anchor="start" font-weight="bold">why</text><rect x="60" y="432.0" width="600" height="23" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.9"/><text x="150" y="450.0" font-size="12.5" fill="#333" text-anchor="middle">&#8709; = &#123;&#8709;&#125;</text><text x="330" y="450.0" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">false</text><text x="470" y="450.0" font-size="11" fill="#555">the left box is empty, the right is not</text><rect x="60" y="457.0" width="600" height="23" rx="3" fill="#f1f8f2" stroke="#1f6b34" stroke-width="0.9"/><text x="150" y="475.0" font-size="12.5" fill="#333" text-anchor="middle">&#8709; &#8712; &#123;&#8709;&#125;</text><text x="330" y="475.0" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">true</text><text x="470" y="475.0" font-size="11" fill="#555">the empty set is the one element listed</text><rect x="60" y="482.0" width="600" height="23" rx="3" fill="#f1f8f2" stroke="#1f6b34" stroke-width="0.9"/><text x="150" y="500.0" font-size="12.5" fill="#333" text-anchor="middle">&#8709; &#8838; &#123;&#8709;&#125;</text><text x="330" y="500.0" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">true</text><text x="470" y="500.0" font-size="11" fill="#555">vacuously &#8212; &#8709; has no element to escape</text><rect x="60" y="507.0" width="600" height="23" rx="3" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="0.9"/><text x="150" y="525.0" font-size="12.5" fill="#333" text-anchor="middle">&#123;&#8709;&#125; &#8712; &#123;&#8709;&#125;</text><text x="330" y="525.0" font-size="11.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">false</text><text x="470" y="525.0" font-size="11" fill="#555">the only element is &#8709;, not &#123;&#8709;&#125;</text>

  <text x="34" y="600.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">ITERATING THE OPERATOR &#8212; the cardinalities explode</text><rect x="48" y="624.0" width="90" height="52" rx="5" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.4"/><text x="93.0" y="644.0" font-size="12" fill="#9b2c2c" text-anchor="middle" font-weight="bold">&#8709;</text><text x="93.0" y="664.0" font-size="12.5" fill="#333" text-anchor="middle">0</text><text x="144" y="655.0" font-size="13" fill="#999" text-anchor="middle">&#8594;</text><rect x="152" y="624.0" width="90" height="52" rx="5" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.4"/><text x="197.0" y="644.0" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">&#8473;(&#8709;)</text><text x="197.0" y="664.0" font-size="12.5" fill="#333" text-anchor="middle">1</text><text x="248" y="655.0" font-size="13" fill="#999" text-anchor="middle">&#8594;</text><rect x="256" y="624.0" width="90" height="52" rx="5" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.4"/><text x="301.0" y="644.0" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">&#8473;&#178;(&#8709;)</text><text x="301.0" y="664.0" font-size="12.5" fill="#333" text-anchor="middle">2</text><text x="352" y="655.0" font-size="13" fill="#999" text-anchor="middle">&#8594;</text><rect x="360" y="624.0" width="90" height="52" rx="5" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.4"/><text x="405.0" y="644.0" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">&#8473;&#179;(&#8709;)</text><text x="405.0" y="664.0" font-size="12.5" fill="#333" text-anchor="middle">4</text><text x="456" y="655.0" font-size="13" fill="#999" text-anchor="middle">&#8594;</text><rect x="464" y="624.0" width="90" height="52" rx="5" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.4"/><text x="509.0" y="644.0" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">&#8473;&#8308;(&#8709;)</text><text x="509.0" y="664.0" font-size="12.5" fill="#333" text-anchor="middle">16</text><text x="560" y="655.0" font-size="13" fill="#999" text-anchor="middle">&#8594;</text><rect x="568" y="624.0" width="90" height="52" rx="5" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.4"/><text x="613.0" y="644.0" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">&#8473;&#8309;(&#8709;)</text><text x="613.0" y="664.0" font-size="12.5" fill="#333" text-anchor="middle">65536</text><text x="34" y="698.0" font-size="11" fill="#555">Each step doubles the exponent: 0, 1, 2, 4, 16, 65536 &#8212; the next value has 19729 digits.</text>

  <rect x="18" y="736.0" width="684" height="118" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="756.0" font-size="11.5" fill="#b06a10" font-weight="bold">WHY THIS IS NOT A TRICK QUESTION</text>
  <text x="40" y="778.0" font-size="11.5" fill="#333">Every set A has at least two subsets listed in &#8473;(A): the empty set and A itself. When A = &#8709; these</text>
  <text x="40" y="796.0" font-size="11.5" fill="#333">coincide, so the list has one entry rather than two &#8212; the only case where that happens.</text>
  <text x="40" y="822.0" font-size="11.5" fill="#333">Checked: for A = &#8709;, &#123;1&#125;, &#123;1,2&#125;, &#123;1,2,3&#125; the power set has 1, 2, 4, 8 elements and always contains both</text>
  <text x="40" y="840.0" font-size="11.5" fill="#333">&#8709; and A.</text>
</svg>