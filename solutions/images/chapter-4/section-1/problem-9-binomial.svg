<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" width="720" height="880" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="880" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="82" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE ANSWER</text>
  <text x="400" y="44" font-size="17" fill="#1f6b34" text-anchor="middle" font-weight="bold">C(16, 8) = 12&#8201;870</text>
  <text x="400" y="68" font-size="11.5" fill="#333" text-anchor="middle">Choose 8 of the 16 letters; order does not matter, so divide the 16&#183;15&#183;&#8943;&#183;9 ordered choices</text>
  <text x="400" y="85" font-size="11.5" fill="#333" text-anchor="middle">by the 8! rearrangements that give the same subset.</text>

  <text x="56" y="192" font-size="11.5" fill="#3b5b9b" font-weight="bold">ROW 16 OF PASCAL&#8217;S TRIANGLE &#8212; the answer is the tallest bar</text>
  <rect x="57.5" y="356.0" width="32.8" height="0.0" fill="#9fb2d4" rx="2"/><text x="73.9" y="369" font-size="8.5" fill="#666" text-anchor="middle">0</text><text x="73.9" y="351.0" font-size="8.5" fill="#666" text-anchor="middle" font-weight="normal">1</text><rect x="93.3" y="355.8" width="32.8" height="0.2" fill="#9fb2d4" rx="2"/><text x="109.6" y="369" font-size="8.5" fill="#666" text-anchor="middle">1</text><rect x="129.0" y="354.6" width="32.8" height="1.4" fill="#9fb2d4" rx="2"/><text x="145.4" y="369" font-size="8.5" fill="#666" text-anchor="middle">2</text><rect x="164.8" y="349.6" width="32.8" height="6.4" fill="#9fb2d4" rx="2"/><text x="181.2" y="369" font-size="8.5" fill="#666" text-anchor="middle">3</text><rect x="200.6" y="335.1" width="32.8" height="20.9" fill="#9fb2d4" rx="2"/><text x="216.9" y="369" font-size="8.5" fill="#666" text-anchor="middle">4</text><text x="216.9" y="330.1" font-size="8.5" fill="#666" text-anchor="middle" font-weight="normal">1820</text><rect x="236.3" y="305.8" width="32.8" height="50.2" fill="#9fb2d4" rx="2"/><text x="252.7" y="369" font-size="8.5" fill="#666" text-anchor="middle">5</text><rect x="272.1" y="263.9" width="32.8" height="92.1" fill="#9fb2d4" rx="2"/><text x="288.5" y="369" font-size="8.5" fill="#666" text-anchor="middle">6</text><rect x="307.9" y="224.4" width="32.8" height="131.6" fill="#9fb2d4" rx="2"/><text x="324.2" y="369" font-size="8.5" fill="#666" text-anchor="middle">7</text><rect x="343.6" y="208.0" width="32.8" height="148.0" fill="#1f6b34" rx="2"/><text x="360.0" y="369" font-size="8.5" fill="#666" text-anchor="middle">8</text><text x="360.0" y="203.0" font-size="8.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">12870</text><rect x="379.4" y="224.4" width="32.8" height="131.6" fill="#9fb2d4" rx="2"/><text x="395.8" y="369" font-size="8.5" fill="#666" text-anchor="middle">9</text><rect x="415.1" y="263.9" width="32.8" height="92.1" fill="#9fb2d4" rx="2"/><text x="431.5" y="369" font-size="8.5" fill="#666" text-anchor="middle">10</text><rect x="450.9" y="305.8" width="32.8" height="50.2" fill="#9fb2d4" rx="2"/><text x="467.3" y="369" font-size="8.5" fill="#666" text-anchor="middle">11</text><rect x="486.7" y="335.1" width="32.8" height="20.9" fill="#9fb2d4" rx="2"/><text x="503.1" y="369" font-size="8.5" fill="#666" text-anchor="middle">12</text><text x="503.1" y="330.1" font-size="8.5" fill="#666" text-anchor="middle" font-weight="normal">1820</text><rect x="522.4" y="349.6" width="32.8" height="6.4" fill="#9fb2d4" rx="2"/><text x="538.8" y="369" font-size="8.5" fill="#666" text-anchor="middle">13</text><rect x="558.2" y="354.6" width="32.8" height="1.4" fill="#9fb2d4" rx="2"/><text x="574.6" y="369" font-size="8.5" fill="#666" text-anchor="middle">14</text><rect x="594.0" y="355.8" width="32.8" height="0.2" fill="#9fb2d4" rx="2"/><text x="610.4" y="369" font-size="8.5" fill="#666" text-anchor="middle">15</text><rect x="629.7" y="356.0" width="32.8" height="0.0" fill="#9fb2d4" rx="2"/><text x="646.1" y="369" font-size="8.5" fill="#666" text-anchor="middle">16</text><text x="646.1" y="351.0" font-size="8.5" fill="#666" text-anchor="middle" font-weight="normal">1</text><line x1="56" y1="356" x2="664" y2="356" stroke="#999" stroke-width="1"/><text x="360.0" y="386" font-size="10.5" fill="#555" text-anchor="middle">subset size k</text>

  <text x="60" y="410" font-size="11.5" fill="#3b5b9b" font-weight="bold">CLIMBING TO THE MIDDLE</text>
  <text x="660" y="410" font-size="10.5" fill="#555" text-anchor="end" font-style="italic">each entry is the last times (16&#8722;k)/(k+1)</text>
  <rect x="60" y="429" width="600" height="25" rx="3" fill="#eef2fa" stroke="#9fb2d4"/><text x="150" y="448" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">k</text><text x="290" y="448" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">C(16, k)</text><text x="430" y="448" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">step factor (16&#8722;k)/(k+1)</text><text x="570" y="448" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">growing?</text><rect x="60" y="456" width="600" height="23" rx="3" fill="#fbfcfe" stroke="#e3e8f2" stroke-width="0.8"/><text x="150" y="474" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">5</text><text x="290" y="474" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">4&#8201;368</text><text x="430" y="474" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">1.833</text><text x="570" y="474" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">yes</text><rect x="60" y="481" width="600" height="23" rx="3" fill="#fbfcfe" stroke="#e3e8f2" stroke-width="0.8"/><text x="150" y="499" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">6</text><text x="290" y="499" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">8&#8201;008</text><text x="430" y="499" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">1.429</text><text x="570" y="499" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">yes</text><rect x="60" y="506" width="600" height="23" rx="3" fill="#fbfcfe" stroke="#e3e8f2" stroke-width="0.8"/><text x="150" y="524" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">7</text><text x="290" y="524" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">11&#8201;440</text><text x="430" y="524" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">1.125</text><text x="570" y="524" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">yes</text><rect x="60" y="531" width="600" height="23" rx="3" fill="#f1f8f2" stroke="#1f6b34" stroke-width="2.1"/><text x="150" y="549" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">8</text><text x="290" y="549" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">12&#8201;870</text><text x="430" y="549" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">0.889</text><text x="570" y="549" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">no &#8212; peak passed</text>

  <rect x="18" y="600" width="684" height="132" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="620" font-size="11.5" fill="#1f6b34" font-weight="bold">WHY THE MIDDLE IS THE PEAK</text>
  <text x="40" y="642" font-size="11.5" fill="#333">Consecutive entries are related by C(16, k+1) = C(16, k) &#215; (16 &#8722; k)/(k + 1). That factor exceeds 1 while</text>
  <text x="40" y="660" font-size="11.5" fill="#333">k &lt; 7.5 and drops below 1 afterwards, so the row rises to k = 8 and then falls.</text>
  <text x="40" y="686" font-size="11.5" fill="#333">The row is also symmetric, C(16, k) = C(16, 16 &#8722; k), because complementation matches each k-element</text>
  <text x="40" y="704" font-size="11.5" fill="#333">subset with a unique one of size 16 &#8722; k. A symmetric sequence with a single peak peaks in the middle.</text>
  <text x="40" y="724" font-size="10.5" fill="#555" font-style="italic">Every entry of the row was computed directly; the row is symmetric and sums to 65&#8201;536.</text>

  <rect x="18" y="746" width="684" height="118" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="766" font-size="11.5" fill="#b06a10" font-weight="bold">HOW BIG A SHARE IS IT?</text>
  <text x="40" y="788" font-size="11.5" fill="#333">The full power set has 2&#185;&#8310; = 65&#8201;536 elements, so the 8-element subsets are</text>
  <text x="360" y="814" font-size="13.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">12&#8201;870 / 65&#8201;536 &#8776; 19.6%</text>
  <text x="40" y="840" font-size="11.5" fill="#333">The single most populous size, yet still under a fifth &#8212; the other sixteen sizes share the remaining 80%.</text>
</svg>