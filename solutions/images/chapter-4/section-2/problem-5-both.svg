<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 826" width="720" height="826" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="826" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="76" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE ANSWER</text>
  <text x="400" y="56" font-size="16" fill="#1f3a68" text-anchor="middle" font-weight="bold">A = &#8709;,&#160;&#160;&#160; B = &#123;&#8709;&#125;</text>
  <text x="400" y="78" font-size="11.5" fill="#333" text-anchor="middle">Both A &#8712; B and A &#8838; B hold &#8212; and the two hold for entirely unrelated reasons.</text>

  <rect x="60" y="192" width="250" height="132" rx="9" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="2"/><text x="185.0" y="178" font-size="14" fill="#9b2c2c" text-anchor="middle" font-weight="bold">A = &#8709;</text><text x="185.0" y="263.0" font-size="12" fill="#c58" text-anchor="middle" font-style="italic">no elements</text><rect x="410" y="192" width="250" height="132" rx="9" fill="#f1f8f2" stroke="#1f6b34" stroke-width="2"/><text x="535.0" y="178" font-size="14" fill="#1f6b34" text-anchor="middle" font-weight="bold">B = &#123;&#8709;&#125;</text><rect x="483.0" y="228.0" width="104" height="60" rx="7" fill="#ffffff" stroke="#9b2c2c" stroke-width="1.8" stroke-dasharray="5 3"/><text x="535.0" y="263.0" font-size="12.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">&#8709;</text><text x="535.0" y="310" font-size="10" fill="#1f6b34" text-anchor="middle" font-style="italic">one element, and it is A</text><text x="345" y="238" font-size="15" fill="#1f6b34" text-anchor="middle" font-weight="bold">&#8712;</text><text x="345" y="288" font-size="15" fill="#3b5b9b" text-anchor="middle" font-weight="bold">&#8838;</text><text x="345" y="254" font-size="9" fill="#666" text-anchor="middle">A is listed</text><text x="345" y="304" font-size="9" fill="#666" text-anchor="middle">vacuously</text>
  <text x="40" y="394" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE TWO CHECKS ARE PASSED FOR COMPLETELY DIFFERENT REASONS</text><rect x="26" y="408" width="326" height="92" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.6"/><text x="189.0" y="432" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">A &#8712; B&#160; &#8212; because A is listed</text><text x="39" y="456" font-size="10.8" fill="#333">B has exactly one element, written between</text><text x="39" y="474" font-size="10.8" fill="#333">its braces, and that element is &#8709; &#8212; which is A.</text><rect x="368" y="408" width="326" height="92" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.6"/><text x="531.0" y="432" font-size="12" fill="#3b5b9b" text-anchor="middle" font-weight="bold">A &#8838; B&#160; &#8212; vacuously</text><text x="381" y="456" font-size="10.8" fill="#333">Every element of A must lie in B. A has no</text><text x="381" y="474" font-size="10.8" fill="#333">elements, so there is nothing to check.</text>

  <rect x="18" y="540" width="684" height="138" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="560" font-size="11.5" fill="#b06a10" font-weight="bold">A RECIPE THAT WORKS FOR <tspan font-style="italic">ANY</tspan> SET A</text>
  <text x="360" y="588" font-size="15" fill="#1f3a68" text-anchor="middle" font-weight="bold">B = A &#8746; &#123;A&#125;</text>
  <text x="40" y="614" font-size="11.5" fill="#333">A &#8712; B because A was thrown in as an element; A &#8838; B because every element of A is still there.</text>
  <text x="40" y="638" font-size="11.5" fill="#333">Examples:&#160;&#160; A = &#123;1, 2&#125; gives B = &#123;1, 2, &#123;1, 2&#125;&#125;;&#160;&#160; A = &#8709; gives B = &#123;&#8709;&#125;, the answer above.</text>
  <text x="40" y="664" font-size="11" fill="#555" font-style="italic">Both conditions checked for five different A. This map A &#8614; A &#8746; &#123;A&#125; is the von Neumann successor.</text>

  <rect x="18" y="692" width="684" height="118" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.2"/>
  <text x="34" y="712" font-size="11.5" fill="#3b5b9b" font-weight="bold">TWO THINGS THAT ARE FORCED</text>
  <text x="40" y="734" font-size="11.5" fill="#333"><tspan font-weight="bold">B is strictly bigger.</tspan>&#160; A &#8838; B supplies all of A&#8217;s elements and A &#8712; B supplies one more, so |B| &#8805; |A| + 1.</text>
  <text x="40" y="758" font-size="11.5" fill="#333"><tspan font-weight="bold">A and B cannot be equal.</tspan>&#160; A = B would make A &#8712; A, which the axiom of foundation forbids.</text>
  <text x="40" y="786" font-size="11.5" fill="#333">So every valid pair has A as a <tspan font-style="italic">proper</tspan> subset of B, and the recipe above is as tight as possible.</text>
</svg>