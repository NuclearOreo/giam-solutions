<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 844" width="720" height="844" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="844" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="98" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE TWO TESTS</text>
  <text x="40" y="56" font-size="12" fill="#333"><tspan font-weight="bold" fill="#1f6b34">L &#8712; R</tspan>&#160;&#160; &#8212; is L itself one of the things listed inside R?</text>
  <text x="40" y="78" font-size="12" fill="#333"><tspan font-weight="bold" fill="#9b2c2c">L &#8838; R</tspan>&#160;&#160; &#8212; is every element of L one of the things listed inside R?</text>
  <text x="40" y="99" font-size="10.5" fill="#555" font-style="italic">The first asks about L as a single object; the second opens L up and asks about its contents.</text>

  <text x="26" y="198" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE FOUR BLANKS</text>
  <rect x="26" y="214" width="326" height="124" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.6"/><text x="39" y="236" font-size="11" fill="#1f6b34" font-weight="bold">i)</text><text x="189.0" y="262" font-size="13.5" fill="#333" text-anchor="middle">1&#160;&#160;<tspan fill="#1f6b34" font-size="17" font-weight="bold">&#8712;</tspan>&#160;&#160;&#123;3, 2, 1, &#123;a, b&#125;&#125;</text><text x="39" y="286" font-size="10.6" fill="#555">1 is one of the four things listed.</text><text x="39" y="303" font-size="10.6" fill="#555">It is not a set, so &#8838; cannot even apply.</text><rect x="368" y="214" width="326" height="124" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.6"/><text x="381" y="236" font-size="11" fill="#1f6b34" font-weight="bold">iii)</text><text x="531.0" y="262" font-size="13.5" fill="#333" text-anchor="middle">&#123;a, b&#125;&#160;&#160;<tspan fill="#1f6b34" font-size="17" font-weight="bold">&#8712;</tspan>&#160;&#160;&#123;3, 2, 1, &#123;a, b&#125;&#125;</text><text x="381" y="286" font-size="10.6" fill="#555">&#123;a,b&#125; is listed as the fourth element.</text><text x="381" y="303" font-size="10.6" fill="#555">Not &#8838;: a and b are not themselves listed.</text><rect x="26" y="360" width="326" height="124" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.6"/><text x="39" y="382" font-size="11" fill="#9b2c2c" font-weight="bold">ii)</text><text x="189.0" y="408" font-size="13.5" fill="#333" text-anchor="middle">&#123;a&#125;&#160;&#160;<tspan fill="#9b2c2c" font-size="17" font-weight="bold">&#8838;</tspan>&#160;&#160;&#123;a, &#123;a, b&#125;&#125;</text><text x="39" y="432" font-size="10.6" fill="#555">Its only element a <tspan font-style='italic'>is</tspan> in the right side.</text><text x="39" y="449" font-size="10.6" fill="#555">Not &#8712;: the elements are a and &#123;a,b&#125;, not &#123;a&#125;.</text><rect x="368" y="360" width="326" height="124" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.6"/><text x="381" y="382" font-size="11" fill="#9b2c2c" font-weight="bold">iv)</text><text x="531.0" y="408" font-size="13.5" fill="#333" text-anchor="middle">&#123;&#123;a, b&#125;&#125;&#160;&#160;<tspan fill="#9b2c2c" font-size="17" font-weight="bold">&#8838;</tspan>&#160;&#160;&#123;a, &#123;a, b&#125;&#125;</text><text x="381" y="432" font-size="10.6" fill="#555">Its only element &#123;a,b&#125; is in the right side.</text><text x="381" y="449" font-size="10.6" fill="#555">Not &#8712;: &#123;&#123;a,b&#125;&#125; itself is not listed.</text>

  <text x="60" y="504" font-size="11.5" fill="#3b5b9b" font-weight="bold">BOTH TESTS RUN ON ALL FOUR &#8212; exactly one passes each time</text>
  <rect x="60" y="523" width="600" height="25" rx="3" fill="#eef2fa" stroke="#9fb2d4"/><text x="130" y="542" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold"></text><text x="270" y="542" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">left side</text><text x="400" y="542" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">right side</text><text x="520" y="542" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8712; ?</text><text x="620" y="542" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8838; ?</text><rect x="60" y="550" width="600" height="23" rx="3" fill="#fbfcfe" stroke="#e3e8f2"/><text x="130" y="568" font-size="11.5" fill="#666" text-anchor="middle" font-weight="normal">i)</text><text x="270" y="568" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">1</text><text x="400" y="568" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">&#123;3,2,1,&#123;a,b&#125;&#125;</text><text x="520" y="568" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><text x="620" y="568" font-size="11.5" fill="#bbb" text-anchor="middle" font-weight="normal">no</text><rect x="60" y="575" width="600" height="23" rx="3" fill="#fbfcfe" stroke="#e3e8f2"/><text x="130" y="593" font-size="11.5" fill="#666" text-anchor="middle" font-weight="normal">ii)</text><text x="270" y="593" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">&#123;a&#125;</text><text x="400" y="593" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">&#123;a,&#123;a,b&#125;&#125;</text><text x="520" y="593" font-size="11.5" fill="#bbb" text-anchor="middle" font-weight="normal">no</text><text x="620" y="593" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><rect x="60" y="600" width="600" height="23" rx="3" fill="#fbfcfe" stroke="#e3e8f2"/><text x="130" y="618" font-size="11.5" fill="#666" text-anchor="middle" font-weight="normal">iii)</text><text x="270" y="618" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">&#123;a,b&#125;</text><text x="400" y="618" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">&#123;3,2,1,&#123;a,b&#125;&#125;</text><text x="520" y="618" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text><text x="620" y="618" font-size="11.5" fill="#bbb" text-anchor="middle" font-weight="normal">no</text><rect x="60" y="625" width="600" height="23" rx="3" fill="#fbfcfe" stroke="#e3e8f2"/><text x="130" y="643" font-size="11.5" fill="#666" text-anchor="middle" font-weight="normal">iv)</text><text x="270" y="643" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">&#123;&#123;a,b&#125;&#125;</text><text x="400" y="643" font-size="11.5" fill="#333" text-anchor="middle" font-weight="normal">&#123;a,&#123;a,b&#125;&#125;</text><text x="520" y="643" font-size="11.5" fill="#bbb" text-anchor="middle" font-weight="normal">no</text><text x="620" y="643" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">yes</text>

  <rect x="18" y="694" width="684" height="134" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="714" font-size="11.5" fill="#b06a10" font-weight="bold">THE PATTERN IN THE FOUR ANSWERS</text>
  <text x="40" y="738" font-size="11.5" fill="#333">Compare (iii) and (iv). The right sides differ, but so does the <tspan font-style="italic">number of braces</tspan> on the left:</text>
  <text x="70" y="762" font-size="12.5" fill="#1f6b34">&#123;a, b&#125; &#8712; &#123;3, 2, 1, &#123;a, b&#125;&#125;</text>
  <text x="380" y="762" font-size="12.5" fill="#9b2c2c">&#123;&#123;a, b&#125;&#125; &#8838; &#123;a, &#123;a, b&#125;&#125;</text>
  <text x="40" y="786" font-size="11.5" fill="#333">Wrapping an object in one more pair of braces turns an &#8712; statement into a &#8838; statement, because the</text>
  <text x="40" y="804" font-size="11.5" fill="#333">extra layer is exactly what &#8838; strips off before comparing.</text>
  <text x="40" y="822" font-size="10.5" fill="#555" font-style="italic">All eight membership and subset tests were evaluated directly.</text>
</svg>