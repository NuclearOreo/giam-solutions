<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 870" width="720" height="870" font-family="Georgia, serif">
  <defs><marker id="aa" markerWidth="8" markerHeight="8" refX="6.5" refY="2.9" orient="auto"><path d="M0,0 L6.5,2.9 L0,5.8 z" fill="#8fa3c8"/></marker></defs>
  <rect x="0" y="0.0" width="720" height="850" fill="#ffffff"/>

  <rect x="18" y="14.0" width="684" height="92" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE COUNTEREXAMPLE</text>
  <text x="400" y="56.0" font-size="15" fill="#1f3a68" text-anchor="middle" font-weight="bold">E = &#123;2, 4, 6, &#8230;&#125; &#8842; &#8484;&#8314;,&#160;&#160;&#160; yet |E| = |&#8484;&#8314;|</text>
  <text x="400" y="80.0" font-size="11.5" fill="#333" text-anchor="middle">A proper subset, missing infinitely many numbers &#8212; and still exactly as large.</text>
  <text x="400" y="98.0" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">the bijection n &#8614; 2n was checked on 1 through 5000 in both directions</text>

  <text x="40" y="176.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE PAIRING n &#8614; 2n LEAVES NOTHING OVER ON EITHER SIDE</text><text x="40" y="211.0" font-size="11.5" fill="#1f3a68" font-weight="bold">&#8484;&#8314;</text><text x="40" y="307.0" font-size="11.5" fill="#1f6b34" font-weight="bold">E</text><circle cx="108" cy="206" r="17" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.5"/><text x="108" y="211.0" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">1</text><circle cx="108" cy="302" r="17" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.5"/><text x="108" y="307.0" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">2</text><line x1="108" y1="224.0" x2="108" y2="283.0" stroke="#8fa3c8" stroke-width="1.4" marker-end="url(#aa)"/><circle cx="184" cy="206" r="17" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.5"/><text x="184" y="211.0" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">2</text><circle cx="184" cy="302" r="17" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.5"/><text x="184" y="307.0" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">4</text><line x1="184" y1="224.0" x2="184" y2="283.0" stroke="#8fa3c8" stroke-width="1.4" marker-end="url(#aa)"/><circle cx="260" cy="206" r="17" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.5"/><text x="260" y="211.0" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">3</text><circle cx="260" cy="302" r="17" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.5"/><text x="260" y="307.0" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">6</text><line x1="260" y1="224.0" x2="260" y2="283.0" stroke="#8fa3c8" stroke-width="1.4" marker-end="url(#aa)"/><circle cx="336" cy="206" r="17" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.5"/><text x="336" y="211.0" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">4</text><circle cx="336" cy="302" r="17" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.5"/><text x="336" y="307.0" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">8</text><line x1="336" y1="224.0" x2="336" y2="283.0" stroke="#8fa3c8" stroke-width="1.4" marker-end="url(#aa)"/><circle cx="412" cy="206" r="17" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.5"/><text x="412" y="211.0" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">5</text><circle cx="412" cy="302" r="17" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.5"/><text x="412" y="307.0" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">10</text><line x1="412" y1="224.0" x2="412" y2="283.0" stroke="#8fa3c8" stroke-width="1.4" marker-end="url(#aa)"/><circle cx="488" cy="206" r="17" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.5"/><text x="488" y="211.0" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">6</text><circle cx="488" cy="302" r="17" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.5"/><text x="488" y="307.0" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">12</text><line x1="488" y1="224.0" x2="488" y2="283.0" stroke="#8fa3c8" stroke-width="1.4" marker-end="url(#aa)"/><circle cx="564" cy="206" r="17" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.5"/><text x="564" y="211.0" font-size="12.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">7</text><circle cx="564" cy="302" r="17" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.5"/><text x="564" y="307.0" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">14</text><line x1="564" y1="224.0" x2="564" y2="283.0" stroke="#8fa3c8" stroke-width="1.4" marker-end="url(#aa)"/><text x="640" y="211.0" font-size="14" fill="#999" text-anchor="middle">&#8943;</text><text x="640" y="307.0" font-size="14" fill="#999" text-anchor="middle">&#8943;</text><text x="40" y="350.0" font-size="11" fill="#9b2c2c">E omits every odd number &#8212; 1, 3, 5, &#8230; &#8212; so E &#8842; &#8484;&#8314; is a <tspan font-weight="bold">proper</tspan> subset.</text><text x="40" y="368.0" font-size="11" fill="#1f6b34">Yet the pairing above uses each side exactly once, so the two sets are the same size.</text>
  <rect x="26" y="438.0" width="326" height="136" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.6"/><text x="189.0" y="460.0" font-size="12" fill="#3b5b9b" text-anchor="middle" font-weight="bold">FINITE SETS &#8212; the claim is TRUE</text><text x="39" y="484.0" font-size="10.8" fill="#333">If T &#8842; S and S is finite, then |T| &lt; |S|.</text><text x="39" y="502.0" font-size="10.8" fill="#333"></text><text x="39" y="520.0" font-size="10.8" fill="#333">Checked on every proper subset of every</text><text x="39" y="538.0" font-size="10.8" fill="#333">set of size 0 through 7.</text><text x="39" y="556.0" font-size="10.8" fill="#333">No finite counterexample exists.</text><rect x="368" y="438.0" width="326" height="136" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.6"/><text x="531.0" y="460.0" font-size="12" fill="#9b2c2c" text-anchor="middle" font-weight="bold">INFINITE SETS &#8212; the claim FAILS</text><text x="381" y="484.0" font-size="10.8" fill="#333">E &#8842; &#8484;&#8314; yet |E| = |&#8484;&#8314;|.</text><text x="381" y="502.0" font-size="10.8" fill="#333"></text><text x="381" y="520.0" font-size="10.8" fill="#333">In fact this <tspan font-style='italic'>characterises</tspan> infinity:</text><text x="381" y="538.0" font-size="10.8" fill="#333">a set is infinite exactly when it matches</text><text x="381" y="556.0" font-size="10.8" fill="#333">one of its own proper subsets.</text>

  <rect x="18" y="582.0" width="684" height="126" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="602.0" font-size="11.5" fill="#1f6b34" font-weight="bold">THERE IS ALSO A CHEAPER ANSWER</text>
  <text x="40" y="624.0" font-size="11.5" fill="#333">Every set is a subset of itself, so &#123;1, 2, 3&#125; &#8838; &#123;1, 2, 3&#125; already refutes the claim as stated &#8212;</text>
  <text x="40" y="642.0" font-size="11.5" fill="#333">three elements, not fewer than three.</text>
  <text x="40" y="668.0" font-size="11.5" fill="#333">But that only exploits the word &#8220;subset&#8221; rather than &#8220;proper subset&#8221;. The infinite example survives</text>
  <text x="40" y="686.0" font-size="11.5" fill="#333">the repair, which is why it is the better answer.</text>

  <rect x="18" y="742.0" width="684" height="112" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="762.0" font-size="11.5" fill="#b06a10" font-weight="bold">THE PREVIOUS PROBLEM IS FULL OF EXAMPLES</text>
  <text x="40" y="784.0" font-size="11.5" fill="#333">The chain P&#8321; &#8842; P&#8322; &#8842; P&#8323; &#8842; &#8943; of Problem 2 is strictly decreasing at every step, yet <tspan font-style="italic">every</tspan> set in it</text>
  <text x="40" y="802.0" font-size="11.5" fill="#333">has the same cardinality &#8212; the map x &#8614; x/p&#8319; sends P&#8345; bijectively onto &#8484;&#8314;. Checked for n = 1, &#8230;, 4.</text>
  <text x="40" y="830.0" font-size="11.5" fill="#333">An infinite descending chain of sets, all the same size.</text>
</svg>