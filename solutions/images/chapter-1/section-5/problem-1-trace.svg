<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="500" fill="white"/>

  <text x="360" y="28" font-size="13" font-style="italic" fill="#444" text-anchor="middle">Tracing Division with n = 27, d = 5: each "Let …" is one assignment. There are 12 of them.</text>

  <!-- column headers -->
  <g font-size="12" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="70"  y="60">#</text>
    <text x="240" y="60">assignment</text>
    <text x="430" y="60">q</text>
    <text x="500" y="60">r</text>
    <text x="610" y="60">test  r &lt; 5 ?</text>
  </g>
  <line x1="40" y1="68" x2="680" y2="68" stroke="#999" stroke-width="0.8"/>

  <!-- rows: setup (2), then 5 iteration-pairs. y start 92, step 30 -->
  <g font-size="13" text-anchor="middle">
    <!-- setup, light grey band -->
    <rect x="40" y="76" width="640" height="60" fill="#f2f2f2"/>
    <text x="70" y="96">1</text><text x="240" y="96" text-anchor="middle">Let q = 0</text><text x="430" y="96">0</text><text x="500" y="96" fill="#aaa">—</text>
    <text x="70" y="126">2</text><text x="240" y="126" text-anchor="middle">Let r = 27</text><text x="430" y="126">0</text><text x="500" y="126">27</text><text x="610" y="126" fill="#c06a16">27 &lt; 5? No → loop</text>

    <!-- iteration 1 -->
    <text x="70" y="156">3</text><text x="240" y="156">Let q = q+1  → 1</text><text x="430" y="156">1</text><text x="500" y="156">27</text>
    <text x="70" y="186">4</text><text x="240" y="186">Let r = r−5  → 22</text><text x="430" y="186">1</text><text x="500" y="186">22</text><text x="610" y="186" fill="#c06a16">22 &lt; 5? No → loop</text>

    <!-- iteration 2 -->
    <rect x="40" y="196" width="640" height="60" fill="#f7f7f7"/>
    <text x="70" y="216">5</text><text x="240" y="216">Let q = q+1  → 2</text><text x="430" y="216">2</text><text x="500" y="216">22</text>
    <text x="70" y="246">6</text><text x="240" y="246">Let r = r−5  → 17</text><text x="430" y="246">2</text><text x="500" y="246">17</text><text x="610" y="246" fill="#c06a16">17 &lt; 5? No → loop</text>

    <!-- iteration 3 -->
    <text x="70" y="276">7</text><text x="240" y="276">Let q = q+1  → 3</text><text x="430" y="276">3</text><text x="500" y="276">17</text>
    <text x="70" y="306">8</text><text x="240" y="306">Let r = r−5  → 12</text><text x="430" y="306">3</text><text x="500" y="306">12</text><text x="610" y="306" fill="#c06a16">12 &lt; 5? No → loop</text>

    <!-- iteration 4 -->
    <rect x="40" y="316" width="640" height="60" fill="#f7f7f7"/>
    <text x="70" y="336">9</text><text x="240" y="336">Let q = q+1  → 4</text><text x="430" y="336">4</text><text x="500" y="336">12</text>
    <text x="70" y="366">10</text><text x="240" y="366">Let r = r−5  → 7</text><text x="430" y="366">4</text><text x="500" y="366">7</text><text x="610" y="366" fill="#c06a16">7 &lt; 5? No → loop</text>

    <!-- iteration 5 -->
    <text x="70" y="396">11</text><text x="240" y="396">Let q = q+1  → 5</text><text x="430" y="396">5</text><text x="500" y="396">7</text>
    <rect x="40" y="406" width="640" height="30" fill="#dff0df"/>
    <text x="70" y="426">12</text><text x="240" y="426">Let r = r−5  → 2</text><text x="430" y="426">5</text><text x="500" y="426">2</text><text x="610" y="426" fill="#2e7d32" font-weight="bold">2 &lt; 5? Yes → return</text>
  </g>
  <line x1="40" y1="442" x2="680" y2="442" stroke="#999" stroke-width="0.8"/>

  <!-- result -->
  <text x="360" y="470" font-size="14" fill="#222" text-anchor="middle"><tspan font-weight="bold">12 assignments.</tspan>   Return q = 5, r = 2:   27 = 5·5 + 2.</text>
  <text x="360" y="490" font-size="11" font-style="italic" fill="#666" text-anchor="middle">count = 2 (setup) + 5 iterations × 2 = 2 + 2·⌊27/5⌋ = 12.</text>
</svg>
