<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="470" fill="white"/>

  <text x="350" y="28" font-size="13.5" font-style="italic" fill="#444" text-anchor="middle">f(x) = x² (mod 7).  Several inputs collapse to the same output — so the range is smaller than the domain.</text>

  <!-- domain column (left) -->
  <text x="150" y="66" font-size="13" font-weight="bold" fill="#2a5db0" text-anchor="middle">domain (first coordinate)</text>
  <text x="550" y="66" font-size="13" font-weight="bold" fill="#1b5e20" text-anchor="middle">range (second coordinate)</text>

  <!-- domain nodes x=0..6 at x=150, y=100..400 step 50 -->
  <g font-size="15" text-anchor="middle">
    <circle cx="150" cy="100" r="17" fill="#eaf1fb" stroke="#2a5db0"/><text x="150" y="105">0</text>
    <circle cx="150" cy="150" r="17" fill="#eaf1fb" stroke="#2a5db0"/><text x="150" y="155">1</text>
    <circle cx="150" cy="200" r="17" fill="#eaf1fb" stroke="#2a5db0"/><text x="150" y="205">2</text>
    <circle cx="150" cy="250" r="17" fill="#eaf1fb" stroke="#2a5db0"/><text x="150" y="255">3</text>
    <circle cx="150" cy="300" r="17" fill="#eaf1fb" stroke="#2a5db0"/><text x="150" y="305">4</text>
    <circle cx="150" cy="350" r="17" fill="#eaf1fb" stroke="#2a5db0"/><text x="150" y="355">5</text>
    <circle cx="150" cy="400" r="17" fill="#eaf1fb" stroke="#2a5db0"/><text x="150" y="405">6</text>
  </g>

  <!-- range nodes: 0,1,2,4 at x=550 -->
  <g font-size="15" text-anchor="middle">
    <circle cx="550" cy="120" r="17" fill="#eef5ee" stroke="#1b5e20"/><text x="550" y="125">0</text>
    <circle cx="550" cy="200" r="17" fill="#eef5ee" stroke="#1b5e20"/><text x="550" y="205">1</text>
    <circle cx="550" cy="280" r="17" fill="#eef5ee" stroke="#1b5e20"/><text x="550" y="285">2</text>
    <circle cx="550" cy="360" r="17" fill="#eef5ee" stroke="#1b5e20"/><text x="550" y="365">4</text>
  </g>

  <!-- arrows domain -> range -->
  <g stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#a2)">
    <line x1="168" y1="100" x2="531" y2="120"/>  <!-- 0->0 -->
    <line x1="168" y1="150" x2="531" y2="200"/>  <!-- 1->1 -->
    <line x1="168" y1="200" x2="531" y2="360"/>  <!-- 2->4 -->
    <line x1="168" y1="250" x2="531" y2="280"/>  <!-- 3->2 -->
    <line x1="168" y1="300" x2="531" y2="280"/>  <!-- 4->2 -->
    <line x1="168" y1="350" x2="531" y2="360"/>  <!-- 5->4 -->
    <line x1="168" y1="400" x2="531" y2="200"/>  <!-- 6->1 -->
  </g>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- pairing annotations -->
  <text x="350" y="285" font-size="11" fill="#b0582a" text-anchor="middle">3 and 4 both → 2</text>
  <text x="350" y="205" font-size="11" fill="#b0582a" text-anchor="middle">1 and 6 both → 1</text>
  <text x="350" y="360" font-size="11" fill="#b0582a" text-anchor="middle">2 and 5 both → 4</text>

  <text x="350" y="440" font-size="14" fill="#1b5e20" text-anchor="middle" font-weight="bold">range = { 0, 1, 2, 4 }  —  the quadratic residues mod 7.</text>
</svg>
