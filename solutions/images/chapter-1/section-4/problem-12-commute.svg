<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="340" fill="white"/>

  <defs>
    <marker id="a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="360" y="30" font-size="14" font-weight="bold" fill="#222" text-anchor="middle">Ceiling and squaring do not commute — the order changes the result.</text>

  <!-- ===== Route 1: ceiling first, then square ===== -->
  <text x="40" y="76" font-size="12.5" font-weight="bold" fill="#2e7d32">Route 1 — ceiling, then square:</text>
  <g text-anchor="middle">
    <!-- π -->
    <rect x="120" y="86" width="100" height="40" rx="5" fill="#f3f5f8" stroke="#888" stroke-width="1"/>
    <text x="170" y="112" font-size="15">π ≈ 3.14</text>
    <!-- arrow ceil -->
    <line x1="224" y1="106" x2="300" y2="106" stroke="#444" stroke-width="1.3" marker-end="url(#a12)"/>
    <text x="262" y="98" font-size="11" font-style="italic" fill="#666">⌈ ⌉</text>
    <!-- 4 -->
    <rect x="304" y="86" width="70" height="40" rx="5" fill="#dce8fb" stroke="#2a5db0" stroke-width="1"/>
    <text x="339" y="112" font-size="15">4</text>
    <!-- arrow square -->
    <line x1="378" y1="106" x2="454" y2="106" stroke="#444" stroke-width="1.3" marker-end="url(#a12)"/>
    <text x="416" y="98" font-size="11" font-style="italic" fill="#666">( · )²</text>
    <!-- 16 -->
    <rect x="458" y="86" width="80" height="40" rx="5" fill="#cdeccd" stroke="#2e7d32" stroke-width="1.6"/>
    <text x="498" y="112" font-size="16" font-weight="bold" fill="#2e7d32">16</text>
    <text x="610" y="112" font-size="14" fill="#2e7d32" text-anchor="start">⌈π⌉² = 16</text>
  </g>

  <line x1="40" y1="156" x2="680" y2="156" stroke="#ddd" stroke-width="1"/>

  <!-- ===== Route 2: square first, then ceiling ===== -->
  <text x="40" y="192" font-size="12.5" font-weight="bold" fill="#c06a16">Route 2 — square, then ceiling:</text>
  <g text-anchor="middle">
    <rect x="120" y="202" width="100" height="40" rx="5" fill="#f3f5f8" stroke="#888" stroke-width="1"/>
    <text x="170" y="228" font-size="15">π ≈ 3.14</text>
    <line x1="224" y1="222" x2="300" y2="222" stroke="#444" stroke-width="1.3" marker-end="url(#a12)"/>
    <text x="262" y="214" font-size="11" font-style="italic" fill="#666">( · )²</text>
    <rect x="304" y="202" width="110" height="40" rx="5" fill="#fde6d2" stroke="#c06a16" stroke-width="1"/>
    <text x="359" y="228" font-size="15">π² ≈ 9.87</text>
    <line x1="418" y1="222" x2="494" y2="222" stroke="#444" stroke-width="1.3" marker-end="url(#a12)"/>
    <text x="456" y="214" font-size="11" font-style="italic" fill="#666">⌈ ⌉</text>
    <rect x="498" y="202" width="70" height="40" rx="5" fill="#fbe0c0" stroke="#c06a16" stroke-width="1.6"/>
    <text x="533" y="228" font-size="16" font-weight="bold" fill="#c06a16">10</text>
    <text x="610" y="228" font-size="14" fill="#c06a16" text-anchor="start">⌈π²⌉ = 10</text>
  </g>

  <!-- ===== Result ===== -->
  <line x1="40" y1="272" x2="680" y2="272" stroke="#ddd" stroke-width="1"/>
  <rect x="210" y="288" width="300" height="38" rx="5" fill="#eef2f7" stroke="#2a5db0" stroke-width="1.4"/>
  <text x="360" y="313" font-size="17" font-weight="bold" fill="#2a5db0" text-anchor="middle">⌈π⌉² − ⌈π²⌉ = 16 − 10 = 6</text>
</svg>
