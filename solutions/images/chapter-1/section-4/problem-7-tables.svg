<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="600" fill="white"/>

  <text x="360" y="30" font-size="13" font-style="italic" fill="#444" text-anchor="middle">Each octal digit = 3 bits, each hex digit = 4 bits — just count in binary, zero-padded.</text>

  <!-- ===== OCTAL TABLE (left) ===== -->
  <text x="160" y="64" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">octal → 3 bits</text>
  <!-- header -->
  <text x="100" y="92" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">octal</text>
  <text x="220" y="92" font-size="11" fill="#888" text-anchor="middle">4 2 1</text>
  <line x1="60" y1="100" x2="300" y2="100" stroke="#999" stroke-width="0.8"/>
  <g font-size="15" font-family="'Courier New', monospace">
    <text x="100" y="126" text-anchor="middle" font-family="Georgia, serif">0</text><text x="220" y="126" text-anchor="middle">0 0 0</text>
    <text x="100" y="154" text-anchor="middle" font-family="Georgia, serif">1</text><text x="220" y="154" text-anchor="middle">0 0 1</text>
    <text x="100" y="182" text-anchor="middle" font-family="Georgia, serif">2</text><text x="220" y="182" text-anchor="middle">0 1 0</text>
    <text x="100" y="210" text-anchor="middle" font-family="Georgia, serif">3</text><text x="220" y="210" text-anchor="middle">0 1 1</text>
    <text x="100" y="238" text-anchor="middle" font-family="Georgia, serif">4</text><text x="220" y="238" text-anchor="middle">1 0 0</text>
    <text x="100" y="266" text-anchor="middle" font-family="Georgia, serif">5</text><text x="220" y="266" text-anchor="middle">1 0 1</text>
    <text x="100" y="294" text-anchor="middle" font-family="Georgia, serif">6</text><text x="220" y="294" text-anchor="middle">1 1 0</text>
    <text x="100" y="322" text-anchor="middle" font-family="Georgia, serif">7</text><text x="220" y="322" text-anchor="middle">1 1 1</text>
  </g>
  <line x1="160" y1="108" x2="160" y2="332" stroke="#ddd" stroke-width="0.8"/>

  <!-- ===== HEX TABLE (right) ===== -->
  <text x="520" y="64" font-size="13" font-weight="bold" fill="#222" text-anchor="middle">hexadecimal → 4 bits</text>
  <text x="450" y="92" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">hex</text>
  <text x="580" y="92" font-size="11" fill="#888" text-anchor="middle">8 4 2 1</text>
  <line x1="410" y1="100" x2="660" y2="100" stroke="#999" stroke-width="0.8"/>
  <line x1="510" y1="108" x2="510" y2="556" stroke="#ddd" stroke-width="0.8"/>
  <!-- A row highlight -->
  <rect x="410" y="368" width="250" height="26" fill="#cdeccd"/>
  <g font-size="15" font-family="'Courier New', monospace">
    <text x="450" y="126" text-anchor="middle" font-family="Georgia, serif">0</text><text x="580" y="126" text-anchor="middle">0 0 0 0</text>
    <text x="450" y="154" text-anchor="middle" font-family="Georgia, serif">1</text><text x="580" y="154" text-anchor="middle">0 0 0 1</text>
    <text x="450" y="182" text-anchor="middle" font-family="Georgia, serif">2</text><text x="580" y="182" text-anchor="middle">0 0 1 0</text>
    <text x="450" y="210" text-anchor="middle" font-family="Georgia, serif">3</text><text x="580" y="210" text-anchor="middle">0 0 1 1</text>
    <text x="450" y="238" text-anchor="middle" font-family="Georgia, serif">4</text><text x="580" y="238" text-anchor="middle">0 1 0 0</text>
    <text x="450" y="266" text-anchor="middle" font-family="Georgia, serif">5</text><text x="580" y="266" text-anchor="middle">0 1 0 1</text>
    <text x="450" y="294" text-anchor="middle" font-family="Georgia, serif">6</text><text x="580" y="294" text-anchor="middle">0 1 1 0</text>
    <text x="450" y="322" text-anchor="middle" font-family="Georgia, serif">7</text><text x="580" y="322" text-anchor="middle">0 1 1 1</text>
    <text x="450" y="350" text-anchor="middle" font-family="Georgia, serif">8</text><text x="580" y="350" text-anchor="middle">1 0 0 0</text>
    <text x="450" y="378" text-anchor="middle" font-family="Georgia, serif">9</text><text x="580" y="378" text-anchor="middle">1 0 0 1</text>
    <text x="450" y="406" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" fill="#2e7d32">A</text><text x="580" y="406" text-anchor="middle" font-weight="bold" fill="#2e7d32">1 0 1 0</text>
    <text x="450" y="434" text-anchor="middle" font-family="Georgia, serif">B</text><text x="580" y="434" text-anchor="middle">1 0 1 1</text>
    <text x="450" y="462" text-anchor="middle" font-family="Georgia, serif">C</text><text x="580" y="462" text-anchor="middle">1 1 0 0</text>
    <text x="450" y="490" text-anchor="middle" font-family="Georgia, serif">D</text><text x="580" y="490" text-anchor="middle">1 1 0 1</text>
    <text x="450" y="518" text-anchor="middle" font-family="Georgia, serif">E</text><text x="580" y="518" text-anchor="middle">1 1 1 0</text>
    <text x="450" y="546" text-anchor="middle" font-family="Georgia, serif">F</text><text x="580" y="546" text-anchor="middle">1 1 1 1</text>
  </g>
  <text x="668" y="406" font-size="11" font-style="italic" fill="#2e7d32" text-anchor="start">"ten-ten"</text>

  <!-- footnote -->
  <text x="360" y="582" font-size="11.5" font-style="italic" fill="#666" text-anchor="middle">Hex 0–7 = a leading 0 plus the octal triple; hex 8–F = a leading 1 plus the octal triple.</text>
</svg>
