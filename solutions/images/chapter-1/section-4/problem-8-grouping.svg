<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="400" fill="white"/>

  <text x="360" y="28" font-size="13" font-style="italic" fill="#444" text-anchor="middle">Binary is the hub: octal groups the bits by 3, hexadecimal groups them by 4.</text>

  <!-- ===== (a) octal -> binary, 3-bit blocks ===== -->
  <text x="40" y="68" font-size="13" font-weight="bold" fill="#222">(a)  octal → binary  (each digit = 3 bits)</text>
  <g font-size="14" text-anchor="middle">
    <text x="70" y="100" font-size="16">757₈</text>
    <text x="115" y="100" font-size="16">=</text>
    <!-- 7 -> 111 -->
    <rect x="135" y="86" width="58" height="22" fill="#dce8fb" stroke="#2a5db0" stroke-width="1"/>
    <text x="164" y="102" font-family="'Courier New', monospace">111</text>
    <text x="164" y="120" font-size="10" fill="#888">7</text>
    <!-- 5 -> 101 -->
    <rect x="195" y="86" width="58" height="22" fill="#dce8fb" stroke="#2a5db0" stroke-width="1"/>
    <text x="224" y="102" font-family="'Courier New', monospace">101</text>
    <text x="224" y="120" font-size="10" fill="#888">5</text>
    <!-- 7 -> 111 -->
    <rect x="255" y="86" width="58" height="22" fill="#dce8fb" stroke="#2a5db0" stroke-width="1"/>
    <text x="284" y="102" font-family="'Courier New', monospace">111</text>
    <text x="284" y="120" font-size="10" fill="#888">7</text>
    <text x="430" y="102" font-size="15">= 111101111₂</text>
  </g>

  <line x1="40" y1="138" x2="680" y2="138" stroke="#eee" stroke-width="1"/>

  <!-- ===== (e) hex -> binary, 4-bit blocks ===== -->
  <text x="40" y="168" font-size="13" font-weight="bold" fill="#222">(e)  hex → binary  (each digit = 4 bits)</text>
  <g font-size="14" text-anchor="middle">
    <text x="78" y="200" font-size="16">FEED₁₆</text>
    <text x="128" y="200" font-size="16">=</text>
    <rect x="148" y="186" width="64" height="22" fill="#e7ddf2" stroke="#7a4fa0" stroke-width="1"/>
    <text x="180" y="202" font-family="'Courier New', monospace">1111</text>
    <text x="180" y="220" font-size="10" fill="#888">F</text>
    <rect x="214" y="186" width="64" height="22" fill="#e7ddf2" stroke="#7a4fa0" stroke-width="1"/>
    <text x="246" y="202" font-family="'Courier New', monospace">1110</text>
    <text x="246" y="220" font-size="10" fill="#888">E</text>
    <rect x="280" y="186" width="64" height="22" fill="#e7ddf2" stroke="#7a4fa0" stroke-width="1"/>
    <text x="312" y="202" font-family="'Courier New', monospace">1110</text>
    <text x="312" y="220" font-size="10" fill="#888">E</text>
    <rect x="346" y="186" width="64" height="22" fill="#e7ddf2" stroke="#7a4fa0" stroke-width="1"/>
    <text x="378" y="202" font-family="'Courier New', monospace">1101</text>
    <text x="378" y="220" font-size="10" fill="#888">D</text>
    <text x="500" y="202" font-size="13">= 1111111011101101₂</text>
  </g>

  <line x1="40" y1="238" x2="680" y2="238" stroke="#eee" stroke-width="1"/>

  <!-- ===== (f) hex -> octal via binary: regroup 4s -> 3s ===== -->
  <text x="40" y="268" font-size="13" font-weight="bold" fill="#222">(f)  hex → octal, routed through binary  (regroup 4-bit blocks into 3-bit blocks)</text>
  <text x="40" y="294" font-size="13" fill="#222">FFFFFF₁₆ = twenty-four 1's:</text>

  <!-- 24 bits, shown twice grouped differently -->
  <text x="40" y="322" font-size="11" fill="#7a4fa0">by 4 (hex):</text>
  <g font-size="13" font-family="'Courier New', monospace" fill="#222">
    <text x="120" y="322">1111·1111·1111·1111·1111·1111  =  F F F F F F</text>
  </g>
  <text x="40" y="350" font-size="11" fill="#2a5db0">by 3 (octal):</text>
  <g font-size="13" font-family="'Courier New', monospace" fill="#222">
    <text x="120" y="350">111·111·111·111·111·111·111·111  =  7 7 7 7 7 7 7 7</text>
  </g>

  <rect x="200" y="364" width="320" height="26" rx="5" fill="#eef2f7" stroke="#2a5db0" stroke-width="1.3"/>
  <text x="360" y="382" font-size="14" font-weight="bold" fill="#2a5db0" text-anchor="middle">FFFFFF₁₆ = 77777777₈ = 2²⁴ − 1</text>
</svg>
