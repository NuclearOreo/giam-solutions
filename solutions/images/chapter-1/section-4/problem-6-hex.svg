<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="360" fill="white"/>

  <!-- hex digit reference -->
  <text x="40" y="30" font-size="12.5" font-weight="bold" fill="#222">Hex digits (value in decimal below):</text>
  <g font-size="12" text-anchor="middle">
    <!-- 16 cells x = 40 + i*41, width 38, y=40 h=30 -->
    <g>
      <rect x="40"  y="40" width="38" height="30" fill="#f3f5f8" stroke="#999" stroke-width="0.8"/>
      <rect x="81"  y="40" width="38" height="30" fill="#f3f5f8" stroke="#999" stroke-width="0.8"/>
      <rect x="122" y="40" width="38" height="30" fill="#f3f5f8" stroke="#999" stroke-width="0.8"/>
      <rect x="163" y="40" width="38" height="30" fill="#f3f5f8" stroke="#999" stroke-width="0.8"/>
      <rect x="204" y="40" width="38" height="30" fill="#f3f5f8" stroke="#999" stroke-width="0.8"/>
      <rect x="245" y="40" width="38" height="30" fill="#f3f5f8" stroke="#999" stroke-width="0.8"/>
      <rect x="286" y="40" width="38" height="30" fill="#f3f5f8" stroke="#999" stroke-width="0.8"/>
      <rect x="327" y="40" width="38" height="30" fill="#f3f5f8" stroke="#999" stroke-width="0.8"/>
      <rect x="368" y="40" width="38" height="30" fill="#f3f5f8" stroke="#999" stroke-width="0.8"/>
      <rect x="409" y="40" width="38" height="30" fill="#f3f5f8" stroke="#999" stroke-width="0.8"/>
      <!-- A-F highlighted -->
      <rect x="450" y="40" width="38" height="30" fill="#e7ddf2" stroke="#7a4fa0" stroke-width="1.1"/>
      <rect x="491" y="40" width="38" height="30" fill="#e7ddf2" stroke="#7a4fa0" stroke-width="1.1"/>
      <rect x="532" y="40" width="38" height="30" fill="#e7ddf2" stroke="#7a4fa0" stroke-width="1.1"/>
      <rect x="573" y="40" width="38" height="30" fill="#e7ddf2" stroke="#7a4fa0" stroke-width="1.1"/>
      <rect x="614" y="40" width="38" height="30" fill="#e7ddf2" stroke="#7a4fa0" stroke-width="1.1"/>
      <rect x="655" y="40" width="38" height="30" fill="#e7ddf2" stroke="#7a4fa0" stroke-width="1.1"/>
    </g>
    <g font-size="14" font-weight="bold">
      <text x="59"  y="58">0</text><text x="100" y="58">1</text><text x="141" y="58">2</text><text x="182" y="58">3</text>
      <text x="223" y="58">4</text><text x="264" y="58">5</text><text x="305" y="58">6</text><text x="346" y="58">7</text>
      <text x="387" y="58">8</text><text x="428" y="58">9</text>
      <text x="469" y="58" fill="#5a2e8a">A</text><text x="510" y="58" fill="#5a2e8a">B</text><text x="551" y="58" fill="#5a2e8a">C</text>
      <text x="592" y="58" fill="#5a2e8a">D</text><text x="633" y="58" fill="#5a2e8a">E</text><text x="674" y="58" fill="#5a2e8a">F</text>
    </g>
    <g font-size="9.5" fill="#888">
      <text x="59" y="80">0</text><text x="100" y="80">1</text><text x="141" y="80">2</text><text x="182" y="80">3</text>
      <text x="223" y="80">4</text><text x="264" y="80">5</text><text x="305" y="80">6</text><text x="346" y="80">7</text>
      <text x="387" y="80">8</text><text x="428" y="80">9</text>
      <text x="469" y="80">10</text><text x="510" y="80">11</text><text x="551" y="80">12</text>
      <text x="592" y="80">13</text><text x="633" y="80">14</text><text x="674" y="80">15</text>
    </g>
  </g>

  <line x1="40" y1="96" x2="680" y2="96" stroke="#ddd" stroke-width="1"/>

  <!-- Sequence A: after AB -->
  <text x="40" y="124" font-size="13" font-weight="bold" fill="#222">The next 10 after AB:</text>
  <!-- 10 cells x = 60 + i*60, width 52, y=138 h=30 -->
  <g font-size="14" text-anchor="middle">
    <!-- AC AD AE -->
    <rect x="60"  y="138" width="52" height="30" fill="#eef2f7" stroke="#446" stroke-width="1"/><text x="86"  y="158">AC</text>
    <rect x="120" y="138" width="52" height="30" fill="#eef2f7" stroke="#446" stroke-width="1"/><text x="146" y="158">AD</text>
    <rect x="180" y="138" width="52" height="30" fill="#eef2f7" stroke="#446" stroke-width="1"/><text x="206" y="158">AE</text>
    <!-- AF (carry) -->
    <rect x="240" y="138" width="52" height="30" fill="#fde6d2" stroke="#c06a16" stroke-width="1.5"/><text x="266" y="158" font-weight="bold">AF</text>
    <!-- B0 (carry) -->
    <rect x="300" y="138" width="52" height="30" fill="#fde6d2" stroke="#c06a16" stroke-width="1.5"/><text x="326" y="158" font-weight="bold">B0</text>
    <!-- B1..B5 -->
    <rect x="360" y="138" width="52" height="30" fill="#eef2f7" stroke="#446" stroke-width="1"/><text x="386" y="158">B1</text>
    <rect x="420" y="138" width="52" height="30" fill="#eef2f7" stroke="#446" stroke-width="1"/><text x="446" y="158">B2</text>
    <rect x="480" y="138" width="52" height="30" fill="#eef2f7" stroke="#446" stroke-width="1"/><text x="506" y="158">B3</text>
    <rect x="540" y="138" width="52" height="30" fill="#eef2f7" stroke="#446" stroke-width="1"/><text x="566" y="158">B4</text>
    <rect x="600" y="138" width="52" height="30" fill="#eef2f7" stroke="#446" stroke-width="1"/><text x="626" y="158">B5</text>
  </g>
  <text x="296" y="186" font-size="11" font-style="italic" fill="#c06a16" text-anchor="middle">F rolls to 0, carry A → B</text>

  <line x1="40" y1="208" x2="680" y2="208" stroke="#ddd" stroke-width="1"/>

  <!-- Sequence B: after FA -->
  <text x="40" y="236" font-size="13" font-weight="bold" fill="#222">The next 10 after FA:</text>
  <g font-size="14" text-anchor="middle">
    <rect x="60"  y="250" width="52" height="30" fill="#eef2f7" stroke="#446" stroke-width="1"/><text x="86"  y="270">FB</text>
    <rect x="120" y="250" width="52" height="30" fill="#eef2f7" stroke="#446" stroke-width="1"/><text x="146" y="270">FC</text>
    <rect x="180" y="250" width="52" height="30" fill="#eef2f7" stroke="#446" stroke-width="1"/><text x="206" y="270">FD</text>
    <rect x="240" y="250" width="52" height="30" fill="#eef2f7" stroke="#446" stroke-width="1"/><text x="266" y="270">FE</text>
    <!-- FF (carry) -->
    <rect x="300" y="250" width="52" height="30" fill="#fbdcdc" stroke="#c33" stroke-width="1.6"/><text x="326" y="270" font-weight="bold">FF</text>
    <!-- 100 (rollover) -->
    <rect x="360" y="250" width="52" height="30" fill="#fbdcdc" stroke="#c33" stroke-width="1.6"/><text x="386" y="270" font-weight="bold">100</text>
    <rect x="420" y="250" width="52" height="30" fill="#eef2f7" stroke="#446" stroke-width="1"/><text x="446" y="270">101</text>
    <rect x="480" y="250" width="52" height="30" fill="#eef2f7" stroke="#446" stroke-width="1"/><text x="506" y="270">102</text>
    <rect x="540" y="250" width="52" height="30" fill="#eef2f7" stroke="#446" stroke-width="1"/><text x="566" y="270">103</text>
    <rect x="600" y="250" width="52" height="30" fill="#eef2f7" stroke="#446" stroke-width="1"/><text x="626" y="270">104</text>
  </g>
  <text x="356" y="298" font-size="11" font-style="italic" fill="#c33" text-anchor="middle">FF rolls over to a 3-digit number — like 99 → 100</text>

  <!-- decimal anchors -->
  <text x="360" y="330" font-size="11.5" font-style="italic" fill="#666" text-anchor="middle">Decimal anchors:  AB = 171,  AF = 175,  B0 = 176  ·  FA = 250,  FF = 255,  100₁₆ = 256.</text>
</svg>
