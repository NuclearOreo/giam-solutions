<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="470" fill="white"/>

  <text x="360" y="28" font-size="13.5" font-style="italic" fill="#444" text-anchor="middle">"Even" means "divisible by 2." Replace 2 by a general prime p and the whole argument carries over.</text>

  <!-- Two columns: p=2 (parity) vs general p -->
  <line x1="360" y1="52" x2="360" y2="300" stroke="#ddd"/>

  <!-- left header -->
  <rect x="30" y="52" width="310" height="30" fill="#fdeee2"/>
  <text x="185" y="72" font-size="14" font-weight="bold" fill="#8a3b12" text-anchor="middle">The case p = 2  (parity)</text>
  <!-- right header -->
  <rect x="380" y="52" width="310" height="30" fill="#eef5ee"/>
  <text x="535" y="72" font-size="14" font-weight="bold" fill="#1b5e20" text-anchor="middle">General prime p</text>

  <!-- lemma row -->
  <text x="185" y="110" font-size="12.5" fill="#666" text-anchor="middle">the lemma:</text>
  <text x="185" y="134" font-size="14.5" fill="#222" text-anchor="middle">x² even ⟹ x even</text>
  <text x="185" y="156" font-size="12" font-style="italic" fill="#888" text-anchor="middle">i.e.  2 | x²  ⟹  2 | x</text>

  <text x="535" y="110" font-size="12.5" fill="#666" text-anchor="middle">the equivalent lemma:</text>
  <text x="535" y="134" font-size="14.5" fill="#1b5e20" font-weight="bold" text-anchor="middle">p | x²  ⟹  p | x</text>
  <text x="535" y="156" font-size="12" font-style="italic" fill="#888" text-anchor="middle">("if p divides x², then p divides x")</text>

  <!-- arrow across -->
  <text x="360" y="140" font-size="20" fill="#999" text-anchor="middle">→</text>

  <!-- role in proof -->
  <text x="185" y="196" font-size="12.5" fill="#666" text-anchor="middle">used in:  √2 = a/b  ⟹  a² = 2b²</text>
  <text x="185" y="218" font-size="12.5" fill="#222" text-anchor="middle">a² even ⟹ a even ⟹ … ⟹ b even</text>
  <text x="185" y="240" font-size="12" font-style="italic" fill="#888" text-anchor="middle">contradicts gcd(a,b)=1</text>

  <text x="535" y="196" font-size="12.5" fill="#666" text-anchor="middle">used in:  √p = a/b  ⟹  a² = p·b²</text>
  <text x="535" y="218" font-size="12.5" fill="#222" text-anchor="middle">p | a² ⟹ p | a ⟹ … ⟹ p | b</text>
  <text x="535" y="240" font-size="12" font-style="italic" fill="#888" text-anchor="middle">contradicts gcd(a,b)=1</text>

  <text x="360" y="286" font-size="12.5" font-style="italic" fill="#666" text-anchor="middle">Same skeleton — only "2" becomes "p" and "even" becomes "divisible by p."</text>

  <!-- proof of the general lemma -->
  <rect x="40" y="312" width="640" height="142" fill="#f7f7f7" stroke="#ddd"/>
  <text x="360" y="338" font-size="13.5" font-weight="bold" fill="#222" text-anchor="middle">Why  p | x²  ⟹  p | x   (p prime)</text>
  <text x="60" y="366" font-size="12.5" fill="#333">Look at the exponent of p in the prime factorization of x — call it e.</text>
  <text x="60" y="390" font-size="12.5" fill="#333">Squaring doubles it: the exponent of p in x² is 2e.</text>
  <text x="60" y="414" font-size="12.5" fill="#333">p | x²  ⟺  2e ≥ 1  ⟺  e ≥ 1  ⟺  p | x.   (Here primeness of p is essential.)</text>
  <text x="60" y="440" font-size="12" font-style="italic" fill="#1b5e20">Equivalently this is Euclid's Lemma:  p prime and p | (x·x)  ⟹  p | x.</text>
</svg>
