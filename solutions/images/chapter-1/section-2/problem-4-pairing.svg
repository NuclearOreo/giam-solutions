<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="400" fill="white"/>

  <text x="360" y="28" font-size="13" font-style="italic" fill="#444" text-anchor="middle">A perfect square's primes split into two identical copies of √n — equivalently, every exponent is even.</text>

  <!-- faint dividers -->
  <g stroke="#eee" stroke-width="1">
    <line x1="30" y1="146" x2="690" y2="146"/>
    <line x1="30" y1="256" x2="690" y2="256"/>
  </g>

  <!-- ===== Block A: 36 = 2^2 * 3^2 ===== -->
  <text x="30" y="95" font-size="14" fill="#222">36 = 2² · 3²</text>
  <!-- top row copy -->
  <g>
    <rect x="200" y="56" width="28" height="28" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
    <text x="214" y="75" font-size="14" text-anchor="middle">2</text>
    <rect x="234" y="56" width="28" height="28" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
    <text x="248" y="75" font-size="14" text-anchor="middle">3</text>
  </g>
  <!-- bottom row copy -->
  <g>
    <rect x="200" y="88" width="28" height="28" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
    <text x="214" y="107" font-size="14" text-anchor="middle">2</text>
    <rect x="234" y="88" width="28" height="28" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
    <text x="248" y="107" font-size="14" text-anchor="middle">3</text>
  </g>
  <text x="290" y="84" font-size="12" fill="#555" font-style="italic">= 6</text>
  <text x="290" y="108" font-size="12" fill="#555" font-style="italic">= 6</text>
  <text x="345" y="92" font-size="14" fill="#2e6e2e">→  6 × 6 = 6²   ✓ perfect square</text>

  <!-- ===== Block B: 144 = 2^4 * 3^2 ===== -->
  <text x="30" y="205" font-size="14" fill="#222">144 = 2⁴ · 3²</text>
  <g>
    <rect x="200" y="166" width="28" height="28" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
    <text x="214" y="185" font-size="14" text-anchor="middle">2</text>
    <rect x="234" y="166" width="28" height="28" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
    <text x="248" y="185" font-size="14" text-anchor="middle">2</text>
    <rect x="268" y="166" width="28" height="28" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
    <text x="282" y="185" font-size="14" text-anchor="middle">3</text>
  </g>
  <g>
    <rect x="200" y="198" width="28" height="28" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
    <text x="214" y="217" font-size="14" text-anchor="middle">2</text>
    <rect x="234" y="198" width="28" height="28" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
    <text x="248" y="217" font-size="14" text-anchor="middle">2</text>
    <rect x="268" y="198" width="28" height="28" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
    <text x="282" y="217" font-size="14" text-anchor="middle">3</text>
  </g>
  <text x="324" y="194" font-size="12" fill="#555" font-style="italic">= 12</text>
  <text x="324" y="218" font-size="12" fill="#555" font-style="italic">= 12</text>
  <text x="385" y="202" font-size="14" fill="#2e6e2e">→  12 × 12 = 12²   ✓ perfect square</text>

  <!-- ===== Block C: 72 = 2^3 * 3^2  (NOT a square) ===== -->
  <text x="30" y="315" font-size="14" fill="#222">72 = 2³ · 3²</text>
  <!-- top row: 2 2 3, the second 2 is the unpaired one (red) -->
  <g>
    <rect x="200" y="276" width="28" height="28" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
    <text x="214" y="295" font-size="14" text-anchor="middle">2</text>
    <rect x="234" y="276" width="28" height="28" fill="#fbe0e0" stroke="#c33" stroke-width="1.4"/>
    <text x="248" y="295" font-size="14" text-anchor="middle" fill="#a02020">2</text>
    <rect x="268" y="276" width="28" height="28" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
    <text x="282" y="295" font-size="14" text-anchor="middle">3</text>
  </g>
  <!-- bottom row: 2 (empty) 3 -->
  <g>
    <rect x="200" y="308" width="28" height="28" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
    <text x="214" y="327" font-size="14" text-anchor="middle">2</text>
    <rect x="234" y="308" width="28" height="28" fill="none" stroke="#c33" stroke-width="1.2" stroke-dasharray="3,2"/>
    <text x="248" y="328" font-size="14" text-anchor="middle" fill="#c33">—</text>
    <rect x="268" y="308" width="28" height="28" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
    <text x="282" y="327" font-size="14" text-anchor="middle">3</text>
  </g>
  <!-- arrow flagging the unpaired tile -->
  <text x="324" y="302" font-size="12" fill="#c33" font-style="italic">no partner</text>
  <text x="345" y="318" font-size="14" fill="#c33">→  no equal split   ✗ not a perfect square</text>

  <!-- caption -->
  <text x="360" y="375" font-size="11" font-style="italic" fill="#666" text-anchor="middle">Each column pairs one prime from each copy of √n. An odd exponent (the 2³ in 72) strands one prime with no partner.</text>
</svg>
