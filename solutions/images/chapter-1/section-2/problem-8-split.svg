<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="220" fill="white"/>

  <defs>
    <marker id="s8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="30" y="36" font-size="14" font-weight="bold" fill="#222">35 = 5 · 7 — its two prime factors split between a and b</text>

  <!-- a = 5 -->
  <text x="95" y="78" font-size="13" fill="#222" text-anchor="middle">a = 5</text>
  <rect x="80" y="86" width="30" height="30" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
  <text x="95" y="107" font-size="15" text-anchor="middle">5</text>
  <text x="95" y="136" font-size="12.5" fill="#b02020" text-anchor="middle">35 ∤ 5</text>

  <text x="150" y="107" font-size="18" fill="#444" text-anchor="middle">×</text>

  <!-- b = 7 -->
  <text x="205" y="78" font-size="13" fill="#222" text-anchor="middle">b = 7</text>
  <rect x="190" y="86" width="30" height="30" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
  <text x="205" y="107" font-size="15" text-anchor="middle">7</text>
  <text x="205" y="136" font-size="12.5" fill="#b02020" text-anchor="middle">35 ∤ 7</text>

  <line x1="245" y1="101" x2="300" y2="101" stroke="#444" stroke-width="1.3" marker-end="url(#s8)"/>

  <!-- ab = 35 -->
  <text x="345" y="78" font-size="13" fill="#222" text-anchor="middle">ab = 35</text>
  <rect x="314" y="86" width="30" height="30" fill="#dff0df" stroke="#2e7d32" stroke-width="1.1"/>
  <text x="329" y="107" font-size="15" text-anchor="middle">5</text>
  <rect x="346" y="86" width="30" height="30" fill="#dff0df" stroke="#2e7d32" stroke-width="1.1"/>
  <text x="361" y="107" font-size="15" text-anchor="middle">7</text>
  <text x="345" y="136" font-size="12.5" fill="#2e7d32" text-anchor="middle">35 | 35 ✓</text>

  <text x="410" y="94" font-size="13" fill="#222">35 divides the product</text>
  <text x="410" y="112" font-size="13" fill="#222">but neither factor —</text>
  <text x="410" y="130" font-size="13" fill="#b02020" font-weight="bold">so 35 is NOT prime (def. 2).</text>

  <line x1="30" y1="170" x2="690" y2="170" stroke="#ddd" stroke-width="1"/>
  <text x="360" y="195" font-size="12" font-style="italic" fill="#666" text-anchor="middle">The only nontrivial way to write 35 as a product is 5 × 7, so this is essentially the unique such pair.</text>
</svg>
