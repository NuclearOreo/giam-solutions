<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="430" fill="white"/>

  <defs>
    <marker id="pmark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b02020"/>
    </marker>
  </defs>

  <text x="360" y="24" font-size="13" font-style="italic" fill="#444" text-anchor="middle">f(x) = x² − 31x + 257: prime for x = 1, …, 31 (green), then composite at x = 32 (red).</text>

  <!-- axis of symmetry x = 15.5 -> px 341 -->
  <line x1="341" y1="48" x2="341" y2="382" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="341" y="44" font-size="10.5" font-style="italic" fill="#888" text-anchor="middle">axis of symmetry  x = 15.5</text>

  <!-- x-axis -->
  <line x1="48" y1="382" x2="712" y2="382" stroke="#999" stroke-width="0.9"/>

  <!-- smooth parabola through integer points -->
  <polyline fill="none" stroke="#cfd8e0" stroke-width="1.4"
    points="60.0,178.2 79.4,203.1 98.8,226.2 118.2,247.5 137.6,267.1 157.0,284.9 176.4,300.9 195.8,315.1 215.2,327.5 234.6,338.2 254.0,347.1 273.4,354.2 292.8,359.6 312.2,363.1 331.6,364.9 351.0,364.9 370.4,363.1 389.8,359.6 409.2,354.2 428.6,347.1 448.0,338.2 467.4,327.5 486.8,315.1 506.2,300.9 525.6,284.9 545.0,267.1 564.4,247.5 583.8,226.2 603.2,203.1 622.6,178.2 642.0,151.5 661.4,123.1 680.8,92.9 700.2,60.8"/>

  <!-- green dots: x = 1..31 (prime) -->
  <g fill="#2e9e4f">
    <circle cx="60.0" cy="178.2" r="3.4"/>
    <circle cx="79.4" cy="203.1" r="3.4"/>
    <circle cx="98.8" cy="226.2" r="3.4"/>
    <circle cx="118.2" cy="247.5" r="3.4"/>
    <circle cx="137.6" cy="267.1" r="3.4"/>
    <circle cx="157.0" cy="284.9" r="3.4"/>
    <circle cx="176.4" cy="300.9" r="3.4"/>
    <circle cx="195.8" cy="315.1" r="3.4"/>
    <circle cx="215.2" cy="327.5" r="3.4"/>
    <circle cx="234.6" cy="338.2" r="3.4"/>
    <circle cx="254.0" cy="347.1" r="3.4"/>
    <circle cx="273.4" cy="354.2" r="3.4"/>
    <circle cx="292.8" cy="359.6" r="3.4"/>
    <circle cx="312.2" cy="363.1" r="3.4"/>
    <circle cx="331.6" cy="364.9" r="3.4"/>
    <circle cx="351.0" cy="364.9" r="3.4"/>
    <circle cx="370.4" cy="363.1" r="3.4"/>
    <circle cx="389.8" cy="359.6" r="3.4"/>
    <circle cx="409.2" cy="354.2" r="3.4"/>
    <circle cx="428.6" cy="347.1" r="3.4"/>
    <circle cx="448.0" cy="338.2" r="3.4"/>
    <circle cx="467.4" cy="327.5" r="3.4"/>
    <circle cx="486.8" cy="315.1" r="3.4"/>
    <circle cx="506.2" cy="300.9" r="3.4"/>
    <circle cx="525.6" cy="284.9" r="3.4"/>
    <circle cx="545.0" cy="267.1" r="3.4"/>
    <circle cx="564.4" cy="247.5" r="3.4"/>
    <circle cx="583.8" cy="226.2" r="3.4"/>
    <circle cx="603.2" cy="203.1" r="3.4"/>
    <circle cx="622.6" cy="178.2" r="3.4"/>
    <circle cx="642.0" cy="151.5" r="3.4"/>
  </g>

  <!-- red dots: x = 32, 33 (composite) -->
  <circle cx="661.4" cy="123.1" r="4.6" fill="#e23b3b" stroke="#8a1010" stroke-width="1.2"/>
  <circle cx="680.8" cy="92.9"  r="4.0" fill="#f0a0a0" stroke="#b02020" stroke-width="1"/>
  <!-- green again at x = 34 -->
  <circle cx="700.2" cy="60.8" r="3.4" fill="#2e9e4f"/>

  <!-- callout to x=32 -->
  <line x1="560" y1="118" x2="654" y2="122" stroke="#b02020" stroke-width="1.3" marker-end="url(#pmark)"/>
  <text x="556" y="115" font-size="12.5" fill="#b02020" text-anchor="end">f(32) = 289 = 17²  ✗</text>
  <text x="688" y="86" font-size="10.5" fill="#b02020" text-anchor="middle">323 = 17·19</text>
  <text x="704" y="55" font-size="10" fill="#2e9e4f" text-anchor="middle">359 (prime)</text>

  <!-- x ticks -->
  <g font-size="10" fill="#777" text-anchor="middle">
    <text x="60.0"  y="396">1</text>
    <text x="234.6" y="396">10</text>
    <text x="351.0" y="396">16</text>
    <text x="428.6" y="396">20</text>
    <text x="622.6" y="396">30</text>
    <text x="661.4" y="396">32</text>
  </g>
  <text x="708" y="396" font-size="11" font-style="italic" fill="#777">x</text>

  <!-- legend -->
  <g font-size="11" fill="#444">
    <circle cx="150" cy="414" r="4" fill="#2e9e4f"/>
    <text x="160" y="418" text-anchor="start">f(x) prime</text>
    <circle cx="290" cy="414" r="4.6" fill="#e23b3b" stroke="#8a1010" stroke-width="1"/>
    <text x="300" y="418" text-anchor="start">f(x) composite</text>
    <text x="470" y="418" font-style="italic" fill="#666" text-anchor="start">31 primes in a row, then the run breaks.</text>
  </g>
</svg>
