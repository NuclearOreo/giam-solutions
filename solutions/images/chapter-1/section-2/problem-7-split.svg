<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="360" fill="white"/>

  <defs>
    <marker id="s7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- ===== TOP: 6 = 2*3 splits across a and b ===== -->
  <text x="30" y="30" font-size="14" font-weight="bold" fill="#222">6 is composite — its two prime factors split between a and b</text>

  <!-- a = 2 -->
  <text x="95" y="70" font-size="13" fill="#222" text-anchor="middle">a = 2</text>
  <rect x="80" y="78" width="30" height="30" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
  <text x="95" y="99" font-size="15" text-anchor="middle">2</text>
  <text x="95" y="128" font-size="12.5" fill="#b02020" text-anchor="middle">6 ∤ 2</text>

  <text x="150" y="99" font-size="18" fill="#444" text-anchor="middle">×</text>

  <!-- b = 3 -->
  <text x="205" y="70" font-size="13" fill="#222" text-anchor="middle">b = 3</text>
  <rect x="190" y="78" width="30" height="30" fill="#e6eef7" stroke="#446" stroke-width="1.1"/>
  <text x="205" y="99" font-size="15" text-anchor="middle">3</text>
  <text x="205" y="128" font-size="12.5" fill="#b02020" text-anchor="middle">6 ∤ 3</text>

  <line x1="245" y1="93" x2="300" y2="93" stroke="#444" stroke-width="1.3" marker-end="url(#s7)"/>

  <!-- ab = 6 -->
  <text x="345" y="70" font-size="13" fill="#222" text-anchor="middle">ab = 6</text>
  <rect x="314" y="78" width="30" height="30" fill="#dff0df" stroke="#2e7d32" stroke-width="1.1"/>
  <text x="329" y="99" font-size="15" text-anchor="middle">2</text>
  <rect x="346" y="78" width="30" height="30" fill="#dff0df" stroke="#2e7d32" stroke-width="1.1"/>
  <text x="361" y="99" font-size="15" text-anchor="middle">3</text>
  <text x="345" y="128" font-size="12.5" fill="#2e7d32" text-anchor="middle">6 | 6 ✓</text>

  <text x="410" y="86" font-size="13" fill="#222">6 divides the product</text>
  <text x="410" y="104" font-size="13" fill="#222">but neither factor —</text>
  <text x="410" y="122" font-size="13" fill="#b02020" font-weight="bold">so 6 is NOT prime (def. 2).</text>

  <!-- divider -->
  <line x1="30" y1="170" x2="690" y2="170" stroke="#ddd" stroke-width="1"/>

  <!-- ===== BOTTOM: 5 is a single prime atom — cannot split ===== -->
  <text x="30" y="205" font-size="14" font-weight="bold" fill="#222">Contrast: 5 is a single prime — it cannot be split</text>

  <!-- the indivisible tile -->
  <rect x="80" y="222" width="34" height="34" fill="#fff2cc" stroke="#b8860b" stroke-width="1.4"/>
  <text x="97" y="245" font-size="17" text-anchor="middle">5</text>
  <text x="97" y="274" font-size="11.5" font-style="italic" fill="#666" text-anchor="middle">one atom</text>

  <text x="150" y="232" font-size="13" fill="#222">If 5 divides a product ab, the whole tile</text>
  <text x="150" y="250" font-size="13" fill="#222">5 must land entirely in a or entirely in b —</text>
  <text x="150" y="268" font-size="13" fill="#2e7d32" font-weight="bold">so 5 | a or 5 | b.   ✓ 5 IS prime (def. 2).</text>

  <!-- summary -->
  <text x="360" y="320" font-size="12.5" font-style="italic" fill="#444" text-anchor="middle">A number passes the second definition exactly when it is a single prime atom.</text>
  <text x="360" y="340" font-size="12.5" font-style="italic" fill="#444" text-anchor="middle">Any composite splits — which is precisely how 6 = 2 · 3 fails.</text>
</svg>
