<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="340" fill="white"/>

  <text x="360" y="28" font-size="13" font-style="italic" fill="#444" text-anchor="middle">Between any two distinct reals lies their midpoint — the reals are "dense." (Integers are not.)</text>

  <!-- ===== Panel A: the reals (true) ===== -->
  <text x="60" y="62" font-size="13" font-weight="bold" fill="#2a5db0">In ℝ: true</text>

  <!-- iterated faint midpoints (density hint) -->
  <g stroke="#ccd" stroke-width="1">
    <line x1="210" y1="115" x2="210" y2="125"/>
    <line x1="390" y1="115" x2="390" y2="125"/>
    <line x1="165" y1="116" x2="165" y2="124"/>
    <line x1="255" y1="116" x2="255" y2="124"/>
    <line x1="345" y1="116" x2="345" y2="124"/>
    <line x1="435" y1="116" x2="435" y2="124"/>
  </g>

  <!-- main line -->
  <line x1="70" y1="120" x2="600" y2="120" stroke="#222" stroke-width="1.4"/>

  <!-- gap braces -->
  <path d="M 120 134 L 120 140 L 300 140 L 300 134" stroke="#888" stroke-width="1" fill="none"/>
  <path d="M 300 134 L 300 140 L 480 140 L 480 134" stroke="#888" stroke-width="1" fill="none"/>
  <text x="210" y="154" font-size="11" font-style="italic" fill="#777" text-anchor="middle">(b − a)/2</text>
  <text x="390" y="154" font-size="11" font-style="italic" fill="#777" text-anchor="middle">(b − a)/2</text>

  <!-- a, m, b dots -->
  <circle cx="120" cy="120" r="4.5" fill="#222"/>
  <circle cx="480" cy="120" r="4.5" fill="#222"/>
  <circle cx="300" cy="120" r="5.5" fill="#2a8a3a"/>

  <!-- labels -->
  <text x="120" y="106" font-size="14" fill="#222" text-anchor="middle">a</text>
  <text x="480" y="106" font-size="14" fill="#222" text-anchor="middle">b</text>
  <text x="300" y="100" font-size="13" fill="#2a8a3a" text-anchor="middle" font-weight="bold">m = (a + b)/2</text>

  <text x="625" y="124" font-size="13" fill="#2a8a3a">a &lt; m &lt; b ✓</text>

  <!-- divider -->
  <line x1="40" y1="200" x2="680" y2="200" stroke="#ddd" stroke-width="1"/>

  <!-- ===== Panel B: the integers (false) ===== -->
  <text x="60" y="236" font-size="13" font-weight="bold" fill="#c33">In ℤ: false</text>

  <line x1="70" y1="280" x2="600" y2="280" stroke="#222" stroke-width="1.4"/>
  <!-- integer ticks 1..6 at x=120,200,280,360,440,520 -->
  <g stroke="#222" stroke-width="1.2">
    <line x1="120" y1="274" x2="120" y2="286"/>
    <line x1="200" y1="274" x2="200" y2="286"/>
    <line x1="280" y1="274" x2="280" y2="286"/>
    <line x1="360" y1="274" x2="360" y2="286"/>
    <line x1="440" y1="274" x2="440" y2="286"/>
    <line x1="520" y1="274" x2="520" y2="286"/>
  </g>
  <g font-size="13" fill="#444" text-anchor="middle">
    <text x="120" y="302">1</text>
    <text x="200" y="302">2</text>
    <text x="280" y="302">3</text>
    <text x="360" y="302">4</text>
    <text x="440" y="302">5</text>
    <text x="520" y="302">6</text>
  </g>
  <!-- highlight 3 and 4 -->
  <circle cx="280" cy="280" r="5.5" fill="#c33"/>
  <circle cx="360" cy="280" r="5.5" fill="#c33"/>
  <!-- region between -->
  <rect x="282" y="266" width="76" height="28" fill="#fbe4e4" opacity="0.6"/>
  <text x="320" y="262" font-size="11" font-style="italic" fill="#c33" text-anchor="middle">nothing here</text>
  <text x="625" y="284" font-size="12.5" fill="#c33">no integer</text>
  <text x="625" y="300" font-size="12.5" fill="#c33">between 3 and 4</text>
</svg>
