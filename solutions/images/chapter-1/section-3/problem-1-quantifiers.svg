<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="330" fill="white"/>

  <text x="350" y="28" font-size="13" font-style="italic" fill="#444" text-anchor="middle">Four quantifiers: universal (∀, blue) and existential (∃, orange), alternating ∀ ∃ ∀ ∃.</text>

  <!-- quantifier symbols above their phrases -->
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="75"  y="78" fill="#2a5db0">∀</text>
    <text x="199" y="78" fill="#c06a16">∃</text>
    <text x="477" y="78" fill="#2a5db0">∀</text>
    <text x="610" y="78" fill="#c06a16">∃</text>
  </g>

  <!-- highlight boxes -->
  <rect x="34"  y="92" width="82" height="28" fill="#dce8fb" stroke="#2a5db0" stroke-width="1.1" rx="3"/>
  <rect x="150" y="92" width="98" height="28" fill="#fde6d2" stroke="#c06a16" stroke-width="1.1" rx="3"/>
  <rect x="432" y="92" width="90" height="28" fill="#dce8fb" stroke="#2a5db0" stroke-width="1.1" rx="3"/>
  <rect x="572" y="92" width="76" height="28" fill="#fde6d2" stroke="#c06a16" stroke-width="1.1" rx="3"/>

  <!-- the sentence, word by word at fixed x, baseline 111 -->
  <g font-size="15" fill="#222">
    <text x="40"  y="111">Everybody</text>
    <text x="122" y="111">has</text>
    <text x="156" y="111">some</text>
    <text x="196" y="111">friend</text>
    <text x="254" y="111">that</text>
    <text x="296" y="111">thinks</text>
    <text x="354" y="111">they</text>
    <text x="396" y="111">know</text>
    <text x="438" y="111">everything</text>
    <text x="528" y="111">about</text>
    <text x="578" y="111">a</text>
    <text x="596" y="111">sport.</text>
  </g>

  <!-- pattern row: four chips -->
  <g>
    <circle cx="110" cy="190" r="22" fill="#dce8fb" stroke="#2a5db0" stroke-width="1.4"/>
    <text x="110" y="196" font-size="18" font-weight="bold" fill="#2a5db0" text-anchor="middle">∀</text>
    <circle cx="270" cy="190" r="22" fill="#fdeeda" stroke="#c06a16" stroke-width="1.4"/>
    <text x="270" y="196" font-size="18" font-weight="bold" fill="#c06a16" text-anchor="middle">∃</text>
    <circle cx="430" cy="190" r="22" fill="#dce8fb" stroke="#2a5db0" stroke-width="1.4"/>
    <text x="430" y="196" font-size="18" font-weight="bold" fill="#2a5db0" text-anchor="middle">∀</text>
    <circle cx="590" cy="190" r="22" fill="#fdeeda" stroke="#c06a16" stroke-width="1.4"/>
    <text x="590" y="196" font-size="18" font-weight="bold" fill="#c06a16" text-anchor="middle">∃</text>
  </g>
  <!-- connecting arrows -->
  <g stroke="#bbb" stroke-width="1.2" fill="none">
    <line x1="134" y1="190" x2="246" y2="190"/>
    <line x1="294" y1="190" x2="406" y2="190"/>
    <line x1="454" y1="190" x2="566" y2="190"/>
  </g>
  <!-- phrase labels under chips -->
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="110" y="232">"Everybody"</text>
    <text x="110" y="248" font-style="italic" fill="#777">for all people</text>
    <text x="270" y="232">"some friend"</text>
    <text x="270" y="248" font-style="italic" fill="#777">there exists a friend</text>
    <text x="430" y="232">"everything"</text>
    <text x="430" y="248" font-style="italic" fill="#777">for all facts</text>
    <text x="590" y="232">"a sport"</text>
    <text x="590" y="248" font-style="italic" fill="#777">there exists a sport</text>
  </g>

  <!-- summary -->
  <line x1="60" y1="276" x2="640" y2="276" stroke="#ddd" stroke-width="1"/>
  <text x="350" y="300" font-size="13" fill="#222" text-anchor="middle">Total: <tspan font-weight="bold">4 quantifiers</tspan> — 2 universal (∀) and 2 existential (∃).</text>
  <text x="350" y="320" font-size="11.5" font-style="italic" fill="#666" text-anchor="middle">("they" is a pronoun referring back to the friend — not a quantifier.)</text>
</svg>
