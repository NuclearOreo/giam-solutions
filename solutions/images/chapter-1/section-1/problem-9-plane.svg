<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="Georgia, 'Times New Roman', serif">
  <rect width="720" height="380" fill="white"/>

  <defs>
    <marker id="arrow9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrow9blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3060c0"/>
    </marker>
    <marker id="arrow9red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c03030"/>
    </marker>
    <marker id="arrow9green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#208038"/>
    </marker>
  </defs>

  <text x="180" y="24" font-size="13" font-style="italic" fill="#222" text-anchor="middle">(a) (4 + 3i) − (3 + 2i) = 1 + i — difference vector</text>

  <g stroke="#ececec" stroke-width="0.8">
    <line x1="60"  y1="40"  x2="60"  y2="340"/>
    <line x1="120" y1="40"  x2="120" y2="340"/>
    <line x1="180" y1="40"  x2="180" y2="340"/>
    <line x1="240" y1="40"  x2="240" y2="340"/>
    <line x1="300" y1="40"  x2="300" y2="340"/>
    <line x1="0"   y1="40"  x2="340" y2="40"/>
    <line x1="0"   y1="100" x2="340" y2="100"/>
    <line x1="0"   y1="160" x2="340" y2="160"/>
    <line x1="0"   y1="220" x2="340" y2="220"/>
    <line x1="0"   y1="340" x2="340" y2="340"/>
  </g>

  <g stroke="#222" stroke-width="1.2" marker-end="url(#arrow9)" fill="none">
    <line x1="0"  y1="280" x2="345" y2="280"/>
    <line x1="60" y1="345" x2="60"  y2="35"/>
  </g>
  <text x="338" y="296" font-size="11" font-style="italic" fill="#666">Re</text>
  <text x="68"  y="44"  font-size="11" font-style="italic" fill="#666">Im</text>

  <g font-size="10" fill="#666" text-anchor="middle">
    <text x="120" y="296">1</text>
    <text x="180" y="296">2</text>
    <text x="240" y="296">3</text>
    <text x="300" y="296">4</text>
  </g>
  <g font-size="10" fill="#666" text-anchor="end">
    <text x="55" y="223">1</text>
    <text x="55" y="163">2</text>
    <text x="55" y="103">3</text>
  </g>

  <line x1="60" y1="280" x2="237" y2="163" stroke="#3060c0" stroke-width="1.6" marker-end="url(#arrow9blue)"/>
  <line x1="60" y1="280" x2="297" y2="103" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow9)"/>
  <line x1="240" y1="160" x2="297" y2="103" stroke="#c03030" stroke-width="2" marker-end="url(#arrow9red)"/>
  <line x1="60" y1="280" x2="117" y2="223" stroke="#208038" stroke-width="2.2" marker-end="url(#arrow9green)"/>

  <circle cx="300" cy="100" r="3" fill="#888"/>
  <circle cx="240" cy="160" r="3" fill="#3060c0"/>
  <circle cx="120" cy="220" r="3.5" fill="#208038"/>

  <g font-size="11" fill="#222">
    <text x="306" y="96">4 + 3i</text>
    <text x="246" y="156">3 + 2i</text>
    <text x="126" y="216" fill="#208038" font-weight="bold">1 + i  (result)</text>
  </g>
  <text x="180" y="365" font-size="11" font-style="italic" fill="#666" text-anchor="middle">red arrow (3+2i → 4+3i) = green result vector from origin</text>

  <line x1="370" y1="40" x2="370" y2="360" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="555" y="24" font-size="13" font-style="italic" fill="#222" text-anchor="middle">(b) (1 + i) + (1 − i) = 2 — parallelogram rule</text>

  <g stroke="#ececec" stroke-width="0.8">
    <line x1="450" y1="40"  x2="450" y2="340"/>
    <line x1="510" y1="40"  x2="510" y2="340"/>
    <line x1="570" y1="40"  x2="570" y2="340"/>
    <line x1="630" y1="40"  x2="630" y2="340"/>
    <line x1="400" y1="100" x2="700" y2="100"/>
    <line x1="400" y1="160" x2="700" y2="160"/>
    <line x1="400" y1="260" x2="700" y2="260"/>
    <line x1="400" y1="320" x2="700" y2="320"/>
  </g>

  <g stroke="#222" stroke-width="1.2" marker-end="url(#arrow9)" fill="none">
    <line x1="395" y1="210" x2="705" y2="210"/>
    <line x1="450" y1="345" x2="450" y2="35"/>
  </g>
  <text x="700" y="226" font-size="11" font-style="italic" fill="#666">Re</text>
  <text x="458" y="44"  font-size="11" font-style="italic" fill="#666">Im</text>

  <g font-size="10" fill="#666" text-anchor="middle">
    <text x="510" y="226">1</text>
    <text x="570" y="226">2</text>
    <text x="630" y="226">3</text>
  </g>
  <g font-size="10" fill="#666" text-anchor="end">
    <text x="446" y="163">1</text>
    <text x="446" y="103">2</text>
    <text x="446" y="263">−1</text>
    <text x="446" y="323">−2</text>
  </g>

  <line x1="450" y1="210" x2="507" y2="153" stroke="#3060c0" stroke-width="1.8" marker-end="url(#arrow9blue)"/>
  <line x1="450" y1="210" x2="507" y2="267" stroke="#c03030" stroke-width="1.8" marker-end="url(#arrow9red)"/>
  <g stroke="#aaa" stroke-width="1" stroke-dasharray="3,3" fill="none">
    <line x1="510" y1="150" x2="567" y2="207"/>
    <line x1="510" y1="270" x2="567" y2="213"/>
  </g>
  <line x1="450" y1="210" x2="567" y2="210" stroke="#208038" stroke-width="2.4" marker-end="url(#arrow9green)"/>

  <circle cx="510" cy="150" r="3" fill="#3060c0"/>
  <circle cx="510" cy="270" r="3" fill="#c03030"/>
  <circle cx="570" cy="210" r="3.5" fill="#208038"/>

  <g font-size="11" fill="#222">
    <text x="516" y="146">1 + i</text>
    <text x="516" y="280">1 − i</text>
    <text x="576" y="206" fill="#208038" font-weight="bold">2  (result)</text>
  </g>
  <text x="555" y="365" font-size="11" font-style="italic" fill="#666" text-anchor="middle">imaginary parts cancel; sum lies on the real axis</text>
</svg>
