<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Georgia, 'Times New Roman', serif">
  <rect width="400" height="400" fill="white"/>

  <!-- Edges -->
  <g stroke="#222" stroke-width="1.6" fill="none" stroke-linecap="round">
    <!-- Outer hexagon (clockwise from top: B C D E J G) -->
    <line x1="200"   y1="20"  x2="355.9" y2="110"/>
    <line x1="355.9" y1="110" x2="355.9" y2="290"/>
    <line x1="355.9" y1="290" x2="200"   y2="380"/>
    <line x1="200"   y1="380" x2="44.1"  y2="290"/>
    <line x1="44.1"  y1="290" x2="44.1"  y2="110"/>
    <line x1="44.1"  y1="110" x2="200"   y2="20"/>

    <!-- Three radial lines through F: each is F-(inner triangle vertex)-(closer hexagon corner) -->
    <line x1="200" y1="200" x2="200"   y2="20"/>   <!-- F - A - B -->
    <line x1="200" y1="200" x2="44.1"  y2="290"/>  <!-- F - H - J -->
    <line x1="200" y1="200" x2="355.9" y2="290"/>  <!-- F - I - D -->

    <!-- Three long curves from inner triangle to opposite hexagon corner -->
    <path d="M 200,140 Q 260,260 200,380"/>          <!-- A — E -->
    <path d="M 148,230 Q 222,118 355.9,110"/>        <!-- H — C -->
    <path d="M 252,230 Q 118,222 44.1,110"/>         <!-- I — G -->
  </g>

  <!-- Vertices -->
  <g fill="#222">
    <!-- Outer hexagon -->
    <circle cx="200"   cy="20"  r="5"/>
    <circle cx="355.9" cy="110" r="5"/>
    <circle cx="355.9" cy="290" r="5"/>
    <circle cx="200"   cy="380" r="5"/>
    <circle cx="44.1"  cy="290" r="5"/>
    <circle cx="44.1"  cy="110" r="5"/>
    <!-- Center -->
    <circle cx="200"   cy="200" r="5"/>
    <!-- Inner triangle -->
    <circle cx="200"   cy="140" r="5"/>
    <circle cx="148"   cy="230" r="5"/>
    <circle cx="252"   cy="230" r="5"/>
  </g>

  <!-- Labels -->
  <g font-size="20" fill="#222">
    <!-- Outer hexagon -->
    <text x="200" y="12"  text-anchor="middle">B</text>
    <text x="370" y="114" text-anchor="start" >C</text>
    <text x="370" y="300" text-anchor="start" >D</text>
    <text x="200" y="398" text-anchor="middle">E</text>
    <text x="30"  y="300" text-anchor="end"   >J</text>
    <text x="30"  y="114" text-anchor="end"   >G</text>
    <!-- Center -->
    <text x="214" y="204" text-anchor="start" >F</text>
    <!-- Inner triangle -->
    <text x="215" y="132" text-anchor="start" >A</text>
    <text x="132" y="226" text-anchor="end"   >H</text>
    <text x="268" y="226" text-anchor="start" >I</text>
  </g>
</svg>
