<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" font-family="Georgia, 'Times New Roman', serif">
  <rect width="400" height="400" fill="white"/>

  <!-- Edges -->
  <g stroke="#222" stroke-width="1.6" fill="none" stroke-linecap="round">
    <!-- Outer pentagon -->
    <line x1="200"   y1="20"    x2="371.2" y2="144.4"/>
    <line x1="371.2" y1="144.4" x2="305.8" y2="345.6"/>
    <line x1="305.8" y1="345.6" x2="94.2"  y2="345.6"/>
    <line x1="94.2"  y1="345.6" x2="28.8"  y2="144.4"/>
    <line x1="28.8"  y1="144.4" x2="200"   y2="20"/>

    <!-- Spokes -->
    <line x1="200"   y1="20"    x2="200"   y2="130"/>
    <line x1="371.2" y1="144.4" x2="266.6" y2="178.4"/>
    <line x1="305.8" y1="345.6" x2="241.1" y2="256.6"/>
    <line x1="94.2"  y1="345.6" x2="158.9" y2="256.6"/>
    <line x1="28.8"  y1="144.4" x2="133.4" y2="178.4"/>

    <!-- Inner pentagram -->
    <line x1="200"   y1="130"   x2="241.1" y2="256.6"/>
    <line x1="200"   y1="130"   x2="158.9" y2="256.6"/>
    <line x1="266.6" y1="178.4" x2="158.9" y2="256.6"/>
    <line x1="266.6" y1="178.4" x2="133.4" y2="178.4"/>
    <line x1="241.1" y1="256.6" x2="133.4" y2="178.4"/>
  </g>

  <!-- Vertices -->
  <g fill="#222">
    <circle cx="200"   cy="20"    r="5"/>
    <circle cx="371.2" cy="144.4" r="5"/>
    <circle cx="305.8" cy="345.6" r="5"/>
    <circle cx="94.2"  cy="345.6" r="5"/>
    <circle cx="28.8"  cy="144.4" r="5"/>
    <circle cx="200"   cy="130"   r="5"/>
    <circle cx="266.6" cy="178.4" r="5"/>
    <circle cx="241.1" cy="256.6" r="5"/>
    <circle cx="158.9" cy="256.6" r="5"/>
    <circle cx="133.4" cy="178.4" r="5"/>
  </g>

  <!-- Labels -->
  <g font-size="20" fill="#222">
    <text x="200" y="12"  text-anchor="middle">A</text>
    <text x="385" y="148" text-anchor="start" >B</text>
    <text x="316" y="365" text-anchor="start" >C</text>
    <text x="84"  y="365" text-anchor="end"   >D</text>
    <text x="15"  y="148" text-anchor="end"   >E</text>
    <text x="213" y="125" text-anchor="start" >F</text>
    <text x="280" y="174" text-anchor="start" >G</text>
    <text x="252" y="272" text-anchor="start" >H</text>
    <text x="148" y="272" text-anchor="end"   >I</text>
    <text x="120" y="174" text-anchor="end"   >J</text>
  </g>
</svg>
