<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" font-family="Georgia, 'Times New Roman', serif">
  <rect width="480" height="360" fill="white"/>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <!-- Shaded region under y=1/t from t=a (=1.5) to t=b (=3.5) -->
  <path d="M 164,300 L 164,255 L 183,261 L 202,266 L 221,270 L 240,273 L 259,275 L 278,278 L 297,279 L 316,281 L 316,300 Z"
        fill="#dde3f0" stroke="none"/>

  <!-- Vertical dashed guide lines at t=a and t=b -->
  <g stroke="#666" stroke-width="1.0" stroke-dasharray="4,3" fill="none">
    <line x1="164" y1="255" x2="164" y2="300"/>
    <line x1="316" y1="281" x2="316" y2="300"/>
  </g>

  <!-- Curve y = 1/t (sampled densely on the left, coarser on the right) -->
  <polyline points="69,30 73,75 77,107 80,131 84,150 88,165 92,177 96,188 99,196 103,204 107,210 111,216 115,221 118,225 122,229 126,233 134,239 141,244 149,248 164,255 183,261 202,266 221,270 240,273 259,275 278,278 297,279 316,281 335,282 354,283 392,285 430,287"
            fill="none" stroke="#222" stroke-width="1.6"/>

  <!-- Axes -->
  <g stroke="#222" stroke-width="1.3" fill="none">
    <line x1="40"  y1="300" x2="455" y2="300" marker-end="url(#arrowhead)"/>
    <line x1="50"  y1="320" x2="50"  y2="20"  marker-end="url(#arrowhead)"/>
  </g>

  <!-- Tick marks -->
  <g stroke="#222" stroke-width="1.2">
    <!-- x-axis ticks at t = 1, 2, 3, 4, 5 -->
    <line x1="126" y1="296" x2="126" y2="304"/>
    <line x1="202" y1="296" x2="202" y2="304"/>
    <line x1="278" y1="296" x2="278" y2="304"/>
    <line x1="354" y1="296" x2="354" y2="304"/>
    <line x1="430" y1="296" x2="430" y2="304"/>
    <!-- y-axis ticks at y = 1, 2, 3, 4 -->
    <line x1="46" y1="233" x2="54" y2="233"/>
    <line x1="46" y1="165" x2="54" y2="165"/>
    <line x1="46" y1="98"  x2="54" y2="98"/>
    <line x1="46" y1="30"  x2="54" y2="30"/>
  </g>

  <!-- Dots at the strip endpoints on the curve -->
  <g fill="#222">
    <circle cx="164" cy="255" r="3"/>
    <circle cx="316" cy="281" r="3"/>
  </g>

  <!-- Tick labels -->
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="126" y="318">1</text>
    <text x="202" y="318">2</text>
    <text x="278" y="318">3</text>
    <text x="354" y="318">4</text>
    <text x="430" y="318">5</text>
  </g>
  <g font-size="13" fill="#222" text-anchor="end">
    <text x="42" y="238">1</text>
    <text x="42" y="170">2</text>
    <text x="42" y="103">3</text>
    <text x="42" y="35">4</text>
  </g>

  <!-- Axis labels -->
  <g font-size="15" fill="#222" font-style="italic">
    <text x="465" y="305" text-anchor="start">t</text>
    <text x="50"  y="14"  text-anchor="middle">y</text>
  </g>

  <!-- a, b labels under the dashed lines -->
  <g font-size="16" fill="#222" font-style="italic" text-anchor="middle">
    <text x="164" y="338">a</text>
    <text x="316" y="338">b</text>
  </g>

  <!-- Curve label -->
  <g font-size="15" fill="#222" font-style="italic">
    <text x="385" y="268" text-anchor="middle">y = 1/t</text>
  </g>

  <!-- Strip area label -->
  <g font-size="13" fill="#222" text-anchor="middle">
    <text x="240" y="293">area = ln b − ln a</text>
  </g>
</svg>
