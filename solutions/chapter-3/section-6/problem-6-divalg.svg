<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 916" width="720" height="916" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="916" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="80" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">TO PROVE &#8212; a unique existence claim</text>
  <text x="380" y="58" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#8704; a &#8712; &#8484;, &#8704; b &#8712; &#8484;&#8314;, &#8707;! q, r &#8712; &#8484; with a = qb + r and 0 &#8804; r &lt; b</text>
  <text x="380" y="80" font-size="11" fill="#555" text-anchor="middle" font-style="italic">&#8707;! means two separate jobs: produce a pair, then show no second pair can exist</text>

  <text x="34" y="154" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE MULTIPLES OF b TILE THE INTEGERS</text>
  <text x="34" y="170" font-size="11" fill="#555">With b = 5, every integer lies in exactly one block [qb, (q+1)b). Here a = &#8722;17 lies in [&#8722;20, &#8722;15).</text>
  <line x1="179.6" y1="214" x2="564.4" y2="214" stroke="#555" stroke-width="1.3"/><rect x="224.0" y="206" width="37.0" height="16" fill="#dff0e2" opacity="0.9"/><line x1="187.0" y1="204" x2="187.0" y2="224" stroke="#3b5b9b" stroke-width="1.6"/><text x="187.0" y="240" font-size="10.5" fill="#3b5b9b" text-anchor="middle">-25</text><text x="187.0" y="198" font-size="9" fill="#8fa3c8" text-anchor="middle">-5b</text><line x1="224.0" y1="204" x2="224.0" y2="224" stroke="#3b5b9b" stroke-width="1.6"/><text x="224.0" y="240" font-size="10.5" fill="#3b5b9b" text-anchor="middle">-20</text><text x="224.0" y="198" font-size="9" fill="#8fa3c8" text-anchor="middle">-4b</text><line x1="261.0" y1="204" x2="261.0" y2="224" stroke="#3b5b9b" stroke-width="1.6"/><text x="261.0" y="240" font-size="10.5" fill="#3b5b9b" text-anchor="middle">-15</text><text x="261.0" y="198" font-size="9" fill="#8fa3c8" text-anchor="middle">-3b</text><line x1="298.0" y1="204" x2="298.0" y2="224" stroke="#3b5b9b" stroke-width="1.6"/><text x="298.0" y="240" font-size="10.5" fill="#3b5b9b" text-anchor="middle">-10</text><text x="298.0" y="198" font-size="9" fill="#8fa3c8" text-anchor="middle">-2b</text><line x1="335.0" y1="204" x2="335.0" y2="224" stroke="#3b5b9b" stroke-width="1.6"/><text x="335.0" y="240" font-size="10.5" fill="#3b5b9b" text-anchor="middle">-5</text><text x="335.0" y="198" font-size="9" fill="#8fa3c8" text-anchor="middle">-1b</text><line x1="372.0" y1="204" x2="372.0" y2="224" stroke="#3b5b9b" stroke-width="1.6"/><text x="372.0" y="240" font-size="10.5" fill="#3b5b9b" text-anchor="middle">0</text><text x="372.0" y="198" font-size="9" fill="#8fa3c8" text-anchor="middle">0b</text><line x1="409.0" y1="204" x2="409.0" y2="224" stroke="#3b5b9b" stroke-width="1.6"/><text x="409.0" y="240" font-size="10.5" fill="#3b5b9b" text-anchor="middle">5</text><text x="409.0" y="198" font-size="9" fill="#8fa3c8" text-anchor="middle">1b</text><line x1="446.0" y1="204" x2="446.0" y2="224" stroke="#3b5b9b" stroke-width="1.6"/><text x="446.0" y="240" font-size="10.5" fill="#3b5b9b" text-anchor="middle">10</text><text x="446.0" y="198" font-size="9" fill="#8fa3c8" text-anchor="middle">2b</text><line x1="483.0" y1="204" x2="483.0" y2="224" stroke="#3b5b9b" stroke-width="1.6"/><text x="483.0" y="240" font-size="10.5" fill="#3b5b9b" text-anchor="middle">15</text><text x="483.0" y="198" font-size="9" fill="#8fa3c8" text-anchor="middle">3b</text><line x1="520.0" y1="204" x2="520.0" y2="224" stroke="#3b5b9b" stroke-width="1.6"/><text x="520.0" y="240" font-size="10.5" fill="#3b5b9b" text-anchor="middle">20</text><text x="520.0" y="198" font-size="9" fill="#8fa3c8" text-anchor="middle">4b</text><line x1="557.0" y1="204" x2="557.0" y2="224" stroke="#3b5b9b" stroke-width="1.6"/><text x="557.0" y="240" font-size="10.5" fill="#3b5b9b" text-anchor="middle">25</text><text x="557.0" y="198" font-size="9" fill="#8fa3c8" text-anchor="middle">5b</text><circle cx="246.2" cy="214" r="5.5" fill="#9b2c2c"/><text x="246.2" y="182" font-size="12" fill="#9b2c2c" text-anchor="middle" font-weight="bold">a = &#8722;17</text><line x1="224.0" y1="254" x2="246.2" y2="254" stroke="#1f6b34" stroke-width="2"/><line x1="224.0" y1="249" x2="224.0" y2="259" stroke="#1f6b34" stroke-width="1.6"/><line x1="246.2" y1="249" x2="246.2" y2="259" stroke="#1f6b34" stroke-width="1.6"/><text x="235.1" y="274" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">r = 3</text><text x="224.0" y="292" font-size="11" fill="#1f6b34" text-anchor="middle">qb = (&#8722;4)(5)</text>

  <text x="26" y="352" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE TWO HALVES OF THE PROOF</text>
  <rect x="26" y="368" width="326" height="240" rx="5" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.6"/><text x="189.0" y="391" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">EXISTENCE&#160; &#8212;&#160; via well-ordering</text><text x="39" y="418" font-size="10.8" fill="#333">S = &#123; a &#8722; qb : q &#8712; &#8484;, a &#8722; qb &#8805; 0 &#125;</text><text x="39" y="437" font-size="10.8" fill="#333"></text><text x="39" y="456" font-size="10.8" fill="#333">S &#8838; &#8469;, and S &#8800; &#8709; because q = &#8722;|a|</text><text x="39" y="475" font-size="10.8" fill="#333">gives a + |a|b &#8805; 0.</text><text x="39" y="494" font-size="10.8" fill="#333"></text><text x="39" y="513" font-size="10.8" fill="#333">By WOP, S has a least element</text><text x="39" y="532" font-size="10.8" fill="#333">r = a &#8722; qb &#8805; 0.</text><text x="39" y="551" font-size="10.8" fill="#333"></text><text x="39" y="570" font-size="10.8" fill="#333">If r &#8805; b then r &#8722; b = a &#8722; (q+1)b</text><text x="39" y="589" font-size="10.8" fill="#333">is a smaller member of S &#8212;</text><text x="39" y="608" font-size="10.8" fill="#333">impossible. So 0 &#8804; r &lt; b.</text><rect x="368" y="368" width="326" height="240" rx="5" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.6"/><text x="531.0" y="391" font-size="12.5" fill="#3b5b9b" text-anchor="middle" font-weight="bold">UNIQUENESS&#160; &#8212;&#160; via a size bound</text><text x="381" y="418" font-size="10.8" fill="#333">Suppose a = q&#8321;b + r&#8321; = q&#8322;b + r&#8322;</text><text x="381" y="437" font-size="10.8" fill="#333">with 0 &#8804; r&#8321;, r&#8322; &lt; b.</text><text x="381" y="456" font-size="10.8" fill="#333"></text><text x="381" y="475" font-size="10.8" fill="#333">Then (q&#8321; &#8722; q&#8322;)b = r&#8322; &#8722; r&#8321;.</text><text x="381" y="494" font-size="10.8" fill="#333"></text><text x="381" y="513" font-size="10.8" fill="#333">From 0 &#8804; r&#8321;, r&#8322; &lt; b we get</text><text x="381" y="532" font-size="10.8" fill="#333">|r&#8322; &#8722; r&#8321;| &lt; b, yet r&#8322; &#8722; r&#8321; is a</text><text x="381" y="551" font-size="10.8" fill="#333">multiple of b. The only such</text><text x="381" y="570" font-size="10.8" fill="#333">multiple is 0, so r&#8321; = r&#8322;,</text><text x="381" y="589" font-size="10.8" fill="#333">and then q&#8321; = q&#8322; since b &#8800; 0.</text>

  <rect x="18" y="636" width="684" height="124" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="656" font-size="11.5" fill="#b06a10" font-weight="bold">THE SET MUST LIVE IN &#8469;, NOT &#8484;</text>
  <text x="40" y="678" font-size="11.5" fill="#333">S is defined with the condition a &#8722; qb &#8805; 0 precisely so that it is a set of <tspan font-style="italic">natural</tspan> numbers.</text>
  <text x="40" y="696" font-size="11.5" fill="#333">Drop that condition and S becomes all of &#123; a &#8722; qb &#125;, which runs off to &#8722;&#8734; and has no least element &#8212;</text>
  <text x="40" y="714" font-size="11.5" fill="#333">exactly the failure of Problem 3. The well-ordering principle would then supply nothing.</text>
  <text x="40" y="740" font-size="11" fill="#555" font-style="italic">Non-emptiness is not automatic either: q = &#8722;|a| is the standard choice, giving a + |a|b &#8805; 0 since b &#8805; 1.</text>

  <rect x="18" y="774" width="684" height="126" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="794" font-size="11.5" fill="#9b2c2c" font-weight="bold">THE BOUND 0 &#8804; r &lt; b IS WHAT MAKES THE PAIR UNIQUE</text>
  <text x="40" y="816" font-size="11.5" fill="#333">Without it there are infinitely many decompositions. For a = 17, b = 5:</text>
  <text x="40" y="838" font-size="11.5" fill="#333">(q, r) = (0, 17), (1, 12), (2, 7), <tspan font-weight="bold" fill="#1f6b34">(3, 2)</tspan>, (4, &#8722;3), (5, &#8722;8), &#8230;&#160;&#160;&#8212;&#160; only one has 0 &#8804; r &lt; 5.</text>
  <text x="40" y="864" font-size="11.5" fill="#333">The bound also forces a <tspan font-style="italic">non-negative</tspan> remainder for negative a: &#8722;17 = (&#8722;4)&#183;5 + 3, not (&#8722;3)&#183;5 + (&#8722;2).</text>
  <text x="40" y="886" font-size="11" fill="#555" font-style="italic">Python&#8217;s divmod follows the theorem; C-style truncating division does not. Checked on 300000 random pairs.</text>
</svg>