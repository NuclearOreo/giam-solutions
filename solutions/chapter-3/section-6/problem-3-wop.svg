<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 782" width="720" height="782" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="782" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="80" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">AN EXISTENTIAL CLAIM</text>
  <text x="430" y="34" font-size="13" fill="#1f3a68" text-anchor="middle">some subset of &#8484; has no smallest element</text>
  <text x="360" y="60" font-size="16" fill="#9b2c2c" text-anchor="middle" font-weight="bold">Take the subset &#8484; itself.</text>
  <text x="360" y="82" font-size="11.5" fill="#333" text-anchor="middle">For any n &#8712; &#8484;, the integer n &#8722; 1 is also in &#8484; and is smaller &#8212; so n is not least.</text>

  <text x="34" y="166" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE INTEGERS HAVE NO LEFT END</text>
  <line x1="70" y1="224" x2="660" y2="224" stroke="#555" stroke-width="1.4"/><polygon points="70,224 83,219 83,229" fill="#9b2c2c"/><polygon points="660,224 647,219 647,229" fill="#555"/><text x="100" y="229" font-size="15" fill="#9b2c2c">&#8943;</text><text x="626" y="229" font-size="15" fill="#555">&#8943;</text><text x="92" y="198" font-size="11.5" fill="#9b2c2c" font-weight="bold">no leftmost point</text><text x="92" y="214" font-size="10.5" fill="#9b2c2c">whatever n you pick, n &#8722; 1 is further left</text><line x1="117" y1="215" x2="117" y2="233" stroke="#3b5b9b" stroke-width="1.4"/><circle cx="117" cy="224" r="5" fill="#3b5b9b"/><text x="117" y="250" font-size="11.5" fill="#333" text-anchor="middle">-4</text><line x1="179" y1="215" x2="179" y2="233" stroke="#3b5b9b" stroke-width="1.4"/><circle cx="179" cy="224" r="5" fill="#3b5b9b"/><text x="179" y="250" font-size="11.5" fill="#333" text-anchor="middle">-3</text><line x1="241" y1="215" x2="241" y2="233" stroke="#3b5b9b" stroke-width="1.4"/><circle cx="241" cy="224" r="5" fill="#3b5b9b"/><text x="241" y="250" font-size="11.5" fill="#333" text-anchor="middle">-2</text><line x1="303" y1="215" x2="303" y2="233" stroke="#3b5b9b" stroke-width="1.4"/><circle cx="303" cy="224" r="5" fill="#3b5b9b"/><text x="303" y="250" font-size="11.5" fill="#333" text-anchor="middle">-1</text><line x1="365" y1="215" x2="365" y2="233" stroke="#3b5b9b" stroke-width="1.4"/><circle cx="365" cy="224" r="5" fill="#3b5b9b"/><text x="365" y="250" font-size="11.5" fill="#333" text-anchor="middle">0</text><line x1="427" y1="215" x2="427" y2="233" stroke="#3b5b9b" stroke-width="1.4"/><circle cx="427" cy="224" r="5" fill="#3b5b9b"/><text x="427" y="250" font-size="11.5" fill="#333" text-anchor="middle">1</text><line x1="489" y1="215" x2="489" y2="233" stroke="#3b5b9b" stroke-width="1.4"/><circle cx="489" cy="224" r="5" fill="#3b5b9b"/><text x="489" y="250" font-size="11.5" fill="#333" text-anchor="middle">2</text><line x1="551" y1="215" x2="551" y2="233" stroke="#3b5b9b" stroke-width="1.4"/><circle cx="551" cy="224" r="5" fill="#3b5b9b"/><text x="551" y="250" font-size="11.5" fill="#333" text-anchor="middle">3</text><line x1="613" y1="215" x2="613" y2="233" stroke="#3b5b9b" stroke-width="1.4"/><circle cx="613" cy="224" r="5" fill="#3b5b9b"/><text x="613" y="250" font-size="11.5" fill="#333" text-anchor="middle">4</text>

  <text x="26" y="300" font-size="11.5" fill="#3b5b9b" font-weight="bold">WHERE THE PRINCIPLE STANDS, IN THREE SETTINGS</text>
  <rect x="26" y="322" width="214" height="150" rx="5" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.5"/><text x="133.0" y="344" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">&#8469;&#160;&#8212;&#160;WOP holds</text><text x="37" y="370" font-size="10.6" fill="#333">Every non-empty subset</text><text x="37" y="388" font-size="10.6" fill="#333">has a least element.</text><text x="37" y="406" font-size="10.6" fill="#333"></text><text x="37" y="424" font-size="10.6" fill="#333">This is the Well-Ordering</text><text x="37" y="442" font-size="10.6" fill="#333">Principle, equivalent to</text><text x="37" y="460" font-size="10.6" fill="#333">induction.</text><rect x="253" y="322" width="214" height="150" rx="5" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.5"/><text x="360.0" y="344" font-size="12.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">&#8484;&#160;&#8212;&#160;WOP fails</text><text x="264" y="370" font-size="10.6" fill="#333">&#8484; itself has no least</text><text x="264" y="388" font-size="10.6" fill="#333">element, and neither do</text><text x="264" y="406" font-size="10.6" fill="#333">the negatives or the evens.</text><text x="264" y="424" font-size="10.6" fill="#333"></text><text x="264" y="442" font-size="10.6" fill="#333">But it is rescued by adding</text><text x="264" y="460" font-size="10.6" fill="#333">&#8220;bounded below&#8221;.</text><rect x="480" y="322" width="214" height="150" rx="5" fill="#fff8ec" stroke="#b06a10" stroke-width="1.5"/><text x="587.0" y="344" font-size="12.5" fill="#b06a10" text-anchor="middle" font-weight="bold">&#8477;&#160;&#8212;&#160;fails badly</text><text x="491" y="370" font-size="10.6" fill="#333">(0, &#8734;) is bounded below</text><text x="491" y="388" font-size="10.6" fill="#333">by 0 and still has no</text><text x="491" y="406" font-size="10.6" fill="#333">least element.</text><text x="491" y="424" font-size="10.6" fill="#333"></text><text x="491" y="442" font-size="10.6" fill="#333">Bounding below does not</text><text x="491" y="460" font-size="10.6" fill="#333">rescue anything here.</text>

  <rect x="18" y="512" width="684" height="126" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="532" font-size="11.5" fill="#1f6b34" font-weight="bold">WHAT SURVIVES &#8212; THE REPAIRED THEOREM</text>
  <text x="360" y="558" font-size="13" fill="#1f3a68" text-anchor="middle" font-weight="bold">Every non-empty subset of &#8484; that is bounded below has a least element.</text>
  <text x="40" y="584" font-size="11.5" fill="#333">The failure is not about &#8484; being &#8220;bigger&#8221; than &#8469; but about its having no floor. Supply one and the</text>
  <text x="40" y="602" font-size="11.5" fill="#333">principle returns, because from any starting integer only finitely many strictly smaller ones lie above</text>
  <text x="40" y="620" font-size="11.5" fill="#333">the bound &#8212; from 7 with lower bound &#8722;3 there are just eleven values available.</text>

  <rect x="18" y="654" width="684" height="112" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.2"/>
  <text x="34" y="674" font-size="11.5" fill="#3b5b9b" font-weight="bold">TWO THINGS THE WITNESS MUST BE</text>
  <text x="40" y="698" font-size="11.5" fill="#333"><tspan font-weight="bold">Infinite.</tspan>&#160; Every finite non-empty set of integers has a least element, so no finite set can serve.</text>
  <text x="40" y="722" font-size="11.5" fill="#333"><tspan font-weight="bold">Unbounded below.</tspan>&#160; By the repaired theorem above, a bounded-below set always has a minimum.</text>
  <text x="40" y="748" font-size="11" fill="#555" font-style="italic">Both conditions are met by &#8484;, by the negative integers, and by the even integers &#8212; any of the three will do.</text>
</svg>