<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" width="700" height="540" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="540" fill="white"/>

  <text x="350" y="22" font-size="12.5" font-style="italic" fill="#444" text-anchor="middle">Expand the square, then group so that a factor of 4 can be pulled out front.</text>

  <!-- the computation -->
  <rect x="24" y="38" width="652" height="118" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="40" y="58" font-size="11.5" fill="#1a3a63" font-weight="bold">UNPACK, COMPUTE, REPACK</text>
  <text x="60" y="80" font-size="12" fill="#222">x is odd  ⟹  x = 2m + 1,  m ∈ ℤ</text>
  <text x="350" y="106" font-size="15" fill="#222" text-anchor="middle">x² = (2m + 1)² = 4m² + 4m + 1 = 4(m² + m) + 1</text>
  <text x="60" y="132" font-size="12" fill="#222">m² + m ∈ ℤ,  so  x² = 4k + 1  with  k = m² + m</text>
  <text x="350" y="150" font-size="11.5" fill="#1b5e20" text-anchor="middle" font-weight="bold">that is the theorem  ∎</text>

  <!-- the bonus -->
  <rect x="24" y="172" width="652" height="132" fill="#dfeadd" stroke="#8ab88a" stroke-width="1.5"/>
  <text x="350" y="192" font-size="12.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">But look again at k — the proof gives more than was asked</text>
  <text x="350" y="216" font-size="13.5" fill="#222" text-anchor="middle">k = m² + m = <tspan font-weight="bold">m(m + 1)</tspan></text>
  <text x="350" y="238" font-size="11.5" fill="#222" text-anchor="middle">a product of two <tspan font-style="italic">consecutive</tspan> integers — one of them must be even, so k is even</text>
  <text x="350" y="262" font-size="12" fill="#222" text-anchor="middle">write k = 2j.  Then  x² = 4(2j) + 1 = <tspan font-weight="bold">8j + 1</tspan></text>
  <text x="350" y="288" font-size="12" fill="#1b5e20" text-anchor="middle" font-weight="bold">every odd square is 1 more than a multiple of 8, not merely of 4</text>

  <!-- table of examples -->
  <text x="350" y="330" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">The first few odd squares</text>

  <g font-size="11.5" font-weight="bold" fill="#222" text-anchor="middle">
    <text x="130" y="356">x</text>
    <text x="230" y="356">x²</text>
    <text x="360" y="356">as 4k + 1</text>
    <text x="530" y="356" fill="#1b5e20">as 8j + 1</text>
  </g>
  <line x1="80" y1="364" x2="620" y2="364" stroke="#999" stroke-width="0.9"/>
  <g font-size="11.5" text-anchor="middle">
    <text x="130" y="384">1</text><text x="230" y="384">1</text>
    <text x="360" y="384">4(0) + 1</text><text x="530" y="384" fill="#1b5e20">8(0) + 1</text>
    <text x="130" y="406">3</text><text x="230" y="406">9</text>
    <text x="360" y="406">4(2) + 1</text><text x="530" y="406" fill="#1b5e20">8(1) + 1</text>
    <text x="130" y="428">5</text><text x="230" y="428">25</text>
    <text x="360" y="428">4(6) + 1</text><text x="530" y="428" fill="#1b5e20">8(3) + 1</text>
    <text x="130" y="450">7</text><text x="230" y="450">49</text>
    <text x="360" y="450">4(12) + 1</text><text x="530" y="450" fill="#1b5e20">8(6) + 1</text>
    <text x="130" y="472">9</text><text x="230" y="472">81</text>
    <text x="360" y="472">4(20) + 1</text><text x="530" y="472" fill="#1b5e20">8(10) + 1</text>
  </g>
  <line x1="80" y1="482" x2="620" y2="482" stroke="#999" stroke-width="0.9"/>
  <text x="350" y="502" font-size="10.5" font-style="italic" fill="#666" text-anchor="middle">note the k column is always even — that is m(m+1) at work</text>

  <text x="350" y="526" font-size="11" fill="#8a3b12" text-anchor="middle">Verified for every odd x in [−99, 99]: x² ≡ 1 (mod 4) and also x² ≡ 1 (mod 8).</text>
</svg>
