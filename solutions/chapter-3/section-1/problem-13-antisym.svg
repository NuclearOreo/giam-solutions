<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" width="700" height="540" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="540" fill="white"/>

  <text x="350" y="22" font-size="12.5" font-style="italic" fill="#444" text-anchor="middle">Substituting each hypothesis into the other traps the two multipliers into a product of 1.</text>

  <!-- the main proof -->
  <rect x="24" y="38" width="652" height="146" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="40" y="58" font-size="11.5" fill="#1a3a63" font-weight="bold">The proof</text>
  <text x="60" y="80" font-size="12" fill="#222">a | b  ⟹  b = ak,  k ∈ ℤ</text>
  <text x="390" y="80" font-size="12" fill="#222">b | a  ⟹  a = bm,  m ∈ ℤ</text>
  <text x="350" y="106" font-size="13.5" fill="#222" text-anchor="middle">a = bm = (ak)m = a(km)</text>
  <text x="350" y="130" font-size="12.5" fill="#222" text-anchor="middle">a &gt; 0, so a ≠ 0 and we may cancel:   <tspan font-weight="bold">km = 1</tspan></text>
  <text x="350" y="154" font-size="12" fill="#222" text-anchor="middle">the only integers with km = 1 are  k = m = 1  and  k = m = −1</text>
  <text x="350" y="176" font-size="12" fill="#1b5e20" text-anchor="middle" font-weight="bold">positivity rules out k = −1, so k = 1 and b = a  ∎</text>

  <!-- where positivity is used -->
  <text x="350" y="216" font-size="12.5" font-weight="bold" fill="#222" text-anchor="middle">Positivity is used twice</text>

  <rect x="40" y="228" width="300" height="76" fill="#dfeadd" stroke="#bcd9bc"/>
  <text x="190" y="248" font-size="11.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">first: to cancel</text>
  <text x="190" y="270" font-size="11.5" fill="#222" text-anchor="middle">a &gt; 0 gives a ≠ 0,</text>
  <text x="190" y="290" font-size="11.5" fill="#222" text-anchor="middle">which licenses a·1 = a·(km) ⟹ km = 1</text>

  <rect x="360" y="228" width="300" height="76" fill="#dfeadd" stroke="#bcd9bc"/>
  <text x="510" y="248" font-size="11.5" font-weight="bold" fill="#1b5e20" text-anchor="middle">second: to pick the sign</text>
  <text x="510" y="270" font-size="11.5" fill="#222" text-anchor="middle">if k = −1 then b = −a &lt; 0,</text>
  <text x="510" y="290" font-size="11.5" fill="#222" text-anchor="middle">contradicting b &gt; 0</text>

  <!-- what fails without it -->
  <rect x="24" y="318" width="652" height="60" fill="#fbe4da" stroke="#e0b8a6"/>
  <text x="350" y="338" font-size="12" font-weight="bold" fill="#8a3b12" text-anchor="middle">Drop positivity and the theorem fails — you only get a = ±b</text>
  <text x="350" y="360" font-size="12" fill="#222" text-anchor="middle">3 | −3  and  −3 | 3,  yet  3 ≠ −3     (60 such pairs among nonzero |x| ≤ 30)</text>

  <!-- the partial order completed -->
  <text x="350" y="404" font-size="12.5" font-weight="bold" fill="#222" text-anchor="middle">This completes the partial order begun in Problem 11</text>

  <g font-size="11.5" font-weight="bold" fill="#222">
    <text x="90"  y="430">property</text>
    <text x="290" y="430">statement</text>
    <text x="560" y="430">established in</text>
  </g>
  <line x1="60" y1="438" x2="650" y2="438" stroke="#999" stroke-width="0.9"/>
  <g font-size="11.5">
    <text x="90" y="458" fill="#333">reflexive</text>
    <text x="290" y="458" fill="#222">a | a</text>
    <text x="560" y="458" fill="#666">immediate (k = 1)</text>

    <text x="90" y="480" fill="#333">transitive</text>
    <text x="290" y="480" fill="#222">a | b and b | c ⟹ a | c</text>
    <text x="560" y="480" fill="#666">Problem 11</text>

    <rect x="60" y="490" width="590" height="24" fill="#dfeadd"/>
    <text x="90" y="507" fill="#1b5e20" font-weight="bold">antisymmetric</text>
    <text x="290" y="507" fill="#222" font-weight="bold">a | b and b | a ⟹ a = b</text>
    <text x="560" y="507" fill="#1b5e20" font-weight="bold">this problem</text>
  </g>
  <line x1="60" y1="518" x2="650" y2="518" stroke="#999" stroke-width="0.9"/>
  <text x="350" y="534" font-size="10.5" font-style="italic" fill="#666" text-anchor="middle">so divisibility really is a partial order on the positive integers</text>
</svg>
