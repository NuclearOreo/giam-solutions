<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 830" width="720" height="830" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="830" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="72" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE CONJECTURE (false)</text>
  <text x="420" y="33" font-size="13.5" fill="#1f3a68" text-anchor="middle">for all integers a, b, c&#160;:&#160; a | bc&#160; &#8658; &#160;a | b&#160; or&#160; a | c</text>
  <text x="420" y="55" font-size="11" fill="#555" text-anchor="middle" font-style="italic">true when a is prime &#8212; Euclid&#8217;s lemma &#8212; and the conjecture is the careless generalisation of it</text>
  <text x="420" y="75" font-size="11" fill="#555" text-anchor="middle" font-style="italic">to disprove a universal claim, one counterexample suffices</text>

  <rect x="18" y="96" width="684" height="96" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.4"/>
  <text x="34" y="116" font-size="11.5" fill="#9b2c2c" font-weight="bold">THE COUNTEREXAMPLE</text>
  <text x="360" y="144" font-size="18" fill="#9b2c2c" text-anchor="middle" font-weight="bold">a = 4,&#160;&#160; b = 2,&#160;&#160; c = 2</text>
  <text x="360" y="170" font-size="13" fill="#333" text-anchor="middle">bc = 4, so 4 | bc&#160; &#10003;&#160;&#160;&#160;&#160;but 4 &#8740; 2&#160; &#10007;&#160;&#160;&#160;&#160;and 4 &#8740; 2&#160; &#10007;</text>
  <text x="360" y="186" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">the hypothesis holds, both halves of the conclusion fail &#8212; the claim is dead</text>

  <text x="34" y="216" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE WHOLE PICTURE IN EXPONENTS</text>
  <text x="34" y="238" font-size="11.5" fill="#333">Write a = 2&#7504;, b = 2&#690;, c = 2&#7503;. Then bc = 2&#690;&#8314;&#7503;, and every divisibility becomes a comparison of exponents:</text>
  <text x="34" y="258" font-size="12.5" fill="#1f3a68">a | bc &#8660; j + k &#8805; m&#160;&#160;&#160;&#160;&#160;&#160;a | b &#8660; j &#8805; m&#160;&#160;&#160;&#160;&#160;&#160;a | c &#8660; k &#8805; m</text>
  <text x="34" y="278" font-size="11.5" fill="#333">The grid below fixes m = 4, that is a = 16, and marks every pair of exponents (j, k).</text>

  <text x="34" y="330" font-size="11" fill="#666">&#10007;&#160; grey:</text>
  <text x="34" y="346" font-size="11" fill="#666">j + k &lt; m, so</text>
  <text x="34" y="362" font-size="11" fill="#666">a does not even</text>
  <text x="34" y="378" font-size="11" fill="#666">divide bc &#8212; the</text>
  <text x="34" y="394" font-size="11" fill="#666">claim says nothing.</text>

  <text x="34" y="426" font-size="11" fill="#1f6b34">&#10003;&#160; green:</text>
  <text x="34" y="442" font-size="11" fill="#1f6b34">a | bc and the</text>
  <text x="34" y="458" font-size="11" fill="#1f6b34">conclusion holds.</text>

  <text x="34" y="490" font-size="11" fill="#9b2c2c">&#9679;&#160; red:</text>
  <text x="34" y="506" font-size="11" fill="#9b2c2c">a | bc but a divides</text>
  <text x="34" y="522" font-size="11" fill="#9b2c2c">neither b nor c.</text>
  <text x="34" y="538" font-size="11" fill="#9b2c2c">Every red cell is a</text>
  <text x="34" y="554" font-size="11" fill="#9b2c2c">counterexample.</text>

  <rect x="300" y="520" width="42" height="42" rx="3" fill="#f4f4f6" stroke="#dcdce2" stroke-width="1"/><text x="321.0" y="546.0" font-size="14" fill="#aaa" text-anchor="middle">&#10007;</text><rect x="300" y="476" width="42" height="42" rx="3" fill="#f4f4f6" stroke="#dcdce2" stroke-width="1"/><text x="321.0" y="502.0" font-size="14" fill="#aaa" text-anchor="middle">&#10007;</text><rect x="300" y="432" width="42" height="42" rx="3" fill="#f4f4f6" stroke="#dcdce2" stroke-width="1"/><text x="321.0" y="458.0" font-size="14" fill="#aaa" text-anchor="middle">&#10007;</text><rect x="300" y="388" width="42" height="42" rx="3" fill="#f4f4f6" stroke="#dcdce2" stroke-width="1"/><text x="321.0" y="414.0" font-size="14" fill="#aaa" text-anchor="middle">&#10007;</text><rect x="300" y="344" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="321.0" y="370.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="300" y="300" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="321.0" y="326.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="344" y="520" width="42" height="42" rx="3" fill="#f4f4f6" stroke="#dcdce2" stroke-width="1"/><text x="365.0" y="546.0" font-size="14" fill="#aaa" text-anchor="middle">&#10007;</text><rect x="344" y="476" width="42" height="42" rx="3" fill="#f4f4f6" stroke="#dcdce2" stroke-width="1"/><text x="365.0" y="502.0" font-size="14" fill="#aaa" text-anchor="middle">&#10007;</text><rect x="344" y="432" width="42" height="42" rx="3" fill="#f4f4f6" stroke="#dcdce2" stroke-width="1"/><text x="365.0" y="458.0" font-size="14" fill="#aaa" text-anchor="middle">&#10007;</text><rect x="344" y="388" width="42" height="42" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="2.4"/><text x="365.0" y="414.0" font-size="14" fill="#9b2c2c" text-anchor="middle">&#9679;</text><rect x="344" y="344" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="365.0" y="370.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="344" y="300" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="365.0" y="326.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="388" y="520" width="42" height="42" rx="3" fill="#f4f4f6" stroke="#dcdce2" stroke-width="1"/><text x="409.0" y="546.0" font-size="14" fill="#aaa" text-anchor="middle">&#10007;</text><rect x="388" y="476" width="42" height="42" rx="3" fill="#f4f4f6" stroke="#dcdce2" stroke-width="1"/><text x="409.0" y="502.0" font-size="14" fill="#aaa" text-anchor="middle">&#10007;</text><rect x="388" y="432" width="42" height="42" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="2.4"/><text x="409.0" y="458.0" font-size="14" fill="#9b2c2c" text-anchor="middle">&#9679;</text><rect x="388" y="388" width="42" height="42" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="2.4"/><text x="409.0" y="414.0" font-size="14" fill="#9b2c2c" text-anchor="middle">&#9679;</text><rect x="388" y="344" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="409.0" y="370.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="388" y="300" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="409.0" y="326.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="432" y="520" width="42" height="42" rx="3" fill="#f4f4f6" stroke="#dcdce2" stroke-width="1"/><text x="453.0" y="546.0" font-size="14" fill="#aaa" text-anchor="middle">&#10007;</text><rect x="432" y="476" width="42" height="42" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="2.4"/><text x="453.0" y="502.0" font-size="14" fill="#9b2c2c" text-anchor="middle">&#9679;</text><rect x="432" y="432" width="42" height="42" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="2.4"/><text x="453.0" y="458.0" font-size="14" fill="#9b2c2c" text-anchor="middle">&#9679;</text><rect x="432" y="388" width="42" height="42" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="2.4"/><text x="453.0" y="414.0" font-size="14" fill="#9b2c2c" text-anchor="middle">&#9679;</text><rect x="432" y="344" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="453.0" y="370.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="432" y="300" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="453.0" y="326.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="476" y="520" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="497.0" y="546.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="476" y="476" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="497.0" y="502.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="476" y="432" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="497.0" y="458.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="476" y="388" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="497.0" y="414.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="476" y="344" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="497.0" y="370.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="476" y="300" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="497.0" y="326.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="520" y="520" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="541.0" y="546.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="520" y="476" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="541.0" y="502.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="520" y="432" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="541.0" y="458.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="520" y="388" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="541.0" y="414.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="520" y="344" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="541.0" y="370.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text><rect x="520" y="300" width="42" height="42" rx="3" fill="#dff0e2" stroke="#8fb89c" stroke-width="1"/><text x="541.0" y="326.0" font-size="14" fill="#1f6b34" text-anchor="middle">&#10003;</text>
  <text x="321.0" y="580" font-size="11" fill="#666" text-anchor="middle">0</text><text x="290" y="545.0" font-size="11" fill="#666" text-anchor="end">0</text><text x="365.0" y="580" font-size="11" fill="#666" text-anchor="middle">1</text><text x="290" y="501.0" font-size="11" fill="#666" text-anchor="end">1</text><text x="409.0" y="580" font-size="11" fill="#666" text-anchor="middle">2</text><text x="290" y="457.0" font-size="11" fill="#666" text-anchor="end">2</text><text x="453.0" y="580" font-size="11" fill="#666" text-anchor="middle">3</text><text x="290" y="413.0" font-size="11" fill="#666" text-anchor="end">3</text><text x="497.0" y="580" font-size="11" fill="#666" text-anchor="middle">4</text><text x="290" y="369.0" font-size="11" fill="#666" text-anchor="end">4</text><text x="541.0" y="580" font-size="11" fill="#666" text-anchor="middle">5</text><text x="290" y="325.0" font-size="11" fill="#666" text-anchor="end">5</text>
  <text x="432.0" y="598" font-size="12" fill="#444" text-anchor="middle">j&#160; = exponent of b</text>
  <text x="266" y="432.0" font-size="12" fill="#444" text-anchor="middle" transform="rotate(-90 266 432.0)">k&#160; = exponent of c</text>

  <rect x="18" y="622" width="684" height="82" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="642" font-size="11.5" fill="#1f6b34" font-weight="bold">WHY THE RED WEDGE EXISTS AT ALL, AND WHY PRIMES ESCAPE IT</text>
  <text x="40" y="664" font-size="11.5" fill="#333">A red cell needs j + k &#8805; m with j &lt; m and k &lt; m: the exponent m must be <tspan font-style="italic">split</tspan> into two strictly smaller parts.</text>
  <text x="40" y="682" font-size="11.5" fill="#333">That is possible exactly when m &#8805; 2. For m = 1 the only option is j = k = 0, and 0 + 0 &#8805; 1 is false &#8212; so a = 2</text>
  <text x="40" y="698" font-size="11.5" fill="#333">has no red cells. A prime is precisely a number whose exponent cannot be split, which is Euclid&#8217;s lemma.</text>

  <rect x="18" y="718" width="684" height="98" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="738" font-size="11.5" fill="#b06a10" font-weight="bold">SO WHICH a DO SATISFY THE CLAIM?</text>
  <text x="40" y="760" font-size="11.5" fill="#333">Exhaustive search over all b, c below 200 finds the claim holds for a = 1, 2, 3, 5, 7, 11, 13, 17, 19, 23, &#8230;</text>
  <text x="40" y="778" font-size="11.5" fill="#333">&#8212; that is, a = 1 and the primes, and nothing else.</text>
  <text x="40" y="800" font-size="11.5" fill="#555">Compare 3.3 Problem 2, where n | x&#178; &#8658; n | x held for every <tspan font-style="italic">squarefree</tspan> n. Here 6 is squarefree yet fails: 6 | 2&#183;3.</text>
</svg>