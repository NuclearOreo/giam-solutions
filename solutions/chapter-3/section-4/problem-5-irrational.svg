<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 824" width="720" height="824" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="824" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="60" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE CLAIM</text>
  <text x="410" y="34" font-size="13.5" fill="#1f3a68" text-anchor="middle">the sum of any two irrational numbers is irrational</text>
  <text x="410" y="58" font-size="16" fill="#9b2c2c" text-anchor="middle" font-weight="bold">FALSE</text>

  <rect x="18" y="84" width="684" height="126" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.4"/>
  <text x="34" y="104" font-size="11.5" fill="#9b2c2c" font-weight="bold">THE COUNTEREXAMPLE</text>
  <text x="360" y="134" font-size="18" fill="#9b2c2c" text-anchor="middle" font-weight="bold">&#8730;2 + (&#8722;&#8730;2) = 0</text>
  <text x="360" y="160" font-size="12" fill="#333" text-anchor="middle">&#8730;2 is irrational, and so is &#8722;&#8730;2, since &#8722;&#8730;2 = q rational would give &#8730;2 = &#8722;q rational.</text>
  <text x="360" y="180" font-size="12" fill="#333" text-anchor="middle">Their sum is 0, which is rational. Both hypotheses hold and the conclusion fails.</text>
  <text x="360" y="201" font-size="11" fill="#555" text-anchor="middle" font-style="italic">if the minus sign feels like cheating: (2 &#8722; &#8730;2) + &#8730;2 = 2, and 2 &#8722; &#8730;2 &#8776; 0.5858 is a positive irrational</text>

  <rect x="18" y="220" width="684" height="118" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="240" font-size="11.5" fill="#1f6b34" font-weight="bold">BUT THE SUM IS NOT ALWAYS RATIONAL EITHER &#8212; THERE IS NO THEOREM IN EITHER DIRECTION</text>
  <text x="40" y="264" font-size="12.5" fill="#333">&#8730;2 + &#8730;2 = 2&#8730;2 &#8776; 2.8284&#160;&#160;&#8212;&#160; irrational&#160;&#160;&#160;&#160;&#160;&#160;&#8730;2 + &#8730;3 &#8776; 3.1463&#160;&#160;&#8212;&#160; irrational</text>
  <text x="40" y="288" font-size="12.5" fill="#333">&#8730;2 + (&#8722;&#8730;2) = 0&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#8212;&#160; rational&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;(2 &#8722; &#8730;2) + &#8730;2 = 2&#160;&#160;&#8212;&#160; rational</text>
  <text x="40" y="316" font-size="11.5" fill="#555">The irrationals are the <tspan font-style="italic">complement</tspan> of a set, not a structure. A complement is closed under nothing.</text>
  <text x="40" y="332" font-size="11.5" fill="#555">Contrast &#8474;, which is a group under addition &#8212; that is exactly why 3.3 Problem 5 <tspan font-style="italic">is</tspan> a theorem.</text>

  <text x="34" y="366" font-size="11.5" fill="#3b5b9b" font-weight="bold">HOW OFTEN DOES IT FAIL? ALMOST NEVER.</text>
  <text x="34" y="388" font-size="11.5" fill="#333">Fix x = &#8730;2. Then x + y is rational exactly when y lies in the shifted copy &#8474; &#8722; &#8730;2, marked below.</text>

  <line x1="60" y1="419" x2="680" y2="419" stroke="#555" stroke-width="1.2"/>
  <line x1="68.9" y1="410" x2="68.9" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="86.1" y1="410" x2="86.1" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="94.7" y1="410" x2="94.7" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="120.5" y1="410" x2="120.5" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="146.4" y1="410" x2="146.4" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="155.0" y1="410" x2="155.0" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="172.2" y1="410" x2="172.2" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="189.4" y1="410" x2="189.4" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="198.0" y1="410" x2="198.0" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="223.9" y1="410" x2="223.9" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="249.7" y1="410" x2="249.7" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="258.3" y1="410" x2="258.3" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="275.5" y1="410" x2="275.5" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="292.8" y1="410" x2="292.8" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="301.4" y1="410" x2="301.4" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="327.2" y1="410" x2="327.2" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="353.0" y1="410" x2="353.0" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="361.6" y1="410" x2="361.6" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="378.9" y1="410" x2="378.9" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="396.1" y1="410" x2="396.1" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="404.7" y1="410" x2="404.7" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="430.5" y1="410" x2="430.5" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="456.4" y1="410" x2="456.4" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="465.0" y1="410" x2="465.0" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="482.2" y1="410" x2="482.2" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="499.4" y1="410" x2="499.4" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="508.0" y1="410" x2="508.0" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="533.9" y1="410" x2="533.9" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="568.3" y1="410" x2="568.3" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="585.5" y1="410" x2="585.5" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="602.8" y1="410" x2="602.8" y2="428" stroke="#9b2c2c" stroke-width="1.2"/><line x1="637.2" y1="410" x2="637.2" y2="428" stroke="#9b2c2c" stroke-width="1.2"/>
  <text x="60.0" y="448" font-size="10" fill="#666" text-anchor="middle">-3</text><text x="163.3" y="448" font-size="10" fill="#666" text-anchor="middle">-2</text><text x="266.7" y="448" font-size="10" fill="#666" text-anchor="middle">-1</text><text x="370.0" y="448" font-size="10" fill="#666" text-anchor="middle">0</text><text x="473.3" y="448" font-size="10" fill="#666" text-anchor="middle">1</text><text x="576.7" y="448" font-size="10" fill="#666" text-anchor="middle">2</text><text x="680.0" y="448" font-size="10" fill="#666" text-anchor="middle">3</text>
  <text x="34" y="470" font-size="11" fill="#9b2c2c">red ticks: the y that make &#8730;2 + y rational (shown for denominators up to 4)</text>
  <text x="686" y="470" font-size="11" fill="#555" text-anchor="end" font-style="italic">a countable set inside a continuum &#8212; total length zero</text>

  <rect x="18" y="486" width="684" height="98" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="506" font-size="11.5" fill="#b06a10" font-weight="bold">AND YET IT FAILS AS BADLY AS POSSIBLE: EVERY REAL IS A SUM OF TWO IRRATIONALS</text>
  <text x="40" y="528" font-size="11.5" fill="#333">Given any real r, at least one of r &#8722; &#8730;2 and r &#8722; &#8730;3 is irrational &#8212; if both were rational their difference</text>
  <text x="40" y="546" font-size="11.5" fill="#333">&#8730;3 &#8722; &#8730;2 &#8776; 0.31784 would be rational, and it is not (it is a root of x&#8308; &#8722; 10x&#178; + 1).</text>
  <text x="40" y="568" font-size="11.5" fill="#333">Pair that irrational one with &#8730;2 or &#8730;3 and the two sum to r. So no real number is out of reach.</text>

  <rect x="18" y="598" width="684" height="116" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.2"/>
  <text x="34" y="618" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE FULL CLOSURE PICTURE</text>
  <g font-size="11.5">
    <rect x="40" y="628" width="640" height="22" fill="#ffffff" stroke="#c3cee4"/>
    <rect x="40" y="650" width="640" height="44" fill="#fcfdff" stroke="#c3cee4"/>
    <line x1="40" y1="650" x2="680" y2="650" stroke="#9fb2d4"/>
    <line x1="40" y1="672" x2="680" y2="672" stroke="#e6ecf6"/>
    <line x1="250" y1="628" x2="250" y2="694" stroke="#c3cee4"/>
    <line x1="400" y1="628" x2="400" y2="694" stroke="#c3cee4"/>

    <text x="50" y="643" fill="#1f3a68" font-weight="bold">set</text>
    <text x="260" y="643" fill="#1f3a68" font-weight="bold">closed under + ?</text>
    <text x="410" y="643" fill="#1f3a68" font-weight="bold">why</text>
    <text x="50" y="665">the rationals &#8474;</text>
    <text x="260" y="665" fill="#1f6b34">yes</text>
    <text x="410" y="665" fill="#555">a/b + c/d = (ad+bc)/bd</text>
    <text x="50" y="687">the irrationals &#8477; &#8722; &#8474;</text>
    <text x="260" y="687" fill="#9b2c2c">no</text>
    <text x="410" y="687" fill="#555">&#8730;2 + (&#8722;&#8730;2) = 0</text>
  </g>
</svg>