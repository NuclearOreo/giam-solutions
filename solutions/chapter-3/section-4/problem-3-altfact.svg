<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 831" width="720" height="831" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="831" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="80" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE SEQUENCE</text>
  <text x="420" y="34" font-size="13.5" fill="#1f3a68" text-anchor="middle">a(n) = n! &#8722; (n&#8722;1)! + (n&#8722;2)! &#8722; &#8943; &#177; 1!</text>
  <text x="420" y="56" font-size="12" fill="#333" text-anchor="middle">equivalently&#160; a(1) = 1&#160; and&#160; a(n) = n! &#8722; a(n&#8722;1),&#160; which is how the values below were built</text>
  <text x="420" y="76" font-size="11" fill="#555" text-anchor="middle" font-style="italic">the question, ignoring the two leading 1s: is every term from a(3) onward prime?</text>

  <rect x="18" y="104" width="684" height="74" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.4"/>
  <text x="34" y="124" font-size="11.5" fill="#9b2c2c" font-weight="bold">THE ANSWER</text>
  <text x="360" y="150" font-size="16" fill="#9b2c2c" text-anchor="middle" font-weight="bold">No. Six primes in a row, then a(9) = 326&#8201;981 = 79 &#215; 4139.</text>
  <text x="360" y="171" font-size="11" fill="#555" text-anchor="middle" font-style="italic">a(3) through a(8) really are prime &#8212; enough of a run to be persuasive, and not enough to be true</text>

  <text x="46" y="196" font-size="11.5" fill="#3b5b9b" font-weight="bold">EVERY TERM UP TO n = 15</text>
  <rect x="46" y="203" width="628" height="22" rx="3" fill="#f4f4f6" stroke="#888" stroke-width="0.8" opacity="0.95"/><text x="72" y="220" font-size="11.5" fill="#333" text-anchor="middle">a(1)</text><text x="300" y="220" font-size="11.5" fill="#333" text-anchor="end">1</text><text x="330" y="220" font-size="11.5" fill="#888">not prime (nor composite)</text><rect x="46" y="228" width="628" height="22" rx="3" fill="#f4f4f6" stroke="#888" stroke-width="0.8" opacity="0.95"/><text x="72" y="245" font-size="11.5" fill="#333" text-anchor="middle">a(2)</text><text x="300" y="245" font-size="11.5" fill="#333" text-anchor="end">1</text><text x="330" y="245" font-size="11.5" fill="#888">not prime (nor composite)</text><rect x="46" y="253" width="628" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8" opacity="0.95"/><text x="72" y="270" font-size="11.5" fill="#333" text-anchor="middle">a(3)</text><text x="300" y="270" font-size="11.5" fill="#333" text-anchor="end">5</text><text x="330" y="270" font-size="11.5" fill="#1f6b34">prime</text><rect x="46" y="278" width="628" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8" opacity="0.95"/><text x="72" y="295" font-size="11.5" fill="#333" text-anchor="middle">a(4)</text><text x="300" y="295" font-size="11.5" fill="#333" text-anchor="end">19</text><text x="330" y="295" font-size="11.5" fill="#1f6b34">prime</text><rect x="46" y="303" width="628" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8" opacity="0.95"/><text x="72" y="320" font-size="11.5" fill="#333" text-anchor="middle">a(5)</text><text x="300" y="320" font-size="11.5" fill="#333" text-anchor="end">101</text><text x="330" y="320" font-size="11.5" fill="#1f6b34">prime</text><rect x="46" y="328" width="628" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8" opacity="0.95"/><text x="72" y="345" font-size="11.5" fill="#333" text-anchor="middle">a(6)</text><text x="300" y="345" font-size="11.5" fill="#333" text-anchor="end">619</text><text x="330" y="345" font-size="11.5" fill="#1f6b34">prime</text><rect x="46" y="353" width="628" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8" opacity="0.95"/><text x="72" y="370" font-size="11.5" fill="#333" text-anchor="middle">a(7)</text><text x="300" y="370" font-size="11.5" fill="#333" text-anchor="end">4&#8201;421</text><text x="330" y="370" font-size="11.5" fill="#1f6b34">prime</text><rect x="46" y="378" width="628" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8" opacity="0.95"/><text x="72" y="395" font-size="11.5" fill="#333" text-anchor="middle">a(8)</text><text x="300" y="395" font-size="11.5" fill="#333" text-anchor="end">35&#8201;899</text><text x="330" y="395" font-size="11.5" fill="#1f6b34">prime</text><rect x="46" y="403" width="628" height="22" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="2.2" opacity="0.95"/><text x="72" y="420" font-size="11.5" fill="#333" text-anchor="middle">a(9)</text><text x="300" y="420" font-size="11.5" fill="#333" text-anchor="end">326&#8201;981</text><text x="330" y="420" font-size="11.5" fill="#9b2c2c">composite  = 79 × 4139</text><text x="666" y="420" font-size="10.5" fill="#9b2c2c" text-anchor="end" font-weight="bold">&#9664; the first failure</text><rect x="46" y="428" width="628" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8" opacity="0.95"/><text x="72" y="445" font-size="11.5" fill="#333" text-anchor="middle">a(10)</text><text x="300" y="445" font-size="11.5" fill="#333" text-anchor="end">3&#8201;301&#8201;819</text><text x="330" y="445" font-size="11.5" fill="#1f6b34">prime</text><rect x="46" y="453" width="628" height="22" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8" opacity="0.95"/><text x="72" y="470" font-size="11.5" fill="#333" text-anchor="middle">a(11)</text><text x="300" y="470" font-size="11.5" fill="#333" text-anchor="end">36&#8201;614&#8201;981</text><text x="330" y="470" font-size="11.5" fill="#9b2c2c">composite  = 13 × 2816537</text><rect x="46" y="478" width="628" height="22" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8" opacity="0.95"/><text x="72" y="495" font-size="11.5" fill="#333" text-anchor="middle">a(12)</text><text x="300" y="495" font-size="11.5" fill="#333" text-anchor="end">442&#8201;386&#8201;619</text><text x="330" y="495" font-size="11.5" fill="#9b2c2c">composite  = 29 × 15254711</text><rect x="46" y="503" width="628" height="22" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8" opacity="0.95"/><text x="72" y="520" font-size="11.5" fill="#333" text-anchor="middle">a(13)</text><text x="300" y="520" font-size="11.5" fill="#333" text-anchor="end">5&#8201;784&#8201;634&#8201;181</text><text x="330" y="520" font-size="11.5" fill="#9b2c2c">composite  = 47 × 123077323</text><rect x="46" y="528" width="628" height="22" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8" opacity="0.95"/><text x="72" y="545" font-size="11.5" fill="#333" text-anchor="middle">a(14)</text><text x="300" y="545" font-size="11.5" fill="#333" text-anchor="end">81&#8201;393&#8201;657&#8201;019</text><text x="330" y="545" font-size="11.5" fill="#9b2c2c">composite  = 23 × 3538854653</text><rect x="46" y="553" width="628" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8" opacity="0.95"/><text x="72" y="570" font-size="11.5" fill="#333" text-anchor="middle">a(15)</text><text x="300" y="570" font-size="11.5" fill="#333" text-anchor="end">1&#8201;226&#8201;280&#8201;710&#8201;981</text><text x="330" y="570" font-size="11.5" fill="#1f6b34">prime</text>

  <rect x="18" y="611" width="684" height="78" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="631" font-size="11.5" fill="#b06a10" font-weight="bold">HOW THE PRIMES THIN OUT</text>
  <text x="40" y="653" font-size="11.5" fill="#333">Testing every n up to 120, the terms a(n) that are prime occur at</text>
  <text x="40" y="673" font-size="13" fill="#1f3a68" font-weight="bold">n = 3, 4, 5, 6, 7, 8,&#160; 10,&#160; 15,&#160; 19,&#160; 41,&#160; 59, 61,&#160; 105</text>
  <text x="666" y="673" font-size="10.5" fill="#555" text-anchor="end" font-style="italic">six consecutive, then almost nothing</text>

  <rect x="18" y="703" width="684" height="114" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="723" font-size="11.5" fill="#1f6b34" font-weight="bold">AND IT IS WORSE THAN A FEW MISSES &#8212; THE PRIMES RUN OUT ALTOGETHER</text>
  <text x="40" y="745" font-size="11.5" fill="#333">Once n &#8805; p the term n! vanishes mod p, so a(n) &#8801; &#8722;a(n&#8722;1): the residue just flips sign forever. Hence if a single</text>
  <text x="40" y="763" font-size="11.5" fill="#333">prime p divides a(p&#8722;1), it divides <tspan font-style="italic">every</tspan> later term, and the sequence can hold only finitely many primes.</text>
  <text x="40" y="787" font-size="11.5" fill="#333">No such p exists below 200&#8201;000 &#8212; but p = 3&#8201;612&#8201;703 is one, as a direct computation confirms. So the sequence</text>
  <text x="40" y="805" font-size="11.5" fill="#333">has finitely many primes, and every term from a(3&#8201;612&#8201;702) on is composite.</text>
</svg>