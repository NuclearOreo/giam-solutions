<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 881" width="720" height="881" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="881" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="74" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE CONJECTURE (false)</text>
  <text x="420" y="34" font-size="13.5" fill="#1f3a68" text-anchor="middle">p prime&#160; &#8658; &#160;2&#7510; &#8722; 1 is prime</text>
  <text x="420" y="56" font-size="11.5" fill="#333" text-anchor="middle">the numbers 2&#7510; &#8722; 1 are the <tspan font-style="italic">Mersenne numbers</tspan>; the conjecture says a prime exponent always yields one</text>
  <text x="420" y="76" font-size="11" fill="#555" text-anchor="middle" font-style="italic">&#8220;minimal&#8221; means the smallest prime p for which it fails, so the four smaller cases must be checked too</text>

  <rect x="18" y="98" width="684" height="80" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.4"/>
  <text x="34" y="118" font-size="11.5" fill="#9b2c2c" font-weight="bold">THE MINIMAL COUNTEREXAMPLE</text>
  <text x="360" y="146" font-size="17" fill="#9b2c2c" text-anchor="middle" font-weight="bold">p = 11:&#160;&#160; 2&#185;&#185; &#8722; 1 = 2047 = 23 &#215; 89</text>
  <text x="360" y="169" font-size="11" fill="#555" text-anchor="middle" font-style="italic">and it is minimal because 3, 7, 31 and 127 &#8212; the values at p = 2, 3, 5, 7 &#8212; really are prime</text>

  <text x="46" y="200" font-size="11.5" fill="#3b5b9b" font-weight="bold">EVERY PRIME EXPONENT UP TO 41</text>
  <rect x="46" y="207" width="628" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8" opacity="0.95"/><text x="76" y="224" font-size="11.5" fill="#333" text-anchor="middle">p = 2</text><text x="290" y="224" font-size="11.5" fill="#333" text-anchor="end">3</text><text x="320" y="224" font-size="11.5" fill="#1f6b34">PRIME</text><rect x="46" y="232" width="628" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8" opacity="0.95"/><text x="76" y="249" font-size="11.5" fill="#333" text-anchor="middle">p = 3</text><text x="290" y="249" font-size="11.5" fill="#333" text-anchor="end">7</text><text x="320" y="249" font-size="11.5" fill="#1f6b34">PRIME</text><rect x="46" y="257" width="628" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8" opacity="0.95"/><text x="76" y="274" font-size="11.5" fill="#333" text-anchor="middle">p = 5</text><text x="290" y="274" font-size="11.5" fill="#333" text-anchor="end">31</text><text x="320" y="274" font-size="11.5" fill="#1f6b34">PRIME</text><rect x="46" y="282" width="628" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8" opacity="0.95"/><text x="76" y="299" font-size="11.5" fill="#333" text-anchor="middle">p = 7</text><text x="290" y="299" font-size="11.5" fill="#333" text-anchor="end">127</text><text x="320" y="299" font-size="11.5" fill="#1f6b34">PRIME</text><rect x="46" y="307" width="628" height="22" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="2.2" opacity="0.95"/><text x="76" y="324" font-size="11.5" fill="#333" text-anchor="middle">p = 11</text><text x="290" y="324" font-size="11.5" fill="#333" text-anchor="end">2 047</text><text x="320" y="324" font-size="11.5" fill="#9b2c2c">composite = 23 × 89</text><text x="666" y="324" font-size="10.5" fill="#9b2c2c" text-anchor="end" font-weight="bold">&#9664; minimal counterexample</text><rect x="46" y="332" width="628" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8" opacity="0.95"/><text x="76" y="349" font-size="11.5" fill="#333" text-anchor="middle">p = 13</text><text x="290" y="349" font-size="11.5" fill="#333" text-anchor="end">8 191</text><text x="320" y="349" font-size="11.5" fill="#1f6b34">PRIME</text><rect x="46" y="357" width="628" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8" opacity="0.95"/><text x="76" y="374" font-size="11.5" fill="#333" text-anchor="middle">p = 17</text><text x="290" y="374" font-size="11.5" fill="#333" text-anchor="end">131 071</text><text x="320" y="374" font-size="11.5" fill="#1f6b34">PRIME</text><rect x="46" y="382" width="628" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8" opacity="0.95"/><text x="76" y="399" font-size="11.5" fill="#333" text-anchor="middle">p = 19</text><text x="290" y="399" font-size="11.5" fill="#333" text-anchor="end">524 287</text><text x="320" y="399" font-size="11.5" fill="#1f6b34">PRIME</text><rect x="46" y="407" width="628" height="22" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8" opacity="0.95"/><text x="76" y="424" font-size="11.5" fill="#333" text-anchor="middle">p = 23</text><text x="290" y="424" font-size="11.5" fill="#333" text-anchor="end">8 388 607</text><text x="320" y="424" font-size="11.5" fill="#9b2c2c">composite = 47 × 178 481</text><rect x="46" y="432" width="628" height="22" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8" opacity="0.95"/><text x="76" y="449" font-size="11.5" fill="#333" text-anchor="middle">p = 29</text><text x="290" y="449" font-size="11.5" fill="#333" text-anchor="end">536 870 911</text><text x="320" y="449" font-size="11.5" fill="#9b2c2c">composite = 233 × 1 103 × 2 089</text><rect x="46" y="457" width="628" height="22" rx="3" fill="#dff0e2" stroke="#1f6b34" stroke-width="0.8" opacity="0.95"/><text x="76" y="474" font-size="11.5" fill="#333" text-anchor="middle">p = 31</text><text x="290" y="474" font-size="11.5" fill="#333" text-anchor="end">2 147 483 647</text><text x="320" y="474" font-size="11.5" fill="#1f6b34">PRIME</text><rect x="46" y="482" width="628" height="22" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8" opacity="0.95"/><text x="76" y="499" font-size="11.5" fill="#333" text-anchor="middle">p = 37</text><text x="290" y="499" font-size="11.5" fill="#333" text-anchor="end">137 438 953 471</text><text x="320" y="499" font-size="11.5" fill="#9b2c2c">composite = 223 × 616 318 177</text><rect x="46" y="507" width="628" height="22" rx="3" fill="#f8cdcd" stroke="#9b2c2c" stroke-width="0.8" opacity="0.95"/><text x="76" y="524" font-size="11.5" fill="#333" text-anchor="middle">p = 41</text><text x="290" y="524" font-size="11.5" fill="#333" text-anchor="end">2 199 023 255 551</text><text x="320" y="524" font-size="11.5" fill="#9b2c2c">composite = 13 367 × 164 511 353</text>

  <rect x="18" y="561" width="684" height="92" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="581" font-size="11.5" fill="#1f6b34" font-weight="bold">THE TRUE THEOREM NEARBY &#8212; and it points the other way</text>
  <text x="40" y="603" font-size="11.5" fill="#333">If n is <tspan font-style="italic">composite</tspan>, say n = ab with a, b &#8805; 2, then 2&#8319; &#8722; 1 factors:&#160; (2&#7491; &#8722; 1) divides (2&#7491;&#7495; &#8722; 1).</text>
  <text x="40" y="623" font-size="11.5" fill="#333">For example 2&#8310; &#8722; 1 = 63 = (2&#178; &#8722; 1)(2&#8308; + 2&#178; + 1) = 3 &#215; 21. Verified for all a, b up to 8.</text>
  <text x="40" y="643" font-size="11.5" fill="#1f6b34" font-weight="bold">So p prime is <tspan font-style="italic">necessary</tspan> for 2&#7510; &#8722; 1 to be prime. The conjecture wrongly reads it as sufficient.</text>

  <rect x="18" y="665" width="684" height="108" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="685" font-size="11.5" fill="#b06a10" font-weight="bold">WHY FINDING THE FACTOR 23 IS EASIER THAN IT LOOKS</text>
  <text x="40" y="707" font-size="11.5" fill="#333">For odd prime p, every prime factor q of 2&#7510; &#8722; 1 satisfies&#160; q &#8801; 1 (mod 2p)&#160; and&#160; q &#8801; &#177;1 (mod 8).</text>
  <text x="40" y="727" font-size="11.5" fill="#333">With p = 11 that means q &#8801; 1 (mod 22). Of the fourteen primes below &#8730;2047 &#8776; 45, exactly one qualifies:</text>
  <text x="360" y="749" font-size="13" fill="#b06a10" text-anchor="middle" font-weight="bold">q = 23&#160;&#160;&#8212;&#160;&#160;and 2047 / 23 = 89, also &#8801; 1 (mod 22)</text>
  <text x="40" y="767" font-size="10.5" fill="#555" font-style="italic">One trial division instead of fourteen. The congruence was checked against every prime factor for all odd p below 60.</text>

  <rect x="18" y="785" width="684" height="82" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.2"/>
  <text x="34" y="805" font-size="11.5" fill="#3b5b9b" font-weight="bold">HOW RARE THEY ACTUALLY ARE</text>
  <text x="40" y="827" font-size="11.5" fill="#333">Among the 46 primes below 200, only 12 give a Mersenne prime:&#160; p = 2, 3, 5, 7, 13, 17, 19, 31, 61, 89, 107, 127.</text>
  <text x="40" y="849" font-size="11.5" fill="#333">Each one also yields an even perfect number 2&#7510;&#8315;&#185;(2&#7510; &#8722; 1): 6, 28, 496, 8128, 33 550 336, &#8230; all checked directly.</text>
</svg>