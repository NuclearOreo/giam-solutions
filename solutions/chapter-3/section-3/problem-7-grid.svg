<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 704" width="720" height="704" font-family="Georgia, serif">
  <defs>
    <marker id="e1" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#3b5b9b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="704" fill="#ffffff"/>

  <!-- band 1: statement -->
  <rect x="18" y="14" width="684" height="58" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">TO PROVE</text>
  <text x="400" y="33" font-size="13.5" fill="#1f3a68" text-anchor="middle">for all reals a and b&#160;:&#160; ab irrational  &#8658;  a irrational or b irrational</text>
  <text x="400" y="55" font-size="11" fill="#555" text-anchor="middle" font-style="italic">the conclusion is a disjunction of two negatives &#8212; about as unhelpful a target as one can be handed</text>

  <!-- band 2: the flip, done in two steps -->
  <rect x="18" y="82" width="684" height="140" rx="6" fill="#f7f7f9" stroke="#888" stroke-width="1.2"/>
  <text x="34" y="102" font-size="11.5" fill="#3b5b9b" font-weight="bold">STEP 1 &#8212; CONTRAPOSE,&#160; STEP 2 &#8212; DE MORGAN</text>

  <rect x="40" y="114" width="196" height="42" rx="5" fill="#ffffff" stroke="#aab"/>
  <text x="138" y="131" font-size="11.5" fill="#333" text-anchor="middle">&#172;(a irr. or b irr.)</text>
  <text x="138" y="148" font-size="11.5" fill="#333" text-anchor="middle">&#8658; &#172;(ab irr.)</text>
  <text x="138" y="170" font-size="10" fill="#666" text-anchor="middle" font-style="italic">contrapositive</text>

  <path d="M242,135 L282,135" fill="none" stroke="#3b5b9b" stroke-width="1.4" marker-end="url(#e1)"/>
  <text x="262" y="127" font-size="9.5" fill="#3b5b9b" text-anchor="middle">De Morgan</text>

  <rect x="288" y="114" width="196" height="42" rx="5" fill="#ffffff" stroke="#aab"/>
  <text x="386" y="131" font-size="11.5" fill="#333" text-anchor="middle">(&#172;a irr.) and (&#172;b irr.)</text>
  <text x="386" y="148" font-size="11.5" fill="#333" text-anchor="middle">&#8658; &#172;(ab irr.)</text>
  <text x="386" y="170" font-size="10" fill="#666" text-anchor="middle" font-style="italic">an &#8220;or&#8221; became an &#8220;and&#8221;</text>

  <path d="M490,135 L530,135" fill="none" stroke="#3b5b9b" stroke-width="1.4" marker-end="url(#e1)"/>
  <text x="510" y="127" font-size="9.5" fill="#3b5b9b" text-anchor="middle">dichotomy</text>

  <rect x="536" y="114" width="146" height="42" rx="5" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.4"/>
  <text x="609" y="131" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">a, b both rational</text>
  <text x="609" y="148" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">&#8658; ab rational</text>
  <text x="609" y="170" font-size="10" fill="#1f6b34" text-anchor="middle" font-style="italic">two usable hypotheses</text>

  <text x="360" y="196" font-size="12" fill="#333" text-anchor="middle">a = p/q and b = r/s with q, s nonzero&#160; &#8658; &#160;ab = pr / qs,&#160; a ratio of integers with nonzero denominator.</text>
  <text x="360" y="214" font-size="12.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">So ab is rational. &#9632;</text>

  <!-- band 3: the 2x2 grid of cases -->
  <rect x="18" y="232" width="684" height="290" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="252" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE FOUR CASES &#8212; and why the theorem singles out exactly one of them</text>

  <!-- grid -->
  <text x="380" y="278" font-size="11.5" fill="#444" text-anchor="middle" font-weight="bold">b is &#8230;</text>
  <text x="152" y="278" font-size="11" fill="#666" text-anchor="middle"></text>
  <text x="290" y="296" font-size="11.5" fill="#444" text-anchor="middle" font-weight="bold">rational</text>
  <text x="500" y="296" font-size="11.5" fill="#444" text-anchor="middle" font-weight="bold">irrational</text>
  <text x="100" y="360" font-size="11.5" fill="#444" text-anchor="middle" font-weight="bold">a rational</text>
  <text x="100" y="446" font-size="11.5" fill="#444" text-anchor="middle" font-weight="bold">a irrational</text>

  <rect x="186" y="306" width="208" height="82" rx="4" fill="#dff0e2" stroke="#1f6b34" stroke-width="2.2"/>
  <text x="290" y="326" font-size="12" fill="#1f6b34" text-anchor="middle" font-weight="bold">ab is ALWAYS rational</text>
  <text x="290" y="346" font-size="11" fill="#333" text-anchor="middle">(p/q)(r/s) = pr/qs</text>
  <text x="290" y="368" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-style="italic">this cell is the contrapositive,</text>
  <text x="290" y="381" font-size="10.5" fill="#1f6b34" text-anchor="middle" font-style="italic">and the whole proof</text>

  <rect x="396" y="306" width="208" height="82" rx="4" fill="#fdf7ec" stroke="#b06a10" stroke-width="1.4"/>
  <text x="500" y="326" font-size="12" fill="#b06a10" text-anchor="middle" font-weight="bold">either is possible</text>
  <text x="500" y="346" font-size="11" fill="#333" text-anchor="middle">0 &#183; &#8730;2 = 0&#160; is rational</text>
  <text x="500" y="364" font-size="11" fill="#333" text-anchor="middle">2 &#183; &#8730;2 = 2&#8730;2&#160; is irrational</text>
  <text x="500" y="381" font-size="10.5" fill="#b06a10" text-anchor="middle" font-style="italic">only a = 0 spoils it</text>

  <rect x="186" y="394" width="208" height="82" rx="4" fill="#fdf7ec" stroke="#b06a10" stroke-width="1.4"/>
  <text x="290" y="414" font-size="12" fill="#b06a10" text-anchor="middle" font-weight="bold">either is possible</text>
  <text x="290" y="434" font-size="11" fill="#333" text-anchor="middle">&#8730;2 &#183; 0 = 0&#160; is rational</text>
  <text x="290" y="452" font-size="11" fill="#333" text-anchor="middle">&#8730;2 &#183; 2 = 2&#8730;2&#160; is irrational</text>
  <text x="290" y="469" font-size="10.5" fill="#b06a10" text-anchor="middle" font-style="italic">the mirror of the cell above</text>

  <rect x="396" y="394" width="208" height="82" rx="4" fill="#fdf7ec" stroke="#b06a10" stroke-width="1.4"/>
  <text x="500" y="414" font-size="12" fill="#b06a10" text-anchor="middle" font-weight="bold">either is possible</text>
  <text x="500" y="434" font-size="11" fill="#333" text-anchor="middle">&#8730;2 &#183; &#8730;2 = 2&#160; is rational</text>
  <text x="500" y="452" font-size="11" fill="#333" text-anchor="middle">&#8730;2 &#183; &#8730;3 = &#8730;6&#160; is irrational</text>
  <text x="500" y="469" font-size="10.5" fill="#b06a10" text-anchor="middle" font-style="italic">no pattern at all here</text>

  <text x="360" y="500" font-size="11.5" fill="#333" text-anchor="middle">Exactly one cell forbids an irrational product. So &#8220;ab irrational&#8221; rules out that one cell and nothing more &#8212;</text>
  <text x="360" y="515" font-size="11.5" fill="#333" text-anchor="middle">which is precisely the statement that a or b is irrational.</text>

  <!-- band 4: what cannot be strengthened -->
  <rect x="18" y="532" width="684" height="156" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="552" font-size="11.5" fill="#b06a10" font-weight="bold">THE &#8220;OR&#8221; IS EXACTLY RIGHT &#8212; every nearby strengthening is false</text>
  <g font-size="11.5">
    <rect x="40" y="562" width="640" height="24" fill="#ffffff" stroke="#e0cba8"/>
    <rect x="40" y="586" width="640" height="72" fill="#fffdf8" stroke="#e0cba8"/>
    <line x1="40" y1="586" x2="680" y2="586" stroke="#d3b98e"/>
    <line x1="40" y1="610" x2="680" y2="610" stroke="#f0e4cd"/>
    <line x1="40" y1="634" x2="680" y2="634" stroke="#f0e4cd"/>
    <line x1="330" y1="562" x2="330" y2="658" stroke="#e0cba8"/>
    <line x1="400" y1="562" x2="400" y2="658" stroke="#e0cba8"/>

    <text x="50" y="579" fill="#7a4a08" font-weight="bold">proposed statement</text>
    <text x="340" y="579" fill="#7a4a08" font-weight="bold">true?</text>
    <text x="410" y="579" fill="#7a4a08" font-weight="bold">witness</text>

    <text x="50" y="603" fill="#333">ab irrational &#8658; a or b irrational</text>
    <text x="340" y="603" fill="#1f6b34">yes</text>
    <text x="410" y="603" fill="#555">the theorem</text>

    <text x="50" y="627" fill="#333">ab irrational &#8658; both a and b irrational</text>
    <text x="340" y="627" fill="#9b2c2c">no</text>
    <text x="410" y="627" fill="#555">a = &#8730;2, b = 2:&#160; ab = 2&#8730;2, yet b is rational</text>

    <text x="50" y="651" fill="#333">a or b irrational &#8658; ab irrational</text>
    <text x="340" y="651" fill="#9b2c2c">no</text>
    <text x="410" y="651" fill="#555">a = b = &#8730;2:&#160; ab = 2, which is rational</text>
  </g>
  <text x="360" y="678" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">nor can &#8220;or&#8221; be read exclusively: a = &#8730;2, b = &#8730;3 gives ab = &#8730;6 irrational with both factors irrational</text>
</svg>
