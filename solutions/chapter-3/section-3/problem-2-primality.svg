<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" font-family="Georgia, serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#3b5b9b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="620" fill="#ffffff"/>

  <!-- ============ the statement ============ -->
  <rect x="18" y="14" width="684" height="56" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.4"/>
  <text x="34" y="34" font-size="11.5" fill="#3b5b9b" font-weight="bold">TO PROVE</text>
  <text x="360" y="36" font-size="14.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">for every prime p and every integer x&#160;&#160;:&#160;&#160; p &#8740; x&#178;  &#8658;  p &#8740; x</text>
  <text x="360" y="58" font-size="11.5" fill="#555" text-anchor="middle" font-style="italic">both sides are negative, so contraposition is the obvious first move</text>

  <path d="M360,70 L360,92" fill="none" stroke="#3b5b9b" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- ============ the proof ============ -->
  <rect x="18" y="98" width="684" height="132" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="118" font-size="11.5" fill="#1f6b34" font-weight="bold">THE CONTRAPOSITIVE &#8212; and the whole proof</text>
  <text x="360" y="142" font-size="14.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">p | x  &#8658;  p | x&#178;</text>

  <text x="60" y="172" font-size="12.5" fill="#333">Suppose p | x.  Then x = pk for some integer k, so</text>
  <text x="360" y="200" font-size="15" fill="#333" text-anchor="middle">x&#178; = (pk)&#178; = p&#178;k&#178; = p&#183;(pk&#178;)</text>
  <text x="60" y="222" font-size="12.5" fill="#333">and pk&#178; is an integer, so p | x&#178;. &#9632;</text>

  <!-- ============ unused hypothesis ============ -->
  <rect x="18" y="244" width="684" height="98" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="264" font-size="11.5" fill="#b06a10" font-weight="bold">NOTICE WHAT THE PROOF NEVER TOUCHED</text>
  <text x="34" y="286" font-size="12" fill="#333">Nowhere did the argument use that p is prime. Only &#8220;p is an integer&#8221; was needed, so the same three lines prove</text>
  <text x="360" y="310" font-size="13.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">for every integer n &#8805; 2 and every integer x&#160;&#160;:&#160;&#160; n &#8740; x&#178;  &#8658;  n &#8740; x</text>
  <text x="360" y="332" font-size="11" fill="#555" text-anchor="middle" font-style="italic">confirmed for every modulus n from 2 to 200 and every x from &#8722;300 to 300</text>

  <!-- ============ where primality matters ============ -->
  <rect x="18" y="356" width="684" height="196" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="376" font-size="11.5" fill="#9b2c2c" font-weight="bold">SO WHERE IS PRIMALITY ACTUALLY NEEDED?  &#8212;  in the converse</text>
  <text x="360" y="399" font-size="13.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">n | x&#178;  &#8658;  n | x</text>
  <text x="34" y="421" font-size="12" fill="#333">This is Euclid&#8217;s lemma when n is prime, and it is a genuinely deeper fact. For a general modulus it simply fails:</text>

  <g font-size="12">
    <rect x="120" y="432" width="480" height="24" fill="#ffffff" stroke="#ddd"/>
    <rect x="120" y="456" width="480" height="72" fill="#fcfcfc" stroke="#ddd"/>
    <line x1="120" y1="456" x2="600" y2="456" stroke="#bbb"/>
    <line x1="120" y1="474" x2="600" y2="474" stroke="#eee"/>
    <line x1="120" y1="492" x2="600" y2="492" stroke="#eee"/>
    <line x1="120" y1="510" x2="600" y2="510" stroke="#eee"/>
    <line x1="200" y1="432" x2="200" y2="528" stroke="#ddd"/>
    <line x1="290" y1="432" x2="290" y2="528" stroke="#ddd"/>
    <line x1="430" y1="432" x2="430" y2="528" stroke="#ddd"/>

    <text x="160" y="449" fill="#555" text-anchor="middle" font-weight="bold">n</text>
    <text x="245" y="449" fill="#555" text-anchor="middle" font-weight="bold">x</text>
    <text x="360" y="449" fill="#555" text-anchor="middle" font-weight="bold">n divides x&#178;&#160;?</text>
    <text x="515" y="449" fill="#555" text-anchor="middle" font-weight="bold">n divides x&#160;?</text>

    <text x="160" y="469" text-anchor="middle">4</text><text x="245" y="469" text-anchor="middle">2</text>
    <text x="360" y="469" text-anchor="middle" fill="#1f6b34">yes, x&#178; = 4</text><text x="515" y="469" text-anchor="middle" fill="#9b2c2c">no</text>
    <text x="160" y="487" text-anchor="middle">8</text><text x="245" y="487" text-anchor="middle">4</text>
    <text x="360" y="487" text-anchor="middle" fill="#1f6b34">yes, x&#178; = 16</text><text x="515" y="487" text-anchor="middle" fill="#9b2c2c">no</text>
    <text x="160" y="505" text-anchor="middle">9</text><text x="245" y="505" text-anchor="middle">3</text>
    <text x="360" y="505" text-anchor="middle" fill="#1f6b34">yes, x&#178; = 9</text><text x="515" y="505" text-anchor="middle" fill="#9b2c2c">no</text>
    <text x="160" y="523" text-anchor="middle">12</text><text x="245" y="523" text-anchor="middle">6</text>
    <text x="360" y="523" text-anchor="middle" fill="#1f6b34">yes, x&#178; = 36</text><text x="515" y="523" text-anchor="middle" fill="#9b2c2c">no</text>
  </g>
  <text x="360" y="544" font-size="11" fill="#555" text-anchor="middle" font-style="italic">the converse holds exactly for the squarefree n &#8212; checked for every n up to 200; the first failures are 4, 8, 9, 12, 16, 18</text>

  <!-- ============ valuation ============ -->
  <rect x="18" y="566" width="684" height="42" rx="6" fill="#f7f7f9" stroke="#888" stroke-width="1.1"/>
  <text x="34" y="583" font-size="11" fill="#3b5b9b" font-weight="bold">One line that settles both directions at once:</text>
  <text x="34" y="600" font-size="11.5" fill="#333">writing v(x) for the number of factors of p in x, we have v(x&#178;) = 2v(x), so v(x&#178;) &#8805; 1 exactly when v(x) &#8805; 1.</text>
</svg>
