<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700" font-family="Georgia, serif">
  <defs>
    <marker id="f1" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#3b5b9b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="700" fill="#ffffff"/>

  <!-- band 1 -->
  <rect x="18" y="14" width="684" height="76" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">TO PROVE</text>
  <text x="400" y="33" font-size="13.5" fill="#1f3a68" text-anchor="middle">if a&#178; + b&#178; = c&#178; with a, b, c natural, then a or b is even</text>
  <line x1="34" y1="44" x2="686" y2="44" stroke="#c3cee4"/>
  <text x="34" y="63" font-size="11.5" fill="#9b2c2c" font-weight="bold">SUPPOSE OTHERWISE</text>
  <text x="400" y="63" font-size="13.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">a and b are both odd</text>
  <text x="400" y="81" font-size="11" fill="#555" text-anchor="middle" font-style="italic">write a = 2m + 1 and b = 2n + 1, and look at what a&#178; + b&#178; can be</text>

  <!-- band 2: the lemma, squares mod 4 -->
  <rect x="18" y="100" width="336" height="212" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="120" font-size="11.5" fill="#1f6b34" font-weight="bold">THE LEMMA: A SQUARE IS 0 OR 1 MOD 4</text>
  <g font-size="12">
    <rect x="40" y="132" width="292" height="24" fill="#ffffff" stroke="#bcd6c4"/>
    <rect x="40" y="156" width="292" height="96" fill="#fbfdfb" stroke="#bcd6c4"/>
    <line x1="40" y1="156" x2="332" y2="156" stroke="#9bb8a5"/>
    <line x1="40" y1="180" x2="332" y2="180" stroke="#e2eee6"/>
    <line x1="40" y1="204" x2="332" y2="204" stroke="#e2eee6"/>
    <line x1="40" y1="228" x2="332" y2="228" stroke="#e2eee6"/>
    <line x1="140" y1="132" x2="140" y2="252" stroke="#bcd6c4"/>
    <line x1="240" y1="132" x2="240" y2="252" stroke="#bcd6c4"/>

    <text x="90" y="149" fill="#1f6b34" text-anchor="middle" font-weight="bold">n mod 4</text>
    <text x="190" y="149" fill="#1f6b34" text-anchor="middle" font-weight="bold">n&#178;</text>
    <text x="286" y="149" fill="#1f6b34" text-anchor="middle" font-weight="bold">n&#178; mod 4</text>

    <text x="90" y="173" text-anchor="middle">0</text><text x="190" y="173" text-anchor="middle">(4k)&#178; = 16k&#178;</text><text x="286" y="173" text-anchor="middle" font-weight="bold">0</text>
    <text x="90" y="197" text-anchor="middle">1</text><text x="190" y="197" text-anchor="middle">16k&#178; + 8k + 1</text><text x="286" y="197" text-anchor="middle" font-weight="bold">1</text>
    <text x="90" y="221" text-anchor="middle">2</text><text x="190" y="221" text-anchor="middle">16k&#178; + 16k + 4</text><text x="286" y="221" text-anchor="middle" font-weight="bold">0</text>
    <text x="90" y="245" text-anchor="middle">3</text><text x="190" y="245" text-anchor="middle">16k&#178; + 24k + 9</text><text x="286" y="245" text-anchor="middle" font-weight="bold">1</text>
  </g>
  <text x="186" y="272" font-size="11.5" fill="#1f6b34" text-anchor="middle" font-weight="bold">No square is ever 2 or 3 mod 4.</text>
  <text x="186" y="292" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">checked for every n below 4000</text>

  <!-- band 3: the collision -->
  <rect x="366" y="100" width="336" height="212" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="382" y="120" font-size="11.5" fill="#9b2c2c" font-weight="bold">THE COLLISION</text>

  <text x="382" y="146" font-size="12" fill="#333">a&#178; = (2m + 1)&#178; = 4(m&#178; + m) + 1</text>
  <text x="382" y="166" font-size="12" fill="#333">b&#178; = (2n + 1)&#178; = 4(n&#178; + n) + 1</text>
  <line x1="382" y1="176" x2="686" y2="176" stroke="#d9b3b3"/>
  <text x="382" y="196" font-size="12" fill="#333">a&#178; + b&#178; = 4(m&#178; + m + n&#178; + n) + 2</text>

  <rect x="382" y="208" width="304" height="30" rx="4" fill="#ffffff" stroke="#9b2c2c"/>
  <text x="534" y="228" font-size="12.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">so c&#178; &#8801; 2 (mod 4)</text>

  <path d="M534,240 L534,256" fill="none" stroke="#9b2c2c" stroke-width="1.3" marker-end="url(#f1)"/>
  <text x="534" y="274" font-size="12.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">but the lemma forbids that.</text>
  <text x="534" y="296" font-size="11.5" fill="#333" text-anchor="middle">So a and b cannot both be odd. &#9632;</text>

  <!-- band 4: why mod 2 is not enough -->
  <rect x="18" y="324" width="684" height="98" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="344" font-size="11.5" fill="#b06a10" font-weight="bold">WHY MOD 2 IS NOT ENOUGH &#8212; the choice of modulus is the whole idea</text>
  <text x="34" y="368" font-size="12" fill="#333">Working mod 2: a, b both odd gives a&#178; + b&#178; &#8801; 1 + 1 &#8801; 0, so c&#178; is even and c is even. No contradiction &#8212; that is</text>
  <text x="34" y="386" font-size="12" fill="#333">a perfectly consistent state of affairs as far as mod 2 can see.</text>
  <text x="34" y="410" font-size="12" fill="#333">Mod 4 is finer. It distinguishes &#8220;even&#8221; into 0 and 2, and squares only ever land on 0 &#8212; never on 2.</text>

  <!-- band 5: the evidence -->
  <rect x="18" y="434" width="684" height="248" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="454" font-size="11.5" fill="#3b5b9b" font-weight="bold">EVERY TRIPLE WITH c &#8804; 400 &#8212; a sample, and what the theorem does and does not say</text>
  <g font-size="11.5">
    <rect x="40" y="464" width="640" height="24" fill="#ffffff" stroke="#c3cee4"/>
    <rect x="40" y="488" width="640" height="144" fill="#fcfdff" stroke="#c3cee4"/>
    <line x1="40" y1="488" x2="680" y2="488" stroke="#9fb2d4"/>
    <line x1="130" y1="464" x2="130" y2="632" stroke="#c3cee4"/>
    <line x1="300" y1="464" x2="300" y2="632" stroke="#c3cee4"/>
    <line x1="470" y1="464" x2="470" y2="632" stroke="#c3cee4"/>
    <g stroke="#e6ecf6">
      <line x1="40" y1="512" x2="680" y2="512"/><line x1="40" y1="536" x2="680" y2="536"/>
      <line x1="40" y1="560" x2="680" y2="560"/><line x1="40" y1="584" x2="680" y2="584"/>
      <line x1="40" y1="608" x2="680" y2="608"/>
    </g>

    <text x="50" y="481" fill="#1f3a68" font-weight="bold">triple</text>
    <text x="140" y="481" fill="#1f3a68" font-weight="bold">parity of a, b</text>
    <text x="310" y="481" fill="#1f3a68" font-weight="bold">a&#178; + b&#178; mod 4</text>
    <text x="480" y="481" fill="#1f3a68" font-weight="bold">note</text>

    <text x="50" y="505">3, 4, 5</text><text x="140" y="505">odd, even</text><text x="310" y="505">9 + 16 = 25 &#8801; 1</text><text x="480" y="505" fill="#555">primitive</text>
    <text x="50" y="529">5, 12, 13</text><text x="140" y="529">odd, even</text><text x="310" y="529">25 + 144 = 169 &#8801; 1</text><text x="480" y="529" fill="#555">primitive</text>
    <text x="50" y="553">8, 15, 17</text><text x="140" y="553">even, odd</text><text x="310" y="553">64 + 225 = 289 &#8801; 1</text><text x="480" y="553" fill="#555">primitive</text>
    <text x="50" y="577">6, 8, 10</text><text x="140" y="577" fill="#1f6b34">even, even</text><text x="310" y="577">36 + 64 = 100 &#8801; 0</text><text x="480" y="577" fill="#1f6b34">both even &#8212; so &#8220;at least one&#8221;</text>
    <text x="50" y="601">18, 24, 30</text><text x="140" y="601" fill="#1f6b34">even, even</text><text x="310" y="601">324 + 576 = 900 &#8801; 0</text><text x="480" y="601" fill="#1f6b34">cannot be sharpened to &#8220;exactly one&#8221;</text>
    <text x="50" y="625" fill="#9b2c2c">any odd, odd</text><text x="140" y="625" fill="#9b2c2c">odd, odd</text><text x="310" y="625" fill="#9b2c2c">&#8801; 2 &#8212; impossible</text><text x="480" y="625" fill="#9b2c2c">no such triple exists</text>
  </g>
  <text x="360" y="652" font-size="11" fill="#555" text-anchor="middle" font-style="italic">All 294 triples with c &#8804; 400 were enumerated: none has a and b both odd, and in all of them ab is divisible by 12.</text>
  <text x="360" y="670" font-size="11" fill="#555" text-anchor="middle" font-style="italic">Among the 63 primitive ones, exactly one of a, b is even and c is always odd.</text>
</svg>
