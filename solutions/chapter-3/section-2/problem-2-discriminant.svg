<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="560" fill="white"/>

  <text x="350" y="22" font-size="12.5" font-style="italic" fill="#444" text-anchor="middle">Opposite signs make −4ac strictly positive, and b² can only help.</text>

  <!-- the chain -->
  <rect x="24" y="38" width="652" height="126" fill="#eef2f8" stroke="#c3d3ea"/>
  <text x="40" y="58" font-size="11.5" fill="#1a3a63" font-weight="bold">The proof in three inequalities</text>
  <text x="60" y="82" font-size="12.5" fill="#222">a and c have different signs</text>
  <text x="330" y="82" font-size="12.5" fill="#222">⟹   ac &lt; 0</text>
  <text x="530" y="82" font-size="10" font-style="italic" fill="#777">definition of "different signs"</text>
  <text x="60" y="108" font-size="12.5" fill="#222">multiply by −4 (negative, so flip)</text>
  <text x="330" y="108" font-size="12.5" fill="#222">⟹   −4ac &gt; 0</text>
  <text x="60" y="134" font-size="12.5" fill="#222">and b is real</text>
  <text x="330" y="134" font-size="12.5" fill="#222">⟹   b² ≥ 0</text>
  <text x="530" y="134" font-size="10" font-style="italic" fill="#8a3b12">note ≥, not &gt; — b may be 0</text>
  <text x="350" y="157" font-size="12.5" fill="#1b5e20" text-anchor="middle" font-weight="bold">so  b² − 4ac  =  (≥ 0)  +  (&gt; 0)  &gt;  0</text>

  <rect x="140" y="176" width="420" height="38" fill="#1b5e20"/>
  <text x="350" y="201" font-size="13" fill="white" text-anchor="middle" font-weight="bold">discriminant positive ⟹ two real solutions ∎</text>

  <!-- geometric reading -->
  <text x="350" y="244" font-size="12.5" font-weight="bold" fill="#222" text-anchor="middle">Why it is obvious geometrically: c is the height of the curve at x = 0</text>

  <!-- left parabola: a>0, c<0 -->
  <text x="150" y="268" font-size="11.5" font-weight="bold" fill="#2a5db0" text-anchor="middle">a &gt; 0 (opens up),  c &lt; 0</text>
  <line x1="40" y1="340" x2="260" y2="340" stroke="#666" stroke-width="1"/>
  <line x1="150" y1="278" x2="150" y2="400" stroke="#666" stroke-width="1"/>
  <path d="M62,286 Q150,438 238,286" fill="none" stroke="#2a5db0" stroke-width="2.4"/>
  <circle cx="150" cy="382" r="4" fill="#8a3b12"/>
  <text x="160" y="386" font-size="10.5" fill="#8a3b12">f(0) = c &lt; 0</text>
  <circle cx="96" cy="340" r="4.5" fill="#1b5e20"/>
  <circle cx="204" cy="340" r="4.5" fill="#1b5e20"/>
  <text x="150" y="418" font-size="10.5" fill="#1b5e20" text-anchor="middle">dips below the axis → crosses twice</text>

  <!-- right parabola: a<0, c>0 -->
  <text x="530" y="268" font-size="11.5" font-weight="bold" fill="#2a5db0" text-anchor="middle">a &lt; 0 (opens down),  c &gt; 0</text>
  <line x1="420" y1="340" x2="640" y2="340" stroke="#666" stroke-width="1"/>
  <line x1="530" y1="278" x2="530" y2="400" stroke="#666" stroke-width="1"/>
  <path d="M442,394 Q530,242 618,394" fill="none" stroke="#2a5db0" stroke-width="2.4"/>
  <circle cx="530" cy="298" r="4" fill="#8a3b12"/>
  <text x="540" y="294" font-size="10.5" fill="#8a3b12">f(0) = c &gt; 0</text>
  <circle cx="476" cy="340" r="4.5" fill="#1b5e20"/>
  <circle cx="584" cy="340" r="4.5" fill="#1b5e20"/>
  <text x="530" y="418" font-size="10.5" fill="#1b5e20" text-anchor="middle">rises above the axis → crosses twice</text>

  <text x="350" y="444" font-size="11" fill="#222" text-anchor="middle">In both cases the curve sits on the <tspan font-style="italic">opposite</tspan> side of the axis from where its arms go, so it must cross on the way out — twice.</text>

  <!-- converse fails -->
  <rect x="24" y="462" width="652" height="82" fill="#fbe4da" stroke="#e0b8a6"/>
  <text x="350" y="482" font-size="12" font-weight="bold" fill="#8a3b12" text-anchor="middle">The converse is false — a positive discriminant does not require opposite signs</text>
  <text x="350" y="504" font-size="12" fill="#222" text-anchor="middle">a = 1, b = 5, c = 1:   discriminant = 25 − 4 = 21 &gt; 0,   yet ac = 1 &gt; 0</text>
  <text x="350" y="526" font-size="11" font-style="italic" fill="#666" text-anchor="middle">so "different signs" is a sufficient condition for two real roots, not a necessary one</text>
</svg>
