<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 852" width="720" height="852" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="852" fill="#ffffff"/>

  <rect x="18" y="14" width="684" height="72" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE DEFINITION</text>
  <text x="40" y="53" font-size="11.5" fill="#333">A 2n-digit number v is a <tspan font-style="italic">vampire number</tspan> if v = xy with x and y each n digits, and the digits of v are</text>
  <text x="40" y="70" font-size="11.5" fill="#333">exactly the digits of x together with those of y, rearranged. Pairs of fangs both ending in 0 are disallowed.</text>

  <rect x="18" y="96" width="684" height="200" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="116" font-size="11.5" fill="#9b2c2c" font-weight="bold">PART ONE: NO 2-DIGIT VAMPIRE NUMBERS</text>
  <text x="40" y="138" font-size="11.5" fill="#333">Here x and y are single digits, so v has digits x and y in one of the two orders. Since the product xy is</text>
  <text x="40" y="155" font-size="11.5" fill="#333">symmetric, the two orders differ only by renaming, and we may assume without loss of generality that</text>
  <text x="360" y="180" font-size="15" fill="#1f3a68" text-anchor="middle" font-weight="bold">10x + y = xy&#160;&#160;&#8658;&#160;&#160;10x = y(x &#8722; 1)&#160;&#160;&#8658;&#160;&#160;y = 10x / (x &#8722; 1)</text>
  <text x="40" y="204" font-size="11.5" fill="#333">Since gcd(x &#8722; 1, x) = 1, the factor x &#8722; 1 must divide 10, so x &#8722; 1 &#8712; {1, 2, 5, 10} and x &#8712; {2, 3, 6, 11}.</text>
  <text x="40" y="221" font-size="11.5" fill="#333">Only x &#8804; 9 is allowed, leaving three cases (and x = 1 separately, where 10 + y = y is absurd):</text>
  <g font-size="12.5">
    <text x="140" y="246" fill="#9b2c2c" text-anchor="middle">x = 2&#160; &#8594;&#160; y = 20</text>
    <text x="330" y="246" fill="#9b2c2c" text-anchor="middle">x = 3&#160; &#8594;&#160; y = 15</text>
    <text x="520" y="246" fill="#9b2c2c" text-anchor="middle">x = 6&#160; &#8594;&#160; y = 12</text>
  </g>
  <text x="360" y="270" font-size="12.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">None of these y is a single digit, so no 2-digit vampire number exists. &#9632;</text>
  <text x="360" y="288" font-size="10.5" fill="#555" text-anchor="middle" font-style="italic">Confirmed by checking all 81 products of two digits.</text>

  <text x="60" y="414" font-size="11.5" fill="#1f6b34" font-weight="bold">PART TWO: EXACTLY SEVEN 4-DIGIT VAMPIRE NUMBERS</text>
  <text x="660" y="414" font-size="10.5" fill="#555" text-anchor="end" font-style="italic">from all 4095 pairs 10 &#8804; x &#8804; y &#8804; 99</text>
  <rect x="60" y="433" width="600" height="26" rx="3" fill="#eef2fa" stroke="#9fb2d4"/><text x="130" y="452" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">v</text><text x="265" y="452" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">fangs x &#215; y</text><text x="420" y="452" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">digits of v</text><text x="580" y="452" font-size="11.5" fill="#1f3a68" text-anchor="middle" font-weight="bold">digits of x and y</text><rect x="60" y="459" width="600" height="26" rx="3" fill="#dff0e2" stroke="#8fb89c"/><text x="130" y="478" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">1260</text><text x="265" y="478" font-size="12" fill="#333" text-anchor="middle">21 &#215; 60</text><text x="420" y="478" font-size="12" fill="#1f6b34" text-anchor="middle">0 1 2 6</text><text x="580" y="478" font-size="12" fill="#1f6b34" text-anchor="middle">0 1 2 6</text><rect x="60" y="489" width="600" height="26" rx="3" fill="#dff0e2" stroke="#8fb89c"/><text x="130" y="508" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">1395</text><text x="265" y="508" font-size="12" fill="#333" text-anchor="middle">15 &#215; 93</text><text x="420" y="508" font-size="12" fill="#1f6b34" text-anchor="middle">1 3 5 9</text><text x="580" y="508" font-size="12" fill="#1f6b34" text-anchor="middle">1 3 5 9</text><rect x="60" y="519" width="600" height="26" rx="3" fill="#dff0e2" stroke="#8fb89c"/><text x="130" y="538" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">1435</text><text x="265" y="538" font-size="12" fill="#333" text-anchor="middle">35 &#215; 41</text><text x="420" y="538" font-size="12" fill="#1f6b34" text-anchor="middle">1 3 4 5</text><text x="580" y="538" font-size="12" fill="#1f6b34" text-anchor="middle">1 3 4 5</text><rect x="60" y="549" width="600" height="26" rx="3" fill="#dff0e2" stroke="#8fb89c"/><text x="130" y="568" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">1530</text><text x="265" y="568" font-size="12" fill="#333" text-anchor="middle">30 &#215; 51</text><text x="420" y="568" font-size="12" fill="#1f6b34" text-anchor="middle">0 1 3 5</text><text x="580" y="568" font-size="12" fill="#1f6b34" text-anchor="middle">0 1 3 5</text><rect x="60" y="579" width="600" height="26" rx="3" fill="#dff0e2" stroke="#8fb89c"/><text x="130" y="598" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">1827</text><text x="265" y="598" font-size="12" fill="#333" text-anchor="middle">21 &#215; 87</text><text x="420" y="598" font-size="12" fill="#1f6b34" text-anchor="middle">1 2 7 8</text><text x="580" y="598" font-size="12" fill="#1f6b34" text-anchor="middle">1 2 7 8</text><rect x="60" y="609" width="600" height="26" rx="3" fill="#dff0e2" stroke="#8fb89c"/><text x="130" y="628" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">2187</text><text x="265" y="628" font-size="12" fill="#333" text-anchor="middle">27 &#215; 81</text><text x="420" y="628" font-size="12" fill="#1f6b34" text-anchor="middle">1 2 7 8</text><text x="580" y="628" font-size="12" fill="#1f6b34" text-anchor="middle">1 2 7 8</text><rect x="60" y="639" width="600" height="26" rx="3" fill="#dff0e2" stroke="#8fb89c"/><text x="130" y="658" font-size="12" fill="#1f3a68" text-anchor="middle" font-weight="bold">6880</text><text x="265" y="658" font-size="12" fill="#333" text-anchor="middle">80 &#215; 86</text><text x="420" y="658" font-size="12" fill="#1f6b34" text-anchor="middle">0 6 8 8</text><text x="580" y="658" font-size="12" fill="#1f6b34" text-anchor="middle">0 6 8 8</text>

  <rect x="18" y="710" width="684" height="124" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="730" font-size="11.5" fill="#b06a10" font-weight="bold">THREE THINGS WORTH NOTICING</text>
  <text x="40" y="752" font-size="11.5" fill="#333">1.&#160; The trailing-zero rule changes nothing here. Fangs 10a and 10b give 100ab, whose digits are those of ab</text>
  <text x="40" y="768" font-size="11.5" fill="#333">&#160;&#160;&#160;&#160;&#160;plus two zeros, so it would need ab to be a 2-digit vampire &#8212; and Part One says there are none.</text>
  <text x="40" y="790" font-size="11.5" fill="#333">2.&#160; A single trailing zero is fine: 1260 = 21 &#215; 60 and 1530 = 30 &#215; 51 both use one.</text>
  <text x="40" y="812" font-size="11.5" fill="#333">3.&#160; Each of the seven has exactly one fang pair. Ambiguity starts later: 125460 = 204 &#215; 615 = 246 &#215; 510.</text>
</svg>