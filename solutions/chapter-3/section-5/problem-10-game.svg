<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" width="720" height="860" font-family="Georgia, serif">
  <rect x="0" y="0" width="720" height="860" fill="#ffffff"/>
  <rect x="18" y="14" width="684" height="102" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE GAME, AND THE KEY REDUCTION</text>
  <text x="40" y="53" font-size="11.5" fill="#333">One fills five cells with 1s and Zero fills four with 0s. Over GF(2) the determinant is 0 exactly when the</text>
  <text x="40" y="70" font-size="11.5" fill="#333">three rows are linearly dependent &#8212; a zero row, two equal rows, or three rows summing to zero.</text>
  <text x="40" y="92" font-size="11.5" fill="#333">Row swaps, column swaps and transposing all preserve the determinant mod 2 (a sign change is invisible</text>
  <text x="40" y="109" font-size="11.5" fill="#333">mod 2), giving a symmetry group of 6 &#215; 6 &#215; 2 = 72 &#8212; verified on all 512 binary 3 &#215; 3 matrices.</text>
  <text x="46" y="150" font-size="11.5" fill="#3b5b9b" font-weight="bold">PLY 1 &#8212; One opens</text><rect x="60" y="162" width="26" height="26" fill="#fde3e3" stroke="#9b2c2c" stroke-width="2.4"/><text x="73.0" y="180.0" font-size="14" fill="#9b2c2c" text-anchor="middle" font-weight="bold">1</text><rect x="86" y="162" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="112" y="162" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="60" y="188" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="86" y="188" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="112" y="188" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="60" y="214" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="86" y="214" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="112" y="214" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><text x="160" y="180" font-size="11.5" fill="#333">All nine cells are equivalent under row and column swaps,</text><text x="160" y="198" font-size="11.5" fill="#333">so we may take the opening move to be the top-left cell.</text><text x="160" y="218" font-size="10.5" fill="#555" font-style="italic">One orbit &#8212; a single case to consider.</text><text x="46" y="268" font-size="11.5" fill="#3b5b9b" font-weight="bold">PLY 2 &#8212; Zero replies: eight cells, two orbits, and only one of them wins</text><rect x="60" y="282" width="26" height="26" fill="#fde3e3" stroke="#999" stroke-width="0.9"/><text x="73.0" y="300.0" font-size="14" fill="#9b2c2c" text-anchor="middle" font-weight="bold">1</text><rect x="86" y="282" width="26" height="26" fill="#dff0e2" stroke="#9b2c2c" stroke-width="2.4"/><text x="99.0" y="300.0" font-size="14" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><rect x="112" y="282" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="60" y="308" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="86" y="308" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="112" y="308" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="60" y="334" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="86" y="334" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="112" y="334" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><text x="146" y="302" font-size="11" fill="#9b2c2c" font-weight="bold">shares One&#8217;s row or column</text><text x="146" y="320" font-size="11" fill="#9b2c2c">all four such replies LOSE</text><rect x="400" y="282" width="26" height="26" fill="#fde3e3" stroke="#999" stroke-width="0.9"/><text x="413.0" y="300.0" font-size="14" fill="#9b2c2c" text-anchor="middle" font-weight="bold">1</text><rect x="426" y="282" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="452" y="282" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="400" y="308" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="426" y="308" width="26" height="26" fill="#dff0e2" stroke="#1f6b34" stroke-width="2.4"/><text x="439.0" y="326.0" font-size="14" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><rect x="452" y="308" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="400" y="334" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="426" y="334" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="452" y="334" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><text x="486" y="302" font-size="11" fill="#1f6b34" font-weight="bold">shares neither</text><text x="486" y="320" font-size="11" fill="#1f6b34">all four such replies WIN</text><text x="46" y="374" font-size="11.5" fill="#333">The four winning cells are equivalent to one another, so take Zero&#8217;s reply to be the centre.</text><text x="46" y="410" font-size="11.5" fill="#3b5b9b" font-weight="bold">PLY 3 &#8212; One&#8217;s seven moves fall into four orbits; Zero has an answer to each</text><text x="85" y="430" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">One plays b or d</text><rect x="46" y="438" width="26" height="26" fill="#fde3e3" stroke="#999" stroke-width="0.9"/><text x="59.0" y="456.0" font-size="14" fill="#9b2c2c" text-anchor="middle" font-weight="bold">1</text><rect x="72" y="438" width="26" height="26" fill="#fde3e3" stroke="#999" stroke-width="0.9"/><text x="85.0" y="456.0" font-size="14" fill="#9b2c2c" text-anchor="middle" font-weight="bold">1</text><rect x="98" y="438" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="46" y="464" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="72" y="464" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="98" y="464" width="26" height="26" fill="#dff0e2" stroke="#999" stroke-width="0.9"/><text x="111.0" y="482.0" font-size="14" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><rect x="46" y="490" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="72" y="490" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="98" y="490" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><text x="85" y="530" font-size="10.5" fill="#1f6b34" text-anchor="middle">Zero answers</text><text x="85" y="545" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">f or h</text><text x="253" y="430" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">One plays c or g</text><rect x="214" y="438" width="26" height="26" fill="#fde3e3" stroke="#999" stroke-width="0.9"/><text x="227.0" y="456.0" font-size="14" fill="#9b2c2c" text-anchor="middle" font-weight="bold">1</text><rect x="240" y="438" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="266" y="438" width="26" height="26" fill="#fde3e3" stroke="#999" stroke-width="0.9"/><text x="279.0" y="456.0" font-size="14" fill="#9b2c2c" text-anchor="middle" font-weight="bold">1</text><rect x="214" y="464" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="240" y="464" width="26" height="26" fill="#dff0e2" stroke="#999" stroke-width="0.9"/><text x="253.0" y="482.0" font-size="14" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><rect x="266" y="464" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="214" y="490" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="240" y="490" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="266" y="490" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><text x="253" y="530" font-size="10.5" fill="#1f6b34" text-anchor="middle">Zero answers</text><text x="253" y="545" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">d, f or h</text><text x="421" y="430" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">One plays f or h</text><rect x="382" y="438" width="26" height="26" fill="#fde3e3" stroke="#999" stroke-width="0.9"/><text x="395.0" y="456.0" font-size="14" fill="#9b2c2c" text-anchor="middle" font-weight="bold">1</text><rect x="408" y="438" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="434" y="438" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="382" y="464" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="408" y="464" width="26" height="26" fill="#dff0e2" stroke="#999" stroke-width="0.9"/><text x="421.0" y="482.0" font-size="14" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><rect x="434" y="464" width="26" height="26" fill="#fde3e3" stroke="#999" stroke-width="0.9"/><text x="447.0" y="482.0" font-size="14" fill="#9b2c2c" text-anchor="middle" font-weight="bold">1</text><rect x="382" y="490" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="408" y="490" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="434" y="490" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><text x="421" y="530" font-size="10.5" fill="#1f6b34" text-anchor="middle">Zero answers</text><text x="421" y="545" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">h</text><text x="589" y="430" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">One plays i</text><rect x="550" y="438" width="26" height="26" fill="#fde3e3" stroke="#999" stroke-width="0.9"/><text x="563.0" y="456.0" font-size="14" fill="#9b2c2c" text-anchor="middle" font-weight="bold">1</text><rect x="576" y="438" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="602" y="438" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="550" y="464" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="576" y="464" width="26" height="26" fill="#dff0e2" stroke="#999" stroke-width="0.9"/><text x="589.0" y="482.0" font-size="14" fill="#1f6b34" text-anchor="middle" font-weight="bold">0</text><rect x="602" y="464" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="550" y="490" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="576" y="490" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="0.9"/><rect x="602" y="490" width="26" height="26" fill="#fde3e3" stroke="#999" stroke-width="0.9"/><text x="615.0" y="508.0" font-size="14" fill="#9b2c2c" text-anchor="middle" font-weight="bold">1</text><text x="589" y="530" font-size="10.5" fill="#1f6b34" text-anchor="middle">Zero answers</text><text x="589" y="545" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">b, d, f or h</text>
  <rect x="18" y="582" width="684" height="130" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="602" font-size="11.5" fill="#1f6b34" font-weight="bold">THE FULL EXHAUSTION</text>
  <text x="40" y="624" font-size="11.5" fill="#333">Continuing the same way to the end of the game and solving by backward induction:</text>
  <text x="360" y="650" font-size="14" fill="#1f3a68" text-anchor="middle" font-weight="bold">Player Zero wins from the opening position.</text>
  <text x="40" y="674" font-size="11.5" fill="#333">Up to the 72 symmetries there are only 122 positions in the whole game tree &#8212; 1, 1, 2, 6, 16, 24, 30, 24,</text>
  <text x="40" y="691" font-size="11.5" fill="#333">13 and 5 at plies 0 through 9 &#8212; so the exhaustion is small enough to carry out by hand.</text>
  <rect x="18" y="726" width="684" height="118" rx="6" fill="#fff8ec" stroke="#b06a10" stroke-width="1.3"/>
  <text x="34" y="746" font-size="11.5" fill="#b06a10" font-weight="bold">HOW ZERO&#8217;S WINS ACTUALLY FINISH</text>
  <text x="40" y="768" font-size="11.5" fill="#333">Following one fixed optimal policy for Zero against every possible play by One gives 945 final boards.</text>
  <text x="40" y="786" font-size="11.5" fill="#333">Every one has determinant 0, and in every one the dependency is visible to the eye:</text>
  <text x="40" y="810" font-size="11.5" fill="#333">474 end with a row of zeros and two equal columns;&#160; 255 with a column of zeros and two equal rows;</text>
  <text x="40" y="827" font-size="11.5" fill="#333">216 with two equal rows and two equal columns. Zero never needs the subtler kinds of dependency.</text>
</svg>