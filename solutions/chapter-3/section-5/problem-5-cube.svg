<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 910" width="720" height="910" font-family="Georgia, serif">
  <rect x="0" y="0.0" width="720" height="894" fill="#ffffff"/>

  <rect x="18" y="14.0" width="684" height="66" rx="6" fill="#eef2fa" stroke="#3b5b9b" stroke-width="1.3"/>
  <text x="34" y="33.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">THE GRAPH AND THE ANSWER</text>
  <text x="470" y="34.0" font-size="15" fill="#1f3a68" text-anchor="middle" font-weight="bold">&#960;(Q&#8323;) = 8</text>
  <text x="40" y="56.0" font-size="11.5" fill="#333">Q&#8323; is the cube graph: 8 corners, 12 edges, every corner joined to the three that differ in one coordinate.</text>
  <text x="40" y="73.0" font-size="10.5" fill="#555" font-style="italic">It is 3-regular, bipartite, and has diameter 3 &#8212; opposite corners are three steps apart.</text>

  <text x="34" y="108.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">DRAWN BY DISTANCE FROM A TARGET</text>
  <text x="34" y="126.0" font-size="11" fill="#555">Fixing one corner as the target splits the other seven into shells of size 3, 3, 1.</text>

  <text x="180" y="164.0" font-size="10.5" fill="#9b2c2c" text-anchor="middle" font-weight="bold">the antipode</text>
  <text x="180" y="180.0" font-size="10" fill="#666" text-anchor="middle">distance 3 &#8212; 1 corner</text>
  <text x="298" y="180.0" font-size="10" fill="#666" text-anchor="middle">distance 2 &#8212; 3</text>
  <text x="416" y="180.0" font-size="10" fill="#666" text-anchor="middle">distance 1 &#8212; 3</text>
  <text x="534" y="164.0" font-size="10.5" fill="#b06a10" text-anchor="middle" font-weight="bold">the target</text>
  <text x="534" y="180.0" font-size="10" fill="#666" text-anchor="middle">distance 0 &#8212; 1 corner</text>
  <line x1="180" y1="250.0" x2="298" y2="194.0" stroke="#ccc" stroke-width="1.1"/><line x1="180" y1="250.0" x2="298" y2="250.0" stroke="#ccc" stroke-width="1.1"/><line x1="180" y1="250.0" x2="298" y2="306.0" stroke="#ccc" stroke-width="1.1"/><line x1="298" y1="194.0" x2="416" y2="194.0" stroke="#ccc" stroke-width="1.1"/><line x1="298" y1="194.0" x2="416" y2="250.0" stroke="#ccc" stroke-width="1.1"/><line x1="298" y1="250.0" x2="416" y2="194.0" stroke="#ccc" stroke-width="1.1"/><line x1="298" y1="250.0" x2="416" y2="306.0" stroke="#ccc" stroke-width="1.1"/><line x1="416" y1="194.0" x2="534" y2="250.0" stroke="#ccc" stroke-width="1.1"/><line x1="298" y1="306.0" x2="416" y2="250.0" stroke="#ccc" stroke-width="1.1"/><line x1="298" y1="306.0" x2="416" y2="306.0" stroke="#ccc" stroke-width="1.1"/><line x1="416" y1="250.0" x2="534" y2="250.0" stroke="#ccc" stroke-width="1.1"/><line x1="416" y1="306.0" x2="534" y2="250.0" stroke="#ccc" stroke-width="1.1"/><circle cx="180" cy="250.0" r="16" fill="#ffffff" stroke="#666" stroke-width="1.2"/><circle cx="298" cy="194.0" r="16" fill="#ffffff" stroke="#666" stroke-width="1.2"/><circle cx="298" cy="250.0" r="16" fill="#ffffff" stroke="#666" stroke-width="1.2"/><circle cx="416" cy="194.0" r="16" fill="#ffffff" stroke="#666" stroke-width="1.2"/><circle cx="298" cy="306.0" r="16" fill="#ffffff" stroke="#666" stroke-width="1.2"/><circle cx="416" cy="250.0" r="16" fill="#ffffff" stroke="#666" stroke-width="1.2"/><circle cx="416" cy="306.0" r="16" fill="#ffffff" stroke="#666" stroke-width="1.2"/><circle cx="534" cy="250.0" r="16" fill="#fff3d6" stroke="#b06a10" stroke-width="2.4"/><text x="534" y="279.0" font-size="9" fill="#b06a10" text-anchor="middle" font-weight="bold">target</text>

  <rect x="18" y="404.0" width="684" height="222" rx="6" fill="#fdf3f3" stroke="#9b2c2c" stroke-width="1.3"/>
  <text x="34" y="424.0" font-size="11.5" fill="#9b2c2c" font-weight="bold">SEVEN PEBBLES FAIL &#8212; and in exactly two ways</text>
  <text x="183" y="440" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">(a) all seven on the antipode</text>
  <text x="507" y="440" font-size="11" fill="#9b2c2c" text-anchor="middle" font-weight="bold">(b) one pebble on each other corner</text>
  <line x1="360" y1="438.0" x2="360" y2="596.0" stroke="#e6c4c4"/>
  <line x1="96" y1="502.0" x2="154" y2="464.0" stroke="#ccc" stroke-width="1.1"/><line x1="96" y1="502.0" x2="154" y2="502.0" stroke="#ccc" stroke-width="1.1"/><line x1="96" y1="502.0" x2="154" y2="540.0" stroke="#ccc" stroke-width="1.1"/><line x1="154" y1="464.0" x2="212" y2="464.0" stroke="#ccc" stroke-width="1.1"/><line x1="154" y1="464.0" x2="212" y2="502.0" stroke="#ccc" stroke-width="1.1"/><line x1="154" y1="502.0" x2="212" y2="464.0" stroke="#ccc" stroke-width="1.1"/><line x1="154" y1="502.0" x2="212" y2="540.0" stroke="#ccc" stroke-width="1.1"/><line x1="212" y1="464.0" x2="270" y2="502.0" stroke="#ccc" stroke-width="1.1"/><line x1="154" y1="540.0" x2="212" y2="502.0" stroke="#ccc" stroke-width="1.1"/><line x1="154" y1="540.0" x2="212" y2="540.0" stroke="#ccc" stroke-width="1.1"/><line x1="212" y1="502.0" x2="270" y2="502.0" stroke="#ccc" stroke-width="1.1"/><line x1="212" y1="540.0" x2="270" y2="502.0" stroke="#ccc" stroke-width="1.1"/><circle cx="96" cy="502.0" r="12" fill="#ffffff" stroke="#666" stroke-width="1.2"/><text x="96" y="507.0" font-size="11" fill="#1f6b34" text-anchor="middle" font-weight="bold">7</text><circle cx="154" cy="464.0" r="12" fill="#ffffff" stroke="#666" stroke-width="1.2"/><text x="154" y="469.0" font-size="11" fill="#bbb" text-anchor="middle" font-weight="bold">0</text><circle cx="154" cy="502.0" r="12" fill="#ffffff" stroke="#666" stroke-width="1.2"/><text x="154" y="507.0" font-size="11" fill="#bbb" text-anchor="middle" font-weight="bold">0</text><circle cx="212" cy="464.0" r="12" fill="#ffffff" stroke="#666" stroke-width="1.2"/><text x="212" y="469.0" font-size="11" fill="#bbb" text-anchor="middle" font-weight="bold">0</text><circle cx="154" cy="540.0" r="12" fill="#ffffff" stroke="#666" stroke-width="1.2"/><text x="154" y="545.0" font-size="11" fill="#bbb" text-anchor="middle" font-weight="bold">0</text><circle cx="212" cy="502.0" r="12" fill="#ffffff" stroke="#666" stroke-width="1.2"/><text x="212" y="507.0" font-size="11" fill="#bbb" text-anchor="middle" font-weight="bold">0</text><circle cx="212" cy="540.0" r="12" fill="#ffffff" stroke="#666" stroke-width="1.2"/><text x="212" y="545.0" font-size="11" fill="#bbb" text-anchor="middle" font-weight="bold">0</text><circle cx="270" cy="502.0" r="12" fill="#fff3d6" stroke="#b06a10" stroke-width="2.4"/><text x="270" y="507.0" font-size="11" fill="#bbb" text-anchor="middle" font-weight="bold">0</text><text x="270" y="527.0" font-size="9" fill="#b06a10" text-anchor="middle" font-weight="bold">target</text>
  <line x1="420" y1="502.0" x2="478" y2="464.0" stroke="#ccc" stroke-width="1.1"/><line x1="420" y1="502.0" x2="478" y2="502.0" stroke="#ccc" stroke-width="1.1"/><line x1="420" y1="502.0" x2="478" y2="540.0" stroke="#ccc" stroke-width="1.1"/><line x1="478" y1="464.0" x2="536" y2="464.0" stroke="#ccc" stroke-width="1.1"/><line x1="478" y1="464.0" x2="536" y2="502.0" stroke="#ccc" stroke-width="1.1"/><line x1="478" y1="502.0" x2="536" y2="464.0" stroke="#ccc" stroke-width="1.1"/><line x1="478" y1="502.0" x2="536" y2="540.0" stroke="#ccc" stroke-width="1.1"/><line x1="536" y1="464.0" x2="594" y2="502.0" stroke="#ccc" stroke-width="1.1"/><line x1="478" y1="540.0" x2="536" y2="502.0" stroke="#ccc" stroke-width="1.1"/><line x1="478" y1="540.0" x2="536" y2="540.0" stroke="#ccc" stroke-width="1.1"/><line x1="536" y1="502.0" x2="594" y2="502.0" stroke="#ccc" stroke-width="1.1"/><line x1="536" y1="540.0" x2="594" y2="502.0" stroke="#ccc" stroke-width="1.1"/><circle cx="420" cy="502.0" r="12" fill="#ffffff" stroke="#666" stroke-width="1.2"/><text x="420" y="507.0" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><circle cx="478" cy="464.0" r="12" fill="#ffffff" stroke="#666" stroke-width="1.2"/><text x="478" y="469.0" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><circle cx="478" cy="502.0" r="12" fill="#ffffff" stroke="#666" stroke-width="1.2"/><text x="478" y="507.0" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><circle cx="536" cy="464.0" r="12" fill="#ffffff" stroke="#666" stroke-width="1.2"/><text x="536" y="469.0" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><circle cx="478" cy="540.0" r="12" fill="#ffffff" stroke="#666" stroke-width="1.2"/><text x="478" y="545.0" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><circle cx="536" cy="502.0" r="12" fill="#ffffff" stroke="#666" stroke-width="1.2"/><text x="536" y="507.0" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><circle cx="536" cy="540.0" r="12" fill="#ffffff" stroke="#666" stroke-width="1.2"/><text x="536" y="545.0" font-size="11" fill="#3b5b9b" text-anchor="middle" font-weight="bold">1</text><circle cx="594" cy="502.0" r="12" fill="#fff3d6" stroke="#b06a10" stroke-width="2.4"/><text x="594" y="507.0" font-size="11" fill="#bbb" text-anchor="middle" font-weight="bold">0</text><text x="594" y="527.0" font-size="9" fill="#b06a10" text-anchor="middle" font-weight="bold">target</text>
  <text x="183" y="572.0" font-size="10.5" fill="#333" text-anchor="middle">7 &#8594; 3 &#8594; 1 &#8594; 0:&#160; halving three times</text>
  <text x="183" y="588.0" font-size="10.5" fill="#333" text-anchor="middle">loses everything. One pebble short.</text>
  <text x="507" y="572.0" font-size="10.5" fill="#333" text-anchor="middle">No corner holds two, so no move is</text>
  <text x="507" y="588.0" font-size="10.5" fill="#333" text-anchor="middle">legal at all. Nothing can happen.</text>

  <rect x="18" y="630.0" width="684" height="118" rx="6" fill="#f1f8f2" stroke="#1f6b34" stroke-width="1.3"/>
  <text x="34" y="650.0" font-size="11.5" fill="#1f6b34" font-weight="bold">TWO INDEPENDENT LOWER BOUNDS, BOTH LANDING ON 8</text>
  <text x="40" y="672.0" font-size="11.5" fill="#333">Obstruction (b) is the general bound &#960;(G) &#8805; n: spreading one pebble per non-target node freezes any graph.</text>
  <text x="40" y="690.0" font-size="11.5" fill="#333">Obstruction (a) is the general bound &#960;(G) &#8805; 2^diam(G): crossing d edges costs 2&#7496; pebbles.</text>
  <text x="40" y="716.0" font-size="12.5" fill="#1f6b34" font-weight="bold">Here n = 8 and 2&#7496;&#8305;&#7491;&#7504; = 2&#179; = 8 &#8212; the two bounds coincide, and 8 is achieved.</text>
  <text x="40" y="738.0" font-size="10.5" fill="#555" font-style="italic">Exhaustive search confirms these are the only two failing shapes among all placements of 7 pebbles.</text>

  <rect x="18" y="762.0" width="684" height="116" rx="6" fill="#fafbfd" stroke="#3b5b9b" stroke-width="1.2"/>
  <text x="34" y="782.0" font-size="11.5" fill="#3b5b9b" font-weight="bold">EIGHT ALWAYS SUFFICE</text>
  <text x="40" y="804.0" font-size="11.5" fill="#333">All 6435 placements of 8 pebbles were checked against all 8 targets: every one reaches the target.</text>
  <text x="40" y="822.0" font-size="11.5" fill="#333">More pebbles never hurt, so this settles &#960;(Q&#8323;) &#8804; 8 for every larger count too.</text>
  <text x="40" y="848.0" font-size="11.5" fill="#333">The general theorem is Chung&#8217;s: &#960;(Q&#7496;) = 2&#7496; for every dimension d. So hypercubes, like complete graphs,</text>
  <text x="40" y="866.0" font-size="11.5" fill="#333">are Class 0 &#8212; their pebbling number equals their number of vertices.</text>
</svg>